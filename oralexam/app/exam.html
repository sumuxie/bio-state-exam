<!--
  地图页 —— 2026-09-23 Ruojin 提的，我连着做砸两次才做对。

  她最早的话：「我还在想再写一个很大的全部穿起来的内容，你不用加新东西，
  而是把他们都地图化，就是比如一个细胞，xx 发生了什么，
  然后这里就是一张小卡，或者追问内容，这样，要写很全面」

  ⚠ 我做砸的两版，记在这里免得再犯：
  ① 第一版：往 x_mem 里塞了一张「指针表」（线粒体基质 | 23 追问 · 24 速背 01 · …）。
     她：「太糟糕透顶了 根本没办法用」。对 —— 那一行没有任何内容。
  ② 第二版：改成手写六行「那里发生什么」。她：「nonono 完全错误」。
     也对 —— 她要的从来不是**一张表**。

  ③ 她第三次说清楚了：「我让你做那种**折叠问题卡**，然后我可以**直接点展开**，
     然后就能**看到你写的这些所有**」。
     —— 要的是 app 里一个**能点开的东西**，展开直接给**内容本身**，
     不是跳转、不是指针、不是摘要。**卡里塞表这条路从一开始就是错的。**

  所以这一页：
  · 一级是房间（或主题），点开是那个房间里的每一格；
  · 二级是每一格，点开是**那一格的完整正文**（速背的 big ＋ en，追问的 en ＋ ez ＋ 中文）；
  · 每一段都能点着念（跟主 app 一样）。
  房间的判据沿用 tools/cellmap.py 的那一套（正文里点了这个区室的名字），
  会漏也会多 —— 所以排序把「标题/口令里就点了名的」排在前面。
-->

<script>
var CARDS = window.CARDS || [];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function strip(h){ return String(h==null?'':h).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }

/* ---- 朗读：点哪一段念哪一段 ---- */
var VOICE=null;
function pickVoice(){
  if(!window.speechSynthesis) return null;
  var vs=(speechSynthesis.getVoices()||[]).filter(function(v){ return /^en/i.test(v.lang); });
  vs.sort(function(a,b){
    function sc(v){ var s=0; if(/natural|neural|online|premium|enhanced/i.test(v.name)) s+=100;
      if(/^en[-_]GB/i.test(v.lang)) s+=20; else if(/^en/i.test(v.lang)) s+=6; return s; }
    return sc(b)-sc(a);
  });
  return vs[0]||null;
}
if(window.speechSynthesis){ VOICE=pickVoice(); speechSynthesis.onvoiceschanged=function(){ VOICE=pickVoice(); }; }
function sayEl(el){
  if(!el||!window.speechSynthesis) return;
  var t=(el.textContent||'').trim(); if(!t) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  var u=new SpeechSynthesisUtterance(t);
  if(VOICE){ u.voice=VOICE; u.lang=VOICE.lang; } else u.lang='en-GB';
  u.rate=0.95; speechSynthesis.speak(u);
}

/* ---- 房间的判据，跟 tools/cellmap.py 同一套 ---- */
/* ⚠ 考官的「第二层问题」句式。2026-09-23。
   ⚠ **这些不是原题。** 网上流传的那份委员会分析里引了一些答辩记录原话，
   我查不到出处，所以**一句都没有照抄**。下面是从他们**公开的研究方向**推出来的
   「他答完之后习惯往哪边再推一下」—— **练的是第二层问题的形状，不是猜题**。 */

 ['Lipovová',   'Would that still work outside a test tube?',                 '这个拿到试管外面还成立吗？'],
 ['Lipovová',   'What are the kinetic limits of that?',                       '它的动力学极限在哪？'],
 ['Martínková', 'Say that again so someone outside the field understands it.', '再说一遍，让不在这个领域的人也听得懂。'],
 ['Martínková', 'What does that mean for the cell, not for the molecule?',     '这件事对细胞意味着什么，不是对分子。'],
 ['Martínek',   'Does that actually answer the question you started with?',    '这个答案回答了你一开始提的那个问题吗？'],
 ['Ryšlavá',    'How do you explain that?',                                    '你怎么解释这个现象？'],

 ['Šulc',       'Is that enough evidence to conclude it?',                     '这些证据够得出这个结论吗？'],
 ['Šulc',       'How would you check that experimentally?',                    '这一点你打算怎么用实验验证？'],

function probeFor(who){ return EXPROBE.filter(function(p){ return p[0] === who; }); }

  [['质谱 · 肽段', /mass spectrometr|tandem mass|\bM S\/M S\b|tryptic|peptide mapping|proteomic/i],

/* 追问组标题里带这个标记的，就是专门为某位考官补的。 */
function markedFor(gtitle){
  var m2 = /考官 · ([A-Za-zÁ-Žá-ž]+)/.exec(strip(gtitle||''));
  return m2 ? m2[1] : '';
}

var BOXES = [];   /* {card, cardTitle, where, title, big, en, ez, ezcn, cn, warn, who, star} */
CARDS.forEach(function(c){
  var ct = strip(c.qcn || c.q || c.id);
  function push(o, probe, star, who){
    var hit = [];
    EXAMINERS.forEach(function(E){
      E[4].forEach(function(p){ if(p[1].test(probe)) hit.push(E[0] + '|' + p[0]); });
    });
    if(star && who) hit.unshift(who + '|⭐ 专门为他补的');
    if(!hit.length) return;
    o.who = hit; o.star = !!star;
    BOXES.push(o);
  }
  (c.cram||[]).forEach(function(p){
    if(!p || !p.n) return;
    push({card:c.id, cardTitle:ct, where:'速背 '+p.n, title:strip(p.t||''), big:p.big||'',
          en:p.en||'', ez:p.ez||'', ezcn:p.ezcn||'', cn:p.note||'', warn:p.warn||''},
         strip((p.en||'') + ' ' + (p.big||'') + ' ' + (p.t||'')), false, '');
  });
  (c.ask||[]).forEach(function(g){
    var who = markedFor(g.g);
    (g.items||[]).forEach(function(x){
      if(!x || !x.en) return;
      push({card:c.id, cardTitle:ct, where:'追问', title:strip(x.q||''), big:'',
            en:x.en, ez:x.ez||'', ezcn:x.ezcn||'', cn:x.cn||'', warn:x.warn||''},
           strip((x.q||'') + ' ' + x.en), !!who, who);
    });
  });
});

var FILTER = '';
function boxHTML(b){
  return '<details class="box"><summary>'
    + (b.star ? '<span class="where q">⭐ 补的</span>' : '')
    + '<span class="where' + (b.where==='追问'?' q':'') + '">' + esc(b.card) + ' · ' + esc(b.where) + '</span>'
    + esc(b.title || '（无标题）') + '</summary><div class="body">'
    + (b.big ? '<p class="big">' + b.big + '</p>' : '')
    + (b.ez ? '<p class="lbl">先背这句</p><p class="ez" onclick="sayEl(this)">' + b.ez + '</p>' : '')
    + (b.ezcn ? '<p class="cn">' + b.ezcn + '</p>' : '')
    + (b.en ? '<p class="lbl">' + (b.ez?'完整版':'出声说的') + '</p><p class="en" onclick="sayEl(this)">' + b.en + '</p>' : '')
    + (b.warn ? '<div class="warnb">' + b.warn + '</div>' : '')
    + (b.cn ? '<p class="cn">' + b.cn + '</p>' : '')
    + '<p class="small">点上面任意一段英文就念那一段 · 这一格在卡 <b>' + esc(b.card) + '</b>（'
      + esc(b.cardTitle).slice(0,40) + '）</p>'
    + '</div></details>';
}
function render(){
  var q = FILTER.trim().toLowerCase();
  var h = '<input type="search" id="q" placeholder="在全部内容里找一个词…" value="' + esc(FILTER) + '">';
  EXAMINERS.forEach(function(E){
    var key = E[0];
    var mine = BOXES.filter(function(b){
      if(!b.who.some(function(w){ return w.split('|')[0] === key; })) return false;
      if(!q) return true;
      return (b.title + ' ' + strip(b.en) + ' ' + strip(b.ezcn) + ' ' + b.card).toLowerCase().indexOf(q) !== -1;
    });
    var groups = [['⭐ 专门为他补的', []]];
    E[4].forEach(function(p){ groups.push([p[0], []]); });
    mine.forEach(function(b){
      b.who.forEach(function(w){
        var parts = w.split('|');
        if(parts[0] !== key) return;
        for(var i=0;i<groups.length;i++) if(groups[i][0] === parts[1]) groups[i][1].push(b);
      });
    });
    var tot = mine.length;
    h += '<details class="room"' + (q?' open':'') + '><summary><span>' + esc(E[1]) + '</span>'
       + '<span class="n">' + tot + ' 格</span></summary><div class="roombody">'
       + '<p class="roomnote"><b>' + esc(E[2]) + '</b><br>' + E[3]
       + (function(){ var ps = probeFor(key); if(!ps.length) return '';
           return '<br><br><b>⚠ 他答完之后习惯往哪边再推一下</b>（<b>推测的提问风格，不是原题</b>）：'
             + ps.map(function(p){ return '<br>· <span class="ez" onclick="sayEl(this)">' + esc(p[1])
                 + '</span><br>&nbsp;&nbsp;<span class="cn">' + esc(p[2]) + '</span>'; }).join(''); })()
       + '</p>';
    groups.forEach(function(g){
      if(!g[1].length) return;
      h += '<details class="room"' + (q||g[0].indexOf('⭐')===0?' open':'') + '><summary><span>'
         + esc(g[0]) + '</span><span class="n">' + g[1].length + '</span></summary><div class="roombody">'
         + g[1].map(boxHTML).join('') + '</div></details>';
    });
    if(!tot) h += '<p class="small">这位的方向在卡上还没有任何内容。</p>';
    h += '</div></details>';
  });
  h += '<p class="small" style="margin-top:20px">'
     + '⚠ 「已有的」是<b>按关键词自动收进来的，会漏也会多</b>；<b>⭐ 是专门为这位考官补的追问</b>，'
     + '它们同样写在卡上，所以<b>演练台抽得到</b>。<br>'
     + '⚠ 七位的单位和方向 2026-09-23 核过；网上流传的「答辩原题」<b>查不到出处，别当事实用</b>。<br>'
     + '<a href="index.html">← 回主 app</a> · <a href="drill.html">🎙 口试演练</a> · <a href="map.html">🗺 地图</a></p>';
  $('main').innerHTML = h;
  var el = $('q');
  if(el){
    el.oninput = function(){ FILTER = el.value; render();
      var e2 = $('q'); if(e2){ e2.focus(); e2.setSelectionRange(e2.value.length, e2.value.length); } };
  }
}

if(!CARDS.length){
  $('main').innerHTML = '<p><b>卡的数据没装上。</b>这一页要跟 data/ 放在一起才能跑。</p>';
} else {
  render();
}
</script>
</body>
</html>
