<title>口试演练</title>
<!--
  口试演练台 —— 2026-09-22 Ruojin 提的。

  她的原话：「可以另外做一个出来，不一定和现在的 app 相关。用目前的 app 的卡片，
  模仿老师们的考试，五个卡片为一个 set，然后就是随机的 set，每个卡片里也随机抽问题
  出来。关键在于是互动式，问题会念出来，然后给我两分钟，这两分钟会转录我的语音，
  然后根据我的语音再提问，每个问题可以提 5 个追问。每天都必须练。最后肯定会显示出
  答案，但是我觉得应该在最最后，全部卡片结束之后再显示。」
  后面又补：「练过的可以循环反复出现，但是每次都需要有新问题。最好是一天能够把所有
  卡片都过一遍。」

  ⚠ 为什么这一个值得破例做（规矩三）。这个仓库里所有别的产出都是**材料**，
  而她自己说过「我在用整理学习材料来逃避真正的学习」。
  **这是唯一一个把材料逼成开口的东西**，挡住她的不是「找不到 X」，是「张不开嘴」。

  三件不用花力气的事：
  · 朗读 —— 浏览器自带 speechSynthesis。
  · 转录 —— 浏览器自带 SpeechRecognition，不要 key、不要后端。
  · 追问 —— **1212 条已经写好了，不需要生成**。按「她刚才没说到哪些词」来挑，
    比现编的准，而且这正是这个项目一直在用的那把尺子（「哪几张漏超过 2 条」）。

  三件真正的风险，都写在页面上告诉她了：
  ① 只有 Chrome / Edge 桌面版靠谱，Safari 和 iOS 多半不行。
  ② 专业词会被听错（oxaloacetate 这类），所以漏词表是**线索不是判决**，
     匹配只比前 5 个字母，而且原始转录一定显示出来给她自己看。
  ③ Chrome 的识别把音频送到 Google 的服务器 —— 说一次，让她知道。

  这一页不依赖 index.html 的任何代码，只共用 data/*.js（它们往 window.CARDS 上 push）。
-->
<style>
:root{
  --bg:#faf8f4; --ink:#1c1a17; --dim:#6b645c; --line:#e3ddd3;
  --card:#fff; --accent:#8a5a2b; --good:#2f6b3f; --bad:#a33; --warn:#8a6d1f;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --ink:#ece7dd; --dim:#9a9187; --line:#2e2a22;
    --card:#1e1b15; --accent:#d9a066; --good:#7fc08e; --bad:#e58b83; --warn:#d8bb63;
  }
}

  --card:#1e1b15; --accent:#d9a066; --good:#7fc08e; --bad:#e58b83; --warn:#d8bb63;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:0 16px 80px;-webkit-text-size-adjust:100%}

details[open]>summary:before{content:'▾ ';}

#mkpop{position:absolute;z-index:99;display:none}
#mkpop button{box-shadow:0 3px 14px rgba(0,0,0,.25);background:var(--accent);color:#fff;
  border-color:var(--accent);font-size:13.5px;padding:7px 12px}
.big3{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 0}
.big3 div{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.big3 b{display:block;font-size:22px;line-height:1.3}
.big3 span{font-size:12.5px;color:var(--dim)}
/* 陪伴层 */
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block;
  transition:background .25s,transform .25s}
.dots i.on{background:var(--good);transform:scale(1.25)}

@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.45)}}

<body>
<div class="wrap">

    <p class="sub">五张卡一组 · 问题念出来 · 你说话，它记下来 · <b>答案全部结束之后才给</b></p>

<div id="mkpop"><button type="button" onclick="mkAdd()">★ 加进必背</button></div>

<!-- ===== 卡的数据 · 跟 index.html 用同一批文件 =====
     ⚠ 这一行必须在所有 data/*.js 之前：那些文件里写的是 window.CARDS.push({...})，
     数组不先存在，第一个文件就会抛 “Cannot read properties of undefined”，
     然后后面 40 个一个都不会执行 —— 页面上看到的就是「卡的数据没装上」。
     index.html 第 602 行有同样的一句，drill.html 第一版漏了它。2026-09-22 修。 -->
<script>window.CARDS = [];</script>

<script>
/* ============================ 小工具 ============================ */
var CARDS = window.CARDS || [];
var CJK = /[一-鿿]/;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function strip(h){ return String(h==null?'':h).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function today(){ var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hash(s){ var h=0; s=String(s); for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }

/* ============================ 存档 ============================
   只存在这台机器上，跟收藏、单词本一样。 */
var KEY='oralexam.drill.v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} }
function st(){ var s=load(); s.days=s.days||{}; s.asked=s.asked||{}; s.passes=s.passes||0; return s; }
function dayRec(s,d){ s.days[d]=s.days[d]||{cards:[],qs:0,miss:0,sets:0}; return s.days[d]; }
function streak(){
  var s=st(), n=0, d=new Date();
  for(;;){ var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(s.days[k]&&s.days[k].sets>0){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

/* ============================ 问题池 ============================
   只收**真正是问题**的那些：题面必须是英文、而且必须有完整答案 en。
   陷阱和相邻考点的中文标签不是问题，跳过。 */
function qlist(c){
  var out=[];
  (c.ask||[]).forEach(function(g){
    (g.items||[]).forEach(function(x){
      if(!x.q||!x.en) return;
      if(CJK.test(x.q)) return;
      out.push({q:x.q, en:x.en, ez:x.ez||'', cn:x.cn||'', warn:x.warn||'', g:g.g||'', r:x.r||''});
    });
  });
  return out;
}
function cardTitle(c){ return strip(c.qcn||c.q||c.id); }
/* 卡面题是英文就用它开场（那才是考官真会念的那一句）；是中文就退回抽一道追问。
   主问题的「标准答案」用这张卡的**逐字稿 segs** —— 那本来就是整题出声说一遍的版本，
   比落点 end 完整得多，漏词表也才有足够的关键词可比。segs 没有就退回 end。 */
/* ⚠ 2026-09-22 实测之后改的。上一版把**整份逐字稿**（有的卡十二段、七百多词）
   当成主问题的标准答案，于是屏幕上是一堵墙，分数也没意义。
   现在分两层：
   · en   ＝ 只取<b>第一段</b>（那一段本来就是「定义 ＋ 开口」），用来算漏词、挑要补的句子；
   · full ＝ 整份逐字稿，收进折叠里，想看再点。 */
function segParas(c){
  var out = [];
  (c.segs||[]).forEach(function(s){ out.push((s.p||[]).map(strip).join(' ')); });
  return out.filter(function(x){ return x; });
}
function mainOf(c, pool){
  if(c.q && !CJK.test(c.q)){
    var ps = segParas(c);
    return {q:strip(c.q), en:(ps[0] || strip(c.end||'')), full:ps.join('\n\n'),
            cn:'', warn:'', g:'卷面题 · 开口那一段', r:'高', isMain:1};
  }
  return pool[0];
}

/* ============================ 关键词与漏检 ============================
   ⚠ 这是线索，不是判决。语音识别会把 oxaloacetate 听成别的东西，
   所以只比**前 5 个字母**，而且原始转录一定显示出来给她自己判断。 */
var STOP = (' about above after again against already also although always among another answer '
+ 'because become becomes been before begin behind being below between both bring build built '
+ 'called cannot carry carries change changes come comes could course different does doing done '
+ 'down during each either enough even every example first follow following from gives given goes '
+ 'going have having here high higher important into itself just keep keeps kind know large last '
+ 'later leave less like little long look made make makes many means might more most much must '
+ 'need needs never next nothing often once only other others over part parts place point points '
+ 'possible practice question rather really reason right same says second sense several should '
+ 'since small some something still such take takes tell than that their them then there these '
+ 'they thing things think this those three through thus time times together under until upon '
+ 'used uses using usually very want well were what when where which while will with within '
+ 'without work works would your ').split(' ');
var STOPSET = {}; STOP.forEach(function(w){ if(w) STOPSET[w]=1; });

/* ⚠ 2026-09-22 实测之后加的上限。第一版不封顶，于是卡 17 的主问题
   （标准答案是整份十二段逐字稿）一口气算出 200 多个关键词，
   整屏报「说到 9%」——那个数字没有意义，只会让人崩溃。
   现在：按词长倒序取前 MAXT 个（长词更可能是真正的专业词），最多 16 个。
   漏 16 个里的 5 个，是一句能听懂的话；漏 200 个里的 180 个，不是。 */
var MAXT = 16;
function terms(en){
  var t = strip(en).toLowerCase().replace(/[‘’“”]/g,' ');
  var ws = t.match(/[a-z][a-z-]{4,}/g) || [];
  var seen={}, out=[];
  ws.forEach(function(w){ w=w.replace(/-/g,''); if(w.length<5) return;
    if(STOPSET[w]) return; if(seen[w]) return; seen[w]=1; out.push(w); });
  out.sort(function(a,b){ return b.length-a.length; });
  return out.slice(0, MAXT);
}
function heard(t, said){
  /* 只比前 5 个字母 —— 识别把词尾听错是常态，词头很少错。 */
  return said.indexOf(t.slice(0,5)) !== -1;
}
function missOf(en, transcript){
  var said = ' ' + strip(transcript).toLowerCase().replace(/[^a-z]+/g,' ') + ' ';
  var ts = terms(en), miss=[], hit=[];
  ts.forEach(function(t){ (heard(t,said)?hit:miss).push(t); });
  return {miss:miss, hit:hit, total:ts.length};
}
/* 追问怎么挑：她**最没说到**的那几条排前面。 */
function rankFollow(pool, transcript){
  var said = ' ' + strip(transcript).toLowerCase().replace(/[^a-z]+/g,' ') + ' ';
  return pool.map(function(x){
    var ts = terms(x.q + ' ' + x.en), n=0;
    ts.forEach(function(t){ if(heard(t,said)) n++; });
    return {x:x, cov: ts.length ? n/ts.length : 1};
  }).sort(function(a,b){ return a.cov-b.cov; }).map(function(o){ return o.x; });
}

/* ============================ 朗读 ============================
   她 2026-09-22：「一定要真人语音提问」。
   ⚠ 说实话：浏览器里拿不到真人录音。能拿到的最接近的是**神经网络语音**
   （Windows / Edge 上名字里带 Natural 或 Online 的那些，例如 Sonia、Libby、Ryan），
   它们跟早年的机器音完全不是一回事，听感接近真人。
   所以这里做两件事：① 排序时把 Natural / Online / Neural / Premium / Enhanced 排最前；
   ② 给一个下拉框让她自己挑最像人的那一个，选择存下来。 */
var VOICE=null;
function voiceScore(v){
  var n=(v.name||'')+' '+(v.voiceURI||''), s=0;
  if(/natural|neural|online|premium|enhanced/i.test(n)) s+=100;
  if(/^en[-_]GB/i.test(v.lang)) s+=20;          /* 捷克考场上英音更常见 */
  else if(/^en[-_](IE|AU)/i.test(v.lang)) s+=12;
  else if(/^en[-_]US/i.test(v.lang)) s+=10;
  else if(/^en/i.test(v.lang)) s+=4;
  if(/google/i.test(n)) s+=6;
  if(/compact|espeak/i.test(n)) s-=30;
  return s;
}
function enVoices(){
  if(!window.speechSynthesis) return [];
  return (speechSynthesis.getVoices()||[]).filter(function(v){ return /^en/i.test(v.lang); })
    .sort(function(a,b){ return voiceScore(b)-voiceScore(a); });
}
function pickVoice(){
  var vs = enVoices(); if(!vs.length) return null;
  var want = (st().voice||'');
  for(var i=0;i<vs.length;i++) if(vs[i].name===want) return vs[i];
  return vs[0];
}
if(window.speechSynthesis){
  VOICE = pickVoice();
  speechSynthesis.onvoiceschanged = function(){ VOICE = pickVoice(); var s=$('vsel'); if(s) paintVoices(); };
}
function paintVoices(){
  var sel=$('vsel'); if(!sel) return;
  var vs=enVoices();
  sel.innerHTML = vs.map(function(v){
    var human = /natural|neural|online|premium|enhanced/i.test(v.name+v.voiceURI);
    return '<option value="'+esc(v.name)+'"'+(VOICE&&v.name===VOICE.name?' selected':'')+'>'
      + (human?'★ ':'') + esc(v.name) + ' · ' + esc(v.lang) + '</option>';
  }).join('') || '<option>（这个浏览器没有英文语音）</option>';
  sel.onchange = function(){
    var s2=st(); s2.voice=sel.value; save(s2); VOICE=pickVoice();
    say('Explain the functioning of the Lac and Trp operons.');
  };
}
function say(text, cb){
  if(!window.speechSynthesis){ if(cb) cb(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var u = new SpeechSynthesisUtterance(strip(text));
  if(VOICE) u.voice = VOICE;
  u.lang = (VOICE && VOICE.lang) || 'en-GB';
  u.rate = 0.95;
  u.onend = u.onerror = function(){ if(cb) cb(); };
  speechSynthesis.speak(u);
}

/* ============================ 转录 ============================ */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec=null, recWant=false, finalTxt='', interimTxt='';
function recStart(){
  if(!SR) return false;
  recWant = true;
  if(rec) { try{ rec.stop(); }catch(e){} }
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = 'en-GB'; rec.maxAlternatives = 1;
  rec.onresult = function(e){
    interimTxt='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var r=e.results[i];
      if(r.isFinal) finalTxt += r[0].transcript + ' ';
      else interimTxt += r[0].transcript;
    }
    paintLive();
  };
  /* Chrome 在静音一段时间之后会自己停。只要计时还在跑就重新开起来。 */
  rec.onend = function(){ if(recWant){ try{ rec.start(); }catch(e){} } };
  rec.onerror = function(e){
    if(e && (e.error==='not-allowed'||e.error==='service-not-allowed')){
      recWant=false; var l=$('live'); if(l) l.innerHTML='<b class="miss">麦克风被拒了。</b>浏览器地址栏左边点一下，允许麦克风，然后刷新。';
    }
  };
  try{ rec.start(); }catch(e){}
  return true;
}
function recStop(){ recWant=false; if(rec){ try{ rec.stop(); }catch(e){} } rec=null; }
function paintLive(){
  var l=$('live'); if(!l) return;
  l.innerHTML = esc(finalTxt) + '<span class="interim">' + esc(interimTxt) + '</span>'
    || '<span class="interim">说话吧，这里会实时出字……</span>';
  l.scrollTop = l.scrollHeight;
  lastHeardAt = Date.now();
  paintDots();
}

/* ============================ 陪伴层 ============================
   见文件头 ②③④。这一层没有任何模型，全是写死的句子 —— 但「有人在」
   本来也不需要聪明，需要的是**在场、记得、有反应**。 */

/* 她说不上来的时候会怎么说。实测那一组里出现了四次。 */
var GIVEUP = /\b(i'?m not sure|i am not sure|not sure|i don'?t know|i do not know|no idea|i have no idea|dunno)\b/i;
function saidGiveUp(txt){ return GIVEUP.test(String(txt||'')); }

/* 两题之间的一句。拼在问题前面一起念，不另开一条朗读（会打架）。 */
var BRIDGE_FIRST = ['Right. Here is the first one.', 'Okay. Let us start.'];
var BRIDGE_MID   = ['Good. Next one.', 'Alright. Here is the next.', 'Okay. Carry on.',
                    'Take your time with this one.', 'Good. Let us keep going.'];
var BRIDGE_LAST  = ['Last one.', 'This is the last one.'];
function bridgeFor(){
  var isFirst = (S.i===0 && S.sub===0);
  var c = curCard();
  var isLast = (S.i === S.cards.length-1) && (S.sub === (c.follow ? c.follow.length : 0));
  var pool = isFirst ? BRIDGE_FIRST : (isLast ? BRIDGE_LAST : BRIDGE_MID);
  return pool[Math.floor(Math.random()*pool.length)];
}

/* 静默的时候说一句。不催，只是说明有人在。 */
var NUDGE = ['还在，慢慢说。', '不着急，想到哪说到哪。', '嗯，我在听。',
             '说一半也算，先把想到的说出来。', '卡住就说 “I am not sure”，我记下来，明天再问你。'];
var lastHeardAt = 0, nudgeTimer = null, nudgeIdx = 0;
function startNudges(){
  lastHeardAt = Date.now(); nudgeIdx = 0;
  if(nudgeTimer) clearInterval(nudgeTimer);
  nudgeTimer = setInterval(function(){
    var n = $('nudge'); if(!n){ clearInterval(nudgeTimer); return; }
    var quiet = (Date.now() - lastHeardAt) / 1000;
    var hear = $('hear');
    if(hear) hear.className = 'hear' + (quiet < 2 ? ' live' : '');
    if(quiet > 7){
      n.textContent = NUDGE[nudgeIdx % NUDGE.length];
      if(quiet > 16){ nudgeIdx++; lastHeardAt = Date.now() - 8000; }
    } else { n.textContent = ''; }
  }, 900);
}
function stopNudges(){ if(nudgeTimer){ clearInterval(nudgeTimer); nudgeTimer=null; } }

/* 要点圆点：说到一个亮一个。⚠ 只给数量，不给词。 */
var LIVE_TERMS = [];
function paintDots(){
  var box = $('dots'); if(!box || !LIVE_TERMS.length) return;
  var said = ' ' + strip(finalTxt + ' ' + interimTxt).toLowerCase().replace(/[^a-z]+/g,' ') + ' ';
  var n = 0, html = '';
  LIVE_TERMS.forEach(function(w){
    var on = heard(w, said); if(on) n++;
    html += '<i class="' + (on?'on':'') + '"></i>';
  });
  box.innerHTML = html;
  var c = $('dotn'); if(c) c.textContent = n + ' / ' + LIVE_TERMS.length;
}

/* 首页开口第一句：具体，不是统计。 */
function helloLine(){
  var s = st(), d = today(), r = s.days[d]||{cards:[],sets:0}, k = streak();
  var last = s.last && s.last.log || [];
  var stuck = last.filter(function(x){ return x.self===2 || saidGiveUp(x.said); });
  if(r.sets > 0) return '今天已经练过 ' + r.sets + ' 组了。要不要再来一组？';
  if(k >= 2) return '你已经连着 ' + k + ' 天了。今天这一组也一起做掉。';
  if(stuck.length) return '上次有 ' + stuck.length + ' 题你说不上来，其中一题是「'
    + esc(strip(stuck[0].q).slice(0,40)) + '」。今天它可能还会来。';
  if(last.length) return '上次你说完了 ' + last.length + ' 题。今天接着来。';
  return '第一次来。五张卡，一张一张来，我陪你走完。';
}

/* ============================ 一场演练 ============================ */
var S = null;   /* 当前这一组的状态 */

/* 她 2026-09-22：「一共五个问题卡，其中两个一定是分子生物学 / pesb」。
   分子生物学 ＝ mb-*；PESB ＝ pe-* 再加 taq 和 land
   （题库里 #5 Taq/Kapa 和 #7 fitness landscape 都归在「K · 书外（实验室）」，
    而且都是 w3，属于她自己的日常工作那一块）。
   ⚠ 卡的 id 用的是连字符（mb-ko、pe-clone、x-meta），不是下划线——别写错。 */
function isMBPE(c){
  var id = c.id||'';
  return /^mb-/.test(id) || /^pe-/.test(id) || id==='taq' || id==='land';
}
function takeFrom(pool, doneToday, n){
  /* 今天还没过的优先；不够了再从过过的里面补（那时问题是新的）。 */
  var fresh = shuffle(pool.filter(function(c){ return !doneToday[c.id]; }));
  var used  = shuffle(pool.filter(function(c){ return  doneToday[c.id]; }));
  return fresh.concat(used).slice(0, n);
}

function buildSet(nCards, nFollow){
  var s = st(), d = today(), rec0 = dayRec(s, d);
  var usable = CARDS.filter(function(c){ return qlist(c).length > 0; });
  var doneToday = {}; rec0.cards.forEach(function(id){ doneToday[id]=1; });
  var newPass = false;
  if(usable.every(function(c){ return doneToday[c.id]; })){
    /* 今天已经把所有卡过了一遍 —— 开新的一遍 */
    s.passes++; rec0.cards = []; save(s); newPass = true; doneToday = {};
  }
  var mbpe  = usable.filter(isMBPE);
  var other = usable.filter(function(c){ return !isMBPE(c); });
  var want2 = Math.min(2, mbpe.length);
  var cards = takeFrom(mbpe, doneToday, want2);
  var seen={}; cards.forEach(function(c){ seen[c.id]=1; });
  cards = cards.concat(takeFrom(other.filter(function(c){ return !seen[c.id]; }), doneToday, nCards-cards.length));
  if(cards.length < nCards){    /* 万一别的不够，用 mb/pe 补满 */
    cards.forEach(function(c){ seen[c.id]=1; });
    cards = cards.concat(takeFrom(mbpe.filter(function(c){ return !seen[c.id]; }), doneToday, nCards-cards.length));
  }
  cards = shuffle(cards);       /* 摆出来的顺序还是随机的，别让她认出哪两张是保送的 */
  return {
    cards: cards.map(function(c){
      /* 问题级历史：没问过的排最前，其次最久没问的。 */
      var seen = s.asked;
      var pool2 = qlist(c).slice().sort(function(a,b){
        return (seen[c.id+'|'+hash(a.q)]||0) - (seen[c.id+'|'+hash(b.q)]||0);
      });
      return {card:c, pool:pool2, main:mainOf(c,pool2), asked:[], nFollow:nFollow};
    }),
    i:0, sub:0, log:[], newPass:newPass, nFollow:nFollow
  };
}

function curCard(){ return S.cards[S.i]; }
function curQ(){ var c=curCard(); return S.sub===0 ? c.main : c.follow[S.sub-1]; }

/* ============================ 界面 ============================ */

    $('estall').textContent = Math.round(usable.length*(120+(+sel.value)*60)/60);

function begin(){
  var s=st(); var nF=(s.nFollow==null?3:s.nFollow);
  S = buildSet(5, nF);
  if(!S.cards.length){ alert('没有可用的卡。'); return; }
  ask();
}

function ask(){
  var c = curCard(), q = curQ();
  if(!q){ nextCard(); return; }
  finalTxt=''; interimTxt='';
  LIVE_TERMS = terms(q.en || q.q);
  var total = S.cards.length, n = S.i+1;
  var isMain = S.sub===0;
  var secs = isMain ? 120 : 60;
  $('main').innerHTML =
    '<div class="card">'
    + '<div class="small">第 ' + n + ' / ' + total + ' 张 · ' + esc(cardTitle(c.card))
      + (isMain ? ' · <b>主问题</b>' : ' · 追问 ' + S.sub + ' / ' + c.follow.length) + '</div>'
    + '<p class="bridge" id="bridge"></p>'
    + '<p class="q">' + esc(q.q) + '</p>'
    + '<p class="qmeta">' + esc(q.g||'') + (q.r? ' · ' + esc(q.r) : '') + '</p>'
    + '<div class="row"><button onclick="say(' + JSON.stringify(q.q).replace(/"/g,'&quot;') + ')">🔊 再念一遍</button>'
      + '<span class="timer" id="clock">' + fmt(secs) + '</span></div>'
    + '<div class="bar"><i id="barfill"></i></div>'
    /* ⚠ 圆点只报数量，不报是哪些词 —— 报了就等于把答案摊开了。 */
    + '<div class="hear" id="hear"><span class="dot"></span><span>我在听 · 说到了 <b id="dotn">0 / '
      + LIVE_TERMS.length + '</b> 个要点</span></div>'
    + '<div class="dots" id="dots"></div>'
    + '<div class="live" id="live"></div>'
    + '<p class="nudge" id="nudge"></p>'
    + '<p style="margin:16px 0 0"><button class="main" onclick="doneAnswer()">说完了 ▸</button> '
      + '<button class="ghost" onclick="doneAnswer()">跳过</button> '
      + '<button class="ghost" onclick="quit()">结束这一组</button></p>'
    + '</div>'
    + '<p class="small">⚠ 答案要等这一组<b>全部结束</b>之后才出现。</p>';
  paintLive();
  /* 先念题，念完再开麦 —— 不然它会把自己念的话也记进去。
     ⚠ 闸：say() 开头会 speechSynthesis.cancel()，而 cancel 会让**上一条**的 onend
     立刻触发。没有这个序号，上一题的回调会在新题上再开一次计时器和麦克风，
     于是两个 clock 同时在跑、时间一秒掉两格。 */
  var mine = ++seq;
  var br = bridgeFor();
  var brEl = $('bridge'); if(brEl) brEl.textContent = br;
  /* 桥和问题拼成一条朗读 —— 分两条会被 cancel 打断。 */
  say(br + ' ' + q.q, function(){ if(mine !== seq) return; recStart(); runClock(secs); startNudges(); });
}
var seq = 0;

var timerId=null;
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function runClock(secs){
  var left=secs, tot=secs;
  if(timerId) clearInterval(timerId);
  timerId = setInterval(function(){
    left--;
    var cl=$('clock'); if(!cl){ clearInterval(timerId); return; }
    cl.textContent = fmt(Math.max(0,left));
    if(left<=15) cl.classList.add('low');
    var b=$('barfill'); if(b) b.style.width = Math.max(0,100*left/tot) + '%';
    if(left<=0){ clearInterval(timerId); doneAnswer(); }
  },1000);
}

function doneAnswer(){
  seq++;                       /* 作废掉还没回来的朗读回调 */
  if(timerId){ clearInterval(timerId); timerId=null; }
  stopNudges();
  recStop();
  try{ speechSynthesis.cancel(); }catch(e){}
  var c=curCard(), q=curQ();
  var said = (finalTxt + ' ' + interimTxt).trim();
  var m = missOf(q.en || q.q, said);
  /* ⚠ 她说不上来的时候，屏幕不能甩一堆红字给她。
     实测那一组里她说了四次 “I'm not sure”，换回来的是 25 个漏词。
     现在：当场记成「答不上」（不用她再点一次），并且念一句。
     没录到声音的也一样处理 —— 沉默跟说不上来是同一件事。 */
  var gave = saidGiveUp(said) || !said;
  S.log.push({card:c.card.id, title:cardTitle(c.card), q:q.q, en:q.en, full:q.full||'',
              ez:q.ez||'', cn:q.cn, warn:q.warn,
              said:said, miss:m.miss, hit:m.hit.length, total:m.total, sub:S.sub,
              self:(gave ? 2 : null), gave:gave});
  if(gave){
    var nu = $('nudge');
    if(nu) nu.textContent = '说不上就说不上，我记下来了，明天还问你。';
    say('That is fine. We will come back to it.');
  }
  /* 记下这道题问过了 */
  var s=st(); s.asked[c.card.id+'|'+hash(q.q)] = Date.now(); save(s);

  if(S.sub===0){
    /* 主问答完，按「她最没说到什么」挑追问 */
    var rest = c.pool.filter(function(x){ return x!==c.main; });
    c.follow = rankFollow(rest, said).slice(0, c.nFollow);
  }
  S.sub++;
  if(S.sub > (c.follow? c.follow.length : 0)) nextCard(); else ask();
}

function nextCard(){
  var s=st(), d=today(), r=dayRec(s,d);
  var c=curCard();
  if(r.cards.indexOf(c.card.id)===-1) r.cards.push(c.card.id);
  save(s);
  S.i++; S.sub=0;
  if(S.i>=S.cards.length) finish(); else ask();
}

function quit(){
  seq++;
  if(timerId){ clearInterval(timerId); timerId=null; }
  recStop();
  try{ speechSynthesis.cancel(); }catch(e){}
  finish();
}

function finish(){
  var s=st(), d=today(), r=dayRec(s,d);
  r.sets++; r.qs += S.log.length;
  S.log.forEach(function(x){ r.miss += x.miss.length; });

  /* ⚠ 2026-09-22 她说：「那这个直接当作学习进度吧，我自己去背开头那个卡实在是没有动力」。
     规矩一要的三个数（昨天出声练了几张 · 哪几张漏超过 2 条 · 有没有一张连着两次漏同样的点）
     从今天起<b>量出来</b>，不再靠她自己报——她一直报 0，正是因为那件事得先由她自己做。
     第三个数需要历史：每张卡每次的漏词存下来，只留最近两次，交集就是「连着两次漏同样的点」。 */
  s.missHist = s.missHist || {};
  var byCard = {};
  S.log.forEach(function(x){
    byCard[x.card] = byCard[x.card] || {};
    x.miss.forEach(function(w){ byCard[x.card][w] = 1; });
  });
  s.repeat = s.repeat || {};
  Object.keys(byCard).forEach(function(id){
    var now = Object.keys(byCard[id]);
    var h = s.missHist[id] || [];
    var prev = h.length ? h[h.length-1] : null;
    if(prev){
      var again = now.filter(function(w){ return prev.indexOf(w)!==-1; });
      if(again.length) s.repeat[id] = again; else delete s.repeat[id];
    }
    h.push(now); while(h.length>2) h.shift();
    s.missHist[id] = h;
  });

  /* 她 2026-09-22：「我觉得这个练习过的能不能也储存起来」。
     每一组都留下来，最多 60 组（再多就没人看了，也怕把 localStorage 撑爆）。 */
  var key = String(Date.now());
  var names = S.cards.map(function(cc){ return cc.card.id; }).join(' ');
  var pack = {key:key, when:new Date().toISOString(), cards:names, log:S.log};
  s.hist = s.hist || [];
  s.hist.push(pack);
  while(s.hist.length > 60) s.hist.shift();
  s.last = pack;
  save(s);
  report(false);
}

/* 把一段英文切成句子。不用 lookbehind（老 Safari 会直接报语法错，整页死掉）。 */
function splitSent(t){
  var s = strip(t).replace(/[“”"]/g,'');
  var parts = s.split(/([.?!])\s+/), out=[], cur='';
  for(var i=0;i<parts.length;i++){
    cur += parts[i];
    if(/^[.?!]$/.test(parts[i])){ out.push(cur.trim()); cur=''; }
  }
  if(cur.trim()) out.push(cur.trim());
  return out.filter(function(x){ return x.length>12; });
}
/* ⚠ 这是这一屏改动的核心。她 2026-09-22：「反馈还是太机械化了，罗列出所有原答案，
   我看着就很崩溃」。所以不再给她一串漏掉的**单词**，也不默认摊开整段标准答案——
   而是从答案里挑出<b>包含这些漏词的那一两个完整句子</b>：那是她下次真正要说出口的东西。
   优先用 ez（每句 ≤15 词，本来就是最短版），没有 ez 才退回 en。 */
function toFix(item, n){
  var src = item.ez || item.en || '';
  var ss = splitSent(src);
  if(!ss.length){ src = item.en || ''; ss = splitSent(src); }
  var scored = ss.map(function(s2){
    var low = ' ' + s2.toLowerCase().replace(/[^a-z]+/g,' ') + ' ', k=0;
    item.miss.forEach(function(w){ if(low.indexOf(w.slice(0,5))!==-1) k++; });
    return {s:s2, k:k};
  }).filter(function(o){ return o.k>0; }).sort(function(a,b){ return b.k-a.k; });
  return scored.slice(0, n||2);
}
/* 句子里把漏掉的词标出来 */
function hl(s2, miss){
  var out = esc(s2);
  miss.slice(0,14).forEach(function(w){
    var re = new RegExp('(' + w.slice(0,5).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[a-z-]*)', 'ig');
    out = out.replace(re, '<u class="mw">$1</u>');
  });
  return out;
}

/* ============================ 结果 · 只在这里给答案 ============================
   ⚠ 2026-09-22 她实测一组之后：「反馈还是太机械化了，罗列出所有原答案，
   这很好，但是我看着就很崩溃了」。
   所以这一屏的规矩变成：**先给你要补的那一两句，别的全部收起来。** */

var RLOG = [];      /* 当前正在显示的这一组 */
var RKEY = '';      /* 它在历史里的键，自评要写回去 */

function report(fromHome, hist){
  recStop();
  var s = st();
  var pack = hist || (fromHome ? s.last : {when:new Date().toISOString(), log:S.log, key:(s.last&&s.last.key)});
  var log = (pack && pack.log) || [];
  if(!log.length){
    $('main').innerHTML = '<div class="card">还没有结果。<p><button class="main" onclick="home()">回去</button></p></div>';
    return;
  }
  RLOG = log; RKEY = (pack && pack.key) || '';

  /* 按「漏得最多」排前面 —— 她只读前两条就该停。 */
  var order = log.map(function(x,i){ return {x:x, i:i,
      bad: x.total ? x.miss.length / x.total : 0 }; })
    .sort(function(a,b){ return b.bad - a.bad; });

  var graded = log.filter(function(x){ return x.self; }).length;
  var ok = log.filter(function(x){ return x.self===0; }).length;
  var gv = log.filter(function(x){ return x.gave || x.self===2; }).length;
  var line = '这一组我陪你走完了。' + log.length + ' 题里，'
    + (gv ? '有 ' + gv + ' 题你当场说了说不上——那几题明天还会来。' : '你每一题都开口了。')
    + (ok ? ' 你自己标了 ' + ok + ' 题是答得出的。' : '');
  var h = '<div class="card">'
    + '<p class="hello">' + line + '</p>'
    + '<b style="font-size:19px">这一组说完了 · ' + log.length + ' 题</b>'
    + '<div class="small">下面按「差得最多」排。<b>只读前两条也行</b>，别从头读到尾。</div>'
    + '<div class="small" style="margin-top:8px">⚠ 识别会把专业词听坏（helicase 听成 hello kiss 这种），'
    + '所以<b>机器算的漏词只是线索</b>。每题下面有三个自评键，<b>那个才是进度</b>。'
    + '已评 <b id="gcount">' + graded + '</b> / ' + log.length + '</div>'
    + '<p style="margin:14px 0 0"><button class="main" onclick="home()">回首页</button> '
    + '<button onclick="copyOut()">复制进度给老师</button></p></div>';

  order.forEach(function(o){
    var x = o.x, idx = o.i;
    var fixes = toFix(x, x.gave ? 1 : 2);
    if(x.gave && !fixes.length){
      var ss0 = splitSent(x.ez || x.en || '');
      if(ss0.length) fixes = [{s:ss0[0], k:0}];
    }
    h += '<div class="card" data-card="' + esc(x.card) + '" data-i="' + idx + '">'
      + '<div class="small">' + esc(x.title) + (x.sub ? ' · 追问 ' + x.sub : ' · 主问题') + '</div>'
      + '<p class="q" style="font-size:17px" onclick="sayEl(this)">' + esc(x.q) + '</p>';

    if(fixes.length){
      h += '<div class="fix"><b class="small">' + (x.gave ? '这一题你说了说不上。下次先说出这一句：' : '下次一定要说出口的：') + '</b>'
         + fixes.map(function(f){
             return '<p class="sayit" onclick="sayEl(this)">' + hl(f.s, x.miss) + '</p>'; }).join('')
         + '</div>';
    } else if(x.gave){
      h += '<div class="fix"><b class="small">这一题你说了说不上。</b> 下次先把这一句说出口就够了。</div>';
    } else if(!x.said){
      h += '<div class="fix"><b class="small">这一题没录到声音。</b></div>';
    } else {
      h += '<div class="hit small" style="margin:10px 0"><b>关键的几个词你都说到了。</b></div>';
    }

    h += '<div class="gr">'
       + ['答得出','答一半','答不上'].map(function(lab,k){
           return '<button class="' + (x.self===k ? 'sel' : '') + '" onclick="grade(' + idx + ',' + k + ',this)">'
                + lab + '</button>'; }).join('')
       + '</div>'
      + '<details><summary>你刚才说的</summary><div class="said">'
        + (x.said ? esc(x.said) : '<i class="small">没有录到</i>') + '</div></details>'
      + '<details><summary>完整答案</summary><div class="ans sayit" onclick="sayEl(this)">'
        + strip(x.en).replace(/^"|"$/g,'') + '</div>'
        + (x.full ? '<div class="ans sayit" onclick="sayEl(this)" style="opacity:.85">'
            + esc(x.full).replace(/\n\n/g,'<br><br>') + '</div>' : '')
        + (x.warn ? '<div class="warnbox">' + x.warn + '</div>' : '')
        + (x.cn ? '<div class="small">' + x.cn + '</div>' : '')
      + '</details>'
      + (x.miss.length && !x.gave
          ? '<details><summary>机器认为没说到的词（' + x.miss.length + ' 个 · 可能误判）</summary><div>'
            + x.miss.map(function(w){ return '<span class="pill">' + esc(w) + '</span>'; }).join(' ')
            + '</div></details>'
          : '')
      + '</div>';
  });
  h += '<p class="small">选中任意一段英文，会冒出「★ 加进必背」—— 标了的会出现在主 app 的 ★ 必背里。'
     + '<br>点一句英文就念那一句。</p>';
  $('main').innerHTML = h;
}

/* ---- 点读 ---- */
function sayEl(el){ if(!el) return; var t2 = el.textContent || ''; if(t2.trim()) say(t2); }

/* ---- 自评。这是唯一可信的那个信号，所以它写进历史。 ---- */
function grade(i, k, btn){
  if(!RLOG[i]) return;
  RLOG[i].self = k;
  var row = btn.parentNode.querySelectorAll('button');
  for(var a=0;a<row.length;a++) row[a].className = (a===k ? 'sel' : '');
  var s = st();
  (s.hist||[]).forEach(function(p){ if(p.key===RKEY) p.log = RLOG; });
  if(s.last && s.last.key===RKEY) s.last.log = RLOG;
  save(s);
  var g = $('gcount'); if(g) g.textContent = RLOG.filter(function(x){ return x.self!=null; }).length;
}

/* ---- 选中 → 加进必背。写的是主 app 的同一个键，两页同源，所以会直接出现在 ★ 必背里。 ---- */
var MKK = 'oralexam.mark.v1';
function mkLoad(){ try{ return JSON.parse(localStorage.getItem(MKK))||[]; }catch(e){ return []; } }
function mkSave(a){ try{ localStorage.setItem(MKK, JSON.stringify(a)); }catch(e){} }
var mkSel = null;
document.addEventListener('mouseup', function(){
  setTimeout(function(){
    var sel = window.getSelection();
    var txt = sel ? String(sel).trim() : '';
    var pop = $('mkpop');
    if(!pop) return;
    if(txt.length < 8 || !sel.rangeCount){ pop.style.display='none'; mkSel=null; return; }
    var node = sel.getRangeAt(0).startContainer;
    var el = node.nodeType===1 ? node : node.parentNode;
    var box = el && el.closest ? el.closest('[data-card]') : null;
    if(!box){ pop.style.display='none'; mkSel=null; return; }
    mkSel = {card: box.getAttribute('data-card'), text: txt};
    var r = sel.getRangeAt(0).getBoundingClientRect();
    pop.style.display = 'block';
    pop.style.left = (window.scrollX + r.left) + 'px';
    pop.style.top  = (window.scrollY + r.bottom + 8) + 'px';
  }, 10);
});
function mkAdd(){
  if(!mkSel) return;
  var all = mkLoad();
  for(var i=0;i<all.length;i++)
    if(all[i].card===mkSel.card && all[i].text===mkSel.text){
      $('mkpop').style.display='none'; mkSel=null; alert('这一段已经标过了。'); return; }
  all.push({id:String(Date.now())+'-'+Math.floor(Math.random()*1e6),
            card:mkSel.card, sec:'drill', text:mkSel.text, pre:'', post:'', ts:Date.now()});
  mkSave(all);
  $('mkpop').style.display='none';
  var n = all.length; mkSel=null;
  alert('加进必背了。主 app 首页点「★ 必背 ' + n + ' 段」就能看到。');
}

/* ---- 复制进度给老师：规矩一要的就是这三个数 ---- */
function copyOut(){
  var s = st(), d = today(), r = s.days[d] || {}, n = numbers();
  var lines = ['口试演练 ' + d,
    '① 今天出声练了 ' + n.cardsToday + ' 张（' + (r.sets||0) + ' 组 · ' + (r.qs||0) + ' 题）· 连续 ' + streak() + ' 天',
    '② 漏超过 2 条的：' + (n.bad.length ? n.bad.join(' ') : '无'),
    '③ 连着两次漏同一个点的：' + (n.rep.length ? n.rep.map(function(o){ return o.id+'('+o.w.slice(0,4).join(',')+')'; }).join(' ') : '无'),
    ''];
  RLOG.forEach(function(x){
    lines.push('[' + x.title + '] ' + x.q);
    lines.push('  自评 ' + (x.self==null ? '—' : ['答得出','答一半','答不上'][x.self])
      + ' · 机器算漏 ' + x.miss.length + '/' + x.total);
  });
  var txt = lines.join('\n');
  try{ navigator.clipboard.writeText(txt); alert('复制好了，粘给老师。'); }
  catch(e){ prompt('手动复制：', txt); }
}

/* 规矩一的三个数，现在是量出来的，不是问出来的。 */
function numbers(){
  var s = st(), d = today(), r = s.days[d] || {cards:[]};
  var bad = [], seen = {};
  ((s.last && s.last.log) || []).forEach(function(x){
    seen[x.card] = (seen[x.card]||0) + x.miss.length;
  });
  Object.keys(seen).forEach(function(k){ if(seen[k] > 2) bad.push(k); });
  var rep = Object.keys(s.repeat||{}).map(function(k){ return {id:k, w:s.repeat[k]}; });
  return {cardsToday:(r.cards||[]).length, bad:bad, rep:rep};
}

/* ---- 历史 ---- */
function histPage(){
  var s = st(), hs = (s.hist||[]).slice().reverse();
  var h = '<div class="card"><b style="font-size:19px">练过的</b>'
    + '<div class="small">一共 ' + hs.length + ' 组，最新的在上面。点一组看它的反馈。</div>'
    + '<p style="margin:12px 0 0"><button class="main" onclick="home()">回首页</button></p></div>';
  if(!hs.length) h += '<div class="card small">还没有。</div>';
  hs.forEach(function(p, k){
    var g = p.log.filter(function(x){ return x.self===0; }).length;
    var b = p.log.filter(function(x){ return x.self===2; }).length;
    h += '<div class="card"><div class="row" style="justify-content:space-between">'
      + '<div><b>' + esc((p.when||'').slice(0,16).replace('T',' ')) + '</b>'
      + '<div class="small">' + p.log.length + ' 题 · 答得出 ' + g + ' · 答不上 ' + b
      + ' · ' + esc(p.cards||'') + '</div></div>'
      + '<button onclick="openHist(' + (hs.length-1-k) + ')">看</button></div></div>';
  });
  $('main').innerHTML = h;
}
function openHist(i){ var s=st(); var p=(s.hist||[])[i]; if(p) report(false, p); }

/* ============================ 起 ============================ */
if(!CARDS.length){
  $('main').innerHTML = '<div class="card"><b class="miss">卡的数据没装上。</b>'
    + '<p class="small">这一页要跟 <code>data/</code> 放在一起才能跑。</p></div>';
} else {
  home();
}
</script>
