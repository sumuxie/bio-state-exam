<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>口试演练</title>
<!--
  口试演练台 —— 2026-09-22 Ruojin 提的。

  她的原话：「可以另外做一个出来，不一定和现在的 app 相关。用目前的 app 的卡片，
  模仿老师们的考试，五个卡片为一个 set，然后就是随机的 set，每个卡片里也随机抽问题
  出来。关键在于是互动式，问题会念出来，然后给我两分钟，这两分钟会转录我的语音，
  然后根据我的语音再提问，每个问题可以提 5 个追问。每天都必须练。最后肯定会显示出
  答案，但是我觉得应该在最最后，全部卡片结束之后再显示。」
  后面又补：「练过的可以循环反复出现，但是每次都需要有新问题。最好是一天能够把所有
  卡片都过一遍。」

  ⚠ 为什么这一个值得破例做（规矩三）。这个仓库里所有别的产出都是**材料**，
  而她自己说过「我在用整理学习材料来逃避真正的学习」。
  **这是唯一一个把材料逼成开口的东西**，挡住她的不是「找不到 X」，是「张不开嘴」。

  三件不用花力气的事：
  · 朗读 —— 浏览器自带 speechSynthesis。
  · 转录 —— 浏览器自带 SpeechRecognition，不要 key、不要后端。
  · 追问 —— **1212 条已经写好了，不需要生成**。按「她刚才没说到哪些词」来挑，
    比现编的准，而且这正是这个项目一直在用的那把尺子（「哪几张漏超过 2 条」）。

  三件真正的风险，都写在页面上告诉她了：
  ① 只有 Chrome / Edge 桌面版靠谱，Safari 和 iOS 多半不行。
  ② 专业词会被听错（oxaloacetate 这类），所以漏词表是**线索不是判决**，
     匹配只比前 5 个字母，而且原始转录一定显示出来给她自己看。
  ③ Chrome 的识别把音频送到 Google 的服务器 —— 说一次，让她知道。

  这一页不依赖 index.html 的任何代码，只共用 data/*.js（它们往 window.CARDS 上 push）。
-->
<style>
:root{
  --bg:#faf8f4; --ink:#1c1a17; --dim:#6b645c; --line:#e3ddd3;
  --card:#fff; --accent:#8a5a2b; --good:#2f6b3f; --bad:#a33; --warn:#8a6d1f;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --ink:#ece7dd; --dim:#9a9187; --line:#2e2a22;
    --card:#1e1b15; --accent:#d9a066; --good:#7fc08e; --bad:#e58b83; --warn:#d8bb63;
  }
}
:root[data-theme="dark"]{
  --bg:#16140f; --ink:#ece7dd; --dim:#9a9187; --line:#2e2a22;
  --card:#1e1b15; --accent:#d9a066; --good:#7fc08e; --bad:#e58b83; --warn:#d8bb63;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:0 16px 80px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto}
header{padding:22px 0 10px;border-bottom:1px solid var(--line);margin-bottom:20px}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13.5px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:9px 15px}
button:hover{border-color:var(--accent)}
button.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;padding:12px 22px}
button.main:disabled{opacity:.45;cursor:not-allowed}
button.ghost{color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q{font-size:20px;line-height:1.5;font-weight:600;margin:6px 0 4px}
.qmeta{color:var(--dim);font-size:13px;margin:0 0 14px}
.timer{font-size:44px;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:1px}
.timer.low{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 16px}
.bar>i{display:block;height:100%;background:var(--accent);width:100%}
.live{background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:12px;
  min-height:96px;font-size:15px;line-height:1.75;white-space:pre-wrap}
.live .interim{color:var(--dim)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;
  padding:2px 10px;font-size:12.5px;color:var(--dim);margin:0 6px 6px 0}
.pill.on{border-color:var(--accent);color:var(--accent)}
.miss{color:var(--bad);font-weight:600}
.hit{color:var(--good)}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;margin:12px 0;
  background:color-mix(in srgb,var(--warn) 9%,transparent);font-size:14px;border-radius:0 8px 8px 0}
.ans{border-left:3px solid var(--accent);padding:10px 14px;margin:10px 0;
  background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:0 8px 8px 0}
.said{border-left:3px solid var(--line);padding:10px 14px;margin:10px 0;font-size:15px}
h3{font-size:16px;margin:26px 0 6px}
label{font-size:14px;color:var(--dim)}
select,input[type=number]{font:inherit;padding:6px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.small{font-size:13px;color:var(--dim)}
.grade{display:flex;gap:8px;margin-top:8px}
.grade button{flex:1;padding:8px}
.grade button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
a{color:var(--accent)}
.hide{display:none}
/* 反馈屏 2.0 */
.fix{border-left:3px solid var(--bad);padding:10px 14px;margin:10px 0;
  background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:0 8px 8px 0}
.fix p{margin:0 0 8px;font-size:16px;line-height:1.75}
.fix p:last-child{margin-bottom:0}
u.mw{text-decoration:none;border-bottom:2px solid var(--bad);font-weight:600}
.fixrow{margin:0 0 14px}
.fixrow:last-of-type{margin-bottom:0}
.fixrow p{margin:2px 0 0;font-size:16.5px;line-height:1.75}
.fixtag{display:block;font-size:12.5px;color:var(--dim);font-weight:600}
.fixrow.defline{border-left:3px solid var(--accent);padding-left:11px}
.fixrow.defline .fixtag{color:var(--accent)}
.fixnote{font-size:12.5px;color:var(--dim);line-height:1.7;margin:12px 0 0}
.deftag2{display:inline-block;background:var(--accent);color:#fff;font-size:11px;
  font-weight:700;letter-spacing:.6px;border-radius:5px;padding:1px 7px;margin-right:7px;
  vertical-align:2px}
.defbig{font-weight:600}
/* 跟读 */
.shb{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shb button{padding:6px 12px;font-size:13.5px}
.shb .st{font-size:13px;color:var(--dim)}
.shres{margin-top:8px;font-size:15px;line-height:1.9}
.shres .ok{color:var(--good);font-weight:600}
.shres .no{color:var(--bad);font-weight:600;text-decoration:underline}
.shres .raw{display:block;margin-top:6px;font-size:13px;color:var(--dim)}
.shbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0;
  border-bottom:1px solid var(--line);margin-bottom:8px}
/* 2026-09-23 · 化学专练 ＋ 单卡模式 */
.chemq{font-size:20px;font-weight:650;line-height:1.5;margin:0 0 4px}
.chemtag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;
  background:var(--accent);color:#fff;font-weight:700;margin-bottom:8px}
.chemfrom{font-size:12.5px;color:var(--dim);margin:0 0 12px}
.altbadge{color:var(--accent)}
.chemstep{font-size:13px;color:var(--dim);margin:14px 0 6px;font-weight:600}
.chembar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 0}
.onebox{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px}
/* ⚠ 2026-09-25 晚：她说「你凭什么把所有东西全部分平均到三份了 我明明在第一份发力的」。
   对 —— 三块等宽等重是在说「三件事一样要紧」，而她现在只在第一份里。
   所以第一份整行、大号；第二三份并排压到半宽、灰掉。 */
button.main.ok{background:var(--good);border-color:var(--good)}
button.ghost.done{color:var(--good);border-color:var(--good)}
.earfold{border:1px solid var(--line);border-radius:10px;padding:0;margin:0}
.earfold>summary{cursor:pointer;list-style:none;padding:11px 14px;font-size:13.5px;color:var(--dim)}
.earfold>summary::-webkit-details-marker{display:none}
.earfold>summary:before{content:'▸ ';}
.earfold[open]>summary{border-bottom:1px solid var(--line);color:var(--ink);font-weight:600}
.earfold[open]>summary:before{content:'▾ ';}
.earfold>.onebox,.earfold>div{border:0;margin:0}
.parts{display:flex;gap:10px;margin:0;flex-wrap:wrap}
.part.lead{flex:1 1 100%;border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 5%,transparent)}
.part.lead .big b{font-size:34px}
.part.lead h4{font-size:15.5px;color:var(--ink)}
.part.rest{flex:1 1 calc(50% - 5px);opacity:.72}
.part.rest .big b{font-size:20px}
.chembox{border-color:var(--accent)}
/* 2026-09-24：首页的层级。
   ⚠ 她：「没啥变化 我要个**强弱 大小**这种对比」——
   上一版只加了编号和分割线，字号粗细全一样，看着还是一片平的。**分区不等于分层。**
   这里定一套尺度：区标题 23 / 块标题 15.5 / 说明 12.5 / 主按钮 17 / 次按钮 13。 */
/* ⚠ 2026-09-25 晚：她说「标们还是太丑了 又大又不明显」。
   23px 特大反而糊 —— 大字号让每个标题都在喊，喊的人多了就没人突出。
   改法：字号降到 17，靠**一条色条 ＋ 底线**做分隔，靠 .secmain 做唯一的主角。 */
h3.sec{display:flex;align-items:baseline;gap:9px;margin:30px 0 10px;
  font-size:17px;font-weight:750;letter-spacing:0;padding:0 0 6px;
  border-bottom:1px solid var(--line)}
h3.sec i{font-style:normal;flex:none;width:20px;height:20px;border-radius:5px;
  background:var(--line);color:var(--dim);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;align-self:center}
h3.sec span{font-size:11.5px;color:var(--faint);font-weight:400;margin-left:auto;
  text-align:right;max-width:52%;line-height:1.4;letter-spacing:0}
/* ① 是主角：左边一条粗色条，背景略深 */
/* 唯一的主角：色条 ＋ 色字 ＋ 实心圆点。别的小标题一律素的。 */
h3.sec.secmain{border-left:4px solid var(--accent);padding-left:12px;margin-left:-16px;
  border-bottom-color:var(--accent);font-size:19px;font-weight:800;
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 8%,transparent),transparent 55%)}
h3.sec.secmain i{background:var(--accent);color:var(--onAccent)}
/* 块标题 vs 说明 —— 原来两者差不多大，所以糊成一团 */
.onebox>b:first-child{font-size:15.5px;font-weight:700;display:block;margin-bottom:2px}
.onebox .small{font-size:12.5px;line-height:1.6}
.part h4{font-size:13px;font-weight:700;color:var(--dim);margin:0 0 6px}
/* 她天天看的那个数，要大 */
.part .big{display:flex;align-items:baseline;gap:5px;margin:2px 0 3px}
.part .big b{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.02em}
.part .big em{font-style:normal;font-size:14px;color:var(--faint);font-weight:600}
.part .meta{font-size:11px;color:var(--faint);line-height:1.4;margin:0 0 9px}
/* ① 那个圆不要被渐变冲淡 */
h3.sec.secmain i{box-shadow:0 0 0 3px var(--card)}
.strmh b{font-size:14px}
.strmh .small{font-size:11.5px}
/* 主按钮 · 次按钮拉开 */
#main button.main{font-size:17px;font-weight:700;padding:13px 26px;border-radius:11px}
.part button.main{font-size:14px;padding:9px 16px}
#main button.ghost{font-size:13px;padding:7px 13px}
/* 挑句：☆ 在句首，挑中整句高亮（她：「选中句子后句子会被 highlight」）*/
.wktxt .sent{padding:2px 3px;border-radius:6px;transition:background .12s;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent.on{background:#fff2c2}
@media (prefers-color-scheme:dark){.sent.on{background:#4a3f1c}}
.pkgrp{margin:0 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.pkq{margin:0 0 6px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.pkq span{margin-left:auto;font-size:11px;color:var(--faint);font-weight:400}
p.pkline{margin:0 0 4px;padding:3px 6px;border-radius:6px;font-size:14.5px;line-height:1.7}
p.pkline span{cursor:pointer}
b.pk{cursor:pointer;color:var(--faint);font-size:14px;margin-right:6px;user-select:none}
b.pk:hover{color:var(--accent)}
.sent.on b.pk{color:#c9a227}
/* 进度条：三屏共用。⚠ 条画的是「全部题」——三个数里只有它代表「离背完还有多远」。*/
.prog{margin:8px 0 12px}
.pbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 5px}
.pbar i{display:block;height:100%;background:var(--accent)}
.pnum{font-size:11.5px;color:var(--dim);line-height:1.6}
.pnum b{color:var(--ink);font-weight:700}
.earbox{border-color:#7a5cff}
.spot{margin:10px 0 0;padding:9px 11px;border:1px solid var(--line);border-radius:9px}
.spot .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 6px}
.spot .bar i{display:block;height:100%;background:var(--accent)}
.spot .small{margin:0}
.strm{margin:0 0 12px}
.strmh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 5px}
.strmh b{font-size:14px}
.part{flex:1;min-width:190px;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.part.done{border-color:var(--good)}
.part h4{margin:0 0 5px;font-size:14.5px}
.part .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 6px}
.part .bar i{display:block;height:100%;background:var(--accent)}
.part .small{margin:0 0 8px}
.onebox select{max-width:420px}
.modes{display:flex;gap:10px;margin:14px 0 0;flex-wrap:wrap}
.modes .mode{flex:1;min-width:210px;text-align:left;padding:12px 14px;line-height:1.5}
.modes .mode b{display:block;font-size:15.5px;margin-bottom:2px}
.modes .mode span{display:block;font-size:12.5px;color:var(--dim)}
.modes .mode.sel{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
.modes .mode.sel b{color:var(--accent)}
.defhl{background:color-mix(in srgb,var(--accent) 14%,transparent);
  box-shadow:inset 3px 0 0 var(--accent);padding:2px 6px 2px 9px;border-radius:0 5px 5px 0;
  font-weight:600}
.sayit{cursor:pointer}
.sayit:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:4px}
details{margin:8px 0}
details>summary{cursor:pointer;color:var(--dim);font-size:13.5px;padding:4px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:'▸ ';}
details[open]>summary:before{content:'▾ ';}
.gr{display:flex;gap:8px;margin-top:10px}
.gr button{flex:1;padding:7px 4px;font-size:13.5px}
.gr button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
#mkpop{position:absolute;z-index:99;display:none}
#mkpop button{box-shadow:0 3px 14px rgba(0,0,0,.25);background:var(--accent);color:#fff;
  border-color:var(--accent);font-size:13.5px;padding:7px 12px}
.big3{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 0}
.big3 div{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.big3 b{display:block;font-size:22px;line-height:1.3}
.big3 span{font-size:12.5px;color:var(--dim)}
/* 2026-09-23 · 跟读式四步 */
.wkstep{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.wktxt{font-size:16.5px;line-height:1.95;margin:6px 0}
.wd{cursor:pointer;border-radius:3px}
.wd:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.wd.kw{font-weight:650;color:var(--accent)}
/* ⚠ 2026-09-23 她：「我其实比较喜欢**涂掉**，而不是挖空」「就用**浅褐色**涂掉」。
   涂掉 ＝ 原话还在底下，只是被马克笔盖住；挖空是空的。对要出声的用法，涂掉更对。 */
.bl{background:#c9a97e;color:transparent;cursor:pointer;border-radius:2px;padding:0 1px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.bl:hover{background:#b9955f}

.bl.show{background:#f0e2cc;color:inherit;font-weight:650}
@media (prefers-color-scheme:dark){.bl{background:#7d6547}.bl:hover{background:#96794f}
  .bl.show{background:#3a2f22;color:inherit}}
.gap{color:var(--dim);opacity:.6}
.wkctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.wkctl button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.shres audio{display:block;margin-top:8px;width:100%;max-width:420px}
/* 陪伴层 */
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block;
  transition:background .25s,transform .25s}
.dots i.on{background:var(--good);transform:scale(1.25)}
.hear{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13.5px;margin:2px 0 0}
.hear .dot{width:9px;height:9px;border-radius:50%;background:var(--good);opacity:.35}
.hear.live .dot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.45)}}
.nudge{color:var(--accent);font-size:14.5px;margin:8px 0 0;min-height:22px}
.hello{font-size:16px;line-height:1.75;margin:0 0 6px}
.bridge{font-size:15px;color:var(--accent);margin:0 0 10px;min-height:22px}
.cardline{font-size:14px;color:var(--dim);margin:0 0 2px;min-height:20px}
.win{border-left:3px solid var(--good);padding:10px 14px;margin:10px 0 0;
  background:color-mix(in srgb,var(--good) 10%,transparent);border-radius:0 8px 8px 0;
  font-size:15.5px;line-height:1.7}

/* ============ 2026-09-25 晚 · 只收拾外观，不动任何数字和逻辑 ============
   她：「再优化一下 ui 太丑了太丑了 别动任何数据数字啊」。
   现在的毛病是**一片棕**：每个块都是同样的边框、同样的圆角、同样的实心棕按钮，
   于是没有主次，越看越糊。这一段只做三件事：
   ① 按钮分级 —— 一屏只留一个实心，其余全部描边；
   ② 盒子减负 —— 边框换成极淡的底色，靠留白分块而不是靠线；
   ③ 文字分层 —— 说明文字降一号、行距放开，标题反而收紧。 */

/* ① 按钮 */
button{border-radius:8px;transition:background .15s,border-color .15s,color .15s}
button.main{font-weight:650;letter-spacing:.01em;box-shadow:none}
button.main:hover{filter:brightness(1.06)}
/* 次级：描边，不再是实心棕 */
.part.rest button.main,

<script>
/* ============================ 小工具 ============================ */
var CARDS = window.CARDS || [];
var CJK = /[一-鿿]/;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function strip(h){ return String(h==null?'':h).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function today(){ var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hash(s){ var h=0; s=String(s); for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }

/* ============================ 存档 ============================
   只存在这台机器上，跟收藏、单词本一样。 */
var KEY='oralexam.drill.v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
/* ⚠ 2026-09-22：历史要全存，所以写不下的时候不能默默失败。
   localStorage 每个源一般 5 MB；满了就丢最老的两成再试，最多试三轮。
   丢掉的那一批在页面上说一句 —— 别让她以为还在。 */
var SAVE_WARN = '';
function save(o){
  for(var k=0;k<4;k++){
    try{ localStorage.setItem(KEY, JSON.stringify(o)); return true; }
    catch(e){
      if(!o.hist || o.hist.length < 4){ SAVE_WARN = '⚠ 浏览器存不下了，这一组没能存进历史。'; return false; }
      var drop = Math.max(1, Math.floor(o.hist.length * 0.2));
      o.hist = o.hist.slice(drop);
      SAVE_WARN = '⚠ 浏览器空间满了，丢掉了最老的 ' + drop + ' 组历史。建议用「导出历史」备份。';
    }
  }
  return false;
}
function st(){ var s=load(); s.days=s.days||{}; s.asked=s.asked||{}; s.passes=s.passes||0; return s; }
function dayRec(s,d){ s.days[d]=s.days[d]||{cards:[],qs:0,miss:0,sets:0}; return s.days[d]; }
function streak(){
  var s=st(), n=0, d=new Date();
  for(;;){ var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    /* ⚠ 2026-09-25：原来只数「组」（sets），而她早不跑拷问式了，于是天天跟读也显示「连续 0 天」。现在只要那天有出过声就算。 */
    var rec = s.days[k];
    if(rec && ((rec.sets||0) > 0 || (rec.walk||0) > 0 || (rec.shadow||0) > 0)){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

/* ============================ 问题池 ============================
   只收**真正是问题**的那些：题面必须是英文、而且必须有完整答案 en。
   陷阱和相邻考点的中文标签不是问题，跳过。 */
function qlist(c){
  var out=[];
  (c.ask||[]).forEach(function(g){
    (g.items||[]).forEach(function(x){
      if(!x.q||!x.en) return;
      /* ⚠ 2026-09-23 她：「不应该有中文的 应该全部都是英文」「英文才是要背的」。
         查出来 23 条是「中文前缀 ＋ 干净英文题」，例如
         「（陷阱）Enzymes shift the equilibrium」「（走向 Kd）You mentioned a quantity…」。
         原来这一行看到开头有中文就整条跳过 —— **这 23 条英文题在演练台里一次都抽不到**。
         现在先把前缀剥掉；剥完还是纯英文就收，题目用剥干净的那一版。
         ⚠ 剩下的中文题（纯中文标签 46 条、指路 → 22 条）仍然跳过：
         那些本来就不是题，是给她自己看的标记。 */
      var q2 = String(x.q).replace(/^（[^）]{1,12}）\s*/, '');
      if(CJK.test(q2)) return;
      x = (q2 === x.q) ? x : {q:q2, en:x.en, ez:x.ez, ezcn:x.ezcn, cn:x.cn, warn:x.warn, r:x.r};
      out.push({q:x.q, en:x.en, ez:x.ez||'', ezcn:x.ezcn||'', cn:x.cn||'', warn:x.warn||'', g:g.g||'', r:x.r||''});
    });
  });
  return out;
}
function cardTitle(c){ return strip(c.qcn||c.q||c.id); }
/* 卡面题是英文就用它开场（那才是考官真会念的那一句）；是中文就退回抽一道追问。
   主问题的「标准答案」用这张卡的**逐字稿 segs** —— 那本来就是整题出声说一遍的版本，
   比落点 end 完整得多，漏词表也才有足够的关键词可比。segs 没有就退回 end。 */
/* ⚠ 2026-09-22 实测之后改的。上一版把**整份逐字稿**（有的卡十二段、七百多词）
   当成主问题的标准答案，于是屏幕上是一堵墙，分数也没意义。
   现在分两层：
   · en   ＝ 只取<b>第一段</b>（那一段本来就是「定义 ＋ 开口」），用来算漏词、挑要补的句子；
   · full ＝ 整份逐字稿，收进折叠里，想看再点。 */
function segParas(c){
  var out = [];
  (c.segs||[]).forEach(function(s){ out.push((s.p||[]).map(strip).join(' ')); });
  return out.filter(function(x){ return x; });
}
function mainOf(c, pool){
  if(c.q && !CJK.test(c.q)){
    var ps = segParas(c);
    return {q:strip(c.q), en:(ps[0] || strip(c.end||'')), full:ps.join('\n\n'),
            cn:'', warn:'', g:'卷面题 · 开口那一段', r:'高', isMain:1};
  }
  return pool[0];
}

/* ============================ 关键词与漏检 ============================
   ⚠ 这是线索，不是判决。语音识别会把 oxaloacetate 听成别的东西，
   所以只比**前 5 个字母**，而且原始转录一定显示出来给她自己判断。 */
var STOP = (' about above after again against already also although always among another answer '
+ 'because become becomes been before begin behind being below between both bring build built '
+ 'called cannot carry carries change changes come comes could course different does doing done '
+ 'down during each either enough even every example first follow following from gives given goes '
+ 'going have having here high higher important into itself just keep keeps kind know large last '
+ 'later leave less like little long look made make makes many means might more most much must '
+ 'need needs never next nothing often once only other others over part parts place point points '
+ 'possible practice question rather really reason right same says second sense several should '
+ 'since small some something still such take takes tell than that their them then there these '
+ 'they thing things think this those three through thus time times together under until upon '
+ 'used uses using usually very want well were what when where which while will with within '
+ 'without work works would your '
/* ⚠ 2026-09-23 补的一批。她第一次把成绩粘过来：20 题里 18 题报「漏 12–16 / 16」，
   均匀地全漏 —— 那不像一个人的表现，像一把坏尺子。查下来「关键词」里混着
   textbook / practically / principle / material / starting / backwards 这种词：
   她永远不会说出口，也不该说。**这些不是知识点，是写答案的语气。** */
+ 'textbook practically principle material starting backwards describes actually '
+ 'generally usually instead however therefore whether although besides moreover '
+ 'therefore chapter section above below earlier later simply merely rather '
+ 'entirely completely exactly roughly approximately typically commonly '
+ 'answer answers asked asking saying speak spoken sentence explain explains '
+ 'means meaning matter matters worth notice noticed remember '
+ 'difference differences differ differs similar similarly '
+ 'consequence consequences result results follows therefore '
+ 'happens happened happening runs running goes going '
+ 'number numbers amount amounts level levels '
+ 'whole entire single double triple half '
+ 'below above outside inside around across along '
+ 'their theirs itself themselves ').split(' ');
var STOPSET = {}; STOP.forEach(function(w){ if(w) STOPSET[w]=1; });

/* ⚠ 2026-09-22 实测之后加的上限。第一版不封顶，于是卡 17 的主问题
   （标准答案是整份十二段逐字稿）一口气算出 200 多个关键词，
   整屏报「说到 9%」——那个数字没有意义，只会让人崩溃。
   现在：按词长倒序取前 MAXT 个（长词更可能是真正的专业词），最多 16 个。
   漏 16 个里的 5 个，是一句能听懂的话；漏 200 个里的 180 个，不是。 */
/* ⚠ 2026-09-23 改了两处，起因是她第一份成绩单：20 题里 18 题「漏 12–16 / 16」。
   ① **不再按词长倒序。** 昨天我写「长词更可能是真正的专业词」—— 听起来有道理，
      实际上把 practically(11) 排在 lactate(7) 和 glucose(7) 前面，
      而且**长词恰恰是语音识别最容易听坏的**。
      改成**按出现顺序**：卡上每个答案的第一句就是定义（C1），
      所以**先出现的词本来就是最中心的词**。
   ② **上限 16 → 10。** 「漏 3 / 10」是一句能读懂的话，「漏 12 / 16」是噪音。 */
var MAXT = 10;
function terms(en){
  var t = strip(en).toLowerCase().replace(/[‘’“”]/g,' ');
  var ws = t.match(/[a-z][a-z-]{4,}/g) || [];
  var seen={}, out=[];
  ws.forEach(function(w){ w=w.replace(/-/g,''); if(w.length<5) return;
    if(STOPSET[w]) return; if(seen[w]) return; seen[w]=1; out.push(w); });
  return out.slice(0, MAXT);
}
function heard(t, said){
  /* 只比前 5 个字母 —— 识别把词尾听错是常态，词头很少错。 */
  return said.indexOf(t.slice(0,5)) !== -1;
}
function missOf(en, transcript){
  var said = ' ' + strip(transcript).toLowerCase().replace(/[^a-z]+/g,' ') + ' ';
  var ts = terms(en), miss=[], hit=[];
  ts.forEach(function(t){ (heard(t,said)?hit:miss).push(t); });
  return {miss:miss, hit:hit, total:ts.length};
}
/* 追问怎么挑：她**最没说到**的那几条排前面。 */
function rankFollow(pool, transcript){
  var said = ' ' + strip(transcript).toLowerCase().replace(/[^a-z]+/g,' ') + ' ';
  return pool.map(function(x){
    var ts = terms(x.q + ' ' + x.en), n=0;
    ts.forEach(function(t){ if(heard(t,said)) n++; });
    return {x:x, cov: ts.length ? n/ts.length : 1};
  }).sort(function(a,b){ return a.cov-b.cov; }).map(function(o){ return o.x; });
}

/* ============================ 朗读 ============================
   她 2026-09-22：「一定要真人语音提问」。
   ⚠ 说实话：浏览器里拿不到真人录音。能拿到的最接近的是**神经网络语音**
   （Windows / Edge 上名字里带 Natural 或 Online 的那些，例如 Sonia、Libby、Ryan），
   它们跟早年的机器音完全不是一回事，听感接近真人。
   所以这里做两件事：① 排序时把 Natural / Online / Neural / Premium / Enhanced 排最前；
   ② 给一个下拉框让她自己挑最像人的那一个，选择存下来。 */
var VOICE=null;
function voiceScore(v){
  var n=(v.name||'')+' '+(v.voiceURI||''), s=0;
  if(/natural|neural|online|premium|enhanced/i.test(n)) s+=100;
  if(/^en[-_]GB/i.test(v.lang)) s+=20;          /* 捷克考场上英音更常见 */
  else if(/^en[-_](IE|AU)/i.test(v.lang)) s+=12;
  else if(/^en[-_]US/i.test(v.lang)) s+=10;
  else if(/^en/i.test(v.lang)) s+=4;
  if(/google/i.test(n)) s+=6;
  if(/compact|espeak/i.test(n)) s-=30;
  return s;
}
function enVoices(){
  if(!window.speechSynthesis) return [];
  return (speechSynthesis.getVoices()||[]).filter(function(v){ return /^en/i.test(v.lang); })
    .sort(function(a,b){ return voiceScore(b)-voiceScore(a); });
}
function pickVoice(){
  var vs = enVoices(); if(!vs.length) return null;
  var want = (st().voice||'');
  for(var i=0;i<vs.length;i++) if(vs[i].name===want) return vs[i];
  return vs[0];
}
if(window.speechSynthesis){
  VOICE = pickVoice();
  speechSynthesis.onvoiceschanged = function(){ VOICE = pickVoice(); var s=$('vsel'); if(s) paintVoices(); };
}
function paintVoices(){
  var sel=$('vsel'); if(!sel) return;
  var vs=enVoices();
  sel.innerHTML = vs.map(function(v){
    var human = /natural|neural|online|premium|enhanced/i.test(v.name+v.voiceURI);
    return '<option value="'+esc(v.name)+'"'+(VOICE&&v.name===VOICE.name?' selected':'')+'>'
      + (human?'★ ':'') + esc(v.name) + ' · ' + esc(v.lang) + '</option>';
  }).join('') || '<option>（这个浏览器没有英文语音）</option>';
  sel.onchange = function(){
    var s2=st(); s2.voice=sel.value; save(s2); VOICE=pickVoice();
    say('Explain the functioning of the Lac and Trp operons.');
  };
}
function say(text, cb){
  if(!window.speechSynthesis){ if(cb) cb(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var u = new SpeechSynthesisUtterance(strip(text));
  if(VOICE) u.voice = VOICE;
  u.lang = (VOICE && VOICE.lang) || 'en-GB';
  u.rate = 0.95;
  u.onend = u.onerror = function(){ if(cb) cb(); };
  speechSynthesis.speak(u);
}

/* ============================ 转录 ============================ */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec=null, recWant=false, finalTxt='', interimTxt='';
function recStart(){
  if(!SR) return false;
  recWant = true;
  if(rec) { try{ rec.stop(); }catch(e){} }
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = 'en-GB'; rec.maxAlternatives = 1;
  rec.onresult = function(e){
    interimTxt='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var r=e.results[i];
      if(r.isFinal) finalTxt += r[0].transcript + ' ';
      else interimTxt += r[0].transcript;
    }
    paintLive();
  };
  /* Chrome 在静音一段时间之后会自己停。只要计时还在跑就重新开起来。 */
  rec.onend = function(){ if(recWant){ try{ rec.start(); }catch(e){} } };
  rec.onerror = function(e){
    if(e && (e.error==='not-allowed'||e.error==='service-not-allowed')){
      recWant=false; var l=$('live'); if(l) l.innerHTML='<b class="miss">麦克风被拒了。</b>浏览器地址栏左边点一下，允许麦克风，然后刷新。';
    }
  };
  try{ rec.start(); }catch(e){}
  return true;
}
function recStop(){ recWant=false; if(rec){ try{ rec.stop(); }catch(e){} } rec=null; }
function paintLive(){
  var l=$('live'); if(!l) return;
  l.innerHTML = esc(finalTxt) + '<span class="interim">' + esc(interimTxt) + '</span>'

/* 她 2026-09-22：「一共五个问题卡，其中两个一定是分子生物学 / pesb」。
   分子生物学 ＝ mb-*；PESB ＝ pe-* 再加 taq 和 land
   （题库里 #5 Taq/Kapa 和 #7 fitness landscape 都归在「K · 书外（实验室）」，
    而且都是 w3，属于她自己的日常工作那一块）。
   ⚠ 卡的 id 用的是连字符（mb-ko、pe-clone、x-meta），不是下划线——别写错。 */
function isMBPE(c){
  var id = c.id||'';
  return /^mb-/.test(id) || /^pe-/.test(id) || id==='taq' || id==='land';
}
function takeFrom(pool, doneToday, n){
  /* 今天还没过的优先；不够了再从过过的里面补（那时问题是新的）。 */
  var fresh = shuffle(pool.filter(function(c){ return !doneToday[c.id]; }));
  var used  = shuffle(pool.filter(function(c){ return  doneToday[c.id]; }));
  return fresh.concat(used).slice(0, n);
}

function buildSet(nCards, nFollow){
  var s = st(), d = today(), rec0 = dayRec(s, d);
  var usable = CARDS.filter(function(c){ return qlist(c).length > 0; });
  var doneToday = {}; rec0.cards.forEach(function(id){ doneToday[id]=1; });
  var newPass = false;
  if(usable.every(function(c){ return doneToday[c.id]; })){
    /* 今天已经把所有卡过了一遍 —— 开新的一遍 */
    s.passes++; rec0.cards = []; save(s); newPass = true; doneToday = {};
  }
  var mbpe  = usable.filter(isMBPE);
  var other = usable.filter(function(c){ return !isMBPE(c); });
  var want2 = Math.min(2, mbpe.length);
  var cards = takeFrom(mbpe, doneToday, want2);
  var seen={}; cards.forEach(function(c){ seen[c.id]=1; });
  cards = cards.concat(takeFrom(other.filter(function(c){ return !seen[c.id]; }), doneToday, nCards-cards.length));
  if(cards.length < nCards){    /* 万一别的不够，用 mb/pe 补满 */
    cards.forEach(function(c){ seen[c.id]=1; });
    cards = cards.concat(takeFrom(mbpe.filter(function(c){ return !seen[c.id]; }), doneToday, nCards-cards.length));
  }
  cards = shuffle(cards);       /* 摆出来的顺序还是随机的，别让她认出哪两张是保送的 */
  return {
    cards: cards.map(function(c){
      /* 问题级历史：没问过的排最前，其次最久没问的。 */
      var seen = s.asked;
      var pool2 = qlist(c).slice().sort(function(a,b){
        return (seen[c.id+'|'+hash(a.q)]||0) - (seen[c.id+'|'+hash(b.q)]||0);
      });
      return {card:c, pool:pool2, main:mainOf(c,pool2), asked:[], nFollow:nFollow};
    }),
    i:0, sub:0, log:[], newPass:newPass, nFollow:nFollow
  };
}

function ask(){

var seq = 0;

var timerId=null;
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function runClock(secs){
  var left=secs, tot=secs;
  if(timerId) clearInterval(timerId);
  timerId = setInterval(function(){
    left--;
    var cl=$('clock'); if(!cl){ clearInterval(timerId); return; }
    cl.textContent = fmt(Math.max(0,left));
    if(left<=15) cl.classList.add('low');
    var b=$('barfill'); if(b) b.style.width = Math.max(0,100*left/tot) + '%';
    if(left<=0){ clearInterval(timerId); doneAnswer(); }
  },1000);

function doneAnswer(){
  seq++;                       /* 作废掉还没回来的朗读回调 */

  var c=curCard(), q=curQ();
  var said = (finalTxt + ' ' + interimTxt).trim();
  var m = missOf(q.en || q.q, said);
  /* ⚠ 她说不上来的时候，屏幕不能甩一堆红字给她。
     实测那一组里她说了四次 “I'm not sure”，换回来的是 25 个漏词。
     现在：当场记成「答不上」（不用她再点一次），并且念一句。
     没录到声音的也一样处理 —— 沉默跟说不上来是同一件事。 */
  var gave = saidGiveUp(said) || !said;
  S.log.push({card:c.card.id, title:cardTitle(c.card), q:q.q, en:q.en, full:q.full||'',
              ez:q.ez||'', ezcn:q.ezcn||'', cn:q.cn, warn:q.warn,
              said:said, miss:m.miss, hit:m.hit.length, total:m.total, sub:S.sub,
              self:(gave ? 2 : null), gave:gave});

    var nu = $('nudge');

    say('That is fine. We will come back to it.');

     全部结束之后要用它算出「今天真正进步的那一条」。 */
  var s=st(); var qk = c.card.id+'|'+hash(q.q);
  s.asked[qk] = Date.now();
  s.qres = s.qres || {};
  S.log[S.log.length-1].prev = s.qres[qk] || null;
  save(s);

  if(S.sub===0){
    /* 主问答完，按「她最没说到什么」挑追问 */
    var rest = c.pool.filter(function(x){ return x!==c.main; });
    c.follow = rankFollow(rest, said).slice(0, c.nFollow);
    /* ⚠ 2026-09-23 她：「化学相关的所有内容都必须让我加强学习，
       因为我**有看见就绕道走的惯性**」。
       —— 光做一个「化学专练」按钮没用：**要她主动点的东西，她正好会绕开**。
       所以在正常的一组里也掺进来：**这张卡的第一个追问，如果池子里有化学题就先问它**。
       ⚠ 只提前一道，不多。她说「看着就发怵」，剂量大了她就不开这个页面了。 */
    if(c.follow.length > 1){
      var ci = -1;
      for(var k=0;k<c.follow.length;k++){
        var tx = strip(c.follow[k].q + ' ' + (c.follow[k].ez || c.follow[k].en || ''));

        if(mm && mm.length >= 3){ ci = k; break; }

      if(ci > 0){ var pick = c.follow.splice(ci,1)[0]; c.follow.unshift(pick); }
    }

  /* ⚠ 两个模式在这里分岔。带答案模式先给 20 秒，纯拷问模式直接下一题。 */
  var s2 = st();
  if((s2.mode || 'answer') === 'answer' && (s2.ansSecs == null ? 20 : s2.ansSecs) > 0){
    revealAnswer(S.log[S.log.length-1]);
  } else {
    advanceQ();
  }

/* ⚠ 2026-09-23 她：「给我的所有出口演练都按一个**上一题按钮**」。
   退回去有一个坑：每答一题都会往 S.log 里推一条，**退回去重答会推第二条**，
   报告里同一题就出现两次。所以退回去的时候**先把那一题旧的记录删掉**，
   重答的那次就直接替换它。 */
function backQ(){
  if(!S) return;
  if(revealTimer){ clearInterval(revealTimer); revealTimer = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  recStop(); stopNudges();
  if(S.sub > 0){
    S.sub--;
  } else if(S.i > 0){
    S.i--;
    var c0 = S.cards[S.i];
    S.sub = c0.follow ? c0.follow.length : 0;   /* 回到上一张卡的最后一问 */
  } else {
    return;                                     /* 已经是第一题 */
  }
  /* 把要回去那一题的旧记录去掉，免得报告里出现两次 */
  var c = curCard(), q = curQ();
  if(q && S.log){
    S.log = S.log.filter(function(x){
      return !(x.card === c.card.id && x.q === q.q);
    });
  }
  ask();
}
function canBack(){ return !!(S && (S.sub > 0 || S.i > 0)); }

function advanceQ(){
  if(revealTimer){ clearInterval(revealTimer); revealTimer = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var c = curCard();
  S.sub++;
  if(S.sub > (c.follow ? c.follow.length : 0)) nextCard(); else ask();
}

function nextCard(){
  var s=st(), d=today(), r=dayRec(s,d);
  var c=curCard();
  if(r.cards.indexOf(c.card.id)===-1) r.cards.push(c.card.id);
  save(s);
  S.i++; S.sub=0;
  if(S.i>=S.cards.length) finish(); else ask();
}

  seq++;

}

function finish(){
  var s=st(), d=today(), r=dayRec(s,d);
  r.sets++; r.qs += S.log.length;
  S.log.forEach(function(x){ r.miss += x.miss.length; });

  /* ⚠ 2026-09-22 她说：「那这个直接当作学习进度吧，我自己去背开头那个卡实在是没有动力」。
     规矩一要的三个数（昨天出声练了几张 · 哪几张漏超过 2 条 · 有没有一张连着两次漏同样的点）
     从今天起<b>量出来</b>，不再靠她自己报——她一直报 0，正是因为那件事得先由她自己做。
     第三个数需要历史：每张卡每次的漏词存下来，只留最近两次，交集就是「连着两次漏同样的点」。 */
  s.missHist = s.missHist || {};
  var byCard = {};
  S.log.forEach(function(x){
    byCard[x.card] = byCard[x.card] || {};
    x.miss.forEach(function(w){ byCard[x.card][w] = 1; });
  });
  s.repeat = s.repeat || {};
  Object.keys(byCard).forEach(function(id){
    var now = Object.keys(byCard[id]);
    var h = s.missHist[id] || [];
    var prev = h.length ? h[h.length-1] : null;
    if(prev){
      var again = now.filter(function(w){ return prev.indexOf(w)!==-1; });
      if(again.length) s.repeat[id] = again; else delete s.repeat[id];
    }
    h.push(now); while(h.length>2) h.shift();
    s.missHist[id] = h;
  });

  /* 她 2026-09-22：「我觉得这个练习过的能不能也储存起来」。
     每一组都留下来，最多 60 组（再多就没人看了，也怕把 localStorage 撑爆）。 */
  /* 这一次每道题的结果写回 qres，下次才比得出进步。 */
  s.qres = s.qres || {};
  S.log.forEach(function(x){
    s.qres[x.card + '|' + hash(x.q)] = {self:x.self, gave:!!x.gave, ts:Date.now()};
  });
  var key = String(Date.now());
  var names = S.cards.map(function(cc){ return cc.card.id; }).join(' ');
  /* ⚠ 瘦记录：答案原文（en / full / ezcn / cn / warn）不进历史 ——
     它们在 data/*.js 里，看的时候按 card ＋ q 捞回来就行。
     带着存：一组 42 KB；不带：一组 12 KB。60 组的差别是 2.4 MB 对 0.7 MB。 */
  var slim = S.log.map(function(x){
    return {card:x.card, title:x.title, q:x.q, said:x.said, miss:x.miss,
            total:x.total, self:x.self, gave:!!x.gave, sub:x.sub};
  });
  var pack = {key:key, when:new Date().toISOString(), cards:names, log:slim,
              secs:Math.round((Date.now() - (S.startedAt||Date.now()))/1000)};
  s.hist = s.hist || [];
  s.hist.push(pack);          /* 不设上限 —— 满了由 save() 丢最老的 */
  s.last = pack;
  save(s);
  report(false);
}

/* 把一段英文切成句子。不用 lookbehind（老 Safari 会直接报语法错，整页死掉）。 */
function splitSent(t){
  var s = strip(t).replace(/[“”"]/g,'');
  var parts = s.split(/([.?!])\s+/), out=[], cur='';
  for(var i=0;i<parts.length;i++){
    cur += parts[i];
    if(/^[.?!]$/.test(parts[i])){ out.push(cur.trim()); cur=''; }
  }
  if(cur.trim()) out.push(cur.trim());
  return out.filter(function(x){ return x.length>12; });
}
/* ⚠ 这是这一屏改动的核心。她 2026-09-22：「反馈还是太机械化了，罗列出所有原答案，
   我看着就很崩溃」。所以不再给她一串漏掉的**单词**，也不默认摊开整段标准答案——
   而是从答案里挑出<b>包含这些漏词的那一两个完整句子</b>：那是她下次真正要说出口的东西。
   优先用 ez（每句 ≤15 词，本来就是最短版），没有 ez 才退回 en。 */
function toFix(item, n){
  var src = item.ez || item.en || '';
  var ss = splitSent(src);
  if(!ss.length){ src = item.en || ''; ss = splitSent(src); }
  if(!ss.length) return [];
  /* ⚠ 2026-09-22 她：「定义这个千万不能省」。她说得对，这是这一屏的一个真漏洞：
     把答案压成「你漏掉的那几句」之后，如果那句定义她正好说到了，它就不会被选中，
     于是整屏再也看不到定义 —— 而她这一整天立的规矩就是「任何东西都先定义」，
     卡上每个答案的**第一句就是定义**（C1，见 PREMISES）。
     所以：**第一句永远在，而且不参与评分**，后面再按漏得多少补一两句。 */
  var out = [{s:ss[0], k:0, def:true}];
  var scored = ss.slice(1).map(function(s2){
    var low = ' ' + s2.toLowerCase().replace(/[^a-z]+/g,' ') + ' ', k=0;
    item.miss.forEach(function(w){ if(low.indexOf(w.slice(0,5))!==-1) k++; });
    return {s:s2, k:k};
  }).filter(function(o){ return o.k>0; }).sort(function(a,b){ return b.k-a.k; });
  return out.concat(scored.slice(0, n||2));
}
/* ⚠ 2026-09-22 她：「而且定义一定要标出来」。
   不只是那个「下次怎么说」的框 —— **凡是这一页上出现完整答案的地方，
   第一句（定义）都要一眼看得见**。她这一整天立的规矩就是「任何东西都先定义」，
   而定义在卡上永远是答案的第一句（C1，见 PREMISES）。 */
function markDef(txt){
  var s = strip(txt).replace(/^["“]/, '').replace(/["”]$/, '');
  var ss = splitSent(s);
  if(!ss.length) return esc(s);
  var first = ss[0], at = s.indexOf(first);
  var rest = at < 0 ? '' : s.slice(at + first.length);
  return '<b class="defhl"><span class="deftag2">定义</span>' + esc(first) + '</b>' + esc(rest);
}

/* 句子里把漏掉的词标出来 */
function hl(s2, miss){
  var out = esc(s2);
  miss.slice(0,14).forEach(function(w){
    var re = new RegExp('(' + w.slice(0,5).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[a-z-]*)', 'ig');
    out = out.replace(re, '<u class="mw">$1</u>');
  });
  return out;
}

/* 历史里只有瘦记录，看的时候按 card ＋ q 把答案从卡里捞回来。
   捞不到（那张卡改过、那道题被改写了）就只显示她说过的话，不假装有答案。 */
function hydrate(log){
  return log.map(function(x){
    if(x.en) return x;                       /* 刚做完的那一组本来就带着 */
    var c = null;
    for(var i=0;i<CARDS.length;i++) if(CARDS[i].id===x.card){ c=CARDS[i]; break; }
    var y = {}; for(var k in x) y[k]=x[k];
    if(!c){ y.en=''; return y; }
    var hit = null;
    qlist(c).forEach(function(it){ if(!hit && it.q===x.q) hit=it; });
    if(hit){ y.en=hit.en; y.ez=hit.ez; y.ezcn=hit.ezcn; y.cn=hit.cn; y.warn=hit.warn; }
    else if(x.sub===0){                      /* 卷面题：从逐字稿第一段来 */
      var ps = segParas(c);
      y.en = ps[0] || strip(c.end||''); y.full = ps.join('\n\n');
    } else { y.en=''; }
    return y;
  });
}

/* ============================ 结果 · 只在这里给答案 ============================
   ⚠ 2026-09-22 她实测一组之后：「反馈还是太机械化了，罗列出所有原答案，
   这很好，但是我看着就很崩溃了」。
   所以这一屏的规矩变成：**先给你要补的那一两句，别的全部收起来。** */

var RLOG = [];      /* 当前正在显示的这一组 */
var RKEY = '';      /* 它在历史里的键，自评要写回去 */

function report(fromHome, hist){
  recStop();
  var s = st();
  var pack = hist || (fromHome ? s.last : {when:new Date().toISOString(), log:S.log, key:(s.last&&s.last.key)});
  var log = hydrate((pack && pack.log) || []);
  if(!log.length){
    $('main').innerHTML = '<div class="card">还没有结果。<p><button class="main" onclick="home()">回去</button></p></div>';
    return;
  }
  RLOG = log; RKEY = (pack && pack.key) || '';
  SH = []; shQueue = null; shBusy = false;

  /* 按「漏得最多」排前面 —— 她只读前两条就该停。 */
  var order = log.map(function(x,i){ return {x:x, i:i,
      bad: x.total ? x.miss.length / x.total : 0 }; })
    .sort(function(a,b){ return b.bad - a.bad; });

  var graded = log.filter(function(x){ return x.self; }).length;
  var ok = log.filter(function(x){ return x.self===0; }).length;
  var gv = log.filter(function(x){ return x.gave || x.self===2; }).length;
  var line = '这一组我陪你走完了。' + log.length + ' 题里，'
    + (gv ? '有 ' + gv + ' 题你当场说了说不上——那几题明天还会来。' : '你每一题都开口了。')
    + (ok ? ' 你自己标了 ' + ok + ' 题是答得出的。' : '');
  /* ⚠ 今天真正进步的那一条。不是分数，是一件具体的事。
     判据：上一次这道题她说不上（gave 或自评答不上），这一次她说出来了。 */
  var win = null;
  log.forEach(function(x){
    if(win) return;
    var p = x.prev;
    if(p && (p.gave || p.self===2) && !x.gave && x.said && x.said.length > 30) win = x;
  });
  var winLine = win
    ? '⭑ 今天真正的进步是这一条：上次「' + esc(strip(win.q).slice(0,52))
      + '」你说不上来，<b>这次你说出来了</b>。'
    : '';
  var h = '<div class="card">'
    + '<p class="hello">' + line + '</p>'
    + (winLine ? '<p class="win">' + winLine + '</p>' : '')
    + '<b style="font-size:19px">这一组说完了 · ' + log.length + ' 题</b>'
    + '<div class="small">下面按「差得最多」排。<b>只读前两条也行</b>，别从头读到尾。</div>'
    + '<div class="small" style="margin-top:8px">⚠ 识别会把专业词听坏（helicase 听成 hello kiss 这种），'
    + '所以<b>机器算的漏词只是线索</b>。每题下面有三个自评键，<b>那个才是进度</b>。'
    + '已评 <b id="gcount">' + graded + '</b> / ' + log.length + '</div>'
    + '<p style="margin:14px 0 0"><button class="main" onclick="home()">回首页</button> '
    + '<button onclick="copyOut()">复制进度给老师</button></p></div>'
    /* ⚠ 2026-09-23：纠错这一屏不该是一堵要读的墙。她说「阅读困难…不然强制性必须
       录音念一遍？」—— 所以这里给一个走完全程的按钮，她一句都不用读。 */
    + '<div class="card shbar"><b>读不进去就别读 —— 跟着念</b>'
      + '<div class="small">它念一句，你跟一句。说到的词标绿，没说到的标红，'
      + '<b>原话一定显示出来</b>（识别会听坏专业词，以你自己听到的为准）。</div>'
      + '<p style="margin:12px 0 0"><button class="main" id="shall" onclick="shAll()">▶ 跟着念完这一组</button> '
      + '<span class="small">今天已经跟读 <b id="shdone">0</b> 句</span></p></div>';

  order.forEach(function(o){
    var x = o.x, idx = o.i;
    var fixes = toFix(x, x.gave ? 1 : 2);
    if(x.gave && !fixes.length){
      var ss0 = splitSent(x.ez || x.en || '');
      if(ss0.length) fixes = [{s:ss0[0], k:0}];
    }
    h += '<div class="card" data-card="' + esc(x.card) + '" data-i="' + idx + '">'
      + '<div class="small">' + esc(x.title) + (x.sub ? ' · 追问 ' + x.sub : ' · 主问题') + '</div>'
      + '<p class="q" style="font-size:17px" onclick="sayEl(this)">' + esc(x.q) + '</p>';

    if(fixes.length){
      /* ⚠ 2026-09-22 她：「下次一定要说出口这里我感觉扎眼一看很云里雾里」。
         她是对的：原来这个框就是三句没有说明的英文 —— 定义和「你漏的」长得一模一样，
         划线是什么意思没写，整框一个中文字都没有。她刚说完两分钟英文，
         扑面又是一堆英文，看不懂是正常的。
         现在：每一句上面有一行中文说明它是什么，划线的含义写出来，
         再给一个中文对照（卡上本来就有 ezcn，之前没取）。 */
      h += '<div class="fix">'
         + '<b class="small">这一题，下次开口就按这个顺序说</b>'
         + fixes.map(function(f, fi){
             var head = f.def
               ? '① 先说定义 —— 不管他问什么，这一句永远是第一句'
               : (fixes.length>1 ? '② 这一句你这次没说出口' : '① 这一句你这次没说出口');
             var si = shReg(f.s);
             return '<div class="fixrow' + (f.def?' defline':'') + '">'
               + '<span class="fixtag">' + (f.def ? '<span class="deftag2">定义</span>' : '') + head + '</span>'
               + '<p class="sayit' + (f.def?' defbig':'') + '" onclick="sayEl(this)">' + hl(f.s, x.miss) + '</p>'
               + '<div class="shb"><button id="shb' + si + '" onclick="shadow(' + si + ')">🎤 跟读这一句</button>'
                 + '<span class="st" id="shs' + si + '"></span></div>'
               + '<div id="sh' + si + '"></div>'
               + '</div>'; }).join('')
         + (x.miss.length ? '<p class="fixnote">划线的词 ＝ 机器认为你没说出口。'
             + '⚠ 它会把专业词听错（helicase 听成 hello kiss），所以<b>以你自己的录音为准</b>。'
             + '点句子可以听它念一遍。</p>' : '')
         + (x.ezcn ? '<details><summary>中文对照（这一整题在说什么）</summary>'
             + '<div class="small" style="line-height:1.9">' + x.ezcn + '</div></details>' : '')
         + '</div>';
    } else if(x.gave){
      h += '<div class="fix"><b class="small">这一题你说了说不上。</b> 下次先把这一句说出口就够了。</div>';
    } else if(!x.said){
      h += '<div class="fix"><b class="small">这一题没录到声音。</b></div>';
    } else {
      /* ⚠ 就算她全说到了，定义那一句也要摆出来 —— 「定义千万不能省」。 */
      var d0 = splitSent(x.ez || x.en || '')[0];
      h += '<div class="hit small" style="margin:10px 0"><b>关键的几个词你都说到了。</b></div>'
        + (d0 ? '<div class="fix"><b class="small">这一题，下次开口就按这个顺序说</b>'
            + (function(){ var si = shReg(d0);
                return '<div class="fixrow defline"><span class="fixtag">'
                + '<span class="deftag2">定义</span>① 先说定义 —— 不管他问什么，这一句永远是第一句</span>'
                + '<p class="sayit defbig" onclick="sayEl(this)">' + esc(d0) + '</p>'
                + '<div class="shb"><button id="shb' + si + '" onclick="shadow(' + si + ')">🎤 跟读这一句</button>'
                  + '<span class="st" id="shs' + si + '"></span></div>'
                + '<div id="sh' + si + '"></div></div>'; })()
            + (x.ezcn ? '<details><summary>中文对照（这一整题在说什么）</summary>'
                + '<div class="small" style="line-height:1.9">' + x.ezcn + '</div></details>' : '')
            + '</div>' : '');
    }

    h += '<div class="gr">'
       + ['答得出','答一半','答不上'].map(function(lab,k){
           return '<button class="' + (x.self===k ? 'sel' : '') + '" onclick="grade(' + idx + ',' + k + ',this)">'
                + lab + '</button>'; }).join('')
       + '</div>'
      + '<details><summary>你刚才说的</summary><div class="said">'
        + (x.said ? esc(x.said) : '<i class="small">没有录到</i>') + '</div></details>'
      + '<details><summary>完整答案（定义那一句已经标出来了）</summary>'
        + '<div class="ans sayit" onclick="sayEl(this)">' + markDef(x.en) + '</div>'
        + (x.full ? '<div class="ans sayit" onclick="sayEl(this)" style="opacity:.85">'
            + x.full.split('\n\n').map(function(p,pi){
                return pi===0 ? markDef(p) : esc(p); }).join('<br><br>') + '</div>' : '')
        + (x.warn ? '<div class="warnbox">' + x.warn + '</div>' : '')
        + (x.cn ? '<div class="small">' + x.cn + '</div>' : '')
      + '</details>'
      + (x.miss.length && !x.gave
          ? '<details><summary>机器认为没说到的词（' + x.miss.length + ' 个 · 可能误判）</summary><div>'
            + x.miss.map(function(w){ return '<span class="pill">' + esc(w) + '</span>'; }).join(' ')
            + '</div></details>'
          : '')
      + '</div>';
  });
  h += '<p class="small">选中任意一段英文，会冒出「★ 加进必背」—— 标了的会出现在主 app 的 ★ 必背里。'
     + '<br>点一句英文就念那一句。</p>';
  $('main').innerHTML = h;
  shCount();
}

/* ============================ 跟读 ============================
   ⚠ 2026-09-23 她：「整体纠错的时候，又有点阅读困难了…不然强制性必须录音念一遍？」
   她自己给出了正确答案 —— 这个工具的前提就是她读不进去但说得出来，
   而我把纠错屏做成了一堵要读的墙。所以这一屏也改成「跟着说」。 */
var SH = [];            /* 这一屏所有要跟读的句子 */
var shBusy = false, shQueue = null;

function shReg(s){ SH.push(s); return SH.length - 1; }

function shadow(i, auto){
  if(shBusy) return;
  var s2 = SH[i]; if(!s2) return;
  shBusy = true;
  var box = $('sh' + i);
  /* ⚠ 这里原来叫 st，把全局的 st() 函数遮住了。改名 lbl。 */
  var lbl = $('shs' + i);
  if(lbl) lbl.textContent = '在念给你听…';
  say(s2, function(){
    if(lbl) lbl.textContent = '⏺ 该你了，跟着说一遍';
    finalTxt = ''; interimTxt = '';
    recStart();
    /* 给的时间按句子长度来：每个词一秒，最少 8 秒，最多 30 秒。 */
    var secs = Math.max(8, Math.min(30, s2.split(/\s+/).length));
    setTimeout(function(){
      recStop();
      var said = (finalTxt + ' ' + interimTxt).trim();
      shShow(i, s2, said);
      shBusy = false;
      shCount();
      if(auto) shNext();
    }, secs * 1000);
  });
}

function shShow(i, sent, said){
  var low = ' ' + strip(said).toLowerCase().replace(/[^a-z]+/g,' ') + ' ';
  var words = sent.split(/(\s+)/);
  var hit = 0, tot = 0, html = '';
  words.forEach(function(w){
    var bare = w.toLowerCase().replace(/[^a-z]/g,'');
    if(bare.length < 4 || STOPSET[bare]){ html += esc(w); return; }
    tot++;
    var ok = low.indexOf(bare.slice(0,5)) !== -1;
    if(ok) hit++;
    html += '<span class="' + (ok?'ok':'no') + '">' + esc(w) + '</span>';
  });
  var box = $('sh' + i);
  if(box) box.innerHTML = '<div class="shres">' + html
    + '<span class="raw">识别听到的：' + (said ? esc(said) : '（没录到）') + '</span></div>';
  var lbl = $('shs' + i);
  if(lbl) lbl.innerHTML = tot ? ('说到 <b>' + hit + ' / ' + tot + '</b> 个词') : '';
  var b = $('shb' + i);
  if(b){ b.textContent = '再念一遍'; }
  var s3 = st();
  s3.shadow = (s3.shadow||0) + 1;
  var d = today(); var r = dayRec(s3, d); r.shadow = (r.shadow||0) + 1;
  save(s3);
}
function shCount(){
  var el = $('shdone'); if(!el) return;
  var s3 = st(), d = today(), r = s3.days[d] || {};
  el.textContent = (r.shadow || 0);
}

/* 一句接一句走完，她全程不用读。 */
function shAll(){
  if(shQueue !== null){ shQueue = null; var b=$('shall'); if(b) b.textContent='▶ 跟着念完这一组'; return; }
  shQueue = 0; var b=$('shall'); if(b) b.textContent='⏸ 停下';
  shNext();
}
function shNext(){
  if(shQueue === null) return;
  if(shQueue >= SH.length){
    shQueue = null;
    var b=$('shall'); if(b) b.textContent='✓ 这一组念完了';
    say('Good. That is the whole set.');
    return;
  }
  var i = shQueue++;
  var el = $('sh' + i);
  if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'center'});
  setTimeout(function(){ shadow(i, true); }, 400);
}

/* ======================= 🧪 化学专练 =======================

function bare(w){ return String(w||'').toLowerCase().replace(/[\u2019\u02bc']s(?![a-z])/g,'').replace(/[^a-z]/g,''); }
/* ⚠ 2026-09-23 这两行也被我误删过，演练台的「跟读这一份」因此一点就没反应

function isKey(w){ var k = bare(w); return !!(k && WK && WK.keys[k]); }
/* ⚠ 2026-09-23 改成「涂掉」：原词还在，只是被浅褐色盖住，点一下露出来。
   标点留在外面不盖，不然一行全是褐块，看不出断句。 */

function pickKey(card, sent){ return card + '|' + hash(strip(sent)); }

/* mode: read 全文可点 · cloze 关键词挖掉（点空格可以偷看一个）· keys 只留关键词 · blind 全遮 */
function wkText(mode){

    var ss = splitSent(WK.src);
    return '<p class="wktxt">' + ss.map(function(s2){
      var ks = s2.split(/\s+/).filter(isKey).map(function(w){ return '<span class="wd kw" onclick="sayW(this)">' + esc(w.replace(/[^A-Za-z-]+$/,'')) + '</span>'; });

     能不能还是**变成一段**？」——上一版每句一个 <p>（块级），当然一句一行。
     现在是**一个 <p> 里一串 <span class="sent">**：版面回到一整段，

  var cid = (WK && WK.cardId) || '';

    /* ⚠ 兼容：并短句之前挑的那些，键是按老的切法算的。老键也认一下，

      + '<b class="pk" data-s="' + escAttr2(s2) + '" onclick="pickToggle(\'' + cid + '\', \'' + k + '\', this)">'
      + (on ? '★' : '☆') + '</b>' + body + '</span>';

/* 按句切，但**一个字都不丢**。
   ⚠ splitSent() 会把 12 个字以内的句子**整句扔掉** —— 那个函数原本只用来挑句子，
   扔掉短句无所谓；但跟读的正文是她**要照着读**的，扔字就是错。
   这里太短的并进上一句。 */
function sentsKeep(t2){
  var out = splitAllSent(t2), res = [];

function splitAllSent(t2){
  var s2 = strip(t2).replace(/[“”"]/g, '');
  var parts = s2.split(/([.?!])\s+/), out = [], cur = '';
  for(var i=0;i<parts.length;i++){
    cur += parts[i];
    if(/^[.?!]$/.test(parts[i])){ out.push(cur.trim()); cur = ''; }
  }
  if(cur.trim()) out.push(cur.trim());

function escAttr2(s){ return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function sayW(el){ var t2 = (el.textContent||'').replace(/[^A-Za-z-]+$/,''); if(t2) say(t2); }

/* 录：转录（Web Speech）＋ 真录音（MediaRecorder，能回放）。两个都开，哪个不行就少哪个。 */
function wkRecStart(){
  finalTxt=''; interimTxt=''; recStart();
  WREC.chunks = []; WREC.mr = null; WREC.stream = null;
  if(navigator.mediaDevices && window.MediaRecorder){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      if(!WK || !WK.busy){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
      var mr = new MediaRecorder(stream);
      WREC.mr = mr; WREC.stream = stream;
      mr.ondataavailable = function(e){ if(e.data && e.data.size) WREC.chunks.push(e.data); };
      mr.start();
    }).catch(function(){});
  }
}
function wkRecStop(cb){
  recStop();
  var said = (finalTxt + ' ' + interimTxt).trim();
  var mr = WREC.mr, stream = WREC.stream;
  WREC.mr = null; WREC.stream = null;
  if(mr && mr.state !== 'inactive'){
    mr.onstop = function(){
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      var blob = new Blob(WREC.chunks, {type: mr.mimeType || 'audio/webm'});
      cb(said, blob.size ? URL.createObjectURL(blob) : '');
    };
    try{ mr.stop(); }catch(e){ cb(said, ''); }

}

/* ⚠ 2026-09-24 她：「H₂D ＋ A → H₂A ＋ D（色素）**这个我也没看到啊**」

function eqsOf(x){
  /* ⚠ 速背那一路的式子很多写在 `big` 里（例如光合总式），不只在注解里。 */
  var src = (x.cn || '') + ' ' + (x.warn || '') + ' ' + (x.big || '');

    seen[plain] = 1;
    out.push(body);
    if(out.length >= 6) break;               /* 六条封顶 —— 再多就不是「看一眼」了 */
  }
  return out;
}
/* 整张卡的式子（速背的注解和 big ＋ 追问的注解）。⚠ 给主问题那一屏兜底用：

/* ⚠ 2026-09-24 她：「**每个单独的出现的、需要公式的地方你单独放就行了**」

function earCount(o){

function earLoop(){

/* 这一条念完之后多停 5 秒 —— 「再多看一会儿」 */
function earHold(){

  EAR.extra = (EAR.extra || 0) + 5000;
  var tip = $('earst2');
  if(tip) tip.textContent = '（这一条念完会多停 ' + Math.round(EAR.extra / 1000) + ' 秒）';

function earGap(v){
  if(!EAR) return;
  EAR.gap = (+v) * 1000;

function earToggle(){
  if(!EAR) return;
  EAR.on = !EAR.on;
  var b = $('earbtn'); if(b) b.textContent = EAR.on ? '⏸ 暂停' : '▶ 继续';
  if(EAR.on) earStep();
  else { EAR.gen++; try{ speechSynthesis.cancel(); }catch(e){} }  /* ⚠ 暂停要把挂着的定时器一起废掉 */
}
function earNext(manual){
  if(!EAR) return;
  /* ⚠ 手动点「下一条」时，把「多停 5 秒」清掉 —— 那是给上一条的。 */
  if(manual) EAR.extra = 0;
  EAR.i = (EAR.i + 1) % EAR.list.length;
  earScreen();
  if(manual){ EAR.on = true; }
  if(EAR.on) earStep();
}
function earStep(){
  if(!EAR || !EAR.on) return;
  /* ⚠ 播放链的代号。每次重新开念都换一个新的，链条上每一步都先对一次；
     对不上就不动。没有它的话，在「念完 → 下一条」那 2 秒空档里点
     「再放一遍」或者「下一条」，**旧的定时器照样会响** —— 跳两条，或者叠着念。
     earSay 里的 cancel() 只掐得住正在响的声音，掐不住排好队的下一步。 */
  var gen = ++EAR.gen;
  function live(){ return EAR && EAR.on && EAR.gen === gen; }
  var o = EAR.list[EAR.i];
  var q = strip(o.item.q);
  var a = strip(o.item.ez || o.item.en || '');
  var ael = $('eara');
  function answer(){
    if(!live()) return;
    var el = $('eara'); if(el) el.textContent = a;
    earSay(a, EAR.v.f, 1.06, function(){
      if(!live()) return;
      /* ⚠ 2026-09-24 她：「在单个问题上**循环播放 / 再放一遍 / 再多看一会儿**」。
         · 循环打开 → 原地再念一遍，不往下走；
         · 间隔可调（默认 2 秒，原来 0.9 秒是我拍的，太赶）；
         · 「再多停 5 秒」是一次性的，用完清掉。 */
      earCount(o);
      var wait = (EAR.gap || 2000) + (EAR.extra || 0);
      EAR.extra = 0;
      var tip = $('earst2');
      if(tip) tip.textContent = EAR.loop ? '（循环中 · 这一条还会再念）' : '';
      setTimeout(function(){
        if(!live()) return;
        if(EAR.loop){ earStep(); } else { earNext(0); }
      }, wait);
    });
  }
  /* ⚠ 挑中的句子不一定配得到题；配不到就跳过男声，直接念这一句。 */
  if(!q){ answer(); return; }
  if(ael) ael.innerHTML = '<span class="small">（听题…）</span>';
  earSay(q, EAR.v.m, 0.85, function(){
    if(!live()) return;
    setTimeout(function(){ if(live()) answer(); }, 1800);   /* 停两秒 —— 想跟着说的时候有个缝 */
  });
}

/* ---- 自评。这是唯一可信的那个信号，所以它写进历史。 ---- */
function grade(i, k, btn){
  if(!RLOG[i]) return;
  RLOG[i].self = k;

  for(var a=0;a<row.length;a++) row[a].className = (a===k ? 'sel' : '');

/* ---- 选中 → 加进必背。写的是主 app 的同一个键，两页同源，所以会直接出现在 ★ 必背里。 ---- */
var MKK = 'oralexam.mark.v1';
function mkLoad(){ try{ return JSON.parse(localStorage.getItem(MKK))||[]; }catch(e){ return []; } }
function mkSave(a){ try{ localStorage.setItem(MKK, JSON.stringify(a)); }catch(e){} }
var mkSel = null;
document.addEventListener('mouseup', function(){
  setTimeout(function(){
    var sel = window.getSelection();
    var txt = sel ? String(sel).trim() : '';
    var pop = $('mkpop');
    if(!pop) return;
    if(txt.length < 8 || !sel.rangeCount){ pop.style.display='none'; mkSel=null; return; }
    var node = sel.getRangeAt(0).startContainer;
    var el = node.nodeType===1 ? node : node.parentNode;
    var box = el && el.closest ? el.closest('[data-card]') : null;
    if(!box){ pop.style.display='none'; mkSel=null; return; }
    mkSel = {card: box.getAttribute('data-card'), text: txt};
    var r = sel.getRangeAt(0).getBoundingClientRect();
    pop.style.display = 'block';
    pop.style.left = (window.scrollX + r.left) + 'px';
    pop.style.top  = (window.scrollY + r.bottom + 8) + 'px';
  }, 10);
});
function mkAdd(){
  if(!mkSel) return;
  var all = mkLoad();
  for(var i=0;i<all.length;i++)
    if(all[i].card===mkSel.card && all[i].text===mkSel.text){
      $('mkpop').style.display='none'; mkSel=null; alert('这一段已经标过了。'); return; }
  all.push({id:String(Date.now())+'-'+Math.floor(Math.random()*1e6),
            card:mkSel.card, sec:'drill', text:mkSel.text, pre:'', post:'', ts:Date.now()});
  mkSave(all);
  $('mkpop').style.display='none';
  var n = all.length; mkSel=null;
  alert('加进必背了。主 app 首页点「★ 必背 ' + n + ' 段」就能看到。');
}

/* ---- 复制进度给老师：规矩一要的就是这三个数 ---- */
function copyOut(){
  /* ⚠ 2026-09-25 重写。她：「复制进度还是有点问题啊 怎么还是在复制我已经不用的东西」——
     原来报的是拷问式那一套（组数、题数、机器算漏、每题自评），那套她已经不用了。
     现在只报她真正在用的：三轮进度 · 星标口径 · 今天的出声次数。
     ⚠ 星标口径为什么要单独报：她自己说「走过」被污染了（为了看进度往后点过几道），
     而「没星标 ＝ 肯定没背」是可信的下界。所以「刷过没背」那个数才是真正的待办。 */
  var s = st(), d = today(), r = s.days[d] || {};
  var all = allItems(), A = starStats(all);
  var walked = 0;
  all.forEach(function(x){ if(wSeen(s, x.card.id, x.item.q)) walked++; });
  var lines = ['口试演练 ' + d + ' · 连续 ' + streak() + ' 天'];
  lines.push('');
  lines.push('【今天】整段出声 ' + (r.walk || 0) + ' 遍 · 卡 ' + ((r.cards||[]).length) + ' 张');
  lines.push('');
  lines.push('【三轮】');
  for(var n = 1; n <= 3; n++){
    var rs = roundStat(n);
    lines.push('  轮 ' + n + '：走过 ' + rs.done + ' / ' + rs.tot
      + '（★ ' + rs.starred + ' · 刷过没背 ' + rs.skimmed + ' · 还没碰 ' + rs.untouched + '）');
  }
  lines.push('');
  lines.push('【全部 ' + A.tot + ' 题】走过 ' + walked
    + ' · ★ 星标 ' + A.starred + ' · 刷过没背 ' + A.skimmed + ' · 还没碰 ' + A.untouched);
  lines.push('  口径：★ 是我自己标的，没星标的肯定还没背。');
  /* 最该回来的那些：走过但没星标，按卡聚一下，只报前十张 */
  var by = {};
  all.forEach(function(x){
    if(qStarred(x.card.id, x.item)) return;
    if(!wSeen(s, x.card.id, x.item.q)) return;
    by[x.card.id] = (by[x.card.id] || 0) + 1;
  });
  var ks = Object.keys(by).sort(function(a, b){ return by[b] - by[a]; });
  if(ks.length){
    lines.push('');
    lines.push('【刷过但没背，按卡】' + ks.slice(0, 10).map(function(k){ return k + ' ' + by[k]; }).join(' · ')
      + (ks.length > 10 ? ' …共 ' + ks.length + ' 张' : ''));
  }
  var txt = lines.join('\n');
  try{ navigator.clipboard.writeText(txt); alert('复制好了，粘给老师。'); }
  catch(e){ prompt('手动复制：', txt); }
}


/* 规矩一的三个数，现在是量出来的，不是问出来的。 */
function numbers(){
  var s = st(), d = today(), r = s.days[d] || {cards:[]};
  /* ⚠ 2026-09-23：原来的判据是「这张卡漏词总数 > 2」。她第一份成绩单里
     五张卡全部上榜 —— 因为每题都被算成漏十几个，这个阈值就没意义了。
     改成**按比例**：这张卡漏掉的关键词超过一半才算。而且自评说得上的题不计。 */
  var bad = [], mi = {}, to = {};
  ((s.last && s.last.log) || []).forEach(function(x){
    if(x.self === 0) return;                 /* 她自己说答得出的，不算 */
    mi[x.card] = (mi[x.card]||0) + x.miss.length;
    to[x.card] = (to[x.card]||0) + (x.total||0);
  });
  Object.keys(mi).forEach(function(k){
    if(to[k] >= 6 && mi[k] / to[k] > 0.5) bad.push(k);
  });
  var rep = Object.keys(s.repeat||{}).map(function(k){ return {id:k, w:s.repeat[k]}; });
  return {cardsToday:(r.cards||[]).length, bad:bad, rep:rep};
}

/* ============================ 分析 ============================
   她 2026-09-22：「或者至少用作分析」。
   这一页要回答的只有一个问题：**明天先练哪一张。** */
function statsPage(){
  var s = st(), hs = s.hist || [];
  var per = {}, qrep = {}, days = {}, secs = 0, qtot = 0;
  hs.forEach(function(p){
    secs += (p.secs||0);
    var d = (p.when||'').slice(0,10);
    days[d] = days[d] || {q:0, ok:0, gave:0};
    (p.log||[]).forEach(function(x){
      qtot++;
      days[d].q++;
      if(x.self===0) days[d].ok++;
      if(x.gave || x.self===2) days[d].gave++;
      var a = per[x.card] = per[x.card] || {id:x.card, title:x.title, n:0, ok:0, gave:0, last:p.when};
      a.n++; if(x.self===0) a.ok++; if(x.gave||x.self===2) a.gave++;
      if(p.when > a.last) a.last = p.when;
      if(x.gave || x.self===2){
        var k = x.card + '|' + x.q;
        qrep[k] = qrep[k] || {card:x.card, title:x.title, q:x.q, n:0};
        qrep[k].n++;
      }
    });
  });
  var usable = CARDS.filter(function(c){ return qlist(c).length>0; });
  var never = usable.filter(function(c){ return !per[c.id]; });
  var rows = Object.keys(per).map(function(k){ return per[k]; })
    .sort(function(a,b){ return (b.gave/Math.max(1,b.n)) - (a.gave/Math.max(1,a.n)); });
  var reps = Object.keys(qrep).map(function(k){ return qrep[k]; })
    .filter(function(o){ return o.n>=2; }).sort(function(a,b){ return b.n-a.n; });
  var dk = Object.keys(days).sort();

  var h = '<div class="card"><b style="font-size:19px">分析</b>'
    + '<div class="small">这一页只回答一个问题：<b>明天先练哪一张。</b></div>'
    + '<div class="big3" style="margin-top:12px">'
      + '<div><b>' + hs.length + '</b><span>练过的组数</span></div>'
      + '<div><b>' + qtot + '</b><span>答过的题数</span></div>'
      + '<div><b>' + Math.round(secs/60) + '</b><span>出声的分钟数</span></div>'
    + '</div>'
    + '<p style="margin:14px 0 0"><button class="main" onclick="home()">回首页</button> '
      + '<button onclick="expHist()">导出历史</button> '
      + '<button class="ghost" onclick="impHist()">导入历史</button></p>'
    + (SAVE_WARN ? '<div class="warnbox">' + SAVE_WARN + '</div>' : '')
    + '</div>';

  if(reps.length){
    h += '<div class="card"><b>⚠ 反复说不上的题（' + reps.length + ' 道）</b>'
      + '<div class="small">这是整个 app 里最值钱的一张表 —— 它是<b>量出来的</b>，不是猜的。</div>';
    reps.slice(0,20).forEach(function(o){
      h += '<p style="margin:10px 0 0"><span class="pill">说不上 ' + o.n + ' 次</span>'
        + '<b>' + esc(o.q) + '</b><br><span class="small">' + esc(o.title) + '</span></p>';
    });
    h += '</div>';
  }

  h += '<div class="card"><b>每张卡（按「最该练」排）</b>'
    + '<div class="small">说不上的比例高的排前面。</div>';
  rows.forEach(function(a){
    var pct = Math.round(100*a.gave/Math.max(1,a.n));
    h += '<p style="margin:10px 0 0"><b class="' + (pct>=40?'miss':(pct===0?'hit':'')) + '">'
      + pct + '%</b> 说不上 · ' + esc(a.title || a.id)
      + '<br><span class="small">练过 ' + a.n + ' 题 · 答得出 ' + a.ok + ' · 说不上 ' + a.gave
      + ' · 上次 ' + esc((a.last||'').slice(0,10)) + '</span></p>';
  });
  if(never.length){
    h += '<hr><b class="miss">还没在这里练过的 ' + never.length + ' 张</b><p class="small">'
      + never.map(function(c){ return esc(c.id); }).join(' · ') + '</p>';
  }
  h += '</div>';

  if(dk.length){
    h += '<div class="card"><b>每天</b>';
    dk.slice(-14).forEach(function(d){
      var o = days[d], w = Math.min(100, o.q*2);
      h += '<p style="margin:8px 0 0" class="small">' + esc(d) + ' · ' + o.q + ' 题 · 答得出 '
        + o.ok + ' · 说不上 ' + o.gave + '</p>'
        + '<div class="bar" style="margin:2px 0 0"><i style="width:' + w + '%"></i></div>';
    });
    h += '</div>';
  }
  $('main').innerHTML = h;
}

/* 导出 / 导入 —— localStorage 是「这一台机器这一个浏览器」的，清缓存就没了。
   所以「全部都储存」在静态页面里真正的答案，是让她能把它复制出去。 */
function expHist(){
  var s = st();
  var txt = JSON.stringify({v:1, when:new Date().toISOString(),
    days:s.days, hist:s.hist, qres:s.qres, missHist:s.missHist, repeat:s.repeat, passes:s.passes});
  try{ navigator.clipboard.writeText(txt);
    alert('全部历史已经复制到剪贴板（' + Math.round(txt.length/1024) + ' KB）。\n'
      + '粘到一个记事本里存着，或者发到另一台机器上用「导入历史」。'); }
  catch(e){ prompt('手动复制（全选）：', txt); }
}
function impHist(){
  var txt = prompt('把导出的那一大段粘进来。⚠ 会跟这台机器上已有的历史合并，不会覆盖。');
  if(!txt) return;
  var o; try{ o = JSON.parse(txt); }catch(e){ alert('这段不是导出的内容。'); return; }
  var s = st();
  var have = {}; (s.hist||[]).forEach(function(p){ have[p.key]=1; });
  var add = (o.hist||[]).filter(function(p){ return !have[p.key]; });
  s.hist = (s.hist||[]).concat(add).sort(function(a,b){ return (a.when||'')<(b.when||'')?-1:1; });
  ['days','qres','missHist','repeat'].forEach(function(k){
    s[k] = s[k] || {};
    for(var kk in (o[k]||{})) if(!(kk in s[k])) s[k][kk] = o[k][kk];
  });
  s.passes = Math.max(s.passes||0, o.passes||0);
  save(s);
  alert('合并了 ' + add.length + ' 组历史。');
  statsPage();
}

/* ---- 历史 ---- */
function histPage(){
  var s = st(), hs = (s.hist||[]).slice().reverse();
  var h = '<div class="card"><b style="font-size:19px">练过的</b>'
    + '<div class="small">一共 ' + hs.length + ' 组，最新的在上面。点一组看它的反馈。</div>'
    + '<p style="margin:12px 0 0"><button class="main" onclick="home()">回首页</button></p></div>';
  if(!hs.length) h += '<div class="card small">还没有。</div>';
  hs.forEach(function(p, k){
    var g = p.log.filter(function(x){ return x.self===0; }).length;
    var b = p.log.filter(function(x){ return x.self===2; }).length;
    h += '<div class="card"><div class="row" style="justify-content:space-between">'
      + '<div><b>' + esc((p.when||'').slice(0,16).replace('T',' ')) + '</b>'
      + '<div class="small">' + p.log.length + ' 题 · 答得出 ' + g + ' · 答不上 ' + b
      + ' · ' + esc(p.cards||'') + '</div></div>'
      + '<button onclick="openHist(' + (hs.length-1-k) + ')">看</button></div></div>';
  });
  $('main').innerHTML = h;
}
function openHist(i){ var s=st(); var p=(s.hist||[])[i]; if(p) report(false, p); }

/* ============================ 起 ============================ */
if(!CARDS.length){
  $('main').innerHTML = '<div class="card"><b class="miss">卡的数据没装上。</b>'
    + '<p class="small">这一页要跟 <code>data/</code> 放在一起才能跑。</p></div>';
} else {
  home();
}
