<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>口试卡 · 生化</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  /* 白天也照 Trae 的对比度：它的浅色主题用 #31353A 的字配白底，
     VS Code Light Modern 用 #3B3B3B，都不是纯黑。原来这里是 #1a1917，高一档。
     （2026-09-15 Ruojin：让字和背景对比不要那么强烈） */
  --paper:#f8f6f2; --ink:#3a3835; --dim:#6d6961; --faint:#9c978e; --rule:#e6e2da;
  --card:#fff; --accent:#7a5c2e; --soft:#f4eee2; --onAccent:#fff;
  --bad:#b5491d; --ok:#2f6b41;
  --good:#2f5d3a; --goodbg:#eef4ee;
  --warn:#8a4b12; --warnbg:#fcf1e3;
  --chip:#efeae1;
}
/* 跟系统走 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  /* 照 Trae（VS Code Dark Modern）的对比度：底 #1F1F1F、字 #CCCCCC（不是白）、
     灰字 #9D9D9D、分隔线 #2B2B2B。这里保留她这套的暖调，只把对比度降到同一档。 */
  --paper:#1a1a19; --ink:#cbc7c0; --dim:#9a958d; --faint:#74706a; --rule:#2e2d2a;
  --card:#222221; --accent:#c6a06a; --soft:#282420; --onAccent:#1a1a19;
  --bad:#d9825c; --ok:#6cb488;
  --good:#7fb891; --goodbg:#1e2620;
  --warn:#c9995f; --warnbg:#28221a;
  --chip:#2a2927;
}}
/* 她自己按了「深」——系统是浅色也要变深 */
:root[data-theme="dark"]{
  /* 照 Trae（VS Code Dark Modern）的对比度：底 #1F1F1F、字 #CCCCCC（不是白）、
     灰字 #9D9D9D、分隔线 #2B2B2B。这里保留她这套的暖调，只把对比度降到同一档。 */
  --paper:#1a1a19; --ink:#cbc7c0; --dim:#9a958d; --faint:#74706a; --rule:#2e2d2a;
  --card:#222221; --accent:#c6a06a; --soft:#282420; --onAccent:#1a1a19;
  --bad:#d9825c; --ok:#6cb488;
  --good:#7fb891; --goodbg:#1e2620;
  --warn:#c9995f; --warnbg:#28221a;
  --chip:#2a2927;
}
/* 书上裁下来的图本身是白纸，容器保持白的才不别扭；深色下压一点亮度，晚上不刺眼 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .figcard img,
  :root:not([data-theme="light"]) figure.fig img{filter:brightness(.72) contrast(1.05)}}
:root[data-theme="dark"] .figcard img,
:root[data-theme="dark"] figure.fig img{filter:brightness(.72) contrast(1.05)}
/* 图的白底容器在深色下也跟着暗下去，不然是一整块白 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .figcard img,
  :root:not([data-theme="light"]) figure.fig{background:#d8d5cf}}
:root[data-theme="dark"] .figcard img,
:root[data-theme="dark"] figure.fig{background:#d8d5cf}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
a{color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--paper) 93%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
  padding:10px 62px 10px 18px;display:flex;align-items:center;gap:12px}   /* 右边留 62px 给固定在窗口角上的 .thm，不然 📕 会压在它底下 */
.top .home{font-size:13px;color:var(--dim);text-decoration:none;border:1px solid var(--rule);
  border-radius:18px;padding:5px 13px;white-space:nowrap;cursor:pointer;background:var(--card)}
.top .home:hover{border-color:var(--accent);color:var(--accent)}
.thm{position:fixed;top:9px;right:12px;z-index:9;font-family:inherit;font-size:15px;
  line-height:1;border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:16px;padding:6px 11px;cursor:pointer;opacity:.82}
.thm:hover{opacity:1;border-color:var(--accent)}
.top .id{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.modes{display:flex;border:1px solid var(--rule);border-radius:20px;overflow:hidden;margin-left:auto}
.modes button{font-family:inherit;font-size:13px;border:none;background:transparent;color:var(--dim);
  padding:6px 16px;cursor:pointer;white-space:nowrap}
.modes button.on{background:var(--accent);color:var(--onAccent);font-weight:600}

main{max-width:680px;margin:0 auto;padding:0 20px 130px}

/* ---------- list ---------- */
.lhero{padding:40px 0 18px;border-bottom:1px solid var(--rule)}
.lhero h1{font-size:26px;margin:0 0 6px;font-weight:650;letter-spacing:-.015em}
.lhero p{font-size:14px;color:var(--faint);margin:0}
#search{width:100%;margin:20px 0 6px;padding:12px 15px;font-family:inherit;font-size:16px;
  border:1px solid var(--rule);border-radius:11px;background:var(--card);color:var(--ink)}
#search:focus{outline:none;border-color:var(--accent)}
.lgrp{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:34px 0 4px}
.lgrp-n{font-size:13.5px;color:var(--faint);margin:0 0 12px}
.row{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;margin-bottom:7px;
  background:var(--card);border:1px solid var(--rule);border-radius:11px;
  text-decoration:none;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row.todo{background:transparent;border-style:dashed;cursor:default;opacity:.72}
.row .w{flex:none;font-size:11px;font-weight:800;width:26px;height:26px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.row .w{font-size:12px}
.row .w.hi{background:var(--accent);color:var(--onAccent)}
.row .w.pe{background:var(--good);color:var(--onAccent)}
.row .w.mid{background:var(--soft);color:var(--accent)}
.row .w.lo{background:var(--chip);color:var(--faint)}
.row .w.non{background:var(--warnbg);color:var(--warn)}
.row .flags{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.row .flags b{color:var(--warn)}
.row .flags i{font-style:normal;color:var(--accent)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15.5px;font-weight:600;line-height:1.5}
.row .t span{display:block;font-size:13px;color:var(--faint);margin-top:2px}
.row .go{flex:none;font-size:12px;color:var(--accent);font-weight:600;margin-top:5px;white-space:nowrap}
.row.todo .go{color:var(--faint);font-weight:400}

/* ---------- shared blocks ---------- */
.hero{padding:40px 0 8px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.hero h1{font-size:26px;line-height:1.33;margin:0 0 8px;font-weight:650;letter-spacing:-.015em}
.hero .sub{font-size:13.5px;color:var(--faint);margin:0 0 24px}
.grp{margin:44px 0 0}
.grp-h{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.grp-h span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.grp-h i{flex:1;height:1px;background:var(--rule)}
.grp-note{font-size:13.5px;color:var(--faint);margin:0 0 6px}
.grpbar{display:flex;gap:8px;align-items:center;margin:26px 0 0}
.grpbar button{font-size:12.5px;padding:5px 11px}
.grpbar span{font-size:12.5px;color:var(--faint)}
.pt{padding:32px 0 0}
.pt-n{font-size:11.5px;letter-spacing:.13em;color:var(--faint);font-variant-numeric:tabular-nums;
  margin:0 0 10px;font-weight:600}
/* R14 最短版。摆在完整版上面，因为她背的就是这一版。 */
.ezb{margin:0 0 14px;padding:14px 16px;background:var(--soft);border-radius:11px;
  border-left:3px solid var(--accent)}
.ezb .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:0 0 8px}
.ezb .ez{font-size:16.5px;line-height:1.95;margin:0;color:var(--ink)}
.ezb .ezcn{font-size:14px;line-height:1.85;margin:10px 0 0;color:var(--dim)}
.ezb .ezcn b{color:var(--ink)}
.full{margin:0 0 4px}
.full>summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--faint);
  padding:5px 0;user-select:none}
.full>summary::-webkit-details-marker{display:none}
.full>summary:hover{color:var(--accent)}
.full[open]>summary{color:var(--accent)}
.pt-big{font-size:22px;line-height:1.5;font-weight:650;margin:0 0 16px;letter-spacing:-.008em}
.pt-big b{color:var(--accent);font-weight:650}
.en{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:16px 19px;margin:0;
  font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.72}
.nt{font-size:14px;color:var(--dim);margin:13px 0 0;line-height:1.72}
.nt b{color:var(--ink)}
.wn{background:var(--warnbg);border-left:3px solid var(--warn);border-radius:0 10px 10px 0;
  padding:12px 16px;margin:13px 0 0;font-size:13.5px;line-height:1.7}
.wn b{color:var(--warn)}
.gd{background:var(--goodbg);border-left:3px solid var(--good);border-radius:0 10px 10px 0;
  padding:12px 16px;margin:13px 0 0;font-size:13.5px;line-height:1.7}
.gd b{color:var(--good)}
.pg{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--chip);
  border-radius:3px;padding:1px 6px;color:var(--faint);white-space:nowrap}
figure.fig{margin:15px 0 0;background:#fff;border:1px solid var(--rule);border-radius:10px;
  padding:10px 10px 6px}
figure.fig img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:4px}
figure.fig figcaption{font-size:12.5px;color:var(--faint);margin-top:8px;line-height:1.6}
figure.fig figcaption b{color:var(--ink)}
.endnote{margin:54px 0 0;padding:20px 22px;background:var(--soft);border-radius:12px;
  font-size:14.5px;line-height:1.75}
.endnote b{color:var(--accent)}
table.tb{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border:1px solid var(--rule);border-radius:11px;overflow:hidden;font-size:14.5px;margin:14px 0 0}
table.tb th{background:var(--soft);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);font-weight:700;padding:9px 12px;text-align:left}
table.tb td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:top;line-height:1.6}
.twrap{overflow-x:auto}

/* ---------- recog ---------- */
.recog{margin:26px 0 10px}
.recog h3{font-size:17px;margin:0 0 6px}
.recog > p{font-size:14px;color:var(--dim);margin:0 0 14px;line-height:1.72}
.recog > p b{color:var(--ink)}
.rq{background:var(--card);border:1px solid var(--rule);border-radius:11px;margin-bottom:8px;overflow:hidden}
.rq:hover{border-color:var(--accent)}
.rq.odd{background:var(--warnbg)}
.rq > summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.rq > summary::-webkit-details-marker{display:none}
.rq > summary::after{content:"+";margin-left:auto;color:var(--faint);font-size:18px;line-height:1;flex:none}
.rq[open] > summary::after{content:"\2013"}
.rq .qq{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.55;flex:1;min-width:0}
.rq .body{padding:0 15px 15px}
.rq .mean{font-size:13.5px;color:var(--dim);line-height:1.7;margin:0 0 12px;
  padding-left:12px;border-left:2px solid var(--rule)}
.rq .mean b{color:var(--ink)}

/* ---------- drill ---------- */
.step{display:none}
.step.on{display:block;animation:in .16s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#drill{padding-top:28px}
.tag{display:inline-block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--onAccent);background:var(--accent);border-radius:3px;padding:3px 10px;font-weight:650;margin-bottom:16px}
h2{font-size:22px;line-height:1.35;margin:0 0 12px;font-weight:650}
.lead{font-size:15px;color:var(--dim);margin:0 0 22px}
.askbox{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:36px 26px;text-align:center}
.askbox .q{font-size:25px;line-height:1.36;font-weight:650;margin:0 0 8px}
.askbox .qcn{font-size:13.5px;color:var(--faint);margin:0 0 28px}
.askbox .do{background:var(--soft);border-radius:10px;padding:15px 17px;font-size:15px;text-align:left;line-height:1.7}
.askbox .do b{color:var(--accent)}
ul.sib{list-style:none;margin:0;padding:0}
ul.sib li{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;cursor:pointer;
  font-size:15.5px;line-height:1.62;user-select:none;flex-wrap:wrap}
ul.sib li:hover{border-color:var(--accent)}
ul.sib li .bx{flex:none;width:21px;height:21px;border:2px solid var(--rule);border-radius:6px;margin-top:3px}
ul.sib li .txt{flex:1;min-width:0}
ul.sib li.hit{background:var(--goodbg);border-color:var(--good)}
ul.sib li.hit .bx{background:var(--good);border-color:var(--good);position:relative}
ul.sib li.hit .bx::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid var(--onAccent);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
ul.sib li .more{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--rule);
  background:transparent;color:var(--faint);font-size:14px;cursor:pointer;font-family:inherit;padding:0}
ul.sib li.open .more{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
ul.sib li .detail{display:none;flex-basis:100%;margin:11px 0 3px;padding-top:12px;border-top:1px dashed var(--rule)}
ul.sib li.open .detail{display:block}
ul.sib li .detail .e{font-family:Georgia,serif;font-size:16px;line-height:1.7;margin:0 0 9px}
ul.sib li .detail .c{font-size:14px;line-height:1.72;color:var(--dim);margin:0}
ul.sib li .detail .c b{color:var(--ink)}
.tally{margin-top:16px;padding:14px 17px;border-radius:10px;background:var(--chip);font-size:15px}
.tally.pass{background:var(--goodbg);color:var(--good);font-weight:600}
.tally.fail{background:var(--warnbg);color:var(--warn);font-weight:600}
.say{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:0 12px 12px 0;padding:20px 22px;font-family:Georgia,"Times New Roman",serif;
  font-size:17px;line-height:1.78}
.say p{margin:0 0 13px}.say p:last-child{margin:0}
.note{margin-top:16px;font-size:14px;color:var(--dim);background:var(--soft);
  border-radius:10px;padding:14px 16px;line-height:1.72}
.note b{color:var(--ink)}
.rung{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:15px 17px;margin-bottom:9px}
.rung .q{font-weight:650;font-size:15.5px;margin:0 0 5px}
.rung .a{font-size:14.5px;color:var(--dim);margin:0;line-height:1.7}
.stopbox{margin-top:14px;background:var(--goodbg);border:1px solid var(--good);border-radius:11px;padding:16px 18px}
.stopbox .lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--good);font-weight:700}
.stopbox q{display:block;margin-top:8px;font-family:Georgia,serif;font-size:16px;line-height:1.72}
.done{text-align:center;padding:40px 18px}
.done .big{font-size:44px;margin-bottom:6px}

/* ---------- ask ---------- */
.rule8{background:var(--goodbg);border:1px solid var(--good);border-radius:12px;
  padding:17px 20px;margin:22px 0 6px;font-size:14.5px;line-height:1.75}
.rule8 h3{margin:0 0 8px;font-size:16px;color:var(--good)}
.rule8 b{color:var(--ink)}
.qgrp{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:38px 0 4px}
.qgrp-n{font-size:13.5px;color:var(--faint);margin:0 0 12px}
.qa{background:var(--card);border:1px solid var(--rule);border-radius:11px;margin-bottom:9px;overflow:hidden}
.qa:hover{border-color:var(--accent)}
.qa > summary{list-style:none;cursor:pointer;padding:15px 17px;display:flex;gap:12px;
  align-items:flex-start;font-size:16px;line-height:1.55;font-weight:600}
.qa > summary::-webkit-details-marker{display:none}
.qa > summary::after{content:"+";margin-left:auto;color:var(--faint);font-weight:400;font-size:19px;line-height:1;flex:none}
.qa[open] > summary::after{content:"\2013"}
.qa[open] > summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.risk{flex:none;font-size:10.5px;letter-spacing:.06em;padding:3px 7px;border-radius:4px;
  font-weight:700;margin-top:2px;white-space:nowrap}
.risk.m{background:var(--warn);color:var(--onAccent)}
.risk.h{background:var(--accent);color:var(--onAccent)}
.risk.n{background:var(--chip);color:var(--faint)}
.qbody{padding:16px 17px 18px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 93%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--rule);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.nav.hide{display:none}
button.b{font-family:inherit;font-size:16px;font-weight:600;border-radius:11px;padding:13px 28px;
  cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--onAccent);min-width:140px}
button.b.ghost{background:transparent;color:var(--dim);border-color:var(--rule);min-width:76px;font-weight:500}
button.b:disabled{opacity:.35;cursor:default}

/* ---------- figs tab ---------- */
.figcard{margin:30px 0 0;background:var(--card);border:1px solid var(--rule);border-radius:13px;
  padding:18px 18px 14px}
.figcard .kind{display:inline-block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;border-radius:4px;padding:3px 9px;margin-bottom:12px}
.figcard .kind.draw{background:var(--accent);color:var(--onAccent)}
.figcard .kind.know{background:var(--soft);color:var(--accent)}
.figcard h3{font-size:18px;margin:0 0 10px;line-height:1.45}
.figcard img{max-width:100%;height:auto;display:block;margin:0 auto;background:#fff;
  border:1px solid var(--rule);border-radius:8px;padding:8px}
.figcard .svgwrap,.fig .svgwrap{background:var(--card);border:1px solid var(--rule);border-radius:8px;
  padding:14px 10px;overflow-x:auto}
.figcard .svgwrap svg,.fig .svgwrap svg{display:block;margin:0 auto;max-width:100%;height:auto;
  color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
.svgwrap svg text{fill:currentColor}
.svgwrap svg .bond{stroke:currentColor;stroke-width:2;fill:none}
.svgwrap svg .weak{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:5 4}
.svgwrap svg .hi{fill:var(--accent)}
.svgwrap svg .box{stroke:var(--accent);stroke-width:2;fill:none;rx:6}
.svgwrap svg .lbl{font-size:13px;font-weight:700}
.svgwrap svg .sub{font-size:11px}
.svgwrap svg .note{font-size:12px;fill:var(--dim)}
.figcard .cap{font-size:14px;color:var(--dim);margin:14px 0 0;line-height:1.72}
.figcard .cap b{color:var(--ink)}
.figcard .src{font-size:12px;color:var(--faint);margin:10px 0 0}


/* ---------- progress ---------- */
/* ⚠ 2026-09-23 她：「排列不好看 重叠了」。
   病因：.bbtn 是行内元素，padding:10px 撑不开行高，**一换行就压在一起**。
   改成 flex 容器 ＋ gap，按钮自己也改成 inline-flex，行高交给 flex 管。 */
.board{background:var(--card);border:1px solid var(--rule);border-radius:13px;
  padding:16px 18px;margin:22px 0 4px;
  display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.board h3{margin:0 0 4px;font-size:16px}
.board .sub2{font-size:13px;color:var(--faint);margin:0 0 15px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1 1 92px;background:var(--soft);border-radius:9px;padding:11px 13px}
.stat b{display:block;font-size:23px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
.stat.warn b{color:var(--warn)}
.stat.good b{color:var(--good)}
.due{font-size:13.5px;line-height:1.75;color:var(--dim);margin:0 0 14px}
.due b{color:var(--ink)}
.due a{color:var(--accent);font-weight:600;text-decoration:none;margin-right:9px;white-space:nowrap}
.bbtn{font-family:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:9px 15px;
  cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--onAccent);
  display:inline-flex;align-items:center;line-height:1.2;white-space:nowrap}
.bbtn.ghost{background:transparent;color:var(--dim);border-color:var(--rule);font-weight:500}
.copied{font-size:13px;color:var(--good);margin-left:10px}
.row .st{flex:none;font-size:11.5px;color:var(--faint);margin-top:5px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.row .st.ok{color:var(--good);font-weight:600}
.row .st.due{color:var(--warn);font-weight:600}
.donebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.delta{margin-top:16px;font-size:15px;line-height:1.75}
.delta b{font-size:17px}


/* ---------- 一键开始 ---------- */
/* 随手一题：小、安静、不要求她下决心 */
.one{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:16px 17px 15px;margin:16px 0 6px}
.one .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 9px}
.one .k b{color:var(--accent);letter-spacing:0;text-transform:none;font-size:12px}
.one .qq{font-size:16.5px;font-weight:600;line-height:1.6;margin:0}
.one .ans{margin:13px 0 0;padding:12px 14px;background:var(--soft);border-radius:9px;font-size:14.5px;line-height:1.8}
.one .ans .cn2{display:block;margin-top:9px;font-size:13px;color:var(--dim);line-height:1.7}
.one .btns{display:flex;gap:9px;margin:14px 0 0}
.one .btns button{flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:11px 6px;border-radius:9px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.one .btns button.no{border-color:var(--bad);color:var(--bad)}
.one .btns button.yes{border-color:var(--ok);color:var(--ok)}
.one .from{font-size:12px;color:var(--faint);margin:11px 0 0}
.one .from a{color:var(--accent)}
.sxbar{display:block;width:100%;font-family:inherit;font-size:15px;text-align:left;cursor:pointer;
  margin:16px 0 0;padding:13px 15px;border-radius:11px;border:1px solid var(--rule);
  background:var(--card);color:var(--dim)}
.sxbar:hover{border-color:var(--accent);color:var(--accent)}
.gobox{background:var(--accent);border-radius:14px;padding:22px 22px 20px;margin:22px 0 6px;color:var(--onAccent)}
.gobox .k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin:0 0 8px}
.gobox h2{margin:0 0 6px;font-size:21px;line-height:1.4;color:var(--onAccent);font-weight:650}
.gobox p{margin:0 0 16px;font-size:14px;opacity:.9;line-height:1.7}
.gobox a{display:inline-block;background:var(--card);color:var(--accent);text-decoration:none;
  font-weight:700;font-size:16px;border-radius:10px;padding:13px 26px}
.gobox .alt{display:block;margin-top:12px;font-size:13px;opacity:.85;color:var(--onAccent)}
.gobox .alt a{background:none;color:var(--onAccent);text-decoration:underline;padding:0;font-weight:600;font-size:13px}

/* ---------- 朗读 ---------- */
.spk{border:none;background:var(--chip);color:var(--dim);border-radius:6px;cursor:pointer;
  font-size:13px;line-height:1;padding:4px 8px;margin-left:8px;vertical-align:2px;font-family:inherit}
.spk:hover{background:var(--accent);color:var(--onAccent)}
.spk.on{background:var(--good);color:var(--onAccent)}
/* 朗读时：当前句高光，其余变暗 */
.reading .ez,.reading .ezcn,.reading .en,.reading .say,.reading .pt-en,.reading .pt-big,.reading .nt,.reading .gd,.reading .wn{opacity:.35;transition:opacity .2s}
.reading .rd{opacity:1}
.rd span.s{opacity:.45}
.rd span.s.cur{opacity:1;background:var(--warnbg);border-radius:3px;box-shadow:0 0 0 3px var(--warnbg)}
.wd{background:var(--goodbg);border-radius:3px;box-shadow:0 0 0 2px var(--goodbg)}
#wpop{position:fixed;z-index:60;display:none;max-width:min(360px,92vw)}
#wpop .card{background:var(--card);border:1px solid var(--rule);border-radius:11px;
  padding:12px 13px 10px;box-shadow:0 10px 30px rgba(0,0,0,.18);margin-bottom:6px}
#wpop .hd{display:flex;align-items:center;gap:8px}
#wpop .say{flex:none;font-family:inherit;font-size:14px;line-height:1;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer}
#wpop .say:hover{border-color:var(--accent);color:var(--accent)}
#wpop .one{font-size:14px;color:var(--ink);margin:9px 0 0;line-height:1.55;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
#wpop .hw{font-size:17px;font-weight:700;color:var(--ink);line-height:1.3;flex:1;min-width:0}
#wpop .star{flex:none;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;
  border:1px solid var(--accent);background:var(--card);color:var(--accent);
  border-radius:8px;padding:6px 11px;cursor:pointer}
#wpop .star.on{background:var(--accent);color:var(--onAccent)}
#wpop .ipa{font-family:Georgia,serif;font-size:13px;color:var(--dim);margin-left:7px}
#wpop .cn{font-size:14px;color:var(--ink);margin:7px 0 0;line-height:1.65}
#wpop .en{font-size:12.5px;color:var(--dim);margin:6px 0 0;line-height:1.6}
#wpop .ex{font-size:12.5px;color:var(--ink);margin:8px 0 0;line-height:1.6;
  border-left:2px solid var(--accent);padding-left:9px}
#wpop .exfrom{font-size:11px;color:var(--faint);margin:4px 0 0;padding-left:11px}
#wpop .exfrom a{color:var(--accent)}
#wpop .src{font-size:11px;color:var(--faint);margin:9px 0 0;border-top:1px solid var(--rule);padding-top:7px}
.wbcard .exfrom{font-size:12px;color:var(--faint);margin:4px 0 0;text-align:left}
.wbcard .src{font-size:12px;color:var(--faint);margin:12px 0 0;text-align:left;
  border-top:1px solid var(--rule);padding-top:8px}
#wpop .none{font-size:12.5px;color:var(--faint);margin:6px 0 0}
/* ---------- 单词本 ---------- */
.wbhero{margin:0 0 6px}
.wbstat{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 4px}
.wbstat span{background:var(--soft);color:var(--accent);border-radius:7px;
  padding:6px 11px;font-size:13px;font-weight:700}
.wbcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;
  padding:30px 20px;margin:18px 0 0;text-align:center}
.wbcard .hw{font-size:31px;font-weight:700;line-height:1.25;word-break:break-word}
.wbcard .ipa{font-family:Georgia,serif;font-size:15px;color:var(--dim);margin-top:8px}
.wbcard .cn{font-size:17px;margin:16px 0 0;line-height:1.7;text-align:left}
.wbcard .en{font-size:13.5px;color:var(--dim);margin:10px 0 0;line-height:1.7;text-align:left}
.wbcard .ex{font-size:13px;color:var(--faint);margin:12px 0 0;line-height:1.6;text-align:left;
  border-left:2px solid var(--rule);padding-left:10px}
.wbcard .from{font-size:12px;color:var(--faint);margin:14px 0 0}
.wbbtns{display:flex;gap:9px;margin:16px 0 0}
.wbbtns button{flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:13px 6px;
  border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.wbbtns button b{display:block;font-size:11px;font-weight:400;color:var(--faint);margin-top:3px}
.wbbtns button.bad{border-color:var(--bad);color:var(--bad)}
.wbbtns button.good{border-color:var(--accent);color:var(--accent)}
.wbbtns button.easy{border-color:var(--ok);color:var(--ok)}
.wblist{list-style:none;padding:0;margin:14px 0 0}
.wblist li{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--rule);font-size:14px}
.wblist li .w{font-weight:700}
.wblist li .m{color:var(--dim);flex:1;font-size:13px}
.wblist li .due{font-size:11.5px;color:var(--faint)}
/* ---------- 另外两科的题目单：只有题面 ---------- */
.qb{list-style:none;padding:0;margin:16px 0 0}
.qb li{display:flex;gap:11px;padding:13px 2px;border-bottom:1px solid var(--rule)}
.qb .n{flex:none;width:26px;text-align:right;color:var(--faint);font-size:13px;padding-top:2px}
.qb .t{flex:1;min-width:0}
.qb .t b{display:block;font-size:15px;font-weight:600;line-height:1.5}
.qb .t span{display:block;font-size:13px;color:var(--dim);margin-top:3px;line-height:1.6}
.qb .t i{display:block;font-style:normal;font-size:11.5px;color:var(--faint);margin-top:5px}
.qb .w{flex:none;font-size:11px;font-weight:700;border-radius:4px;padding:3px 8px;height:fit-content;
  background:var(--chip);color:var(--dim)}
.qb .w.hi{background:var(--accent);color:var(--onAccent)}
.qbnav{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 0}
.qbnav a{font-size:13px;text-decoration:none;border:1px solid var(--rule);border-radius:18px;
  padding:7px 14px;color:var(--ink);background:var(--card)}
.qbnav a:hover{border-color:var(--accent);color:var(--accent)}
.qb li.has{display:block;padding:0}
.qb details{padding:13px 2px}
.qb details>summary{list-style:none;cursor:pointer;display:flex;gap:11px}
.qb details>summary::-webkit-details-marker{display:none}
.qb details>summary .t b::after{content:" ▾";color:var(--accent);font-size:12px}
.qb details[open]>summary .t b::after{content:" ▴"}
.qb .ans{margin:12px 0 2px 37px}
.qb .ans .en{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:9px;padding:13px 14px;font-size:15px;line-height:1.85;margin:0}
.qb .ans .nt{font-size:13.5px;color:var(--dim);line-height:1.75;margin:10px 0 0}
.qb .ans .wn{font-size:13.5px;background:var(--warnbg);color:var(--warn);border-radius:8px;
  padding:10px 12px;margin:10px 0 0;line-height:1.7}
.qb .noans{font-size:12.5px;color:var(--faint);margin:6px 0 0 37px}
/* ---------- 查找浮层 ---------- */
#sxmask{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.34);display:none}
#sxmask.on{display:block}
#sxpanel{position:fixed;z-index:71;left:50%;transform:translateX(-50%);
  top:14px;width:min(720px,94vw);max-height:calc(100vh - 28px);display:none;
  flex-direction:column;background:var(--paper);border:1px solid var(--rule);
  border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden}
#sxpanel.on{display:flex}
#sxhead{display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--rule);background:var(--card)}
#sxhead #sxq{flex:1;min-width:0;margin:0}
#sxhead .x{flex:none;font-family:inherit;font-size:14px;line-height:1;cursor:pointer;
  border:1px solid var(--rule);background:var(--card);color:var(--dim);
  border-radius:9px;padding:9px 12px}
#sxhead .x:hover{border-color:var(--accent);color:var(--accent)}
#sxbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 16px}
#sxbody .sxtip{font-size:12.5px;color:var(--faint);margin:10px 0 0;line-height:1.7}
#wpop button{font-family:inherit;font-size:13px;border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:14px;padding:6px 11px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.14)}
#wpop button i{font-style:normal;font-family:Georgia,serif}
#wpop button.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.favs{border:none;background:var(--chip);color:var(--dim);border-radius:6px;cursor:pointer;font-size:13px;line-height:1;
  padding:4px 7px;margin-left:4px;vertical-align:2px;font-family:inherit}
.favs:hover{background:var(--accent);color:var(--onAccent)}
.favs.on{background:var(--warn);color:var(--onAccent)}
.favsec h3{margin:18px 0 8px}
#vsel{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--card);color:var(--ink);max-width:100%}
.favl{list-style:none;margin:0;padding:0}
.favl li{display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:8px;background:var(--card);border:1px solid var(--rule);border-radius:10px}
.favl .ft{flex:1;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.6}
.favl .fc{font-size:12px;color:var(--faint);text-decoration:none;white-space:nowrap}
.favl .fx{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:14px}
.ez,.ezcn,.en,.say,.pt-en,.gd,.nt,.wn,.pt-big{cursor:text}
/* 追问底部收起 */
.fold{display:block;margin:14px 0 0 auto;border:1px solid var(--rule);background:var(--chip);color:var(--dim);
  border-radius:14px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.fold:hover{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
/* 遮词：关键词盖住，悬停或点一下露出。
   2026-09-23 她：「遮词不要纯黑色吧看着有点瘆人」→ 黑条换成主色的浅底。
   「看着稍微难一点的都遮掉」→ 除了卡上加粗的 <b>，8 个字母以上的实词也盖（span.cz，czWrap 加的）。 */
.cloze .ezcn b,.cloze .pt-big b,.cloze .en b,.cloze .say b,.cloze ul.sib li .txt b,.cloze .detail .e b,.cloze .cz{
  background:color-mix(in srgb,var(--accent) 26%,var(--card));color:transparent;border-radius:3px;cursor:pointer;
  box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 55%,transparent)}
.cloze .ezcn b:hover,.cloze .pt-big b:hover,.cloze .en b:hover,.cloze .say b:hover,.cloze ul.sib li .txt b:hover,.cloze .detail .e b:hover,.cloze .cz:hover,
.cloze .ezcn b.show,.cloze .pt-big b.show,.cloze .en b.show,.cloze .say b.show,.cloze ul.sib li .txt b.show,.cloze .detail .e b.show,.cloze .cz.show{
  background:transparent;color:inherit;box-shadow:none}
.cloze .pt-big b.show{color:var(--accent)}

/* ---------- 必背：她自己划的段 ---------- */
/* 跟 app 已有的强调都不一样：加粗是卡自己定的，这个底色＋下划线是「我自己挑的」 */
/* 下划线用 text-decoration 不用 border-bottom：它跟着字一起画，
   朗读到这一句时 span.s.cur 的黄底盖不掉它；换行也跟着断 */
.mk{background:color-mix(in srgb,var(--accent) 15%,transparent);border-radius:2px;cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--accent);
  text-decoration-thickness:2px;text-underline-offset:3px}
/* 朗读时整块被压到 .35，标记跟着一起淡下去，所以这里把底色加浓，压暗了也还看得出 */
.reading .mk{background:color-mix(in srgb,var(--accent) 34%,transparent)}
/* 「不用背」：划掉 ＋ 变灰。跟必背共用一套定位机制，只是换个样子 */
.mk.mkskip{background:transparent;color:var(--faint);opacity:.55;
  text-decoration:line-through;text-decoration-color:var(--faint);
  text-decoration-thickness:1.5px;text-underline-offset:0}
.reading .mk.mkskip{background:transparent}
.mklist li.skiprow .mt{text-decoration:line-through;color:var(--faint)}
/* 遮词模式：盖住的那个 b 里面的标记不许把黑条掏出一块亮的，只留下划线 */
.cloze .ezcn b .mk,.cloze .pt-big b .mk,.cloze .en b .mk,.cloze .say b .mk,
.cloze ul.sib li .txt b .mk,.cloze .detail .e b .mk{background:transparent}
#mkpop{position:fixed;z-index:70;display:none}
#mkpop button{font-family:inherit;font-size:14.5px;font-weight:600;border:1px solid var(--accent);
  background:var(--accent);color:var(--onAccent);border-radius:16px;padding:9px 16px;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.22)}
#mkpop button.off{background:var(--card);color:var(--accent)}
#mktoast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:80;display:none;
  background:var(--ink);color:var(--paper);border-radius:18px;padding:9px 16px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mkgrp{margin:30px 0 0}
.mkgrp h3{margin:0 0 3px;font-size:16.5px;line-height:1.5}
.mkgrp p.mn{margin:0;font-size:12.5px;color:var(--faint);line-height:1.6}
.mkgrp p.mn b{color:var(--warn)}
.mklist{list-style:none;margin:10px 0 0;padding:0}
.mklist li{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--rule);border-radius:11px}
.mklist .mt{flex:1;min-width:0;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.66;
  word-break:break-word}
.mklist .mw{display:block;font-family:inherit;font-size:11.5px;color:var(--faint);margin-top:5px}
.mklist .mg{flex:none;font-size:12.5px;color:var(--accent);text-decoration:none;white-space:nowrap;
  font-weight:600;margin-top:3px}
.mklist .mx{flex:none;border:none;background:transparent;color:var(--faint);cursor:pointer;
  font-size:15px;font-family:inherit;padding:0 2px}
.mklist.mkstale li{background:var(--warnbg);border-color:var(--warn)}

/* ---------- 降级梯子 ---------- */
.ladder2{background:var(--soft);border-radius:11px;padding:15px 17px;margin-top:16px;
  font-size:14px;line-height:1.75;text-align:left}
.ladder2 b{color:var(--accent)}
.ladder2 ol{margin:8px 0 0;padding-left:20px}
.ladder2 li{margin-bottom:4px}

/* ---------- 查找 ---------- */
#sxq{width:100%;margin:18px 0 6px;padding:12px 15px;font-family:inherit;font-size:16px;
  border:1px solid var(--rule);border-radius:11px;background:var(--card);color:var(--ink)}
#sxq:focus{outline:none;border-color:var(--accent)}
.sxsum{font-size:13.5px;color:var(--faint);margin:12px 0 0;line-height:1.7}
.sxsum b{color:var(--accent)}
.sxgloss{background:var(--soft);border-radius:12px;padding:16px 18px;margin:18px 0 0}
.sxgloss .gw{font-size:21px;font-weight:700;line-height:1.3}
.sxgloss .gipa{font-family:Georgia,serif;font-size:13px;color:var(--dim);margin-left:8px;font-weight:400}
.sxgloss .gcn{font-size:15px;margin:8px 0 0;line-height:1.7}
.sxgloss .gen{font-size:13px;color:var(--dim);margin:7px 0 0;line-height:1.65}
.sxgloss .gex{font-size:13px;margin:9px 0 0;line-height:1.65;
  border-left:2px solid var(--accent);padding-left:10px}
.sxgloss .gfrm{font-size:12px;color:var(--faint);margin:8px 0 0}
.sxgloss .gfrm a{color:var(--accent);font-weight:600;text-decoration:none}
.sxgrp{margin:30px 0 0}
.sxgrp h3{margin:0 0 3px;font-size:16.5px;line-height:1.5}
.sxgrp h3 a{text-decoration:none}
.sxgrp p.mn{margin:0 0 10px;font-size:12.5px;color:var(--faint)}
.sxrow{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;margin-bottom:7px;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  text-decoration:none;color:inherit}
.sxrow:hover{border-color:var(--accent)}
.sxs{flex:1;min-width:0;font-size:14.5px;line-height:1.7;word-break:break-word}
.sxw{flex:none;font-size:11.5px;color:var(--faint);margin-top:3px;white-space:nowrap}
.sxhi{font-style:normal;font-weight:700;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:3px;padding:0 1px}
.sxnone{font-size:14.5px;color:var(--dim);margin:24px 0 0;line-height:1.78}

/* 从结果跳进卡里时，那一处的底色。跟必背的 .mk 故意不同色 */

<script>
/* =================== helpers =================== */
function esc(x){ return x == null ? '' : String(x); }

/* ez 里的缩写是**故意拆成单个字母**写的（D N A、P C R、d A T P），
   因为语音引擎见到 DNA 会当成一个词念。但屏幕上不该显示成「D N A」——
   2026-09-20 Ruojin 报的 bug：「dna pcr 等词是 D N A P C R」。
   **显示时合回去，念的时候仍然用拆开的原文**（见 data-say）。

   ⚠ 只认白名单，不在名单上的一个字母都不动。
   为什么不用通则：卡上「A C three plant」「A D N A polymerase」的开头
   都是冠词 A，而「A T P」的 A 是缩写的一部分，光看形状分不开。
   白名单的最坏情况是维持现状，通则的最坏情况是把句子改错。
   **新写了别的缩写，要往这个表里加一条。** */
var ABBR = {};
(function(){
  var L = ('DNA RNA mRNA tRNA rRNA cDNA gRNA ncAA ATP ADP AMP GTP GDP UTP UDP CMP cAMP '
         + 'dATP dGTP dCTP dTMP dUMP dTTP dNTP ddNTP NAD NADH NADP NADPH FAD FADH FMN '
         + 'PCR IPTG PEP CAM pH pKa pI Km Kd Ki ER SH OH NH CH GC AT AG TA CCA CONH '
         + 'TAG TAA UAG UGA AUG GATC SSB SRP TEV MBP GST SDS PAGE EDTA DTT GSH GSSG '
         + 'UV HIS FRET SELEX LIC KAPA CHO HEK MLV CEN ARS EF OD ACP HMG BCAA MSG '
         + 'NNK NNN PURE pET pUC pDUET GAL BAD LEVLFQ ENLYFQ FeS Fe SECIS CMV VP EC '
         + 'ZDNA BDNA '
         /* mb-reg（真核转录调控与表观）新加的 */
         + 'CTD TBP TAF UPE HAT HDAC CpG HTH bZIP bHLH PRC YTH ERE GRE '
         /* mb-post（转录之外的每一层）新加的 */
         + 'siRNA miRNA lncRNA ncRNA dsRNA snoRNA UTR IRE IREBP HSE HSF HSP '
         + 'PKA PKC PTK CRE CREB DAG TfR HRE CDK RDRP AGO PAZ CBP').split(' ');
  for (var i=0;i<L.length;i++) ABBR[L[i]] = L[i];
  /* 合起来不好看的，单独给一个写法 */
  ABBR.SDSPAGE = 'SDS PAGE'; ABBR.RTqPCR = 'RT-qPCR'; ABBR.RTPCR = 'RT-PCR';
  ABBR.EFG = 'EF-G'; ABBR.EFTu = 'EF-Tu';
  ABBR.BDNA = 'B-DNA'; ABBR.ZDNA = 'Z-DNA'; ABBR.ADNA = 'A-DNA';
  /* 卡 12 书外那两组（ch7 原核调控）新加的 */
  ABBR.SOS = 'SOS'; ABBR.AMPCRP = 'AMP-CRP';
  /* 66 道短答的 ez 里新出现的 */
  ABBR.BCA = 'BCA'; ABBR.ELISA = 'ELISA'; ABBR.TE = 'TE'; ABBR.PVDF = 'PVDF';
  ABBR.pIII = 'pIII'; ABBR.pVIIIa = 'pVIII'; ABBR.RT = 'RT'; ABBR.SS = 'S-S';
})();
function unspell(x){
  if (x == null) return '';
  return String(x).replace(/(^|[^A-Za-z<])((?:[A-Za-z] ){1,9}[A-Za-z])(?![A-Za-z])/g,
    function(m, pre, run){
      var ls = run.split(' ');
      var whole = ls.join('');
      if (ABBR[whole]) return pre + ABBR[whole];
      /* 冠词 a / A 后面跟一个缩写：冠词留着，只合后面那串 */
      if ((ls[0] === 'a' || ls[0] === 'A') && ls.length > 2){
        var rest = ls.slice(1).join('');
        if (ABBR[rest]) return pre + ls[0] + ' ' + ABBR[rest];
      }
      return m;
    });
}
function escAttr(x){
  return esc(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
/* 图有两种来源：f.svg 是内联画的（离线、缩放不糊、跟主题变色），f.src 是书上裁的图片。 */
function figBody(f){
  if (f.svg) return '<div class="svgwrap">' + f.svg + '</div>';
  if (f.src) return '<img alt="" src="' + IMG_BASE + f.src + '">';
  return '';
}
function fig(f){
  if (!f) return '';
  return '<figure class="fig">' + figBody(f)
       + (f.cap ? '<figcaption>' + f.cap + '</figcaption>' : '') + '</figure>';
}
function byId(id){ for (var i=0;i<CARDS.length;i++) if (CARDS[i].id === id) return CARDS[i]; return null; }


/* =================== 进度 =================== */
var PK = 'oralexam.progress.v1';
function today(){ var d = new Date(); return d.getFullYear() + '-'
  + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function loadP(){ try { return JSON.parse(localStorage.getItem(PK)) || {}; } catch(e){ return {}; } }
function saveP(p){ try { localStorage.setItem(PK, JSON.stringify(p)); } catch(e){} }
function recordRun(id, miss){
  var p = loadP();
  var r = p[id] || {runs:[]};
  r.runs.push({d: today(), m: miss});
  if (r.runs.length > 40) r.runs = r.runs.slice(-40);
  p[id] = r; saveP(p);
  return r;
}
/* 复习到期：漏 ≤2 三天后，漏 >2 明天 */
function dueIn(r){
  if (!r || !r.runs.length) return -999;
  var last = r.runs[r.runs.length-1];
  var gap = last.m <= 2 ? 3 : 1;
  return gap - daysBetween(last.d, today());
}
function statusOf(id){
  var r = loadP()[id];
  if (!r || !r.runs.length) return {txt:'未练', cls:''};
  var last = r.runs[r.runs.length-1];
  var ago = daysBetween(last.d, today());
  var when = ago === 0 ? '今天' : (ago === 1 ? '昨天' : ago + ' 天前');
  var d = dueIn(r);
  return {txt: when + ' · 漏' + last.m, cls: d <= 0 ? 'due' : (ago === 0 ? 'ok' : ''), due: d <= 0};
}
function digest(){
  var p = loadP(), lines = [], t = today();
  var todayN = 0, dueList = [], never = [], streakDays = {};
  for (var i=0;i<CARDS.length;i++){
    var c = CARDS[i], r = p[c.id];
    if (!r || !r.runs.length){ never.push(c.id); continue; }
    var last = r.runs[r.runs.length-1];
    if (last.d === t) todayN++;
    if (dueIn(r) <= 0) dueList.push(c.id + '(漏' + last.m + ',' + daysBetween(last.d,t) + '天前)');
    for (var k=0;k<r.runs.length;k++) streakDays[r.runs[k].d] = 1;
    var ms = r.runs.slice(-5).map(function(x){ return x.m; }).join('→');
    lines.push(c.id + ' ' + c.q.slice(0,40) + ' | 练了' + r.runs.length + '次 | 漏数 ' + ms);
  }
  // 连续天数
  var streak = 0, d = new Date();
  while (true){
    var key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if (streakDays[key]) { streak++; d.setDate(d.getDate()-1); } else break;
  }
  return ['进度 ' + t,
          '今天出声练了 ' + todayN + ' 张 · 连续 ' + streak + ' 天 · 已有卡 ' + CARDS.length + ' 张 · 从没练过 ' + never.length + ' 张',
          '该复习：' + (dueList.length ? dueList.join('、') : '无'),
          ''].concat(lines).join('\n');
}


/* 今天该做的那一张：到期的 > 从没练过的 > 上次漏最多的
   同一批里轮着来——上次给过的那张，只要还有别的候选，就先给别的。
   （2026-09-14 Ruojin：「这个卡没有变化，一直都是同一个主题」。
     原来到期的一批永远取「上次漏最多」的那张，是个死序，回首页也不会换。） */
function lastServed(){ try { return localStorage.getItem('oralexam.last.v1') || ''; } catch(e){ return ''; } }
function markServed(id){ try { localStorage.setItem('oralexam.last.v1', id); } catch(e){} }
function nextCard(){
  var p = loadP(), due = [], never = [], rest = [];
  for (var i=0;i<CARDS.length;i++){
    var c = CARDS[i], r = p[c.id];
    if (!r || !r.runs.length){ never.push(c); continue; }
    if (dueIn(r) <= 0) due.push(c); else rest.push(c);
  }
  function misses(c){ return p[c.id].runs.slice(-1)[0].m; }
  function byOverdue(list){
    list.sort(function(a,b){
      var da = dueIn(p[a.id]), db = dueIn(p[b.id]);
      if (da !== db) return da - db;            /* 欠得最久的排最前 */
      return misses(b) - misses(a);
    });
    return list;
  }
  function byMiss(list){
    list.sort(function(a,b){ return misses(b) - misses(a); });
    return list;
  }
  function rotate(list){
    if (list.length > 1){
      var L = lastServed(), f = [];
      for (var k=0;k<list.length;k++) if (list[k].id !== L) f.push(list[k]);
      if (f.length) list = f;
    }
    return list[0];
  }
  var pick = null, why = '';
  if (due.length){ pick = rotate(byOverdue(due)); why = '这张到复习期了'; }
  else if (never.length){ pick = rotate(never); why = '这张你还没练过'; }
  else if (rest.length){ pick = rotate(byMiss(rest)); why = '今天都练过了，这张上次漏得最多，可以再来一遍'; }
  if (!pick) return null;
  markServed(pick.id);
  return {c: pick, why: why};
}

/* =================== list =================== */
/* =================== 随手一题 ===================
   2026-09-20 她的话：「主页那个巨大的不用想就练这个，有点无用，还不如每次刷新
   就随机出现一个追问/定义，然后我可以选记得/记不得」。
   池子 = 所有卡的追问 ＋「同一个答案不同问法」。记不得的权重高，会更早再撞上。
   刻意做得小：一题、两个按钮、没有进度条——她现在一天两张都学不完，
   首页再放一件大事只会让她关掉。 */
var RCK = 'oralexam.rc.v1';
function rcLoad(){ try { return JSON.parse(localStorage.getItem(RCK)) || {}; } catch(e){ return {}; } }
function rcSave(o){ try { localStorage.setItem(RCK, JSON.stringify(o)); } catch(e){} }
var RCPOOL = null;
function rcBuild(){
  if (RCPOOL) return RCPOOL;
  var out = [];
  for (var i=0;i<CARDS.length;i++){
    var c = CARDS[i], g = c.ask || [], j, k;
    for (j=0;j<g.length;j++){
      var it = g[j].items || [];
      for (k=0;k<it.length;k++)
        if (it[k].q && it[k].en) out.push({c:c.id, t:'追问', q:it[k].q, a:it[k].en, cn:it[k].cn || ''});
    }
    var r = c.recog || [];
    for (j=0;j<r.length;j++)
      if (r[j].q && r[j].say) out.push({c:c.id, t:'换个问法', q:r[j].q, a:r[j].say, cn:r[j].mean || ''});
  }
  RCPOOL = out;
  return out;
}
function rcKey(x){ return x.c + '|' + String(x.q).slice(0, 44); }
function rcPick(){
  var pool = rcBuild();
  if (!pool.length) return null;
  var st = rcLoad(), bag = [], i, j;
  for (i=0;i<pool.length;i++){
    var r = st[rcKey(pool[i])] || {};
    var w = r.n ? 1 : 2;                      /* 没见过的算两份 */
    if (r.bad) w += Math.min(6, r.bad * 3);   /* 记不得过的更容易再来 */
    for (j=0;j<w;j++) bag.push(i);
  }
  return pool[bag[Math.floor(Math.random()*bag.length)]];
}
var RCCUR = null, RCSHOWN = false;
function rcPaint(){ var b = document.getElementById('onebox'); if (b) b.innerHTML = rcHtml(); }
function rcMark(ok){
  if (!RCCUR) return;
  var st = rcLoad(), k = rcKey(RCCUR), r = st[k] || {n:0, bad:0};
  r.n = (r.n||0) + 1;
  r.bad = ok ? 0 : (r.bad||0) + 1;
  r.d = today();
  st[k] = r; rcSave(st);
  RCSHOWN = true; rcPaint();
}
function rcNext(){ RCCUR = rcPick(); RCSHOWN = false; rcPaint(); }
function rcHtml(){
  if (!RCCUR) return '';
  var st = rcLoad(), r = st[rcKey(RCCUR)] || {};
  var h = '<p class="k">随手一题 · <b>' + esc(RCCUR.t) + '</b>'
        + (r.bad ? ' · 上次没想起来' : '') + '</p>'
        + '<p class="qq">' + RCCUR.q + '</p>';
  if (RCSHOWN)
    h += '<div class="ans">' + RCCUR.a
       + (RCCUR.cn ? '<span class="cn2">' + RCCUR.cn + '</span>' : '') + '</div>'
       + '<p class="from">来自 <a href="#/c/' + esc(RCCUR.c) + '">卡 ' + esc(RCCUR.c) + '</a></p>'
       + '<div class="btns"><button type="button" onclick="rcNext()">再来一题</button></div>';
  else
    h += '<div class="btns">'
       + '<button type="button" class="no" onclick="rcMark(false)">记不得</button>'
       + '<button type="button" class="yes" onclick="rcMark(true)">记得</button></div>';
  return h;
}

/* PESB 是另一门课。09-20 她说首页看见它「呼吸困难」，所以默认收起来，卡一张没删。 */
/* 卡属于哪一门，看 id 前缀。'' ＝ 生化。 */
function subjOf(c){
  var k = String(c && c.id);
  if (k.indexOf('pe-') === 0) return 'pe';
  if (k.indexOf('mb-') === 0) return 'mb';
  return '';
}
var PESBOPEN = false;
function pesbToggle(){ PESBOPEN = !PESBOPEN; renderList(); }

function renderList(){
  document.getElementById('top').innerHTML =
    '<span class="id">口试卡 · 生化</span>';
  document.getElementById('nav').classList.add('hide');

  var built = [], todo = [], cross = [];
  var pesb = [], mb = [];
  for (var i=0;i<CARDS.length;i++){
    var cc = CARDS[i];
    /* PESB 是另一门课，不能跟生化的横向卡混在一段里——她找不到。 */
    if (String(cc.id).indexOf('pe-') === 0) pesb.push(cc);
    else if (String(cc.id).indexOf('mb-') === 0) mb.push(cc);
    else if (cc.cross) cross.push(cc);
    else built.push(cc);
  }
  var haveN = {};
  /* 一张卡可能吸收好几道题（merged）。只看主题号，被吸收的那几道会一直显示成待做。 */
  for (i=0;i<built.length;i++){
    haveN[built[i].n] = 1;
    var mg = built[i].merged || [];
    for (var j=0;j<mg.length;j++) haveN[mg[j]] = 1;
  }
  for (i=0;i<QINDEX.length;i++) if (!haveN[QINDEX[i].n]) todo.push(QINDEX[i]);

  function rowCard(c){
    var mg = c.merged && c.merged.length ? ' ＋#' + c.merged.join('、#') : '';
    return '<a class="row" href="#/c/' + c.id + '">'
      + '<span class="w ' + (subjOf(c) ? 'pe' : (c.cross ? 'mid' : 'hi')) + '">'
      + (subjOf(c) === 'pe' ? 'PE' : (subjOf(c) === 'mb' ? 'MB' : (c.cross ? '横' : '卡'))) + '</span>'
      + '<span class="t"><b>' + c.q + '</b><span>'
      + (c.n ? '#' + c.n + mg + ' · ' : '') + esc(c.qcn) + '</span></span>'
      + '<span class="st ' + statusOf(c.id).cls + '">' + statusOf(c.id).txt + '</span></a>';
  }
  function bwCls(bw){ return bw >= 45 ? 'hi' : (bw >= 20 ? 'mid' : (bw > 0 ? 'lo' : 'non')); }
  function flagsOf(r){
    var f = [];
    if (r.rep === 2) f.push('<i>他写了两遍</i>');
    if (r.bw === 0) f.push('<b>书里没有</b>');
    if (r.gap === 'gap!') f.push('<b>实测答不上</b>');
    else if (r.gap === 'gap') f.push('<b>没学过</b>');
    else if (r.gap === 'ok') f.push('主场');
    return f.length ? '<span class="flags">' + f.join(' · ') + '</span>' : '';
  }
  function rowTodo(r){
    return '<div class="row todo" data-s="' + (r.en + ' ' + r.cn).toLowerCase() + '">'
      + '<span class="w ' + bwCls(r.bw) + '">' + (r.bw || '—') + '</span>'
      + '<span class="t"><b>' + r.en + '</b><span>#' + r.n + ' · ' + esc(r.cn) + '</span>'
      + flagsOf(r) + '</span>'
      + '<span class="go">未写</span></div>';
  }

  var p = loadP(), t = today(), todayN = 0, dueN = 0, neverN = 0, totalRuns = 0;
  var all = built.concat(cross), dueLinks = '';
  for (i=0;i<all.length;i++){
    var r = p[all[i].id];
    if (!r || !r.runs.length){ neverN++; continue; }
    totalRuns += r.runs.length;
    if (r.runs[r.runs.length-1].d === t) todayN++;
    if (dueIn(r) <= 0){ dueN++; dueLinks += '<a href="#/c/' + all[i].id + '">' + all[i].id + '</a>'; }

  else if (document.caretPositionFromPoint) {
    var cp = document.caretPositionFromPoint(e.clientX, e.clientY);
    if (cp) { range = document.createRange(); range.setStart(cp.offsetNode, cp.offset); }
  }
  if (!range || range.startContainer.nodeType !== 3) return;
  var node = range.startContainer, txt = node.nodeValue, i = range.startOffset;
  var isW = function(ch){ return /[A-Za-z0-9\u00C0-\u024F’'\-]/.test(ch || ''); };
  if (!isW(txt[i]) && !isW(txt[i-1])) return;
  var a = i, b = i;
  while (a > 0 && isW(txt[a-1])) a--;
  while (b < txt.length && isW(txt[b])) b++;
  var w = txt.slice(a, b).replace(/^[’'\-]+|[’'\-]+$/g, '');
  if (!w || !/[A-Za-z]/.test(w)) return;
  /* 追问的题目是 <summary>，点一下本来会开合。已经展开的就别关——她正在读那个答案，
     所以只查词；还没展开的顺手展开。收起用答案里那颗「收起 ▴」。
     点风险标签（实测/高）或空白处照常开合，因为那里没有英文单词。 */
  var sum = t.closest('summary');
  if (sum && sum.parentNode && sum.parentNode.open) e.preventDefault();
  speechSynthesis.cancel(); clearReading();
  var span = document.createElement('span'); span.className = 'wd';
  var r2 = document.createRange(); r2.setStart(node, a); r2.setEnd(node, b);
  var wrapped = false;
  try { r2.surroundContents(span); wrapped = true; } catch(err) {}
  var rect = (wrapped ? span : r2).getBoundingClientRect();
  playWord(w, function(){
    if (!wrapped) return;
    var p = span.parentNode; if (!p) return;
    p.replaceChild(document.createTextNode(span.textContent), span); p.normalize();
  });
  showWordPop(w, rect);
});

function buildCram(c){
  var h = '<div class="hero"><h1>' + c.q + '</h1><p class="sub">'
        + (c.n ? '#' + c.n + (c.merged&&c.merged.length ? ' / #'+c.merged.join(' / #') : '')
                 + ' · weight ' + c.w + ' · ' : '')
        + esc(c.sub) + '</p></div>';
  /* 每组有几格，先数一遍；顺便数这张卡一共几格，决定要不要默认收起。 */
  var L = c.cram || [], cnt = [], ptot = 0, gi = -1;
  for (var k=0;k<L.length;k++){
    if (L[k].g !== undefined){ cnt.push(0); gi++; }
    else { ptot++; if (gi >= 0) cnt[gi]++; }
  }
  /* 12 格以上才折叠。小卡不值得多一次点击。 */
  var fold = ptot > 12, gn2 = -1;
  if (fold) h += '<div class="grpbar"><button onclick="grpAll(1)">全部展开</button>'
              + '<button onclick="grpAll(0)">全部收起</button>'
              + '<span>共 ' + ptot + ' 格 · 点组名展开那一组</span></div>';
  var open = false;
  for (var i=0;i<L.length;i++){
    var b = L[i];
    if (b.g !== undefined){
      if (open) h += '</details>';
      gn2++;
      h += '<details class="grp"' + (fold ? '' : ' open') + '>'
         + '<summary class="grp-h"><b class="car">▶</b><span>' + b.g + '</span><i></i>'
         + '<b class="cnt">' + (cnt[gn2] || 0) + ' 格</b></summary>'
         + (b.gn ? '<p class="grp-note">' + b.gn + '</p>' : '');
      open = true; continue;
    }
    h += '<div class="pt">'
       + (b.n || b.t ? '<p class="pt-n">' + esc(b.n) + (b.n && b.t ? ' · ' : '') + esc(b.t) + '</p>' : '')
       + (b.big ? '<p class="pt-big">' + b.big + '</p>' : '')
       /* R14：有最短版就把它摆在最上面，完整版收起来。她背的是最短版。 */
       + (b.ez ? '<div class="ezb"><p class="lbl">先背这句</p><p class="ez" data-say="' + escAttr(b.ez) + '">' + unspell(b.ez) + '</p>'
            + (b.ezcn ? '<p class="ezcn">' + b.ezcn + '</p>' : '') + '</div>' : '')
       + (b.en ? (b.ez
            ? '<details class="full"><summary>完整版 ▾ 不用背，想看再点</summary>'
              + '<p class="en">' + b.en + '</p></details>'
            : '<p class="en">' + b.en + '</p>') : '')
       + (b.tbl ? tbl(b.tbl) : '')
       + (b.note ? '<p class="nt">' + b.note + '</p>' : '')
       + (b.warn ? '<div class="wn"><b>⚠</b> ' + b.warn + '</div>' : '')
       + (b.good ? '<div class="gd">' + b.good + '</div>' : '')
       + fig(b.fig)
       + '</div>';
  }
  if (open) h += '</details>';
  if (c.end) h += '<div class="endnote">' + c.end + '</div>';
  return h;
}

/* =================== behaviour =================== */
/* 对答案那一屏的清单。buildDrill 先把它写进 HTML（这样「必背」离屏重建正文时
   文字跟真页面一模一样），wireSib 再用同一段 HTML 覆盖一遍并挂事件，结果不变。 */
function sibHtml(c){
  if (!c || !c.sib) return '';
  var u = '';
  for (var j=0;j<c.sib.length;j++){
    u += '<li><span class="bx"></span><span class="txt">' + c.sib[j][0] + '</span>'
      +  '<button class="more" title="展开">?</button>'
      +  '<div class="detail"><p class="e">' + c.sib[j][1] + '</p>'
      +  '<p class="c">' + c.sib[j][2] + '</p></div></li>';
  }
  return u;
}
function wireSib(){
  var sib = document.getElementById('sib');
  if (!sib || !C.sib) return;
  sib.innerHTML = sibHtml(C);
  sib.addEventListener('click', function(e){
    var li = e.target.closest('li'); if (!li) return;
    if (e.target.classList.contains('more')){ li.classList.toggle('open'); return; }
    if (e.target.closest('.detail')) return;
    li.classList.toggle('hit'); tally();
  });
}
function tally(){
  var all = document.querySelectorAll('#sib li').length;
  var hit = document.querySelectorAll('#sib li.hit').length;
  var miss = all - hit, t = document.getElementById('tally');
  if (!t) return;
  if (hit === 0){ t.className = 'tally'; t.textContent = '还没点'; return; }
  if (miss <= 2){ t.className = 'tally pass'; t.textContent = '漏 ' + miss + ' 条 · 过了，往下走'; }
  else { t.className = 'tally fail'; t.textContent = '漏 ' + miss + ' 条 · 回第一屏，把整段重说一遍'; }
}
function paint(){
  for (var i=0;i<steps.length;i++) steps[i].classList.toggle('on', i === cur);
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = LAB[cur] || '下一步';
  window.scrollTo(0,0);
}
function mode(m){
  M = m;
  var ids = ['cram','drill','ask','figs'];
  for (var i=0;i<ids.length;i++){
    var el = document.getElementById(ids[i]);
    if (el) el.style.display = (ids[i] === m) ? 'block' : 'none';
  }
  var bt = {cram:'mCram', drill:'mDrill', ask:'mAsk', figs:'mFig'};
  for (var k in bt){ var b = document.getElementById(bt[k]); if (b) b.classList.toggle('on', k === m); }
  document.getElementById('nav').classList.toggle('hide', m !== 'drill');
  if (m === 'drill') paint(); else window.scrollTo(0,0);
}
document.getElementById('next').onclick = function(){
  if (cur === steps.length - 1){ cur = 0; resetSib(); } else cur++;
  paint();
};
document.getElementById('prev').onclick = function(){ if (cur > 0) cur--; paint(); };
function resetSib(){
  var li = document.querySelectorAll('#sib li');
  for (var i=0;i<li.length;i++){ li[i].classList.remove('hit'); li[i].classList.remove('open'); }
  tally();
}
document.addEventListener('keydown', function(e){
  if (M !== 'drill' || !steps.length) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); document.getElementById('next').click(); }
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
});


function markRun(spoken){
  var box = document.getElementById('deltaBox');
  if (!spoken){
    box.innerHTML = '<div class="note" style="text-align:left"><p style="margin:0">'
      + '没记。<b>回第一屏，出声说一遍再来。</b>看得懂不等于说得出——'
      + 'PESB 那次五个失分点全是说出口的时候错的。</p></div>';
    return;
  }
  var all = document.querySelectorAll('#sib li').length;
  var hit = document.querySelectorAll('#sib li.hit').length;
  var miss = all ? all - hit : 0;
  var before = (loadP()[C.id] || {runs:[]}).runs.slice(-1)[0];
  var r = recordRun(C.id, miss);
  var msg = '';
  if (before){
    var d = before.m - miss;
    if (d > 0) msg = '上次漏 ' + before.m + '，这次漏 ' + miss + '，<b>少漏了 ' + d + ' 条</b>。';
    else if (d === 0) msg = '上次也是漏 ' + miss + ' 条。<b>同一批点还没吃下去</b>，看看是不是同几条。';
    else msg = '上次漏 ' + before.m + '，这次漏 ' + (miss) + '。<b>退步了</b>——多半是隔太久，明天再来一次。';
  } else {
    msg = '第一次。漏 ' + miss + ' 条。';
  }
  var next = miss <= 2 ? '三天后再练这张。' : '<b>明天就要再练一次</b>，漏三条以上说明还没稳。';
  box.innerHTML = '<div class="delta">' + msg + '<br>' + next + '</div>'
    + '<div class="note" style="text-align:left"><p style="margin:0">'
    + '记下了，第 ' + r.runs.length + ' 次。回首页点「复制进度给老师」，我看数字给你点评。</p></div>';
}

/* =================== 必背 · 她自己划出来的段 ===================
   2026-09-15 Ruojin：「我选中（不管长短，不管是到哪个词，而不是看你自己确定的
   段落/句子/词语）然后标记为重点需要背」。
   这是第一个**往下减**的功能：三十张卡在这里变成她自己挑的一份短清单，
   考前一晚只读 #/mk 那一页。

   卡的 HTML 每次导航都重新生成，所以标记不能存位置，只能存**文字本身**：
   选中的原文 ＋ 前后各 48 个字的上下文。每次渲染完把正文的文本节点走一遍拼成
   一条纯文本，用上下文把重复出现的那几处分开，再**逐个文本节点**包成 span.mk
   （所以一段话跨了几个标签也能包住）。
   找不回来的**不删**，在清单里单独一节标出来，由她决定重划还是删。 */
var MKK = 'oralexam.mark.v1';
var MKCTX = 48;
var MKSEC = {cram:'速背', drill:'演练', ask:'追问', figs:'图'};
var MKSKIP = '.spk, .favs, .fold';          /* 这几个按钮是渲染后塞进正文的，还会变字（☆/★），不算正文 */
var mkSel = null, mkTimer = null, mkToastT = null, MKJUMP = '';

function mkLoad(){ try { return JSON.parse(localStorage.getItem(MKK)) || []; } catch(e){ return []; } }
function mkSave(a){ try { localStorage.setItem(MKK, JSON.stringify(a)); } catch(e){} }
function mkNewId(){ return String(Date.now()) + '-' + String(Math.floor(Math.random() * 1000000)); }
function mkGo(){ location.hash = '#/mk'; }
/* 卡上的字里有 < 和 &（ΔG < 0 之类），清单页要转义，不然会把那一行吃掉 */
function mkEsc(x){
  return String(x == null ? '' : x).split('&').join('&amp;').split('<').join('&lt;')
         .split('>').join('&gt;').split('"').join('&quot;');
}

/* ---- 正文的纯文本 ---- */
function mkNodes(root){
  var out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  while (w.nextNode()){
    var n = w.currentNode, p = n.parentNode;
    if (!p || !n.nodeValue || !n.nodeValue.length) continue;
    if (p.closest && p.closest(MKSKIP)) continue;
    out.push(n);
  }
  return out;
}
function mkPlain(nodes){
  var s = '', st = [];
  for (var i=0;i<nodes.length;i++){ st.push(s.length); s += nodes[i].nodeValue; }
  return {s:s, starts:st};
}
/* 空白折叠成一个空格，并记下每个字回到原文的位置。
   这样卡里换行、缩进改了，标记还能对上。 */
function mkIsSp(c){ return c === 32 || c === 9 || c === 10 || c === 13 || c === 12 || c === 160; }
function mkNorm(s){
  var out = '', map = [], prev = false;
  for (var i=0;i<s.length;i++){
    if (mkIsSp(s.charCodeAt(i))){
      if (prev) continue;
      out += ' '; map.push(i); prev = true;
    } else { out += s.charAt(i); map.push(i); prev = false; }
  }
  map.push(s.length);
  return {s:out, map:map};
}
function mkTrim(s){
  var a = 0, b = s.length;
  while (a < b && mkIsSp(s.charCodeAt(a))) a++;
  while (b > a && mkIsSp(s.charCodeAt(b-1))) b--;
  return s.slice(a, b);
}
function mkFlat(s){ return mkNorm(String(s == null ? '' : s)).s; }

/* ---- 找回一段：先按文字找，有好几处就比上下文 ---- */
function mkLocate(N, m){
  var needle = mkTrim(mkFlat(m.text));
  if (needle.length < 1) return null;
  var hay = N.s, hits = [], i = hay.indexOf(needle);
  while (i > -1 && hits.length < 300){ hits.push(i); i = hay.indexOf(needle, i + 1); }
  if (!hits.length) return null;
  var pre = mkFlat(m.pre), post = mkFlat(m.post), best = hits[0], bestSc = -1;
  for (var k=0;k<hits.length;k++){
    var at = hits[k], sc = 0, lim = Math.min(pre.length, at);
    while (sc < lim && pre.charAt(pre.length - 1 - sc) === hay.charAt(at - 1 - sc)) sc++;
    var end = at + needle.length, sc2 = 0, lim2 = Math.min(post.length, hay.length - end);
    while (sc2 < lim2 && post.charAt(sc2) === hay.charAt(end + sc2)) sc2++;
    if (sc + sc2 > bestSc){ bestSc = sc + sc2; best = at; }
  }
  return {a: N.map[best], b: N.map[best + needle.length]};
}

/* ---- 包起来。一段话可能横跨好几个文本节点（粗体里一半、后面一句一半），
       所以不去 surroundContents 整个区间，而是**一个文本节点切一刀包一个**。 ---- */
function mkWrap(root, id, a, b, kind){
  var nodes = mkNodes(root), P = mkPlain(nodes), got = 0;
  for (var i=0;i<nodes.length;i++){
    var node = nodes[i], ns = P.starts[i], len = node.nodeValue.length, ne = ns + len;
    if (ne <= a || ns >= b) continue;
    var s0 = Math.max(a, ns) - ns, e0 = Math.min(b, ne) - ns;
    if (e0 <= s0) continue;
    var t = node;
    if (e0 < len) t.splitText(e0);          /* 先切尾 */
    if (s0 > 0) t = t.splitText(s0);        /* 再切头，剩下的就是要包的那一截 */
    var par = t.parentNode; if (!par) continue;
    var sp = document.createElement('span');
    sp.className = 'mk' + (kind === 'x' ? ' mkskip' : '');
    sp.setAttribute('data-mk', id);
    par.replaceChild(sp, t); sp.appendChild(t);
    got++;
  }
  return got;
}
function mkStrip(root){
  var els = root.querySelectorAll ? root.querySelectorAll('span.mk') : [];
  for (var i=els.length-1;i>=0;i--){          /* 倒着来：两段套在一起时先脱里面那层 */
    var e = els[i], p = e.parentNode; if (!p) continue;
    while (e.firstChild) p.insertBefore(e.firstChild, e);
    p.removeChild(e);
  }
  if (els.length && root.normalize) root.normalize();
}
function mkForCard(id){
  var a = mkLoad(), out = [];
  for (var i=0;i<a.length;i++) if (a[i].card === id) out.push(a[i]);
  return out;
}
/* 当前这张卡：先把旧的高亮全脱掉（可以重复跑），再一条条包回去。
   包不上的记 miss=1 存起来，清单页照这个标「找不到了」。 */
function mkApplyAll(){
  var root = document.getElementById('main');
  if (!root || !window.C || !document.getElementById('cram')) return;
  mkStrip(root);
  var all = mkLoad(), dirty = false, any = false;
  for (var i=0;i<all.length;i++){
    if (all[i].card !== C.id) continue;
    any = true;
    var N = mkNorm(mkPlain(mkNodes(root)).s);   /* 每条都重新拼一次：上一条已经把节点切开了 */
    var hit = mkLocate(N, all[i]), ok = false;
    if (hit && hit.b > hit.a) ok = mkWrap(root, all[i].id, hit.a, hit.b, all[i].k) > 0;
    if (ok && all[i].miss){ delete all[i].miss; dirty = true; }
    if (!ok && !all[i].miss){ all[i].miss = 1; dirty = true; }
  }
  if (any && dirty) mkSave(all);
}
function mkSyncBtn(){
  var b = document.getElementById('mMk');
  if (!b || !window.C) return;
  var g = mkForCard(C.id), n = 0;
  for (var i=0;i<g.length;i++) if (g[i].k !== 'x') n++;
  b.textContent = n ? ('必背 ' + n) : '必背';
}

/* ---- 选中 → 冒出「★ 标成必背」 ---- */
function mkSecOf(node){
  var el = (node && node.nodeType === 3) ? node.parentNode : node;
  if (!el || !el.closest) return '';
  var s = el.closest('#cram, #drill, #ask, #figs');
  return s ? s.id : '';
}
function mkOffset(nodes, starts, container, offset){
  if (!container) return -1;
  if (container.nodeType === 3){
    for (var i=0;i<nodes.length;i++) if (nodes[i] === container) return starts[i] + offset;
    return -1;
  }
  var child = container.childNodes ? container.childNodes[offset] : null;
  if (child){
    for (var j=0;j<nodes.length;j++)
      if (nodes[j] === child || (child.nodeType === 1 && child.contains(nodes[j]))) return starts[j];
  }
  for (var k=nodes.length-1;k>=0;k--)
    if (container.contains && container.contains(nodes[k])) return starts[k] + nodes[k].nodeValue.length;
  return -1;
}
function mkHidePop(){ var p = document.getElementById('mkpop'); if (p) p.style.display = 'none'; }
function mkPop(){
  var pop = document.getElementById('mkpop');
  if (!pop){
    pop = document.createElement('div'); pop.id = 'mkpop';
    pop.addEventListener('mousedown', function(ev){ ev.preventDefault(); });  /* 别把选区点没了 */
    document.body.appendChild(pop);
  }
  return pop;
}
function mkShowPop(rect, id){
  var pop = mkPop();
  pop.innerHTML = '';
  var b = document.createElement('button');
  b.type = 'button';
  if (id){
    /* 点已有的高亮＝取消它。划掉的那种说「不背了」是反的，所以按种类换字。 */
    var rec = null, arr = mkLoad();
    for (var q=0;q<arr.length;q++) if (arr[q].id === id) rec = arr[q];
    b.className = 'off';
    b.textContent = (rec && rec.k === 'x') ? '✕ 取消划掉' : '✕ 不背了';
    b.onclick = function(){ mkOff(id); };
  }
  else {
    b.textContent = '★ 标成必背'; b.onclick = function(){ mkAdd(); };
    var wp = document.getElementById('wpop');          /* 双击选词时两个浮框会叠在一起 */
    if (wp) wp.style.display = 'none';
  }
  pop.appendChild(b);
  if (!id){                                            /* 反面那个：把这一段从要背的量里拿走 */
    var b2 = document.createElement('button');
    b2.type = 'button'; b2.className = 'off'; b2.textContent = '\u2298 \u4e0d\u7528\u80cc';
    b2.onclick = function(){ mkAdd('x'); };
    pop.appendChild(b2);
  }
  pop.style.display = 'block';
  var w = pop.offsetWidth || 130, h = pop.offsetHeight || 40;
  var left = Math.max(8, Math.min(rect.left, window.innerWidth - w - 8));
  var top = rect.bottom + 14;                 /* 放选区下面：手机自带的复制条在上面 */
  if (top + h > window.innerHeight - 8) top = Math.max(8, rect.top - h - 14);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function mkCheckSel(){
  var sel = window.getSelection && window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed || !window.C){ mkSel = null; mkHidePop(); return; }
  var r = sel.getRangeAt(0), sec = mkSecOf(r.startContainer);
  var root = document.getElementById('main');
  if (!sec || !root || !root.contains(r.endContainer)){ mkSel = null; mkHidePop(); return; }
  var nodes = mkNodes(root), P = mkPlain(nodes);
  var a = mkOffset(nodes, P.starts, r.startContainer, r.startOffset);
  var b = mkOffset(nodes, P.starts, r.endContainer, r.endOffset);
  if (a < 0 || b < 0 || b <= a){
    var raw = mkTrim(sel.toString());                 /* 退一步：直接在正文里找这串字 */
    var at = raw.length > 1 ? P.s.indexOf(raw) : -1;
    if (at < 0){ mkSel = null; mkHidePop(); return; }
    a = at; b = at + raw.length;
  }
  var cut = P.s.slice(a, b), txt = mkTrim(cut);
  if (txt.length < 2){ mkSel = null; mkHidePop(); return; }
  var a2 = a + cut.indexOf(txt), b2 = a2 + txt.length;
  mkSel = {card: C.id, sec: sec, text: txt,
           pre: P.s.slice(Math.max(0, a2 - MKCTX), a2), post: P.s.slice(b2, b2 + MKCTX)};
  mkShowPop(r.getBoundingClientRect(), '');
}
document.addEventListener('selectionchange', function(){
  if (mkTimer) clearTimeout(mkTimer);
  mkTimer = setTimeout(mkCheckSel, 260);      /* 等她把手指松开、拖完把手再冒出来 */
});
function mkAdd(kind){
  if (!mkSel) return;
  var all = mkLoad(), isX = (kind === 'x');
  for (var i=0;i<all.length;i++)
    if (all[i].card === mkSel.card && all[i].text === mkSel.text && all[i].pre === mkSel.pre){
      /* 同一段已经标过了。种类不同就直接换过去，不用先取消再标一次。 */
      var was = (all[i].k === 'x');
      if (was === isX){ mkSel = null; mkHidePop(); mkToast('这一段已经标过了'); return; }
      if (isX) all[i].k = 'x'; else delete all[i].k;
      mkSave(all); mkSel = null; mkHidePop();
      mkApplyAll(); mkSyncBtn();
      mkToast(isX ? '改成「不用背」了' : '改成「必背」了');
      return;
    }
  var rec = {id: mkNewId(), card: mkSel.card, sec: mkSel.sec, text: mkSel.text,
             pre: mkSel.pre, post: mkSel.post, ts: Date.now()};
  if (isX) rec.k = 'x';
  all.push(rec);
  mkSave(all);
  mkSel = null; mkHidePop();
  var s = window.getSelection && window.getSelection();
  if (s && s.removeAllRanges) s.removeAllRanges();
  mkApplyAll(); mkSyncBtn();
  mkToast(isX ? '划掉了 · 这一段不用背' : ('标好了 · 必背一共 ' + mkCount() + ' 段'));
}
/* 顶栏那个计数只数「必背」——划掉的不该让这个数字变大 */
function mkCount(){
  var a = mkLoad(), k = 0;
  for (var i=0;i<a.length;i++) if (a[i].k !== 'x') k++;
  return k;
}
function mkOff(id){
  var all = mkLoad(), out = [];
  for (var i=0;i<all.length;i++) if (all[i].id !== id) out.push(all[i]);
  mkSave(out); mkHidePop();
  mkApplyAll(); mkSyncBtn();
  mkToast('取消了');
}
function mkDrop(i){
  var all = mkLoad();
  if (i < 0 || i >= all.length) return;
  all.splice(i, 1); mkSave(all);
  if (location.hash === '#/mk') mkRenderMk();
  else { mkApplyAll(); mkSyncBtn(); }
}
function mkToast(msg){
  var t = document.getElementById('mktoast');
  if (!t){ t = document.createElement('div'); t.id = 'mktoast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  if (mkToastT) clearTimeout(mkToastT);
  mkToastT = setTimeout(function(){ t.style.display = 'none'; }, 1900);
}
/* 点已经标上的那一段 = 问要不要取消。capture 里拦下来，免得同时又弹出读词的框。
   遮词模式下盖着的 b 不拦——那一下是翻开它。 */
document.addEventListener('click', function(e){
  if (!e.target || !e.target.closest) return;
  if (e.target.closest('#mkpop')) return;
  var mk = e.target.closest('span.mk');
  if (!mk){ if (!mkSel) mkHidePop(); return; }
  if (e.target.closest('a, button, summary, input, textarea, select')) return;
  if (document.body.classList.contains('cloze') && e.target.closest('b')) return;
  var sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed && sel.toString().length > 1) return;   /* 正在划字，不打扰 */
  var wp = document.getElementById('wpop'); if (wp) wp.style.display = 'none';
  e.stopPropagation();
  mkSel = null;
  mkShowPop(mk.getBoundingClientRect(), mk.getAttribute('data-mk'));
}, true);
window.addEventListener('scroll', function(){
  var pop = document.getElementById('mkpop');
  if (!pop || pop.style.display !== 'block') return;
  var sel = window.getSelection && window.getSelection();
  if (mkSel && sel && sel.rangeCount && !sel.isCollapsed){
    mkShowPop(sel.getRangeAt(0).getBoundingClientRect(), '');
    return;
  }
  pop.style.display = 'none';
}, {passive:true});

/* ---- 清单页 #/mk ---- */
/* 离屏把一张卡的正文重新生成一遍，只为了确认那几段还在不在。
   用 template：里面的 img 不会真去下载。 */
var MKTX = {};
function mkCardText(c){
  if (MKTX[c.id] !== undefined) return MKTX[c.id];   /* 删一条就重画一次，别把二十张卡又拼一遍 */
  var t = document.createElement('template');
  t.innerHTML = '<section id="cram">' + buildCram(c) + '</section>'
              + '<div id="drill">' + buildDrill(c) + '</div>'
              + '<section id="ask">' + buildAsk(c) + '</section>'
              + '<section id="figs">' + buildFigs(c) + '</section>';
  MKTX[c.id] = mkPlain(mkNodes(t.content)).s;
  return MKTX[c.id];
}
function mkRow(o, cid){
  return '<li' + (o.m.k === 'x' ? ' class="skiprow"' : '') + '><span class="mt">' + mkEsc(o.m.text)
    + '<span class="mw">' + (o.m.k === 'x' ? '\u4e0d\u7528\u80cc \u00b7 ' : '')
    + (MKSEC[o.m.sec] || '正文')
    + (o.lab ? ' · ' + mkEsc(o.lab) : '') + '</span></span>'
    + (cid ? '<a class="mg" href="#/c/' + mkEsc(cid) + '/k/' + mkEsc(o.m.id) + '">进卡</a>' : '')
    + '<button class="mx" type="button" title="删掉" onclick="mkDrop(' + o.i + ')">✕</button></li>';
}
function mkRenderMk(){
  document.getElementById('top').innerHTML =
    '<a class="home" href="#/">← 全部</a><span class="id">必背</span>';
  var nav = document.getElementById('nav'); if (nav) nav.classList.add('hide');
  mkHidePop();

  var all = mkLoad(), built = [], cross = [];
  for (var i=0;i<CARDS.length;i++) (CARDS[i].cross ? cross : built).push(CARDS[i]);
  built.sort(function(a,b){ return (a.id > b.id) ? 1 : -1; });
  var seq = built.concat(cross), byCard = {}, stale = [], okN = 0, skipN = 0, cardN = 0, dirty = false;
  for (i=0;i<all.length;i++){
    var k = all[i].card;
    (byCard[k] = byCard[k] || []).push({m: all[i], i: i});
  }
  var body = '';
  for (i=0;i<seq.length;i++){
    var c = seq[i], g = byCard[c.id];
    if (!g || !g.length) continue;
    delete byCard[c.id];
    var N = mkNorm(mkCardText(c)), rows = '', liveN = 0;
    for (var j=0;j<g.length;j++){
      var hit = mkLocate(N, g[j].m);
      if (hit){
        if (g[j].m.miss){ delete g[j].m.miss; dirty = true; }
        rows += mkRow(g[j], c.id); liveN++; okN++;
        if (g[j].m.k === 'x') skipN++;
      } else {
        if (!g[j].m.miss){ g[j].m.miss = 1; dirty = true; }
        g[j].lab = '卡 ' + c.id;
        stale.push({o: g[j], cid: c.id});
      }
    }
    if (!liveN) continue;
    cardN++;
    body += '<div class="mkgrp"><h3><a href="#/c/' + mkEsc(c.id) + '" style="text-decoration:none">'
         + c.q + '</a></h3><p class="mn">'
         + (c.cross ? '横向卡 · ' : (c.n ? '#' + c.n + ' · ' : ''))
         + '卡 ' + mkEsc(c.id) + ' · ' + liveN + ' 段</p>'
         + '<ul class="mklist">' + rows + '</ul></div>';
  }
  /* 卡本身没了（改过 id 或者删掉了）的标记也留着 */
  for (var kk in byCard){
    var g2 = byCard[kk];
    for (var q=0;q<g2.length;q++){ g2[q].lab = '卡 ' + kk + '（这张卡现在不在了）'; stale.push({o: g2[q], cid: ''}); }
  }
  if (dirty) mkSave(all);

  var h = '<div class="lhero"><h1>我划过的段</h1><p>'
    + (okN - skipN) + ' 段必背 · ' + skipN + ' 段不用背 · 来自 ' + cardN + ' 张卡'
    + (stale.length ? ' · <b>' + stale.length + ' 段找不到了</b>' : '')
    + '</p><p class="sub2" style="margin-top:10px">这一页是你自己划出来的，不是我挑的。'
    + '<b>考前一晚只读这里。</b><br>在任何一张卡里选中一段话——不管多长，划到哪个词都行——'
    + '下面会冒出两个按钮：<b>★ 标成必背</b> 和 <b>⊘ 不用背</b>。'
    + '划掉的那些在卡上是灰的、带删除线，等于从要背的量里拿走了。'
    + '点卡里的高亮可以取消，再标一次可以换种类。只存在这台机器上。</p></div>';
  if (!all.length){
    h += '<p class="sub2" style="margin-top:20px">还是空的。随便打开一张卡，用手指或鼠标划一段，'
      + '点「★ 标成必背」或者「⊘ 不用背」。划多划少都行，边界你自己定。</p>';
  }
  h += body;
  if (stale.length){
    var sr = '';
    for (i=0;i<stale.length;i++) sr += mkRow(stale[i].o, stale[i].cid);
    h += '<div class="mkgrp"><h3>找不到了 · ' + stale.length + ' 段</h3>'
      + '<p class="mn"><b>卡的正文改过，这几段按原文对不上了。</b>'
      + '一条都没删——原文都在下面，你自己决定是回卡里重新划一次，还是删掉。</p>'
      + '<ul class="mklist mkstale">' + sr + '</ul></div>';
  }
  document.getElementById('main').innerHTML = h;
  window.scrollTo(0, 0);
}
/* #/c/<卡>/k/<标记> —— 从清单点「进卡」，直接跳到那一段 */
function mkPath(){

var FK = 'oralexam.fav.v1';
function loadF(){ try { return JSON.parse(localStorage.getItem(FK)) || []; } catch(e){ return []; } }
function saveF(f){ try { localStorage.setItem(FK, JSON.stringify(f)); } catch(e){} }
function favKey(t, text){ return t + '|' + String(text).trim().toLowerCase(); }
function favHas(t, text){ var k = favKey(t, text); return loadF().some(function(x){ return favKey(x.t, x.text) === k; }); }
function favToggle(t, text){
  var f = loadF(), k = favKey(t, text), i = -1;
  for (var j=0;j<f.length;j++) if (favKey(f[j].t, f[j].text) === k) { i = j; break; }
  if (i >= 0) f.splice(i, 1); else f.push({t:t, text:String(text).trim(), card:(window.C && C.id) || '', ts:Date.now()});
  saveF(f); return i < 0;
}
function favRemove(i){ var f = loadF(); f.splice(i, 1); saveF(f); renderFav(); }
function speakText(txt){
  var one = String(txt).trim();
  if (/^[A-Za-z’'\-]+$/.test(one) && wordFile(one)){ if (window.speechSynthesis) speechSynthesis.cancel(); clearReading(); playWord(one); return; }
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel(); clearReading();
  var u = utter(txt, txt.split(' ').length > 3 ? 0.9 : 0.85);
  speechSynthesis.speak(u);
}
/* 释义查表。卡上是 accelerates，表里是 accelerate，所以要先把词形还原。 */
var WSUF = [['s',''],['es',''],['ies','y'],['ed',''],['ed','e'],['ing',''],['ing','e'],
            ['er',''],['est',''],['ly',''],['ations','ate'],['ation','ate'],['ally','al']];
function glossOf(w){
  var G = window.GLOSS || {};
  var k = (w || '').toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, '');
  if (!k) return null;
  if (G[k]) return G[k];
  for (var i=0;i<WSUF.length;i++){
    var suf = WSUF[i][0];
    if (k.length - suf.length >= 3 && k.slice(-suf.length) === suf){
      var c = k.slice(0, k.length - suf.length) + WSUF[i][1];
      if (G[c]) return G[c];
    }
  }
  if (k.indexOf('-') >= 0){
    var parts = k.split('-');
    for (i=0;i<parts.length;i++) if (parts[i].length > 4 && G[parts[i]]) return G[parts[i]];
  }
  return null;
}
/* 释义是哪来的。她看见「通用词典」就知道这条要打折听。 */
function srcLine(g){
  if (!g) return '';
  if (g.s === 2) return '释义来自<b>通用英汉词典</b>——那是通用义，生化里可能不是这个意思，以上面那句原句为准。';
  if (g.s === 3) return '英文释义来自<b>你自己的生化词库</b>，中文是<b>通用词典</b>补的。';
  return '来自<b>你自己的生化词库</b>（按生化写的）。';
}

function favWord(btn){

/* 把收藏的词和句复制出去。念错的词她点星，复制过来我就能修音频。
   起因 2026-09-14：「你再检查一下所有词的发音，比如 ester/diester/phosphodiester 发音不准确」。 */
function copyFav(){
  var f = loadF(), w = [], s = [];
  f.forEach(function(x){ (x.t === 'w' ? w : s).push(x.text + (x.card ? '（卡 ' + x.card + '）' : '')); });
  var t = ['不会念 / 念错了 · ' + today(),
           '词 ' + w.length + ' 个：', w.join('、') || '（无）', '',
           '句 ' + s.length + ' 句：'].concat(s.length ? s : ['（无）']).join('\n');
  var ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); ok = true; } } catch(e){}
  if (!ok){
    var a = document.createElement('textarea');
    a.value = t; a.style.position = 'fixed'; a.style.top = '-1000px';
    document.body.appendChild(a); a.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(a);
  }
  alert(ok ? '复制好了，直接粘给我。\n\n音频念错的词也点星收藏，我照着修。' : t);
}

/* =================== 单词本 · 间隔重复 ===================
   卡片本身来自收藏的词（收藏＝加进单词本）。这里只存每个词的复习进度。
   算法是 SM-2 的简化版：记不住就回到一天，记住就按 ease 拉长。 */
var WBK = 'oralexam.wb.v1';
function wbLoad(){ try { return JSON.parse(localStorage.getItem(WBK)) || {}; } catch(e){ return {}; } }
function wbSave(o){ try { localStorage.setItem(WBK, JSON.stringify(o)); } catch(e){} }
function wbWords(){
  var out = [];
  loadF().forEach(function(x){ if (x.t === 'w') out.push(x); });
  return out;
}
function wbPlus(days){
  var d = new Date(); d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function wbGrade(word, g){
  var st = wbLoad(), r = st[word] || {i:0, e:2.5, n:0, lap:0};
  if (g === 0){ r.lap = (r.lap||0) + 1; r.e = Math.max(1.3, r.e - 0.2); r.i = 1; }
  else if (g === 1){ r.i = r.i ? Math.max(1, Math.round(r.i * r.e)) : 1; r.n = (r.n||0) + 1; }
  else { r.e = r.e + 0.15; r.i = r.i ? Math.round(r.i * r.e * 1.5) : 3; r.n = (r.n||0) + 1; }
  r.d = wbPlus(r.i);
  st[word] = r; wbSave(st);
}
function wbQueue(){
  var st = wbLoad(), t = today(), due = [], fresh = [];
  wbWords().forEach(function(x){
    var r = st[x.text];
    if (!r || !r.d) fresh.push(x);
    else if (r.d <= t) due.push(x);
  });
  return {due: due, fresh: fresh, all: wbWords().length};
}
/* 2026-09-21 她提的：「单词书跳转下一个单词就自动出下个单词的声音」。
   只在 wbNext()（真的翻到下一个词）时响；显示意思、展开清单这些重新渲染不响。
   默认开，可以关掉——图书馆里背的时候用得上。 */

function wbAuto(){ try { return localStorage.getItem(WBAK) !== '0'; } catch(e){ return true; } }
function wbToggleAuto(){ try { localStorage.setItem(WBAK, wbAuto() ? '0' : '1'); } catch(e){} renderWb(); }
var wbCur = null, wbShown = false;
/* 词库清单默认收起。她的话（2026-09-15）：「词库先隐藏」。
   单词本里只会出现她收藏过的词，没收藏的一个都不进来。 */
var wbListOpen = false;
function wbToggleList(){ wbListOpen = !wbListOpen; renderWb(); }
function wbNext(){
  var q = wbQueue();
  wbCur = q.due.length ? q.due[0] : (q.fresh.length ? q.fresh[0] : null);
  wbShown = false;
  renderWb();
  /* 有 mp3 就放 mp3，没有就退回语音合成——playWord 自己处理。
     浏览器要求先有用户手势，点「想起来了」就是手势；
     第一次进页面可能被拦，playWord 内部 catch 掉，不报错也不中断。 */

function wbShow(){ wbShown = true; renderWb(); }

  if (q.all && wbListOpen){

         + '<span class="due">' + (r2 && r2.d ? r2.d : '新') + '</span></li>';

  } else if (q.all){

  }

/* 题目单上这道题有没有写过答案。键是题面原文，两个 _ans_ 文件拼在同一个全局上。 */
function ansFor(qen){
