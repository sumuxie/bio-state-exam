<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>口试卡 · 生化</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --paper:#faf8f4; --ink:#1a1917; --dim:#716c64; --faint:#9a948b; --rule:#e4dfd5;
  --card:#fff; --accent:#7a5c2e; --soft:#f4eee2; --onAccent:#fff;
  --bad:#c2410c; --ok:#15803d;
  --good:#2f5d3a; --goodbg:#eef4ee;
  --warn:#8a4b12; --warnbg:#fcf1e3;
  --chip:#efeae1;
}
/* 跟系统走 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141311; --ink:#ece8e0; --dim:#a49e93; --faint:#7d776d; --rule:#302d28;
  --card:#1c1a17; --accent:#d0a969; --soft:#272117; --onAccent:#191714;
  --bad:#f08a5a; --ok:#6fc98a;
  --good:#93c7a0; --goodbg:#18221a;
  --warn:#e0a866; --warnbg:#271f14;
  --chip:#282520;
}}
/* 她自己按了「深」——系统是浅色也要变深 */
:root[data-theme="dark"]{
  --paper:#141311; --ink:#ece8e0; --dim:#a49e93; --faint:#7d776d; --rule:#302d28;
  --card:#1c1a17; --accent:#d0a969; --soft:#272117; --onAccent:#191714;
  --bad:#f08a5a; --ok:#6fc98a;
  --good:#93c7a0; --goodbg:#18221a;
  --warn:#e0a866; --warnbg:#271f14;
  --chip:#282520;
}
/* 书上裁下来的图本身是白纸，容器保持白的才不别扭；深色下压一点亮度，晚上不刺眼 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .figcard img,
  :root:not([data-theme="light"]) figure.fig img{filter:brightness(.86) contrast(1.02)}}
:root[data-theme="dark"] .figcard img,
:root[data-theme="dark"] figure.fig img{filter:brightness(.86) contrast(1.02)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
a{color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--paper) 93%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
  padding:10px 18px;display:flex;align-items:center;gap:12px}
.top .home{font-size:13px;color:var(--dim);text-decoration:none;border:1px solid var(--rule);
  border-radius:18px;padding:5px 13px;white-space:nowrap;cursor:pointer;background:var(--card)}
.top .home:hover{border-color:var(--accent);color:var(--accent)}
.thm{position:fixed;top:9px;right:12px;z-index:9;font-family:inherit;font-size:15px;
  line-height:1;border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:16px;padding:6px 11px;cursor:pointer;opacity:.82}
.thm:hover{opacity:1;border-color:var(--accent)}
.top .id{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.modes{display:flex;border:1px solid var(--rule);border-radius:20px;overflow:hidden;margin-left:auto}
.modes button{font-family:inherit;font-size:13px;border:none;background:transparent;color:var(--dim);
  padding:6px 16px;cursor:pointer;white-space:nowrap}
.modes button.on{background:var(--accent);color:var(--onAccent);font-weight:600}

main{max-width:680px;margin:0 auto;padding:0 20px 130px}

/* ---------- list ---------- */
.lhero{padding:40px 0 18px;border-bottom:1px solid var(--rule)}
.lhero h1{font-size:26px;margin:0 0 6px;font-weight:650;letter-spacing:-.015em}
.lhero p{font-size:14px;color:var(--faint);margin:0}
#search{width:100%;margin:20px 0 6px;padding:12px 15px;font-family:inherit;font-size:16px;
  border:1px solid var(--rule);border-radius:11px;background:var(--card);color:var(--ink)}
#search:focus{outline:none;border-color:var(--accent)}
.lgrp{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:34px 0 4px}
.lgrp-n{font-size:13.5px;color:var(--faint);margin:0 0 12px}
.row{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;margin-bottom:7px;
  background:var(--card);border:1px solid var(--rule);border-radius:11px;
  text-decoration:none;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row.todo{background:transparent;border-style:dashed;cursor:default;opacity:.72}
.row .w{flex:none;font-size:11px;font-weight:800;width:26px;height:26px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.row .w{font-size:12px}
.row .w.hi{background:var(--accent);color:var(--onAccent)}
.row .w.mid{background:var(--soft);color:var(--accent)}
.row .w.lo{background:var(--chip);color:var(--faint)}
.row .w.non{background:var(--warnbg);color:var(--warn)}
.row .flags{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.row .flags b{color:var(--warn)}
.row .flags i{font-style:normal;color:var(--accent)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15.5px;font-weight:600;line-height:1.5}
.row .t span{display:block;font-size:13px;color:var(--faint);margin-top:2px}
.row .go{flex:none;font-size:12px;color:var(--accent);font-weight:600;margin-top:5px;white-space:nowrap}
.row.todo .go{color:var(--faint);font-weight:400}

/* ---------- shared blocks ---------- */
.hero{padding:40px 0 8px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.hero h1{font-size:26px;line-height:1.33;margin:0 0 8px;font-weight:650;letter-spacing:-.015em}
.hero .sub{font-size:13.5px;color:var(--faint);margin:0 0 24px}
.grp{margin:44px 0 0}
.grp-h{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.grp-h span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.grp-h i{flex:1;height:1px;background:var(--rule)}
.grp-note{font-size:13.5px;color:var(--faint);margin:0 0 6px}
.pt{padding:32px 0 0}
.pt-n{font-size:11.5px;letter-spacing:.13em;color:var(--faint);font-variant-numeric:tabular-nums;
  margin:0 0 10px;font-weight:600}
.pt-big{font-size:22px;line-height:1.5;font-weight:650;margin:0 0 16px;letter-spacing:-.008em}
.pt-big b{color:var(--accent);font-weight:650}
.en{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:16px 19px;margin:0;
  font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.72}
.nt{font-size:14px;color:var(--dim);margin:13px 0 0;line-height:1.72}
.nt b{color:var(--ink)}
.wn{background:var(--warnbg);border-left:3px solid var(--warn);border-radius:0 10px 10px 0;
  padding:12px 16px;margin:13px 0 0;font-size:13.5px;line-height:1.7}
.wn b{color:var(--warn)}
.gd{background:var(--goodbg);border-left:3px solid var(--good);border-radius:0 10px 10px 0;
  padding:12px 16px;margin:13px 0 0;font-size:13.5px;line-height:1.7}
.gd b{color:var(--good)}
.pg{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--chip);
  border-radius:3px;padding:1px 6px;color:var(--faint);white-space:nowrap}
figure.fig{margin:15px 0 0;background:#fff;border:1px solid var(--rule);border-radius:10px;
  padding:10px 10px 6px}
figure.fig img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:4px}
figure.fig figcaption{font-size:12.5px;color:var(--faint);margin-top:8px;line-height:1.6}
figure.fig figcaption b{color:var(--ink)}
.endnote{margin:54px 0 0;padding:20px 22px;background:var(--soft);border-radius:12px;
  font-size:14.5px;line-height:1.75}
.endnote b{color:var(--accent)}
table.tb{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border:1px solid var(--rule);border-radius:11px;overflow:hidden;font-size:14.5px;margin:14px 0 0}
table.tb th{background:var(--soft);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);font-weight:700;padding:9px 12px;text-align:left}
table.tb td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:top;line-height:1.6}
.twrap{overflow-x:auto}

/* ---------- recog ---------- */
.recog{margin:26px 0 10px}
.recog h3{font-size:17px;margin:0 0 6px}
.recog > p{font-size:14px;color:var(--dim);margin:0 0 14px;line-height:1.72}
.recog > p b{color:var(--ink)}
.rq{background:var(--card);border:1px solid var(--rule);border-radius:11px;margin-bottom:8px;overflow:hidden}
.rq:hover{border-color:var(--accent)}
.rq.odd{background:var(--warnbg)}
.rq > summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.rq > summary::-webkit-details-marker{display:none}
.rq > summary::after{content:"+";margin-left:auto;color:var(--faint);font-size:18px;line-height:1;flex:none}
.rq[open] > summary::after{content:"\2013"}
.rq .qq{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.55;flex:1;min-width:0}
.rq .body{padding:0 15px 15px}
.rq .mean{font-size:13.5px;color:var(--dim);line-height:1.7;margin:0 0 12px;
  padding-left:12px;border-left:2px solid var(--rule)}
.rq .mean b{color:var(--ink)}

/* ---------- drill ---------- */
.step{display:none}
.step.on{display:block;animation:in .16s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#drill{padding-top:28px}
.tag{display:inline-block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--onAccent);background:var(--accent);border-radius:3px;padding:3px 10px;font-weight:650;margin-bottom:16px}
h2{font-size:22px;line-height:1.35;margin:0 0 12px;font-weight:650}
.lead{font-size:15px;color:var(--dim);margin:0 0 22px}
.askbox{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:36px 26px;text-align:center}
.askbox .q{font-size:25px;line-height:1.36;font-weight:650;margin:0 0 8px}
.askbox .qcn{font-size:13.5px;color:var(--faint);margin:0 0 28px}
.askbox .do{background:var(--soft);border-radius:10px;padding:15px 17px;font-size:15px;text-align:left;line-height:1.7}
.askbox .do b{color:var(--accent)}
ul.sib{list-style:none;margin:0;padding:0}
ul.sib li{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;cursor:pointer;
  font-size:15.5px;line-height:1.62;user-select:none;flex-wrap:wrap}
ul.sib li:hover{border-color:var(--accent)}
ul.sib li .bx{flex:none;width:21px;height:21px;border:2px solid var(--rule);border-radius:6px;margin-top:3px}
ul.sib li .txt{flex:1;min-width:0}
ul.sib li.hit{background:var(--goodbg);border-color:var(--good)}
ul.sib li.hit .bx{background:var(--good);border-color:var(--good);position:relative}
ul.sib li.hit .bx::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid var(--onAccent);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
ul.sib li .more{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--rule);
  background:transparent;color:var(--faint);font-size:14px;cursor:pointer;font-family:inherit;padding:0}
ul.sib li.open .more{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
ul.sib li .detail{display:none;flex-basis:100%;margin:11px 0 3px;padding-top:12px;border-top:1px dashed var(--rule)}
ul.sib li.open .detail{display:block}
ul.sib li .detail .e{font-family:Georgia,serif;font-size:16px;line-height:1.7;margin:0 0 9px}
ul.sib li .detail .c{font-size:14px;line-height:1.72;color:var(--dim);margin:0}
ul.sib li .detail .c b{color:var(--ink)}
.tally{margin-top:16px;padding:14px 17px;border-radius:10px;background:var(--chip);font-size:15px}
.tally.pass{background:var(--goodbg);color:var(--good);font-weight:600}
.tally.fail{background:var(--warnbg);color:var(--warn);font-weight:600}
.say{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:0 12px 12px 0;padding:20px 22px;font-family:Georgia,"Times New Roman",serif;
  font-size:17px;line-height:1.78}
.say p{margin:0 0 13px}.say p:last-child{margin:0}
.note{margin-top:16px;font-size:14px;color:var(--dim);background:var(--soft);
  border-radius:10px;padding:14px 16px;line-height:1.72}
.note b{color:var(--ink)}
.rung{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:15px 17px;margin-bottom:9px}
.rung .q{font-weight:650;font-size:15.5px;margin:0 0 5px}
.rung .a{font-size:14.5px;color:var(--dim);margin:0;line-height:1.7}
.stopbox{margin-top:14px;background:var(--goodbg);border:1px solid var(--good);border-radius:11px;padding:16px 18px}
.stopbox .lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--good);font-weight:700}
.stopbox q{display:block;margin-top:8px;font-family:Georgia,serif;font-size:16px;line-height:1.72}
.done{text-align:center;padding:40px 18px}
.done .big{font-size:44px;margin-bottom:6px}

/* ---------- ask ---------- */
.rule8{background:var(--goodbg);border:1px solid var(--good);border-radius:12px;
  padding:17px 20px;margin:22px 0 6px;font-size:14.5px;line-height:1.75}
.rule8 h3{margin:0 0 8px;font-size:16px;color:var(--good)}
.rule8 b{color:var(--ink)}
.qgrp{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:38px 0 4px}
.qgrp-n{font-size:13.5px;color:var(--faint);margin:0 0 12px}
.qa{background:var(--card);border:1px solid var(--rule);border-radius:11px;margin-bottom:9px;overflow:hidden}
.qa:hover{border-color:var(--accent)}
.qa > summary{list-style:none;cursor:pointer;padding:15px 17px;display:flex;gap:12px;
  align-items:flex-start;font-size:16px;line-height:1.55;font-weight:600}
.qa > summary::-webkit-details-marker{display:none}
.qa > summary::after{content:"+";margin-left:auto;color:var(--faint);font-weight:400;font-size:19px;line-height:1;flex:none}
.qa[open] > summary::after{content:"\2013"}
.qa[open] > summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.risk{flex:none;font-size:10.5px;letter-spacing:.06em;padding:3px 7px;border-radius:4px;
  font-weight:700;margin-top:2px;white-space:nowrap}
.risk.m{background:var(--warn);color:var(--onAccent)}
.risk.h{background:var(--accent);color:var(--onAccent)}
.risk.n{background:var(--chip);color:var(--faint)}
.qbody{padding:16px 17px 18px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 93%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--rule);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.nav.hide{display:none}
button.b{font-family:inherit;font-size:16px;font-weight:600;border-radius:11px;padding:13px 28px;
  cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--onAccent);min-width:140px}
button.b.ghost{background:transparent;color:var(--dim);border-color:var(--rule);min-width:76px;font-weight:500}
button.b:disabled{opacity:.35;cursor:default}

/* ---------- figs tab ---------- */
.figcard{margin:30px 0 0;background:var(--card);border:1px solid var(--rule);border-radius:13px;
  padding:18px 18px 14px}
.figcard .kind{display:inline-block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;border-radius:4px;padding:3px 9px;margin-bottom:12px}
.figcard .kind.draw{background:var(--accent);color:var(--onAccent)}
.figcard .kind.know{background:var(--soft);color:var(--accent)}
.figcard h3{font-size:18px;margin:0 0 10px;line-height:1.45}
.figcard img{max-width:100%;height:auto;display:block;margin:0 auto;background:#fff;
  border:1px solid var(--rule);border-radius:8px;padding:8px}
.figcard .svgwrap,.fig .svgwrap{background:var(--card);border:1px solid var(--rule);border-radius:8px;
  padding:14px 10px;overflow-x:auto}
.figcard .svgwrap svg,.fig .svgwrap svg{display:block;margin:0 auto;max-width:100%;height:auto;
  color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
.svgwrap svg text{fill:currentColor}
.svgwrap svg .bond{stroke:currentColor;stroke-width:2;fill:none}
.svgwrap svg .weak{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:5 4}
.svgwrap svg .hi{fill:var(--accent)}
.svgwrap svg .box{stroke:var(--accent);stroke-width:2;fill:none;rx:6}
.svgwrap svg .lbl{font-size:13px;font-weight:700}
.svgwrap svg .sub{font-size:11px}
.svgwrap svg .note{font-size:12px;fill:var(--dim)}
.figcard .cap{font-size:14px;color:var(--dim);margin:14px 0 0;line-height:1.72}
.figcard .cap b{color:var(--ink)}
.figcard .src{font-size:12px;color:var(--faint);margin:10px 0 0}


/* ---------- progress ---------- */
.board{background:var(--card);border:1px solid var(--rule);border-radius:13px;
  padding:18px 20px;margin:22px 0 4px}
.board h3{margin:0 0 4px;font-size:16px}
.board .sub2{font-size:13px;color:var(--faint);margin:0 0 15px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1 1 92px;background:var(--soft);border-radius:9px;padding:11px 13px}
.stat b{display:block;font-size:23px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
.stat.warn b{color:var(--warn)}
.stat.good b{color:var(--good)}
.due{font-size:13.5px;line-height:1.75;color:var(--dim);margin:0 0 14px}
.due b{color:var(--ink)}
.due a{color:var(--accent);font-weight:600;text-decoration:none;margin-right:9px;white-space:nowrap}
.bbtn{font-family:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:10px 16px;
  cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--onAccent)}
.bbtn.ghost{background:transparent;color:var(--dim);border-color:var(--rule);font-weight:500}
.copied{font-size:13px;color:var(--good);margin-left:10px}
.row .st{flex:none;font-size:11.5px;color:var(--faint);margin-top:5px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.row .st.ok{color:var(--good);font-weight:600}
.row .st.due{color:var(--warn);font-weight:600}
.donebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.delta{margin-top:16px;font-size:15px;line-height:1.75}
.delta b{font-size:17px}


/* ---------- 一键开始 ---------- */
.gobox{background:var(--accent);border-radius:14px;padding:22px 22px 20px;margin:22px 0 6px;color:var(--onAccent)}
.gobox .k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin:0 0 8px}
.gobox h2{margin:0 0 6px;font-size:21px;line-height:1.4;color:var(--onAccent);font-weight:650}
.gobox p{margin:0 0 16px;font-size:14px;opacity:.9;line-height:1.7}
.gobox a{display:inline-block;background:var(--card);color:var(--accent);text-decoration:none;
  font-weight:700;font-size:16px;border-radius:10px;padding:13px 26px}
.gobox .alt{display:block;margin-top:12px;font-size:13px;opacity:.85;color:var(--onAccent)}
.gobox .alt a{background:none;color:var(--onAccent);text-decoration:underline;padding:0;font-weight:600;font-size:13px}

/* ---------- 朗读 ---------- */
.spk{border:none;background:var(--chip);color:var(--dim);border-radius:6px;cursor:pointer;
  font-size:13px;line-height:1;padding:4px 8px;margin-left:8px;vertical-align:2px;font-family:inherit}
.spk:hover{background:var(--accent);color:var(--onAccent)}
.spk.on{background:var(--good);color:var(--onAccent)}
/* 朗读时：当前句高光，其余变暗 */
.reading .en,.reading .say,.reading .pt-en,.reading .pt-big,.reading .nt,.reading .gd,.reading .wn{opacity:.35;transition:opacity .2s}
.reading .rd{opacity:1}
.rd span.s{opacity:.45}
.rd span.s.cur{opacity:1;background:var(--warnbg);border-radius:3px;box-shadow:0 0 0 3px var(--warnbg)}
.wd{background:var(--goodbg);border-radius:3px;box-shadow:0 0 0 2px var(--goodbg)}

<script>
/* =================== helpers =================== */
function esc(x){ return x == null ? '' : String(x); }
/* 图有两种来源：f.svg 是内联画的（离线、缩放不糊、跟主题变色），f.src 是书上裁的图片。 */
function figBody(f){
  if (f.svg) return '<div class="svgwrap">' + f.svg + '</div>';
  if (f.src) return '<img alt="" src="' + IMG_BASE + f.src + '">';
  return '';
}
function fig(f){
  if (!f) return '';
  return '<figure class="fig">' + figBody(f)
       + (f.cap ? '<figcaption>' + f.cap + '</figcaption>' : '') + '</figure>';
}
function byId(id){ for (var i=0;i<CARDS.length;i++) if (CARDS[i].id === id) return CARDS[i]; return null; }


/* =================== 进度 =================== */
var PK = 'oralexam.progress.v1';
function today(){ var d = new Date(); return d.getFullYear() + '-'
  + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function loadP(){ try { return JSON.parse(localStorage.getItem(PK)) || {}; } catch(e){ return {}; } }
function saveP(p){ try { localStorage.setItem(PK, JSON.stringify(p)); } catch(e){} }
function recordRun(id, miss){
  var p = loadP();
  var r = p[id] || {runs:[]};
  r.runs.push({d: today(), m: miss});
  if (r.runs.length > 40) r.runs = r.runs.slice(-40);
  p[id] = r; saveP(p);
  return r;
}
/* 复习到期：漏 ≤2 三天后，漏 >2 明天 */
function dueIn(r){
  if (!r || !r.runs.length) return -999;
  var last = r.runs[r.runs.length-1];
  var gap = last.m <= 2 ? 3 : 1;
  return gap - daysBetween(last.d, today());
}
function statusOf(id){
  var r = loadP()[id];
  if (!r || !r.runs.length) return {txt:'未练', cls:''};
  var last = r.runs[r.runs.length-1];
  var ago = daysBetween(last.d, today());
  var when = ago === 0 ? '今天' : (ago === 1 ? '昨天' : ago + ' 天前');
  var d = dueIn(r);
  return {txt: when + ' · 漏' + last.m, cls: d <= 0 ? 'due' : (ago === 0 ? 'ok' : ''), due: d <= 0};
}
function digest(){
  var p = loadP(), lines = [], t = today();
  var todayN = 0, dueList = [], never = [], streakDays = {};
  for (var i=0;i<CARDS.length;i++){
    var c = CARDS[i], r = p[c.id];
    if (!r || !r.runs.length){ never.push(c.id); continue; }
    var last = r.runs[r.runs.length-1];
    if (last.d === t) todayN++;
    if (dueIn(r) <= 0) dueList.push(c.id + '(漏' + last.m + ',' + daysBetween(last.d,t) + '天前)');
    for (var k=0;k<r.runs.length;k++) streakDays[r.runs[k].d] = 1;
    var ms = r.runs.slice(-5).map(function(x){ return x.m; }).join('→');
    lines.push(c.id + ' ' + c.q.slice(0,40) + ' | 练了' + r.runs.length + '次 | 漏数 ' + ms);
  }
  // 连续天数
  var streak = 0, d = new Date();
  while (true){
    var key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if (streakDays[key]) { streak++; d.setDate(d.getDate()-1); } else break;
  }
  return ['进度 ' + t,
          '今天出声练了 ' + todayN + ' 张 · 连续 ' + streak + ' 天 · 已有卡 ' + CARDS.length + ' 张 · 从没练过 ' + never.length + ' 张',
          '该复习：' + (dueList.length ? dueList.join('、') : '无'),
          ''].concat(lines).join('\n');
}


/* 今天该做的那一张：到期的 > 从没练过的 > 上次漏最多的
   同一批里轮着来——上次给过的那张，只要还有别的候选，就先给别的。
   （2026-09-14 Ruojin：「这个卡没有变化，一直都是同一个主题」。
     原来到期的一批永远取「上次漏最多」的那张，是个死序，回首页也不会换。） */
function lastServed(){ try { return localStorage.getItem('oralexam.last.v1') || ''; } catch(e){ return ''; } }
function markServed(id){ try { localStorage.setItem('oralexam.last.v1', id); } catch(e){} }
function nextCard(){
  var p = loadP(), due = [], never = [], rest = [];
  for (var i=0;i<CARDS.length;i++){
    var c = CARDS[i], r = p[c.id];
    if (!r || !r.runs.length){ never.push(c); continue; }
    if (dueIn(r) <= 0) due.push(c); else rest.push(c);
  }
  function misses(c){ return p[c.id].runs.slice(-1)[0].m; }
  function byOverdue(list){
    list.sort(function(a,b){
      var da = dueIn(p[a.id]), db = dueIn(p[b.id]);
      if (da !== db) return da - db;            /* 欠得最久的排最前 */
      return misses(b) - misses(a);
    });
    return list;
  }
  function byMiss(list){
    list.sort(function(a,b){ return misses(b) - misses(a); });
    return list;
  }
  function rotate(list){
    if (list.length > 1){
      var L = lastServed(), f = [];
      for (var k=0;k<list.length;k++) if (list[k].id !== L) f.push(list[k]);
      if (f.length) list = f;
    }
    return list[0];
  }
  var pick = null, why = '';
  if (due.length){ pick = rotate(byOverdue(due)); why = '这张到复习期了'; }
  else if (never.length){ pick = rotate(never); why = '这张你还没练过'; }
  else if (rest.length){ pick = rotate(byMiss(rest)); why = '今天都练过了，这张上次漏得最多，可以再来一遍'; }
  if (!pick) return null;
  markServed(pick.id);
  return {c: pick, why: why};
}

/* =================== list =================== */
function renderList(){
  document.getElementById('top').innerHTML =
    '<span class="id">口试卡 · 生化</span>';
  document.getElementById('nav').classList.add('hide');

  var built = [], todo = [], cross = [];
  for (var i=0;i<CARDS.length;i++){ (CARDS[i].cross ? cross : built).push(CARDS[i]); }
  var haveN = {};
  /* 一张卡可能吸收好几道题（merged）。只看主题号，被吸收的那几道会一直显示成待做。 */
  for (i=0;i<built.length;i++){
    haveN[built[i].n] = 1;
    var mg = built[i].merged || [];
    for (var j=0;j<mg.length;j++) haveN[mg[j]] = 1;
  }
  for (i=0;i<QINDEX.length;i++) if (!haveN[QINDEX[i].n]) todo.push(QINDEX[i]);

  function rowCard(c){
    var mg = c.merged && c.merged.length ? ' ＋#' + c.merged.join('、#') : '';
    return '<a class="row" href="#/c/' + c.id + '">'
      + '<span class="w ' + (c.cross ? 'mid' : 'hi') + '">' + (c.cross ? '横' : '卡') + '</span>'
      + '<span class="t"><b>' + c.q + '</b><span>'
      + (c.n ? '#' + c.n + mg + ' · ' : '') + esc(c.qcn) + '</span></span>'
      + '<span class="st ' + statusOf(c.id).cls + '">' + statusOf(c.id).txt + '</span></a>';
  }
  function bwCls(bw){ return bw >= 45 ? 'hi' : (bw >= 20 ? 'mid' : (bw > 0 ? 'lo' : 'non')); }
  function flagsOf(r){
    var f = [];
    if (r.rep === 2) f.push('<i>他写了两遍</i>');
    if (r.bw === 0) f.push('<b>书里没有</b>');
    if (r.gap === 'gap!') f.push('<b>实测答不上</b>');
    else if (r.gap === 'gap') f.push('<b>没学过</b>');
    else if (r.gap === 'ok') f.push('主场');
    return f.length ? '<span class="flags">' + f.join(' · ') + '</span>' : '';
  }
  function rowTodo(r){
    return '<div class="row todo" data-s="' + (r.en + ' ' + r.cn).toLowerCase() + '">'
      + '<span class="w ' + bwCls(r.bw) + '">' + (r.bw || '—') + '</span>'
      + '<span class="t"><b>' + r.en + '</b><span>#' + r.n + ' · ' + esc(r.cn) + '</span>'
      + flagsOf(r) + '</span>'
      + '<span class="go">未写</span></div>';
  }

  var p = loadP(), t = today(), todayN = 0, dueN = 0, neverN = 0, totalRuns = 0;
  var all = built.concat(cross), dueLinks = '';
  for (i=0;i<all.length;i++){
    var r = p[all[i].id];
    if (!r || !r.runs.length){ neverN++; continue; }
    totalRuns += r.runs.length;
    if (r.runs[r.runs.length-1].d === t) todayN++;
    if (dueIn(r) <= 0){ dueN++; dueLinks += '<a href="#/c/' + all[i].id + '">' + all[i].id + '</a>'; }
  }
  var streakDays = {}, streak = 0;
  for (i=0;i<all.length;i++){ var rr = p[all[i].id]; if (rr) for (var q=0;q<rr.runs.length;q++) streakDays[rr.runs[q].d]=1; }
  var dd = new Date();
  while (true){ var kk = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    if (streakDays[kk]){ streak++; dd.setDate(dd.getDate()-1); } else break; }


  var nx = nextCard();
  var goHtml = nx ? ('<div class="gobox"><p class="k">不用挑，就这张</p>'
      + '<h2>' + nx.c.q + '</h2>'
      + '<p>' + nx.why + '。<b>出声说，说到卡住为止再翻。</b><br>'
      + '卡住不要停——降级：说不出就看着说，看着也说不出就<b>朗读一遍</b>。<b>不许停在零。</b></p>'
      + '<a href="#/c/' + nx.c.id + '">开始</a>'
      + '<span class="alt">今天只做这一张也算数。'
      + '<a href="#" onclick="document.getElementById(\'search\').focus();return false;">我想自己挑</a></span>'
      + '</div>') : '';

  var h = '<div class="lhero"><h1>生化口试卡</h1>'
    + '<p>' + built.length + ' 张已写 · ' + cross.length + ' 张横向卡 · '
    + todo.length + ' 题未写 · 全部本地，断网可看</p></div>'
    + '<div class="board"><h3>今天</h3>'
    + '<p class="sub2">只有<b>出声说完</b>的才算。看一遍不记数。<br><b>9 月 21 日之后不再做新材料</b>——剩下的时间只有出声、复习、演练。</p>'
    + '<div class="stats">'
    + '<div class="stat' + (todayN ? ' good' : '') + '"><b>' + todayN + '</b><span>今天出声</span></div>'
    + '<div class="stat"><b>' + streak + '</b><span>连续天数</span></div>'
    + '<div class="stat' + (dueN ? ' warn' : '') + '"><b>' + dueN + '</b><span>该复习</span></div>'
    + '<div class="stat"><b>' + neverN + '</b><span>没练过</span></div>'
    + '</div>'
    + (dueN ? '<p class="due"><b>该复习：</b>' + dueLinks + '</p>' : '')
    + '<button class="bbtn" onclick="copyDigest(this)">复制进度给老师</button>'
    + ' <a class="bbtn ghost" href="#/fav" style="text-decoration:none">☆ 不会念的</a>'
    + ' <button class="bbtn ghost" onclick="if(confirm(\'清空全部练习记录？\')){localStorage.removeItem(PK);route();}">清空记录</button>'
    + '</div>' + goHtml + '<input id="search" placeholder="搜题目、关键词…">';

  if (built.length){
    h += '<p class="lgrp">已写</p><p class="lgrp-n">点开就能背。</p>';
    built.sort(function(a,b){ return (a.id > b.id) ? 1 : -1; });
    for (i=0;i<built.length;i++) h += rowCard(built[i]);
  }
  if (cross.length){
    h += '<p class="lgrp">横向卡</p>'
      + '<p class="lgrp-n">不对应某一道题，跨很多题共用。乱不清的东西放这里。</p>';
    for (i=0;i<cross.length;i++) h += rowCard(cross[i]);
  }
  if (todo.length){
    h += '<p class="lgrp">还没写</p>'
      + '<p class="lgrp-n">左边的数字是<b>书本投入度</b>（0–100，数出来的）：'
      + '数字越大，他问了之后能往下挖的东西越多。<b>不是</b>按卷子先后排——那跟重要性无关。</p>';
    todo.sort(function(a,b){
      var ga = a.gap === 'gap!' ? 2 : (a.gap === 'gap' ? 1 : 0);
      var gb = b.gap === 'gap!' ? 2 : (b.gap === 'gap' ? 1 : 0);
      return gb - ga || b.rep - a.rep || b.bw - a.bw || a.n - b.n;
    });
    for (i=0;i<todo.length;i++) h += rowTodo(todo[i]);
  }
  document.getElementById('main').innerHTML = h;

  document.getElementById('search').addEventListener('input', function(e){
    var q = e.target.value.trim().toLowerCase();
    var rows = document.querySelectorAll('.row');
    for (var k=0;k<rows.length;k++){
      var t = rows[k].textContent.toLowerCase();
      rows[k].style.display = (!q || t.indexOf(q) > -1) ? '' : 'none';
    }
  });
}


function copyDigest(btn){
  var txt = digest();
  function done(){
    var s2 = document.createElement('span');
    s2.className = 'copied'; s2.textContent = '已复制，粘给老师就行';
    btn.parentNode.insertBefore(s2, btn.nextSibling);
    setTimeout(function(){ s2.remove(); }, 4000);
  }
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, function(){ fallback(); });
  else fallback();
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ prompt('复制这段：', txt); }
    ta.remove();
  }
}


/* =================== 朗读（浏览器自带，离线可用） =================== */
function cleanEn(raw){
  return raw.replace(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/g, ' ')
            .replace(/[\uD800-\uDFFF]/g, '')
            .replace(/[“”"]/g, '').replace(/\s{2,}/g, ' ').trim();

  var my = ++SPK, sents = [];

    Object.keys(byI).sort(function(a,b){ return a-b; }).forEach(function(i){

         + fig(a.fig)
         + '<button class="fold" type="button" onclick="foldQA(this)">收起 ▴</button>'
         + '</div></details>';
    }
  }
  return h;
}

function wireSib(){
  var sib = document.getElementById('sib');
  if (!sib || !C.sib) return;
  var u = '';
  for (var j=0;j<C.sib.length;j++){
    u += '<li><span class="bx"></span><span class="txt">' + C.sib[j][0] + '</span>'
      +  '<button class="more" title="展开">?</button>'
      +  '<div class="detail"><p class="e">' + C.sib[j][1] + '</p>'
      +  '<p class="c">' + C.sib[j][2] + '</p></div></li>';
  }
  sib.innerHTML = u;
  sib.addEventListener('click', function(e){
    var li = e.target.closest('li'); if (!li) return;
    if (e.target.classList.contains('more')){ li.classList.toggle('open'); return; }
    if (e.target.closest('.detail')) return;
    li.classList.toggle('hit'); tally();
  });
}
function tally(){
  var all = document.querySelectorAll('#sib li').length;
  var hit = document.querySelectorAll('#sib li.hit').length;
  var miss = all - hit, t = document.getElementById('tally');
  if (!t) return;
  if (hit === 0){ t.className = 'tally'; t.textContent = '还没点'; return; }
  if (miss <= 2){ t.className = 'tally pass'; t.textContent = '漏 ' + miss + ' 条 · 过了，往下走'; }
  else { t.className = 'tally fail'; t.textContent = '漏 ' + miss + ' 条 · 回第一屏，把整段重说一遍'; }
}
function paint(){
  for (var i=0;i<steps.length;i++) steps[i].classList.toggle('on', i === cur);
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').textContent = LAB[cur] || '下一步';
  window.scrollTo(0,0);
}
function mode(m){
  M = m;
  var ids = ['cram','drill','ask','figs'];
  for (var i=0;i<ids.length;i++){
    var el = document.getElementById(ids[i]);
    if (el) el.style.display = (ids[i] === m) ? 'block' : 'none';
  }
  var bt = {cram:'mCram', drill:'mDrill', ask:'mAsk', figs:'mFig'};
  for (var k in bt){ var b = document.getElementById(bt[k]); if (b) b.classList.toggle('on', k === m); }
  document.getElementById('nav').classList.toggle('hide', m !== 'drill');
  if (m === 'drill') paint(); else window.scrollTo(0,0);
}
document.getElementById('next').onclick = function(){
  if (cur === steps.length - 1){ cur = 0; resetSib(); } else cur++;
  paint();
};
document.getElementById('prev').onclick = function(){ if (cur > 0) cur--; paint(); };
function resetSib(){
  var li = document.querySelectorAll('#sib li');
  for (var i=0;i<li.length;i++){ li[i].classList.remove('hit'); li[i].classList.remove('open'); }
  tally();
}
document.addEventListener('keydown', function(e){
  if (M !== 'drill' || !steps.length) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); document.getElementById('next').click(); }
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
});


function markRun(spoken){
  var box = document.getElementById('deltaBox');
  if (!spoken){
    box.innerHTML = '<div class="note" style="text-align:left"><p style="margin:0">'
      + '没记。<b>回第一屏，出声说一遍再来。</b>看得懂不等于说得出——'
      + 'PESB 那次五个失分点全是说出口的时候错的。</p></div>';
    return;
  }
  var all = document.querySelectorAll('#sib li').length;
  var hit = document.querySelectorAll('#sib li.hit').length;
  var miss = all ? all - hit : 0;
  var before = (loadP()[C.id] || {runs:[]}).runs.slice(-1)[0];
  var r = recordRun(C.id, miss);
  var msg = '';
  if (before){
    var d = before.m - miss;
    if (d > 0) msg = '上次漏 ' + before.m + '，这次漏 ' + miss + '，<b>少漏了 ' + d + ' 条</b>。';
    else if (d === 0) msg = '上次也是漏 ' + miss + ' 条。<b>同一批点还没吃下去</b>，看看是不是同几条。';
    else msg = '上次漏 ' + before.m + '，这次漏 ' + (miss) + '。<b>退步了</b>——多半是隔太久，明天再来一次。';
  } else {
    msg = '第一次。漏 ' + miss + ' 条。';
  }
  var next = miss <= 2 ? '三天后再练这张。' : '<b>明天就要再练一次</b>，漏三条以上说明还没稳。';
  box.innerHTML = '<div class="delta">' + msg + '<br>' + next + '</div>'
    + '<div class="note" style="text-align:left"><p style="margin:0">'
    + '记下了，第 ' + r.runs.length + ' 次。回首页点「复制进度给老师」，我看数字给你点评。</p></div>';
}

/* =================== 收藏：不会念的词和句 =================== */
var FK = 'oralexam.fav.v1';
function loadF(){ try { return JSON.parse(localStorage.getItem(FK)) || []; } catch(e){ return []; } }
function saveF(f){ try { localStorage.setItem(FK, JSON.stringify(f)); } catch(e){} }
function favKey(t, text){ return t + '|' + String(text).trim().toLowerCase(); }
function favHas(t, text){ var k = favKey(t, text); return loadF().some(function(x){ return favKey(x.t, x.text) === k; }); }
function favToggle(t, text){
  var f = loadF(), k = favKey(t, text), i = -1;
  for (var j=0;j<f.length;j++) if (favKey(f[j].t, f[j].text) === k) { i = j; break; }
  if (i >= 0) f.splice(i, 1); else f.push({t:t, text:String(text).trim(), card:(window.C && C.id) || '', ts:Date.now()});
  saveF(f); return i < 0;
}
function favRemove(i){ var f = loadF(); f.splice(i, 1); saveF(f); renderFav(); }
function speakText(txt){
  var one = String(txt).trim();
  if (/^[A-Za-z’'\-]+$/.test(one) && wordFile(one)){ if (window.speechSynthesis) speechSynthesis.cancel(); clearReading(); playWord(one); return; }
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel(); clearReading();
  var u = utter(txt, txt.split(' ').length > 3 ? 0.9 : 0.85);
  speechSynthesis.speak(u);
}
/* 释义查表。卡上是 accelerates，表里是 accelerate，所以要先把词形还原。 */
var WSUF = [['s',''],['es',''],['ies','y'],['ed',''],['ed','e'],['ing',''],['ing','e'],
            ['er',''],['est',''],['ly',''],['ations','ate'],['ation','ate'],['ally','al']];
function glossOf(w){
  var G = window.GLOSS || {};
  var k = (w || '').toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, '');
  if (!k) return null;
  if (G[k]) return G[k];
  for (var i=0;i<WSUF.length;i++){
    var suf = WSUF[i][0];
    if (k.length - suf.length >= 3 && k.slice(-suf.length) === suf){
      var c = k.slice(0, k.length - suf.length) + WSUF[i][1];
      if (G[c]) return G[c];
    }
  }
  if (k.indexOf('-') >= 0){
    var parts = k.split('-');
    for (i=0;i<parts.length;i++) if (parts[i].length > 4 && G[parts[i]]) return G[parts[i]];
  }
  return null;
}
function showWordPop(w, rect){

        + (g && g.ipa ? '<span class="ipa">' + esc(g.ipa) + '</span>' : '') + '</div>';

  if (g && g.en) h += '<p class="en">' + esc(g.en) + '</p>';
  if (g && g.ex) h += '<p class="ex">' + esc(g.ex) + '</p>';
  if (!g) h += '<p class="none">词库里还没有这个词的释义。收藏它，补的时候就知道该补哪些。</p>';
  else if (!g.cn) h += '<p class="none">这条只有英文释义，中文还没补。</p>';
  h += '</div>';
  h += '<button type="button" class="' + (on ? 'on' : '') + '" data-w="' + w.replace(/"/g, '&quot;') + '" onclick="favWord(this)">'
    + (on ? '★ 在单词本里 ' : '☆ 加进单词本 ') + '<i>' + w.replace(/</g, '&lt;') + '</i></button>';
  wp.innerHTML = h;
  wp.style.display = 'block';
  var left = Math.max(8, Math.min(rect.left, window.innerWidth - 320));
  var top = rect.bottom + 8;

  wp.style.left = left + 'px'; wp.style.top = top + 'px';

function favWord(btn){
  var w = btn.dataset.w, on = favToggle('w', w);
  btn.className = on ? 'on' : '';

function favSent(btn){

function speakAllFav(){

function renderFav(){

  var h = '<div class="lhero"><h1>不会念的</h1><p>' + words.length + ' 个词 · ' + sents.length + ' 句 · 点 🔊 听，点 ✕ 删。只存在这台机器上。<br><b>音频念错的词也点星收藏</b>，然后「复制清单给老师」，我照着修。<br><a href="#/wb">📕 单词本</a>：同一批词，按间隔重复背。</p></div>'

    + '</section>'
    + (f.length ? '<p style="margin-top:18px"><button class="bbtn" type="button" onclick="speakAllFav()">🔊 全部连读</button> <button class="bbtn ghost" type="button" onclick="copyFav()">复制清单给老师</button></p>' : '');
  var vs = voices(), cur = pickVoice(), want = ''; try { want = localStorage.getItem(VK) || ''; } catch(e){}

    + '<select id="vsel" onchange="setVoice(this.value)"><option value="">自动（' + (cur ? esc(cur.name) : '无') + '）</option>'
    + vs.filter(function(v){ return /^en/i.test(v.lang); }).map(function(v){ return '<option value="' + esc(v.name) + '"' + (want === v.name ? ' selected' : '') + '>' + esc(v.name) + ' · ' + esc(v.lang) + '</option>'; }).join('')
    + '</select> <button class="bbtn ghost" type="button" onclick="speakText(\'The peptide bond has partial double-bond character.\')">试听</button></section>';
  document.getElementById('main').innerHTML = h;
  var nav = document.getElementById('nav'); if (nav) nav.classList.add('hide');

/* 把收藏的词和句复制出去。念错的词她点星，复制过来我就能修音频。
   起因 2026-09-14：「你再检查一下所有词的发音，比如 ester/diester/phosphodiester 发音不准确」。 */
function copyFav(){
  var f = loadF(), w = [], s = [];
  f.forEach(function(x){ (x.t === 'w' ? w : s).push(x.text + (x.card ? '（卡 ' + x.card + '）' : '')); });
  var t = ['不会念 / 念错了 · ' + today(),
           '词 ' + w.length + ' 个：', w.join('、') || '（无）', '',
           '句 ' + s.length + ' 句：'].concat(s.length ? s : ['（无）']).join('\n');
  var ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); ok = true; } } catch(e){}
  if (!ok){
    var a = document.createElement('textarea');
    a.value = t; a.style.position = 'fixed'; a.style.top = '-1000px';
    document.body.appendChild(a); a.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(a);
  }
  alert(ok ? '复制好了，直接粘给我。\n\n音频念错的词也点星收藏，我照着修。' : t);
}

/* =================== 单词本 · 间隔重复 ===================
   卡片本身来自收藏的词（收藏＝加进单词本）。这里只存每个词的复习进度。
   算法是 SM-2 的简化版：记不住就回到一天，记住就按 ease 拉长。 */
var WBK = 'oralexam.wb.v1';
function wbLoad(){ try { return JSON.parse(localStorage.getItem(WBK)) || {}; } catch(e){ return {}; } }
function wbSave(o){ try { localStorage.setItem(WBK, JSON.stringify(o)); } catch(e){} }
function wbWords(){
  var out = [];
  loadF().forEach(function(x){ if (x.t === 'w') out.push(x); });
  return out;
}
function wbPlus(days){
  var d = new Date(); d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function wbGrade(word, g){
  var st = wbLoad(), r = st[word] || {i:0, e:2.5, n:0, lap:0};
  if (g === 0){ r.lap = (r.lap||0) + 1; r.e = Math.max(1.3, r.e - 0.2); r.i = 1; }
  else if (g === 1){ r.i = r.i ? Math.max(1, Math.round(r.i * r.e)) : 1; r.n = (r.n||0) + 1; }
  else { r.e = r.e + 0.15; r.i = r.i ? Math.round(r.i * r.e * 1.5) : 3; r.n = (r.n||0) + 1; }
  r.d = wbPlus(r.i);
  st[word] = r; wbSave(st);
}
function wbQueue(){
  var st = wbLoad(), t = today(), due = [], fresh = [];
  wbWords().forEach(function(x){
    var r = st[x.text];
    if (!r || !r.d) fresh.push(x);
    else if (r.d <= t) due.push(x);
  });
  return {due: due, fresh: fresh, all: wbWords().length};
}
var wbCur = null, wbShown = false;
/* 词库清单默认收起。她的话（2026-09-15）：「词库先隐藏」。
   单词本里只会出现她收藏过的词，没收藏的一个都不进来。 */
var wbListOpen = false;
function wbToggleList(){ wbListOpen = !wbListOpen; renderWb(); }
function wbNext(){
  var q = wbQueue();
  wbCur = q.due.length ? q.due[0] : (q.fresh.length ? q.fresh[0] : null);
  wbShown = false;
  renderWb();
}
function wbShow(){ wbShown = true; renderWb(); }
function wbAnswer(g){
  if (!wbCur) return;
  wbGrade(wbCur.text, g);
  wbNext();
}
function renderWb(){
  document.getElementById('top').innerHTML =
    '<a class="home" href="#/">← 全部</a><span class="id">单词本</span>';
  var nav = document.getElementById('nav'); if (nav) nav.classList.add('hide');
  var q = wbQueue(), st = wbLoad();
  var h = '<div class="lhero wbhero"><h1>单词本</h1>'
        + '<p>在卡里点一个英文词，弹出来的框里点「加进单词本」。这里按间隔重复排，记不住的会回头找你。</p></div>'
        + '<div class="wbstat"><span>该复习 ' + q.due.length + '</span><span>没学过 ' + q.fresh.length
        + '</span><span>一共 ' + q.all + '</span></div>';
  if (!q.all){
    h += '<p class="sub2" style="margin-top:16px">还是空的。去任何一张卡，点一个不认识的英文词。</p>';
  } else if (!wbCur){
    h += '<div class="wbcard"><div class="hw">今天清空了</div>'
       + '<p class="cn">该复习的都过完了。下面是全部 ' + q.all + ' 个词。</p></div>';
  } else {
    var g = glossOf(wbCur.text), r = st[wbCur.text];
    h += '<div class="wbcard"><div class="hw">' + esc(wbCur.text) + '</div>'
       + (g && g.ipa ? '<div class="ipa">' + esc(g.ipa) + '</div>' : '')
       + '<p style="margin:14px 0 0"><button class="bbtn ghost" type="button" onclick="playWord(' + JSON.stringify(wbCur.text) + ')">🔊 听</button></p>';
    if (wbShown){
      if (g && g.cn) h += '<p class="cn">' + esc(g.cn) + '</p>';
      if (g && g.en) h += '<p class="en">' + esc(g.en) + '</p>';
      if (g && g.ex) h += '<p class="ex">' + esc(g.ex) + '</p>';
      if (!g) h += '<p class="cn">词库里没有这个词的释义。</p>';
      if (wbCur.card) h += '<p class="from">来自 <a href="#/c/' + esc(wbCur.card) + '">卡 ' + esc(wbCur.card) + '</a></p>';
      if (r && r.i) h += '<p class="from">上次间隔 ' + r.i + ' 天 · 忘过 ' + (r.lap||0) + ' 次</p>';
    }
    h += '</div>';
    if (!wbShown){
      h += '<p style="margin:16px 0 0"><button class="bbtn" type="button" onclick="wbShow()">显示意思</button></p>';
    } else {
      h += '<div class="wbbtns">'
         + '<button type="button" class="bad" onclick="wbAnswer(0)">忘了<b>明天再来</b></button>'
         + '<button type="button" class="good" onclick="wbAnswer(1)">想起来了<b>拉长间隔</b></button>'
         + '<button type="button" class="easy" onclick="wbAnswer(2)">太简单<b>放很久</b></button>'
         + '</div>';
    }
  }
  if (q.all && wbListOpen){
    h += '<section class="favsec" style="margin-top:26px"><h3>全部 ' + q.all + ' 个词</h3><ul class="wblist">';
    wbWords().forEach(function(x){
      var g2 = glossOf(x.text), r2 = st[x.text];
      h += '<li><span class="w">' + esc(x.text) + '</span>'
         + '<span class="m">' + esc(g2 && g2.cn ? g2.cn : (g2 && g2.en ? g2.en : '还没有释义')) + '</span>'
         + '<span class="due">' + (r2 && r2.d ? r2.d : '新') + '</span></li>';
    });
    h += '</ul><p style="margin:14px 0 0"><button class="bbtn ghost" type="button" onclick="wbToggleList()">收起清单</button></p></section>';
  } else if (q.all){
    h += '<p style="margin:26px 0 0"><button class="bbtn ghost" type="button" onclick="wbToggleList()">看全部 ' + q.all + ' 个词</button></p>';
  }
  document.getElementById('main').innerHTML = h;
  window.scrollTo(0, 0);
}

function route(){
  if (location.hash === '#/wb'){ wbNext(); return; }
  if (location.hash === '#/fav'){ renderFav(); return; }
  var m = location.hash.match(/^#\/c\/(.+)$/);
  if (m){ var c = byId(m[1]); if (c){ renderCard(c); return; } }
  renderList();
}
applyTheme();
window.addEventListener('hashchange', route);
route();
