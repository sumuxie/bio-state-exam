segs:[
 {tag:'段 1 · 定义', h:'从最短的问法起步，把结构自己接上',
  p:['“An operon is a group of genes coding the synthesis of one group of proteins — the textbook’s wording — arranged so that they are transcribed together: from one promoter, under one operator, into one messenger RNA carrying several proteins. It is a bacterial arrangement, and its functioning — how the whole unit is switched on and off by one regulatory protein — is what the question asks for.',
     'Four parts. The <b>promoter</b> is the DNA sequence RNA polymerase binds to start transcription. The <b>operator</b> is the DNA sequence the repressor binds, and it overlaps the promoter. The <b>structural genes</b> are the ones whose products, mostly enzymes, do the metabolism. And beside the operon, not in it, the <b>regulator gene</b>, whose product, the repressor, controls transcription.”'],
  note:'<b>他嘴里的题面只到 “What is an operon?”。</b>Lac 和 Trp 是他要挖的方向，你在段 2 主动把两个例子摆出来，不要等他问。'},
 {tag:'段 2 · general', h:'两个轴、一个理由、两个例子的归类',
  p:['“Two kinds of control: <b>negative</b>, a repressor that brakes transcription, and <b>positive</b>, a regulatory protein that speeds it up. And two kinds of operon by what the small molecule does: <b>inducible</b> — off until a substrate turns it on; <b>repressible</b> — on until a product turns it off.',
     'The logic is economy: protein synthesis is endergonic, and the textbook says both controls exist so that proteins are neither made needlessly nor lacking. So a catabolic pathway is induced by its substrate, an anabolic pathway is repressed by its product.',
     'The two classic examples are the two cases. The <b>lac</b> operon of E. coli — three genes for using lactose — is inducible. The <b>trp</b> operon — five genes for making tryptophan — is repressible.”'],
  note:'到这里 “functioning” 这个词还没兑现，但分类已经给了。<b>先分类再机制</b>，这是每张卡的顺序。'},
 {tag:'段 3 · 稍展开', h:'lac 一句开关，trp 两层',
  p:['“<b>lac</b>: lacZ codes β-galactosidase, which splits lactose into galactose and glucose; lacY the permease that carries lactose in; lacA a transacetylase. The default is off — the lac repressor, made by lacI, sits on the operator, and because the operator overlaps the promoter, polymerase cannot start. When lactose comes in, a derivative of it — generally allolactose — binds the repressor; the complex comes off the operator, and the three genes are transcribed into one lac mRNA. The textbook calls it a molecular switch. Generally there is a second, positive layer: with glucose absent, cAMP–CAP helps polymerase bind, so E. coli uses glucose first.',
     '<b>trp</b>: five genes, three enzymes from chorismate to tryptophan. The default is on. Generally, the first layer is a repressor that binds only with tryptophan as its corepressor. The textbook’s own layer is <b>attenuation</b>: a 162-nucleotide leader in front of the first gene encodes a short peptide with two tryptophan codons in a row. With plenty of tryptophan the ribosome reads through and covers segment 2, so the 3–4 hairpin forms — a terminator — and polymerase stops before the genes. With little tryptophan the ribosome stalls on the Trp codons, 2–3 forms instead, 3–4 cannot, and polymerase reads through.”'],
  note:'lac 那段说完就够八分。trp 的两层各一句，「多 → 3–4 停；少 → 2–3 走」是最省的记法。<b>别在这一段展开三个操纵基因位点或 σ 因子</b>，那是被追问才给的。'},
 {tag:'段 4 · 留口子', h:'为什么只有原核，然后落到自己的质粒',
  p:['“Attenuation only works because in a bacterium the ribosome is on the mRNA while polymerase is still making it — the textbook’s figure shows both on one transcript; a eukaryote transcribes in the nucleus and translates in the cytosol, so it cannot do this. Below the mechanism the reason for all of it is economy under selection.',
     'And this is the switch I use every week: my bacterial expression plasmids carry the lac operator and lacI, and I induce with IPTG — a gratuitous inducer, one the cell cannot metabolise, so the signal stays. In yeast I induce surface display through the GAL1 promoter — the eukaryotic parallel, an activator switched on by galactose.”'],
  note:'<b>这个口子他多半接。</b>接了就是 pET / T7 / BL21(DE3) 或 yeast display——两边都在「桥回主场」那一组里备好了。'}
],

why:{
 rungs:[
  ['为什么大肠杆菌不干脆一直做 β-半乳糖苷酶？','因为<b>蛋白合成是吸能的</b>（<span class="pg">p092</span>），三个酶白做等于白烧 ATP 和氨基酸。书 p102 直接说控制的目的是「不多做、也不缺」。'],
  ['那为什么分解通路是默认关、合成通路是默认开？','因为<b>信号就是那个分子本身</b>。分解通路的底物出现＝有活可干，所以底物当诱导物；合成通路的产物够了＝活干完了，所以产物当辅阻遏物。同一个逻辑、两个接法，接的那头由通路方向决定。'],
  ['那为什么细胞会长成这样？','因为<b>选择</b>：两株细菌，一株按需开关，一株常开，后者每一代都多付一笔蛋白合成的账，长得慢，几百代之后就没了。所以留下来的是会开关的那一株——这不是设计，是筛选的结果。']
 ],
 stop:{lbl:'停 · 落在进化（顺带点名动力学）',
  say:'“Below that we are asking why economy wins, and that is selection — a historical answer, not a mechanistic one. The other direction down is binding: how tightly the repressor holds the operator relative to random DNA and by how much the inducer loosens it, which is a dissociation constant — and below that, physical chemistry rather than biochemistry.”'}
},

/* ---------------- 同一个答案，不同问法 ---------------- */
recog:[
{q:'What is an operon?',
 mean:'<b>他真正会说的短句。</b>答案自带结构：定义 → 四个部件 → 两个例子 → 逻辑。说完停，让他挑 lac 还是 trp。',
 say:'“An operon is a group of genes coding the synthesis of one group of proteins, arranged so that they are transcribed together — from one promoter, under one operator, into one mRNA. Four parts: promoter, operator, structural genes, and beside them the regulator gene whose product, the repressor, binds the operator. Two classic examples in E. coli: the lac operon, inducible — off until lactose turns it on — and the trp operon, repressible — on until tryptophan turns it off. The logic is economy: a catabolic pathway is induced by its substrate, an anabolic one repressed by its product.”'},

{q:'How does the lac operon work?',
 mean:'卷面里的 <b>Lac</b>。一句默认状态、一句开关、一句产物。',
 say:'“Off by default: the lac repressor, the product of lacI, sits on the operator, which overlaps the promoter, so RNA polymerase cannot start. Lactose comes in through the permease, a derivative of it — generally allolactose — binds the repressor, the repressor–inducer complex comes off the operator, and the three genes are transcribed into one lac mRNA: lacZ β-galactosidase, which splits lactose into galactose and glucose; lacY the permease; lacA a transacetylase. The textbook calls the operator–repressor–inducer system a molecular switch. Generally there is also a positive layer, cAMP–CAP, which only helps when glucose is absent.”'},

{q:'How does the trp operon work?',
 mean:'卷面里的 <b>Trp</b>。两层，先说哪层是书的。',
 say:'“It makes the enzymes of tryptophan synthesis — five genes, trpE to trpA, three enzymes from chorismate — so it is on by default and turned off by its product. Two layers. Generally, a trp repressor that binds the operator only with tryptophan bound as corepressor. And the layer the textbook describes: attenuation. A 162-nucleotide leader before the first gene encodes a short peptide with two tryptophan codons in a row. With plenty of tryptophan the ribosome reads through, covers segment 2, the 3–4 terminator hairpin forms and polymerase stops before the genes. With little tryptophan the ribosome stalls at the Trp codons, 2–3 forms instead, 3–4 cannot, and polymerase reads through.”'},

{q:'What is attenuation?',
 mean:'<b>核心词正面定义</b>。先说它是什么（转录开始后、在 leader 里决定停不停），再说机制。',
 say:'“Attenuation is a control of transcription that acts after initiation, in the leader region before the first structural gene: whether RNA polymerase continues into the genes is decided by which hairpin the leader RNA folds into, and that is decided by how fast a ribosome translates the leader peptide. In the trp operon the leader peptide has two tryptophan codons in a row: with tryptophan available the ribosome moves on and the terminator hairpin, 3–4, forms; without it the ribosome stalls there, the antiterminator 2–3 forms, and transcription goes on. It is a second control on top of repression, and it exists only where translation is coupled to transcription — in bacteria.”'},

{q:'What is the difference between the lac and the trp operon?',
 mean:'比较题。<b>一句一个维度</b>：方向、默认、小分子干什么、几层。',
 say:'“Direction: lac is catabolic — using lactose; trp is anabolic — making tryptophan. Default: lac is off, trp is on. The small molecule: in lac the substrate’s derivative is an inducer that pulls the repressor off; in trp the product is a corepressor that puts the repressor on — generally. Layers: lac has repression plus a positive cAMP–CAP layer; trp has repression plus attenuation, a control by a stalling ribosome. Same switch, wired the opposite way, because a catabolic pathway should run when its substrate is there and an anabolic one should stop when its product is.”'},

{q:'What is a repressor?',
 mean:'正面定义，一句。<b>蛋白，结合 DNA。</b>',
 say:'“A repressor is a protein, the product of a regulator gene, that binds the operator DNA and so prevents RNA polymerase from transcribing the operon — the textbook’s words are a diffusible, negative regulatory protein. Its activity is set by a small molecule: an inducer takes it off the DNA, a corepressor puts it on.”'},

{q:'Why does E. coli use glucose before lactose?', odd:1,
 mean:'问的是 <b>catabolite repression</b>——书里没有，说 general。',
 say:'“Because the lac operon needs two conditions, generally speaking: lactose present, to take the repressor off, and glucose absent, to let it be transcribed strongly. Low glucose raises cyclic AMP; cAMP binds the catabolite activator protein, CAP, and cAMP–CAP binds beside the lac promoter and helps RNA polymerase bind — positive control. With glucose around, cAMP is low, that help is missing, and the operon runs only weakly even with lactose present. So the cell finishes the glucose first, then switches — the two-phase growth curve is called diauxie. The textbook describes positive control in exactly this shape but does not name CAP.”'},

{q:'Why do you add IPTG in the lab?', odd:1,
 mean:'她的主场。<b>先答机制，再答为什么不用乳糖。</b>',
 say:'“Because IPTG — isopropyl β-D-thiogalactoside — is a gratuitous inducer: it binds the lac repressor the way allolactose does and takes it off the operator, but the cell cannot hydrolyse it, so its concentration stays constant and the operon stays on. Lactose would be consumed by the β-galactosidase it induces, so the signal would fade. In my expression strain the target gene sits behind a T7 promoter with a lac operator, and the T7 RNA polymerase itself is behind a lac promoter — so one addition of IPTG opens both locks.”'},

{q:'Why can a baby digest milk — and so can E. coli?', odd:1,
 mean:'问的是 <b>β-galactosidase</b>：乳糖这个底物，两个不同的酶。',
 say:'“Because both have a β-galactosidase. Lactose is milk sugar — the textbook says the most important sugar in the milk of all mammals — galactose linked β-1,4 to glucose, and a β-galactosidase is the hydrolase that cuts that bond. In the infant it is lactase in the gut lining; in E. coli it is the lacZ product, made only when lactose is present. Generally, most adult humans switch lactase off after weaning — lactose intolerance — while E. coli switches its enzyme on and off by the operon every time. The galactose half then enters glycolysis through galactokinase, the uridylyltransferase and UDP-glucose 4-epimerase — the textbook’s most important pathway of galactose.”'},

{q:'Why does a bacterium stop making tryptophan when you feed it tryptophan?', odd:1,
 mean:'问的是 <b>trp 操纵子的两层</b>，从生理那头问进来。',
 say:'“Because tryptophan is the signal that shuts its own synthesis off — twice. Generally, tryptophan binds the trp repressor as a corepressor, and only then can the repressor sit on the operator and stop transcription. And by attenuation: with tryptophan available the ribosome translating the leader peptide does not stall at its two tryptophan codons, the terminator hairpin forms, and polymerase stops before the enzyme genes. The reason is economy — five polypeptides and a pathway from chorismate are expensive to make when the product is already there.”'},

{q:'What is blue–white screening?', odd:1,
 mean:'实验室问法，落在 lacZ 上。<b>全部 general。</b>',
 say:'“A cloning trick built on lacZ, generally. The vector carries the small N-terminal fragment of β-galactosidase, the α-peptide, under the lac promoter, and the host carries the rest; together they make an active enzyme — α-complementation. If the enzyme is active it cleaves X-gal, a synthetic galactoside, into a blue product, so the colony is blue. The multiple cloning site sits inside the α-fragment: an insert disrupts it, no active enzyme, no colour — white colonies carry the insert. IPTG is added to induce the lac promoter. It is the lac operon’s own enzyme used as a reporter.”'},

{q:'Why is this considered a founding experiment of molecular biology?', odd:1,
 mean:'历史问法。<b>它第一次证明了基因的表达本身受控，而且控制者是一个蛋白结合一段 DNA。</b>',
 say:'“Because it was the first mechanism of gene regulation: it showed that a gene is not simply on, that its expression is controlled, and that the controller is a protein — the repressor — binding a specific site on the DNA — the operator — with a small molecule deciding whether it binds. It also introduced the idea of messenger RNA as a short-lived intermediate. Jacob and Monod are the names the textbook gives; generally that was 1961. The textbook still calls the mechanism hypothetical and partly verified — the book is old; the repressor has since been isolated and its structure solved.”'},

{q:'What is a promoter?',
 mean:'相邻概念，正面定义一句。',
 say:'“A promoter is the DNA sequence at which RNA polymerase binds to begin transcription, located near the start nucleotide and recognised by the σ subunit of the holoenzyme. In the lac operon it overlaps the operator, which is why a repressor on the operator blocks initiation. Generally the two conserved elements are at −10 and −35 from the start.”'}
],

/* ---------------- 追问 ---------------- */
ask:[
{g:'定义类', gn:'这题名词密度极高，而且每个都能单独拎出来问。先说它是什么，再说判据。', items:[
{r:'高', q:'What is an operator?',
 en:'“The operator is a DNA sequence in the control region of an operon, next to and overlapping the promoter, to which the repressor binds. Its binding decides whether RNA polymerase can transcribe the structural genes. In lac it is a near-palindrome — the textbook says that facilitates protein binding — and the repressor has three sites: the primary operator O₁, which overlaps the promoter, and two pseudo-operators.”',
 cn:'p103–p104。「跟启动子重叠」p089 也说了（<i>promotor se překrývá s operátorem lac</i>）。O₂ 在 lacZ 里、O₃ 在 lacI 里是通用说法，书把两个都写在 lacZ 里。<span class="pg">p103 p104 p089</span>'},
{r:'高', q:'What is the difference between a structural gene and a regulator gene?',
 en:'“A structural gene codes a protein that does the cell’s metabolism — in lac the three enzymes. A regulator gene codes a protein whose only job is to regulate transcription of other genes — in lac the repressor. The textbook’s distinction: structural genes are inside the operon, the regulator gene is beside it, and its product is diffusible, so it can act on any copy of the operator in the cell.”',
 cn:'p103–p104 原话（<i>strukturních genů … se účastní obecného metabolismu buňky</i>；<i>regulátorový gen … difuzibilního produktu</i>）。<span class="pg">p103 p104</span>'},
{r:'高', q:'What is an inducer? And a corepressor?',
 en:'“An inducer is a small molecule that binds the repressor and blocks its binding to DNA, so the operon is transcribed — the textbook calls inducers positive effectors and says the inducer is typically the substrate of the enzyme or a derivative of it: allolactose for lac, generally; IPTG in the lab. A corepressor is a small molecule that binds the repressor and enables its binding to DNA — generally tryptophan for trp. Both act on the repressor, never on the DNA.”',
 cn:'p104。「正效应物」说的是效果，不是「正控制」——正控制是激活蛋白。<b>这个词的两个用法不要混。</b><span class="pg">p104</span>'},
{r:'高', q:'What does polycistronic mean?',
 en:'“One mRNA carrying the coding sequences for several proteins, each with its own start and stop — the lac mRNA carries β-galactosidase, permease and transacetylase. The word is Lehninger’s; the textbook shows it in its figure — one lac mRNA with three arrows to the three products — and says that the size of an mRNA depends on the number of peptide chains it determines. In a eukaryote each mRNA is, generally, monocistronic.”',
 cn:'p086 ＋ Obr. 4.47。<span class="pg">p086 p103</span>'},
{r:'高', q:'What does constitutive mean?',
 en:'“Made all the time, at a constant level, regardless of inducer or corepressor. The lac repressor is made constitutively from lacI; and a constitutive mutant is one that makes the operon’s enzymes all the time — because the repressor is broken, or because the operator cannot bind it. Generally; the textbook does not use the word.”',
 cn:'全书 konstitutiv 0 命中。<b>但没有这个词，Jacob–Monod 的发现就讲不出来</b>，所以要备。'},
{r:'中', q:'What is a leader sequence?',
 en:'“The stretch of mRNA between the transcription start and the first structural gene. In the trp operon it is trpL, 162 nucleotides, it carries the attenuator near its end, and it encodes the short leader peptide with the tandem tryptophan codons. The textbook’s text says it is not translated; its figure shows a ribosome translating the leader peptide, and its list of translation start sites includes the trp leader — attenuation needs that translation.”',
 cn:'p104 正文 vs p105 图、p097 Obr. 4.40。<b>用图打正文。</b><span class="pg">p104 p105 p097</span>'},
{r:'中', q:'What is a hairpin?',
 en:'“A stretch of single-stranded RNA that folds back on itself so that two self-complementary segments pair into a short double helix with a loop at the end. The textbook uses the word for the terminator: a G+C-rich palindrome in the DNA gives a self-complementary transcript, which folds into a stable hairpin. In the trp leader, segments 3 and 4 make the terminator hairpin, segments 2 and 3 the antiterminator.”',
 cn:'p090 ＋ p105。<span class="pg">p090 p105</span>'},
{r:'中', q:'What is the σ factor?',
 en:'“The subunit of the bacterial RNA polymerase holoenzyme that recognises the promoter. The holoenzyme is α₂ββ′σ; σ finds the promoter and, once initiation has begun and short RNAs up to nine nucleotides have been made, it dissociates and can bind another core enzyme, while the core, α₂ββ′, elongates.”',
 cn:'p088–p089 ＋ p104。<span class="pg">p088 p089 p104</span>'},
{r:'中', q:'What is a terminator?',
 en:'“A DNA sequence at which transcription ends. The textbook gives the intrinsic kind two features: a G+C-rich palindrome whose transcript folds into a stable hairpin, and a run of four to ten A–T pairs after it, read into oligo-U, whose weak pairing with the template lets the transcript go. Termination is spontaneous there. Other sites need the protein ρ, which unwinds the RNA–DNA hybrid at the cost of NTPs.”',
 cn:'p090。<span class="pg">p090</span>'}
]},

{g:'为什么类', gn:'给了结论没给理由的地方。', items:[
{r:'高', q:'Why does the repressor bind the DNA rather than the polymerase?',
 en:'“Because the operator overlaps the promoter, so a protein sitting on the operator physically occupies the place polymerase needs — no interaction with the polymerase is required, and the same repressor works whatever polymerase comes. The textbook’s figure draws exactly that: repressor on O, polymerase kept off P. Generally, for lac the repressor can also loop the DNA by holding two operators at once, which makes the block tighter.”',
 cn:'p089 / p104 的「重叠」是理由。环化是 general。<span class="pg">p089 p104</span>'},
{r:'高', q:'Why does the trp operon need two layers?',
 en:'“Because they answer different questions at different sensitivities. Repression reads the amount of free tryptophan; attenuation reads the amount of charged tRNA-Trp — the thing that actually matters for making protein. Generally, repression gives most of the range and attenuation fine-tunes it several-fold on top; together they cover a wider range than either alone. And attenuation is fast: it acts on every transcript already started, without waiting for a repressor to find the operator.”',
 cn:'两层的分工书没有明说；书只给了衰减。「几倍」那个数是 Lehninger 的量级，<b>不要报具体倍数</b>——他要数就说 general 加判据。'},
{r:'高', q:'Why can’t a eukaryote use attenuation?',
 en:'“Because the mechanism needs a ribosome on the RNA while polymerase is still making it — the ribosome’s position decides which hairpin forms before polymerase reaches the terminator. In a eukaryote transcription is in the nucleus and translation in the cytosol, and between them the transcript is capped, spliced and polyadenylated, so no ribosome can reach the nascent RNA in time. The textbook shows the coupling in its figure; the sentence is general.”',
 cn:'p105 图 ＋ p106–p107（帽、内含子、poly A）。<span class="pg">p105 p106 p107</span>'},
{r:'中', q:'Why is the operator a palindrome?',
 en:'“Because the repressor is a symmetric protein — generally a dimer, or in lac a tetramer of identical subunits — and a symmetric protein binds a symmetric site: each subunit reads one half of the sequence. The textbook says the near-palindromic structure facilitates protein binding; the symmetry argument is general.”',
 cn:'p104。<span class="pg">p104</span>'},
{r:'高', q:'How much does induction raise expression? Give me a number.',
 en:'“I would not quote a number from memory — the textbook gives none. The criterion is the ratio of two binding affinities: how much tighter the repressor holds the operator than random DNA, and how much the inducer weakens that — generally the induced level is of the order of a thousand times the repressed one, and the exact value depends on strain and conditions. What I can say is the shape: it is a binding equilibrium, so it is graded, not all-or-none.”',
 cn:'<b>LOGIC §11 的场景。</b>先说没有书上的数、给判据、再给通用量级带 “of the order of”。「约千倍」是通用教材的量级，⚠ 待核具体值，不要说成精确数。'}
]},

{g:'怎么发现的', gn:'书点了名，没给年份和实验。年份和实验全是 general。', items:[
{r:'高', q:'How did Jacob and Monod work it out?',
 en:'“From genetics, not biochemistry — the textbook says the model was derived from experiments on the induction of the lactose enzymes. The key mutants, generally, were constitutive ones, making the enzymes without lactose. Two kinds behaved differently: a mutant in the regulator gene was recessive — adding a normal copy of lacI on a second piece of DNA restored regulation, so the product is diffusible, acts in trans; a mutant operator was dominant and acted only on the genes next to it, in cis — so it is a site, not a product. That is the repressor–operator distinction, and the textbook has both halves: a diffusible product, and an operator that controls the operon of the same chromosome.”',
 cn:'书 p102 ＋ p104 的两个词（<i>difuzibilní</i>；<i>téhož chromosomu</i>）。cis / trans、lacI⁻ / Oᶜ 是 general。<span class="pg">p102 p104</span>'},
{r:'中', q:'What was the PaJaMo experiment?',
 en:'“Generally — Pardee, Jacob and Monod, 1959: they transferred a normal lacI and lacZ by conjugation into a cell lacking both. β-Galactosidase appeared at once, without inducer, and then switched off after a while as the repressor accumulated. That showed the regulator gene makes a diffusible product that turns the operon off — negative control — rather than something that turns it on. It is the experiment behind the word repressor.”',
 cn:'全 general；书里没有。年份 1959 是 standard history。'},
{r:'中', q:'Was the repressor ever seen, or is it still a hypothesis?',
 en:'“It was isolated — generally Gilbert and Müller-Hill, in the sixties — and its structure with operator DNA and with inducer has been solved. The textbook still calls the Jacob–Monod mechanism hypothetical and only partly verified, which reflects when it was written; today it is one of the best-characterised protein–DNA systems.”',
 cn:'p102 的「hypotetický … částečně experimentálně ověřen」。⚠ 人名年份待核（1966），不逼不报。<span class="pg">p102</span>'}
]},

{g:'陷阱', gn:'这题最容易在名词的宾语上错——谁结合谁。每条一句改正。', items:[
{r:'实测', q:'Does the repressor bind the RNA polymerase?',
 en:'“No — it binds the DNA, the operator. The operator overlaps the promoter, so with the repressor there polymerase cannot bind; no contact between the two proteins is needed. The inducer, in turn, binds the repressor, not the DNA.”',
 cn:'<b>PESB 那次失分的形状</b>——把两个名字的宾语接错。宾语链：诱导物 → 阻遏物 → 操纵基因；聚合酶 → 启动子。<span class="pg">p104</span>'},
{r:'高', q:'So lactose induces the lac operon?',
 en:'“Strictly, a derivative of lactose does — the textbook says the inducer is the substrate or its derivative. Generally the true inducer is allolactose, galactose β-1,6 glucose, which β-galactosidase makes from lactose as a side reaction; lactose itself does not bind the repressor. In the lab we skip the sugar altogether and use IPTG.”',
 cn:'书的措辞留了口子（<i>substrát … nebo jeho derivát</i>），所以先说书的，再说 general。<span class="pg">p104</span>'},
{r:'高', q:'Is lacI part of the lac operon?',
 en:'“No. The textbook puts the regulator gene beside the operon: the operon is the control site P and O plus Z, Y and A. lacI has its own promoter, is transcribed on its own, and is not regulated by lactose — the repressor is made constitutively.”',
 cn:'Obr. 4.46 的括号不罩 I。「自己的启动子」是 general。<span class="pg">p103</span>'},
{r:'高', q:'Is attenuation a kind of repression?',
 en:'“No. The textbook says the attenuator has a function similar to the operator — both are places where transcription can be stopped — but the mechanism is different: repression is a protein binding DNA before initiation; attenuation is an RNA structure, decided by a translating ribosome, after initiation. No repressor protein is involved in attenuation at all.”',
 cn:'p105 的「<i>podobnou funkci jako operátor</i>」是个容易滑的比喻。<span class="pg">p105</span>'},
{r:'高', q:'Do eukaryotes have operons?',
 en:'“As a rule, no — generally each eukaryotic gene has its own promoter and gives a monocistronic mRNA, and regulation works mostly through activators rather than repressors. The textbook says only that regulation in multicellular eukaryotes differs, that a gene may have several promoters, that the regulators are non-histone proteins, and that the basic difference in the genes is exons and introns. A few exceptions exist — some nematode genes are transcribed together — but that is a footnote.”',
 cn:'p105–p106。「线虫有操纵子」是 general，不逼不说。<span class="pg">p105 p106</span>'},
{r:'中', q:'The textbook says the leader is not translated.',
 en:'“Its text does; its figure on the next page shows a ribosome translating the leader peptide, and its list of translation initiation sequences includes the trp leader. The mechanism needs that ribosome — the whole point is where it stalls. What is true is that the leader peptide is not one of the enzymes; it is made and discarded.”',
 cn:'<b>用书的图打书的正文</b>，LOGIC §14 的做法。<span class="pg">p104 p105 p097</span>'},
{r:'中', q:'The textbook calls it DNA polymerase holoenzyme.',
 en:'“That is a slip on that page — the subunit composition it gives, α₂ββ′σ, is the RNA polymerase holoenzyme, and the same book describes it as RNA polymerase where it introduces transcription. DNA polymerase has no σ and needs a primer; RNA polymerase needs neither.”',
 cn:'p104 vs p088。「不需要引物」p088 原话（<i>Startér pro syntézu RNA není potřeba</i>）。<span class="pg">p104 p088</span>'}
]},

{g:'相邻考点', gn:'这道题左边是转录（p088–p091），右边是翻译（p092–p101）和翻译后修饰（卡 13），下面是代谢调控（#32）。走出去一步都有底。', items:[
{r:'高', q:'What does RNA polymerase do at the promoter?',
 en:'“Four things, the textbook says: binds the template, initiates the chain, elongates it, terminates it. The holoenzyme α₂ββ′σ binds the promoter through σ, forms an open complex, makes abortive short RNAs up to nine nucleotides, then σ leaves and the core elongates, 5′ to 3′, from ribonucleoside triphosphates, no primer, on one strand only. Bound to a promoter it protects that DNA from DNase I — which, generally, is how promoters were mapped: footprinting.”',
 cn:'p088–p089 ＋ p104。footprinting 这个名字是 general，书只说「保护 DNA 不被 DNase I 切」。<span class="pg">p088 p089 p104</span>'},
{r:'中', q:'How does the ribosome find the start on a polycistronic mRNA?',
 en:'“By a Shine–Dalgarno sequence in front of each coding region — a purine-rich stretch about ten nucleotides before the AUG that pairs with the 3′ end of 16S rRNA, so each cistron on the lac mRNA has its own ribosome entry. The textbook’s figure of initiation sequences lists lacZ, lacI and the trp leader — and notes that lacI is the one whose start codon is not AUG.”',
 cn:'p097 Obr. 4.40。lacI 起始 GUG 是书图注的原话（<i>až na lacI všechny AUG</i>）。<span class="pg">p097</span>'},
{r:'中', q:'Where does this sit among the ways a cell regulates an enzyme?',
 en:'“At the level of enzyme amount. The textbook’s chapter on regulation lists: regulation by substrate concentration through Michaelis kinetics; by the level of the enzyme — controlled synthesis, induction or repression, which it says is the level of using the cell’s genetic equipment, and where it sends you back to the operon chapter; by inhibitors; by allosteric control and feedback; and by covalent modification. Induction is the slowest and the most complete — you change how many enzyme molecules exist, not how fast each works.”',
 cn:'p221 明写「<i>regulaci biosyntézy enzymů indukcí nebo represí (kap. 4.2.4)</i>」。这是 #32 那道题的骨架，卡 19 的反馈抑制是它的另一格。<span class="pg">p221</span>'},
{r:'中', q:'Is there anything like a corepressor in eukaryotes?',
 en:'“The textbook says hormones can act like corepressors: a steroid hormone binds its receptor protein, and the receptor–hormone complex acts on the DNA or, through a protein kinase, on DNA-binding proteins, to change transcription of the structural genes; it adds that steroid hormones induce enzyme synthesis. Generally the receptor–hormone complex is an activator rather than a repressor, but the textbook’s analogy is the small molecule setting what a regulatory protein does.”',
 cn:'p108 ＋ p221。<span class="pg">p108 p221</span>'},
{r:'中', q:'What happens to the protein after the operon has been transcribed and translated?',
 en:'“In a bacterium, not much: no endoplasmic reticulum, protein synthesis on free ribosomes, the N-terminal formylmethionine is trimmed, and the enzyme folds in the cytosol. The lac products are all cytosolic or inner-membrane — the permease is a membrane protein inserted without a secretory pathway. That is why a bacterium cannot give you N-glycosylation or, in its cytoplasm, disulfides — the post-translational modifications that need the ER.”',
 cn:'p102 ＋ 卡 13。<b>这就是从操纵子走到卡 13 的那一步</b>。<span class="pg">p102</span>'}
]},

{g:'桥回主场', gn:'他顺着 IPTG 走过来，这一组全是实验室知识，书 grep 0 命中，说的时候带 “in my system / generally”。⚠ 说到自己的载体前确认图谱。', items:[
{r:'高', q:'How does your expression system use the lac operon?',
 en:'“Twice over, in the pET–BL21(DE3) system. The host carries the gene for T7 RNA polymerase — a phage polymerase that only recognises its own T7 promoter — behind a lac promoter with a lac operator. The plasmid carries my gene behind a T7 promoter that is itself followed by a lac operator, and it carries its own lacI. Without IPTG the repressor sits on both operators; add IPTG and both open — the host makes T7 polymerase, the polymerase transcribes my gene, and because T7 polymerase is fast and specific, most of the cell’s protein synthesis goes to my protein. It is the lac switch borrowed to gate a phage enzyme.”',
 cn:'标准 pET 逻辑。<b>lacUV5</b>（DE3 里驱动 T7 聚合酶的启动子变体）、T7lac 这些名字被追再给。'},
{r:'高', q:'What is leaky expression, and why do you add glucose?',
 en:'“Leaky expression is the low level of my protein made without IPTG — the repressor–operator system is an equilibrium, so some T7 polymerase is always made and some target transcribed. It matters when the protein is toxic to the cell, because the leaky cells stop growing and the plasmid drifts. Two fixes, generally: glucose in the medium, which uses the operon’s own second layer — catabolite repression lowers transcription from the lac promoter driving T7 polymerase; and a plasmid making T7 lysozyme, which binds and inhibits T7 polymerase. Both push the basal level down without touching the induced one.”',
 cn:'实验室知识。这条同时回答了「为什么 catabolite repression 你要会」——它不是课本装饰，是你培养基里的葡萄糖。'},
{r:'高', q:'And in yeast — how do you induce display?',
 en:'“Through the GAL1 promoter, the eukaryotic parallel and the opposite logic: positive control by an activator. The surface fusion is behind GAL1; the activator Gal4 sits on the upstream activating sequence but is held inactive by Gal80 while there is no galactose; galactose releases it and transcription starts; glucose represses the whole system. So I grow the cells in glucose, then move them to galactose to induce — no operon, no repressor on an operator, a switch made of an activator and its inhibitor instead.”',
 cn:'Gal4 / Gal80 / Mig1 是通用酵母遗传学。跟卡 02 的 yeast display 接上。'},
{r:'高', q:'You said binding — what is the repressor’s Kd?',
 en:'“I would not quote a number from memory. The point is the ratio: the lac repressor binds its operator many orders of magnitude more tightly than random DNA, and inducer binding lowers the operator affinity by orders of magnitude — that gap is the switch. It is the same quantity I measure: with yeast display I titrate a labelled partner and read a dissociation constant off the midpoint. A repressor–operator titration would be the same experiment with DNA as the ligand.”',
 cn:'完整的 Kd 在<b>卡 02</b>。⚠ 具体值（通常引 10⁻¹³–10⁻¹⁰ M，随盐浓度变）待核，不报。'},
{r:'中', q:'Why IPTG rather than lactose in the lab?',
 en:'“Because IPTG is not metabolised: it binds the repressor like allolactose but is not a substrate of β-galactosidase, so its concentration and the induction stay constant. Lactose would be split by the enzyme it induces, so the signal fades; and lactose also needs the permease to get in, while IPTG diffuses in on its own. Generally an inducer the cell cannot use is called gratuitous.”',
 cn:'实验室知识。'}
]}
]
});

<script>
/* data/16.js */
/* 卡 16 · Explain the process of DNA replication.
   题库 #16（S3 Biochemistry 3）· 单卷题 · 书本投入 45
   出处 Biochemie OCR p076–p085（§4.1.2.1、§4.1.3）、p073（配对特异性＝复制准确性）、
        p088（转录不需要 primer，相邻）、p009（年表：1953 Watson–Crick、1983–5 PCR）
   书里 0 命中，全部标 general 或实验室：topoisomerase / gyrase · telomere · Meselson–Stahl ·
   Kornberg（DNA pol I；书里的 Kornberg 是 2001 年 RNA polymerase 结构那位）· Okazaki 人名 ·
   错误率数字 · α-磷酸这个叫法 · 真核 pol α/δ/ε · Taq / Kapa。
   卡 03 已定义、这里不重复：antiparallel、complementary、base pairing、phosphodiester bond、撇号约定。 */

window.CARDS.push({
id:'16', n:16, w:1,
q:'Explain the process of DNA replication.',
qcn:'解释 DNA 复制的过程',
sub:'主干说完约 90 秒 · 「process」＝他要顺序 · 全卡的轴是一句话：polymerase 只能接 3′-OH',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'先说它是什么，再说半保留，再说需要什么。三句之后才准报酶名。'},
 {n:'01', t:'定义',
  big:'复制是 DNA 的<b>生物合成</b>：从一个双螺旋做出两个一样的；在<b>模板</b>上做，新链的核苷酸顺序由模板的碱基顺序决定（互补）',
  en:'“DNA replication is the biosynthesis of DNA — the textbook calls it reduplication: from one double helix the cell makes two identical ones. The process is a sequence of steps at the replication fork — unwinding, priming, synthesis, joining. It is synthesis on a template, an existing strand of DNA, and the order of nucleotides in the new strand is fixed by the order of bases in that template through base pairing — opposite adenine only thymine fits, opposite guanine only cytosine. The textbook’s sentence: the complementary nature of the two strands determines that every new strand keeps the base order the original molecule prescribed.”',
  note:'书 §4.1.3 的节标题就是一句 researcher 式的话：「DNA 的结构和生物合成解释了遗传的原理」。定义先说它<b>是什么</b>，再说判据（模板、互补）。<b>base pairing、antiparallel、complementary 的定义在卡 03</b>，不重复。<span class="pg">p076</span>'},
 {n:'02', t:'半保留',
  big:'<b>Semiconservative</b>：每条新双螺旋里，一条链是旧的，一条链是新合成的',
  en:'“Replication is semiconservative: each of the two daughter double helices keeps one parental strand and gets one newly made strand — the parental helix is neither kept whole nor broken up; it is split between the two products. The textbook says so directly, and its electron micrograph of a replication eye in Drosophila DNA is consistent with the semiconservative model.”',
  note:'p082「probíhá semikonservativně」；p078 Obr. 4.15。<b>Meselson–Stahl 1958 书里没有</b>（全书 0 命中），要说就带 “generally”。<span class="pg">p078 p082</span>'},
 {n:'03', t:'需要什么',
  big:'底物：<b>四种 dNTP</b> ＋ <b>模板 DNA</b> ＋ 一小段 <b>RNA primer</b>；polymerase 还要 <b>Mg²⁺</b>',
  en:'“Besides the enzymes, the synthesis needs several substrates: all four deoxyribonucleotides as triphosphates — dATP, dGTP, dCTP and dTTP; DNA as the template; and a short piece of RNA that serves as the starter, the primer. DNA polymerase also needs magnesium ions.”',
  note:'p077 原话，这就是「账」的投入行。<span class="pg">p077 p078</span>'},

 {g:'演员表', gn:'每个酶三样：名字 · 干什么 · 方向。「the enzyme」不许出现，每个都点名。'},
 {n:'04', t:'polymerase 的化学',
  big:'DNA polymerase 只能把 dNTP 接到已有链的<b>游离 3′-OH</b> 上 → 合成只能 <b>5′→3′</b>，而且<b>不能起头</b>；反应靠放出并水解<b>焦磷酸</b>推动',
  en:'“DNA polymerase adds a deoxyribonucleotide to the free 3′-hydroxyl at the 3′ end of a growing chain, so the new strand grows only 5′→3′ — five-prime and three-prime being the two sugar carbons that carry the phosphates, so the direction means new units go on at the sugar’s carbon three. The chemistry, in the textbook: the 3′-OH makes a nucleophilic attack on the phosphorus atom of the incoming dNTP — generally, its innermost, alpha phosphate — a phosphodiester bond forms, pyrophosphate is released, and pyrophosphatase hydrolyses it to two phosphates; that release and hydrolysis drives the reaction. And a polymerase cannot start a chain: there must already be a stretch paired with the template and carrying a free 3′-OH — that is the whole reason a primer exists.”',
  note:'p078 给了亲核进攻和 pyrophosphatase 两步；<b>「α-磷酸」书没说</b>，只说「dNTP 的磷原子」，所以带 generally。<b>5′ 和 3′ 是承重名词</b>，同一句里交代了。书说活性中心同时固定三样：模板、新链的 3′-OH 端、进来的 dNTP。<span class="pg">p078</span>'},
 {n:'05', t:'三个 polymerase',
  big:'E. coli 三个 DNA polymerase：<b>I</b> 三种活性；<b>II</b> 和 <b>III</b> 只有 polymerase ＋ 3′→5′ exonuclease；<b>III 是复制酶</b>，I 拆 primer 补缺口',
  tbl:{head:['','polymerase 5′→3′','3′→5′ exo（校对）','5′→3′ exo（拆 primer）','体内干什么'],
       rows:[['pol I','✓','✓','✓','拆 RNA primer、填缺口、修复'],
             ['pol II','✓','✓','—','书：体内功能不明'],
             ['pol III','✓','✓','—','复制酶：合成绝大部分新 DNA']]},
  en:'“E. coli has three DNA polymerases. Polymerase I has three activities on one chain — polymerase, 3′→5′ exonuclease and 5′→3′ exonuclease — in three different active sites. Polymerases II and III have the polymerase and the 3′→5′ exonuclease but not the 5′→3′ one. The in-vivo function the textbook knows is polymerase III’s: it is the replicase and makes most of the new DNA; polymerase I removes the primers and fills the gaps they leave.”',
  note:'p079–p080。<b>全卡最值钱的 specific 弹药</b>，也正是描述 Taq 和 Kapa 的词汇表（见 17）。数字：蛋白酶把 pol I 切成<b>小片段</b>（36 000，含 5′→3′ 核酸酶）和<b>大片段 Klenow</b>（67 000，polymerase ＋ 3′→5′ exo）。<span class="pg">p079 p080</span>'},
 {n:'06', t:'校对',
  big:'<b>3′→5′ exonuclease ＝ 校对</b>：从 3′-OH 端往回拆，配错的就拆掉；书叫它「<b>第二个纠错者</b>」——第一个是碱基配对本身',
  en:'“An exonuclease takes nucleotides off from an end of a chain, one at a time, by hydrolysis. The 3′→5′ exonuclease of polymerases I and III works from the 3′-OH end backwards, and the textbook calls it a second corrector of base-pairing errors — proofreading: a mispaired nucleotide is removed before the chain goes on. The first corrector is base pairing itself: the textbook says the specificity of the hydrogen bonding is what is responsible for the accuracy of replication.”',
  note:'p078「druhý korektor」；第一个纠错者是 p073 那句。<b>错误率的数字书里没有</b>——被问就说 generally（见追问）。<span class="pg">p073 p078</span>'},
 {n:'07', t:'5′→3′ 核酸酶',
  big:'pol I 的 <b>5′→3′ 核酸酶</b>从缺口处往下切、一次一段（≤10 nt）：<b>拆 primer</b>、切 UV 造成的<b>嘧啶二聚体</b>；配上聚合活性就是「缺口平移」',
  en:'“Polymerase I’s 5′→3′ nuclease is different in kind: it cuts inside the chain, in a double-stranded region, starting at a nick — a break in one strand — and removes a piece of up to ten nucleotides. It matters for two reasons: it is how the RNA primer is removed, and it repairs some damage — it excises the pyrimidine dimers that UV light makes, and polymerase I fills the gap. Nuclease and polymerase together move a nick along the strand towards its 3′ end — nick translation.”',
  note:'p079–p080，Obr. 4.17、4.18。也是「修复」在这本书里的唯一落点（grep「reparac」0 命中，只有 p079 的 opravy）。<span class="pg">p079 p080</span>'},
 {n:'08', t:'helicase 与 SSB',
  big:'解链是 <b>helicase</b>（DnaB）的活，靠水解 <b>ATP</b>；<b>SSB</b> 抓住分开的单链不让它们重新配对',
  en:'“Unwinding the double helix is done by the helicase — the DnaB protein in E. coli — with unwinding proteins, and the energy comes from hydrolysing ATP. The helicase separates the strands moving along the lagging-strand template; the Rep protein moves along the leading one. Behind the helicase the single strands are held apart by single-strand-binding protein, SSB, which stops them pairing back before they are copied.”',
  note:'p080、p085。<b>拆链的不是 polymerase</b>——陷阱之一；书 p080 末尾说 pol I「在解链上也有一定作用」，见陷阱。⚠ OCR 把 SSB 印成 SBB。<span class="pg">p080 p085</span>'},
 {n:'09', t:'primer 与 primase',
  big:'因为 polymerase 要 3′-OH，所以先由 <b>primase</b> 在解开处合成一段 <b>RNA</b>（≤60 nt）当 primer',
  en:'“Because every DNA polymerase needs a free 3′-OH, a short piece of RNA — up to sixty nucleotides in the textbook — is made at the melted site to serve as the primer. An RNA polymerase can start a chain; a DNA polymerase cannot. In E. coli the textbook names two enzymes for it, the transcribing RNA polymerase and a much smaller primase, and assumes both take part; on the lagging strand the primase works inside a protein assembly called the primosome.”',
  note:'p083、p085。<b>为什么是 RNA 而不是 DNA</b> 书没说，见 why 第二级。<span class="pg">p083 p085</span>'},
 {n:'10', t:'ligase',
  big:'<b>DNA ligase</b> 把一条链的 <b>3′-OH</b> 和另一条链的 <b>5′-磷酸</b>连成磷酸二酯键；吸能，E. coli 用 <b>NAD⁺</b>，真核用 <b>ATP</b>；只能接双链里的缺口',
  en:'“DNA ligase makes a phosphodiester bond between the 3′-OH of one DNA chain and the 5′-phosphate of another. The reaction is endergonic; the energy comes from splitting ATP or, in E. coli, NAD⁺ — the ligase first takes an AMP onto the amino group of a lysine, passes it to the 5′-phosphate of the DNA, and then the 3′-OH attacks that activated phosphate and AMP leaves. Ligase cannot join two single-stranded molecules — part of the DNA must be double-stranded — so what it does is seal nicks in a duplex.”',
  note:'p081–p082，Obr. 4.20。<b>陷阱：ligase 不是在合成时连核苷酸的，那是 polymerase</b>；ligase 只封缺口。<span class="pg">p081 p082</span>'},

 {g:'复制叉上的顺序', gn:'题面的「process」要的就是这一组。「两条母链都是模板」＋「polymerase 只走 5′→3′」两句一碰，半不连续就自己推出来。'},
 {n:'11', t:'起点与叉',
  big:'从<b>固定位点</b>起始；E. coli 环状染色体从<b>一个</b>起点<b>双向</b>复制，像希腊字母 <b>θ</b>；解开又同时合成的地方叫<b>复制叉</b>',
  en:'“Replication starts at a specific site in the molecule — generally called the origin. The E. coli chromosome is a closed circle and replicates bidirectionally from a single origin, so the replicating molecule looks like the Greek letter theta — the textbook shows Cairns’s autoradiogram, made by incorporating tritiated thymidine. Only part of the helix is unwound at a time; the place where it is being unwound and copied at the same moment is the replication fork, and two forks make the replication eye, or bubble.”',
  note:'p082、p085、p077。「origin」这个词书没用（0 命中），书说「určité místo」——带 generally。<span class="pg">p077 p082 p085</span>'},
 {n:'12', t:'半不连续',
  big:'两条母链<b>都当模板</b>；但 polymerase 只走 5′→3′，两条模板又<b>反平行</b>，所以一条新链连续（<b>leading</b>），另一条只能倒着分段做（<b>lagging</b>）',
  en:'“At the fork both parental strands serve as templates. But every known DNA polymerase extends only 5′→3′, and the two parental strands are antiparallel — so on one template the new chain grows continuously in the direction the fork moves: the leading strand. On the other template the new chain must also be made 5′→3′, which is away from the fork, so it is made in pieces: the lagging strand, built as Okazaki fragments. The textbook’s word is semidiscontinuous replication.”',
  note:'p082–p083。<b>反平行的定义在卡 03</b>。<span class="pg">p082 p083</span>'},
 {n:'13', t:'Okazaki 循环',
  big:'每段四步：primase 做 RNA primer → <b>pol III</b> 接 <b>1000–2000 nt</b> → <b>pol I</b> 拆 primer 并补 DNA → <b>ligase</b> 封口',
  en:'“Each Okazaki fragment takes four steps. Primase lays down an RNA primer. Polymerase III extends it into a stretch of about one to two thousand nucleotides in E. coli. Polymerase I removes the RNA primer with its 5′→3′ nuclease and fills the gap with DNA. DNA ligase joins the fragment to the one before it. Then the helix opens further and the cycle runs again. Both strands are made on one complex, the replisome — the textbook says probably two polymerase III holoenzymes — with the lagging template looped around it so its polymerase can still travel with the fork.”',
  note:'p083–p085，Obr. 4.25。⚠ p081 也给了一个 Okazaki 长度，指数被 OCR 吃了（「10ⁿ」）——报 p083 的 1000–2000。真核片段短得多（generally 100–200 nt），书没给。「trombone model」是通用叫法。<span class="pg">p081 p083 p084 p085</span>'},
 {n:'14', t:'画复制叉',
  big:'他让画：一个<b>横躺的 Y</b>，先标两臂的 5′/3′，再画箭头',
  en:'“If I draw it: a Y lying on its side — the stem is the parental duplex, the arms are the separated templates, the fork moves left. On the upper arm the new strand runs continuously towards the fork — leading. On the lower arm short arrows point away from the fork — Okazaki fragments, each starting from a small RNA primer, ligase between them.”',
  note:'<b>画的顺序</b>（书 Obr. 4.22）：① 横躺的 Y，叉尖朝左 ② 上臂从叉尖往右标 <b>5′→3′</b>（叉端是 5′），下臂从叉尖往右标 <b>3′→5′</b>（叉端是 3′）——反平行 ③ 上臂下面一条长箭头<b>指向叉</b>，箭头尖标 3′，写 leading ④ 下臂上面三段短箭头<b>背离叉</b>，每段左端一小段波浪线＝RNA primer，写 lagging / Okazaki ⑤ 叉尖画 helicase，裸露单链上几个小圆＝SSB ⑥ 两段之间标 ligase。<span class="pg">p083</span>'},

 {g:'账与边界', gn:'合成类的题也要三行账。然后是原核/真核的边界——书只给了两句。'},
 {n:'15', t:'账',
  big:'每接一个核苷酸花掉 <b>两个高能磷酸键</b>；产物是两条各一半旧一半新的双螺旋；<b>合成代谢，耗能，不产 ATP</b>',
  tbl:{head:['','什么'],
       rows:[['投入','n dNTP（每接一个放一个 PPᵢ）· ATP：helicase 每步、真核 ligase 每个缺口 · NAD⁺：E. coli ligase 每个缺口 · NTP：做 primer（之后扔掉）'],
             ['产出','两条双螺旋，各一半旧一半新 · n PPᵢ → 2n Pᵢ（pyrophosphatase）· AMP（每次 ligase）· 拆下来的 primer 核糖核苷酸'],
             ['总结','每个核苷酸两个高能键：一个在成键时放出 PPᵢ，一个在 PPᵢ 被水解时——所以事实上不可逆。合成代谢，耗能，不产 ATP']]},
  en:'“On the balance sheet: in go the four dNTPs, one per nucleotide; ATP for the helicase at every step and for ligase in eukaryotes; NAD⁺ for ligase in E. coli; and ribonucleotides for primers that are thrown away. Out come two double helices, each half old and half new, one pyrophosphate per nucleotide — split by pyrophosphatase to two phosphates — and one AMP per ligation. Net: every nucleotide costs two high-energy phosphate bonds, which is why the reaction is effectively irreversible; replication is anabolic — it consumes energy and makes none.”',
  note:'三行缺一不可。「两个高能键 → 不可逆」是从 p078 的两步<b>推出来的</b>，书没明写「不可逆」——说成 “which is why”。<span class="pg">p077 p078 p081</span>'},
 {n:'16', t:'原核 vs 真核',
  big:'书只说「真核<b>复杂得多</b>」＋ ligase 用 ATP 不用 NAD⁺；多个起点、pol α/δ/ε、端粒——<b>全部 general</b>',
  en:'“The textbook keeps the E. coli picture and says only that replication is much more complex, especially in eukaryotes, and that eukaryotic ligases use ATP where E. coli’s uses NAD⁺. Generally — not from the book: a eukaryotic chromosome is linear with many origins working at once; the polymerases are named by Greek letters — alpha carries the primase, delta makes the lagging strand, epsilon the leading; and the linear ends, the telomeres, cannot be finished by this machinery because the last primer leaves a gap — telomerase, a reverse transcriptase with its own RNA template, extends them.”',
  note:'p083、p081。<b>希腊字母那套和端粒全是通用知识</b>（telomer 0 命中）。<span class="pg">p081 p083</span>'},

 {g:'收尾', gn:'一句停住，一句伸出去。停在「为什么只能 5′→3′」，伸到 Taq / Kapa。'},
 {n:'17', t:'落点',
  big:'为什么所有 polymerase 都只能 5′→3′：成键的能量在<b>进来的 dNTP</b> 上；反过来长，活化端就得放在链上，校对一拆就没了',
  en:'“Why every polymerase runs 5′→3′ the textbook does not say; generally, the answer is where the energy sits. The bond is paid for by the triphosphate of the incoming nucleotide. If chains grew 3′→5′ the activated triphosphate would have to sit on the growing chain’s 5′ end — and the moment proofreading removed a wrong nucleotide, the chain would lose its activated end and stop. Growing on the 3′-OH means the energy always arrives with the next monomer, so a chain can be corrected and still go on.”',
  note:'Lehninger 的论证，<b>不是书的</b>。停止句在 why 那一屏，落在进化。'},
 {n:'18', t:'留口子',
  big:'书上 pol I 的三种活性，正是我描述 Taq 和 Kapa 的词汇表：<b>Taq</b> ＝ polymerase ＋ 5′→3′ exo，<b>没有</b> 3′→5′ 校对；<b>KAPA HiFi</b> ＝ polymerase ＋ 3′→5′ 校对',
  en:'“The three activities the textbook lists for polymerase I are exactly the vocabulary I use for the enzymes in my own work. Taq polymerase — from the thermophile Thermus aquaticus, so it survives the 95-degree steps of PCR — has the polymerase and the 5′→3′ exonuclease, like polymerase I, but no 3′→5′ exonuclease: no proofreading, so it makes errors, and it leaves one untemplated adenine on the 3′ end of its product. KAPA HiFi is an engineered polymerase with the 3′→5′ proofreading exonuclease, so its error rate is far lower and its products are blunt. In directed evolution that difference is a tool: Taq under mutagenic conditions builds a library of variants; KAPA HiFi amplifies a library or a sequencing sample without adding mutations. All of that is laboratory knowledge, not the textbook’s.”',
  note:'这就是题 #5/#10。<b>全部标实验室出处。</b>数字（Taq 约 10⁻⁴–10⁻⁵ 错误/碱基/倍增，Kapa 比 Taq 低约两个数量级）⚠ 待核，核之前只说 “far lower”。'}
],

segs:[
 {tag:'段 1 · 定义', h:'它是什么，半保留，需要什么',
  p:['“DNA replication is the biosynthesis of DNA — from one double helix the cell makes two identical ones. It is synthesis on a template: the order of nucleotides in the new strand is fixed by the order of bases in the template through base pairing — the textbook’s phrase is that the complementary nature of the two strands determines the base order of the new strand. The process itself is a sequence of steps at the replication fork — unwinding, priming, synthesis, joining — and that is what I will describe.',
     'It is semiconservative: each daughter helix keeps one parental strand and gets one new one.',
     'Besides the enzymes it needs the four deoxyribonucleoside triphosphates, DNA as template, a short RNA primer, and magnesium ions.”'],
  note:'<b>三句之后才准报酶名。</b>这三句已经把「模板」「互补」「半保留」「primer」四个承重词放到了台面上，后面每个酶都有地方挂。'},
 {tag:'段 2 · general', h:'演员表：每个酶带方向',
  p:['“The central enzyme is DNA polymerase. It adds a deoxyribonucleotide to the free 3′-hydroxyl of a growing chain — the 3′-OH attacks the phosphorus of the incoming dNTP, a phosphodiester bond forms, pyrophosphate leaves and is hydrolysed — so synthesis is always 5′→3′, and it cannot start a chain: it needs a paired stretch with a free 3′-OH. E. coli has three: polymerase III is the replicase; polymerase I removes primers and fills gaps and alone has a 5′→3′ exonuclease; polymerases I and III both proofread with a 3′→5′ exonuclease — the textbook’s second corrector after base pairing itself.',
     'Around it: helicase, DnaB, separates the strands using ATP; single-strand-binding protein keeps them apart; primase makes the RNA primer, up to sixty nucleotides; and DNA ligase seals nicks — joining a 3′-OH to a 5′-phosphate at the cost of NAD⁺ in E. coli or ATP in eukaryotes.”'],
  note:'<b>每个名字后面紧跟它干什么和方向。</b>只报名字，他下一句就是「那 ligase 到底接的是什么」。'},
 {tag:'段 3 · 稍展开', h:'叉上的顺序——题面的 process',
  p:['“It starts at a specific site — in E. coli a single origin on the circular chromosome, running both ways, giving the theta structure. Where the helix is being unwound and copied at the same time is the replication fork.',
     'At the fork both parental strands are templates. Because every polymerase extends only 5′→3′ and the two templates are antiparallel, one new strand — the leading — grows continuously towards the fork, and the other — the lagging — is made in pieces pointing away from it, the Okazaki fragments, one to two thousand nucleotides each in E. coli.',
     'Each fragment goes through four steps: primase lays an RNA primer; polymerase III extends it; polymerase I removes the primer with its 5′→3′ nuclease and fills in DNA; ligase seals the nick. Both strands are made on one complex, the replisome, with the lagging template looped around it.”'],
  note:'〔可裁〕时间够就加账：“Every nucleotide costs two high-energy bonds — one when pyrophosphate leaves, one when pyrophosphatase splits it — so the reaction is effectively irreversible.”'},
 {tag:'段 4 · 留口子', h:'把书的三种活性接到自己手里的酶',
  p:['“The three activities the textbook gives polymerase I are exactly how I describe the enzymes I use. Taq polymerase is thermostable, has the polymerase and the 5′→3′ exonuclease, but no 3′→5′ proofreading — so it makes errors and leaves an untemplated adenine at the 3′ end. KAPA HiFi has the 3′→5′ proofreading activity, so its error rate is far lower. For directed evolution that is a choice I make on purpose: Taq under mutagenic conditions to build a library of variants, KAPA HiFi to amplify a library or a sequencing sample without adding mutations. And primer design in PCR follows the same rule as the primer here — the polymerase only extends a matched 3′-OH, so the 3′ end of a primer must pair exactly, while the 5′ end can carry whatever tail I need.”'],
  note:'<b>这个口子是书自己搭的</b>：p079–p080 那张三活性表就是 Taq/Kapa 的语言。他追下去是题 #5，正是她的主场。<b>全部说成实验室知识</b>。'}
],

/* ---------------- 同一个答案，不同问法 ---------------- */
recog:[
{q:'What is DNA replication?',
 mean:'<b>他嘴里的最短问法。</b>答案自带结构：定义 → 半保留 → 叉和演员 → leading/lagging → 校对。说到校对就停，让他挑。',
 say:'“DNA replication is the biosynthesis of DNA — from one double helix, two identical ones, made on a template: the order of bases in the parental strand fixes the order in the new one through base pairing. It is semiconservative — each daughter helix keeps one parental strand. The helix is unwound by a helicase at a replication fork; primase makes a short RNA primer; DNA polymerase III extends it, adding each dNTP to the free 3′-OH, so always 5′→3′. Because the templates are antiparallel, one strand — the leading — grows continuously, the other — the lagging — in Okazaki fragments; polymerase I replaces the primers with DNA and ligase seals the nicks. Accuracy comes from base pairing and from the 3′→5′ exonuclease that proofreads.”'},

{q:'Explain the process of DNA replication.',
 mean:'<b>卷面题面。</b>「process」＝他要<b>顺序</b>，不是清单。按叉上的事件先后说。',
 say:'“In order: replication starts at a specific site — one origin on the E. coli chromosome, running both ways. Helicase separates the strands using ATP and single-strand-binding protein holds them apart. Primase lays an RNA primer, because no DNA polymerase can start a chain. Polymerase III extends the primer 5′→3′ — continuously on the leading strand, in one-to-two-thousand-nucleotide Okazaki fragments on the lagging strand, since that template runs the other way. Polymerase I removes each primer with its 5′→3′ nuclease and fills the gap; DNA ligase joins the fragments, spending NAD⁺. The helix opens further and the cycle repeats until two complete semiconservative helices exist.”'},

{q:'What does semiconservative mean?',
 mean:'核心词正面定义，一句，再给书的证据。',
 say:'“Semiconservative means each product double helix is made of one old strand and one new strand — the parental helix is split between the two daughters rather than kept whole or dispersed. The textbook states it and shows an electron micrograph of a replication eye that fits the model; the classic proof is general knowledge — Meselson and Stahl’s density-labelling experiment, 1958.”'},

{q:'What is a primer, and why is it RNA?',
 mean:'定义 ＋ 一个书里没有的 why。<b>先划清出处再解释。</b>',
 say:'“A primer is a short stretch of nucleotides paired to the template that offers a free 3′-OH for DNA polymerase to extend — in the cell a piece of RNA up to sixty nucleotides, made by primase, because DNA polymerases cannot start a chain and RNA polymerases can. Why RNA rather than DNA the textbook does not say; generally, the first nucleotides are laid down without proofreading, and making them of RNA marks them as temporary — polymerase I removes them and replaces them with proofread DNA.”'},

{q:'What are Okazaki fragments?',
 mean:'正面定义，带书的数字。',
 say:'“Okazaki fragments are the short pieces in which the lagging strand is made — each started from its own RNA primer and extended 5′→3′ away from the fork, about one to two thousand nucleotides in E. coli in the textbook, generally much shorter in eukaryotes. Polymerase I removes their primers and ligase joins them into one continuous strand.”'},

{q:'What is the difference between the leading and the lagging strand?',
 mean:'<b>比较题的形状</b>：先给轴（相对于叉的方向），再填。',
 say:'“One axis: the direction of synthesis relative to the fork. Both new strands are made 5′→3′ — the difference is what that means on each template. On one template 5′→3′ points towards the fork, so that strand — the leading strand — grows continuously as the fork opens. On the other, antiparallel template it points away from the fork, so that strand — the lagging strand — can only be made in pieces, each waiting for enough template to be exposed: the Okazaki fragments, later joined by ligase.”'},

{q:'What is the difference between replication, transcription and PCR?',
 mean:'三个都是「在模板上合成核酸」，<b>轴是：谁解链、要不要 primer、产物是什么、抄一条还是两条</b>。',
 say:'“All three copy a template by base pairing. Replication copies both strands of the whole molecule into DNA, opened by helicase, started by RNA primers, once per cell cycle. Transcription copies one strand — the textbook’s coding strand — of one gene into RNA, by RNA polymerase, which needs no primer, and ends at a terminator. PCR — laboratory, not the book — copies a stretch defined by two synthetic DNA primers, uses heat instead of helicase to separate the strands, needs no primase, no primer removal and no ligase, and doubles the product every cycle.”'},

{q:'Why does a cell have to copy its DNA before it divides?', odd:1,
 mean:'问的是<b>半保留 ＋ 遗传</b>——书 §4.1.3 的标题。',
 say:'“Because each daughter cell needs a complete copy of the genetic information, and the information is the base sequence — the textbook’s point is that DNA is the material carrier of heredity and its structure explains how it is passed on: complementarity lets each strand serve as a template for the other, so one helix becomes two identical ones, each with one parental strand. Without replication one daughter would have no genome.”'},

{q:'Why do we age — what are telomeres?', odd:1,
 mean:'<b>书里 0 命中</b>，全部 general。答案落在「最后一个 primer 留下的缺口」上——这张卡的逻辑。',
 say:'“Generally — the textbook does not cover it. A linear chromosome cannot be finished by this machinery: the lagging strand needs an RNA primer at its very end, and when that primer is removed nothing can fill the gap, because a polymerase only extends a 3′-OH and there is none upstream. So each round the ends — the telomeres, repeated non-coding sequence — get shorter. Cells that must keep dividing use telomerase, a reverse transcriptase carrying its own RNA template, to extend them; most somatic cells do not, and telomere shortening is one of the counters associated with cellular ageing.”'},

{q:'Why does an antibiotic like ciprofloxacin kill bacteria?', odd:1,
 mean:'问的是 <b>gyrase</b>。书只提了超螺旋（p076），没有酶名。',
 say:'“Generally — the enzyme is not in the textbook. Ahead of a replication fork the unopened helix gets overwound, and in E. coli DNA gyrase, a topoisomerase, cuts and reseals both strands to relieve that supercoiling. Ciprofloxacin traps gyrase on the DNA with the strands cut, so replication stalls and the chromosome breaks; human topoisomerases are different enough that the drug is selective. The textbook mentions supercoiling of circular DNA on p076, not the enzyme.”'},

{q:'What does proofreading mean for the mutation rate?', odd:1,
 mean:'他要数字。<b>书里没有</b>——按 LOGIC §11：先说判据，再给 general 数，标明出处。',
 say:'“The textbook gives no numbers. Generally: base pairing alone gives roughly one error in ten thousand to a hundred thousand; proofreading by the 3′→5′ exonuclease takes it down by two to three orders of magnitude; and mismatch repair after replication brings the final rate to about one in a billion to ten billion per base per generation in E. coli. The mutation rate is what survives all three, and the point of proofreading is that it acts while the mispair is still at the 3′ end.”',
 tail:'⚠ 三个数全是通用值（Lehninger 量级），不是书的。核之前不要说得比这更精确。'},

{q:'Why is the lagging strand called lagging?', odd:1,
 mean:'问的是<b>方向 ＋ 等待</b>。',
 say:'“Because it lags behind the fork. Its template runs so that 5′→3′ synthesis points away from the fork, so the polymerase cannot follow the helicase — it has to wait until a stretch of template is exposed, make a fragment backwards, then wait again. The leading strand keeps pace with the fork; the lagging strand is always a fragment behind.”'}
],

ask:[
{g:'定义类', gn:'演员表里的每个词都可能被单独拎出来。每条先说它是什么。', items:[
{r:'中', q:'What is proofreading?',
 en:'“Proofreading is the removal of a wrongly paired nucleotide from the 3′ end of the growing chain by the polymerase’s own 3′→5′ exonuclease, before the chain is extended further. The textbook calls it the second corrector of base-pairing errors — the first is the specificity of base pairing itself. Polymerases I and III have it; Taq polymerase, in the laboratory, does not.”',
 cn:'核心词正面定义。书的词是「第二个纠错者」。'},
{r:'高', q:'What is a template?',
 en:'“A template is the existing strand of DNA whose base sequence dictates, by base pairing, the sequence of the strand being made on it — the textbook’s word is matrix. The new strand is complementary to it, not identical.”',
 cn:'p076。<b>互补不等于相同</b>，卡 03 第 07 点。'},
{r:'高', q:'What is a DNA polymerase?',
 en:'“A DNA-dependent DNA polymerase is the enzyme that replicates DNA by adding deoxyribonucleotides one at a time to the free 3′-OH of a chain paired with a template, choosing each by complementarity to the template base and releasing pyrophosphate — always 5′→3′. The textbook says these enzymes are fully responsible for preserving the genetic information in the new molecule.”',
 cn:'p076、p078。<b>DNA-dependent</b> 值得说：p085 还有 RNA-dependent 的 DNA polymerase（逆转录酶）。'},
{r:'高', q:'What is an exonuclease — and an endonuclease, and a nick?',
 en:'“An exonuclease hydrolyses nucleotides off from an end of a chain, one at a time — 3′→5′ from the 3′ end, 5′→3′ from the 5′ end. An endonuclease cuts inside a chain. A nick is a break in one strand of a duplex — one missing phosphodiester bond. The textbook notes that polymerase I’s 5′→3′ activity is different in kind: it starts at a nick, cuts within a double-stranded region and takes off up to ten nucleotides — endonucleolytic in effect.”',
 cn:'p078–p079。也是限制性内切酶的定义入口——她的主场。'},
{r:'中', q:'What is a helicase — and SSB?',
 en:'“A helicase separates the two strands of a double helix, breaking the hydrogen bonds between the bases at the cost of ATP and moving along one strand — in E. coli the DnaB protein, on the lagging-strand template. Single-strand-binding protein, SSB, then coats the separated strands and prevents them pairing back before they are copied; it binds, it does not cut or join.”',
 cn:'p080、p085。OCR 印成 SBB。'},
{r:'中', q:'What is primase?',
 en:'“Primase is a small RNA polymerase that makes the RNA primer — a short chain started from nothing on the template, which DNA polymerase then extends. In E. coli the textbook says the transcribing RNA polymerase and the much smaller primase are both thought to take part, and on the lagging strand primase works within the primosome — the sub-assembly that also carries the helicase. Holoenzyme, for polymerase III, means the complete multi-subunit complex.”',
 cn:'p083–p085。holoenzyme 在卡 18 是「酶 ＋ 辅因子」，这里是多亚基完整复合物，同一个词两种用法。'},
{r:'高', q:'What is DNA ligase?',
 en:'“DNA ligase seals a nick: it forms the phosphodiester bond between a 3′-OH and a 5′-phosphate that lie next to each other in one strand of a duplex. It is endergonic and is paid for by NAD⁺ in E. coli or ATP in eukaryotes, through an AMP intermediate on a lysine. It cannot join two single strands.”',
 cn:'p081–p082，Obr. 4.20。'},
{r:'中', q:'What is a topoisomerase — gyrase?',
 en:'“Generally — not in the textbook: a topoisomerase changes the topology of DNA by cutting one strand, or both, letting the helix rotate, and resealing it. Gyrase is the E. coli topoisomerase that introduces negative supercoils, relieving the overwinding a moving fork creates ahead of itself. The textbook mentions supercoiling of circular DNA but names no enzyme.”',
 cn:'topoisomer / gyras 0 命中；超螺旋只在 p076。<b>先说不在书里。</b>'},
{r:'中', q:'What is the origin of replication?',
 en:'“The origin is the specific site where replication begins — the textbook says replication is bound to a particular place and that the E. coli chromosome replicates from a single origin, bidirectionally. Generally the word is origin, and a plasmid carries one of its own, which is why it replicates independently of the chromosome.”',
 cn:'p082、p085。「origin」这个词书没用。plasmid 那半句接大本营卡 `x_plasmid`。'},
{r:'中', q:'What is the replication fork?',
 en:'“The place in the molecule where the double helix is being unwound and, at the same moment, both exposed strands are being copied. Only part of the helix is open at any time; a bubble has a fork at each end, and in E. coli the two forks move away from a single origin in opposite directions.”',
 cn:'p082 原话。'},
{r:'中', q:'What is processivity?',
 en:'“Generally — not in the textbook: processivity is how many nucleotides a polymerase adds before it lets go of the template. Polymerase III is highly processive because a sliding clamp holds it on the DNA; polymerase I is not, which suits short gap-filling. Taq is moderately processive — one reason PCR extension time is set by product length.”',
 cn:'通用。sliding clamp 只在 Obr. 4.25 的图注里出现。'},
{r:'中', q:'What is the Klenow fragment?',
 en:'“The large piece of polymerase I left when a protease cuts off the small fragment: molecular weight 67 000, carrying the polymerase and the 3′→5′ exonuclease but not the 5′→3′ nuclease, which stays on the small fragment of 36 000. It is the classic laboratory polymerase for filling in ends.”',
 cn:'p079–p080。最后半句是实验室用法。'}
]},

{g:'为什么类', gn:'卡上给了结论没给理由的地方。书没有理由的先划清出处。', items:[
{r:'高', q:'Why can a polymerase only extend a 3′-OH?',
 en:'“The textbook states the rule and gives the chemistry but not the reason. Generally: the energy for each new bond sits on the incoming nucleotide, in its triphosphate. If chains grew the other way, the activated triphosphate would sit on the growing chain’s 5′ end, and every proofreading step that removed a wrong nucleotide would also remove the activation and end the chain. Growing on the 3′-OH means the energy always comes with the next monomer.”',
 cn:'Lehninger 的论证。why 梯子第三级。'},
{r:'高', q:'Why is the primer RNA rather than DNA?',
 en:'“The direct reason in the textbook is that DNA polymerases cannot start a chain and RNA-polymerase-type enzymes can. The deeper reason is general knowledge: primer synthesis has no proofreading, so those first nucleotides are the least accurate in the strand; making them of RNA labels them as temporary, and polymerase I removes and replaces them with proofread DNA.”',
 cn:'p078、p083 ＋ 通用。'},
{r:'高', q:'Why is pyrophosphate hydrolysed — why two steps?',
 en:'“Because the bond-forming step on its own is close to reversible — one phosphoanhydride bond spent, one phosphodiester made. Hydrolysing the released pyrophosphate to two phosphates with pyrophosphatase spends a second high-energy bond and pulls the equilibrium far to the product side — the textbook says the reaction is driven by the release and subsequent hydrolysis of the diphosphate. The same trick appears in the ligase reaction and in aminoacyl-tRNA formation.”',
 cn:'p078。「近可逆」是通用推论，书只说「poháněna」。落在<b>热力学</b>。'},
{r:'中', q:'Why does polymerase I need magnesium?',
 en:'“The textbook only says magnesium ions are essential. Generally the metal does two things: it holds the triphosphate of the incoming dNTP by coordinating its negatively charged oxygens, and it makes the 3′-OH a better nucleophile — two magnesium ions in the active site. That also matters in the laboratory: PCR fidelity depends on the magnesium concentration, and manganese in its place makes Taq error-prone.”',
 cn:'p078 ＋ 通用（two-metal-ion mechanism）。最后半句是实验室——错配 PCR 的配方。'},
{r:'中', q:'Why two polymerases — why not let polymerase III do everything?',
 en:'“Division of labour by activity. Polymerase III is the fast, processive replicase and lacks the 5′→3′ nuclease, so it cannot remove a primer. Polymerase I has that nuclease and low processivity — the right tool for excising a primer and filling a short gap. The textbook puts it as: polymerase III synthesises most of the new DNA, polymerase I removes the primers and fills the gaps.”',
 cn:'p080。'},
{r:'高', q:'How accurate is it — give me a number.',
 en:'“The textbook gives no number; it gives the two correctors — pairing specificity and the 3′→5′ exonuclease. Generally the figures are: pairing alone about one error in ten to a hundred thousand, proofreading improving that by two to three orders of magnitude, and post-replication mismatch repair bringing E. coli to about one in a billion to ten billion per base per generation.”',
 cn:'LOGIC §11：先说书没给数，再给 general 值并标出处。三个数是 Lehninger 量级，⚠ 待核。'}
]},

{g:'怎么发现的', gn:'⚠ 书里几乎没有，人名年份全是 general。年表 p009 只有 1953 Watson–Crick 和 1983–5 PCR。', items:[
{r:'中', q:'How do we know it is semiconservative?',
 en:'“The textbook’s evidence is the electron micrograph of a replication eye whose single-stranded regions fit the semiconservative model. The classic proof is general knowledge: Meselson and Stahl, 1958 — E. coli grown on heavy nitrogen, shifted to light; after one generation all DNA was of intermediate density, after two, half intermediate and half light — exactly one old strand per helix.”',
 cn:'p078 ＋ 通用。<b>先给书的，再给通用的。</b>'},
{r:'中', q:'Who found DNA polymerase?',
 en:'“Generally, Arthur Kornberg, 1956 — polymerase I from E. coli, the first enzyme shown to make DNA on a template, which is why the textbook still describes polymerase I first and in most detail. The Kornberg in the textbook’s timeline is his son Roger, for the structure of RNA polymerase in 2001.”',
 cn:'p009 年表只有 2001 Roger Kornberg。<b>父子两人别混。</b>'},
{r:'中', q:'How were Okazaki fragments found?',
 en:'“Generally — the textbook uses the name but not the story: Reiji Okazaki, late 1960s, pulse-labelled replicating E. coli DNA for a few seconds and found the label first in short pieces, which were joined into long strands only after a chase — the direct evidence that one strand is made discontinuously.”',
 cn:'通用。'},
{r:'中', q:'How was replication seen directly?',
 en:'“By autoradiography — the textbook says DNA can be visualised during replication by incorporating tritiated thymidine — or by electron microscopy. Cairns’s autoradiogram of the E. coli chromosome gave the theta structure, and the electron micrograph of Drosophila DNA gave the replication eyes.”',
 cn:'p078、p082。这两条是<b>书里有的</b>方法证据，比人名安全。'}
]},

{g:'陷阱', gn:'五句最容易说错的话，加书自己的一处松动。', items:[
{r:'高', q:'“DNA polymerase starts the new chain.”',
 en:'“No. A DNA polymerase can only extend — it needs a stretch already paired with the template and carrying a free 3′-OH. The chain is started by primase as a short RNA primer.”',
 cn:'p078。'},
{r:'高', q:'“Both strands are made continuously.”',
 en:'“No. Only the leading strand is; the lagging strand is made in Okazaki fragments, because on that template 5′→3′ points away from the fork. The textbook’s word is semidiscontinuous.”',
 cn:'p082。'},
{r:'高', q:'“The lagging strand is made 3′→5′.”',
 en:'“No. Every DNA polymerase makes DNA 5′→3′ — the lagging strand too. What differs is the direction relative to the fork: its fragments are made away from the fork, so the strand as a whole is completed backwards, but every fragment grows 5′→3′.”',
 cn:'p082–p083。<b>最常见的说错。</b>'},
{r:'高', q:'“DNA polymerase unwinds the DNA.”',
 en:'“No. Unwinding is the helicase’s job, with ATP, and SSB keeps the strands apart. The textbook does add that polymerase I plays some role in unwinding — that refers to its displacing a strand ahead of a nick during nick translation, not to opening the helix at the fork, which the textbook assigns to DnaB.”',
 cn:'p080 两处：解链是 helicase 的（原文），末尾又说 pol I「在解链上也有一定作用」。<b>用书的前一句打后一句</b>，再用 Obr. 4.18 的缺口平移解释后一句。'},
{r:'高', q:'“Ligase joins the nucleotides during synthesis.”',
 en:'“No. Every phosphodiester bond in a growing chain is made by the polymerase as each dNTP is added. Ligase makes one bond — the one that closes a nick between two finished pieces, a 3′-OH against a 5′-phosphate — and needs NAD⁺ or ATP to do it.”',
 cn:'p078 vs p081。'},
{r:'中', q:'“Replication and transcription are the same reaction with a different product.”',
 en:'“The chemistry of adding a nucleotide is the same — the textbook says RNA polymerase catalyses a reaction analogous to DNA polymerase’s. Everything around it differs: transcription copies one strand of one gene into RNA, needs no primer, has its own start and stop signals, and leaves the DNA unchanged; replication copies both strands of the whole molecule into DNA, needs primers and ligase, and happens once per division.”',
 cn:'p088–p089。「不需要 primer」是 p088 原话。'}
]},

{g:'相邻考点', gn:'这题坐在书投入最大的一片里（p066–p091），四面都有门。', items:[
{r:'高', q:'→ 卡 03 · DNA 的结构',
 en:'“Antiparallel, complementary, base-paired — those three properties of the double helix are the whole reason replication looks the way it does.”',
 cn:'反平行 → 半不连续；互补 → 模板；配对特异性 → 准确性（p073）。全在卡 03。'},
{r:'高', q:'→ 转录 p088–p091',
 en:'“Transcription is the neighbour: DNA-dependent RNA polymerase copies the coding strand of a gene into RNA, needs no primer, binds a promoter through its sigma factor, and in eukaryotes there are three — I for ribosomal RNA precursors, II for messenger precursors, III mostly for transfer and 5S RNA.”',
 cn:'p088–p089。σ 因子 OCR 成了「faktor a」；promotor 与 lac operator 重叠接 #12。'},
{r:'中', q:'→ 修复',
 en:'“The textbook’s one repair example is on this card: polymerase I’s 5′→3′ nuclease excises UV-induced pyrimidine dimers, its polymerase fills the gap, ligase seals it. Generally, the third corrector after pairing and proofreading is mismatch repair, which reads the newly made strand after the fork has passed.”',
 cn:'p079。mismatch repair 是通用；书里没有「reparace」这个词。'},
{r:'中', q:'→ 中心法则 p085',
 en:'“Replication is the first arrow of the central dogma — DNA directs its own replication and its transcription into RNA, which directs its translation into protein. The textbook attributes the scheme to Crick and dates it 1953; generally 1953 is the double helix and the central dogma is Crick’s 1958 lecture. Reverse transcriptase — RNA-directed DNA polymerase in some RNA viruses — is the special arrow the book adds.”',
 cn:'p085。<b>书的 1953 和通用的 1958 不一致</b>——说出来，不改书。'}
]},

{g:'桥回主场', gn:'题 #5/#10 的整套答案从这里走。全部实验室出处。', items:[
{r:'中', q:'How does PCR work?',
 en:'“PCR is replication reduced to one enzyme and heat. Three temperatures, cycled: near 95 degrees the double helix melts — heat does what helicase does in the cell; at fifty-something degrees two synthetic DNA primers anneal, one to each strand, bracketing the piece I want — they replace primase and they stay in the product; at 72 degrees a thermostable polymerase — Taq, or KAPA HiFi if I need fidelity — extends each primer from its 3′-OH, 5′→3′, exactly the textbook’s reaction. Each cycle doubles the region between the primers. No SSB, no ligase, no origin — the primers define where copying starts. The textbook’s timeline dates the discovery of PCR to 1983–85.”',
 cn:'<b>便装题，但答案就在这张卡上</b>：它就是复制去掉细胞的部分。实验室出处。'},
{r:'实测', q:'Describe the activities of Taq and Kapa polymerases and why that matters for you.',
 en:'“In the textbook’s vocabulary. Taq — from Thermus aquaticus, so thermostable, surviving the melting steps of PCR — has the 5′→3′ polymerase and a 5′→3′ exonuclease, like polymerase I, but no 3′→5′ exonuclease: it cannot proofread, so its error rate is high, and it leaves a single untemplated adenine on the 3′ end. KAPA HiFi is an engineered polymerase that does have the 3′→5′ proofreading exonuclease — in activity it resembles the textbook’s polymerase II, polymerase plus proofreading without the 5′→3′ nuclease — so its error rate is far lower and its products are blunt-ended. For us the choice is deliberate: Taq under mutagenic conditions to build a diverse library; KAPA HiFi whenever the sequence must stay what it is — amplifying a library, preparing a sequencing sample, cloning.”',
 cn:'实验室。⚠ 待核：Taq 约 10⁻⁴–10⁻⁵ 错误/碱基/倍增；KAPA HiFi 比 Taq 低约两个数量级；Taq 属 A 家族（与 pol I 同源）、KAPA HiFi 属 B 家族（与 pol II 同源）。核之前只说 “far lower”，家族不主动说。'},
{r:'高', q:'How do you design a primer?',
 en:'“With the same rule as the cell’s primer: the polymerase only extends a matched 3′-OH. So the 3′ end of my primer must pair exactly with the template — a mismatch there and there is no extension, which is what allele-specific PCR exploits — while the 5′ end is free: I can add a restriction site, an overlap for assembly, or a barcode there, because the polymerase never looks at the 5′ end. Length and GC content set the annealing temperature.”',
 cn:'实验室。<b>这一条把书的 p078 规则直接变成了她的日常操作。</b>'},
{r:'高', q:'How do you make a library by error-prone PCR?',
 en:'“I take away the accuracy the cell builds in. Taq already lacks proofreading; then I raise the error rate further — manganese in place of some of the magnesium, unbalanced dNTP concentrations, more cycles — so every product carries a few random substitutions. That gives the diversity a directed-evolution library needs, and the number of mutations per gene is tuned by how hard I push those conditions. Afterwards the library is amplified with KAPA HiFi so that selection reads the variants I made, not new errors.”',
 cn:'实验室。Mn²⁺ 那条接「为什么需要 Mg²⁺」。'},
{r:'中', q:'Why does fidelity matter for a sequencing library?',
 en:'“Because a sequencing read cannot tell a real variant from a polymerase error made during amplification. If I amplify a library with Taq, some reads carry substitutions that were never in the cell and look like enrichment signal. A proofreading polymerase keeps that background low enough that what I see is what selection did.”',
 cn:'实验室。'},
{r:'中', q:'Why does a plasmid replicate on its own?',
 en:'“Because it carries its own origin of replication, so the host’s machinery — the same polymerase III, primase and ligase — copies it independently of the chromosome; nobody designed that, bacteria already had it. Copy number is set by how that origin is controlled.”',
 cn:'大本营卡 `x_plasmid`。plasmid 全书 0 命中。'}
]}
]
});
