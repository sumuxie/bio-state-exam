/* ---------------- 同一个答案，不同问法 ---------------- */
recog:[
{q:'The amino acids?',
 mean:'他会说 “Name the amino acids.” 或 “Which amino acids do you know?”。<b>他嘴里最短的那句。</b>答案要自带结构：多少个 → 按什么分 → 每组几个 → 名字。别从 alanine 开始背二十个。',
 say:'“Twenty proteinogenic ones — the ones with a codon. The textbook groups them by the side chain. Nonpolar, eight: alanine, valine, leucine, isoleucine, proline, phenylalanine, tryptophan, methionine. Polar uncharged, six: serine, threonine, tyrosine, asparagine, glutamine, cysteine. Negatively charged, two: aspartate and glutamate. Positively charged, three: lysine, arginine, histidine. And glycine, which does not fit any group — its side chain is just a hydrogen.”'},

{q:'What does “proteinogenic” mean?',
 mean:'卷面上的第一个限定词。<b>两个条件</b>，缺一不可。',
 say:'“Built into proteins <b>and</b> coded for by the genetic code — twenty amino acids. Hydroxyproline is in collagen but is not proteinogenic, because it is made by modifying a proline already in the chain and has no codon. Ornithine is an amino acid but is never in a protein at all.”'},

{q:'And one characteristic property of each?',
 mean:'卷面第二个限定词。他真正要的是<b>「它的基团是什么 → 所以它干什么」</b>，不是二十个形容词。',
 say:'“For each one I will name the group on the side chain and then what that group does — for example cysteine: a thiol, so it oxidises to a disulfide and cross-links the chain; histidine: an imidazole, weakly basic, so it shuttles protons in active sites.”',
 tail:'然后照速背第 05 点那张表说。他挑到哪个说哪一句。'},

{q:'What is an amino acid?',
 mean:'核心词正面定义。<b>别从「蛋白质的单位」起步</b>——那是用途，不是它是什么。',
 say:'“An organic compound that carries both a carboxyl group and an amino group. In the twenty that build proteins the amino group is on the α-carbon, the carbon next to the carboxyl, which also carries a hydrogen and a side chain — the side chain is all that distinguishes them.”'},

{q:'How are amino acids classified?',
 mean:'问的是<b>依据</b>，不是名单。',
 say:'“By the nature of the side chain, because the backbone is the same for all. The textbook uses four groups — nonpolar, polar uncharged, negatively charged, positively charged — with glycine left outside because a single hydrogen is neither. Lehninger uses the same idea with tyrosine among the aromatic ones and glycine among the aliphatic ones; the twenty do not change, only the drawers.”'},

{q:'What is a zwitterion?',
 mean:'正面定义，一句。',
 say:'“A molecule that carries a positive and a negative charge at the same time and so has no net charge — for an amino acid, the ammonium group positive and the carboxylate negative. It is the form an amino acid takes between its two pKa values, which includes neutral pH. The textbook calls it the dipolar form; zwitterion is the general word.”'},

{q:'What is the isoelectric point?',
 mean:'正面定义 ＋ 怎么算 ＋ 为什么要紧。',
 say:'“The pH at which the molecule carries no net charge and does not move in an electric field. For an amino acid with two ionisable groups it is the average of the two pKa values — the midpoint of the titration curve. Side chains add further ionisable groups, so each amino acid has its own pI, and that is what ion-exchange chromatography and electrophoresis separate them by. For a protein the textbook adds that solubility is lowest at the pI, because without charge there is no repulsion between molecules.”'},

{q:'Are all amino acids chiral?',
 mean:'<b>陷阱。</b>答「是」就错了。',
 say:'“All except glycine. Chirality needs four different groups on the α-carbon, and glycine has two hydrogens there, so it has no asymmetric carbon and no L or D form. The other nineteen are L in proteins; threonine and isoleucine even have two asymmetric carbons.”'},

{q:'Why can you measure protein concentration at 280 nanometres?', odd:1,
 mean:'问的是<b>芳香氨基酸的紫外吸收</b>——听起来像方法题，答案在 p024。',
 say:'“Because tyrosine and tryptophan absorb ultraviolet light at 280 nm — their aromatic rings, the phenol and the indole — and none of the twenty absorbs visible light. Since nearly every protein contains some of both, the absorbance at 280 nm is a quick and convenient measure of protein content. It is only approximate, because proteins differ in how many of those residues they carry.”'},

{q:'Why is hair curly — how does a perm work?', odd:1,
 mean:'<b>问的是 cysteine 和二硫键。</b>入口完全不像生化题。',
 say:'“Hair is keratin, and its shape is held by disulfide bonds between cysteine residues of neighbouring chains — cystine cross-links. A perm reduces those bonds with a reducing agent, so the chains can slide while the hair is wound on a curler, then re-oxidises them in the new position. The textbook gives exactly that chemistry: the disulfide is reduced to two cysteines by reducing agents and re-formed by oxidation.”'},

{q:'Why do we have to eat protein?', odd:1,
 mean:'<b>问的是必需氨基酸。</b>书没有列表，只有 phenylalanine 那一句。',
 say:'“Because some of the twenty we cannot make. The textbook’s example is phenylalanine: it is essential, while tyrosine is not — because the cell makes tyrosine from phenylalanine with phenylalanine hydroxylase. The full list for humans is general knowledge, nine: histidine, isoleucine, leucine, lysine, methionine, phenylalanine, threonine, tryptophan, valine. Plants make all of them; the textbook notes the biosynthesis of essential amino acids as one of the things plant metabolism does that ours does not.”',
 tail:'p127 是书里唯一一句；p216 提到植物合成必需氨基酸。<b>九个名单是 general，说的时候标明。</b>'},

{q:'Why does MSG taste of anything?', odd:1,
 mean:'问的是 glutamate。前半是书外常识，后半在书里。',
 say:'“MSG is monosodium glutamate, the sodium salt of glutamic acid, and the taste is the glutamate ion itself — the tongue has a receptor for it; that part is general knowledge. What the textbook does say is why glutamate is in every protein-rich food: it is the hub of nitrogen metabolism, the amino acid the transaminases and glutamate dehydrogenase all run through.”'},

{q:'What is actually in a protein shake?', odd:1,
 mean:'问的是<b>消化成氨基酸、支链氨基酸、必需氨基酸</b>。',
 say:'“A protein — usually whey, from milk — which digestion hydrolyses back to the twenty amino acids; the marketing name BCAA means the three branched-chain ones, valine, leucine and isoleucine. What the body actually needs from it is the essential ones, the nine it cannot make. Leucine is the one the textbook singles out as purely ketogenic.”'},

{q:'Why is collagen full of glycine?', odd:1,
 mean:'<b>卡 01 的实测追问</b>，从这题也能进来。',
 say:'“Because in the collagen helix every third side chain points into the axis, where three chains wind round each other, and the only residue that fits there is the one whose side chain is a single hydrogen — glycine, nearly thirty percent of the protein. Proline and hydroxyproline make up another thirty.”'},

{q:'Why does a His-tag bind nickel?', odd:1,
 mean:'<b>PESB 实测失分点。</b>答案是 imidazole 配位，不是 lysine，不是芳香环。',
 say:'“Because the imidazole ring of histidine has a ring nitrogen with a lone pair that donates into the immobilised nickel ion — a coordination bond. Six histidines in a row give several such ligands at once. The textbook lists exactly imidazole, carboxyl and sulfhydryl as the groups that complex metals, and imidazole competes it off again at elution.”'},

{q:'What is the difference between cysteine and cystine?',
 mean:'<b>陷阱：一个字母。</b>',
 say:'“Cysteine is the amino acid, with a free thiol. Cystine is two cysteines joined through their sulfurs by a disulfide bond — the oxidised dimer, and in a protein the cross-link between two parts of the chain. Reduce cystine and you get two cysteines back.”'},

{q:'Is tyrosine polar or nonpolar?',
 mean:'<b>陷阱：两者都是。</b>书放极性组。',
 say:'“Both, and it depends which part you look at: the ring is aromatic and nonpolar, the hydroxyl on it makes it a phenol and polar. The textbook files it among the polar amino acids, with the hydroxyl group; Lehninger files it with the aromatic ones. Its phenolic hydroxyl is also what tyrosine kinases phosphorylate.”'},

{q:'What is an imino acid?',
 mean:'proline 的另一个名字。',
 say:'“An amino acid whose α-nitrogen is a secondary amine — bonded to two carbons instead of one — because the side chain closes back onto it. Proline is the only proteinogenic one: the ring is a pyrrolidine, and there is no free α-amino group and no N–H once it is in a peptide.”'}
],

/* ---------------- 追问 ---------------- */
ask:[
{g:'定义类', gn:'他默认你知道名词，所以专挑名词问。这题名词密度极高——每个环、每个基团都可能被单独拎出来。', items:[
{r:'中', q:'What is pKa?',
 en:'“The pH at which a given acidic group is exactly half protonated and half deprotonated — numerically the negative logarithm of its acid dissociation constant. Below its pKa the group is mostly protonated, above it mostly not. On the glycine titration curve the two pKa values are the two inflection points — one for the carboxyl, one for the amino group.”',
 cn:'她自报的弱点。<b>先说它是什么，再说怎么用。</b><br>书 p023 直接用 pK 这个词没解释；「半质子化时的 pH」是通用定义。<b>数字待核</b>：通用 ≈ 2.3 和 9.6。'},
{r:'实测', q:'What is that ring called?',
 en:'“Proline’s is a <b>pyrrolidine</b> — a saturated five-membered ring with one nitrogen, and that nitrogen is the α-amino group itself. Histidine’s is an <b>imidazole</b> — an aromatic five-membered ring with two nitrogens, weakly basic. Tryptophan’s is an <b>indole</b>, a benzene fused to a pyrrole. Phenylalanine carries a <b>phenyl</b> ring, plain benzene; tyrosine a <b>phenol</b>, benzene with a hydroxyl. Arginine’s group is not a ring: a <b>guanidine</b>, a carbon carrying three nitrogens.”',
 cn:'PESB 那次说 histidine「上面的 ring」，老师不满意——<b>环要叫名字</b>。书 p021 只说 histidine 含弱碱性的咪唑基、Phe 和 Trp 带芳香环、arginine 含胍基、proline 没有自由氨基；名字本身是通用有机化学。'},
{r:'高', q:'What is the difference between the side chain and the backbone?',
 en:'“The <b>backbone</b> is what every residue shares — the nitrogen, the α-carbon and the carbonyl carbon, repeated along the chain and joined by peptide bonds. The <b>side chain</b> is the group R on the α-carbon, the only part that differs between the twenty. The textbook puts it as: the polypeptide has a regularly repeating part, the main chain, and a variable part made of the side chains.”',
 cn:'p026 §2.1.4 那句。<b>骨架的三个原子要点名</b>；「主链氢键」这个说法在卡 01 里靠它站住。<span class="pg">p026</span>'},
{r:'高', q:'What do hydrophobic and hydrophilic mean?',
 en:'“<b>Hydrophobic</b> groups have low affinity for water — hydrocarbons, the nonpolar side chains — and in water they tend to associate with each other and avoid being solvated, the way two drops of oil merge; the textbook says this is not an attraction between them but a change in the structure of the water around them. <b>Hydrophilic</b> groups are polar or charged and are solvated by water. In a globular protein the hydrophobic side chains end up inside, the hydrophilic ones on the surface.”',
 cn:'p012–p013 的定义；朝里朝外 p033。<b>说完第三句就停</b>——再往下是水的熵，卡 01 和横向卡 bonds 的地盘。<span class="pg">p012 p013 p033</span>'},
{r:'高', q:'What is an amide?',
 en:'“The group formed when a carboxylic acid condenses with an amine, losing water: –CO–NH–. Two places on this card. The side chains of asparagine and glutamine are amides of the side-chain carboxyl — –CONH₂ — which is why they are uncharged. And the peptide bond itself is an amide, between the carboxyl of one residue and the α-amino group of the next; the textbook writes it as the peptide, amide, bond.”',
 cn:'p026。横向卡 bonds 有整条肽键。<span class="pg">p026</span>'},
{r:'高', q:'Thiol, thioether, disulfide — what is the difference?',
 en:'“All three are sulfur groups, and two of the twenty carry one each. A <b>thiol</b> is –SH, sulfur with a hydrogen — cysteine; it is the reactive one, it can be oxidised. A <b>thioether</b> is sulfur between two carbons, –S–CH₃ in methionine; no hydrogen, so no disulfide from it. A <b>disulfide</b> is –S–S–, two thiols oxidised together — cystine. That is why cysteine, not methionine, cross-links proteins.”',
 cn:'书 p021 只说 methionine「含硫」、cysteine「–SH」；三个词的区分是通用有机化学。<b>「methionine 不能成二硫键」是最常被抓的一句。</b>'},
{r:'高', q:'What does “essential amino acid” mean?',
 en:'“One the organism cannot make in sufficient amount and must obtain from food. The textbook’s example is phenylalanine, essential because there is no pathway to it, while tyrosine is dispensable because phenylalanine hydroxylase makes it from phenylalanine. The list of nine for humans — histidine, isoleucine, leucine, lysine, methionine, phenylalanine, threonine, tryptophan, valine — is general knowledge; the textbook does not list them.”',
 cn:'p127 那一句是书里的全部；p216 只说植物能合成必需氨基酸。<b>九个的名单标 general。</b>',
 warn:'书里<b>没有</b>必需氨基酸的表。说名单时说 “in general references”。'},
{r:'中', q:'What does L mean — is it the same as laevorotatory?',
 en:'“No. L and D name the <b>configuration</b> — which way the four groups sit around the α-carbon, by comparison with L- or D-glyceraldehyde; the textbook derives L-serine from L-glyceraldehyde, amino group on the left in the Fischer projection. Laevorotatory and dextrorotatory, minus and plus, name which way the compound rotates polarised light, and that is measured, not derived — an L amino acid can rotate light either way.”',
 cn:'p024 只给了构型；「构型 ≠ 旋光方向」是通用知识。<b>这是有机化学口味的老师会问的一刀。</b>'},
{r:'中', q:'What is a guanidine group?',
 en:'“A carbon carrying three nitrogens — one double-bonded, two as –NH₂ or –NH–. The positive charge on the protonated form is spread over all three nitrogens by resonance, which is what makes it the most basic side chain, charged at any physiological pH. Arginine carries it at the end of its side chain, and arginase splits it off as urea.”',
 cn:'p021 说「胍基」；共振稳定和 pKa ≈ 12.5 是通用。<b>停止线：</b>再往下是共振结构，横向卡 bonds 里 mesomerism 那条。'}
]},

{g:'为什么类', gn:'卡上给了结论没给理由的地方，就是他会插刀的地方。', items:[
{r:'高', q:'Why can proline not be in an α-helix?',
 en:'“Two reasons. Its side chain closes onto its own α-nitrogen as a pyrrolidine ring, so once it is in a peptide that nitrogen has <b>no N–H left to donate</b> a hydrogen bond — and the helix is held by exactly those main-chain hydrogen bonds. And the ring locks one of the two rotatable backbone angles, so the chain cannot take the helical geometry. The textbook gives the fact — the α-helix takes every proteinogenic amino acid except proline — and the reasons are the standard explanation.”',
 cn:'p029 只给结果。两个理由是通用解释，说的时候不要说「书上写」。卡 01 有同一条。<span class="pg">p029</span>'},
{r:'高', q:'Why is histidine, and not lysine, the catalytic base in active sites?',
 en:'“Because catalysis needs a group that can <b>both take and give</b> a proton at the pH where the enzyme works, and that requires a pKa near that pH. The imidazole of histidine sits near neutral; lysine’s ε-amino and arginine’s guanidine are so basic that at cell pH they are essentially always protonated — good for ion pairs and for holding phosphates, useless as a base. The textbook lists imidazole among the groups doing acid–base catalysis for exactly this reason.”',
 cn:'p062 的清单；pKa 的比较是通用。这一条同时回答了「为什么 His-tag 用 histidine」——同一个环、三个角色（卡 18 有整句）。<span class="pg">p062</span>'},
{r:'高', q:'Why does cysteine cross-link proteins but the cytosol has almost no disulfides?',
 en:'“The cross-link needs the two thiols to be <b>oxidised</b>, and the cytosol is a reducing environment — it holds enough free thiol, largely reduced glutathione, that any disulfide that forms there is reduced back. Disulfides survive where the chain is oxidised on purpose: in the cisternae of the ER, with protein disulfide isomerase — so they are typical of secreted and surface proteins.”',
 cn:'p025 的氧化 ＋ p113 的 PDI 在 ER；「胞质还原」是卡 13 那句最值钱的话。<b>这是一个你想接的口子</b>——落到卡 13。<span class="pg">p025 p113</span>'},
{r:'高', q:'Why do only tyrosine and tryptophan absorb at 280 nm, and not phenylalanine?',
 en:'“All three absorb in the ultraviolet — the textbook says so — but the absorption depends on how extended the aromatic system is. Phenylalanine is a bare benzene, which absorbs weakly and further into the ultraviolet, around 260; the phenol of tyrosine and especially the two-ring indole of tryptophan absorb more strongly and nearer 280. So the 280 nm signal of a protein comes almost entirely from tryptophan and tyrosine.”',
 cn:'书 p024 说三个都吸紫外、测蛋白用 Tyr 和 Trp 的 280。「Phe 弱、在 260 附近」是通用光谱知识。<b>停止线：</b>为什么共轭越长吸收越靠红端——那是轨道，物理化学。<span class="pg">p024</span>'},
{r:'高', q:'Why is phenylalanine essential but tyrosine not?',
 en:'“Because there is a one-way pathway between them: phenylalanine hydroxylase puts a hydroxyl on the phenyl ring of phenylalanine and gives tyrosine. So as long as phenylalanine comes from food, tyrosine can be made — the textbook says exactly that this reaction explains the essential character of phenylalanine and the dispensability of tyrosine. When the hydroxylase is missing, tyrosine becomes essential and phenylalanine accumulates — that is phenylketonuria, which is general knowledge.”',
 cn:'p127 原句。<b>苯丙酮尿症书里没有</b>，标 general。<span class="pg">p127</span>'},
{r:'中', q:'Why does each amino acid have a different isoelectric point?',
 en:'“Because the pI is set by <b>all</b> the ionisable groups, and the side chains add different ones. With only the α-carboxyl and α-amino, all twenty would have nearly the same pI, near six. A second carboxyl in aspartate or glutamate pulls it down to around three; the extra basic group of lysine or arginine pushes it up towards ten. The textbook makes the point and draws the consequence — that this is what separates them by ion-exchange chromatography and electrophoresis.”',
 cn:'p024 原理；具体数字（≈ 3 / ≈ 10）是通用近似，说时标明。<span class="pg">p024</span>'},
{r:'中', q:'Why does the amino group sit on the α-carbon in all twenty?',
 en:'“Because that is what lets them polymerise into an unbranched chain with the same repeating unit: the carboxyl of one joins the α-amino of the next, so the backbone is always N, α-carbon, carbonyl carbon — three atoms per residue — and the side chains hang off it at regular intervals. β-Alanine, with the amino group one carbon further, exists in the cell — in coenzyme A — but it is not in proteins.”',
 cn:'书只陈述事实（p021）和骨架的重复性（p026）；「所以骨架才能规则重复」是推论。<span class="pg">p021 p026</span>'}
]},

{g:'怎么发现的', gn:'这位老师的口味。要像 researcher 答：他们当时手上只有什么，所以只能怎么推。', items:[
{r:'高', q:'How do you detect an amino acid?',
 en:'“With <b>ninhydrin</b>: heating an amino acid with ninhydrin gives an intensely coloured product — blue-violet for a free α-amino group, yellow for proline, whose amino group is substituted. The textbook calls it one of the most characteristic reactions of the α-amino group, and gives the mechanism as a figure. It is how spots are made visible after chromatography and how amino acids are quantified in an analyser.”',
 cn:'p024–p025，Obr. 2.2。「层析后显色、分析仪定量」是通用用途。<span class="pg">p024 p025</span>'},
{r:'高', q:'How was the first protein sequence read?',
 en:'“By labelling the free end. 1-Fluoro-2,4-dinitrobenzene reacts with a free α-amino group under mild conditions to give a yellow dinitrophenyl derivative, and in a peptide only the <b>N-terminal</b> residue has a free α-amino group — so after hydrolysis the labelled amino acid tells you which residue was first. That reagent is Sanger’s, and with it and partial hydrolysis into overlapping fragments he read insulin in 1953 — the first protein sequence, in the textbook’s own timeline.”',
 cn:'反应 p025；Sanger 1953 p009、p228。<b>「Sanger’s reagent」这个名字和「重叠片段」的策略是通用</b>，书只给反应和年份。Edman 降解书里没有。<span class="pg">p025 p009 p228</span>'},
{r:'中', q:'How do you separate amino acids from each other?',
 en:'“By charge. Each has its own isoelectric point, because the side chains carry different ionisable groups, so at a given pH they carry different net charges — the textbook names <b>ion-exchange chromatography</b> and <b>electrophoresis</b> as the methods that use this.”',

{r:'中', q:'How do we know there are exactly twenty?',

<script>
/* data/gly.js */
/* 卡 gly · Explain the process of glycolysis.
   题库 #2（S1 Biochemistry 2 ＋ S3 Biochemistry 11）· 导师写过两遍 · 她说学得好

        p131–p133（§6.1.1 偶联反应、§6.1.2 高能化合物、Tab. 6.1 ΔG 表），p135–p136（能量总账、2 vs 38），
        p139–p140（38 的拆分、40%），p146（3 ATP/NADH），p161–p163（§7.7 磷酸戊糖），
        p172（半乳糖三个酶），p174–p175（糖原磷酸解），p219（§10.1.1 三个关键点、2 NADH ＋ 2 ATP），
        p222（PFK 是控制酶），p043（Mn²⁺ 己糖激酶、K⁺ 丙酮酸激酶），p064–p065（LDH 同工酶），p009（Buchner 1897）。
   全书 grep：glykolýz 26 页 · hexokinas p042 p043 p131 p164 p165 · glukokinas p164 · fosfofruktokinas p164 p222 ·
        pyruvátkinas p043 p166 · aldolas p161–p165 p211 · bisfosfoglycer p132 p133 p135 p164–p166 ·
        fosfoenolpyruv p129 p132 p133 p166 p169 p212 p219 · laktát p135 p136 p164 p167–p170 p219 ·
        ethanol p164 p167 p168 · kvašení p009 p135 p136 p167 · substrátová fosforylace 只有 p165 ·
        enolas / mutas 只有 p166 · Embden / Meyerhof / Parnas 全书 0 命中 · Buchner p009。
   她说这题学得好，所以这张卡的价值在精确：每个酶名、书给的每个数、每个「为什么」、每个陷阱。 */

window.CARDS.push({
id:'gly', n:2, w:3,
q:'Explain the process of glycolysis.',
qcn:'解释糖酵解的过程',
sub:'主干说完约 90 秒 · 十步全在 · 她说学得好，所以这张卡只做精确：酶名、书的数字、为什么、陷阱',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'不要一上来就背十步。先说它是什么、在哪儿、净账是什么——这三句决定他往哪儿挖。'},
 {n:'01', t:'定义',
  big:'胞质里的一串酶反应，把 <b>1 个葡萄糖</b>变成 <b>2 个丙酮酸</b>，净赚 <b>2 ATP ＋ 2 NADH</b>；<b>不需要氧</b>；书说它<b>几乎是普适的</b>',
  en:'“Glycolysis is the process — the sequence of enzyme-catalysed reactions — in the cytosol — the soluble part of the cytoplasm outside the organelles — that converts one molecule of glucose into two molecules of pyruvate, the three-carbon 2-oxo acid CH₃–CO–COO⁻, with a net gain of two ATP and two NADH. The textbook’s own definition is one sentence: the sequence of reactions by which glucose is converted to pyruvate with simultaneous production of ATP. No step uses oxygen, and the textbook calls it an almost universal metabolic pathway — the same reactions run in nearly all organisms and all types of cell.”',
  note:'<b>先说它是什么（一串反应、在哪、从什么到什么、赚什么），再说别的。</b>书 p164 开篇原话：<i>sled reakcí, jimiž se přeměňuje glukosa na pyruvát za současné produkce ATP</i>；「几乎普适」<i>téměř univerzální</i> 也是 p164；p167 又说从葡萄糖到丙酮酸这段<b>在几乎所有生物、所有细胞里都很相似</b>，只有丙酮酸的去向不同。<br>「胞质」这个词承重——不懂它，「不需要氧」和「跟线粒体分开」两句都立不住，所以同一句里交代掉（通用定义，书 p164 只说 <i>v cytosolu</i>）。<span class="pg">p164 p167</span>'},
 {n:'02', t:'归类 · 地点',
  big:'<b>分解</b>代谢；糖分解的<b>共同主干</b>——糖原、半乳糖、果糖都从上面进来，丙酮酸是<b>分岔口</b>：有氧进线粒体，缺氧变乳酸，酵母变乙醇',
  en:'“It is a catabolic pathway — a breakdown route that takes a nutrient apart and releases energy — and it is the common trunk of carbohydrate catabolism: glycogen, galactose and fructose all feed into it, and what comes out, pyruvate, is the branch point. In aerobic organisms glycolysis precedes the citric acid cycle and the respiratory chain, where most of the energy of glucose is obtained — pyruvate enters the mitochondrion and is oxidised to CO₂ and water. When oxygen is short, as in an actively working muscle, pyruvate is temporarily converted to lactate; in anaerobic organisms such as yeast it is converted to ethanol. Every step of glycolysis itself stays in the cytosol.”',
  note:'书 p164 第一段就把三个去向排好了：有氧 → 柠檬酸循环和呼吸链（<b>葡萄糖大部分能量在那里取得</b>）；缺氧的肌肉 → 乳酸（<i>dočasně</i>，暂时地）；酵母 → 乙醇。<b>「暂时地」这个副词值得记</b>——它是 p170 乳酸回肝脏再造糖的伏笔。「共同主干」是我的归纳，依据是 p164（糖原进来）、p172（半乳糖进来）、p219（糖代谢第一步是造磷酸化的单糖）。<span class="pg">p164 p172 p219</span>'},

 {g:'账', gn:'投入、产出、总结三行。只说「产 2 ATP」是半张账——他一句「那消耗了什么」「4 个还是 2 个」就能把你问停。'},
 {n:'03', t:'投入',
  big:'1 <b>glucose</b> · 2 <b>ATP</b>（投资，两次己糖磷酸化）· 2 <b>NAD⁺</b> · 2 <b>Pᵢ</b> · 4 ADP',
  en:'“Per glucose it consumes one glucose, two ATP — invested at the two hexose phosphorylations, hexokinase and phosphofructokinase — two NAD-plus, and two inorganic phosphates, which are taken up at glyceraldehyde-3-phosphate dehydrogenase.”',
  note:'<b>两个无机磷酸常被忘掉</b>，而它们正是净赚的那两个 ATP 的磷酸来源（见点 15）。书 p164 的反应式里写了 Pᵢ：glyceraldehyde-3-phosphate + NAD⁺ + Pᵢ ⇌ 1,3-bisphosphoglycerate + NADH + H⁺。<span class="pg">p164</span>'},
 {n:'04', t:'产出',
  big:'2 <b>pyruvate</b> · <b>4 ATP</b>（PGK 2 ＋ PK 2）· 2 <b>NADH</b> · 2 H₂O（enolase 脱的）',
  en:'“It produces two pyruvate, four ATP — two at phosphoglycerate kinase and two at pyruvate kinase — two NADH, and two molecules of water, from the two dehydrations at enolase.”',
  note:'书 p166 的表：glucose → glucose-6-phosphate <b>−1</b>；fructose-6-phosphate → fructose-1,6-bisphosphate <b>−1</b>；2× 1,3-bisphosphoglycerate → 2× 3-phosphoglycerate <b>+2</b>；2× phosphoenolpyruvate → 2× pyruvate <b>+2</b>；<i>zisk</i> <b>+2</b>。<b>这张表就是「4 还是 2」那道陷阱题的答案。</b>两个水是 enolase 那步脱的（p166 <i>odštěpí voda</i>），书没写总反应式，总式里的 2 H₂O 是通用写法。<span class="pg">p166</span>'},
 {n:'05', t:'总结（净账）',
  big:'<b>净 +2 ATP、+2 NADH</b>；葡萄糖<b>没有被氧化成 CO₂</b>——六个碳全在两个丙酮酸里；唯一的氧化是每个三碳糖的<b>醛 → 羧酸</b>，NADH 就从那里来',
  en:'“So the net result is: glucose plus two ADP, two phosphate and two NAD-plus give two pyruvate, two ATP, two NADH and two water. Four ATP are made but two were invested, so the gain is two — the textbook writes it as a table, minus one, minus one, plus two, plus two, gain plus two; and in chapter 10 it says it in one line: one mole of glucose to two moles of pyruvate gives two moles of NADH and two moles of ATP. And glucose is not oxidised to CO₂ — all six carbons are still there in the two pyruvates. The only oxidation is one aldehyde to a carboxylate in each triose, and that is where the two NADH come from.”',
  tbl:{head:['','按书写'],
   rows:[
    ['<b>投入</b>','1 glucose · 2 ATP · 2 NAD⁺ · 2 Pᵢ'],
    ['<b>产出</b>','2 pyruvate · 4 ATP · 2 NADH ＋ 2 H⁺ · 2 H₂O'],
    ['<b>净账</b>','glucose ＋ 2 ADP ＋ 2 Pᵢ ＋ 2 NAD⁺ → 2 pyruvate ＋ <b>2 ATP</b> ＋ <b>2 NADH</b> ＋ 2 H⁺ ＋ 2 H₂O']
   ]},
  note:'<b>这一行是这题最常被问、也最容易答错的地方。</b>三个陷阱都在这里：① 4 和 2；② NADH 是还原力不是 ATP，有氧时才能兑成 ATP；③ 「氧化」只发生了一次，碳没有变成 CO₂。书 p219 原话：<i>Odbouráním jednoho molu glukosy na dva moly pyruvátu tak vzniknou 2 mol NADH a 2 moly ATP</i>。<span class="pg">p166 p219</span>'},

 {g:'十步 · 投入相（1–5）', gn:'书把十个酶全点了名，但没数「十」也没分「两相」——十步、投入/收获两相是通用的框架。每步只记「谁变成谁 ＋ 酶 ＋ 可逆不可逆」。'},
 {n:'06', t:'第 1 步 · hexokinase / glucokinase',
  big:'<b>glucose → glucose-6-phosphate</b>，ATP 供磷酸，磷酸化在 <b>C-6</b>；<b>不可逆</b>（偶联后 ΔG°′ = −16.7）；肝里主要是 <b>glucokinase</b>',
  en:'“Glucose is phosphorylated at carbon 6, with ATP as the phosphate donor, giving glucose-6-phosphate. The textbook names two enzymes: hexokinase, which phosphorylates many hexoses at C-6, and glucokinase, which is specific for glucose and is the more important enzyme in the liver. The coupled reaction is exergonic — the textbook gives plus 13.8 kJ per mole for glucose plus phosphate, minus 30.5 for ATP hydrolysis, minus 16.7 for the sum — so it is practically irreversible; the textbook says both hexose phosphorylations of glycolysis are irreversible, and gluconeogenesis has to go back through a hydrolase instead.”',
  note:'<b>书里有 hexokinase vs glucokinase</b>（p164）：hexokinase 把很多己糖磷酸化在 C-6，glucokinase 专一于葡萄糖、在肝里更重要。Km 高低的差别（glucokinase Km 高，血糖高时才开工）是通用知识，书没给。<br>金属：书 p043 把 hexokinase 列在 <b>Mn²⁺</b> 的酶里；通用说法是 Mg²⁺-ATP——卡 18 已经这样处理：“as Mg-ATP, where the textbook lists manganese.” 系统名 <b>ATP:hexose phosphotransferase</b>（p042，书拿它当转移酶的命名例子）。<br><b>为什么先磷酸化</b>：书 p219 说糖代谢的第一步就是造出磷酸化的单糖；「磷酸化的糖带负电、出不了细胞」这半句是通用的。英文：“Phosphorylation traps the sugar: the phosphate carries negative charge, so glucose-6-phosphate cannot leave the cell — that is general knowledge; the textbook says only that the first step of carbohydrate metabolism is forming a phosphorylated monosaccharide.”<br>偶联那三个数是书 p131 的原例——<b>它就是书讲「放能反应带动吸能反应」时用的例子</b>。<span class="pg">p042 p043 p131 p164 p219</span>'},
 {n:'07', t:'第 2 步 · hexose phosphate isomerase',
  big:'<b>glucose-6-phosphate ⇌ fructose-6-phosphate</b>，<b>醛糖 → 酮糖</b>；可逆，平衡时 <b>30% F6P</b>',
  en:'“Glucose-6-phosphate is isomerised by hexose phosphate isomerase — phosphoglucose isomerase in the usual name — to fructose-6-phosphate. That is an aldose-to-ketose conversion: the aldehyde at C-1 becomes a ketone at C-2. It is reversible — the textbook gives 30 per cent fructose-6-phosphate in the equilibrium mixture — and it is pulled forward because the next step is irreversible.”',
  note:'书的酶名是 <i>hexosafosfátizomerasa</i>；通用名 phosphoglucose isomerase / glucose-6-phosphate isomerase。<b>30% 这个数是书给的</b>，是 very specific 题的弹药。「醛糖变酮糖」这句书自己说了（<i>přeměnu aldosy na ketosu</i>）——这正是横向卡「反应类型的名字」里 isomerace 的例子。<span class="pg">p164</span>'},
 {n:'08', t:'第 3 步 · phosphofructokinase',
  big:'<b>fructose-6-phosphate → fructose-1,6-bisphosphate</b>，第二个 ATP，磷酸化在 <b>C-1</b>；<b>不可逆</b>；书明说它是<b>整个糖酵解的限速反应</b>，被 <b>ATP/ADP</b> 变构控制',
  en:'“Phosphofructokinase phosphorylates fructose-6-phosphate with a second ATP, at carbon 1, giving fructose-1,6-bisphosphate. The textbook says three things about it: the phosphorylation is practically irreversible; that makes it the rate-limiting reaction of the whole glycolytic process; and the enzyme is allosterically controlled by the ATP/ADP system — allosteric meaning a metabolite binds at a site other than the active site and changes the enzyme’s conformation. In the regulation chapter it is the textbook’s example of a control enzyme — one that controls a sequence by catalysing a practically irreversible reaction.”',
  note:'<b>这是全卡最要紧的一个酶。</b>三句话全是书的：p164 <i>prakticky ireverzibilní</i>、<i>reakcí limitující rychlost celého glykolytického pochodu</i>、<i>alostericky kontrolována systémem ATP/ADP</i>；p222 拿它当「控制酶」的例子。<br>书没给的（通用，说的时候要标）：ATP 抑制、AMP/ADP 激活、<b>柠檬酸抑制</b>、<b>fructose-2,6-bisphosphate 是最强的激活剂</b>（肝里由 PFK-2 造）。英文：“Beyond the textbook: ATP inhibits it and AMP activates it, citrate from the mitochondrion inhibits it, and fructose-2,6-bisphosphate is the strongest activator — those are general knowledge.”<br><b>为什么控制点是 PFK 不是 hexokinase</b>：glucose-6-phosphate 还能走糖原和磷酸戊糖（p219 列了这两条），所以 PFK 才是<b>糖酵解专属的第一个不可逆步</b>——「first committed step」这个说法是通用的，但两条岔路在书里。<span class="pg">p164 p219 p222</span>'},
 {n:'09', t:'第 4 步 · aldolase',
  big:'<b>fructose-1,6-bisphosphate ⇌ dihydroxyacetone phosphate（C-1–C-3）＋ glyceraldehyde-3-phosphate（C-4–C-6）</b>；可逆，平衡时 <b>89% 己糖 / 11% 丙糖</b>',
  en:'“Aldolase splits fructose-1,6-bisphosphate into two trioses — dihydroxyacetone phosphate, carbons 1 to 3, and glyceraldehyde-3-phosphate, carbons 4 to 6. It is a reversible aldol cleavage, the reverse of an aldol condensation; at equilibrium the textbook has 89 per cent hexose and 11 per cent trioses, so it runs forward only because the following steps keep removing glyceraldehyde-3-phosphate.”',
  note:'<b>碳的归属书给了</b>：DHAP 是 C-1 到 C-3，GAP 是 C-4 到 C-6——所以两个磷酸各带一个：C-1 上那个来自 PFK，C-6 上那个来自 hexokinase。这是点 15「哪两个 ATP 是净赚」的依据。p161 §7.6.3 又写了一遍 aldolase（跟 transaldolase 对照：aldolase 只会把己糖拆成丙糖、丙糖合成己糖）。<b>「平衡偏向己糖但被后面拉着走」</b>这一条是 p164 原话。<span class="pg">p161 p164</span>'},
 {n:'10', t:'第 5 步 · triose phosphate isomerase',
  big:'<b>DHAP ⇌ GAP</b>，经<b>共同的烯醇式</b>；平衡时 <b>96% DHAP</b>，但被下游拉过去。从这里起<b>每个葡萄糖算两份</b>',
  en:'“Dihydroxyacetone phosphate and glyceraldehyde-3-phosphate are in equilibrium through a common enol form — the enediol, carbons 1 and 2 joined by a double bond with an OH on each — and triose phosphate isomerase only speeds up that equilibrium. At equilibrium 96 per cent is dihydroxyacetone phosphate, but it is drawn across as glyceraldehyde-3-phosphate is consumed. So one fructose-1,6-bisphosphate gives two glyceraldehyde-3-phosphate, and from here on everything happens twice per glucose.”',
  note:'书 p164：两者<i>v rovnováze přes společnou enolovou formu</i>，isomerase <i>urychluje ustavení rovnováhy</i>，平衡时 96% DHAP，但 DHAP <i>snadno přeměňován</i> 成被后续反应消耗的 GAP。<b>「酶只加快平衡、不改变平衡」这一句是酶动力学的通用结论，正好在这里有书的例子。</b>「enediol」这个名字是通用的，书只说「烯醇式」。<span class="pg">p164</span>'},

 {g:'十步 · 收获相（6–10）', gn:'唯一一次氧化、两次底物水平磷酸化、两个高能化合物。这五步是他追问「能量从哪来」的落点。'},
 {n:'11', t:'第 6 步 · glyceraldehyde-3-phosphate dehydrogenase',
  big:'<b>GAP ＋ NAD⁺ ＋ Pᵢ ⇌ 1,3-bisphosphoglycerate ＋ NADH ＋ H⁺</b>；<b>糖酵解里唯一的氧化</b>；醛先接在酶的 <b>–SH</b> 上，脱氢成<b>硫酯</b>，再被磷酸<b>磷酸解</b>',
  en:'“Glyceraldehyde-3-phosphate dehydrogenase oxidises the aldehyde group with NAD-plus and takes up inorganic phosphate: glyceraldehyde-3-phosphate plus NAD-plus plus phosphate gives 1,3-bisphosphoglycerate plus NADH. The textbook says the oxidation is strongly exergonic and is coupled to the uptake of phosphate, and it gives the mechanism: the aldehyde adds to an SH group of the enzyme, is dehydrogenated with the hydrogen going to NAD-plus, and that leaves an energy-rich thioester on the enzyme; phosphate then cleaves the thioester — phosphorolysis, cleavage by phosphate instead of water — releasing 1,3-bisphosphoglycerate and regenerating the enzyme. It is the only oxidation in glycolysis. The enzyme is allosteric, and the textbook says its most important activator is NAD-plus.”',
  note:'<b>这一步是整条通路的能量来源</b>：醛氧化成酸放的能量没有变成热，被<b>先存进硫酯、再存进酰基磷酸</b>。书 p165 把机制写全了——醛加到酶的 HS- 基上、脱氢、氢给 NAD⁺、<i>energii bohatá thioesterová vazba</i>、<i>štěpí fosforolyticky</i>。<b>硫酯为什么高能</b>接横向卡「化学键」（硫阻止了 O-酯那种共振，p132）。那个 –SH 是活性中心的 <b>cysteine</b>（通用；书只说 HS-skupina）。<br>「NAD⁺ 是最重要的激活效应物」（p165）——这句是点 16「NAD⁺ 问题」的伏笔：<b>没 NAD⁺ 这个酶就停</b>。<span class="pg">p132 p164 p165</span>'},
 {n:'12', t:'第 7 步 · phosphoglycerate kinase',
  big:'<b>1,3-BPG ＋ ADP → 3-phosphoglycerate ＋ ATP</b>；书就在这里给「<b>底物水平磷酸化</b>」下的名；酰基磷酸 ΔG°′ 水解 <b>−49.3</b> ＞ ATP 的 −30.5，所以能转；<b>第一对 ATP</b>',
  en:'“Phosphoglycerate kinase transfers the phosphate on carbon 1 of 1,3-bisphosphoglycerate to ADP, giving 3-phosphoglycerate and ATP. The textbook calls this way of making ATP substrate-level phosphorylation: a soluble enzyme moves a phosphate from a macroergic intermediate directly onto ADP — no membrane, no proton gradient, no oxygen. It works because that C-1 phosphate is an acyl phosphate, an anhydride between a carboxylic acid and phosphoric acid, with a free energy of hydrolysis of minus 49.3 kJ per mole in the textbook’s table — more than the minus 30.5 of ATP, so the transfer runs downhill. These are the first two ATP per glucose.”',
  note:'<b>substrátová fosforylace 全书只出现在这一页</b>（p165），而且是以这一步为定义例子。1,3-BPG 的 −49.3 和 ATP 的 −30.5 都在 p133 Tab. 6.1；书还归了类：<b>表里排在 ATP 上面的是磷酸供体，下面的是受体</b>——这句是「为什么能转」的书内根据。1,3-BPG 是<b>酰基磷酸</b>、属于<b>酐</b>那一类高能化合物（p132 明写 <i>acylfosfátové, např. … 1,3-bisfosfoglycerát (kap. 7.8)</i>）——接横向卡「化学键」点 09。<br>⚠ Tab. 6.1 里 ATP 那行 OCR 读出来是 −20,5，同页正文和 p131 都是 −30,5，应是 OCR 把 3 读成 2；<b>待核原图</b>。<span class="pg">p132 p133 p165</span>'},
 {n:'13', t:'第 8 步 · phosphoglycerate mutase',
  big:'<b>3-phosphoglycerate ⇌ 2-phosphoglycerate</b>，磷酸从 C-3 挪到 C-2；书给的「辅酶」是 <b>2,3-bisphosphoglycerate</b>',
  en:'“Phosphoglycerate mutase moves the phosphate from carbon 3 to carbon 2, giving 2-phosphoglycerate — a mutase being an isomerase that shifts a group from one position to another within the same molecule. The textbook explains it with 2,3-bisphosphoglycerate as the enzyme’s coenzyme: the enzyme–2,3-bisphosphoglycerate complex phosphorylates 3-phosphoglycerate to 2,3-bisphosphoglycerate, the dephosphorylated coenzyme — which is 2-phosphoglycerate — is released, and the newly phosphorylated product stays on as the next coenzyme. It is reversible.”',
  note:'书 p166 把这个机制写得很具体，而且把「辅酶」打了引号（<i>„Koenzymem“</i>）——因为 2,3-BPG 在这里既是中间体又是催化量的辅助物。<b>他要是问「2,3-BPG 还在哪见过」</b>：红细胞里它是血红蛋白的变构效应物、降低对氧的亲和力——这是通用知识，书没提，说的时候要标。<span class="pg">p166</span>'},
 {n:'14', t:'第 9 步 · enolase',
  big:'<b>2-phosphoglycerate → phosphoenolpyruvate ＋ H₂O</b>，<b>脱水</b>；造出第二个高能化合物——<b>烯醇磷酸</b>，全表最高 <b>−61.9</b>',
  en:'“Enolase removes water from 2-phosphoglycerate — a dehydration — giving phosphoenolpyruvate. This is what creates the second macroergic compound: an enol phosphate. The textbook’s explanation is that the phosphate ester locks the enol form and prevents it from turning into the keto form, which is poorer in energy and therefore more stable; so the compound is held in an unstable state by one bond. Phosphoenolpyruvate has the highest free energy of hydrolysis in the textbook’s table — minus 61.9 kJ per mole — about twice that of ATP.”',
  note:'<b>「为什么 PEP 高能」书自己答了</b>（p132 §6.1.2 第 3 类 <i>Enolfosfáty</i>：<i>Esterová fosfátová vazba brání tvorbě ketoformy, která je chudší energií a tedy stabilnější</i>）。<b>注意脱水本身不放多少能</b>——它是把分子里的能量<b>重新分布</b>到那个磷酸上：2-PG 的磷酸是普通酯（低能），脱水后同一个磷酸变成烯醇磷酸（最高能）。书 p219 把这一步列为糖酵解三个「关键点」之一。<br>通用（书没有）：enolase 需要 Mg²⁺，被<b>氟化物</b>抑制——这是采血管里加 NaF 防止血糖被红细胞消耗的原因。<span class="pg">p132 p133 p166 p219</span>'},
 {n:'15', t:'第 10 步 · pyruvate kinase',
  big:'<b>PEP ＋ ADP → pyruvate ＋ ATP</b>；<b>不可逆</b>（糖异生要绕 oxaloacetate）；<b>第二对 ATP</b>——书说这一对只是<b>把开头投的收回来</b>，净赚的是 PGK 那一对',
  en:'“Pyruvate kinase transfers that phosphate to ADP, giving ATP and pyruvate — the enol collapses to the keto form, and that collapse is what pays for the ATP. It is practically irreversible; the textbook says so in the gluconeogenesis section, where this is the step that has to be bypassed through oxaloacetate. These are the second two ATP. And the textbook makes a point worth repeating: the phosphate transferred here is the one that came in from ATP at the hexose phosphorylations, so this step only recovers the investment — the net gain of glycolysis is the two ATP that phosphoglycerate kinase made from inorganic phosphate.”',
  note:'p166 原话：<i>Při tomto vzniku ATP jde o přenos toho zbytku kyseliny fosforečné, který při fosforylaci hexos byl dodán z ATP. ATP spotřebovaný na začátku glykolýzy se tedy tímto postupem získává zpět.</i> 追一下碳：C-6 的磷酸（hexokinase）和 C-1 的磷酸（PFK）分别落在 GAP 和 DHAP 的 C-3 上；mutase 把它挪到 C-2；enolase 后它就是 PEP 的磷酸；PK 把它还给 ADP。<b>所以净赚的两个 ATP 的磷酸是 GAPDH 那步吃进的 Pᵢ。</b>金属：书 p043 把 pyruvate kinase 列在 <b>K⁺</b> 的酶里。不可逆：p169 <i>tvorba pyruvátu a ATP z fosfoenolpyruvátu a ADP je prakticky ireverzibilní</i>。<span class="pg">p043 p166 p169</span>'},

 {g:'之后 · NAD⁺ 问题', gn:'这一格是「为什么糖酵解要跟氧扯上关系」的全部答案。他问「anaerobic」时挖的就是这里。'},
 {n:'16', t:'NAD⁺ 必须再生',
  big:'GAPDH 要 NAD⁺，池子很小；书说不再生 NAD⁺ 糖酵解<b>走不过 GAP</b>。三条路：<b>乳酸</b>（LDH，缺氧肌肉、很多微生物）· <b>乙醇</b>（酵母：pyruvate decarboxylase ＋ TPP → 乙醛 ＋ CO₂，alcohol dehydrogenase）· <b>有氧</b>（丙酮酸进线粒体 → acetyl-CoA，NADH 交呼吸链）',
  en:'“Glycolysis has a bookkeeping problem: glyceraldehyde-3-phosphate dehydrogenase needs NAD-plus, and the cell has only a small pool of it. If NADH were not reoxidised, the textbook says, glycolysis could not go beyond glyceraldehyde-3-phosphate and no ATP could be made or regenerated. There are three solutions. Without oxygen, pyruvate itself becomes the electron acceptor — that is fermentation. In muscle short of oxygen, and in many microorganisms, lactate dehydrogenase reduces pyruvate to lactate with NADH. In yeast, pyruvate decarboxylase — with thiamine diphosphate as its prosthetic group — removes CO₂ to give acetaldehyde, and alcohol dehydrogenase reduces that to ethanol with NADH. With oxygen, pyruvate goes into the mitochondrion, the pyruvate dehydrogenase complex oxidatively decarboxylates it to acetyl-CoA, and the NADH — that one and the glycolytic one — is reoxidised by the respiratory chain.”',
  note:'书 p168 原话是这题的钥匙：<i>Regenerace NAD⁺ … umožňuje chod glykolýzy za anaerobních podmínek. Kdyby se neregenerovalo NAD⁺ tímto způsobem, glykolýza by nemohla pokračovat dále než ke glyceraldehyd-3-fosfátu, takže by nemohlo vznikat ani se regenerovat ATP.</i><br>三条路的反应式都在 p167–p168：pyruvate + H⁺ → acetaldehyde + CO₂（<b>pyruvate decarboxylase</b>，TPP 为辅基，书说它「像氧化脱羧的第一步一样进行」）；acetaldehyde + NADH + H⁺ ⇌ ethanol + NAD⁺（<b>alcohol dehydrogenase</b>，p043 列它含 Zn²⁺）；pyruvate + NADH + H⁺ ⇌ lactate + NAD⁺（<b>lactate dehydrogenase</b>）；pyruvate + NAD⁺ + CoA → acetyl-CoA + CO₂ + NADH + H⁺（多酶复合体，TPP、硫辛酸、CoA、FAD、NAD⁺）。<b>「发酵」的定义就藏在这里</b>：不是「无氧产能」，是<b>用有机分子当电子受体把 NADH 氧化回去</b>，葡萄糖没有净氧化。<span class="pg">p043 p167 p168</span>'},
 {n:'17', t:'能量账',
  big:'无氧 <b>2 ATP</b>；有氧书说 <b>38</b>（糖酵解 8 ＋ 丙酮酸氧化脱羧 6 ＋ 循环 24）；现代 <b>30–32</b>；无氧只放出 <b>−196.6</b>，有氧 <b>−2870</b> kJ/mol',
  en:'“Anaerobically one glucose gives two ATP. Aerobically the textbook gives 38: eight from glycolysis — the two ATP plus the two NADH at three each — six from the oxidative decarboxylation of the two pyruvates, and 24 from two turns of the citric acid cycle. Modern textbooks say 30 to 32, for two reasons: the respiratory chain is now counted at about 2.5 ATP per NADH and 1.5 per FADH₂ instead of 3 and 2, and the glycolytic NADH is made in the cytosol and has to be carried into the mitochondrion by a shuttle, which costs part of its value. The textbook itself shows why anaerobic is so poor: glucose to two lactate releases minus 196.6 kJ per mole, complete oxidation minus 2870 — so the lactate still holds most of the energy, and only a small part of the energy of glucose is released anaerobically.”',
  note:'2 vs 38 是书自己做的对比（p136），8 ＋ 6 ＋ 24 在 p139，38 ATP ≈ 1159 kJ ≈ 有氧总能量的 40%（p140），3 ATP/NADH 在 p146（6 个质子 ≈ 3 ATP，4 个 ≈ 2）。<b>书里 p136/p166 说 2、p139 说 8，不矛盾</b>：2 是糖酵解自己造的 ATP，8 是把两个 NADH 按 3 个兑了——前提是有氧、且 NADH 能进线粒体。穿梭（glycerol-3-phosphate 穿梭交给 FAD 值 1.5，malate–aspartate 穿梭交给 NAD⁺ 值 2.5）是通用知识，书没有——卡 24 点 15 已经这样标了。<br>效率：2 × 30.5 = 61 ÷ 196.6 ≈ 31%——这是拿书的数算的，书没写这个百分比。<span class="pg">p135 p136 p139 p140 p146</span>'},

 {g:'入口 · 别的糖怎么进来', gn:'同事那道 glucose → galactose 就住在这里。三种入口，两种在书里有名有姓。'},
 {n:'18', t:'糖原 · 半乳糖 · 果糖',
  big:'<b>糖原</b>：磷酸解 → glucose-1-phosphate，<b>不花 ATP</b>，再挪成 G6P · <b>半乳糖</b>：galactokinase → hexose-1-phosphate uridyltransferase → <b>UDP-glucose-4-epimerase</b>（C-4 差向异构）→ G1P · <b>果糖</b>：hexokinase 也磷酸化它 → F6P',
  en:'“Other carbohydrates enter at the top. Glycogen is broken down by phosphorolysis — phosphorylase cleaves the glycosidic bond with phosphate instead of water — giving glucose-1-phosphate without spending ATP, which is then shifted to glucose-6-phosphate; the textbook notes this saves the first phosphorylation. Galactose enters through galactokinase, hexose-1-phosphate uridyltransferase and UDP-glucose-4-epimerase, which epimerises carbon 4 — the textbook calls this the most important metabolic pathway of galactose — and ends as glucose-1-phosphate. Fructose: since hexokinase phosphorylates many hexoses at C-6, it can enter as fructose-6-phosphate; the liver’s separate route through fructose-1-phosphate is general knowledge, not the textbook’s.”',
  note:'糖原：p164（<i>bez spotřeby ATP … fosforolýzou</i>，然后<i>musí dojít k přesunu fosfátového zbytku</i>）＋ p174（磷酸解省掉第一次磷酸化）；挪磷酸的酶 <b>phosphoglucomutase</b> 书没点名（通用）。半乳糖：p172 三个酶全在，平衡 glucose : galactose = 1 : 3，<i>nejdůležitější metabolickou cestu galaktosy</i>——<b>同事问的 glucose → galactose 答案就是 epimerisation at C-4</b>（LOGIC.md §7 的验证例）。果糖：书只说 hexokinase 磷酸化「很多己糖」；肝里的 fructokinase → fructose-1-phosphate → aldolase B 是通用。<span class="pg">p164 p172 p174</span>'},

 {g:'收尾', gn:'一句停住，一句伸出去。'},
 {n:'19', t:'落点',
  big:'<b>三步不可逆</b>（hexokinase · PFK · pyruvate kinase）＋ 七步可逆。不可逆 = ΔG 大负 → 既是<b>控制点</b>，也是糖异生必须<b>绕开</b>的三处',
  en:'“So the shape of the pathway is three irreversible steps — hexokinase, phosphofructokinase, pyruvate kinase — and seven reversible ones. The three are irreversible because their free-energy change is large and negative, and the textbook draws both consequences: they are where the pathway is controlled, phosphofructokinase above all; and they are the three places gluconeogenesis has to bypass with different enzymes — pyruvate carboxylase and a GTP-dependent phosphorylation through oxaloacetate, and two hydrolases that simply take the phosphates off fructose-1,6-bisphosphate and glucose-6-phosphate. Below that we are asking why an acyl phosphate or an enol phosphate holds more free energy than a phosphoanhydride — resonance and charge repulsion — which is physical chemistry rather than biochemistry.”',
  note:'落在<b>热力学</b>那块地基上。三步不可逆书都说了：hexokinase 和 PFK——p219 <i>obě fosforylace hexos … jsou reakce nevratné a v procesu syntézy musí být katalyzovány jinými enzymy (hydrolasami)</i>；PK——p169。绕路：p169–p170（pyruvate 羧化成 oxaloacetate，biotin，GTP 磷酸化；F-1,6-BP 水解；G6P 水解）。酶名 phosphoenolpyruvate carboxykinase、fructose-1,6-bisphosphatase、glucose-6-phosphatase 书没给（通用），pyruvate carboxylase 在 p140。<span class="pg">p140 p169 p170 p219</span>'},
 {n:'20', t:'留口子',
  big:'我天天用的生物就是<b>酵母</b>——它跑的正是这条路：葡萄糖里<b>发酵</b>，换到<b>半乳糖</b>诱导表达时糖从 p172 那条路进来；PFK、LDH 是变构和同工酶的教科书例子',
  en:'“One thing worth adding from my own work: the organism I use every day is yeast, and it runs exactly this pathway. Yeast is a facultative anaerobe — the textbook’s example of one — so in a glucose culture it ferments to ethanol; and to induce my display construct I move the cells from glucose to galactose, so the sugar they then live on enters glycolysis through the galactokinase, uridyltransferase and 4-epimerase route on the same page as the pathway. And the glycolytic enzymes are the textbook cases of the regulation I have to keep in mind when I measure binding: phosphofructokinase as the allosteric enzyme, and lactate dehydrogenase with five isoenzymes that catalyse the same reaction with different kinetics.”',
  note:'酵母是兼性厌氧的例子：p016 <i>Fakultativně anaerobní jsou organismy (např. kvasinky)</i>。「即使有氧、糖多时酵母也发酵」是 <b>Crabtree 效应</b>，通用，书没有；「葡萄糖阻遏 GAL 启动子」也是通用分子生物学。<b>不要在这里点病原体的名字</b>（DRILL.md 的规矩）——说 “my display construct”、“the binding protein I work on”。LDH 五种同工酶在 p064–p065（H/M 亚基、四聚体、Mr 140 000、结合 4 mol NAD⁺、动力学不同、被机体用来调节代谢）。口子落到<b>卡 02（Kd）</b>和大本营卡。<span class="pg">p016 p064 p065 p172</span>'},
 {n:'21', t:'画（没有图文件，按这个顺序画）',
  big:'一条竖线，<b>先写十个中间物，再补酶，最后标能量</b>',
  en:'“If asked to draw it: a vertical line of ten compounds — glucose, glucose-6-phosphate, fructose-6-phosphate, fructose-1,6-bisphosphate, then a fork into dihydroxyacetone phosphate and glyceraldehyde-3-phosphate, then in duplicate: 1,3-bisphosphoglycerate, 3-phosphoglycerate, 2-phosphoglycerate, phosphoenolpyruvate, pyruvate. Then the enzymes on the arrows, then the money: ATP in at steps 1 and 3, NAD-plus and phosphate in at step 6, ATP out at steps 7 and 10, water out at step 9. Finally three thick arrows for the irreversible steps and a bracket under the lower half marked times two.”',
  tbl:{head:['顺序','画什么'],
   rows:[
    ['1','竖着写 10 个中间物：Glc → G6P → F6P → F1,6BP → ⟨DHAP ⇌ GAP⟩ → 1,3-BPG → 3-PG → 2-PG → PEP → Pyr'],

segs:[
 {tag:'段 1 · 定义', h:'先说它是什么、在哪儿、赚什么',
  p:['“Glycolysis is the process — the sequence of enzyme-catalysed reactions — in the cytosol — the soluble part of the cytoplasm outside the organelles — that converts one glucose into two pyruvate, the three-carbon 2-oxo acid, with a net gain of two ATP and two NADH. The textbook’s definition is one sentence: the sequence of reactions by which glucose is converted to pyruvate with simultaneous production of ATP. No step uses oxygen, and it is almost universal — the same reactions in nearly all organisms and all cell types.',
     'It is a catabolic pathway — a breakdown route that releases energy — and it is the common trunk of carbohydrate catabolism: glycogen, galactose and fructose all enter it, and pyruvate is the branch point. With oxygen, pyruvate goes into the mitochondrion and is oxidised completely; in a working muscle short of oxygen it is temporarily reduced to lactate; in yeast it goes to ethanol.”'],
  note:'<b>「胞质」「丙酮酸」「分解代谢」三个词都在同一句里交代了</b>——它们承重。三个去向是 p164 第一段的顺序。'},
 {tag:'段 2 · general', h:'先给账和形状，再给步骤',
  p:['“The balance per glucose: two ATP invested at the two hexose phosphorylations, four made at the two substrate-level phosphorylations, so the net gain is two ATP — plus two NADH from the one oxidation, and two pyruvate. Glucose is not oxidised to CO₂; all six carbons are still there.',
     'The pathway has two halves. The first five reactions invest two ATP to turn one six-carbon sugar into two three-carbon phosphates; the last five oxidise each triose once and harvest four ATP. Three of the ten steps are practically irreversible — hexokinase, phosphofructokinase and pyruvate kinase — and the textbook singles out phosphofructokinase as the rate-limiting, allosterically controlled step.”'],
  note:'<b>先给净账和三个不可逆步，再给十步</b>。直接背十步是 technician 的答法；先说「四造二投、三步不可逆、PFK 控制」，他就知道你理解了形状。'},
 {tag:'段 3 · 稍展开', h:'十步，每步只给「谁变成谁 ＋ 酶」，然后 NAD⁺ 问题',
  p:['“Hexokinase — glucokinase in the liver — phosphorylates glucose at C-6 with ATP; hexose phosphate isomerase converts the aldose to the ketose, fructose-6-phosphate; phosphofructokinase adds the second ATP at C-1, giving fructose-1,6-bisphosphate; aldolase splits it into dihydroxyacetone phosphate and glyceraldehyde-3-phosphate; and triose phosphate isomerase interconverts them, so we have two glyceraldehyde-3-phosphate.',
     'Then, twice: glyceraldehyde-3-phosphate dehydrogenase oxidises the aldehyde with NAD-plus and takes up inorganic phosphate, giving 1,3-bisphosphoglycerate — an acyl phosphate, macroergic; phosphoglycerate kinase hands that phosphate to ADP — substrate-level phosphorylation, the first ATP; phosphoglycerate mutase moves the remaining phosphate from C-3 to C-2; enolase removes water to give phosphoenolpyruvate — an enol phosphate, the highest free energy of hydrolysis in the textbook’s table; and pyruvate kinase hands that to ADP — the second ATP — giving pyruvate.',
     'The one thing that ties it to oxygen is NAD-plus. The dehydrogenase needs it, the pool is small, and the textbook says that if NADH were not reoxidised the pathway could not go beyond glyceraldehyde-3-phosphate. Without oxygen pyruvate is the acceptor — lactate dehydrogenase in muscle, pyruvate decarboxylase and alcohol dehydrogenase in yeast; with oxygen the respiratory chain reoxidises it, and the yield goes from two ATP to the textbook’s thirty-eight.”'],
  note:'<b>时间不够就砍到三句</b>：五步投资到两个 GAP；五步收获——一次氧化、两次底物水平磷酸化；NAD⁺ 必须再生。<b>「NAD⁺ 问题」那一句不要砍</b>，它是 anaerobic 这个词的全部内容。'},
 {tag:'段 4 · 留口子', h:'落到酵母和你量的东西',
  p:['“One thing worth adding from my own work: the organism I use every day is yeast, and it runs exactly this pathway — it is the textbook’s example of a facultative anaerobe, so in glucose it ferments to ethanol, and when I move the cells to galactose to induce my display construct, the sugar enters glycolysis through galactokinase, the uridyltransferase and UDP-glucose-4-epimerase — the same page of the textbook. And two of these enzymes are the textbook’s standard cases of what I have to think about when I measure binding: phosphofructokinase for allosteric control, and lactate dehydrogenase, whose five isoenzymes catalyse the same reaction with different kinetics — the same protein family, different constants, which is exactly the kind of difference I measure as a dissociation constant.”'],
  note:'口子落在 <b>卡 02（Kd）</b> 和大本营卡。酵母兼性厌氧 p016；半乳糖三个酶 p172；LDH 同工酶 p064–p065；PFK 变构 p164。<b>Crabtree 效应和 GAL 启动子的葡萄糖阻遏是通用知识</b>，被追问时说成自己的，不说成书的。<b>不点病原体的名字。</b>'}
],
