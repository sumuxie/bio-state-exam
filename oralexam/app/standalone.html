recog:[
{q:'What is glycolysis?',
 mean:'<b>他真正会说的那句，比卷面短。</b>答案要自带结构：定义 → 在哪 → 净账 → 两相 → 丙酮酸去哪。<b>不要一上来就背十步。</b>',
 say:'“Glycolysis is the sequence of enzyme-catalysed reactions that converts one glucose into two pyruvate — the three-carbon 2-oxo acid — with a net gain of two ATP and two NADH. It runs in the cytosol and needs no oxygen. It has two halves: five reactions that invest two ATP to split the hexose into two triose phosphates, and five that oxidise each triose once and harvest four ATP by substrate-level phosphorylation. Pyruvate is the branch point: with oxygen it is oxidised in the mitochondrion, without it it is reduced to lactate in muscle or to ethanol in yeast so that NAD-plus is regenerated.”'},

{q:'Explain the process of glycolysis.',
 mean:'卷面原题。<b>「process」= 按顺序把步骤说出来</b>——但先用一句定义起步，再走十步，每步「谁变成谁 ＋ 酶」。',
 say:'“Glycolysis converts glucose to two pyruvate in ten steps in the cytosol, net two ATP and two NADH. Investment: hexokinase phosphorylates glucose at C-6; hexose phosphate isomerase gives fructose-6-phosphate; phosphofructokinase adds a second phosphate at C-1 — the irreversible, rate-limiting step; aldolase splits fructose-1,6-bisphosphate into dihydroxyacetone phosphate and glyceraldehyde-3-phosphate; triose phosphate isomerase interconverts them. Payoff, twice: glyceraldehyde-3-phosphate dehydrogenase oxidises the aldehyde with NAD-plus and phosphate to 1,3-bisphosphoglycerate; phosphoglycerate kinase makes the first ATP; phosphoglycerate mutase moves the phosphate to C-2; enolase dehydrates to phosphoenolpyruvate; pyruvate kinase makes the second ATP and pyruvate.”'},

{q:'What does glycolysis produce? — What is the net gain?',
 mean:'账的三行。<b>先说净账，再说 4 − 2。</b>',
 say:'“Per glucose: two pyruvate, two ATP net and two NADH. Four ATP are actually made — two by phosphoglycerate kinase, two by pyruvate kinase — but two were invested by hexokinase and phosphofructokinase, so the gain is two; the textbook writes it as minus one, minus one, plus two, plus two. The two NADH come from the single oxidation, at glyceraldehyde-3-phosphate dehydrogenase.”'},

{q:'How much ATP does one glucose give?',
 mean:'<b>陷阱问法。</b>直接报一个数就上钩了——先问有没有氧，再给两个数，再说现代数。',
 say:'“It depends on oxygen. Without it, two ATP — glycolysis alone, with pyruvate reduced to lactate or ethanol to regenerate NAD-plus. With it, the textbook says thirty-eight: eight from glycolysis counting the two NADH at three each, six from pyruvate dehydrogenase, twenty-four from the citric acid cycle; modern textbooks give thirty to thirty-two because the chain is counted at 2.5 and 1.5 per NADH and FADH₂ and the cytosolic NADH has to be shuttled in.”'},

{q:'Does glycolysis need oxygen?',
 mean:'<b>答「不需要」只对了一半。</b>它不用氧，但它的<b>产量</b>和它的<b>NAD⁺ 再生方式</b>取决于氧。',
 say:'“No step of glycolysis uses oxygen, so it runs without it — that is why it is the pathway of anaerobic organisms and of muscle in a sprint. But it depends on oxygen indirectly, through NAD-plus: the dehydrogenase step needs NAD-plus, and NADH has to be reoxidised somewhere. With oxygen the respiratory chain does it and the pyruvate goes on to be oxidised; without it, pyruvate itself takes the electrons — lactate or ethanol — and the yield stays at two ATP.”'},

{q:'Where does glycolysis take place?',
 mean:'一个词，但顺带把边界说清：<b>糖酵解在胞质，丙酮酸的氧化在线粒体</b>。',
 say:'“In the cytosol — every one of the ten steps; the textbook says glucose is taken up by the cell and the reactions of glycolysis then run in the cytosol. The border is pyruvate: its oxidative decarboxylation to acetyl-CoA happens inside the mitochondrion, and lactate or ethanol formation stays in the cytosol.”'},

{q:'Which steps are irreversible — and which one is regulated?',
 mean:'三步 ＋ 一个酶。书点的名是 PFK。',
 say:'“Three: hexokinase, phosphofructokinase and pyruvate kinase — the two hexose phosphorylations and the last step, all with large negative free-energy changes, which is why gluconeogenesis has to bypass exactly these three with different enzymes. The textbook singles out phosphofructokinase as the rate-limiting reaction of the whole pathway, allosterically controlled by the ATP/ADP system, and uses it as its example of a control enzyme. General knowledge adds AMP and fructose-2,6-bisphosphate as activators and citrate as an inhibitor, and hexokinase inhibited by its own product, glucose-6-phosphate.”'},

{q:'What happens to pyruvate?',
 mean:'三条路，书 §7.8.1 的顺序：乙醇、乳酸、acetyl-CoA。<b>每条都要说清是谁在再生 NAD⁺。</b>',
 say:'“Three fates, and the textbook says the glycolytic reactions themselves are nearly the same everywhere — only this differs. In yeast, pyruvate decarboxylase with thiamine diphosphate removes CO₂ to give acetaldehyde, and alcohol dehydrogenase reduces it to ethanol with NADH. In muscle short of oxygen and in many microorganisms, lactate dehydrogenase reduces pyruvate to lactate with NADH. Both exist to regenerate NAD-plus. With oxygen, pyruvate enters the mitochondrion and the pyruvate dehydrogenase complex oxidatively decarboxylates it to acetyl-CoA, which enters the citric acid cycle.”'},

{q:'What is fermentation?',
 mean:'<b>正面定义。</b>不是「无氧产能」，是「用有机分子当电子受体把 NADH 氧化回去」。',
 say:'“Fermentation is the anaerobic completion of glycolysis: the NADH made at the dehydrogenase step is reoxidised by reducing an organic molecule derived from the sugar itself — pyruvate to lactate, or acetaldehyde to ethanol — instead of by oxygen. There is no net oxidation of glucose; the only ATP is the two from glycolysis. The textbook’s two cases are lactate fermentation and alcoholic fermentation.”'},

{q:'Why do my muscles burn when I sprint?', odd:1,
 mean:'<b>听起来是体育题。</b>答案是缺氧肌肉把丙酮酸变乳酸来再生 NAD⁺——但「乳酸本身引起灼痛」是生理学而且有争议，说到书的边界就停。',
 say:'“Because in a sprint the muscle needs ATP faster than oxygen can be delivered, so it runs glycolysis alone — two ATP per glucose — and to keep going it has to regenerate NAD-plus by reducing pyruvate to lactate, with lactate dehydrogenase; the textbook’s example is exactly the intensively working muscle. Lactate accumulates and leaves for the liver, which — the textbook says — has the gluconeogenesis enzymes muscle lacks and remakes glucose from it. Whether the burning sensation is the lactate itself or the accompanying acidification is physiology, and it is disputed — I would stop there.”',
 tail:'书 p164 <i>aktivně pracujícím svalu</i>、p167 <i>intenzivně pracujícím svalu</i>、p170 肌肉缺糖异生的主要酶，乳酸经血到肝再造糖、糖再回肌肉——<b>这就是 Cori 循环，名字是通用的，书没起名。</b>'},

{q:'Why does bread rise?', odd:1,
 mean:'问的是<b>酵母的乙醇发酵</b>——而且气体是 <b>pyruvate decarboxylase</b> 那步放的 CO₂。',
 say:'“Because yeast ferments the sugar in the dough. Glycolysis takes glucose to pyruvate, then pyruvate decarboxylase — thiamine diphosphate as prosthetic group — splits off CO₂ to give acetaldehyde, and alcohol dehydrogenase reduces that to ethanol to regenerate NAD-plus. The CO₂ is the gas that lifts the dough; the ethanol evaporates in the oven. Yeast is a facultative anaerobe — the textbook’s example — so it does this whenever sugar is plentiful and oxygen is not.”'},

{q:'Why does wine contain alcohol?', odd:1,
 mean:'同一个答案，另一个入口：乙醇是<b>NAD⁺ 再生的副产物</b>，不是目的。',
 say:'“Because ethanol is how yeast regenerates NAD-plus when it has sugar but no oxygen. Glycolysis makes two NADH per glucose and the cell has only a small pool of NAD-plus; the textbook says that without reoxidising it, glycolysis would stop at glyceraldehyde-3-phosphate. Yeast solves it in two steps — pyruvate decarboxylase to acetaldehyde and CO₂, alcohol dehydrogenase to ethanol — and the ethanol is simply excreted. So the alcohol in wine is a waste product of the yeast’s bookkeeping, not something it wanted.”'},

{q:'Why is glucose the sugar the body runs on?', odd:1,
 mean:'一半在书里（糖酵解几乎普适、血里运的是葡萄糖、别的糖都汇进来），一半是进化（为什么偏偏是葡萄糖）——<b>第二半标 general 并停在进化地基上。</b>',
 say:'“Partly because glycolysis is almost universal — the textbook’s word — and it starts from glucose: blood carries glucose, the cell takes it up and phosphorylates it, and every other carbohydrate is funnelled into the same trunk — glycogen by phosphorolysis, galactose by epimerisation at C-4, fructose by hexokinase. Why glucose rather than another hexose was chosen is an evolutionary question; the usual argument, which is general knowledge, is that glucose is the aldohexose that most strongly prefers the ring form, so its aldehyde is least exposed and it damages proteins least — but that is a hypothesis about history, not something one can measure today.”'},

{q:'Why does a diabetic’s blood sugar matter?', odd:1,
 mean:'问的是<b>葡萄糖必须先进细胞才能进糖酵解</b>；书对糖尿病只有一句（acetyl-CoA 泛滥 → 酮体）。',
 say:'“Because glucose only counts once it is inside a cell: the textbook says blood glucose must first be taken up by the cell, and only then, in the cytosol, does glycolysis begin. Insulin — the textbook says it acts by stimulating the tyrosine-kinase activity of its receptor — is what lets muscle and fat take glucose up; without that signal glucose stays in the blood while the cells run on fat instead, and the textbook adds the consequence: when the organism is flooded with acetyl-CoA, as in diabetes, two of them condense into acetoacetate and acetone. That the glucose transporter is insulin-dependent is general knowledge, not the textbook’s.”'},

{q:'Why does cyanide kill you if it does not stop glycolysis?', odd:1,
 mean:'<b>书里没有氰化物</b>——全书 0 命中。通用答案：它堵的是呼吸链末端，糖酵解照跑但只剩 2 ATP。',
 say:'“Cyanide is not in the textbook, so this is general knowledge: it blocks cytochrome oxidase, the last complex of the respiratory chain, so oxygen can no longer accept electrons. Glycolysis itself does not use oxygen and keeps running — but it is now the only source of ATP, two per glucose instead of thirty-eight, and NADH can only be reoxidised by making lactate. Tissues that need a lot of ATP, brain and heart, cannot live on that. So glycolysis does not stop; it is simply not enough.”'},

{q:'Why do tubes for blood-glucose samples contain fluoride?', odd:1,
 mean:'<b>实验室题。</b>通用：氟化物抑制 enolase，红细胞的糖酵解停了，血糖在管子里就不会被吃掉。',
 say:'“Because the red cells in the sample would otherwise keep running glycolysis and eat the glucose before it is measured. Fluoride inhibits enolase — the enzyme that dehydrates 2-phosphoglycerate to phosphoenolpyruvate — so the pathway stops and the glucose concentration is preserved. That is general knowledge; the textbook gives enolase without its inhibitor.”'},

{q:'Why do you keep breathing hard for minutes after a sprint?', odd:1,
 mean:'问的是<b>乳酸的债要用氧还</b>：肝把乳酸再造成糖，书说每个三碳糖要三个高能磷酸。',
 say:'“Because the lactate made during the sprint has to be dealt with afterwards, and that costs oxygen. The textbook says the muscle lacks the main gluconeogenesis enzymes, so lactate travels in the blood to the liver, which remakes glucose from it — and it gives the price: three macroergic phosphates per triose phosphate, so six per glucose, against the two ATP the sprint got from it. That ATP is made aerobically, so the oxygen debt is repaid after the run. The name for the loop, the Cori cycle, is general knowledge — the textbook describes it without naming it.”'}
],

/* ---------------- 追问 ---------------- */
ask:[
{g:'定义类', gn:'这题名词密度很高——每个酶的类名、每个辅酶、每个能量词，他都能单独拎出来问。', items:[
{r:'实测', q:'What is substrate-level phosphorylation?',
 en:'“Substrate-level phosphorylation is the formation of ATP by a soluble enzyme transferring a phosphate group directly from a macroergic intermediate onto ADP — no membrane, no proton gradient, no oxygen. The textbook names it at phosphoglycerate kinase: the macroergically bound phosphate of 1,3-bisphosphoglycerate is transferred to ADP. Glycolysis has two — that one and pyruvate kinase, from phosphoenolpyruvate — and the citric acid cycle one more, succinyl-CoA synthetase, which makes GTP. The contrast is oxidative phosphorylation, where ATP synthase in the inner membrane makes ATP from a proton gradient.”',
 cn:'<i>substrátová fosforylace</i> 全书只在 p165 出现一次，就是以 PGK 为例。卡 24 点 11 是第三个例子。<span class="pg">p165</span>'},
{r:'高', q:'What is a macroergic compound?',
 en:'“A macroergic compound is a metabolite held in an energetically unstable state by a single bond, so that hydrolysing that bond releases 30 to 60 kJ per mole, against under 12 for an ordinary bond — the textbook’s definition, and it insists on saying compound rather than bond, because the instability belongs to a larger part of the molecule. Glycolysis makes two: 1,3-bisphosphoglycerate, an acyl phosphate — an anhydride — at minus 49.3, and phosphoenolpyruvate, an enol phosphate, at minus 61.9; both are above ATP’s minus 30.5 in the table, which is why they can donate their phosphate to ADP.”',
 cn:'p131 定义、p132 四类（酐、磷酰胺、烯醇磷酸、硫酯）、p133 Tab. 6.1。<b>详见横向卡「化学键」点 02、09、15</b>——这里不重复。<span class="pg">p131 p132 p133</span>'},
{r:'高', q:'What are NAD⁺ and NADH?',
 en:'“NAD-plus, nicotinamide adenine dinucleotide, is the coenzyme of the dehydrogenases in its oxidised form: it reversibly binds hydrogen at C-4 of the nicotinamide ring — a hydride, two electrons and a proton — and in doing so the ring loses its aromatic character and its positive charge, giving NADH. The textbook’s division of labour: NAD-plus works in degradation and the reactions leading to ATP, while NADPH — the same molecule with an extra phosphate on the 2-prime of the adenosine — is the reducing equivalent for biosynthesis. In glycolysis NAD-plus is loosely bound and needed in stoichiometric amount, so kinetically it behaves as a second substrate of the dehydrogenase.”',
 cn:'p044 结构和功能；「动力学上像底物」在 p043（卡 18 点 06）。<b>Harden 和 Young 1905 年分离出的第一个辅酶就是 NAD</b>（书 p009 表 1.1）——而他们分离它用的正是酵母的发酵汁。<span class="pg">p009 p043 p044</span>'},
{r:'高', q:'Kinase, isomerase, mutase, aldolase, dehydrogenase, enolase, decarboxylase — what do the class names mean?',
 en:'“A kinase transfers a phosphate from ATP to a substrate — a transferase; hexokinase’s systematic name in the textbook is ATP:hexose phosphotransferase — and phosphoglycerate kinase and pyruvate kinase run the same reaction backwards, onto ADP. An isomerase rearranges a molecule without changing its formula — aldose to ketose here. A mutase is an isomerase that moves a group from one position to another in the same molecule. An aldolase is a lyase that makes or breaks a carbon–carbon bond by aldol condensation or its reverse. A dehydrogenase is an oxidoreductase that removes two hydrogens and hands them to a coenzyme, NAD-plus or FAD. An enolase is a lyase that removes water to leave an enol. A decarboxylase is a lyase that splits off CO₂.”',
 cn:'六大类在 p041–p042（卡 18 追问「六类酶」）；hexokinase 系统名 p042；lyase 包括 aldolase、enolase、decarboxylase（书 p042 lyase 的定义：非水解非氧化地断键，常生成双键，或加成到双键）。<b>这一条是横向卡「反应类型的名字」的一半。</b><span class="pg">p041 p042</span>'},
{r:'高', q:'Aerobic, anaerobic, facultative — what do the words mean here?',
 en:'“Aerobic means using oxygen as the final electron acceptor; anaerobic means running without it. Glycolysis itself is neither — no step touches oxygen — so the honest phrase is oxygen-independent. What is aerobic or anaerobic is what happens to pyruvate and NADH afterwards. Organisms: obligate aerobes need oxygen, obligate anaerobes are poisoned by it, and facultative anaerobes — the textbook’s example is yeast — switch between the two schemes according to conditions.”',
 cn:'p016 三类生物；p136 <i>anaerobní procesy (glykolýza, kvašení)</i>——书自己把糖酵解叫「厌氧过程」，所以他要是这么说，接受，但补一句「不用氧，产量依赖氧」。<span class="pg">p016 p136</span>'},
{r:'中', q:'What is the cytosol?',
 en:'“The cytosol is the soluble, aqueous part of the cytoplasm — everything inside the plasma membrane that is not an organelle: the water, ions, small metabolites and soluble enzymes. Glycolysis, the pentose phosphate pathway and fatty-acid synthesis are cytosolic; the citric acid cycle is in the mitochondrial matrix and the respiratory chain in the inner membrane. That is general vocabulary — the textbook uses the word without defining it.”',
 cn:'通用。书 p164 <i>v cytosolu</i>、p162 磷酸戊糖 <i>v cytosolu</i>、p220 脂肪酸合成 <i>v cytoplasmě</i>。<b>区室那张横向卡（待做）要从这里接。</b>'},
{r:'高', q:'Hexokinase or glucokinase — what is the difference?',
 en:'“Both phosphorylate glucose at C-6 with ATP. Hexokinase, the textbook says, phosphorylates many hexoses — glucose, fructose, mannose — and is the general enzyme; glucokinase is specific for glucose and is the more important enzyme in the liver. Beyond the textbook: glucokinase has a much higher K m, so it works only when blood glucose is high after a meal, and it is not inhibited by glucose-6-phosphate the way hexokinase is — which lets the liver store glucose as glycogen when there is a surplus. Those two points are general knowledge.”',
 cn:'p164 两个酶；Km 和产物抑制的差别是 Lehninger。<b>「第一步有两个酶」是 very specific 题的典型弹药。</b><span class="pg">p164</span>'},
{r:'中', q:'What does allosteric mean?',
 en:'“Allosteric control is inhibition or activation of an enzyme by a metabolite that binds not in the active site but at another site on the protein, and acts by changing the enzyme’s conformation — the textbook’s definition. Phosphofructokinase, controlled by ATP and ADP, is its glycolytic example; glyceraldehyde-3-phosphate dehydrogenase is also called allosteric, with NAD-plus as its activator.”',
 cn:'p221 定义；p164 PFK；p165 GAPDH。卡 19 有完整的变构内容。<span class="pg">p164 p165 p221</span>'},
{r:'中', q:'What is phosphorolysis?',
 en:'“Phosphorolysis is cleavage of a bond by phosphate instead of by water — the phosphate ends up on one of the products. Two places in this topic: glycogen phosphorylase cleaves the glycosidic bond to release glucose-1-phosphate, which saves the ATP hexokinase would have spent; and in glyceraldehyde-3-phosphate dehydrogenase, phosphate cleaves the thioester on the enzyme, which is how the acyl phosphate 1,3-bisphosphoglycerate is made.”',
 cn:'p164 糖原；p165 GAPDH（<i>štěpí fosforolyticky</i>）；p174 节能。<span class="pg">p164 p165 p174</span>'},
{r:'中', q:'Aldose, ketose, triose, hexose — what are they?',
 en:'“A monosaccharide is named by its carbonyl and by its length. An aldose carries the carbonyl as an aldehyde at C-1 — glucose, glyceraldehyde; a ketose carries it as a ketone, at C-2 — fructose, dihydroxyacetone. A triose has three carbons, a hexose six. So glycolysis converts an aldohexose to a ketohexose, splits that into two triose phosphates — one aldose, one ketose — and interconverts them.”',
 cn:'p148–p149 §7.1.1（她没学的那一节，但这里只需要四个词）。<span class="pg">p148 p149</span>'},
{r:'中', q:'What do the equilibrium percentages — 30, 89, 96 — actually mean?',
 en:'“They say what an enzyme cannot do: an enzyme speeds up a reaction but does not shift its equilibrium. Left alone, the isomerase mixture settles at 30 per cent fructose-6-phosphate, the aldolase mixture at 89 per cent hexose, the triose mixture at 96 per cent dihydroxyacetone phosphate — all of them against the direction of glycolysis. The pathway still runs forward because the irreversible steps and the consumption of glyceraldehyde-3-phosphate keep removing the product, so those reversible steps are pulled, not pushed. That is the textbook’s own point about the triose step: the isomerase only speeds up the equilibrium, and dihydroxyacetone phosphate is drawn across as the next reactions consume the other triose.”',
 cn:'三个数都在 p164。<b>这一条是「书给的数字」和「酶动力学的原理」相遇的地方</b>——比单背三个百分数值钱。<span class="pg">p164</span>'},
{r:'中', q:'What is a coupled reaction — how does hexokinase make an endergonic step go?',
 en:'“Coupling means an endergonic reaction — positive free-energy change, which would not run on its own — is driven by an exergonic one because the two share an intermediate and the free-energy changes of consecutive steps add. The textbook’s example is exactly hexokinase: glucose plus phosphate to glucose-6-phosphate is plus 13.8 kJ per mole; ATP hydrolysis is minus 30.5; the sum, glucose plus ATP to glucose-6-phosphate plus ADP, is minus 16.7 and runs. The phosphate never goes through free phosphate — it is transferred directly on the enzyme.”',
 cn:'p131 §6.1.1 原例。<b>书讲偶联就是用糖酵解第一步讲的</b>，所以这一条是安全的引用。<span class="pg">p131</span>'}
]},

{g:'为什么类', gn:'四个「为什么」有书作根据，其余标通用。这一组比十个酶名值钱。', items:[
{r:'高', q:'Why phosphorylate glucose first, at the cost of ATP?',
 en:'“Three reasons, one from the textbook. The textbook’s: the first step of carbohydrate metabolism is always to make a phosphorylated monosaccharide — sugars are handled as phosphate esters. The general ones: a phosphorylated sugar carries negative charge and cannot cross the membrane, so it is trapped in the cell and the glucose gradient into the cell is maintained; and the two phosphates are what the later chemistry needs — after the split each triose carries one, and the acyl phosphate and enol phosphate that pay for the ATP are built on that scaffold. So the two ATP are an investment that the payoff phase returns twice over.”',
 cn:'p219 第一句；「困在细胞里」和「每个三碳糖带一个磷酸」是通用推理——说的时候说成 “the general reasons”。<span class="pg">p219</span>'},
{r:'高', q:'Why isomerise glucose to fructose before splitting it?',
 en:'“Because of where aldolase can cut. An aldol cleavage breaks the carbon–carbon bond one position away from a carbonyl — between the alpha and beta carbons. In glucose the carbonyl is at C-1, so the cut would fall between C-2 and C-3 and give a two-carbon and a four-carbon piece. Moving the carbonyl to C-2 — fructose — puts the cut between C-3 and C-4, and the hexose splits into two equal three-carbon halves, each of which can carry a phosphate. That is general organic chemistry; the textbook only says the isomerase converts an aldose to a ketose and gives the equilibrium.”',
 cn:'通用；书 p164 只给「醛糖变酮糖」和 30%。<b>这一条是 aldolase 那步「为什么」的正解</b>，值得会说。'},
{r:'高', q:'Why oxidise before making ATP — why not make ATP straight from the sugar?',
 en:'“Because the free energy that pays for the ATP is released only in the oxidation. The textbook says the dehydrogenation of the aldehyde is strongly exergonic and is coupled to the uptake of phosphate: the aldehyde first becomes a thioester on the enzyme, which is macroergic, and phosphate then cleaves it into an acyl phosphate, 1,3-bisphosphoglycerate, at minus 49.3 — above ATP. Without that oxidation there is no compound above ATP in the table to donate a phosphate; the sugar phosphates themselves are all below ATP — glucose-6-phosphate at minus 13.8, fructose-6-phosphate at minus 15.9 — which is exactly why they are phosphate acceptors, not donors.”',
 cn:'p164 强放能、偶联；p165 硫酯；p133 表的上下分组（<b>ATP 上面的是供体，下面的是受体</b>）。<b>拿表说比拿理论说稳。</b><span class="pg">p133 p164 p165</span>'},
{r:'高', q:'Why are exactly three steps irreversible?',
 en:'“Because those three have a large negative free-energy change under cell conditions, so the reverse reaction is negligible: hexokinase and phosphofructokinase each spend an ATP anhydride to make an ordinary phosphate ester — minus 30.5 in, about minus 14 to minus 16 kept, the rest released — and pyruvate kinase cashes the enol phosphate at minus 61.9 into an ATP at minus 30.5. The other seven run close to equilibrium. The textbook draws the consequence twice: these are the steps gluconeogenesis cannot simply reverse — it needs a hydrolase for each phosphorylation and the oxaloacetate detour for pyruvate kinase — and phosphofructokinase, as the practically irreversible step, is the control enzyme.”',
 cn:'p219（两次己糖磷酸化不可逆、需要水解酶）、p169（PK 不可逆）、p222（控制酶）。「其余七步接近平衡」是通用（Lehninger 给了每步的实际 ΔG）。<span class="pg">p169 p219 p222</span>'},
{r:'高', q:'Why does yeast make ethanol and muscle lactate, if both only need NAD⁺ back?',
 en:'“Because they have different enzymes for the same purpose, and both routes regenerate exactly one NAD-plus per pyruvate. Muscle has lactate dehydrogenase: one step, reversible, and the carbon stays as a three-carbon acid the liver can turn back into glucose — the textbook says the lactate is temporary. Yeast has pyruvate decarboxylase and alcohol dehydrogenase: it throws away a carbon as CO₂ and excretes a neutral, volatile product that does not acidify its surroundings — and ethanol is toxic to competitors. Why evolution gave each its route is a question about history, and I would stop there.”',
 cn:'p167 两条路；「乳酸是暂时的」p164；毒性和竞争是通用推测。<b>停在进化那块地基上。</b><span class="pg">p164 p167</span>'},
{r:'中', q:'Why is phosphofructokinase the control point and not hexokinase?',
 en:'“Because glucose-6-phosphate is not yet committed to glycolysis: the textbook lists its other exits — into glycogen, and into the pentose phosphate pathway. Fructose-1,6-bisphosphate has only one way to go. So the first practically irreversible step that belongs to glycolysis alone is phosphofructokinase, and that is the one the textbook calls rate-limiting and allosterically controlled. Hexokinase is regulated too — product inhibition by glucose-6-phosphate, general knowledge — but it controls the supply of hexose phosphate, not glycolysis.”',
 cn:'p219 列了 G6P 的三条去路（糖酵解、磷酸戊糖、糖原）；「first committed step」是通用术语。<span class="pg">p164 p219</span>'},
{r:'中', q:'Why is 2,3-bisphosphoglycerate called the coenzyme of the mutase?',
 en:'“Because it is needed in catalytic amount and is regenerated every cycle, which is what a coenzyme does — yet it is also just an intermediate, which is why the textbook puts the word in quotation marks. The phosphorylated enzyme gives its phosphate to C-2 of 3-phosphoglycerate, making 2,3-bisphosphoglycerate on the enzyme; the enzyme then takes the C-3 phosphate back, releasing 2-phosphoglycerate. Net effect: the phosphate has moved from C-3 to C-2, and the enzyme is phosphorylated again.”',
 cn:'p166 机制。<span class="pg">p166</span>'}
]},

{g:'怎么发现的', gn:'书的表 1.1 给了两条；EMP 三个人名书里没有。', items:[
{r:'中', q:'How was it discovered that fermentation is chemistry, not life?',
 en:'“Buchner, 1897 — the textbook’s table of milestones lists it as the proof of the chemical nature of fermentation: a cell-free yeast extract, ground yeast with no living cells, still fermented sugar to ethanol and CO₂. Until then fermentation was thought to need the living cell. Eight years later, in 1905, Harden and Young — also in the textbook’s table — found that the extract lost activity on dialysis and regained it when the small-molecule fraction was added back: the first coenzyme, NAD. Both discoveries were made on this pathway.”',
 cn:'<b>两条都在书 p009 Tab. 1.1</b>：1897 Buchner <i>Důkaz chemické povahy kvašení</i>；1905 Harden a Young <i>Izolace prvního koenzymu (NAD)</i>。「透析失活」的细节是通用史实。<span class="pg">p009</span>'},
{r:'中', q:'Who worked out the pathway — why is it sometimes called the Embden–Meyerhof pathway?',
 en:'“The names are not in the textbook. Embden, Meyerhof and Parnas, working in the 1920s and 30s in Germany and Poland, pieced together the sequence of phosphorylated intermediates from muscle and yeast extracts — Meyerhof got the Nobel Prize in 1922 for the relation between lactate and oxygen consumption in muscle — so the full name is the Embden–Meyerhof–Parnas pathway. That is general knowledge; the textbook simply calls it glycolysis.”',
 cn:'全书 0 命中；<b>说的时候标 general</b>。1922 年 Meyerhof 的诺贝尔奖是通用史实。'},
{r:'中', q:'What is the Pasteur effect?',
 en:'“The observation, general knowledge rather than the textbook’s, that a facultative cell consumes far less glucose when oxygen is present: with oxygen each glucose yields thirty-odd ATP instead of two, so the cell needs fewer of them, and the allosteric brake on phosphofructokinase — high ATP, low AMP — slows glycolysis down. It is the regulatory consequence of the two-versus-thirty-eight arithmetic the textbook gives.”',
 cn:'通用；数字依据 p136。'}
]},

{g:'陷阱', gn:'每一条都是「知识对、出口错」的地方——考的是嘴。', items:[
{r:'实测', q:'So glycolysis makes four ATP?',
 en:'“It makes four and spends two, so the net is two. The textbook writes the table: minus one at hexokinase, minus one at phosphofructokinase, plus two at phosphoglycerate kinase, plus two at pyruvate kinase — gain, plus two. If I say four, I have forgotten the investment; if I say two, I should be able to show the four.”',
 cn:'p166 的表就是为这个问题存在的。<span class="pg">p166</span>'},
{r:'高', q:'Is the energy captured in NADH — so glycolysis really makes more than two ATP?',
 en:'“NADH is reducing power, not ATP. Whether it becomes ATP depends entirely on oxygen: with it, the respiratory chain turns each into about three ATP in the textbook’s count — that is how the textbook gets eight for glycolysis in the aerobic total — without it, the NADH has to be spent on pyruvate to make lactate or ethanol, and its energy is simply handed back. So the textbook is right to say two on one page and eight on another; the difference is oxygen.”',
 cn:'p136/p166 说 2，p139 说 8——<b>书内两个数，用氧解释，不矛盾。</b><span class="pg">p136 p139 p166</span>'},
{r:'高', q:'Glycolysis is anaerobic — so it happens only without oxygen?',
 en:'“No — it happens all the time; it is oxygen-independent, not oxygen-excluding. In an aerobic cell glycolysis is still the only way glucose gets to pyruvate; what oxygen changes is the fate of pyruvate and NADH, and hence the yield. The textbook does file glycolysis under anaerobic processes, and that is fair in the sense that it needs no oxygen — but the sentence should be: glycolysis runs with or without oxygen, fermentation is what happens without.”',
 cn:'p136 <i>Anaerobní procesy (glykolýza, kvašení)</i>——<b>书自己把糖酵解叫厌氧过程</b>，所以他这么说时别纠正他，补一句区分就行。<span class="pg">p136</span>'},
{r:'高', q:'Thirty-eight or thirty-two?',
 en:'“Both are quoted, and I would give the textbook’s figure first: thirty-eight, from three ATP per NADH and two per FADH₂. The modern figure is thirty to thirty-two because the measured proton stoichiometry gives about 2.5 and 1.5, and because the two glycolytic NADH are made in the cytosol and must enter the mitochondrion through a shuttle — the glycerol-3-phosphate shuttle hands them to FAD, worth 1.5 each, the malate–aspartate shuttle to NAD-plus, worth 2.5. The difference is in how you count the respiratory chain, not in glycolysis itself.”',
 cn:'跟卡 24 点 15 同一个处理；穿梭是通用。<b>报数前先说「书用 3 和 2」。</b><span class="pg">p139 p146</span>'},
{r:'高', q:'Glucose is oxidised to CO₂ in glycolysis — correct?',
 en:'“No. Glycolysis releases no CO₂ at all: glucose, six carbons, gives two pyruvate, three carbons each — all six are still there. The only oxidation is one aldehyde to a carboxylate per triose, and that is where the two NADH come from. CO₂ first appears afterwards — in yeast at pyruvate decarboxylase, aerobically at pyruvate dehydrogenase and then twice in the citric acid cycle. The textbook’s numbers make the point: lactate fermentation releases only minus 196.6 kJ per mole out of the minus 2870 of complete oxidation.”',
 cn:'p135 两个 ΔG；p167 PDC 放 CO₂；p168 PDH 放 CO₂。<span class="pg">p135 p167 p168</span>'},
{r:'中', q:'Is lactate a waste product?',
 en:'“Not in the textbook’s account: it says the lactate is temporary. Muscle cannot use it — the textbook says the main gluconeogenesis enzymes are missing there — but it travels in the blood to the liver, which remakes glucose from it and sends the glucose back; with oxygen, muscle can also oxidise it further. And the same enzyme, lactate dehydrogenase, runs both ways — five isoenzymes with different kinetics, which the textbook says the organism uses for regulation.”',
 cn:'p164 <i>dočasně</i>；p170 肌肉缺酶、乳酸到肝；p064–p065 LDH 同工酶。<span class="pg">p064 p065 p164 p170</span>'},
{r:'中', q:'Is hexokinase the regulated step of glycolysis?',
 en:'“Not the one the textbook names — it names phosphofructokinase, as the rate-limiting, practically irreversible, allosterically controlled step, and again in chapter 10 as its example of a control enzyme. Hexokinase is regulated too, by its product glucose-6-phosphate, but that is general knowledge and it controls the supply of hexose phosphate, which also goes to glycogen and the pentose phosphate pathway — so it is not glycolysis’s own control point.”',
 cn:'p164、p222；G6P 抑制通用。<span class="pg">p164 p222</span>'},
{r:'中', q:'The textbook’s chapter 10 lists different key steps — the split, the oxidation, the dehydration. Which list is right?',
 en:'“Both — they answer different questions. Chapter 7 names phosphofructokinase as rate-limiting, which is about control: where the flux is set. Chapter 10 calls the aldolase cleavage, the glyceraldehyde-3-phosphate dehydrogenation and the enolase dehydration the key points, which is about chemistry: where the hexose is split, where the only oxidation happens, and where the enol phosphate is made. Control and chemistry need not sit on the same steps — and here they do not.”',
 cn:'p164 vs p219——<b>书内两张单子，判据不同</b>。这是「用书打书」的温和版：不是矛盾，是两个问题。<span class="pg">p164 p219</span>'}
]},

{g:'相邻考点', gn:'第 7 章和第 6 章紧挨着的内容，他从这题走出去多半走这几个方向。', items:[
{r:'高', q:'What happens to pyruvate in the mitochondrion?',
 en:'“Oxidative decarboxylation to acetyl-CoA by the pyruvate dehydrogenase complex: pyruvate plus NAD-plus plus coenzyme A give acetyl-CoA, CO₂ and NADH. The textbook lists the cofactors — thiamine diphosphate, which takes the two-carbon fragment after CO₂ leaves; lipoic acid, which oxidises it and carries the acetyl; coenzyme A, which receives it as a thioester; and FAD and NAD-plus, which reoxidise the lipoate. Acetyl-CoA then enters the citric acid cycle — that is card 24. The textbook adds that this NADH, like the glycolytic one, is reoxidised by the respiratory chain, worth about three ATP.”',
 cn:'p168–p169；卡 24 点 10 的机制是同一套。<span class="pg">p168 p169</span>'},
{r:'高', q:'What is the pentose phosphate pathway?',
 en:'“The textbook’s ‘two routes to pentose phosphates’: a cytosolic alternative to glycolysis that makes NADPH and ribose-5-phosphate instead of ATP. The oxidative route starts from glucose-6-phosphate: glucose-6-phosphate dehydrogenase gives a lactone, a lactonase opens it to 6-phosphogluconate, a second oxidation and decarboxylation give ribulose-5-phosphate — NADP-plus is the acceptor in both oxidations — and an isomerase gives ribose-5-phosphate. The non-oxidative route rearranges fructose-6-phosphate and glyceraldehyde-3-phosphate — both borrowed from glycolysis — with transketolase, which needs thiamine diphosphate, and transaldolase; it is reversible, so surplus pentoses can flow back into glycolysis. The textbook says the cell uses it for pentoses and biosynthetic NADPH, not for burning glucose.”',
 cn:'p162–p163 §7.7。<b>这是「书里没有题的七块」之一</b>——只要眼熟。接口就在 F6P 和 GAP 两个共享的中间物上。<span class="pg">p162 p163</span>'},
{r:'高', q:'What is gluconeogenesis?',
 en:'“The resynthesis of glucose — in the textbook, from the lactate of anaerobic glycolysis, or from amino acids that give pyruvate or four-carbon dicarboxylic acids. It runs as glycolysis in reverse from phosphoenolpyruvate up to the hexose, but the three irreversible steps need detours: pyruvate is carboxylated to oxaloacetate — pyruvate carboxylase, biotin, ATP — and oxaloacetate is phosphorylated with GTP to phosphoenolpyruvate, because its enol form is easier to make; and the two phosphorylations are undone by hydrolysis, fructose-1,6-bisphosphate to fructose-6-phosphate and glucose-6-phosphate to glucose, releasing phosphate rather than making ATP. The textbook gives the price: three macroergic phosphates per triose phosphate. It happens in the liver — muscle lacks the enzymes.”',
 cn:'p169–p170 §7.9；pyruvate carboxylase 在 p140；酶名 PEP carboxykinase、fructose-1,6-bisphosphatase、glucose-6-phosphatase 书没给（通用）。<span class="pg">p140 p169 p170</span>'},
{r:'中', q:'How is glycogen breakdown coordinated with glycolysis?',
 en:'“Glycogen phosphorylase releases glucose-1-phosphate by phosphorolysis; the textbook says synthesis and breakdown are controlled together by an amplifying cascade — adrenaline and glucagon raise cyclic AMP, which activates a protein kinase; the kinase phosphorylates glycogen synthase, inactivating it, and phosphorylase kinase, which phosphorylates phosphorylase into its much more active a form; protein phosphatases reverse both. So phosphorylase is the textbook’s example of a covalently modulated enzyme, and the same hormones that mobilise glycogen feed glucose-6-phosphate into glycolysis.”',
 cn:'p174–p175；卡 18 的「共价调节酶」追问用的就是 phosphorylase a/b。<span class="pg">p174 p175</span>'},
{r:'中', q:'What are the lactate dehydrogenase isoenzymes?',
 en:'“Five tetramers built from two kinds of subunit — H for heart and M for muscle, under two different genes on different chromosomes — H₄, H₃M, H₂M₂, HM₃ and M₄; relative molecular mass 140 000, each binding four NAD-plus. They catalyse the same reaction with different kinetic properties, which the textbook says the organism uses to regulate metabolism, and they separate by electrophoresis. General knowledge adds the direction: the M form favours pyruvate to lactate in anaerobic muscle, the H form lactate to pyruvate in aerobic heart.”',
 cn:'p064–p065（书说这是最著名的同工酶例子）；方向偏好是通用。<span class="pg">p064 p065</span>'},
{r:'中', q:'How does the NADH from glycolysis get into the mitochondrion?',
 en:'“It does not — the inner membrane is impermeable to NADH, so only its electrons cross, by a shuttle: the glycerol-3-phosphate shuttle reduces dihydroxyacetone phosphate in the cytosol and reoxidises it on the membrane, handing the electrons to FAD, worth about 1.5 ATP; the malate–aspartate shuttle reduces oxaloacetate to malate, which enters and is reoxidised to give matrix NADH, worth 2.5. That is general knowledge — the textbook simply counts the glycolytic NADH at three, which assumes it arrives intact.”',
 cn:'通用；书 p139 的 8 隐含了 NADH 按 3 兑。跟卡 24 点 15 一致。'}
]},

{r:'中', q:'书给的数字',

{r:'中', q:'金属和辅基',

{r:'高', q:'You work with yeast — what does glycolysis have to do with your experiments?',
 en:'“Two things, both on the textbook’s pages. First, the sugar. Yeast is the textbook’s example of a facultative anaerobe: in glucose it ferments to ethanol, and when I switch the culture to galactose to induce my display construct, the galactose enters glycolysis through galactokinase, hexose-1-phosphate uridyltransferase and UDP-glucose-4-epimerase — the route the textbook calls the most important metabolic pathway of galactose; that glucose represses the GAL promoter is general molecular biology. Second, the enzymes. Phosphofructokinase is the textbook’s allosteric enzyme and lactate dehydrogenase its isoenzyme family — the same reaction with different constants. What I measure is the same kind of difference on a binding protein: variants of one scaffold, each with its own dissociation constant.”',
 cn:'p016 兼性厌氧；p172 半乳糖；p164 PFK；p064–p065 LDH。<b>Crabtree 效应</b>（有氧、高糖时酵母仍发酵）是通用，被追问时说成自己的。<b>不点病原体的名字。</b>完整的 Kd 内容在<b>卡 02</b>。<span class="pg">p016 p064 p065 p164 p172</span>'},
{r:'中', q:'Hexokinase is the classic induced-fit enzyme — do you use that idea?',
 en:'“Yes — and that is general knowledge, not the textbook’s example: when glucose binds, the two lobes of hexokinase close over it, which is why the enzyme does not simply hydrolyse ATP with water, even though water would fit — the closure needs the substrate. The textbook does describe induced fit itself, and draws the consequence that only a true substrate can force the conformational change, so a molecule that binds without triggering it acts as an inhibitor. Binding and turnover are separable — and binding is the half I measure, as a dissociation constant.”',
 cn:'Koshland 1958 用的就是 hexokinase（通用）；书 p062 讲诱导契合但没用这个例子。<b>这条把卡 18 点 17–19 接回主场。</b>'}

<script>
/* data/06.js */
/* 卡 06 · Draw the structure of glucose in Fischer and Haworth projections.
   题库 #6（S1 Biochemistry 6 ＋ S2 Biochemistry 1）· 导师写过两遍 · 并入 #22 碳水的结构与功能（S3 Biochemistry 9）
   出处 Biochemie OCR p148–p160（§7.1–§7.6）、p170–p175（§7.10–§7.12 后门）、p036、p052、p112、p162
   题型：画题。全套里唯一一道题面写着 Draw 的题。没有图片文件——画法以文字步骤写在速背 04–08，
   p151 / p156 / p172 三处数字已回原图核过（+112° / +18,4° / +52,7°；每 12 个；1 : 3 都是书印的）。
   她没学过这一章，所以这张卡是教，不是提醒。 */

window.CARDS.push({
id:'06', n:6, merged:[22], w:3,
q:'Draw the structure of glucose in Fischer and Haworth projections.',
qcn:'画出葡萄糖的 Fischer 投影式与 Haworth 投影式（＋ #22 糖类的结构与功能）',
sub:'主干说完约 90 秒 · 画题 · 导师写过两遍 · 全书小节密度第一的一章（13 页 12 个小节）',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'他嘴里多半只有一句 “Draw glucose” 或 “What is a carbohydrate?”。先定义、再归类、再功能——画是第二段的事。'},
 {n:'01', t:'定义',
  big:'糖是<b>多羟基的醛或酮</b>，以及由它们连成或改造出来的东西',
  en:'“A carbohydrate is a <b>polyhydroxy aldehyde or ketone</b>, or a compound built from one. The textbook defines the monosaccharides — the simplest sugars — as aldehydes or ketones carrying <b>two or more hydroxyl groups</b>, general formula (CH₂O)n. Everything else in the class is either monosaccharides joined by <b>glycosidic bonds</b> — the bond from the former carbonyl carbon of one sugar to a hydroxyl of the next — or a derivative made by changing one group on a monosaccharide: a phosphate ester, an acid, a sugar alcohol, an amino sugar, a deoxy sugar.”',
  note:'书没有一句「sacharid 是什么」的总定义——第 7 章开头直接讲功能。定义是从三处拼的：单糖的定义在 §7.1.1（<span class="pg">p148</span>），糖苷键连成寡糖和多糖在 §7.3（<span class="pg">p154</span>），衍生物在 §7.2（<span class="pg">p152</span>）。<b>所以说 “the textbook defines the monosaccharides as…”，别说 “the textbook defines carbohydrates as…”。</b>「多羟基醛/酮」是通用叫法，跟书的「含两个以上羟基的醛或酮」是一回事。'},
 {n:'02', t:'归类',
  big:'三条轴：<b>大小</b>（单 / 寡 ≤10 / 多）· <b>羰基</b>（醛糖 / 酮糖）· <b>碳数</b>（三碳到七碳）',
  en:'“We classify them three ways. By <b>size</b>: monosaccharides, oligosaccharides — the textbook draws the line at ten residues — and polysaccharides. By the <b>carbonyl</b>: an aldose has the aldehyde on carbon one, a ketose has the ketone on carbon two — glucose is an aldose, fructose a ketose. And by <b>carbon number</b>: trioses, tetroses, pentoses, hexoses, heptoses — glyceraldehyde and dihydroxyacetone are the smallest, three carbons, the aldotriose and the ketotriose.”',
  note:'三条轴全在书里：≤10 是 <span class="pg">p154</span>；醛糖/酮糖和三碳到七碳是 <span class="pg">p148</span>。<b>先说轴，再往轴上填</b>——跟卡 03 比较题同一招。三条轴互不重叠，所以 glucose 可以同时是 hexose、aldose、monosaccharide。'},
 {n:'03', t:'功能',
  big:'书开章列了四条：<b>储能</b> · <b>核酸的糖</b> · <b>支撑</b> · <b>识别</b>',
  en:'“The textbook opens the chapter with four functions. <b>Energy store</b>: starch in plants and glycogen in animals are mobilised very easily and deliver D-glucose, the primary compound for obtaining energy. <b>Information</b>: D-ribose and 2-deoxy-D-ribose are the pentoses of the RNA and DNA backbone, and the textbook says the conformational flexibility of the sugar ring matters for storing and expressing genetic information. <b>Support</b>: cellulose in plant cell walls — the most abundant organic compound in the biosphere — and chitin in the exoskeleton of insects and crustaceans. And <b>recognition</b>: the carbohydrate parts of glycoproteins on cell surfaces and on secreted proteins play the key role in recognition mechanisms; sugars are also bound to lipids, in membrane glycolipids and lipopolysaccharides.”',
  note:'四条按书 <span class="pg">p148</span> a)–d) 的顺序。书的开场白：糖是自然界最丰富的有机物，占地球有机质的最大份额。<b>「识别」这一条是段 4 的落点</b>：糖蛋白在细胞表面或被分泌——正是卡 13 那道题的「surface and secreted」。'},
 {n:'04', t:'题面里的四个词',
  big:'<b>structure</b> = 哪些原子怎么连、在空间里怎么摆；<b>projection</b> = 把三维分子画到纸上的规则；<b>Fischer</b> 画开链，<b>Haworth</b> 画环',
  en:'“The written question asks me to <b>draw the structure</b> of glucose in <b>Fischer</b> and <b>Haworth projections</b>. Structure here means which atoms are bonded to which and how they sit in space — the constitution and the configuration. A projection is a rule for putting a three-dimensional molecule on flat paper. The Fischer projection draws the open chain vertically, with the horizontal bonds coming toward the viewer, so the configuration at each asymmetric carbon can be read off; the Haworth projection draws the ring flat, seen edge-on, with the groups above or below the plane. I give the definition first and draw second.”',
  note:'<b>题干里的每个实词都要在开口段被界定</b>：structure、projection、Fischer、Haworth 四个词，这一点各给一句。画法本身在第 2 段和追问。Fischer/Haworth 的画图规则是通用有机化学，书 p149–p150 只给了图。<span class="pg">p149 p150</span>'},

 {g:'画 · Fischer', gn:'⚠ 这是全套唯一一道「画」题。没有图片，下面的步骤就是图——<b>拿纸照着画三遍</b>，边画边说。书的原图是 Obr. 7.5（p152）。'},
 {n:'04', t:'画 · 开链',
  big:'竖着写六个碳，C-1 醛基在顶、C-6 CH₂OH 在底；羟基 <b>右 · 左 · 右 · 右</b>',
  en:'“In a Fischer projection the carbon chain is written <b>vertically</b>, with the most oxidised carbon — the aldehyde, carbon one — at the top and the CH₂OH, carbon six, at the bottom. The convention is that <b>vertical bonds go back</b> behind the paper and <b>horizontal bonds come toward you</b>. Carbons two to five are the four asymmetric carbons, each carrying one H and one OH. For D-glucose the hydroxyls go <b>right, left, right, right</b>: carbon two right, carbon three left, carbon four right, carbon five right.”',
  tbl:{head:['','C-2','C-3','C-4','C-5','是什么'],
   rows:[
    ['<b>D-glucose</b>','右','左','右','右','基准'],
    ['<b>D-mannose</b>','<b>左</b>','左','右','右','C-2 差向异构体（p149）'],
    ['<b>D-galactose</b>','右','左','<b>左</b>','右','C-4 差向异构体（p149）']
   ]},
  note:'画的顺序：① 竖线，六个碳点上去；② 顶上写 CHO，底下写 CH₂OH；③ 在 C-2…C-5 四个碳旁边按「右左右右」写 OH，另一边写 H；④ <b>在碳旁边标 1–6</b>——书的 Obr. 7.5 就标了号，标了号他问「哪个是异头碳」你能指。<br>书 <span class="pg">p149</span>：D-glucose 跟 D-mannose 只在 C-2 构型不同，跟 D-galactose 只在 C-4 不同；<b>只在一个不对称碳上构型不同的单糖叫 epimer</b>。',
  warn:'「竖线向后、横线向前」这个投影约定<b>书里没写</b>，书只是用了 Fischer 式（p150、p152）。是通用有机化学——说的时候不要说「书上写」。'},
 {n:'05', t:'D / L 与 2ⁿ',
  big:'D 看的是<b>离羰基最远的那个不对称碳</b>（己糖是 C-5）：OH 在右 = D；跟氨基酸用同一个参照 glyceraldehyde',
  en:'“The D means that the asymmetric carbon <b>farthest from the carbonyl</b> — carbon five in a hexose — has the same configuration as D-glyceraldehyde, whose hydroxyl points right in the projection; it is the same reference the amino acids use. A molecule with n asymmetric carbons and no plane of symmetry has <b>2 to the n</b> stereoisomers: an aldohexose has four, so sixteen aldohexoses, eight D and eight L. And D or L says nothing about which way the sugar rotates polarised light — the textbook says that explicitly.”',
  note:'全在 <span class="pg">p148</span>：D-glyceraldehyde 的投影式里 OH 朝右，是 D 系的基础；多个不对称碳时 D/L 指<b>离醛基或酮基最远</b>的那个；D/L <b>不说明</b>旋光方向 (+)/(−)。2ⁿ 的推导在 §7.1.2：醛丙糖 2 个、醛丁糖 4 个、醛戊糖 8 个（4 D ＋ 4 L）、醛己糖 16 个。酮糖少一个不对称碳：酮己糖 8 个（<span class="pg">p149</span>）。<br><b>氨基酸的 D/L 在卡 01 的追问里</b>，同一个参照物、同一个投影约定——说出这一句等于把两章连起来。'},

 {g:'画 · 成环与 Haworth', gn:'先把「为什么会成环」说清，再画环。这是老师从画题往下挖的第一刀。'},
 {n:'06', t:'成环 · 半缩醛',
  big:'C-5 的 OH 加到 C-1 的醛上 → 分子内<b>半缩醛</b> → 六元环 <b>pyranose</b>；C-1 变成新的不对称碳 → <b>α / β 异头物</b>',
  en:'“In solution the chain closes into a ring. The textbook’s reason is that the <b>carbonyl group is very reactive</b>: the hydroxyl on carbon five adds to the aldehyde on carbon one, giving an intramolecular <b>hemiacetal</b> — one carbon now carrying both an OH and an OR. The ring has five carbons and one oxygen, six members, and is called a <b>pyranose</b> by analogy with pyran. Ring closure turns carbon one into a <b>new asymmetric carbon</b>, so there are two ring forms, α-D-glucose and β-D-glucose. Carbon one is the <b>anomeric carbon</b> and the two forms are <b>anomers</b>.”',
  note:'§7.1.3 <span class="pg">p149 p150</span>，Obr. 7.3 <span class="pg">p151</span>。书的原因就一句：<i>karbonylová skupina je velice reaktivní</i>。「半缩醛」这个词承重——不懂它，「C-1 成了新的不对称碳」就是空话，所以同一句里交代：<b>一个碳上同时挂 OH 和 OR</b>。完整定义在横向卡 bonds 的追问里，这张卡的定义类也有一条。<br>Obr. 7.3 还把开链 C-1 的醛基标成 <b>redukující skupina</b>（还原基团）——这是「还原糖」的出处。'},
 {n:'07', t:'画 · Haworth',
  big:'平放的六边形，<b>环氧在后右角，C-1 在最右</b>，顺时针编号；书的两条换算规则：<b>Fischer 里在右的 → 环下</b>；<b>D 系的 CH₂OH → 环上</b>。C-1 的 OH：<b>下 = α，上 = β</b>',
  en:'“In a Haworth projection the ring is drawn as a flat hexagon seen in perspective, with the <b>ring oxygen at the back right corner</b> and carbon one at the right; the carbons run clockwise — one, two, three, four, five — and then the oxygen. Substituents sit above or below the plane, and the textbook gives the two rules for converting from Fischer: whatever was on the <b>right in the Fischer projection goes below</b> the ring, and for a D-sugar the <b>CH₂OH, carbon six, goes above</b>. So for D-glucose: carbon two OH down, carbon three OH up, carbon four OH down, carbon six up. The anomeric OH on carbon one is the one choice left: <b>down is α, up is β</b> — in the α form it lies on the opposite side of the ring from the CH₂OH. Hydrogens fill the remaining positions.”',
  note:'画的顺序：① 画一个平躺的六边形，把<b>后面那条边</b>画粗一点表示靠近你的是前边（书的图把前边加粗）；② 后右角写 O；③ O 右边那个角是 C-1，然后顺时针 C-2（前右）、C-3（前左）、C-4（左）、C-5（后左）；④ C-5 上方写 CH₂OH（C-6）；⑤ C-2 下、C-3 上、C-4 下写 OH；⑥ C-1 的 OH 写下面就是 α，写上面就是 β；⑦ 空位补 H。<br>两条规则是书 <span class="pg">p150</span> 的原话：<i>primárně alkoholová skupina je u D-řady znázorněna nad rovinou kruhu</i>；<i>substituenty, které v acyklickém vzorci byly napravo, jsou znázorňovány pod rovinou kruhu</i>。α 在下、β 在上是 Obr. 7.3 / 7.5 画出来的，书没用文字说；「α 跟 CH₂OH 异侧」这个判据是通用叫法。',
  good:'<b>书的 Obr. 7.5 a) 还并排画了椅式</b>（<i>židličková konformace</i>），只有图没有文字。被问就说：“The textbook’s figure also shows the chair: the real ring is not flat but puckered, and generally — this is not in the text — the β form has every bulky group, all four hydroxyls and the CH₂OH, <b>equatorial</b>, pointing out from the ring rather than up or down, which is why β-D-glucose is the majority form at equilibrium.”'},
 {n:'08', t:'画 · 对照：果糖是五元环',
  big:'酮糖：C-2 的酮 ＋ C-5 的 OH → <b>半缩酮</b> → 五元环 <b>furanose</b>；α/β 看的是 <b>C-2</b>。游离果糖却偏好六元环——书自己加的限定词',
  en:'“Fructose is the contrast: a <b>ketose</b>, so the carbonyl is on carbon two. The ketone on carbon two reacts with the hydroxyl on carbon five to give a <b>hemiketal</b>, and that ring has four carbons and an oxygen — five members — a <b>furanose</b>, by analogy with furan; here α and β refer to the hydroxyl on <b>carbon two</b>, the anomeric carbon of a ketose. The textbook adds a qualifier: free D-fructose prefers the six-membered pyranose ring; the furanose is what you find <b>bound</b> — in sucrose, in inulin and in some phosphate esters. The pentoses in nucleic acids are furanoses too, while free D-ribose is mostly pyranose.”',
  note:'§7.1.3 <span class="pg">p150 p151</span>，Obr. 7.4。<b>两个限定词都是书的</b>：游离果糖<i>přednostně</i>成六元环；游离核糖<i>převážně</i>成六元环，只有结合在核酸里才是五元环。说出这两个限定词，等于告诉他你读的是原文。<br>画果糖的 furanose：五边形，O 在后；C-2 在右（挂 C-1 的 CH₂OH 和异头 OH）；C-5 在左，C-6 的 CH₂OH 朝上；C-3 的 OH 朝上（Fischer 里在左）、C-4 的 OH 朝下（在右）。'},
 {n:'09', t:'变旋',
  big:'纯 α 或纯 β 溶于水，旋光值随时间漂到同一个平衡值：<b>+112° / +18,4° → +52,7°</b>；α ⇌ β 走的是<b>开链</b>',
  en:'“<b>Mutarotation</b> is the change of optical rotation with time when you dissolve one pure anomer: the α and β forms interconvert <b>through the open chain</b>, so the rotation drifts to the value of the equilibrium mixture. The textbook’s numbers: α-D-glucose plus 112 degrees, β plus 18.4, and both solutions end at plus 52.7 — a mixture that contains only a very small amount of the open-chain form.”',
  note:'§7.1.4 <span class="pg">p151</span>，三个数已回原图核过。<b>这一条同时是「葡萄糖在溶液里是环」的证据</b>：两种晶体、两个旋光值、一个平衡值，说明溶液里两种环通过开链互换，而开链本身很少。通用文献 β 是 +18,7°，书印 +18,4°——按书说。平衡时大约三分之一 α、三分之二 β 是通用数字，书没给：“Generally about one third α and two thirds β at equilibrium — the textbook gives the rotations, not the proportions.”'},

 {g:'键与更大的分子', gn:'#22 的「structure」从这里往上长：一个糖 → 糖苷键 → 二糖 → 多糖。α 还是 β 决定一切。'},
 {n:'10', t:'糖苷键',
  big:'半缩醛的 OH 换成 OR → <b>缩醛 = 糖苷</b>。C-1 连氧是 <b>O-糖苷键</b>，连氮是 <b>N-糖苷键</b>（核酸里，β 构型）',
  en:'“Replace the hemiacetal hydroxyl with an alkoxyl and you have an <b>acetal</b> — a <b>glycoside</b>. Heating glucose in methanol with HCl gives two of them, methyl-α- and methyl-β-D-glucoside; the new bond from carbon one to the oxygen of the methanol is the <b>glycosidic bond</b>, more precisely an <b>O-glycosidic</b> bond, and the non-sugar part is the <b>aglycone</b>. If the anomeric carbon binds a nitrogen instead it is an <b>N-glycosidic</b> bond — that is how the bases sit on the sugar in DNA and RNA, in the β configuration. And when the anomeric carbon of one monosaccharide binds a hydroxyl of another, that is how disaccharides, oligosaccharides and polysaccharides are built.”',
  note:'§7.2.6 <span class="pg">p153 p154</span>。<b>糖苷键的分类和定义在横向卡 bonds 第 05 点</b>，这里只留一句正面定义。O-糖苷在植物界为主；哺乳动物里主要是 <b>glucuronides</b>——葡糖醛酸的 O-糖苷，异物解毒的产物（p154，接 §7.6.2 p160）。'},
 {n:'11', t:'四个二糖',
  big:'<b>maltose</b> α1→4 Glc–Glc · <b>cellobiose</b> β1→4 Glc–Glc · <b>lactose</b> β1→4 Gal–Glc · <b>sucrose</b> Glc α1↔β2 Fru',
  en:'“Four disaccharides to name, each by its bond. <b>Maltose</b> — two glucoses, α one to four, the product of starch digestion, malt sugar. <b>Cellobiose</b> — two glucoses, β one to four, the repeating unit of cellulose. <b>Lactose</b> — galactose β one to four glucose, milk sugar, the most important sugar in the milk of all mammals. And <b>sucrose</b> — glucose α one to β two fructose, the fructose as a furanose: cane or beet sugar, very easily hydrolysed to glucose and fructose.”',
  tbl:{head:['二糖','键','两个糖','书怎么说','还原？'],
   rows:[
    ['<b>maltose</b>','α(1→4)','Glc–Glc','淀粉降解产物，麦芽糖 p155','<b>是</b>'],
    ['<b>cellobiose</b>','β(1→4)','Glc–Glc','纤维素的基本单元 p155','<b>是</b>'],
    ['<b>lactose</b>','β(1→4)','<b>Gal</b>–Glc','乳糖，所有哺乳动物乳汁里最重要的糖 p155','<b>是</b>'],
    ['<b>sucrose</b>','α1↔β2','Glc–<b>Fru</b>(furanose)','蔗糖/甜菜糖，极易水解 p154','<b>否</b>'],
    ['trehalose','α1↔α1','Glc–Glc','植物、昆虫血淋巴 p155','否'],
    ['isomaltose','α(1→6)','Glc–Glc','来自淀粉的分枝点 p155','是']
   ]},
  note:'书的系统名：sacharosa = O-α-D-glukopyranosyl-β-D-fruktofuranosid；maltosa = 4-O-α-D-glukopyranosyl-D-glukopyranosa；laktosa = 4-O-β-D-galaktopyranosyl-D-glukopyranosa（<span class="pg">p154 p155</span>）。<b>名字里就写着键</b>：「4-O-…-glucopyranosyl」= 接在第二个糖的 C-4 氧上。<b>maltose 和 cellobiose 的差别只是 α 和 β</b>——这就是淀粉和纤维素的差别。'},
 {n:'12', t:'还原糖',
  big:'有<b>一个游离的半缩醛 OH</b>（异头碳没进键）→ 能开环成醛 → <b>还原、变旋、能成糖苷</b>。两个异头碳都进了键（sucrose、trehalose）→ 三样都不行',
  en:'“A <b>reducing sugar</b> is one with a free hemiacetal hydroxyl — an anomeric carbon that is not in a glycosidic bond — so it can open to the aldehyde, the group the textbook labels the reducing group. Such a sugar reduces, it mutarotates, and it can form glycosides. When the hemiacetal hydroxyls of <b>both</b> monosaccharides make the bond, as in sucrose and trehalose, no anomeric carbon is free: the disaccharide is <b>non-reducing</b>, does not mutarotate and cannot form glycosides. Maltose, cellobiose and lactose keep one free anomeric carbon and are reducing.”',
  note:'§7.3 <span class="pg">p154</span> 把三件事绑在一起写：<i>neredukující, nemutarotuje a netvoří glykosidy</i>。<b>三件事是同一件事的三个表现</b>：都需要那个异头碳能打开。多糖也只有一个还原端——磷酸化酶从<b>非还原端</b>切（p173）。<br>「还原」的意思：那个醛能被氧化成酸（→ aldonic acid，p152），同时把试剂还原——书没写 Fehling / Tollens，那是通用：“The classical test is Fehling’s or Tollens’ reagent — general, not in the textbook.”'},
 {n:'13', t:'多糖',
  big:'储能的是 <b>α</b>：淀粉（amylose α1→4 螺旋 ＋ amylopectin α1→6 分枝）、糖原（分枝更密，每 8–10 个）。支撑的是 <b>β</b>：纤维素 β1→4 直链、chitin（GlcNAc β1→4）',
  en:'“Polysaccharides — glycans — are chains of many monosaccharides. The textbook divides them by residue into <b>homoglycans</b>, one kind of unit, and <b>heteroglycans</b>, two or more; and by function into storage and structural. The storage ones are <b>α-linked glucose</b>: starch in plants — <b>amylose</b>, long unbranched α one to four chains coiled into a helix, blue with iodine, and <b>amylopectin</b>, α one to four chains with α one to six branches — and <b>glycogen</b> in animals, in liver and muscle, the same design but much more branched, a branch every eighth to tenth residue in the textbook. The structural ones are <b>β-linked</b>: <b>cellulose</b>, unbranched β one to four glucose — the β linkage, the textbook says, is what allows very long straight chains, each residue turned 180 degrees to the last, the ring oxygen hydrogen-bonding to the C-3 hydroxyl of the next residue, and the straight chains pack into fibrils; and <b>chitin</b>, the same β one to four chain but of N-acetylglucosamine, in fungal walls and the insect cuticle.”',
  tbl:{head:['多糖','单元','键','分枝','形状 / 性质','出处'],
   rows:[
    ['<b>amylose</b>','Glc','α(1→4)','无','螺旋；水合胶束；碘 <b>蓝</b>；几千–500 000','p156'],
    ['<b>amylopectin</b>','Glc','α(1→4) ＋ α(1→6)','书：约每 12 个一枝，枝长约 12','碘红紫；到 1 000 000','p156'],
    ['<b>glycogen</b>','Glc','α(1→4) ＋ α(1→6)','<b>每 8–10 个</b>','扁椭球；仍溶于水；肌 10⁶、肝 1.6×10⁷','p156'],
    ['<b>cellulose</b>','Glc','<b>β</b>(1→4)','无','直链，相邻转 180°，环 O…HO–C3 氢键；纤丝','p157'],
    ['<b>chitin</b>','GlcNAc','β(1→4)','无','重复单元 chitobiose；真菌、甲壳、昆虫','p157'],
    ['dextran','Glc','α(1→6)','少','酵母、细菌的储能','p156'],
    ['inulin','Fru','β(2→1)','无','植物；末端一个 Glc','p156']
   ]},
  note:'§7.4 <span class="pg">p155 p156 p157</span>。<b>⚠ amylopectin 的分枝间距书印的是「约每 12 个」（原图核过），Lehninger 是每 24–30 个；glycogen 书是 8–10，Lehninger 8–12。</b>按书报，被追问再说通用值：“The textbook puts a branch about every twelfth residue in amylopectin and every eighth to tenth in glycogen; Lehninger has 24 to 30 and 8 to 12 — either way glycogen is the more branched.”<br>纤维素占生物圈有机碳约 50%；木材 50% 是纤维素，棉花几乎纯（p157）。纤丝之间由半纤维素（木聚糖）、果胶（半乳糖醛酸）、extensin 蛋白和木质素粘住。'},
 {n:'14', t:'杂多糖与糖蛋白',
  big:'<b>glycosaminoglycan</b>：糖醛酸 ＋ 乙酰氨基糖的重复二糖，常硫酸化 → 强酸性；接在蛋白上 = <b>proteoglycan</b>。糖蛋白：<b>N-</b>接 Asn 酰胺氮 / <b>O-</b>接 Ser、Thr 羟基',
  en:'“Two more classes carry the support and the recognition functions. <b>Glycosaminoglycans</b> — the textbook’s heteropolysaccharides, formerly called acid mucopolysaccharides — are chains of a repeating disaccharide, a <b>uronic acid</b> glycosidically bound to an <b>acetylated amino sugar</b>, often carrying sulfate esters, so strongly acidic; bound covalently to a protein they are the <b>proteoglycans</b> of connective tissue. Hyaluronic acid, chondroitin sulfate — and heparin, the anticoagulant. And <b>glycoproteins</b> carry oligosaccharides either <b>N-linked</b> to the amide nitrogen of asparagine or <b>O-linked</b> to the hydroxyl of serine or threonine; the N-linked ones share a pentasaccharide core of three mannose and two N-acetylglucosamine.”',
  note:'§7.4.2 <span class="pg">p157 p158</span>、§7.5 <span class="pg">p158 p159</span>、§2.2.5 <span class="pg">p036</span>。三个 GAG 各一句：<b>hyaluronic acid</b> = D-glucuronic acid ＋ GlcNAc，脐带、玻璃体、滑液；<b>chondroitin-6-sulfate</b> = D-glucuronic acid ＋ GalNAc-6-sulfate；<b>heparin</b> = glucosamine-N-sulfate ＋ glucuronic / iduronic acid，肥大细胞，抗凝——抑制 prothrombin → thrombin 和 thrombin 对 fibrinogen 的作用（p158）。糖蛋白里常见的糖（Obr. 7.12，p160）：Fuc、Gal、GalNAc、GlcNAc、Man、NeuAc。<b>糖怎么接上去的机制在卡 13</b>（dolichol、Asn-X-Ser/Thr、p112）。'},
 {n:'15', t:'衍生物 · 一处一改',
  big:'磷酸酯（糖<b>几乎只以磷酸酯形式代谢</b>）· 糖酸（aldonic / <b>uronic</b>；抗坏血酸）· 糖醇（sorbitol、mannitol、inositol）· 氨基糖（GlcN、GalN、<b>neuraminic acid</b>）· 脱氧糖（2-deoxyribose、<b>fucose</b>）',
  en:'“The derivatives are one change each on a monosaccharide. <b>Phosphate esters</b> — the textbook says sugars are metabolised almost exclusively as phosphate esters; esterifying turns a neutral molecule into an ion. <b>Sugar acids</b> — oxidise the aldehyde and you get an aldonic acid; oxidise the terminal CH₂OH and you get a uronic acid, such as glucuronic acid; ascorbic acid is a sugar acid, the lactone of 2-oxo-L-gulonic acid. <b>Sugar alcohols</b> — reduce the carbonyl: sorbitol from glucose, mannitol from mannose, and inositol. <b>Amino sugars</b> — replace the hydroxyl on carbon two by an amino group: glucosamine, galactosamine, usually N-acetylated, and neuraminic acid, the sialic acids. And <b>deoxy sugars</b> — 2-deoxy-D-ribose of DNA, and L-fucose, 6-deoxy-L-galactose.”',
  note:'§7.2 <span class="pg">p152 p153</span>。时间不够先砍这一点，但 <b>uronic acid</b> 和 <b>N-acetylglucosamine</b> 两个词要留着，14 点靠它们。5-phosphoribosyl-1-pyrophosphate 是核苷酸合成的中间体（p152）；硫酸酯在 heparin、chondroitin sulfate 里；抗坏血酸是烯二醇、强还原剂（p153）——接卡 01 「为什么需要维 C」。'},

 {g:'收尾', gn:'一句停住，一句伸出去。'},
 {n:'16', t:'落点',
  big:'整章压在<b>一个碳</b>上：成环让 C-1 变成不对称碳，那里选 α 还是 β，决定链是螺旋（淀粉，能消化）还是直纤维（纤维素，不能）',
  en:'“So the whole chapter turns on <b>one carbon</b>. Ring closure makes carbon one asymmetric, and the choice of α or β at that carbon decides whether a chain of glucose is a helix we can digest — starch — or a straight fibre we cannot — cellulose. Why the ring forms at all is thermodynamics: the carbonyl is very reactive, the five-hydroxyl is placed to reach it, and the six-membered chair is strain-free. Below that we are in conformational energetics — physical chemistry rather than biochemistry.”',
  note:'停止句落在<b>热力学</b>。「羰基很活泼」是书的（p149），「五元/六元环无张力、椅式」是通用有机化学。<b>说完就停</b>。'},
 {n:'17', t:'留口子',
  big:'把话引到<b>识别功能</b>和你展示的蛋白上的<b>N-糖链</b>——主场',
  en:'“The function I meet in my own work is the recognition one. The protein I display on yeast has been through the secretory pathway, so it carries <b>N-linked glycans</b> — of the mannose type the textbook’s figure shows, since the yeast wall itself is built of mannan — and where a glycan sits relative to the binding surface is something I have to keep track of, because the sugar is the first thing the partner touches.”',
  note:'三个故意不交代的词都在你的地盘：<b>yeast display、secretory pathway、mannose-type glycan</b>。书里能撑住的：酵母含 mannan（p157）；N-糖链分「甘露糖型」和「复合型」（Obr. 7.11，p159）；糖蛋白的糖部分负责识别（p148）。<b>酵母做的是高甘露糖型</b>是通用知识，书没说酵母——说 “generally”。糖脂也是识别：霍乱毒素、破伤风毒素结合神经节苷脂 GM（p182）。'}
],
end:'<b>会说这十七点，主干和画都成立。</b>画的部分（04、06、07、08）要<b>拿纸画三遍</b>，不是看三遍。硬事实、陷阱、后门在<b>追问</b>那边，眼熟即可。现在切到演练，出声说一遍。',

segs:[
 {tag:'段 1 · 定义', h:'定义、三条轴、四个功能，一口气',
  p:['“A carbohydrate is a polyhydroxy aldehyde or ketone, or a compound built from one. The textbook defines the monosaccharides as aldehydes or ketones carrying two or more hydroxyl groups, general formula (CH₂O)n; everything else is monosaccharides joined by glycosidic bonds, or a derivative with one group changed.',
     'We classify them three ways: by size — mono, oligo up to ten residues, poly; by the carbonyl — aldose or ketose; by carbon number — triose to heptose. Glucose is an aldohexose, fructose a ketohexose.',
     'And the textbook opens with four functions: energy store — starch and glycogen, mobilised easily to D-glucose; the pentoses of RNA and DNA; support — cellulose and chitin; and recognition — the sugar parts of glycoproteins on cell surfaces and secreted proteins.',
     'The written question asks for the structure of glucose in Fischer and Haworth projections — structure meaning which atoms are joined and how they sit in space; a projection being a rule for drawing that in two dimensions: Fischer, the open chain vertical with the horizontal bonds toward the viewer; Haworth, the ring flat and edge-on with the groups above or below. Definition first, drawing second.”'],
  note:'<b>他多半只说 “Draw glucose”</b>——即使这样，先用两句把 glucose 放进类里（“an aldohexose, a monosaccharide”），再拿笔。一张没有归类的画是一张画，不是一个回答。'},
 {tag:'段 2 · general · 画', h:'边画边说。先开链，再成环，再 Haworth',
  p:['“I will draw the open chain first. Fischer projection: the chain vertical, the aldehyde — carbon one — on top, the CH₂OH — carbon six — at the bottom; horizontal bonds toward me, vertical bonds away. Carbons two to five are the four asymmetric carbons; for D-glucose the hydroxyls go right, left, right, right. The D refers to carbon five, the asymmetric carbon farthest from the carbonyl — its hydroxyl on the right, as in D-glyceraldehyde.',
     'In solution the chain closes: the carbonyl is very reactive, and the hydroxyl on carbon five adds to the aldehyde on carbon one — an intramolecular hemiacetal, a six-membered pyranose ring. Carbon one becomes a new asymmetric carbon, the anomeric carbon, so there are two ring forms, α and β.',
     'Haworth projection: a flat hexagon, ring oxygen at the back right, carbon one at the right, numbered clockwise. The textbook’s two rules: what was on the right in Fischer goes below the ring; for a D-sugar the CH₂OH goes above. So carbon two down, three up, four down, six up. The anomeric hydroxyl on carbon one: down is α, up is β.”'],
  note:'<b>画的时候标号 1–6</b>。三个自然停顿点：开链画完、成环说完、Haworth 画完。他在任何一个停顿插进来都行，你都在自己的框架里。<b>如果他只要 Fischer 和 Haworth，成环那一句照说</b>——它是两张图之间的桥，不说他就问「为什么会变成环」。'},
 {tag:'段 3 · 稍展开', h:'从 C-1 往上长：糖苷键 → 二糖 → 多糖，α 还是 β 决定一切',
  p:['“Take that anomeric carbon further. Replace its hemiacetal hydroxyl with the hydroxyl of another sugar and you have a glycosidic bond — an acetal — and the configuration at carbon one, α or β, is now fixed. Maltose is two glucoses α one to four; cellobiose is the same two glucoses β one to four. Lactose is galactose β one to four glucose. Sucrose is glucose α one to fructose β two — both anomeric carbons in the bond, so it is the one common disaccharide that is non-reducing.',
     'Extend that and you have the polysaccharides. The α-linked chains — amylose, amylopectin, glycogen — coil into helices and branch through α one to six; they are the stores. The β-linked chain — cellulose — is straight, each residue turned 180 degrees to the last and hydrogen-bonded to the next, and the straight chains pack into fibrils; it is the support. One configuration at one carbon, two completely different materials.”'],
  note:'〔可裁〕如果他往「function」挖，把段 1 的四个功能各展开一句就够；如果往「structure」挖，这一段就是答案。<b>「一个碳的构型，两种材料」这句是整卡最值钱的一句</b>——它把画题和结构功能题接成一个故事。'},
 {tag:'段 4 · 留口子', h:'落到识别功能和你自己展示的蛋白',
  p:['“The function I actually meet is the recognition one. The protein I display on yeast has been through the secretory pathway, so it carries N-linked glycans — of the mannose type the textbook’s figure shows, since the yeast wall itself is mannan — and where a glycan sits relative to the binding surface is something I have to keep track of, because the sugar is the first thing a partner touches.”'],
  note:'<b>钓饵有三个</b>：yeast display（卡 02）、secretory pathway（卡 13）、mannose-type glycan（本卡 14 点 ＋ 卡 13）。他追哪个都在你的地盘。「酵母做高甘露糖型」是通用知识，被问就说 “generally”。'}
],

why:{
 rungs:[
  ['为什么葡萄糖会成环？','书的理由一句：<b>羰基很活泼</b>（p149）。C-5 的 OH 正好能够到 C-1 的醛，分子内加成成半缩醛。“The carbonyl is very reactive, and the C-5 hydroxyl is placed to reach it.”'],
  ['为什么是六元环，不是别的？','通用：五元和六元环<b>没有张力</b>，更大或更小的环要么张不开要么太松；六元环还能取椅式。“Five- and six-membered rings are strain-free; the six-membered one can take a chair.” 书只给事实：葡萄糖成 pyranose，果糖游离时也偏好 pyranose（p150）。'],
  ['那为什么平衡时 β 多？','通用：椅式里 β-D-glucose 的<b>所有大基团都在平伏位</b>，α 的 C-1 OH 在直立位——更挤。“In the chair every bulky group of the β form is equatorial.” 书给的是旋光平衡值（+52,7°），没给比例。']
 ],
 stop:{lbl:'停 · 落在热力学',
  say:'“Below that it is conformational energetics — which ring, which chair, which anomer is lowest in energy — physical chemistry rather than biochemistry.”'}
