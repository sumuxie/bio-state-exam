<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>口试卡 · 生化</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --paper:#faf8f4; --ink:#1a1917; --dim:#716c64; --faint:#9a948b; --rule:#e4dfd5;
  --card:#fff; --accent:#7a5c2e; --soft:#f4eee2;
  --good:#2f5d3a; --goodbg:#eef4ee;
  --warn:#8a4b12; --warnbg:#fcf1e3;
  --chip:#efeae1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141311; --ink:#ece8e0; --dim:#a49e93; --faint:#7d776d; --rule:#302d28;
  --card:#1c1a17; --accent:#d0a969; --soft:#272117;
  --good:#93c7a0; --goodbg:#18221a;
  --warn:#e0a866; --warnbg:#271f14;
  --chip:#282520;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
a{color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--paper) 93%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
  padding:10px 18px;display:flex;align-items:center;gap:12px}
.top .home{font-size:13px;color:var(--dim);text-decoration:none;border:1px solid var(--rule);
  border-radius:18px;padding:5px 13px;white-space:nowrap;cursor:pointer;background:var(--card)}
.top .home:hover{border-color:var(--accent);color:var(--accent)}
.top .id{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.modes{display:flex;border:1px solid var(--rule);border-radius:20px;overflow:hidden;margin-left:auto}
.modes button{font-family:inherit;font-size:13px;border:none;background:transparent;color:var(--dim);
  padding:6px 16px;cursor:pointer;white-space:nowrap}
.modes button.on{background:var(--accent);color:#fff;font-weight:600}

main{max-width:680px;margin:0 auto;padding:0 20px 130px}

/* ---------- list ---------- */
.lhero{padding:40px 0 18px;border-bottom:1px solid var(--rule)}
.lhero h1{font-size:26px;margin:0 0 6px;font-weight:650;letter-spacing:-.015em}
.lhero p{font-size:14px;color:var(--faint);margin:0}
#search{width:100%;margin:20px 0 6px;padding:12px 15px;font-family:inherit;font-size:16px;
  border:1px solid var(--rule);border-radius:11px;background:var(--card);color:var(--ink)}
#search:focus{outline:none;border-color:var(--accent)}
.lgrp{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:34px 0 4px}
.lgrp-n{font-size:13.5px;color:var(--faint);margin:0 0 12px}
.row{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;margin-bottom:7px;
  background:var(--card);border:1px solid var(--rule);border-radius:11px;
  text-decoration:none;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row.todo{background:transparent;border-style:dashed;cursor:default;opacity:.72}
.row .w{flex:none;font-size:11px;font-weight:800;width:26px;height:26px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.row .w{font-size:12px}
.row .w.hi{background:var(--accent);color:#fff}
.row .w.mid{background:var(--soft);color:var(--accent)}
.row .w.lo{background:var(--chip);color:var(--faint)}
.row .w.non{background:var(--warnbg);color:var(--warn)}
.row .flags{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.row .flags b{color:var(--warn)}
.row .flags i{font-style:normal;color:var(--accent)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15.5px;font-weight:600;line-height:1.5}
.row .t span{display:block;font-size:13px;color:var(--faint);margin-top:2px}
.row .go{flex:none;font-size:12px;color:var(--accent);font-weight:600;margin-top:5px;white-space:nowrap}
.row.todo .go{color:var(--faint);font-weight:400}

/* ---------- shared blocks ---------- */
.hero{padding:40px 0 8px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.hero h1{font-size:26px;line-height:1.33;margin:0 0 8px;font-weight:650;letter-spacing:-.015em}
.hero .sub{font-size:13.5px;color:var(--faint);margin:0 0 24px}
.grp{margin:44px 0 0}
.grp-h{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.grp-h span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.grp-h i{flex:1;height:1px;background:var(--rule)}
.grp-note{font-size:13.5px;color:var(--faint);margin:0 0 6px}
.pt{padding:32px 0 0}
.pt-n{font-size:11.5px;letter-spacing:.13em;color:var(--faint);font-variant-numeric:tabular-nums;
  margin:0 0 10px;font-weight:600}
.pt-big{font-size:22px;line-height:1.5;font-weight:650;margin:0 0 16px;letter-spacing:-.008em}
.pt-big b{color:var(--accent);font-weight:650}
.en{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:16px 19px;margin:0;
  font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.72}
.nt{font-size:14px;color:var(--dim);margin:13px 0 0;line-height:1.72}
.nt b{color:var(--ink)}
.wn{background:var(--warnbg);border-left:3px solid var(--warn);border-radius:0 10px 10px 0;
  padding:12px 16px;margin:13px 0 0;font-size:13.5px;line-height:1.7}
.wn b{color:var(--warn)}
.gd{background:var(--goodbg);border-left:3px solid var(--good);border-radius:0 10px 10px 0;
  padding:12px 16px;margin:13px 0 0;font-size:13.5px;line-height:1.7}
.gd b{color:var(--good)}
.pg{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--chip);
  border-radius:3px;padding:1px 6px;color:var(--faint);white-space:nowrap}
figure.fig{margin:15px 0 0;background:#fff;border:1px solid var(--rule);border-radius:10px;
  padding:10px 10px 6px}
figure.fig img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:4px}
figure.fig figcaption{font-size:12.5px;color:var(--faint);margin-top:8px;line-height:1.6}
figure.fig figcaption b{color:var(--ink)}
.endnote{margin:54px 0 0;padding:20px 22px;background:var(--soft);border-radius:12px;
  font-size:14.5px;line-height:1.75}
.endnote b{color:var(--accent)}
table.tb{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border:1px solid var(--rule);border-radius:11px;overflow:hidden;font-size:14.5px;margin:14px 0 0}
table.tb th{background:var(--soft);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);font-weight:700;padding:9px 12px;text-align:left}
table.tb td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:top;line-height:1.6}
.twrap{overflow-x:auto}

/* ---------- recog ---------- */
.recog{margin:26px 0 10px}
.recog h3{font-size:17px;margin:0 0 6px}
.recog > p{font-size:14px;color:var(--dim);margin:0 0 14px;line-height:1.72}
.recog > p b{color:var(--ink)}
.rq{background:var(--card);border:1px solid var(--rule);border-radius:11px;margin-bottom:8px;overflow:hidden}
.rq:hover{border-color:var(--accent)}
.rq.odd{background:var(--warnbg)}
.rq > summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.rq > summary::-webkit-details-marker{display:none}
.rq > summary::after{content:"+";margin-left:auto;color:var(--faint);font-size:18px;line-height:1;flex:none}
.rq[open] > summary::after{content:"\2013"}
.rq .qq{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.55;flex:1;min-width:0}
.rq .body{padding:0 15px 15px}
.rq .mean{font-size:13.5px;color:var(--dim);line-height:1.7;margin:0 0 12px;
  padding-left:12px;border-left:2px solid var(--rule)}
.rq .mean b{color:var(--ink)}

/* ---------- drill ---------- */
.step{display:none}
.step.on{display:block;animation:in .16s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#drill{padding-top:28px}
.tag{display:inline-block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;background:var(--accent);border-radius:3px;padding:3px 10px;font-weight:650;margin-bottom:16px}
h2{font-size:22px;line-height:1.35;margin:0 0 12px;font-weight:650}
.lead{font-size:15px;color:var(--dim);margin:0 0 22px}
.askbox{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:36px 26px;text-align:center}
.askbox .q{font-size:25px;line-height:1.36;font-weight:650;margin:0 0 8px}
.askbox .qcn{font-size:13.5px;color:var(--faint);margin:0 0 28px}
.askbox .do{background:var(--soft);border-radius:10px;padding:15px 17px;font-size:15px;text-align:left;line-height:1.7}
.askbox .do b{color:var(--accent)}
ul.sib{list-style:none;margin:0;padding:0}
ul.sib li{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;cursor:pointer;
  font-size:15.5px;line-height:1.62;user-select:none;flex-wrap:wrap}
ul.sib li:hover{border-color:var(--accent)}
ul.sib li .bx{flex:none;width:21px;height:21px;border:2px solid var(--rule);border-radius:6px;margin-top:3px}
ul.sib li .txt{flex:1;min-width:0}
ul.sib li.hit{background:var(--goodbg);border-color:var(--good)}
ul.sib li.hit .bx{background:var(--good);border-color:var(--good);position:relative}
ul.sib li.hit .bx::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
ul.sib li .more{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--rule);
  background:transparent;color:var(--faint);font-size:14px;cursor:pointer;font-family:inherit;padding:0}
ul.sib li.open .more{background:var(--accent);color:#fff;border-color:var(--accent)}
ul.sib li .detail{display:none;flex-basis:100%;margin:11px 0 3px;padding-top:12px;border-top:1px dashed var(--rule)}
ul.sib li.open .detail{display:block}
ul.sib li .detail .e{font-family:Georgia,serif;font-size:16px;line-height:1.7;margin:0 0 9px}
ul.sib li .detail .c{font-size:14px;line-height:1.72;color:var(--dim);margin:0}
ul.sib li .detail .c b{color:var(--ink)}
.tally{margin-top:16px;padding:14px 17px;border-radius:10px;background:var(--chip);font-size:15px}
.tally.pass{background:var(--goodbg);color:var(--good);font-weight:600}
.tally.fail{background:var(--warnbg);color:var(--warn);font-weight:600}
.say{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:0 12px 12px 0;padding:20px 22px;font-family:Georgia,"Times New Roman",serif;
  font-size:17px;line-height:1.78}
.say p{margin:0 0 13px}.say p:last-child{margin:0}
.note{margin-top:16px;font-size:14px;color:var(--dim);background:var(--soft);
  border-radius:10px;padding:14px 16px;line-height:1.72}
.note b{color:var(--ink)}
.rung{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:15px 17px;margin-bottom:9px}
.rung .q{font-weight:650;font-size:15.5px;margin:0 0 5px}
.rung .a{font-size:14.5px;color:var(--dim);margin:0;line-height:1.7}
.stopbox{margin-top:14px;background:var(--goodbg);border:1px solid var(--good);border-radius:11px;padding:16px 18px}
.stopbox .lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--good);font-weight:700}
.stopbox q{display:block;margin-top:8px;font-family:Georgia,serif;font-size:16px;line-height:1.72}
.done{text-align:center;padding:40px 18px}
.done .big{font-size:44px;margin-bottom:6px}

/* ---------- ask ---------- */
.rule8{background:var(--goodbg);border:1px solid var(--good);border-radius:12px;
  padding:17px 20px;margin:22px 0 6px;font-size:14.5px;line-height:1.75}
.rule8 h3{margin:0 0 8px;font-size:16px;color:var(--good)}
.rule8 b{color:var(--ink)}
.qgrp{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:38px 0 4px}
.qgrp-n{font-size:13.5px;color:var(--faint);margin:0 0 12px}
.qa{background:var(--card);border:1px solid var(--rule);border-radius:11px;margin-bottom:9px;overflow:hidden}
.qa:hover{border-color:var(--accent)}
.qa > summary{list-style:none;cursor:pointer;padding:15px 17px;display:flex;gap:12px;
  align-items:flex-start;font-size:16px;line-height:1.55;font-weight:600}
.qa > summary::-webkit-details-marker{display:none}
.qa > summary::after{content:"+";margin-left:auto;color:var(--faint);font-weight:400;font-size:19px;line-height:1;flex:none}
.qa[open] > summary::after{content:"\2013"}
.qa[open] > summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.risk{flex:none;font-size:10.5px;letter-spacing:.06em;padding:3px 7px;border-radius:4px;
  font-weight:700;margin-top:2px;white-space:nowrap}
.risk.m{background:var(--warn);color:#fff}
.risk.h{background:var(--accent);color:#fff}
.risk.n{background:var(--chip);color:var(--faint)}
.qbody{padding:16px 17px 18px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 93%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--rule);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.nav.hide{display:none}
button.b{font-family:inherit;font-size:16px;font-weight:600;border-radius:11px;padding:13px 28px;
  cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;min-width:140px}
button.b.ghost{background:transparent;color:var(--dim);border-color:var(--rule);min-width:76px;font-weight:500}
button.b:disabled{opacity:.35;cursor:default}

/* ---------- figs tab ---------- */
.figcard{margin:30px 0 0;background:var(--card);border:1px solid var(--rule);border-radius:13px;
  padding:18px 18px 14px}
.figcard .kind{display:inline-block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;border-radius:4px;padding:3px 9px;margin-bottom:12px}
.figcard .kind.draw{background:var(--accent);color:#fff}
.figcard .kind.know{background:var(--soft);color:var(--accent)}
.figcard h3{font-size:18px;margin:0 0 10px;line-height:1.45}
.figcard img{max-width:100%;height:auto;display:block;margin:0 auto;background:#fff;
  border:1px solid var(--rule);border-radius:8px;padding:8px}
.figcard .cap{font-size:14px;color:var(--dim);margin:14px 0 0;line-height:1.72}
.figcard .cap b{color:var(--ink)}
.figcard .src{font-size:12px;color:var(--faint);margin:10px 0 0}


/* ---------- progress ---------- */
.board{background:var(--card);border:1px solid var(--rule);border-radius:13px;
  padding:18px 20px;margin:22px 0 4px}
.board h3{margin:0 0 4px;font-size:16px}
.board .sub2{font-size:13px;color:var(--faint);margin:0 0 15px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1 1 92px;background:var(--soft);border-radius:9px;padding:11px 13px}
.stat b{display:block;font-size:23px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
.stat.warn b{color:var(--warn)}
.stat.good b{color:var(--good)}
.due{font-size:13.5px;line-height:1.75;color:var(--dim);margin:0 0 14px}
.due b{color:var(--ink)}
.due a{color:var(--accent);font-weight:600;text-decoration:none;margin-right:9px;white-space:nowrap}
.bbtn{font-family:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:10px 16px;
  cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff}
.bbtn.ghost{background:transparent;color:var(--dim);border-color:var(--rule);font-weight:500}
.copied{font-size:13px;color:var(--good);margin-left:10px}
.row .st{flex:none;font-size:11.5px;color:var(--faint);margin-top:5px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.row .st.ok{color:var(--good);font-weight:600}
.row .st.due{color:var(--warn);font-weight:600}
.donebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.delta{margin-top:16px;font-size:15px;line-height:1.75}
.delta b{font-size:17px}


/* ---------- 一键开始 ---------- */
.gobox{background:var(--accent);border-radius:14px;padding:22px 22px 20px;margin:22px 0 6px;color:#fff}
.gobox .k{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin:0 0 8px}
.gobox h2{margin:0 0 6px;font-size:21px;line-height:1.4;color:#fff;font-weight:650}
.gobox p{margin:0 0 16px;font-size:14px;opacity:.9;line-height:1.7}
.gobox a{display:inline-block;background:#fff;color:var(--accent);text-decoration:none;
  font-weight:700;font-size:16px;border-radius:10px;padding:13px 26px}
.gobox .alt{display:block;margin-top:12px;font-size:13px;opacity:.85;color:#fff}
.gobox .alt a{background:none;color:#fff;text-decoration:underline;padding:0;font-weight:600;font-size:13px}

/* ---------- 朗读 ---------- */
.spk{border:none;background:var(--chip);color:var(--dim);border-radius:6px;cursor:pointer;
  font-size:13px;line-height:1;padding:4px 8px;margin-left:8px;vertical-align:2px;font-family:inherit}
.spk:hover{background:var(--accent);color:#fff}
.spk.on{background:var(--good);color:#fff}
/* 朗读时：当前句高光，其余变暗 */
.reading .en,.reading .say,.reading .pt-en,.reading .pt-big,.reading .nt,.reading .gd,.reading .wn{opacity:.35;transition:opacity .2s}
.reading .rd{opacity:1}
.rd span.s{opacity:.45}
.rd span.s.cur{opacity:1;background:var(--warnbg);border-radius:3px;box-shadow:0 0 0 3px var(--warnbg)}
.wd{background:var(--goodbg);border-radius:3px;box-shadow:0 0 0 2px var(--goodbg)}
#wpop{position:fixed;z-index:60;display:none}
#wpop button{font-family:inherit;font-size:13px;border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:14px;padding:6px 11px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.14)}
#wpop button i{font-style:normal;font-family:Georgia,serif}
#wpop button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.favs{border:none;background:var(--chip);color:var(--dim);border-radius:6px;cursor:pointer;font-size:13px;line-height:1;
  padding:4px 7px;margin-left:4px;vertical-align:2px;font-family:inherit}
.favs:hover{background:var(--accent);color:#fff}
.favs.on{background:var(--warn);color:#fff}
.favsec h3{margin:18px 0 8px}
#vsel{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--card);color:var(--ink);max-width:100%}
.favl{list-style:none;margin:0;padding:0}
.favl li{display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:8px;background:var(--card);border:1px solid var(--rule);border-radius:10px}
.favl .ft{flex:1;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.6}
.favl .fc{font-size:12px;color:var(--faint);text-decoration:none;white-space:nowrap}
.favl .fx{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:14px}
.en,.say,.pt-en,.gd,.nt,.wn,.pt-big{cursor:text}
/* 追问底部收起 */
.fold{display:block;margin:14px 0 0 auto;border:1px solid var(--rule);background:var(--chip);color:var(--dim);
  border-radius:14px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.fold:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 遮词：关键词盖住，悬停或点一下露出 */
.cloze .pt-big b,.cloze .en b,.cloze .say b,.cloze ul.sib li .txt b,.cloze .detail .e b{
  background:var(--ink);color:transparent;border-radius:3px;cursor:pointer}
.cloze .pt-big b:hover,.cloze .en b:hover,.cloze .say b:hover,.cloze ul.sib li .txt b:hover,.cloze .detail .e b:hover,
.cloze .pt-big b.show,.cloze .en b.show,.cloze .say b.show,.cloze ul.sib li .txt b.show,.cloze .detail .e b.show{
  background:transparent;color:inherit}
.cloze .pt-big b.show{color:var(--accent)}

/* ---------- 降级梯子 ---------- */

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'前两点决定老师觉不觉得你只是背过。'},
 {n:'01', t:'定义',
  big:'结构说的是 <b>conformation</b>：多肽链<b>所有原子的空间排布</b>——只靠转动就能变、不断共价键的那种',
  en:'“Protein structure means the <b>conformation</b> — the spatial arrangement of the atoms of the polypeptide chain, or chains: what can change by rotation about bonds without breaking a covalent one. The only level that is not a conformation is the primary, the covalent chain itself.”',
  note:'conformation 特指<b>不打断任何共价键、只靠转动就能改变</b>的排布。说出这个词，等于一句话交代了「骨架不变，变的是摆放」。'},
 {n:'02', t:'边界',
  big:'超过 <b>100 个残基</b>才叫 protein',
  en:'“By the textbook’s convention a protein is a polypeptide of more than a hundred residues; up to ten we say oligopeptide, in between polypeptide. It is a convention — the textbook’s own first sequenced protein, insulin, is shorter.”',
  note:'书 p026 给的门槛。中间那段叫 polypeptide。<b>给出一个数字，等于告诉老师你知道这个词是有定义的</b>，不是随口叫的。'},

 {g:'骨架', gn:'这两点说了，后面四级就不是四个要背的名字。'},
 {n:'03', t:'为什么要分级',
  big:'不是因为分子有层，是<b>按尺度</b>分：链 → 邻近残基 → 整条链 → 多条链；唯一的硬线是<b>共价 vs 非共价</b>',
  en:'“We describe it in levels of <b>scale</b>, not because the molecule has layers: the covalent chain first, then what neighbouring residues do, then how the whole chain folds, then how chains pack. The one hard physical line is <b>covalent versus non-covalent</b> — primary is the only covalent level; everything above it is held by non-covalent interactions, plus disulfide bridges where there are any.”',
  note:'<b>原来这里说「因为固定每一级的力不同」——审过书，站不住。</b>书 p033 引入四级时没给任何理由；p032 那一节讲的是力，但没有按级分配；p034 给球蛋白的是一张不分级的清单（二硫键、离子对、氢键、van der Waals、疏水效应）。三级和四级靠的是同一套力，「力不同」在那里就是假的；你自己在追问里又说「二级三级的分界不是靠力的种类」，两句会打架。<b>「尺度」＋「共价 vs 非共价这一条硬线」既是真的，也够当骨架。</b>'},
 {n:'04', t:'第二条判据',
  big:'三条分界线：一级靠<b>共价</b>、四级靠<b>链数</b>；二级 vs 三级靠残基在<b>序列上离得近还是远</b>',
  en:'“Primary is set off by being covalent; quaternary by needing more than one chain. Between secondary and tertiary the textbook draws the line by <b>distance along the sequence</b> — neighbours in the chain versus residues far apart — and says itself that this line is in some cases hard to define.”',
  note:'原来说「两条判据分开四级」——序列距离其实只分二级和三级（p033），分不开一级和二级（同一批残基），也分不开三级和四级（不同链之间没有序列距离）。<b>三条线各是各的</b>：共价 / 序列距离 / 链数。书自己承认序列距离这条线有时很难划（p033）——主动说出来比被问出来好。'},

 {g:'四级', gn:'每一级问同样两件事：残基在序列上离多远，靠什么固定。'},
 {n:'05', t:'Primary',
  big:'<b>由肽键连接的、精确的氨基酸顺序</b>，加上<b>二硫键的位置</b>——唯一的<b>共价</b>级',
  en:'“Primary structure is the covalent level: the <b>exact order of the amino-acid residues, joined by peptide bonds</b> — and the positions of the disulfide bridges, which the textbook includes, and so does Lehninger, because they are covalent too.”',
  note:'<b>不要只说 “the sequence”。</b>那是一个没交代的名词，他会接一句「你说的 sequence 是什么意思」。<b>把「精确顺序」和「由肽键连接」一起说出来，这一刀就堵住了</b>——而且顺带把肽键摆上了桌面，那是你想接的方向（段 3 就从它开始）。',
  warn:'<b>别说 “in this textbook”</b>——Lehninger 的一级结构定义也是「全部共价键（主要是肽键和二硫键）」，这本书不特殊。有些课把二硫键算进三级，说的是它<b>稳定</b>什么，不是它<b>登记</b>在哪级。<b>登记在一级，干的是三级的活</b>（p032：稳定已经形成的结构）——两件事分开说，追问里有整条。'},
 {n:'06', t:'Secondary',
  big:'<b>主链局部的规则重复构象</b>，靠主链自己的氢键；残基在序列上挨得近',
  en:'“Secondary structure is the regular, locally repeating conformation of the <b>main chain</b> — the repeating nitrogen, alpha-carbon, carbonyl-carbon backbone, not the side chains — held by hydrogen bonds between its own C=O and N–H groups. Its residues are neighbours in the sequence; that is how the textbook separates it from tertiary. The periodic ones are the α-helix, the β-structure and, in this textbook, the collagen helix.”',
  note:'<b>关键词是「主链」</b>——侧链之间的相互作用是三级的事，这是最容易被一句话抓住的点。书叫 <b>β-structure</b> 不叫 β-sheet，跟着书叫。<br><b>「序列上挨得近」是书跟三级划界的判据，不是二级本身是什么</b>——跟三级那次同一种错。书自己的 β-structure（两条不同链之间的主链氢键，p030）和胶原（链间氢键，p031）都打破这个判据。胶原螺旋算二级是这本书的说法；Lehninger 里单链胶原螺旋是二级，三链超螺旋另算。'},
 {n:'07', t:'Tertiary',
  big:'<b>一整条链折成的三维形状</b>，让序列上<b>隔得远</b>的残基碰到一起；靠<b>侧链</b>为主：疏水核心 ＋ 离子对/氢键，有二硫键就加上',
  en:'“Tertiary structure is the <b>overall fold of one whole chain</b> — how its secondary elements pack together, so that residues <b>far apart in the sequence</b> come into contact. It is held mostly by the <b>side chains</b>: the nonpolar ones packed inside as a <b>hydrophobic core</b>, the polar ones in ion pairs and hydrogen bonds, plus van der Waals contacts — and by disulfide bridges, where the protein has any.”',
  note:'书 p033 只给了一句：「序列上离得远的残基的空间排布」——那是它<b>跟二级的分界判据</b>，不是三级本身是什么。<b>三级本身是一整条链的折叠</b>，先说这个，再把「远」当判据补上。<br>力在 p034，书自己列了五样：<b>二硫键、离子对、氢键、van der Waals、疏水效应</b>。所以<b>别说 “non-covalent”</b>——他一句「那二硫键呢」就把你逼回去。<b>疏水核心必须进定义</b>：非极性侧链朝里、极性朝外（p033），这是三级折叠的组织原则，不是收尾才提的东西。<br><b>例子：肌红蛋白</b>——一条链，α-helix 为主（p034），1957 年 Kendrew 解出的第一个蛋白质三维结构（p009）。<b>⚠ 血红蛋白不是三级的例子，是四级的</b>；它每条链的折叠像肌红蛋白。'},
 {n:'08', t:'Quaternary',
  big:'<b>只有多于一条链时才存在</b>：亚基怎么排、接触面什么性质',
  en:'“Quaternary structure exists <b>only if</b> the protein is built of more than one chain: how the subunits — each chain is a subunit — are arranged, and what their contacts are like.”',
  note:'<b>例子：血红蛋白</b>——四条链，两 α 两 β。书 p027 讲镰刀型贫血时说的是「血红蛋白 <b>β 链</b>第 6 位」，一说 β 链就等于承认有不止一条链。<b>书自己的例子是抗体</b>（p033）：抗原结合位点由两种链各出一部分拼成——所以<b>亚基的接触面常常就是活性所在</b>。',
  warn:'「只有多于一条链才存在」这半句必须说。老师拿一个<b>单链</b>蛋白问你它的四级结构时，正确答案是<b>「它没有」</b>（p033），不是硬编一个。'},
 {n:'09', t:'后来补的两级',
  big:'<b>supersecondary</b>（βαβ）和 <b>domain</b>（100–400 残基）',
  en:'“Later work added two more levels: <b>supersecondary</b> structure — clusters such as the βαβ motif — and <b>domains</b>, compact globular regions of a hundred to four hundred residues.”',
  note:'书 p033 明说是「pozdější studie」的结果。说出来显示你知道这个分级<b>是人定的、而且在变</b>。<b>时间不够先砍这一点。</b>'},

 {g:'收尾', gn:'一句停住，一句伸出去。这两点决定他接下来往哪问。'},
 {n:'10', t:'落点',
  big:'疏水效应是<b>水的熵</b>，不是侧链互相吸引',
  en:'“Ultimately this is the <b>hydrophobic effect</b>, an <b>entropy term of the water</b>, not an attraction between the side chains. Below that we are in physical chemistry rather than biochemistry.”',
  note:'非极性基团靠拢，是因为它们周围<b>那层排列整齐的水被拆掉了</b>，水的熵升高（p032–033）。<b>说完这句就停</b>——它既是答案也是体面的收手。'},
 {n:'11', t:'留口子',
  big:'主动把话引到<b>四级结构和抗体</b>，落到你的主场',
  en:'“The level I actually work at is the quaternary one — in antibodies the antigen-binding site is formed by parts of chains from <b>both</b> types of subunit. That is where I work experimentally, with <b>yeast display</b> and <b>dissociation constants</b>.”',
  note:'抗体那句<b>是书自己举的例子</b>（p033），所以不算跑题。故意留下的两个词都落在你的主场——<b>你不给抓手，他就自己去挑一个深坑</b>。'}
],

  note:'先讲肽键刚性再讲二级结构，<b>「为什么只有这几种二级结构」就顺带答了</b>。<br>⚠ α-helix 氢键：书正文印 n+3，同页图画的是 n+4，通用写法也是 n+4，而且 3.6 残基/圈只跟 n+4 自洽。<b>先说 “about one full turn further along the chain”，被逼问再给 n+4。</b>',
  fig:{src:'img/p029_obr28_alphahelix_hbond.jpg',
       cap:'<b>Obr. 2.8（书 p029 原图）。</b>括号从 <b>R₁ 后面那个 O</b>（第 1 个残基的羰基氧）连到 <b>R₅ 前面那个 H</b>（第 5 个残基的酰胺氢）。数一下就是 <b>n → n+4</b>，而同一页正文印的是 n+3。<b>被质疑时把这张图指给他看。</b>'}},
 {tag:'段 4 · 留口子', h:'主动给他一个抓手',
  p:['“And the level I actually work at is the quaternary one. In antibodies the antigen-binding site is formed by parts of chains from both types of subunit — that is the textbook’s own example. It is also where I work experimentally: I measure how a binding surface tolerates change, using yeast display and dissociation constants.”'],
  note:'<b>这不是漏洞，是钓饵。</b>yeast display 和 dissociation constant 故意不交代。<b>你不给抓手，他就自己去挑一个深坑。</b>'}
],

/* ---------------- 同一个答案，不同问法 ---------------- */
recog:[
{q:'Protein structure.',
 mean:'他也可能只念题目，或说 #30 那句 “What are the different levels of protein structure?”。题库 #30，跟本题同一道。<b>整段照说。</b>',
 say:'“Four levels. Primary is the covalent level — the exact order of residues joined by peptide bonds, and the disulfide positions. Secondary is the regular local conformation of the main chain, held by main-chain hydrogen bonds. Tertiary is the overall fold of one whole chain, bringing residues far apart in the sequence into contact, held mostly by side-chain interactions and the hydrophobic core. And quaternary exists only if there is more than one chain.”'},

{q:'What holds a protein together?',
 mean:'入口是<b>力</b>那一列，不是四级的名字。先给判据，再按级给力。',
 say:'“It depends which level you mean, and that is the point of the levels — the forces that fix each one are different. The covalent ones are the peptide bonds and the disulfide bridges. Secondary structure is held by hydrogen bonds of the main chain. Tertiary and quaternary are held mostly by side-chain interactions: ion pairs, hydrogen bonds and van der Waals contacts, with the disulfide bridges locking a fold that has already formed. And underneath all of it is the hydrophobic effect.”'},

{q:'Why do we talk about levels at all?',
 mean:'他直接问骨架那一句。<b>这题只答那一句就满分</b>，不用把四级背一遍。',
 say:'“Not because the molecule has layers — the levels are levels of scale: the covalent chain, then what neighbouring residues do, then how the whole chain folds, then how chains pack. The one hard physical line is covalent versus non-covalent: primary is the only covalent level. The textbook has a separate section on the forces that determine protein structure, and it lists them without dividing them by level.”'},

{q:'What is the difference between secondary and tertiary structure?',
 mean:'不是问两个定义，是问<b>分界依据</b>。答定义就漏了他要的东西。',
 say:'“The line is not drawn by the kind of force — it is drawn by <b>distance along the sequence</b>. Secondary structure is the regular local conformation of the main chain — residues that lie close together in the chain, held by main-chain hydrogen bonds. Tertiary is the fold of the whole chain, which brings residues far apart in the chain together, held mostly by side-chain interactions and the hydrophobic core. The textbook itself says the boundary is in some cases hard to define.”'},

{q:'Can you quantify that? How many residues?',
 mean:'<b>他在要一个不存在的数字。</b>不要编。改成给判据，并引用书自己承认的模糊。',
 say:'“There is no fixed number — the textbook itself says the boundary between secondary and tertiary structure is in some cases difficult to define. The criterion is not a distance: secondary structure is what can form locally as the chain emerges; tertiary needs residues that only meet after the whole chain folds back. The clearest illustration is the β-structure, where two strands far apart in sequence still count as secondary because they are held by main-chain hydrogen bonds.”'},

{q:'Is haemoglobin an example of tertiary structure?',
 mean:'<b>陷阱：血红蛋白是四级的标准例子，不是三级。</b>三级的标准例子是肌红蛋白。两个名字换一下，就是 PESB 那种失分。',
 say:'“No — haemoglobin is the standard example of <b>quaternary</b> structure: four chains, two α and two β. The textbook itself speaks of the β-chain of haemoglobin in the sickle-cell example, and a β-chain implies there is an α-chain. The tertiary example is <b>myoglobin</b> — a single chain, mostly α-helix folded around a heme, the first protein structure ever solved, Kendrew 1957. Each chain of haemoglobin has a myoglobin-like fold; the way the four chains are arranged is the quaternary level.”'},

{q:'Describe the structure and function of proteins.',
 mean:'题库 #29。<b>同一批材料，但结尾必须转到功能。</b>',
 say:'“Structurally we describe them at several levels, because the forces that fix each level are different. Functionally the point is that the function follows entirely from the conformation — a randomly arranged or extended chain has essentially no biological activity. That is why denaturation destroys function without touching a single covalent bond of the backbone.”'},

{q:'Why does a protein fold at all?',
 mean:'④ 的三层，落到疏水效应。',
 say:'“Because in water the nonpolar side chains come together, so the molecule takes the structure with the smallest surface and a nonpolar core. And they come together not because they attract each other, but because the ordered water shell around them is released — the hydrophobic effect is an entropy term of the water.”'},

{q:'Which level survives if you heat a protein?',
 mean:'问的是<b>变性</b>。一级不掉，空间排布掉。',
 say:'“The covalent level survives — the sequence and the disulfide positions are untouched. What is lost is the spatial arrangement: the protein goes to a random coil, loses its biological activity and changes its physical properties.”'},

{q:'What happens when you boil an egg?', odd:1,
 mean:'<b>这就是变性题</b>，只是穿了便装。',
 say:'“That is heat denaturation. The first effect of any denaturant is that the chain unfolds, which exposes the nonpolar residues that were inside the globule. In a concentrated solution those newly exposed side chains then interact with each other, the protein aggregates, and it comes out of solution — the textbook calls that <b>coagulation</b>. That is why it is irreversible.”',
 tail:'追问「那什么时候可逆」：<b>很稀的溶液</b>里小心加变性剂，再慢慢除去，蛋白会回到天然形态（p035）。这一条同时是「序列决定结构」的实验证据。'},

{q:'Why is hair not the same thing as silk?', odd:1,
 mean:'<b>问的是纤维状蛋白的两种二级结构。</b>',
 say:'“Because they are built on different secondary structures. Keratin is α-helical — two pairs of parallel helices twisted into a <b>left-handed</b> four-strand cable, the protofibril. Silk fibroin is <b>antiparallel β</b>, and it is rich in glycine, alanine and serine — the three smallest side chains, which is what lets the sheets stack.”'},

{q:'Why do you need vitamin C?', odd:1,
 mean:'<b>问的是 collagen 的羟化。</b>入口完全不像生化题。',
 say:'“Because collagen contains hydroxyproline and hydroxylysine, and those are made after translation by specific hydroxylases in the ER. Those enzymes need oxygen, 2-oxoglutarate, metal ions — and <b>ascorbate</b>. Without it the hydroxylation does not finish and the collagen is not stable.”',
 tail:'⚠ 「坏血病」这个病名<b>书里没有</b>，辅因子清单有（p112）。要说病名就说 “that is the biochemistry behind scurvy”，别说成书上写的。'},

{q:'Why is a scar different from normal skin?', odd:1,
 mean:'<b>先答问题本身</b>（组织层面纤维怎么排），再往分子走。前半是通用组织学，书里没有；后半是书 p031。',
 say:'“Both are made of collagen; what differs is how the fibres are laid down. In normal skin the collagen fibres form a loose <b>basket-weave</b> running in many directions, with elastin between them and hair follicles and glands within. A scar is repair tissue laid down fast by fibroblasts: dense bundles of collagen all running in <b>parallel</b>, little elastin, no appendages — so it is stiffer, less elastic, and looks and feels different. The molecule is the same; the arrangement above the molecule is not. If you want the molecule: collagen has two levels of helix — each chain is itself a helix whose peptide planes are not parallel to the axis, so it cannot hydrogen-bond within itself, and three such chains wind round a common axis like a rope into a <b>right-handed</b> superhelix, 3.3 residues per turn in the textbook, held by <b>intermolecular</b> hydrogen bonds between the chains.”'},

{q:'What is the difference between a peptide and a protein?', odd:1,
 mean:'<b>只问边界那一条</b>，别把四级背一遍。',
 say:'“It is a convention about length. Up to ten residues we say oligopeptide, above that polypeptide, and a chain of more than a hundred residues is called a protein.”'},

{q:'Why does blood clot?', odd:1,
 mean:'书自己给的「球状变纤维状」的例子。',
 say:'“It is the textbook’s own example of a globular protein turning fibrillar: fibrinogen is converted to fibrin during clotting. Proteins are divided by overall shape into fibrillar and globular, and that division is not permanent.”'},

{q:'How would you destroy a protein’s function without cutting the chain?',
 mean:'变性。顺带把书给的手段列出来。',
 say:'“Denature it. The textbook lists physical causes — heat, or just foaming the solution — and chemical ones: strong acids and bases, organic solvents, detergents, urea and guanidine. None of them touch the peptide bonds; they only unfold the chain.”'},

{q:'Why isn’t a protein just a floppy chain?',
 mean:'两个理由：肽键刚性 ＋ 疏水核心。',
 say:'“Two things narrow it down. The peptide bond is planar and cannot rotate, so free rotation is left only at the two bonds at the α-carbon — the conformational space is much smaller than it looks. And in water the nonpolar core selects one of those conformations.”'}
],

/* ---------------- 追问 ---------------- */
ask:[
{g:'定义类', gn:'他默认你知道名词，所以专挑名词问。这一组最容易被打个措手不及。', items:[
{r:'中', q:'What is a domain?',
 en:'“A compact globular region of a hundred to four hundred residues, joined to the rest of the chain by a flexible segment. It is not one of the classical four levels — later work added it, together with supersecondary structure, clusters of a few secondary-structure elements such as the βαβ motif.”',
 cn:'后补的那一级。给尺寸，并说明它是后来加的。'},
{r:'实测', q:'What is a hydrogen bond?',
 en:'“The textbook calls it a special case of electrostatic interaction between dipoles: the attraction between a hydrogen covalently bound to an electronegative atom — that atom, with its hydrogen, is the donor — and a lone pair on another electronegative atom, the acceptor. Unlike van der Waals contacts it is <b>directional</b>, and that is why it can fix a geometry rather than just hold things close.”',
 cn:'在主链里，<b>供体是 N–H，受体是羰基的 O</b>。被继续追「谁能形成」：供体只能是 <b>N–H、O–H</b>（S–H 很弱），受体是 <b>O、N</b> 上的孤对。再追「为什么 C–H 不行」：<b>碳的电负性不够</b>，那个氢不带足够的正电。',
 warn:'<b>书只给了一句归类</b>（p032：偶极间静电作用的特例；p012 同样）；供体/受体和方向性是自己带的。同学转述的实测追问链正是「蛋白质靠什么维系 → 氢键 → <b>氢键是什么</b> → 谁能形成 → 为什么 X 和 Y 不能」。你的主干里「主链氢键」要说三次，所以这一刀几乎一定会来。',
 good:'<b>停止句：</b>“Below that it is electrostatics plus a little orbital overlap — physical chemistry rather than biochemistry.”'},
{r:'高', q:'What do you mean by “the sequence”?',
 en:'“The <b>exact order</b> in which the amino-acid residues follow one another along the chain, joined by <b>peptide bonds</b> — and by convention written from the N-terminal residue, the one with a free amino group, to the C-terminal one. The chain is <b>unbranched</b>, so that order is a single well-defined string.”',
 cn:'<b>「精确顺序」「肽键」「有方向」「不分枝」——四件事。</b>只说 “the order of amino acids” 会漏掉后两件，而那两件正好是他下一刀会问的。<br><br>书 §2.1.4（<span class="pg">p026</span>）把这四件事写在同一段里，还顺带把链拆成<b>规律重复的主链</b>和<b>可变的侧链</b>——你主干里反复说的「主链氢键」就是靠这句话站住的。',
 good:'<b>如果他接着问「为什么要知道序列」，书 p026 列了理由，第一条最好用：</b>分析序列与三维结构的关系能揭示肽链在空间中排布的规则，<b>所以序列是 DNA 里的遗传信息和决定功能的三维结构之间的连接环节</b>。这一句同时是桥 2。'},

{r:'实测', q:'How far apart is “far apart”? Give me a number.',
 en:'“There is no number, and the textbook says so — it writes that the boundary between secondary and tertiary structure is <b>in some cases difficult to define</b>. The line is drawn by a <b>criterion</b>, not by a distance: secondary structure is what can form <b>locally, as the chain emerges</b>, from residues that are near each other in the sequence. Tertiary structure needs residues that only meet <b>once the whole chain has folded back on itself</b>.”',
 cn:'<b>他问一个数字，而这个边界没有数字。编一个就死定了。</b><br><br>能给的<b>操作性锚点</b>（都是书里的）：α-helix 的氢键跨<b>大约一整圈</b>，也就是三到四个残基；β-turn 是 <b>n → n+3</b>。所以「近」在实践中就是<b>一圈之内、几个残基</b>。「远」是指那些<b>只有等整条链折回来才碰得到</b>的残基，可能隔几十上百个。',
 good:'<b>他还追？分成两件事答——这是这道追问的完整版：</b><br><br><b>① 具体结构的数字是存在的，而且精确：</b><br>α-helix 氢键 <b>i → i+4</b>（每圈 3.6 残基，螺距 0.54 nm）· β-turn <b>n → n+3</b> · 3₁₀ helix i+3 · π-helix i+5。<b>这些可以直接报。</b><br><br><b>② 但「类别的边界」那个数不存在，而且不该存在。</b>因为 <b>β-structure 打破任何阈值</b>：两段配对的链可以隔一百个残基，仍然是二级结构——定义它的是主链氢键的规则重复，不是距离。<br><br><b>③ 为什么不该存在：这个分级是人划的，不是分子自带的。</b>书自己在证明这一点——它先给四级，然后说「pozdější studie」又加了 supersecondary 和 domain。<b>一个会被后人加两层的分类，是描述工具，不是自然事实。</b><br><br>完整说法：<br>“The individual structures have exact numbers — the α-helix hydrogen bond spans <b>i to i+4</b>, a β-turn is <b>n to n+3</b>. What has no number is the boundary between the <b>categories</b>, because the categories are a description we impose rather than something the molecule has. The β-structure is the case that breaks any cutoff: two strands a hundred residues apart in the sequence are still secondary structure, because what defines it is regular main-chain hydrogen bonding, not proximity.”<br><br><b>这个答案比任何数字都强</b>：它给出了真实存在的数、说清了哪个数不存在、并说明了为什么不存在。最后那句 “a description we impose” 是 researcher 的标志。'},

{r:'高', q:'You put the disulfide bridges under primary structure. Then why do they hold the tertiary fold?',
 en:'“Because those are two different questions. <b>Which cysteines are joined</b> is part of the covalent description of the chain, so this textbook — and Lehninger — list the disulfide positions with the primary structure. <b>What the bridge does</b> is lock a fold that has already formed: the textbook says it contributes mainly to stabilising an already formed structure. And the pairing is not automatic — the textbook says disulfide formation is not specific, and protein disulfide isomerase in the ER reshuffles the bridges until the native pairing is reached.”',
 cn:'p033 把二硫键的<b>位置</b>算进一级；p032 说它「主要是稳定<b>已经形成</b>的结构」（<i>přispívají zejména ke stabilizaci již vytvořené struktury</i>）；p034 又把它列进固定球蛋白折叠的五样力里。<b>三处不矛盾：一处说它在哪一级登记，两处说它干什么。</b>把三处连起来说，比只说「别的教材算三级」稳得多。',
 good:'<b>他再追「那为什么胞质蛋白基本没有二硫键」</b>——那是卡 13 的地盘：胞质是还原环境，有足够游离巯基，S–S 会被拆回去，只有 ER 里留得住。<b>这是一个你想接的口子。</b>'},

{r:'高', q:'Give me an example for each level.',
 en:'“Primary: insulin, the first sequence ever read, Sanger 1953 — and the textbook’s example of why it matters is sickle-cell anaemia, glutamate at position 6 of the β-chain of haemoglobin replaced by valine. Secondary: the α-helix of keratin, the β-structure of silk fibroin, the collagen helix. Tertiary: myoglobin — one chain, mostly α-helix folded around a heme, the first structure solved. Quaternary: haemoglobin, two α and two β chains — or the textbook’s own example, an antibody, where the antigen-binding site is made of parts of both chain types.”',
 cn:'全部在书里：insulin 与镰刀型贫血 p009、p027 · keratin / fibroin / collagen p034 · 肌红蛋白 p009、p034 · 抗体 p033。<b>血红蛋白一定放四级，别放三级。</b>书还有一个四级的好例子在后门区：<b>乳酸脱氢酶</b>四聚体，H 和 M 两种亚基拼出 H₄、H₃M、H₂M₂、HM₃、M₄ 五种同工酶，动力学性质不同，机体拿它调代谢（p064–p065）——这是任何酶题走出去会掉进的那一块。',
 good:'<b>他接着问「为什么四级值得单独算一级」</b>——下一条，有英文整句。'},

{r:'高', q:'Why does quaternary structure deserve a level of its own?',
 en:'“Because the <b>contacts between subunits are often where the activity is</b>. The textbook’s example is the antibody: the antigen-binding site is built from parts of chains belonging to both kinds of subunit, so it exists on neither chain alone. And allosteric enzymes are, as the textbook says, usually built of subunits — regulation works through the interfaces. So quaternary structure is not chains piled together; it is the level at which activity can appear only at a contact surface.”',
 cn:'p033：亚基的连接处或接触面常常对生物活性重要，抗体的抗原结合位点由两种亚基各出一部分拼成。p063：别构酶通常由亚基组成。'},

{r:'高', q:'What is the difference between conformation and configuration?',
 en:'“A conformation you can change by <b>rotating</b> bonds. A configuration you can only change by <b>breaking and remaking</b> one. Folding is conformational — the L configuration at every α-carbon is untouched. The one borderline case is the peptide bond itself: because of its partial double-bond character the textbook calls cis and trans <b>configurations</b>, and the cell has an enzyme, peptidyl-prolyl isomerase, to catalyse that rotation.”',
 cn:'这题是捷克这门课的口味：<b>它比一般生化更看重有机化学</b>。答完顺手给例子：D/L 氨基酸、cis/trans 肽键——两条各有英文整句，在下面。',
 warn:'书里<b>没有</b>把这两个词并排解释过。这条要自己带着。'},
{r:'实测', q:'What is denaturation?',
 en:'“A native protein has a definite spatial arrangement — its characteristic conformation — and its biological activity depends on it. <b>Denaturation is the loss of that native conformation</b> under physical or chemical agents: the protein passes to a less ordered form, a random coil, loses its biological function and changes its physical properties. The first effect of every denaturant is that the chain <b>unfolds</b>, which exposes the nonpolar residues that were inside the globule, so solvation and solubility drop. Physical causes: heat, even just foaming the solution. Chemical: strong acids and bases, organic solvents, detergents, urea, guanidine.”',
 cn:'p035 整节。<b>「变性」= denaturation：构象丢了，共价键没动。</b>「变质」不是生化名词——那是食品腐败（微生物、氧化），别混。书还说变性有正面用处：变性蛋白更容易被水解酶消化（做熟食物的道理）、杀灭病原（热或化学灭菌）。'},

{r:'高', q:'Why is denaturation sometimes reversible and sometimes not?',
 en:'“It depends on concentration. Add the denaturant carefully to a <b>very dilute</b> solution and the unfolding is reversible — remove the agent slowly and the protein returns to its native form. In a <b>more concentrated</b> solution a second process sets in: the newly exposed side chains interact with each other, the molecules aggregate and solubility falls further — that is irreversible. In some cases, heat denaturation for instance, the protein comes out of solution altogether; the textbook calls that <b>coagulation</b>. With other agents — detergents, urea — there is no coagulation.”',
 cn:'p035 原文一段。这一条同时是「为什么煮鸡蛋不可逆」的答案。'},

{r:'高', q:'What does denaturation actually destroy — which level goes first?',
 en:'“The covalent level survives: the sequence and the disulfide positions are untouched. What is lost is the spatial arrangement — the protein goes to a random coil, loses its biological activity and changes its physical properties.”',
 cn:'书 p035 有整整一节。<b>书自己给了机制</b>：所有变性剂的第一作用是把肽链展开，于是原来埋在球内的<b>非极性残基被暴露出来</b>，溶剂化下降、溶解度下降。<br><br>「为什么有时候可逆有时候不可逆」单独一条在上面，有英文整句。<span class="pg">p035</span>'}
]},

{g:'为什么类', gn:'卡上给了结论没给理由的地方，就是他会插刀的地方。', items:[
{r:'实测', q:'Why does collagen need almost thirty percent glycine?',
 en:'“Because in that kind of helix <b>every third side chain points into the axis</b>, and the only residue that fits there is the one whose side chain is a single hydrogen — glycine.”',
 cn:'<b>这本书把两半都给了，但没有连起来。</b>p031 同一段里既说「含近 30% glycine」，又说「三分之一的侧链朝向螺旋内部」。<b>连起来就是答案。</b><br><br>这种题正是老师喜欢的：材料都在书里，考的是你有没有把它读成一个机制而不是两个事实。',
 good:'<b>顺势给出的第二层：</b>4-hydroxyproline 和 proline 又占了另外 30%，所以 collagen 的一级结构几乎是「甘氨酸 + 脯氨酸」的重复。<span class="pg">p031</span>'},
{r:'高', q:'Why is proline the one amino acid an α-helix cannot take?',
 en:'“Two reasons. Its side chain closes back onto its own α-amino nitrogen, making a five-membered <b>pyrrolidine</b> ring — so proline is a secondary amine, an imino acid — and that nitrogen has <b>no N–H left to donate</b> a hydrogen bond. And the five-membered ring locks one of the two rotatable backbone angles, so the chain cannot take the helical geometry.”',
 cn:'卡上只写了「装不下 proline」这个结果。顺便把 proline 的另一面也准备好：<b>cis 肽键几乎只出现在 proline 旁</b>（p027）——英文整句在「What do cis and trans mean」那条。环的名字在「What is that ring called」。',
 warn:'这条的两个理由<b>不是书上的</b>，是通用解释。说的时候不要说「书上写」。'},
{r:'实测', q:'Why does the peptide bond have partial double-bond character?',
 en:'“Because the <b>lone pair on the nitrogen is delocalised into the carbonyl</b>: the electrons are shared over O–C–N rather than sitting on the nitrogen, so the C–N bond is a hybrid between a single and a double bond. The measurement says so — the C–N is <b>1.32 Å</b>, between a single C–N at 1.49 and a double at 1.27. And a bond with double-bond character <b>cannot rotate</b>: the six atoms of the amide — the two α-carbons, C, O, N and H — lie in one <b>plane</b>, which is why there are cis and trans forms at all, and why the only free rotations in the backbone are the two single bonds at the α-carbon.”',
 cn:'全在 p027–p028，书的原话是「羰基 π 电子和氮的自由电子对<b>部分离域</b>」（<i>částečné delokalizace π-elektronů karbonylu a volného elektronového páru dusíku</i>），然后「不能自由转动」→ cis/trans → 球蛋白里几乎全是 trans、cis 只在 proline 旁；p028：肽键原子共面，Cα–C 和 Cα–N 是单键可以转，所以主链是<b>一串刚性平面被 –CHR– 隔开</b>（Obr. 2.6）。<br><b>三件事按这个顺序说：原因（离域）→ 证据（键长）→ 后果（平面、不能转、cis/trans）。</b>只说「它是部分双键」而不说为什么，他下一句一定是 why。',
 good:'<b>这条有一个值得主动接的后果：</b>同一个离域让羰基 O 带部分负电、N–H 带部分正电，所以主链的 C=O 和 N–H 是<b>很强的一对氢键受体和给体</b>——二级结构靠主链氢键，根子就在这里。一句话把段 3 和「为什么主链氢键」接上。<br><b>停止线：</b>他要追「为什么孤对会离域」——「因为离域把电荷放到电负性更大的氧上，整体能量更低。再往下是轨道，物理化学。」<b>不要说 sp2、不要画轨道。</b>'},

{r:'实测', q:'What is that ring called?',
 en:'“Proline’s is a <b>pyrrolidine</b> — a saturated five-membered ring with one nitrogen, and that nitrogen is the α-amino group itself. Histidine’s is an <b>imidazole</b> — an aromatic five-membered ring with two nitrogens, weakly basic, which is why it can take or give a proton near neutral pH. Tryptophan’s is an <b>indole</b>, a benzene fused to a pyrrole. Phenylalanine carries a <b>phenyl</b> ring, plain benzene; tyrosine a <b>phenol</b>, benzene with a hydroxyl.”',
 cn:'PESB 那次说 histidine「上面的 ring」，老师不满意——<b>环要叫名字</b>。书 p021 只说 histidine 含弱碱性的咪唑基、Phe 和 Trp 带芳香环、proline 没有自由氨基；名字本身是通用有机化学。'},

{r:'高', q:'What do cis and trans mean for a peptide bond?',
 en:'“Because the C–N bond cannot rotate, the two α-carbons on either side of it are fixed either on <b>opposite</b> sides — trans — or on the <b>same</b> side — cis. The textbook calls them configurations, and they are distinct isomers. In globular proteins trans dominates almost completely; the cis form occurs <b>practically only next to a proline</b> — about six percent of X-Pro bonds — and the cell has a peptidyl-prolyl cis-trans isomerase to interconvert them.”',
 cn:'p027 原话：不能自由转动 → 存在 cis-trans 异构体 → 球蛋白里绝对以 trans 为主，cis 实际上只出现在 proline 旁。p109：X-Pro 约 6% 是 cis，由脯氨酰顺反异构酶催化。'},

{r:'高', q:'What do D and L mean for an amino acid?',
 en:'“They name the <b>configuration at the α-carbon</b> — which way the four groups sit in space — by comparison with glyceraldehyde: L-serine is drawn from L-glyceraldehyde, in the Fischer projection with the amino group on the left. Every amino acid found in proteins is <b>L</b>, except glycine, which has no asymmetric carbon at all; threonine and isoleucine have two. D-amino acids do exist — in bacterial cell walls and some peptide antibiotics — but not in proteins.”',
 cn:'p024：除 glycine 外都属于 L 构型系列，跟 L-serine 从 L-glyceraldehyde 推出来一样；Thr 和 Ile 有两个不对称碳。「D 型在细菌细胞壁和肽类抗生素里」是通用知识。'},

{r:'高', q:'Why is the peptide bond essentially always trans?',
 en:'“Because in the cis form the two α-carbons, and therefore the two side chains, sit on the <b>same side</b> of the C–N bond and clash. Proline is the exception because its side chain loops back onto the nitrogen, so the two forms cost about the same.”',
 cn:'卡上说了「几乎总是 trans」和「cis 几乎只在 proline 旁」，<b>但没说为什么</b>。这两句连起来就是一个完整回答，而且第二句正好解释了第一句的例外。<span class="pg">p027</span>'},
{r:'实测', q:'What is the hydrophobic effect?',
 en:'“The tendency of nonpolar substances and groups in water — hydrocarbons, the nonpolar parts of lipids, the nonpolar side chains — to associate with each other and avoid being solvated, the way two drops of oil in water merge. It is <b>not an attraction between them</b>: it is the <b>entropy the water gains</b> when the ordered shell it has to form around a nonpolar surface is released. In a protein it shows in two ways: the molecule takes the shape with the <b>smallest surface</b>, and the nonpolar side chains gather into a <b>nonpolar core</b>.”',
 cn:'三句全是书的：定义和「两滴油」p012–p013 · 「不是亲和力，是水的结构变化」p013 · 两种表现 p033。<b>说完第三句就停</b>——再往下是水的熵，物理化学。<br><br><b>他从这里能往哪儿走（每条一句话，来源都在书里）：</b><br>① <b>「hydrophobic 到底什么意思」</b>——对水亲和力低的基团：烃、脂的非极性部分、非极性侧链（p012）。反面 <b>hydrophilic</b>：极性或带电，能被水溶剂化。<b>一个分子两头各占一种，书叫 amphipathic</b>（<i>amfipatie</i>，p181）：磷脂的脂肪酸尾疏水、甘油–磷酸–头基亲水。「亲脂 lipophilic」书只在膜运输那里用（p200），意思跟 hydrophobic 实际重合；「恐脂」不是一个用的词。<br>② <b>「它是键吗」</b>——不是，是驱动力。见横向卡 bonds。<br>③ <b>「还在哪里起作用」</b>——膜：双层里尾对尾、头朝外，非极性中间层，厚 3.5–4 nm，头尾之间的作用力全是非共价（p198）；整合膜蛋白靠非极性侧链跟脂尾的疏水作用留在膜里（p199）。DNA 碱基堆叠主要靠疏水作用稳定（p073，卡 03）。信号肽中段是疏水氨基酸（p110，卡 13）。<br>④ <b>「为什么肥皂让蛋白变性」</b>——去污剂两亲，钻进非极性侧链之间，把撑着核心的疏水效应拆掉；p035 把去污剂、尿素、胍列成化学变性剂，跟加热不同，不凝固。见横向卡 bonds。',
 good:'<b>哪条接、哪条停：</b>②④ 在 bonds 卡上，③ 的碱基堆叠和信号肽各有卡，<b>都可以接</b>。③ 的膜那句说完就停——再往下是脂那道题（#23），还没做。<br><b>他要追「水为什么会有序」</b>：非极性表面不能跟水成氢键，水分子只好在它周围排成笼子来保住彼此的氢键；两个非极性面靠在一起，中间的笼子放掉，熵升高。这是八分答案的第二层，被逼才给。'},

{r:'中', q:'Why does a protein need a hydrophobic core at all?',
 en:'“For a globular protein the core is what selects one conformation in water: take it away and the chain is a random coil — which is exactly what the textbook says a denatured protein becomes. Fibrillar proteins are the exception: collagen is held by hydrogen bonds between chains and glycine packing, not by a core.”',
 cn:'这条把 <b>④ 的落点</b>和 <b>denaturation 那一节</b>接在一起：p035 说变性后是 <i>náhodné či statistické klubko</i>。<b>所以「有核心」和「有唯一构象」是同一件事的两种说法。</b>'}
]},

{g:'怎么发现的', gn:'plasmid 那一类。要像 researcher 答：他们当时手上只有什么，所以只能怎么推。', items:[
{r:'实测', q:'How did anyone know a protein has one definite three-dimensional structure at all?',
 en:'“The first hint was crystallisation, in 1864 with haemoglobin. <b>A molecule that crystallises must all be the same shape</b> — a mixture of random conformations does not form a lattice. The actual structure had to wait until 1957, when Kendrew solved myoglobin by X-ray analysis.”',
 cn:'<b>「能结晶就说明形状唯一」这个论证是这题的分数所在。</b>它把一个 1864 年的现象变成一个推理，而不是一个年份。<br><br>年表全在 p009 的 Tab. 1.1：1864 Hoppe-Seyler 结晶 hemoglobin · 1902 Fischer 证明多肽本质 · <b>1951 Pauling &amp; Corey 提出 α-helix 与 β-structure</b> · 1953 Sanger 第一个序列 · 1957 Kendrew 第一个结构。方法名在 p008。'},
{r:'高', q:'Why did Pauling get the α-helix right before anyone had a protein structure?',

{r:'高', q:'How do we know the sequence determines the structure?',

{r:'中', q:'How is a protein structure actually determined today?',

{g:'相邻考点', gn:'书里紧挨着这道题的两整节，加上折叠机制。他从这道题走出去，多半走这几个方向。', items:[

{r:'高', q:'Does the sequence really fold the protein by itself?',
 en:'“Not always. The textbook says only some proteins — mostly small ones, and a few more complex — go spontaneously to the conformation of lowest energy. But the textbook says that for a number of proteins <b>the biologically active conformation is not the energetically most favourable one</b> — so folding of the nascent chain is a directed process, catalysed by <b>chaperones</b>.”',

{r:'中', q:'How do you determine the molecular mass of a protein?',

 {n:'01', t:'定义',
  big:'Kd 是<b>解离反应的平衡常数</b>：复合物拆成两个游离组分',
  en:'“A dissociation constant is <b>defined</b> as the <b>equilibrium constant</b> of a dissociation reaction — a complex, say a protein and its ligand, coming apart into its two free partners — the ratio their concentrations settle at once the complex is falling apart as fast as it forms.”',
  note:'<b>「平衡常数」这四个字把整题的性质定死了</b>：平衡常数属于热力学，不属于动力学。后面 Km 那个陷阱就是靠这句话挡住的。'},
 {n:'02', t:'式子',
  big:'游离的两个，除以复合物：<b>Kd = [P][L] / [PL]</b>',
  en:'“The concentration of free protein times the concentration of free ligand, divided by the concentration of the complex. The textbook writes exactly this form for the inhibition constant: <b>K i equals free enzyme times free inhibitor over the enzyme–inhibitor complex</b>.”',
  note:'<b>用书自己的写法开口。</b>全书唯一明确定义成解离常数的就是 p060 的 Ki = [E][I]/[EI]——老师能对上他书里的东西。<span class="pg">p060</span>'},
 {n:'03', t:'量纲',
  big:'分子分母差一个浓度，所以<b>它的单位是浓度</b>',
  en:'“Because it is a ratio of two concentrations over one concentration, it has <b>units of concentration</b> — so it can be compared directly with a concentration.”',
  note:'这一句是下一点的前提。<b>先给量纲，再给「半数占据」的读法</b>，顺序反了就成了背结论。'},

 {g:'三个推论', gn:'定义给完，这三条是自动跟出来的，不是另外要背的东西。'},
 {n:'04', t:'数值的意思',
  big:'它等于<b>半数结合位点被占据时的游离配体浓度</b>',
  en:'“Numerically it is the free-ligand concentration at which <b>half the binding sites are occupied</b>.”',
  note:'为什么成立：把 [L] = Kd 代回质量作用式，[PL] 就等于 [P]，正好一半。<b>这不是巧合，是定义直接推出来的</b>——所以能从结合曲线上直接读中点。'},
 {n:'05', t:'方向是反的',
  big:'<b>Kd 越小，结合越紧</b>',
  en:'“The direction is inverted: a <b>small</b> K d means <b>tight</b> binding, because a small number means the complex does not come apart easily.”',
  note:'<b>被问急了最容易说反。</b>记法：Kd 是「<b>拆开</b>」的常数，拆得越难，数越小。倒数是 Ka，association constant：“Its reciprocal is the association constant, K a — one over K d — which runs the intuitive way: larger means tighter.”'},
 {n:'06', t:'也能从速率读',
  big:'<b>Kd = k<sub>off</sub> / k<sub>on</sub></b>——同一个数，两条路到达',
  en:'“It has a kinetic reading as well: K d equals the off-rate divided by the on-rate. The same number can be reached from equilibrium or from the two rate constants.”',
  note:'<b>注意措辞</b>：kon 和 koff 各自是动力学量，<b>它们的比值才是热力学量</b>：“k on and k off are each kinetic quantities; their ratio is an equilibrium constant, so K d itself is thermodynamic.” 两个 Kd 相同的结合，kon 和 koff 可以差几个数量级，生物学后果完全不同。'},

 {g:'再深一层', gn:'时间不够可以砍这一格，但它是 ④ 的落点。'},
 {n:'07', t:'它其实是自由能',
  big:'ΔG°(结合) = RT ln Kd —— <b>一个数就是一个自由能</b>；书 p018 写 ΔG° = −RT ln K，差的是方向',
  en:'“Because it is an equilibrium constant, it is a free energy in disguise: the standard free energy of <b>binding</b> equals R T times the natural log of K d. The textbook’s form is delta G equals <b>minus</b> R T ln K — the sign flips because K d describes the reverse direction, coming apart. Every <b>tenfold</b> tightening is about <b>5.7 kilojoules per mole</b> at 25 degrees — 298 kelvin.”',
  note:'✔ 已算：RT ln10 在 298.15 K = <b>5.71 kJ/mol</b>。<b>书里没有这个数</b>，它来自热力学定义。被追问出处就说 “that is just R T ln ten”。<br><b>方向必须说。</b>书 p018 印的是 −ΔG° = RT ln K，即 ΔG° = −RT ln K。Kd 是<b>解离</b>的 K，所以 ΔG°(解离) = −RT ln Kd，ΔG°(结合) = +RT ln Kd。只说 “delta G equals RT ln Kd” 不说哪个方向，他拿 p018 一对就是「你符号错了」。<br>「standard」被问：“Standard means all components at unit activity; the biochemical standard state, marked with a prime, fixes hydrogen-ion activity at pH 7 instead.”（p018）'},

 {g:'收尾', gn:'一句停住，一句伸出去。这题有两条停止线，第二条更适合你。'},
 {n:'08', t:'落点一 · 热力学',
  big:'再往下 Kd 只是<b>浓度尺度上的一个自由能差</b>',
  en:'“Below that, K d is just a free-energy difference on a concentration scale, and how that free energy splits into enthalpy and entropy is <b>calorimetry rather than biochemistry</b>.”',
  note:'标准停止句，落在热力学这块地基上。'},
 {n:'09', t:'落点二 · 测量限制',
  big:'一个 Kd <b>只和它背后那个平衡一样可靠</b>',
  en:'“There is also a practical floor: a K d is only as good as the equilibrium behind it. <b>Below roughly the concentration of your own binding sites</b>, a titration stops reporting affinity and starts reporting how much protein you put in.”',
  note:'<b>这条比上一条更适合你</b>，因为说完可以顺势转进主场。它落在「测量方法的限制」那块地基上。'},
 {n:'10', t:'留口子',
  big:'这就是<b>你自己在测的那个数</b>',
  en:'“And this is the number I actually measure. I work with <b>yeast display</b>: you titrate labelled antigen against cells and read the midpoint by <b>flow cytometry</b>. What decides whether the number means anything is whether the titration really reached equilibrium — at low concentrations that can take hours — the approach to equilibrium runs at k on times the ligand concentration plus k off, and at low ligand that is essentially k off alone, of the order of one per hour for a nanomolar binder — and if you read too early you report a K d that is too weak.”',
  note:'<b>三个口子全在你的地盘</b>：yeast display、flow cytometry、平衡时间。他追哪一个都答得住。'}
],

recog:[
{q:'What is Kd?',
 mean:'<b>他真正会说出口的那句，就这么短。</b>所以答案要自带结构：是什么类的常数 → 式子 → 量纲 → 数值的意思。四步一次给完，别等他一层层问。',
 say:'“It is the equilibrium constant of the dissociation reaction — free protein times free ligand over the complex. Because it is a ratio of concentrations over a concentration, it has units of concentration, and numerically it is the free-ligand concentration at which half the binding sites are occupied.”'},

{q:'What does affinity mean?',
 mean:'他在问同一件事，只是用了那个更含糊的词。<b>把含糊的词换成能测的量，就是答案。</b>',
 say:'“Affinity is the <b>strength of binding</b> — how strongly one partner holds the other, or equivalently how far the equilibrium lies toward the complex; the textbook’s phrase is ‘the strength of the interaction’. K d is the number that measures it, and it runs the other way: a <b>lower</b> K d means higher affinity. That inversion is worth saying out loud, because the word and the number run in opposite directions.”'},

{q:'Which binds more tightly — a Kd of one nanomolar or one micromolar?',
 mean:'<b>纯粹测你会不会说反。</b>一句话答完，别解释太多。',
 say:'“One nanomolar. K d is the constant for coming apart, so the smaller number is the tighter complex — a thousand times tighter here.”'},

{q:'Is Km the same as Kd?',
 mean:'<b>这题的核心陷阱，而且书自己前后打架。</b>先给书的读法，再给成立条件，最后指出书自己在别处给了干净的定义。',
 say:'“Not in general. K m is k minus one plus k two, over k one — <b>substrate falling off, plus the catalytic step, over binding</b> — while a true dissociation constant is k minus one over k one; they coincide only when the catalytic step is negligible next to the substrate falling off. The textbook does read K m as an affinity, and by its own description of the mechanism that is fair: it says binding of substrate to enzyme is <b>fast and reversible</b> and the catalytic step slower — so the substrate falls off far more often than it is turned over. What is always true is the book’s other sentence: K m is the substrate concentration at half-maximal rate in the <b>steady state</b>, whereas K d is the free-ligand concentration at half occupancy at <b>equilibrium</b>. The clean dissociation constant in this book is K i, free enzyme times free inhibitor over the complex.”',
 tail:'书 <span class="pg">p055</span> 把 Km = (k₋₁+k₂)/k₁ 的式子<b>印出来了</b>（已回原图确认），<span class="pg">p056</span> 却说它「vyjadřuje afinitu」。<b>你是在引用这本书反驳这本书，那是最安全的位置</b>——不是「别的教材说」，是「你这本书第 55 页印的式子说」。<br><b>p054 帮你一把</b>：书自己写第一步「快而可逆」、第二步「更慢、不可逆」（<i>Tento krok je rychlý a reverzibilní … Tato reakce je pomalejší</i>），那正是 k₂ 可忽略的条件——所以「书为什么敢把 Km 叫亲和力」有书内的解释，比单纯「书打架」稳。<b>⚠ 别顺嘴报 kcat 的数：书 p058 的 turnover number 按「每分钟」定义</b>，通用是每秒。'},

{q:'How would you measure it?',
 mean:'<b>你的主场。</b>方法 ＋ 那个决定数字是否有意义的条件。',
 say:'“Titrate one partner against a fixed amount of the other and read the midpoint of the binding curve — the free concentration at half the maximal signal. I use yeast display and flow cytometry, so each cell reports its own binding. The thing that decides whether the number is real is whether the titration reached equilibrium — at low concentrations that takes hours, and reading early makes the K d look weaker than it is.”'},

{q:'Why does a titration stop working if you go low enough?', odd:1,
 mean:'问的是<b>浓度下限</b>，也就是「半数占据 ≠ 半数蛋白被用掉」那条陷阱。',
 say:'“Because once the K d you are measuring is at or below the concentration of binding sites in the tube, the free ligand is no longer what you pipetted — most of it is bound. Half-occupancy is defined by the <b>free</b> concentration, so the midpoint drifts to roughly <b>K d plus half your site concentration</b> and stops reporting affinity. So you keep the sites well below K d, or fit the depletion explicitly.”'},

{q:'Why do some drugs work at much lower doses than others?', odd:1,
 mean:'<b>听起来是药理题，其实就是 Kd。</b>',
 say:'“Largely because of the dissociation constant of the drug for its target. A drug with a nanomolar K d occupies half its target sites at a nanomolar free concentration; one with a micromolar K d needs a thousand times more. It is the same number, read as a dose.”',
 tail:'⚠ 真实药效还牵涉吸收、代谢、靶点丰度：“Largely — dose also depends on absorption, metabolism and how much target there is, but those are pharmacology rather than biochemistry.”<b>说 "largely" 不要说 "because"</b>，否则他会顺着药代动力学问下去，那不是生化。'},

{q:'Two antibodies have the same Kd. Are they the same?', odd:1,
 mean:'问的是<b>热力学量和动力学量的区别</b>——速记第 6 点。',
 say:'“Not necessarily. K d is the ratio of the off-rate to the on-rate, so two binders can share a K d and still differ by orders of magnitude in both rates. One may take hours to come off and hours to go on; the other, seconds and seconds. Biologically those behave very differently.”',
 tail:'<b>这一条很能显出你真的用过这个数</b>，而不是背过它的定义。'},

{q:'What is the significance of the Michaelis-Menten equation?',
 mean:'题库 #21。<b>它整个落在这张卡的页范围里</b>，所以顺手就答了。',
 say:'“Its significance is that one equation with two constants describes the whole dependence of an enzyme’s <b>initial rate</b> — measured before product accumulates — on substrate concentration, and gives both constants a meaning: v equals V max times substrate concentration, over K m plus substrate concentration — a hyperbola. K m is the substrate concentration at half-maximal rate — in the derivation, k minus one plus k two, over k one, the rate constants left in the denominator; V max is the rate when every enzyme molecule is in the complex — <b>saturated</b>. It covers both limits: first order at low substrate, zero order at saturation, where the rate is proportional to enzyme — which is why activity is assayed at saturating substrate, and why inhibitors are classified by what they do to K m and V max. It comes from the steady-state assumption: the enzyme–substrate complex builds up and then stays constant, because it forms as fast as it breaks down.”',
 tail:'书的两步机制在 <span class="pg">p054</span>：E + A ⇌ EA <b>快且可逆</b>，EA → E + X <b>慢且不可逆</b>。'},

{q:'What is inhibition constant Ki?',
 mean:'<b>书里唯一明确叫「解离常数」的东西。</b>而且有两个 Ki，别混。',
 say:'“The textbook defines it as the dissociation constant of the enzyme–inhibitor complex: free enzyme times free inhibitor over E I. For uncompetitive inhibition there is a second one, K i prime, for the enzyme–substrate–inhibitor complex.”',
 tail:'竞争性抑制的经典例子书给了：<b>malonate 抑制 succinate dehydrogenase</b>——像底物到能结合，但不能被脱氢。图上的表现是 <b>Vmax 不变、Km 升高</b>。英文：“The textbook’s classic competitive example is malonate inhibiting succinate dehydrogenase — similar enough to bind, but it cannot be dehydrogenated; on the plot V max is unchanged and K m rises.”<span class="pg">p060</span>'}
],

ask:[
{g:'定义类', gn:'他默认你知道这些词。而这题的每个词都很容易被追。', items:[
{r:'实测', q:'What is the Michaelis constant?',
 en:'“K m is the <b>substrate concentration at which the initial rate is half of V max</b>. It comes out of the steady-state derivation as k minus one plus k two, over k one — the ratio of rate constants in the denominator of the Michaelis–Menten equation. It has units of concentration and characterises one enzyme–substrate pair; the textbook reads it as the affinity of enzyme for substrate, and it is a true dissociation constant only when the catalytic step is negligible.”',
 cn:'p055 印了式子，p056 给了「半饱和的底物浓度」和「有浓度的量纲」。正面定义放前面，Km 对 Kd 的陷阱在同一个答案题那条。'},
{r:'高', q:'What is a steady state, and how is it different from equilibrium?',
 en:'“A steady state is when a concentration stops changing because it is <b>formed as fast as it is removed</b>, while material still flows through — here the enzyme–substrate complex, formed as fast as it breaks down to product. Equilibrium is the special case where every step is itself balanced and nothing flows. The textbook says living matter is mostly in a stationary state that only looks like equilibrium.”',
 cn:'p055 稳态假设的原话；p018 「生命物质多处于看起来像平衡的稳态，平衡是它的特例」。Km 是稳态量、Kd 是平衡量，这条是那句话的地基。'},
{r:'高', q:'What is activation energy?',
 en:'“The energy barrier the reactant molecules must overcome to be converted into product — the textbook says that for A to become X, the molecules of A must be supplied with the activation energy. Heat can supply it; a catalyst lowers it by taking the reaction through a different mechanism.”',
 cn:'p054，Obr. 3.1。'},
{r:'中', q:'What do first order and zero order mean here?',
 en:'“First order in substrate means the rate is directly proportional to substrate concentration — the low-substrate limit, substrate far below K m. Zero order means the rate no longer depends on substrate at all — at saturation, substrate far above K m, v equals V max and is proportional to enzyme alone, which is why activity is measured there.”',
 cn:'p055–p056 两个极限；p058 活性测定要在饱和底物下。'},
{r:'中', q:'What is a rate constant?',
 en:'“The proportionality constant between a rate and the concentrations it depends on — v equals k times the concentration for a one-body step, k times the product of two concentrations for a binding step. It is what a catalyst changes; an equilibrium constant is a ratio of rate constants.”',
 cn:'通用。'},
{r:'中', q:'What is the turnover number?',
 en:'“Molecular activity, formerly the turnover number: the number of substrate molecules converted by one enzyme molecule per unit time — the textbook defines it <b>per minute</b>, the general k cat is per second. It is obtained from V max and the molar mass of the enzyme.”',
 cn:'p058。报数之前先说清按分钟还是按秒。'},
{r:'中', q:'What is a ligand?',

{r:'中', q:'What are enthalpy and entropy, then?',

{r:'高', q:'What is an equilibrium constant?',

{r:'高', q:'What is kinetics, then?',

 cn:'<b>这是「动力学」这块地基的定义，32 张卡共用。</b>书用<b>反应级数</b>给它下操作定义：底物低时速率正比于 [S]（一级，<span class="pg">p056</span>），底物饱和时速率与 [S] 无关只正比于 [E]（零级，<span class="pg">p058</span>）。书还顺带给了实用推论：<b>测酶活性要在饱和底物浓度下做</b>。',

{r:'中', q:'What is mass action?',

{r:'中', q:'What is occupancy?',

<script>

/* 卡 03 · What are the differences between DNA and RNA?
   题库 #3（S1 Biochemistry 3 ＋ S3 Biochemistry 2）· 导师写过两遍

   题型：比较题。第一张这个类型，形状见 recog 第一行。 */

window.CARDS.push({
id:'03', n:3, w:3,
q:'What are the differences between DNA and RNA?',
qcn:'DNA 和 RNA 有什么区别',
sub:'主干说完约 80 秒 · 比较题 · 导师写过两遍',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'⚠ 比较题的第一句决定成败：先说比较的轴，再往轴上填。交替列特征＝一张清单，不是一个理解。'},
 {n:'01', t:'上位类',
  big:'两者都是<b>核酸</b>：储存和传递遗传信息的大分子；化学上是 <b>polynucleotide</b>。DNA 是信息的载体，RNA 是蛋白合成的直接模板',
  en:'“Both are nucleic acids — the macromolecules that <b>store and transmit genetic information</b>; chemically, polynucleotides, chains of nucleotides joined by <b>phosphodiester bonds</b>. A nucleotide is a nitrogenous base — a purine or a pyrimidine — a pentose, and at least one phosphate. DNA is the material carrier of the information, stored as the order of its bases; RNA is the working copy — the direct template for protein synthesis.”',
  note:'先给共同的上位类，<b>而且要说各自是什么、干什么</b>。书 p066 §4.1 第一句就是功能定义（<i>uchovávají a přenášejí genetickou informaci</i>）；p076 DNA 是遗传信息的物质载体，信息以碱基顺序存储；p085 DNA 不是蛋白合成的直接模板，模板是 RNA。<b>只列三条化学区别、不说各自是什么，就是卡 01 三级结构那种错——判据不是定义。</b>'},
 {n:'02', t:'三条轴',
  big:'区别只有三条轴：<b>糖</b>、<b>其中一个碱基</b>、<b>链数</b>',
  en:'“So chemically the question is three questions: <b>which pentose, which bases, and how many chains</b>. The fourth difference — what each one is for — is what the chemistry is paying for.”',
  note:'<b>这一句是整题的骨架。</b>说完它，后面无论他挑哪一条追，你都在自己的框架里答。<br><b>这一招适用于所有比较题</b>（#14、#28 都用它）。'},

 {g:'三条轴分别是什么', gn:'一条一句，不要展开。展开留给段 3。'},
 {n:'03', t:'轴一 · 糖',
  big:'DNA 是 <b>2-deoxy-D-ribose</b>，RNA 是 <b>D-ribose</b>——差别就是一个 <b>2′-OH</b>',
  en:'“DNA has 2-deoxy-D-ribose, RNA has D-ribose. The whole difference is one hydroxyl — the one on <b>carbon two of the sugar ring</b>, written 2-prime because the sugar carbons are primed to keep them apart from the numbering of the base.”',
  note:'<b>「差别就是一个羟基」这个说法值钱</b>，因为它把一个名词差异变成了一个可以往下追的化学事实。<span class="pg">p067</span>'},
 {n:'04', t:'轴二 · 碱基',
  big:'共用 A、G、C；<b>uracil 实际上只在 RNA</b>，<b>thymine 主要在 DNA</b>',
  en:'“Both use the purines adenine and guanine and the pyrimidine cytosine. Of the other two pyrimidines, uracil is found <b>practically only</b> in RNA, and thymine <b>predominantly</b> in DNA — the textbook is careful with those words, and so am I.”',
  note:'<b>书用的就是这两个限定词</b>（prakticky pouze / převážně）。<b>不要说「thymine 只在 DNA」</b>——tRNA 的 T-loop 里有 ribothymidine（通用知识；书 p087 只说 tRNA 环上有「minoritní báze」，没点名）。<b>跟着书加限定词，本身就是分数。</b><span class="pg">p067</span>'},
 {n:'05', t:'轴三 · 链数',
  big:'DNA 通常是<b>右手双螺旋</b>；mRNA 和 rRNA 是单链，<b>但 rRNA 有配对成螺旋的局部</b>',
  en:'“DNA is normally a right-handed double helix. Messenger and ribosomal RNA are single-stranded — though parts of ribosomal RNA pair up into helices.”',
  note:'<b>后半句必须说。</b>「RNA 是单链」这句话只对 mRNA 的整体拓扑成立，rRNA 和 tRNA 都有二级结构。<span class="pg">p086</span>'},

 {g:'双螺旋要会的四件事', gn:'他挑「链数」那条轴追的时候，就是这四件。'},
 {n:'06', t:'配对规则',
  big:'A–T <b>两个</b>氢键，G–C <b>三个</b>',
  en:'“Hydrogen bonds form only between particular bases for <b>steric</b> reasons — two between adenine and thymine, three between guanine and cytosine. Generally: a purine always faces a pyrimidine, so every pair has the same width and the backbone stays regular, and only A–T and G–C have matching hydrogen-bond donors and acceptors.”',
  note:'<b>说反是最常见的失误。</b>记法：GC 含量高的 DNA 熔点高，因为每对多一根氢键。书还说这个特异性正是<b>复制准确性的来源</b>。<span class="pg">p073</span>'},
 {n:'07', t:'互补不等于相同',
  big:'一条链决定另一条，但<b>不等于另一条</b>',
  en:'“The sequence of one strand is <b>complementary but not identical</b> to the other — each base sits opposite the one base it can hydrogen-bond with, so one strand fixes the other without being a copy of it.”',
  note:'这一句是「为什么两条链」的答案的一半：<b>互补意味着一条链就是另一条的备份</b>，信息存了两遍——这是修复的前提。'},
 {n:'08', t:'反平行',
  big:'两条链方向相反：一条 <b>5′→3′</b> 往上，另一条同方向往下',

 {n:'09', t:'还有第二层力',
  big:'除了氢键还有<b>碱基堆叠</b>，而书说它主要靠<b>疏水</b>作用稳定',
  en:'“Beyond the hydrogen bonds the helix is held by <b>base stacking</b> of the flat rings, which the textbook attributes mainly to <b>hydrophobic</b> interactions — and it adds a third element: the phosphates are fully ionised at pH 7 and are neutralised by counter-ions such as Mg²⁺ or Mn²⁺.”',
  note:'<b>只说氢键就漏了大半。</b>他追问「还有什么在稳定它」时，这一句就是答案。而且它接上了卡 01 的落点——疏水效应是水的熵。<br>书 p074 还有第三样：磷酸根在 pH 7 全部电离，跟 Mg²⁺/Mn²⁺ 的离子相互作用也算稳定因素。<b>「两样」是封闭清单，他一句「还有吗」就穿了。</b><span class="pg">p073 p074</span>'},

 {g:'构象与 RNA 的种类', gn:'时间不够可以砍这一组，但 Z-DNA 是左手这条很容易被单独问。'},
 {n:'10', t:'DNA 不止一种构象',
  big:'生理条件下几乎全是 <b>B-DNA</b>；含水降到 <b>75%</b> 转 <b>A-DNA</b>；<b>Z-DNA 是左手</b>',
  en:'“Under physiological conditions DNA is almost exclusively <b>B-DNA</b>. When the relative water content drops to about seventy-five percent it goes to <b>A-DNA</b>, which is wider and flatter. And <b>Z-DNA is left-handed</b> — the other two are right-handed.”',
  note:'<b>三种里只有 Z 是左手</b>，最容易记混。A-DNA 的触发条件是<b>脱水</b>，不是温度不是盐。⚠ 75% 这个数要回原图核。<span class="pg">p075</span>'},

  big:'<b>mRNA、rRNA、tRNA、snRNA</b>、病毒 RNA',
  en:'“RNA is not one thing. Messenger RNA carries the information from DNA to the ribosome. Ribosomal RNA is the structural component of the ribosome. Transfer RNA, the smallest, carries one activated amino acid each to the ribosome. Small nuclear RNA, with proteins, forms the spliceosome. And viral RNA serves a virus as both its DNA and its mRNA.”',
  note:'<b>只报名字不说各自干什么，他下一句就是「那 tRNA 干什么」。</b>每种一句都在书里：mRNA p086 · rRNA p086 · tRNA p087（最小，4S；每种只运一种氨基酸；3′ 端都是 CCA；三叶草形）· snRNA p087、p108（跟蛋白组成剪接体）· 病毒 RNA p087。原核 rRNA 三种（<b>5S、16S、23S</b>），真核多到四种（<b>5S、5.8S、18S、28S</b>），按<b>沉降系数</b>命名。真核第一条转录本是 <b>hnRNA</b>，含 exon 和 intron，加工成 mRNA——书 p086 说「核糖核酸酶」，p108 说是剪接体。<span class="pg">p086 p087 p108</span>'},

 {g:'收尾', gn:'一句停住，一句伸出去。'},
 {n:'12', t:'落点',
  big:'脱氧核糖<b>是从核糖还原来的</b>——所以 RNA 的化学在 DNA 之前',
  en:'“Deoxyribonucleotides are not built from scratch. They are made from <b>ribonucleoside diphosphates</b> by removing the 2-prime OH by reduction — <b>ribonucleotide reductase</b> does it, the reducing equivalents come from <b>thioredoxin</b>, and oxidised thioredoxin is regenerated by <b>thioredoxin reductase</b> using NADPH.”',
  note:'<b>这是全卡最漂亮的一条</b>：书给的是一个生物合成事实（<span class="pg">p072</span>），而它直接说出了两个分子的先后。<br>停止句：“Beyond that the answer is historical rather than mechanistic — the deoxy form is derived from the ribo form, so RNA chemistry came first. There is no deeper purpose than that the arrangement survived.” <b>落在「进化」这块地基。</b>'},
 {n:'13', t:'留口子',
  big:'去掉一个反应性基团换来稳定——<b>这是为长期存储付的代价</b>',
  en:'“So the sugar chemistry differs by a single hydroxyl, and that hydroxyl is something the cell <b>actively removes</b> by reduction, spending NADPH. The base difference is likewise made by an enzyme — thymine is not built as a base, it is made by methylating deoxyuridylate. Giving up a reactive group buys stability — that is the price of using one of them as long-term storage. It is also why a whole class of drugs — hydroxyurea, which quenches the enzyme’s tyrosyl radical, and nucleoside analogues such as gemcitabine — targets ribonucleotide reductase: a dividing cell cannot make DNA without it.”',
  note:'口子留在<b>核糖核苷酸还原酶作为药物靶点</b>和 <b>RNA world</b> 上。两个都能接住，而且都不在书里也没关系——<b>这是想接的口子，不是必答题</b>。RNA world 被问：“The RNA-world hypothesis: early life used RNA both to store information and to catalyse reactions, before DNA and protein enzymes. Two footprints survive — catalytic RNAs, ribozymes, and the fact that the cell still makes deoxyribonucleotides by reducing ribonucleotides.”'}

  p:['“Both are nucleic acids — the macromolecules that store and transmit genetic information; chemically, polynucleotides, chains of nucleotides joined by phosphodiester bonds. A nucleotide is a nitrogenous base — a purine or a pyrimidine — a pentose, and at least one phosphate.',

  note:'<b>比较题的第一句决定成败。</b>先说比较的轴，再往轴上填。交替列特征（「DNA 有脱氧核糖，RNA 有核糖，DNA 是双链……」）听起来是一张清单，不是一个理解。'},
 {tag:'段 2 · general', h:'三条轴，一条一句',
  p:['“The sugar: DNA has 2-deoxy-D-ribose, RNA has D-ribose. The whole difference is one hydroxyl, the 2-prime OH.',

     'The strands: DNA is normally a right-handed double helix; messenger and ribosomal RNA are single-stranded, though parts of ribosomal RNA pair up into helices.”'],
  note:'<b>「the textbook is careful with those words, and so am I」这半句是加分</b>：它显示你读的是原文，而不是一个概括。'},
 {tag:'段 3 · 稍展开', h:'挑「糖」那条轴，因为它是唯一一条由酶造出来的差别',
  p:['“Take the sugar, because it is the one difference that is actually made by an enzyme.',
     'Deoxyribonucleotides are not built from scratch. They are made from ribonucleoside diphosphates by removing the 2-prime OH by reduction — ribonucleotide reductase does it, the reducing equivalents come from thioredoxin, and oxidised thioredoxin is put back by thioredoxin reductase, a flavin enzyme, using NADPH.',
     'So in the cell’s own chemistry the ribose form comes first, and the deoxy form is derived from it.”'],
  note:'〔可裁〕双螺旋那条轴也可以展开：“Hydrogen bonds form only between particular bases for steric reasons — two between A and T, three between G and C. That specificity is what makes replication accurate. The strands are antiparallel, and beyond the hydrogen bonds the helix is held by base stacking, which the textbook attributes mainly to hydrophobic interactions.”'},
 {tag:'段 4 · 留口子', h:'把一个羟基说成一个决定',
  p:['“The part I find most interesting is that the sugar difference is a <b>reduction</b> — the cell spends reducing power, NADPH, to take that hydroxyl off. Giving up a reactive group buys stability, which is the price of using one of them as long-term storage. That is also the biochemical footprint of RNA being the older molecule, and the reason a whole class of drugs — hydroxyurea, gemcitabine — targets ribonucleotide reductase.”'],
