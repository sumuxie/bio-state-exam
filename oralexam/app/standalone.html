/* ---------------- 同一个答案，不同问法 ---------------- */
recog:[
{q:'Draw glucose.',
 mean:'<b>题面的最短版。</b>先两句归类，再拿笔。画的顺序在速背 04 → 06 → 07。',
 say:'“Glucose is an aldohexose — six carbons, aldehyde on carbon one. I will draw the Fischer projection first — chain vertical, hydroxyls right, left, right, right, the D at carbon five — then close the ring: the C-5 hydroxyl onto the C-1 aldehyde, a hemiacetal, a pyranose — and then the Haworth projection, ring oxygen at the back right, what was on the right now below, CH₂OH above, and the anomeric hydroxyl down for α or up for β.”'},

{q:'What is a carbohydrate?',
 mean:'<b>最短的问法。</b>答案自带结构：定义 → 三条轴 → 四个功能 → 一个碳。',
 say:'“A polyhydroxy aldehyde or ketone, or a compound built from one — the textbook defines the monosaccharides as aldehydes or ketones with two or more hydroxyl groups, (CH₂O)n. We classify them by size — mono, oligo, poly; by the carbonyl — aldose or ketose; and by carbon number. Four functions in the textbook: energy store, the pentoses of nucleic acids, support, and recognition on cell surfaces. And the chemistry turns on one carbon: ring closure makes carbon one asymmetric, and α or β there decides starch from cellulose.”'},

{q:'What is a Fischer projection?',
 mean:'卷面第一个限定词。<b>问的是约定</b>，不是葡萄糖。',
 say:'“A way of drawing a molecule with several asymmetric carbons flat on paper: the carbon chain is written vertically with the most oxidised carbon on top, and at every asymmetric carbon the two vertical bonds are understood to go back behind the paper and the two horizontal bonds to come toward the viewer. That convention is what makes left and right mean something — so that D-glyceraldehyde, hydroxyl on the right, is a definite configuration. The textbook uses it for the open-chain sugars and to derive the whole D-series in figure 7.1.”',
 tail:'⚠ 投影约定本身<b>书没定义</b>，只用了（p150、p152、Obr. 7.1）。约定是通用有机化学。'},

{q:'What is a Haworth projection?',
 mean:'卷面第二个限定词。<b>书 p150 有定义</b>——照书。',
 say:'“The textbook’s definition: the ring is drawn as a plane seen in perspective, and the substituents on each carbon are either above or below that plane. For the pyranose the ring oxygen is put at the back right and carbon one at the right. The two conversion rules from the Fischer projection are in the textbook too: substituents that were on the right go below the ring, and for the D-series the primary alcohol group — the CH₂OH — goes above; for the L-series below.”'},

{q:'Describe the structure of carbohydrates.',
 mean:'题库 #22 的前半。<b>三层：单糖 → 键 → 聚合物</b>，每层一句。',
 say:'“Three levels. The monosaccharide: a chain of three to seven carbons with a carbonyl and hydroxyls on the rest, with asymmetric carbons that give D and L series and epimers; in solution it closes to a five- or six-membered hemiacetal ring, which creates the anomeric carbon and the α and β forms. The bond: the anomeric carbon condenses with a hydroxyl of another sugar to give an O-glycosidic bond, fixed as α or β — that gives the disaccharides, maltose, lactose, sucrose. And the polymer: homo- or heteroglycans, linear or branched, and the configuration of the linkage decides the shape — α-linked chains coil into helices, starch and glycogen; β-linked chains are straight and pack into fibrils, cellulose and chitin.”'},

{q:'What are the functions of carbohydrates?',
 mean:'题库 #22 的后半。书 p148 的四条，<b>每条带例子</b>。',
 say:'“Four in the textbook. Energy store — starch in plants, glycogen in animals, easily mobilised to D-glucose, the primary compound for obtaining energy. Information — D-ribose and 2-deoxy-D-ribose form the backbone of RNA and DNA, and the flexibility of the ring matters for storing and expressing the information. Support — cellulose in plant and bacterial cell walls, chitin in the exoskeleton of insects and crustaceans. And recognition — the sugar chains of glycoproteins on cell surfaces and secreted proteins, and of glycolipids, are what other molecules read; the textbook calls that their key role.”'},

{q:'Which one is α and which is β?',
 mean:'画完他指着 C-1 问。<b>一句话，给判据。</b>',
 say:'“It is the configuration at the anomeric carbon only — carbon one of an aldose, carbon two of a ketose. In the Haworth drawing of a D-sugar the anomeric hydroxyl below the ring, on the opposite side from the CH₂OH, is α; above the ring, on the same side, is β. Nothing else in the molecule changes between them, which is why they interconvert in solution.”'},

{q:'What is the difference between glucose and galactose?',
 mean:'<b>陷阱：epimer，不是 anomer。</b>两个词换一下就是 PESB 那种失分。',
 say:'“One asymmetric carbon: galactose is the C-4 epimer of glucose — in the Fischer projection the hydroxyl on carbon four is on the left instead of the right; everything else is identical. It is not an anomer — anomers differ at carbon one, the carbon created by ring closure. Mannose is the other common epimer, at carbon two.”'},

{q:'Is fructose a reducing sugar?',
 mean:'<b>陷阱：酮糖也还原。</b>答「不是，因为它是酮」就错了。',
 say:'“Yes. Its anomeric carbon, carbon two, carries a free hemiketal hydroxyl, so it opens and mutarotates just as glucose does — and generally, in alkaline solution the ketone isomerises through the enediol to the aldose, so it behaves as an aldehyde toward the reagent. The textbook lists the aldose–ketose interconversion glucose to fructose as an isomerisation; the enediol mechanism is general. What is not reducing is sucrose, where fructose’s carbon two is tied up in the bond.”'},

{q:'How is galactose made from glucose?',
 mean:'<b>实测：同事被问过。</b>答案在核苷酸水平：UDP-glucose-4-epimerase，C-4 差向异构化。三种锚点全中（节标题 p160、反应式 p172、通路图 p172）。',
 say:'“Not as the free sugar — at the nucleotide level. UDP-glucose is epimerised at carbon four by UDP-glucose-4-epimerase to UDP-galactose; the textbook’s section on epimerisation gives glucose to galactose as its first example, with uridine diphosphate as the coenzyme. The reverse direction is how dietary galactose is used: galactokinase makes galactose-1-phosphate, hexose-1-phosphate uridylyltransferase swaps it onto UDP, and the same epimerase turns UDP-galactose back into UDP-glucose — the textbook calls that the most important metabolic route of galactose.”',
 tail:'⚠ 书 p172 印的平衡比是 <b>glukosa : galaktosa 1 : 3</b>（原图核过）。通用值是 UDP-glucose : UDP-galactose 约 <b>3 : 1</b>，方向相反。<b>待核</b>——考场上别报这个数；他要数就说 “the equilibrium lies moderately to one side; the textbook and Lehninger give it in opposite senses, so I would not quote a ratio”。'},

{q:'Why is honey sweeter than table sugar?', odd:1,
 mean:'问的是<b>蔗糖水解</b>——β-D-fructofuranosidase（书列了这类酶）；果糖更甜是通用。',
 say:'“Because honey is largely sucrose that has already been hydrolysed. Sucrose is glucose α one to fructose β two; a β-D-fructofuranosidase — the textbook lists that class among the glycosidases; the trivial name is invertase — splits it into free glucose and free fructose. Generally, free fructose is the sweetest of the common sugars, so the hydrolysed mixture tastes sweeter than the same mass of sucrose. The textbook itself says sucrose is very easily hydrolysed.”',
 tail:'蜂蜜、invertase、果糖甜度都<b>不在书里</b>——书有的是 β-D-fruktofuranosidasa 这个酶类（p170）和「蔗糖极易水解」（p154）。'},

{q:'Why can a cow eat grass and you cannot?', odd:1,
 mean:'问的是 <b>β(1→4)</b> 和纤维素酶。书 p173 有答案。',
 say:'“Because grass is cellulose — glucose joined β one to four — and our digestive enzymes are α-glucosidases: the amylases and maltase that split starch handle only the α linkage. Cellulases, the textbook says, occur mainly in microorganisms and rarely in animals, and when cellulose is digested as food it is almost always the microflora that does it — its example is the rumen of ruminants. The cow is not digesting the grass; its bacteria are.”'},

{q:'Why does milk upset some adults?', odd:1,
 mean:'问的是<b>乳糖</b>的 β-半乳糖苷键和分解它的酶。',
 say:'“Lactose is galactose β one to four glucose, and to absorb it you must first split it with a β-D-galactosidase — the textbook lists that class among the glycosidases; the intestinal enzyme is lactase, and generally its activity falls after weaning in most human populations. Unsplit lactose stays in the gut, where bacteria ferment it — that is the discomfort. Once split, the galactose goes to UDP-galactose and is epimerised at carbon four to UDP-glucose.”',
 tail:'lactase 和「断奶后下降」都是通用，书只给了酶类名（p170）和乳糖的键（p155）。'},

{q:'Why does starch turn blue with iodine?', odd:1,
 mean:'问的是 <b>amylose 的螺旋</b>。书 p156 直接给了。',
 say:'“Because amylose in water forms hydrated micelles in which the α one to four chain is coiled into a helix, and iodine gives a blue colour with that helix — the textbook says so; generally the iodine sits inside the helix. Amylopectin, branched every twelve or so residues in the textbook, gives red-violet instead. Cellulose, a straight β chain with no helix, gives nothing.”'},

{q:'Why does a banana get sweeter as it ripens?', odd:1,
 mean:'问的是<b>淀粉被淀粉酶切成麦芽糖和葡萄糖</b>。酶在书里，水果不在。',
 say:'“Because its starch is being hydrolysed to sugars. The textbook’s amylases do exactly that: α-amylase cuts inside the chain, β-amylase takes maltose units off the ends, and maltase — an α-D-glucosidase — splits maltose to glucose. In the fruit those enzymes are switched on during ripening — that part is general — so tasteless starch becomes sweet maltose and glucose.”'},

{q:'Why did doctors once taste urine?', odd:1,
 mean:'问的是<b>还原糖</b>和它的检测。书有「还原基团」，没有 Fehling。',
 say:'“Because glucose in urine means diabetes, and glucose is a reducing sugar: its free hemiacetal hydroxyl opens to the aldehyde — the group the textbook labels the reducing group — so it reduces copper in Fehling’s reagent or silver in Tollens’. That test replaced tasting, and enzyme strips replaced the test; all of that is general. The chemistry the textbook gives is the free anomeric carbon.”'},

{q:'Why is heparin an anticoagulant?', odd:1,
 mean:'书 p158 有一句完整的答案。',
 say:'“Heparin is a glycosaminoglycan — repeating disaccharides of N-sulfo-glucosamine with glucuronic or iduronic acid, heavily sulfated — stored in mast cells. The textbook says it prevents clotting by inhibiting the conversion of prothrombin to thrombin and the action of thrombin on fibrinogen. Generally the mechanism is that it binds antithrombin and accelerates it — the textbook does not go into that.”'},

{q:'Why does cotton not dissolve in water but glycogen does?', odd:1,
 mean:'问的是<b>链的形状</b>：直链成纤丝 vs 分枝的椭球。',
 say:'“Cotton is almost pure cellulose: straight β one to four chains, each residue turned 180 degrees and hydrogen-bonded to the next, packed into fibrils — the hydroxyls are already bonded to each other, so water cannot get in. Glycogen, the textbook says, has a relative molecular mass up to sixteen million in liver and is still water-soluble, because its α one to six branches every eight to ten residues make a flat ellipsoid with hydroxyls out toward the water.”'}
],

/* ---------------- 追问 ---------------- */
ask:[
{g:'定义类', gn:'这一章的词他默认你知道。每个都可能被单独拎出来问——而且它们互相定义。', items:[
{r:'高', q:'What is a monosaccharide?',
 en:'“The simplest sugar: an aldehyde or a ketone with two or more hydroxyl groups, general formula (CH₂O)n, that cannot be hydrolysed to a smaller sugar. Three to seven carbons; glyceraldehyde and dihydroxyacetone are the smallest.”',
 cn:'<span class="pg">p148</span>。「不能再水解成更小的糖」是通用补的判据，书没写。'},
{r:'高', q:'What is an aldose, and what is a ketose?',
 en:'“An aldose carries the carbonyl as an aldehyde on carbon one — glucose, galactose, mannose, ribose. A ketose carries it as a ketone on carbon two — fructose, and dihydroxyacetone as the smallest. It matters for the ring: an aldose closes to a hemiacetal at carbon one, a ketose to a hemiketal at carbon two, so the anomeric carbon is different. And a ketose has one asymmetric carbon fewer than the aldose of the same length — eight ketohexoses against sixteen aldohexoses.”',
 cn:'<span class="pg">p148 p149</span>。醛糖系从 glyceraldehyde 推，酮糖系从 dihydroxyacetone 推（Obr. 7.1、7.2）。'},
{r:'高', q:'What is an asymmetric carbon, and what do D and L mean for a sugar?',
 en:'“An asymmetric carbon is one with four different groups on it, so its mirror image cannot be superimposed on it — two arrangements exist. D and L name the configuration at the asymmetric carbon farthest from the carbonyl by comparison with glyceraldehyde: in D-glyceraldehyde the hydroxyl points right in the Fischer projection. So a D-sugar is one whose last asymmetric carbon matches D-glyceraldehyde. It is the same reference the amino acids use — L-serine from L-glyceraldehyde — and, as the textbook says, D or L says nothing about the direction of optical rotation.”',
 cn:'书 <span class="pg">p148</span>：D/L 表示<b>绝对构型</b>；多个不对称碳时指最远的那个；不说明旋光。「四个不同基团」是通用定义。氨基酸的那句在卡 01。'},
{r:'高', q:'Epimer, enantiomer, anomer — what is the difference?',
 en:'“Three words for three relationships. <b>Enantiomers</b> are complete mirror images — every asymmetric carbon inverted — D-glucose and L-glucose. <b>Epimers</b> differ in configuration at only one asymmetric carbon — the textbook’s definition — glucose and galactose at carbon four, glucose and mannose at carbon two. <b>Anomers</b> are the special case where that one carbon is the anomeric carbon, the one created by ring closure — α- and β-D-glucose. So anomers are epimers at carbon one, and unlike other epimers they interconvert spontaneously in solution, because the ring can open.”',
 cn:'epimer <span class="pg">p149</span>，anomer <span class="pg">p150</span>；enantiomer 这个词书没用，是通用。<b>「anomer 是 C-1 上的 epimer」这一句把三个词串起来。</b>'},
{r:'高', q:'What is a hemiacetal — and a hemiketal, an acetal?',
 en:'“A hemiacetal is an aldehyde that has added one alcohol, so one carbon carries both an –OH and an –OR; a hemiketal is the same thing made from a ketone. In glucose the alcohol is the molecule’s own C-5 hydroxyl and the aldehyde is C-1, so the hemiacetal is a ring. Replace that remaining –OH with a second –OR and you have an acetal — in sugars, a glycoside. The hemiacetal can open back to the aldehyde; the acetal cannot, which is why a glycoside is stable and a free sugar is not.”',
 cn:'<span class="pg">p149 p150 p153</span>。同一条在横向卡 bonds 的追问里。'},
{r:'中', q:'Pyranose, furanose — what are the words?',
 en:'“Names for the ring size, by analogy with two heterocycles: pyran, a six-membered ring with one oxygen, and furan, a five-membered one. A pyranose is a sugar closed to a six-membered ring, five carbons plus the oxygen; a furanose to a five-membered ring, four carbons plus the oxygen. Glucose and free fructose are pyranoses; fructose in sucrose, ribose and deoxyribose in nucleic acids are furanoses.”',
 cn:'<span class="pg">p149 p150 p151</span>。'},
{r:'高', q:'What is mutarotation?',
 en:'“The change in optical rotation of a freshly dissolved sugar as it goes to equilibrium: a pure anomer in solution opens to the chain and recloses as the other anomer, so the rotation drifts from the value of the pure form to that of the mixture. For glucose the textbook gives plus 112 for α, plus 18.4 for β, and plus 52.7 at equilibrium — and it says the equilibrium mixture contains only a very small amount of the open form.”',
 cn:'<span class="pg">p151</span>。旋光是什么——下一条。'},
{r:'中', q:'What is optical rotation?',
 en:'“Generally: a solution of a chiral compound turns the plane of plane-polarised light; the specific rotation is that angle normalised to concentration and path length, plus or minus by direction. It is a physical constant of the compound — the textbook uses it as the property that distinguishes the two anomers — and, as it stresses, it is independent of the D or L label.”',
 cn:'通用定义；书 <span class="pg">p148 p151</span> 用了没定义。'},
{r:'高', q:'What is a reducing sugar?',
 en:'“One that still has a free hemiacetal hydroxyl — an anomeric carbon not in a glycosidic bond — so it can open to the aldehyde, the group the textbook labels the reducing group, and the aldehyde can be oxidised and so reduce a reagent. Every monosaccharide is reducing, and so is any disaccharide with one anomeric carbon free — maltose, lactose, cellobiose. Sucrose and trehalose, with both anomeric carbons in the bond, are not; and the textbook says the same three things follow together: non-reducing, no mutarotation, no glycoside formation.”',
 cn:'<span class="pg">p151 p154</span>。Fehling / Tollens 书没提。'},
{r:'高', q:'What is a glycosidic bond?',
 en:'“The bond from the anomeric carbon of a sugar to another group, made by condensing the hemiacetal hydroxyl with loss of water — an acetal. To an oxygen it is O-glycosidic — between sugars, or to serine and threonine in glycoproteins, or to methanol in the textbook’s methyl glucosides; to a nitrogen it is N-glycosidic — to asparagine in glycoproteins, and to the base in every nucleoside, where the textbook says it is β. Its configuration at the anomeric carbon is α or β, and that is fixed once the bond is made.”',
 cn:'<span class="pg">p153 p154</span>；三个场合的完整表在横向卡 bonds 第 05 点。'},
{r:'中', q:'What is a polysaccharide — and homo- versus heteroglycan?',
 en:'“A chain of many monosaccharides joined by O-glycosidic bonds, of high relative molecular mass — the textbook says most carbohydrates in nature are polysaccharides, and also calls them glycans. A homoglycan has one kind of unit — glucans, mannans, chitin; a heteroglycan has two or more — the glycosaminoglycans. The other division is by function: storage or structural. They differ in the residue, the chain length and the degree of branching.”',
 cn:'<span class="pg">p155</span>。'},
{r:'中', q:'What is a glycosaminoglycan?',
 en:'“A linear heteropolysaccharide of connective tissue built from a repeating disaccharide — a uronic acid glycosidically bound to an N-acetylated amino sugar, the pairs joined one to four — with sulfate esters on hydroxyls or on the amino group, so strongly acidic; the older name is acid mucopolysaccharide. Bound covalently to a protein it makes a proteoglycan. Hyaluronic acid, the chondroitin sulfates, and heparin.”',
 cn:'<span class="pg">p157 p158</span>。'},
{r:'中', q:'Configuration or conformation — for a sugar, which is which?',
 en:'“Configuration is what you can only change by breaking a bond: D or L, α or β, an epimer. Conformation is what changes by rotation: the chair or the boat of the pyranose, and the twisting of the furanose that the textbook says matters in DNA and RNA. So the Fischer and Haworth projections show configuration; the chair in figure 7.5 shows conformation.”',
 cn:'通用；书用了「konformace」于纤维素（Obr. 7.9，p157）和核酸的糖环（p148）。卡 01 的追问里有蛋白版本的同一条。'}
]},

{g:'为什么类', gn:'给了结论没给理由的地方。', items:[
{r:'高', q:'Why do sugars form rings at all?',
 en:'“The textbook’s reason is that the carbonyl group of a monosaccharide is very reactive, and the molecule carries hydroxyls that can add to it — the C-5 hydroxyl of glucose reaches the C-1 aldehyde, so the addition is intramolecular and gives a ring. Generally the ring is favoured because five- and six-membered rings are strain-free and the hemiacetal is lower in energy than the free aldehyde in water — which is why the open chain is a very small fraction at equilibrium.”',
 cn:'<span class="pg">p149 p151</span>。'},
{r:'高', q:'Why is the pyranose favoured for glucose but the furanose for fructose in sucrose?',
 en:'“For free sugars the six-membered ring wins — the textbook says glucose is a pyranose and that even free fructose prefers the pyranose; generally, because the chair of a six-membered ring is strain-free, and for β-glucose every substituent is equatorial. Fructose is a furanose in sucrose and inulin because there the anomeric carbon is already in a glycosidic bond, so the ring cannot open and reclose — it is fixed in whichever form the enzyme made it.”',
 cn:'书给事实（<span class="pg">p150 p151</span>），理由是通用。'},
{r:'高', q:'Why are there α and β at all?',
 en:'“Because ring closure creates an asymmetric carbon that did not exist in the open chain: the carbonyl carbon was flat, with three groups; in the hemiacetal it has four — H, OH, the ring oxygen and carbon two — and the new hydroxyl can end up on either face of the ring. The textbook says exactly that: on cyclisation a new asymmetric carbon C-1 arises, so two cyclic forms can form.”',
 cn:'<span class="pg">p150</span>。'},
{r:'实测', q:'Why is cellulose rigid and starch not, if both are glucose?',
 en:'“Because of the configuration at carbon one. In cellulose the β one to four linkage, the textbook says, allows very long straight chains: each residue is turned 180 degrees to the last, the ring oxygen of one hydrogen-bonds to the C-3 hydroxyl of the next, and the straight chains pack side by side into fibrils. In starch the α one to four linkage bends the chain, so amylose coils into a helix — the textbook’s word for it in the micelles — and amylopectin and glycogen branch through α one to six; a coil with hydroxyls out to the water is a soluble, mobilisable store, a bundle of straight chains hydrogen-bonded to each other is a fibre.”',
 cn:'<span class="pg">p156 p157</span>。<b>「实测」</b>：同事被问过 glucose → galactose 在同一章；α/β 决定材料是这一章最像老师口味的 why。'},
{r:'高', q:'Why store glycogen instead of glucose?',
 en:'“Two reasons, one in the textbook and one general. The textbook says the storage polysaccharides can be mobilised very easily: phosphorylase takes glucose-1-phosphate off the non-reducing ends without spending ATP, and a highly branched molecule has many non-reducing ends, so release is fast. The general reason is osmotic: sixteen million relative molecular mass of glycogen is one particle; the same glucose free would be a hundred thousand particles drawing water into the cell.”',
 cn:'书：易动员（<span class="pg">p148</span>），磷酸解省下第一步磷酸化（<span class="pg">p173 p174</span>）；渗透压是通用。书还说合成要两次磷酸化（经 UDP-Glc），所以走多糖整体上更耗能——磷酸解只保住不到一半（p174）。'},
{r:'中', q:'Why are sugars metabolised as phosphate esters?',
 en:'“The textbook gives the first half: esterifying a hydroxyl with a polybasic acid turns the electroneutral sugar into an ion, which changes its behaviour in the cell — generally, a charged molecule cannot diffuse back out through the membrane, so phosphorylation traps it. And the textbook’s second point: sugar phosphates are the reactive intermediates for making glycosidic bonds — a sugar has to be activated on a nucleoside diphosphate, UDP-glucose, before a glycosyltransferase can transfer it.”',
 cn:'<span class="pg">p152 p170</span>；「困在膜内」是通用。'}
]},

{g:'怎么发现的', gn:'⚠ 这一格书里几乎没有。年份人名全是通用，出处要说清。', items:[
{r:'中', q:'How did anyone work out which way the hydroxyls point?',
 en:'“Generally — the textbook does not tell this: Emil Fischer, in 1891, without any way of seeing a molecule. He had the count — sixteen aldohexoses from four asymmetric carbons — and he used chemistry that reads symmetry: oxidising both ends of a sugar to a diacid, and asking which products were optically inactive because they had a plane of symmetry, and which pairs of sugars gave the same product. That fixed the relative configuration of glucose; the absolute one, that his arbitrary choice for D-glyceraldehyde happened to be right, was confirmed by X-ray work in 1951. The textbook mentions Fischer only for proving proteins are polypeptides, in 1902.”',
 cn:'书里 Fischer 只在 <span class="pg">p009</span> 年表（1902 多肽本质）和投影式的名字里。1891 Fischer、1951 Bijvoet 都是通用——<b>说的时候带 generally</b>。'},
{r:'中', q:'And the ring — how do we know glucose is a ring in solution?',
 en:'“Three pieces of evidence, and two are in the textbook. Mutarotation: two crystalline forms of glucose with different rotations that drift to one value in water — that only makes sense if two ring forms interconvert through a small amount of open chain. The methyl glucosides: heating glucose in methanol with acid gives two isomeric acetals, methyl-α and methyl-β, which a single open-chain aldehyde could not give. And generally, glucose fails some aldehyde reactions — it does not form the usual bisulfite addition compound — because the aldehyde is mostly tied up. Haworth, in the nineteen-twenties, settled the ring size as six-membered and gave us the projection; that name is general.”',
 cn:'变旋 <span class="pg">p151</span>、两个甲基糖苷 <span class="pg">p153</span> 是书的；亚硫酸氢盐和 Haworth 年代是通用。'}
]},

{g:'陷阱', gn:'这一章最容易换错的是几对相邻的名字。每条一句判据。', items:[
{r:'高', q:'α/β and D/L — are they the same kind of label?',
 en:'“No — different carbons. D or L is the configuration at the asymmetric carbon farthest from the carbonyl, carbon five in glucose, and it does not change on ring closure. α or β is the configuration at the anomeric carbon, carbon one, which only exists as an asymmetric carbon in the ring. So α-D-glucose and β-D-glucose are both D, and both anomers of the same sugar.”',
 cn:'<span class="pg">p148 p150</span>。'},
{r:'高', q:'Galactose is an anomer of glucose, isn’t it?',
 en:'“No — an epimer, at carbon four. Anomers differ at carbon one, the carbon made by ring closure, and they interconvert in solution by mutarotation. Glucose and galactose do not interconvert in solution at all; the cell does it on UDP-glucose with a 4-epimerase.”',
 cn:'<span class="pg">p149 p172</span>。'},
{r:'高', q:'Fructose is a ketose, so it is not a reducing sugar?',
 en:'“It is reducing. A ketose has a free hemiketal hydroxyl at its anomeric carbon, so it opens and mutarotates; and generally, under the alkaline conditions of the classical tests, the ketone isomerises through an enediol to the aldose — the textbook lists glucose to fructose as an isomerisation, the movement of the carbonyl to the neighbouring carbon — so it reduces the reagent like an aldose.”',
 cn:'<span class="pg">p160</span>；烯二醇机制是通用。'},
{r:'高', q:'Is sucrose a reducing sugar?',
 en:'“No. Sucrose is glucose α one to fructose β two — the glycosidic bond uses the hemiacetal hydroxyl of the glucose and the hemiketal hydroxyl of the fructose, so both anomeric carbons are in the bond and neither can open. The textbook gives it as the example of a non-reducing disaccharide: it does not mutarotate and it does not form glycosides. Maltose and lactose, with one anomeric carbon free, do.”',
 cn:'<span class="pg">p154</span>。'},
{r:'高', q:'So glucose is a ring — the open chain does not matter?',
 en:'“It is mostly a ring — the textbook says the equilibrium mixture contains only a very small amount of the open form — but the open chain is where the chemistry happens: mutarotation goes through it, and the reducing property is the free aldehyde of the open form, the group the textbook labels the reducing group. The ring is what you draw; the chain is what reacts.”',
 cn:'<span class="pg">p151</span>。'},
{r:'高', q:'Sucrose, saccharide, sacharosa — three words?',
 en:'“Two things. Sucrose — Czech sacharosa — is one specific disaccharide, glucose α one to fructose β two, table sugar. Saccharide — Czech sacharid — is the whole class, another word for carbohydrate. In Czech the two names differ by two letters, so I keep them apart by the bond: if I can name a glycosidic bond, I am talking about sucrose.”',
 cn:'<b>这一对对她是真的坑</b>：书里 sacharosa（蔗糖）和 sacharid（糖类）满页都是。英文里 saccharide 也偶尔当「糖类」用。'},
{r:'中', q:'How often does amylopectin branch?',
 en:'“The textbook says branches about twelve residues long, with a branch about every twelfth residue, and glycogen every eighth to tenth. Lehninger gives about every 24 to 30 for amylopectin and 8 to 12 for glycogen. The two agree on what matters — glycogen is the more branched — and I would quote the textbook’s numbers and say the general ones differ.”',
 cn:'<span class="pg">p156</span>，原图核过：书印的就是 12。<b>书和 Lehninger 不同，卡上明说。</b>'},
{r:'中', q:'Which way does the glucose–galactose epimerase equilibrium lie?',
 en:'“The textbook prints a ratio of glucose to galactose of one to three; the general value is about three to one the other way, in favour of UDP-glucose. Since the two sources disagree in direction, I would say only that the equilibrium lies moderately to one side and the cell pulls it by using up the product.”',
 cn:'<span class="pg">p172</span>，原图核过：书印的是 1 : 3。<b>待核</b>哪一边对；考场上不报数。'}
]},

{g:'相邻考点', gn:'这一章 13 页 12 个小节，每个小节标题都是一道题。从画题走出去，多半走这几个方向。', items:[
{r:'实测', q:'Epimerisation and isomerisation — what is the difference?',
 en:'“Both keep the carbon count and both are in the textbook’s list of sugar interconversions. Epimerisation changes the steric arrangement at one carbon — the position of one hydroxyl: glucose to galactose at carbon four on UDP-glucose, ribulose-5-phosphate to xylulose-5-phosphate. Isomerisation moves the carbonyl to the neighbouring carbon — aldose to ketose: glucose-6-phosphate to fructose-6-phosphate in glycolysis, glyceraldehyde-3-phosphate to dihydroxyacetone phosphate. The textbook’s other two interconversions are oxidative removal of one carbon — hexose to pentose via a β-oxoacid and decarboxylation — and transfer of two- or three-carbon fragments, always from a ketose to an aldose.”',
 cn:'§7.6 <span class="pg">p159 p160</span>。<b>她明说 isomerization / epimerization 这类反应名乱不清</b>——横向卡「反应类型的名字」以这一对为样板。'},
{r:'高', q:'How is starch digested?',
 en:'“By hydrolases in the gut — the textbook is careful to distinguish that from what cells do. α-Amylase, in saliva and pancreas, is an endoglycosidase: it cuts inside the chain, first into six- or seven-unit pieces and then to maltose, released in the α form; β-amylase, mainly in plants, is an exoglycosidase taking maltose off the ends. Neither cuts the α one to six branch, so from amylopectin a branched dextrin is left, and isomaltose comes from the branch points. Maltase — an α-D-glucosidase — in the intestine splits maltose to glucose. γ-Amylase, in liver, cuts both one to four and one to six and can take glycogen apart completely.”',
 cn:'§7.11.1 <span class="pg">p172 p173</span>。'},
{r:'高', q:'And inside the cell — how is glycogen broken down?',
 en:'“Not by hydrolysis but by phosphorolysis. Glycogen phosphorylase takes the terminal glucose off a non-reducing end onto phosphate, giving glucose-1-phosphate — no ATP spent, which is the energetic advantage the textbook points out. It stops four residues before a branch; a transglycosidase moves three of them onto another chain, and α-1,6-glucosidase removes the last branch glucose by hydrolysis — so about ten percent of the glucose comes out free. Synthesis goes the other way through UDP-glucose: glycogen synthase adds glucose to the C-4 hydroxyl of a non-reducing end, and the branching enzyme turns some α one to four bonds into α one to six. The two are switched in opposite directions by the cAMP cascade — adrenaline and glucagon phosphorylate both, which activates phosphorylase and inactivates synthase.”',
 cn:'§7.11.2, §7.12 <span class="pg">p173 p174 p175</span>。<b>这是 STATUS 里标的后门区</b>，两条问答够挡。'},
{r:'高', q:'What is a nucleotide sugar, and why is it needed?',
 en:'“A monosaccharide activated on a nucleoside diphosphate — UDP-glucose, UDP-galactose, UDP-N-acetylglucosamine; GDP for mannose, CMP for sialic acid. It is needed because glycosidases run toward hydrolysis, so to make a glycosidic bond the sugar has to be made macroergic first: glucose to glucose-6-phosphate by a kinase, to glucose-1-phosphate, then with UTP to UDP-glucose, releasing pyrophosphate. Glycosyltransferases then move the sugar onto a free hydroxyl of an acceptor — that is how lactose, glycogen, the glycan chains of glycoproteins and the glucuronides are made. The textbook lists UDP among the group-transferring coenzymes.”',
 cn:'§7.10 <span class="pg">p170 p171</span>；<span class="pg">p052</span>。'},
{r:'高', q:'How is a sugar attached to a protein?',
 en:'“By the same two linkages as everywhere else: N-glycosidic to the amide nitrogen of asparagine, in the sequence asparagine–any residue but proline–serine or threonine, and O-glycosidic to the hydroxyl of serine or threonine. The N-linked core is not built on the protein but on dolichol phosphate and transferred as a block in the ER, then trimmed and finished in the Golgi — that whole mechanism is card 13.”',
 cn:'<span class="pg">p112 p158 p036</span>。<b>卡 13 是这道题的正面</b>；这里只留一句接口。'},
{r:'中', q:'Where does glucose go after this chapter?',
 en:'“Three doors. Glycolysis — glucose-6-phosphate to pyruvate, with fructose-6-phosphate the first isomerisation. The pentose phosphate pathway — oxidation at carbon one, glucose-6-phosphate to 6-phosphogluconolactone to 6-phosphogluconate, decarboxylation to ribulose-5-phosphate, two NADPH. And oxidation at carbon six — glucuronate, which conjugates foreign compounds for excretion and, in most animals, leads on to ascorbate.”',
 cn:'糖酵解 <span class="pg">p164</span>（她说学得好）；戊糖磷酸 §7.7 <span class="pg">p162 p163</span>；C-6 氧化 §7.6.2 <span class="pg">p160 p161</span>。'},
{r:'中', q:'Which bonds have you named — glycosidic, ester, hemiacetal?',
 en:'“The glycosidic bond is an acetal — the anomeric carbon to an oxygen or a nitrogen. The phosphate on a sugar is an ester — an acid to a hydroxyl. The hemiacetal is not a bond between two molecules at all but the C-1 carbon carrying both –OH and –OR inside one sugar. All three are on the bonds card.”',
 cn:'横向卡 bonds 第 05、07 点和它的追问「hemiacetal / anomer」。'}
]},

{g:'桥回主场', gn:'他顺着这些走，就走到你答得住的地方。', items:[
{r:'高', q:'Does the sugar on your displayed protein matter for what you measure?',
 en:'“It can. The protein is anchored in the yeast wall, so it has been through the secretory pathway and carries N-glycans at every asparagine–X–serine or threonine site — in yeast, generally, of the high-mannose type. A glycan next to the binding surface can mask it or change the apparent affinity, so when I compare variants I keep the glycosylation sites constant, or remove one deliberately and check the dissociation constant does not move. That measurement is on the K d card.”',
 cn:'sequon <span class="pg">p112</span>；高甘露糖型是通用。<b>Kd 的测法在卡 02</b>。'},
{r:'中', q:'Recognition — give me an example where a sugar is what gets recognised.',
 en:'“The textbook’s own: cholera toxin and tetanus toxin bind the ganglioside GM1 — a glycolipid — and it lists glycoproteins, hormones and viruses among what cell-surface sugars interact with. Generally, many viruses first touch a cell through its surface sugars — sialic acid, the N-acetylneuraminic acid of the textbook’s figure 7.12, is the classic receptor — and a receptor-binding surface is exactly the kind of protein I work on.”',
 cn:'<span class="pg">p182 p160</span>；病毒–唾液酸是通用。按 DRILL 的规矩，病原体不点名。'}
]}
]
});

<script>
/* data/12.js */
/* 卡 12 · Explain the functioning of the Lac and Trp operons.
   题库 #12（S2 Biochemistry 6）· 导师写过一遍
   出处 Biochemie OCR p102–p105（§4.2.4 Regulace proteosyntézy：Obr. 4.46–4.49）、
        p088–p090（RNA 聚合酶、σ、启动子、终止子）、p097（Obr. 4.40 含 lacI / lacZ / trp leader）、
        p221（酶量调控 = 诱导或阻遏）、p155 / p170 / p172（乳糖、糖苷酶、半乳糖去路）、p108（cAMP 只作激素效应物）
   书里没有（全书 grep 0 命中，一律标 general）：allolactose · IPTG · cAMP–CAP / katabolit · konstitutiv · Jacob-Monod 年份 · T7 / pET / GAL1
   图 4.46–4.49 已回 170 dpi 原图核过：基因顺序 I | P O | Z Y A；trpL 162 nt；发夹编号 1–4。 */

window.CARDS.push({
id:'12', n:12, w:2,
q:'Explain the functioning of the Lac and Trp operons.',
qcn:'解释 Lac 与 Trp 操纵子的工作方式',
sub:'主干说完约 90 秒 · 口试他多半只问 “What is an operon?” · 一个开关，两种接法',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'⚠ 卷面写了 Lac and Trp，嘴上多半只有 “What is an operon?”。Lac 和 Trp 是他要挖的两个方向，不是他会念出来的题面。所以第一句永远是定义，不是「乳糖来了阻遏物走开」。'},
 {n:'01', t:'定义',
  big:'一组<b>为同一组蛋白编码</b>的基因，排在一起，<b>从一个启动子、受一个操纵基因控制、转录成一条 mRNA</b>',
  en:'“An operon is a group of genes coding the synthesis of one group of proteins — that is the textbook’s wording — arranged in the DNA so that they are transcribed together: from <b>one promoter</b>, under <b>one operator</b>, into <b>one messenger RNA</b> that carries several proteins. It is a bacterial arrangement; the classic case is the lac operon of E. coli. Its <b>functioning</b> — how the whole unit is switched on and off by one regulatory protein — is what the question asks for.”',
  note:'书 p103 原话只有前半句（<i>Skupina genů, které kódují syntézu jedné skupiny bílkovin</i>）。「一个启动子、一条 mRNA」是同页 Obr. 4.47 画的（一条 lac mRNA 下面三个箭头指向 Z、Y、A），p086 也说 mRNA 的大小取决于它决定的<b>肽链数目</b>。「polycistronic」这个词是 Lehninger 的，书里没有。<span class="pg">p103 p086</span>'},
 {n:'02', t:'四个部件',
  big:'<b>promoter</b> · <b>operator</b> · <b>structural genes</b>，这三样是操纵子；<b>regulator gene</b> 在操纵子<b>旁边</b>，不在里面',
  en:'“Four parts. The <b>promoter</b>, P, is the DNA sequence RNA polymerase binds to start transcription. The <b>operator</b>, O, is the DNA sequence the repressor binds; it overlaps the promoter. Then the <b>structural genes</b> — the genes whose protein products, mostly enzymes, do the actual metabolism. And beside the operon, not inside it, the <b>regulator gene</b>, I, whose protein product regulates transcription. The textbook puts it as: the operon consists of a control site, P and O, and a stretch of structural genes.”',
  tbl:{head:['部件','是什么','谁来结合'],rows:[
   ['promoter P','RNA 聚合酶起始转录的那段 DNA','RNA 聚合酶（σ 因子认它）'],
   ['operator O','阻遏物结合的那段 DNA，<b>跟启动子重叠</b>','阻遏物'],
   ['structural genes Z Y A','产物是做代谢的酶','—'],
   ['regulator gene I','<b>在操纵子旁边</b>，产物是阻遏物','—']]},
  note:'书 p103 的图 4.46 就是这个顺序：I | P O | Z Y A，「Lactose operon」那个括号只罩 P O Z Y A，<b>不罩 I</b>。「操纵基因跟启动子重叠」p089 和 p104 都说了。<span class="pg">p103 p104 p089</span>'},
 {n:'03', t:'三个小分子/蛋白的名字',
  big:'<b>repressor</b> 是蛋白，结合 DNA；<b>inducer</b> 是小分子，结合阻遏物让它<b>放开</b> DNA；<b>corepressor</b> 是小分子，结合阻遏物让它<b>能结合</b> DNA',
  en:'“A <b>repressor</b> is a protein — the product of the regulator gene, the textbook calls it a diffusible, negative regulatory protein — that binds the operator and so blocks transcription. An <b>inducer</b> is a small molecule that binds the repressor and blocks its binding to DNA; typically, the textbook says, the substrate of the enzyme or a derivative of it. A <b>corepressor</b> is the opposite small molecule: one that makes the repressor able to bind.”',
  note:'<b>这一格是整题的陷阱区</b>：阻遏物结合的是 <b>DNA</b>（操纵基因），不是 RNA 聚合酶；诱导物结合的是<b>阻遏物</b>，不是 DNA。书 p104 把「induktor」定义成「与阻遏物作用后<b>阻断它与 DNA 的结合</b>的低分子效应物」，并说它是「正效应物」——正的是效果，机制仍是解除阻遏。<span class="pg">p104</span>'},
 {n:'04', t:'两种控制 × 两种操纵子',
  big:'<b>负控制</b>（阻遏物刹车）vs <b>正控制</b>（激活蛋白加速）；<b>可诱导</b>（默认关，底物打开）vs <b>可阻遏</b>（默认开，产物关掉）',
  en:'“Two kinds of control. <b>Negative</b> control — repression — is a protein that brakes transcription; <b>positive</b> control — stimulation — is a regulatory protein that speeds it up. And two kinds of operon by what the small molecule does: <b>inducible</b>, off until a substrate turns it on; <b>repressible</b>, on until a product turns it off. The lac operon is the inducible, negatively controlled example; the trp operon is the repressible one.”',
  note:'书 p102 开篇就是这两种（<i>negativní regulací (represí) … pozitivní regulací (stimulací)</i>）；「诱导或阻遏」这对词在 p221 讲酶量调控时出现。<b>两组分类是两个轴，不是一个</b>：lac 是「负控制 ＋ 可诱导」，trp 是「负控制 ＋ 可阻遏」，而葡萄糖那一层（见 10）是 lac 上的<b>正</b>控制。<span class="pg">p102 p221</span>'},
 {n:'05', t:'为什么这么装',
  big:'<b>分解通路由底物诱导，合成通路由产物阻遏</b>——理由是<b>经济</b>：蛋白合成是吸能的',
  en:'“The logic is economy. Protein synthesis is <b>endergonic</b> — the textbook’s own word — and it says both controls exist so that proteins are neither made <b>needlessly</b> nor <b>lacking</b>. So a catabolic pathway is induced by its substrate: make the enzymes only when there is something to break down. An anabolic pathway is repressed by its product: stop once there is enough.”',
  note:'p092：<i>Proteosyntéza je navíc endergonický proces a je přísně regulovaná</i>。p102：<i>aby se určité proteiny v buňce nesyntetizovaly zbytečně, či naopak se jich nedostávalo</i>。这两句合起来就是「为什么」的第一层，<b>不用引 Lehninger</b>。<span class="pg">p092 p102</span>'},

 {g:'lac 操纵子 · 可诱导、分解', gn:'三个基因、一个默认状态、一个开关动作。顺序：产物是什么 → 默认关 → 乳糖来了怎么开。'},
 {n:'06', t:'三个基因三个产物',
  big:'<b>lacZ</b> β-galactosidase（把乳糖水解成半乳糖 ＋ 葡萄糖）· <b>lacY</b> galactoside permease（把乳糖运进来）· <b>lacA</b> thiogalactoside transacetylase',
  en:'“Three structural genes. <b>lacZ</b> codes <b>β-galactosidase</b>, the hydrolase that splits lactose — 4-O-β-D-galactopyranosyl-D-glucose, milk sugar — at its β-1,4 glycosidic bond into galactose and glucose. <b>lacY</b> codes <b>galactoside permease</b>, the membrane protein that carries lactose into the cell. <b>lacA</b> codes <b>thiogalactoside transacetylase</b>, whose physiological role is, generally speaking, still not clear.”',
  note:'三个名字是 Obr. 4.46 图注给的。乳糖的结构和「乳糖」这个名字在 p155；β-D-galactosidase 属于水解酶在 p170。<b>lacA 的作用书没说</b>，「不清楚」是通用说法。<span class="pg">p103 p155 p170</span>'},
 {n:'07', t:'默认关',
  big:'没有诱导物时，<b>阻遏物坐在操纵基因上</b>；操纵基因跟启动子重叠，所以 RNA 聚合酶过不去',
  en:'“The default is <b>off</b>. With no inducer, the lac repressor — made by lacI all the time, at a low constant level — sits on the operator, and because the operator overlaps the promoter, RNA polymerase cannot transcribe the operon. That is the textbook’s figure 4.47a.”',
  note:'「lacI 一直在表达」书没有明说，但它是模型成立的前提（阻遏物得先在那儿才能默认关），通用说法。顺带一个书里的细节：p097 Obr. 4.40 列的起始序列里，<b>只有 lacI 的起始密码子不是 AUG</b>（是 GUG）——弱起始，跟「阻遏物量少」一致，这个联系是我推的。<span class="pg">p103 p104 p097</span>'},
 {n:'08', t:'开关动作',
  big:'乳糖进来 → 它的<b>衍生物</b>（allolactose，general）结合阻遏物 → 复合物<b>从操纵基因上解离</b> → 转录三个基因成一条 lac mRNA',
  en:'“Lactose comes in, and a derivative of it — the textbook says ‘the substrate or a derivative of it’; generally the actual inducer is <b>allolactose</b>, galactose linked β-1,6 to glucose, which β-galactosidase itself makes from a little lactose as a side reaction — binds the repressor. The repressor–inducer complex no longer binds the operator and comes off; RNA polymerase transcribes the three genes into one lac mRNA, and the enzymes are made. The textbook calls the operator–repressor–inducer system a <b>molecular switch</b>.”',
  note:'<b>「乳糖诱导」严格说是 allolactose 诱导</b>，但书只说「底物或其衍生物」，所以先说书的，再补 general。「分子开关」（<i>molekulový vypínač</i>）是 p104 原话。<span class="pg">p104</span>'},
 {n:'09', t:'开关的硬件',
  big:'操纵基因<b>近乎回文</b>；阻遏物有<b>三个结合位</b>（O₁ 跟启动子重叠 ＋ 两个假操纵基因）；聚合酶那边：全酶 α₂ββ′σ 开启动子，先做 ≤9 nt 的短 RNA，<b>σ 走了</b>核心酶才延伸',
  en:'“On the DNA side, the lac operator is a near-<b>palindrome</b> — nearly the same sequence read in both directions — which the textbook says facilitates protein binding: a symmetric site for a symmetric protein. The repressor has three sites in the operon: the primary operator O₁, which overlaps the promoter, and two pseudo-operators. On the polymerase side: the holoenzyme, α₂ββ′σ, forms an open complex with the promoter and makes short RNAs up to nine nucleotides; when σ is released and the promoter freed, the core enzyme, α₂ββ′, elongates.”',
  note:'都在 p104。⚠ 两处要小心：① p104 把全酶印成了「<i>holoenzym DNA polymerasy</i>」，p088 同一个亚基组成写的是 RNA 聚合酶——是书的笔误，说 RNA polymerase；② 书说两个假操纵基因「在 lacZ 里面」，通用说法是 O₂ 在 lacZ 里、O₃ 在上游 lacI 里，被追就说 general。「阻遏物是四聚体、同时抓两个位点把 DNA 拉成环」是通用知识，书没有。<span class="pg">p104 p088</span>'},
 {n:'10', t:'葡萄糖优先（general）',
  big:'有葡萄糖时 lac 不全开——<b>catabolite repression</b>：葡萄糖少 → cAMP 多 → cAMP–CAP 结合启动子旁边帮聚合酶上来；这是 lac 上的<b>正控制</b>',
  en:'“If glucose is present as well, E. coli uses it first — generally called <b>catabolite repression</b>; the textbook does not cover it. Generally: low glucose raises cyclic AMP, cAMP binds the catabolite activator protein, CAP, and cAMP–CAP binds next to the lac promoter and helps RNA polymerase bind — <b>positive</b> control, exactly the shape the textbook describes for positive regulation, a protein binding at the promoter and changing the DNA’s conformation so polymerase binds more easily, without naming the protein. So lac needs two yes-votes: lactose present <b>and</b> glucose absent.”',
  note:'全书 grep：cAMP 只在 p108 作激素效应物、p175 作糖原磷酸化酶级联出现；CAP、katabolit 0 命中。<b>所以整条标 general</b>，但可以借 p105 那段「正调控」的形状。<span class="pg">p105 p108</span>',
  warn:'不要说成「书上讲了 CAP」。书讲了「正调控的形状」，没讲 CAP。'},

 {g:'trp 操纵子 · 可阻遏、合成', gn:'⚠ 书对 trp 讲的机制<b>只有衰减</b>。「阻遏物 ＋ 色氨酸辅阻遏物」那一层书只给了 corepressor 的通用定义，没说色氨酸——那一层要标 general。'},
 {n:'11', t:'五个基因三个酶',
  big:'<b>trpE D C B A</b> 五条多肽 → 三个酶，从 <b>chorismate</b> 合成色氨酸；<b>trpC 一个产物做两步</b>；tryptophan synthase α₂β₂ 最后一步接 serine',
  en:'“The trp operon of E. coli has five structural genes — trpE, D, C, B, A — coding five polypeptides that form three enzymes of tryptophan synthesis from <b>chorismate</b>: <b>anthranilate synthase</b>, from trpE and trpD; the <b>trpC</b> product, which catalyses two consecutive steps; and <b>tryptophan synthase</b>, α₂β₂, from trpB and trpA, which joins indole-3-glycerol phosphate with serine to give tryptophan and releases glyceraldehyde-3-phosphate.”',
  note:'全部来自 Obr. 4.48 和 p104 正文（<i>pět polypeptidů, které tvoří tři enzymy</i>；<i>Genový produkt trpC katalyzuje dvě následné reakce</i>）。通路：chorismate ＋ glutamine → anthranilate → N-(5′-phosphoribosyl)-anthranilate（用 PRPP）→ 异构 → indole-3-glycerol-P（放 CO₂）→ ＋ serine → Trp。<span class="pg">p104</span>'},
 {n:'12', t:'第一层：阻遏 ＋ 辅阻遏物（general）',
  big:'默认<b>开</b>；trp 阻遏物<b>单独不结合</b>操纵基因，<b>色氨酸结合上去它才能结合</b>——色氨酸就是辅阻遏物',
  en:'“It is the repressible, anabolic case, so the default is <b>on</b>. The textbook defines a corepressor only in general — a small molecule that influences the repressor — and, generally, for trp that molecule is <b>tryptophan itself</b>: the trp repressor cannot bind the operator on its own; with tryptophan bound it can, and transcription stops. That first layer is Lehninger. The textbook’s own account of the trp operon is the second layer, attenuation.”',
  note:'corepressor 的定义在 p104（<i>Funkce represoru může být ještě ovlivněna nízkomolekulárním efektorem — korepresorem</i>）。<b>书从没写「色氨酸是辅阻遏物」</b>，所以这一格英文里要有 “generally”。<span class="pg">p104</span>',
  warn:'trp 阻遏物的名字 TrpR、它是二聚体——都是通用知识，不是书的。'},
 {n:'13', t:'第二层：衰减是什么',
  big:'<b>转录已经开始之后</b>再决定要不要继续进结构基因。启动子和 trpE 之间有一段 <b>leader trpL，162 个核苷酸</b>，末端是<b>衰减子</b>；leader 编码一个短肽，里面有<b>两个连着的 Trp 密码子</b>',
  en:'“<b>Attenuation</b> is a second, finer control that decides, after transcription has started, whether it continues into the structural genes. Between the promoter and trpE there is a leader, trpL, 162 nucleotides, and near its end an <b>attenuator</b> — the textbook says it has a function similar to an operator. The leader encodes a short <b>leader peptide</b>, and that peptide contains two tryptophan codons in a row — generally, a fourteen-residue peptide with tryptophan at positions ten and eleven.”',
  note:'162 nt 是 p104 原文（已回原图核）。「14 个残基、Trp 在 10 和 11」是 Lehninger 的，书只说「串联的 Trp 密码子」（<i>tandem Trp-kodonů</i>）。<span class="pg">p104 p105</span>',
  warn:'p104 正文说 leader「转录但<b>不翻译</b>成肽」——<b>这跟书自己的图矛盾</b>：Obr. 4.49 画的是「Ribosome transcribing the leader peptide」、「Leader peptide」，p097 Obr. 4.40 还把 trp leader 列在核糖体识别的起始序列里。衰减<b>必须</b>翻译 leader 肽才成立。用图打正文：“The text says the leader is not translated; the figure on the next page shows a ribosome on it — and the mechanism needs that ribosome.”'},
 {n:'14', t:'两种情形',
  big:'<b>色氨酸多</b>：核糖体一路读完 leader 肽，盖住片段 2 → <b>3–4 发夹</b>＝终止子 → 聚合酶掉下来。<b>色氨酸少</b>：没有带 Trp 的 tRNA，核糖体<b>停在两个 Trp 密码子上</b>（片段 1）→ <b>2–3 发夹</b>＝抗终止子 → 3–4 形不成 → 读进操纵子',
  en:'“Two cases, four segments of leader RNA. With plenty of tryptophan there is plenty of charged tRNA-Trp, the ribosome translates the leader peptide straight through and covers segment 2, so segments 3 and 4 pair — the <b>3–4 hairpin</b> is a transcription terminator — and RNA polymerase falls off before the structural genes. With little tryptophan there is no charged tRNA-Trp, the ribosome <b>stalls</b> at the tandem Trp codons in segment 1, segments 2 and 3 pair instead — the <b>antiterminator</b> — 3–4 cannot form, and polymerase reads through into the operon.”',
  note:'一字不差是 Obr. 4.49 的图注（<i>(a) V případě dostatku tRNA<sup>Trp</sup> … vlásenka 3–4 … (b) … ribosom se zastaví na tandemu Trp-kodonů v úseku 1 … vlásenka 2–3</i>）。<b>要记的只有一对数字：多 → 3–4 停；少 → 2–3 走。</b><span class="pg">p105</span>'},
 {n:'15', t:'为什么只有原核能这么干',
  big:'因为细菌里<b>核糖体在 RNA 聚合酶还在合成 mRNA 的时候就已经在翻译它</b>——没有核，没有 ER。真核转录在核里、翻译在胞质，核糖体赶不上去决定 RNA 怎么折',
  en:'“It only works because in a bacterium translation is coupled to transcription: the ribosome is on the mRNA while RNA polymerase is still making it — no nucleus, no endoplasmic reticulum, protein synthesis on free ribosomes only, as the textbook says. Its figure shows the ribosome and the polymerase on the same transcript. In a eukaryote transcription is in the nucleus and translation in the cytosol, and the message is processed in between, so the ribosome cannot reach the RNA in time to decide its fold. The coupling sentence itself is general; the figure is the textbook’s.”',
  note:'p102：原核无 ER，蛋白合成只在游离核糖体上；p105 图里核糖体和聚合酶在同一条 RNA 上。「偶联」这个词书没说，是从图读出来的，说成 “the figure shows”。<span class="pg">p102 p105</span>'},
 {n:'16', t:'3–4 发夹为什么能终止',
  big:'书 p090 讲的<b>通用终止子</b>：<b>富 G+C 的回文</b>在 RNA 里折成稳定发夹，<b>后面跟一串 U</b>，U–A 配对弱，转录物就松手',
  en:'“The 3–4 hairpin terminates for the reason the textbook gives for any intrinsic terminator: a G+C-rich palindrome in the DNA is transcribed into a self-complementary RNA that folds into a stable hairpin, followed by a run of four to ten A–T pairs read as U’s; the hairpin’s stability and the weak pairing of the oligo-U tail with the template are, the textbook says, the decisive factors, and transcription stops spontaneously — no protein needed.”',
  note:'p090 原文，两个特征（(i) 4–10 个 A–T，(ii) 富 G+C 的回文）。<b>这一句把 #12 接回 #15/#3 那片书</b>：衰减子不是新东西，就是一个被核糖体决定形不形成的普通终止子。ρ 因子终止是另一类，那里不需要。<span class="pg">p090</span>'},

 {g:'收尾', gn:'怎么发现的一句、停一句、伸出去一句。这题的口子非常干净——她天天在用这个开关。'},
 {n:'17', t:'怎么发现的',
  big:'<b>Jacob 和 Monod</b>（书点名），从<b>乳糖酶诱导</b>的实验推出来的；决定性的工具是<b>组成型突变体</b>（general）',
  en:'“Jacob and Monod — the textbook names them — derived the model from experiments on the induction of the lactose enzymes; generally that was 1961, and the decisive tool was mutants in which the enzymes were made all the time, <b>constitutively</b>, whatever lactose did: either a mutant regulator gene with no working repressor, or a mutant operator the repressor cannot bind. Those two behave differently when you add a second copy of the genes, and that difference is what separated a diffusible protein from a site on the DNA.”',
  note:'书 p102 说这是 Jacob 和 Monod 的「假说性机制」，「已部分在原核细胞得到实验验证」——<b>书是老的</b>；通用知识：lac 阻遏物已被分离、结构已解出。年份 1961、诺贝尔 1965 书里都没有，standard history。cis / trans 那对词书没有，但 p104 有它们的实质：阻遏物「可扩散」（<i>difuzibilní</i>），操纵基因只管「同一条染色体」（<i>téhož chromosomu</i>）。<span class="pg">p102 p104</span>'},
 {n:'18', t:'落点',
  big:'机制之下是<b>经济 ＋ 选择</b>；再往下是<b>结合的动力学</b>——阻遏物抓操纵基因多紧、诱导物让它松多少',
  en:'“Below the mechanism, the question is why a cell is built this way, and the answer is economy under selection: a cell that spends ATP on enzymes it does not need grows more slowly than one that does not, so the arrangement that survived is the one that switches. Further down it is <b>binding</b>: how tightly the repressor holds the operator relative to random DNA, and by how much the inducer loosens it — a dissociation constant. Below that we are in physical chemistry rather than biochemistry.”',
  note:'停在<b>进化</b>，顺手把第二块地基（动力学 / Kd）也点了名——因为那正是她的主场。'},
 {n:'19', t:'留口子',
  big:'这个开关<b>我每周都在用</b>：表达质粒上有 lac operator 和 lacI，<b>IPTG</b> 诱导；酵母展示用的是 <b>GAL1</b> 启动子',
  en:'“This is the switch I use every week. My bacterial expression plasmids carry the lac operator and lacI, and I induce with <b>IPTG</b> — a gratuitous inducer: it binds the repressor like allolactose but the cell cannot metabolise it, so the signal does not go away. In yeast I induce surface display through the GAL1 promoter, which is switched on by galactose — the eukaryotic parallel, positive control by an activator rather than an operon.”',
  note:'全是实验室知识，书 grep 0。他顺着走就到 pET / T7 / BL21(DE3) 或 yeast display（卡 02）。<b>说到自己的质粒前先确认你手里的图谱真的是 T7lac ＋ lacI</b>——pET 系列是，但别替不是的载体背书。'},
 {n:'20', t:'要是让你画',
  big:'先画一条横线；从左到右写 <b>I</b> ｜ <b>P O</b> ｜ <b>Z Y A</b>；在 I 下面画阻遏物，箭头指向 O；在 P 上画 RNA 聚合酶；从 P 开始画一条波浪线 mRNA 盖过 Z Y A，三个箭头向下写三个酶',
  en:'“A line for the DNA. Left to right: I, then P and O together as the control site, then Z, Y, A. Under I, the repressor, arrow to O. Polymerase on P. From P a wavy line, the single lac mRNA, over Z, Y and A, with three arrows down to β-galactosidase, permease and transacetylase. For trp: P and O, then the leader trpL with the attenuator at its end, then E, D, C, B, A — and next to it the four segments of leader RNA, 3–4 paired for stop, 2–3 paired for go.”',
  note:'这就是 Obr. 4.46 ＋ 4.47b ＋ 4.48 的骨架。没有导图（书图是彩版翻印，认的价值低），画的顺序比图本身有用。<span class="pg">p103 p104</span>'}
],
end:'<b>这题的分数在 01–05 和 13–15。</b>定义和分类先说清（一个启动子、一条 mRNA、四个部件、两个轴），然后 lac 一句开关、trp 两层，衰减用「多 → 3–4 停；少 → 2–3 走」一对数字扛住。葡萄糖、allolactose、IPTG、组成型突变体全是 general，说的时候带上这个词。',
