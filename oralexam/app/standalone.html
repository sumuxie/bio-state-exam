/* ---------------- 同一个答案，不同问法 ---------------- */
recog:[
{q:'DNA versus RNA?',
 mean:'整句是 “What are the differences between DNA and RNA?”。<b>比较题的通用形状：先说轴，再填。</b>不要交替列特征。这一招 #14 和 #28 直接复用。',
 say:'“Both are nucleic acids — polynucleotides that store and transmit genetic information: DNA is the material carrier, the information stored as the order of its bases; RNA is the working copy, the direct template for protein synthesis. Chemically the question is then three questions: which pentose, which bases, and how many chains. The sugar — deoxyribose versus ribose, a difference of one hydroxyl. The bases — uracil practically only in RNA, thymine predominantly in DNA. The strands — DNA a right-handed double helix, most RNA single-stranded though partly paired.”'},

{q:'What is the difference between a nucleoside and a nucleotide?',
 mean:'<b>定义题伪装成比较题。</b>一句话，别展开。',
 say:'“A nucleoside is a base joined to carbon one of the pentose by an N-glycosidic bond — from N9 of a purine, N1 of a pyrimidine. Esterify a phosphate onto the sugar, normally at the 5′ carbon, and it is a nucleotide.”'},

{q:'What is the double helix?',
 mean:'<b>核心词正面定义。</b>说完它是什么，再说什么撑着它。',
 say:'“Two polynucleotide chains, antiparallel, wound around a common axis — normally right-handed. The sugar–phosphate backbones run on the outside, the paired bases stack inside, and the winding leaves a major and a minor groove. The textbook’s figure 4.8 is B-DNA, the form under physiological conditions.”'},

{q:'What holds the double helix together?',
 mean:'<b>他要三层，不是一层。</b>只说氢键就漏了大半；说「两样」是封闭清单（p073–p074）。',
 say:'“Three things in the textbook. Hydrogen bonds between the bases — two between adenine and thymine, three between guanine and cytosine, and they form only between those pairs for steric reasons. <b>Base stacking</b> of the flat purine and pyrimidine rings, which the textbook attributes mainly to hydrophobic interactions — Lehninger would add van der Waals and dipole forces. And electrostatics: the phosphates are fully ionised at pH 7 and neutralised by counter-ions such as Mg²⁺ or Mn²⁺, which the book also counts toward stability.”'},

{q:'Why is DNA more stable than RNA?',
 mean:'轴一，说到底。<b>而且答案要落在那个被主动去掉的羟基上。</b>',
 say:'“Because it lacks the 2′-hydroxyl. Generally — the textbook does not give the mechanism — that hydroxyl is a nucleophile sitting next to the phosphodiester bond: in alkaline solution it attacks the phosphorus, a 2′,3′-cyclic phosphate forms and the chain breaks, so RNA hydrolyses easily. DNA has no 2′-OH, so the same backbone survives. That is why the cell spends NADPH to remove the hydroxyl by reduction — giving up a reactive group buys the stability you want in something that has to last.”',
 tail:'⚠「2′-OH 攻击磷酸二酯键、经 2′,3′-环磷酸断链」这条<b>书里没有</b>，所以开口带 “generally”。书给的只有还原那一步（p072）。'},

{q:'Why is DNA negatively charged?', odd:1,
 mean:'问的是<b>磷酸二酯键</b>，也就是那条主链本身。',
 say:'“Because of the phosphodiester backbone. Each phosphate is a diester — two of its four oxygens link the 3′ carbon of one pentose to the 5′ carbon of the next, and the two non-bridging oxygens share one negative charge. The textbook says the phosphates are fully ionised at pH 7 — so one negative charge per nucleotide.”'},

{q:'Why does GC-rich DNA melt at a higher temperature?', odd:1,
 mean:'<b>问的就是那三个氢键</b>，只是从熔点绕过来的。也是防止你把 2 和 3 说反的记法。',
 say:'“Melting is the separation of the two strands on heating; the melting temperature is where half the DNA is single-stranded. GC-rich DNA melts higher because a G–C pair has three hydrogen bonds and an A–T pair has two. More bonds per base pair means more energy to separate the strands — and G–C pairs also stack more strongly, which is the part the textbook does not say.”'},

{q:'What actually reads the sequence — how does a protein find its site?', odd:1,
 mean:'问的是<b>沟</b>（groove）。书给了名字和图。',
 say:'“Through the grooves. The double helix leaves two unequal spiral channels on the outside — the textbook calls them the larger and the smaller groove, major and minor — and that is where the edges of the bases are readable from outside without opening the helix.”'},

{q:'Is RNA always single-stranded?', odd:1,
 mean:'<b>陷阱问法。</b>答「是」就错了。',
 say:'“No. Messenger RNA is single-stranded as a whole, but ribosomal RNA is single-stranded with regions that pair into short double helices, and where the complementarity is incomplete the molecule forms loops. Transfer RNA is folded even more.”'},

{q:'How many kinds of RNA are there?',
 mean:'清单题。<b>报名字，再报一个能显出你读过表的细节。</b>',
 say:'“Five main kinds in the textbook — plus the nuclear RNAs it adds as the least understood group: the precursors of every kind, small nuclear RNA, and chromosomal RNA. Messenger RNA carries the genetic information from DNA to the ribosome, single-stranded. Ribosomal RNA is the structural component of the ribosome, named by sedimentation coefficient — in prokaryotes 5S, 16S and 23S; in eukaryotes up to four, 5S, 5.8S, 18S and 28S. Transfer RNA, the smallest at 4S, carries one activated amino acid each to the ribosome, all ending in CCA at the 3′ end, folded as a cloverleaf — three constant arms and a variable one, the acceptor stem carrying the CCA and the amino acid, the anticodon loop the triplet that pairs with the codon. Small nuclear RNA forms complexes with proteins — the spliceosome — and takes part in splicing. Viral RNA serves a virus as both its DNA and its mRNA.”'},

{q:'Which is left-handed?',
 mean:'<b>只有 Z。</b>一句话答完。',
 say:'“Only Z-DNA. A and B are both right-handed. Under physiological conditions DNA is almost exclusively B. Z-DNA has a deep minor groove and no distinguishable major groove; it occurs only in certain stretches — the textbook’s example sequence is d(CGCATGCG) — and its biological function is not known.”'}
],

ask:[
{g:'定义类', gn:'比较题的每个名词都可能被单独拎出来问。', items:[
{r:'中', q:'What is base pairing?',
 en:'“Base pairing is the specific hydrogen bonding of a base on one strand to the one base on the other strand it can bond with — adenine with thymine by two hydrogen bonds, guanine with cytosine by three; the textbook says the bonds form only between those pairs for steric reasons and names the phenomenon base pairing. It is what makes the two strands complementary and replication accurate.”',
 cn:'<b>核心词正面定义。</b>书 p073 明说「这个过程叫碱基配对」。'},
{r:'中', q:'What is hnRNA?',
 en:'“In eukaryotes the first transcript is heterogeneous nuclear RNA, substantially longer than the structural gene itself. It contains both coding regions — exons — and non-coding ones, introns, and it is processed into the functional messenger RNA — the introns are removed by the spliceosome, a complex of small nuclear RNA and proteins; the textbook’s word on p086 is simply ribonucleases.”',
 cn:'真核转录的第一条产物。<b>顺手把 exon/intron 带出来。</b>'},
{r:'实测', q:'What are purines and pyrimidines?',
 en:'“A pyrimidine is one six-membered aromatic ring with nitrogens at positions 1 and 3 — cytosine, uracil, thymine. A purine is that ring fused to a five-membered imidazole ring — nine atoms, nitrogens at 1, 3, 7 and 9 — adenine and guanine. So the purine is the larger base; its sugar attaches at N9, the pyrimidine’s at N1.”',
 cn:'结构 p066 图 4.1；N9/N1 p067。卡上用了十次的词，之前没定义。'},
{r:'高', q:'Why “predominantly” — where else does thymine occur?',
 en:'“In transfer RNA. The textbook says the loops of tRNA contain minor bases, and its example of a minor base is hypoxanthine — guanine without its amino group. Generally, one of the tRNA minor bases is ribothymidine, thymine on ribose, in the T-loop; pseudouridine and dihydrouridine are others. So thymine is predominantly, not exclusively, a DNA base.”',
 cn:'minor bases p087；hypoxanthine p066；ribothymidine 通用。'},
{r:'中', q:'What does “activated amino acid” mean?',
 en:'“Activation is done by the aminoacyl-tRNA synthetase specific for that amino acid and tRNA, in two steps: the amino acid reacts with ATP to give aminoacyl-adenylate, releasing pyrophosphate; then the aminoacyl group is transferred as an ester to the 2′- or 3′-hydroxyl of the terminal adenosine of the tRNA’s CCA end. From then on the amino acid is recognised by the anticodon of its tRNA — the triplet that pairs with the codon on mRNA — not by its own chemistry.”',
 cn:'p096；anticodon p087。'},
{r:'中', q:'What is thioredoxin?',
 en:'“Thioredoxin is a small protein with two cysteines at its active site — reduced, two SH groups; oxidised, a disulfide. It hands two hydrogens to ribonucleotide reductase and is recharged from NADPH by the flavin enzyme thioredoxin reductase.”',
 cn:'SH/S–S 和 NADPH → 还原酶 → 硫氧还蛋白 → RNR 这条链是 p072 图 4.6；「小蛋白、两个半胱氨酸」通用。'},
{r:'中', q:'What is S — the sedimentation coefficient?',
 en:'“S is the Svedberg unit of the sedimentation coefficient — how fast a particle sediments in the ultracentrifuge, 10⁻¹³ seconds. It depends on mass and shape together, so it is not additive: 30S and 50S subunits make a 70S ribosome.”',
 cn:'通用；书 p086 用了没定义，p096 有 30S/40S 小亚基。'},
{r:'高', q:'What is a phosphodiester bond?',
 en:'“One phosphate esterified to <b>two</b> different hydroxyls, so it links two sugars and still keeps one negative charge. In nucleic acids it runs from the 3′-hydroxyl of one pentose to the 5′-hydroxyl of the next — usually 3′→5′ in both DNA and RNA. The textbook adds that in RNA a 2′–5′ linkage is also possible, precisely because RNA still has the 2′-hydroxyl.”',
 cn:'<b>名字本身就说明了它为什么能当骨架</b>：一个磷酸用掉两个羟基，还剩一个负电荷。完整的键的分类在<b>横向卡 · 各种化学键</b>。<span class="pg">p072</span>'},
{r:'高', q:'What does antiparallel mean?',
 en:'“The two chains run in opposite directions: one strand’s five-prime end sits at the other’s three-prime end. The textbook puts it as — one strand rises through the helix in the five-to-three direction while the other descends in that same direction.”',

{r:'中', q:'What is base stacking?',
 en:'“The flat bases piling face to face along the helix axis. In aqueous solution the textbook says those stacking associations are stabilised mainly by <b>hydrophobic</b> interactions.”',
 cn:'<b>这一条把这题和卡 01 的落点接起来了</b>：疏水效应是水的熵，不是分子之间的吸引。'},
{r:'中', q:'Major and minor groove — what are they for?',
 en:'“They are the two unequal channels the double helix leaves on the outside. They matter because the edges of the base pairs are exposed there, so a protein can read the sequence without opening the helix.”',
 cn:'书给了名字和图（<span class="pg">p073 p074</span>），但<b>没有说「蛋白从这里读序列」</b>——那半句是通用知识，说成 generally。'}
]},

 en:'“Because complementarity makes each strand a full record of the other — the information is stored twice. The textbook’s point is that the complementary nature of the two strands fixes the base order of every new strand: one strand is the template. Generally, it is also why damage on one strand can be repaired by reading the other.”',

{r:'高', q:'Why thymine in DNA and uracil in RNA?',

<script>
/* data/13.js */
/* 卡 13 · What are two critical post-translational modifications for surface and secreted proteins?
   题库 #13（S2 Biochemistry 7）· 导师写过一遍
   出处 Biochemie OCR p108–p115、p109
   插队理由：2026-09-11 她跟同事聊到这题只答出「O-glycan / N-glycan」，自评不合格。 */

window.CARDS.push({
id:'13', n:13, w:2,
q:'What are two critical post-translational modifications for surface and secreted proteins?',
qcn:'对表面蛋白和分泌蛋白最关键的两种翻译后修饰是什么',
sub:'主干说完约 90 秒 · 口试他多半只问 “What is post-translational modification?”',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'⚠ 他不会念完整的题面。卷面写了 two / critical / surface and secreted，嘴上多半只有前半句——那三个词是他要挖的方向，不是他会说出口的话。'},
 {n:'01', t:'定义',
  big:'把新生肽链变成<b>有活性的蛋白</b>的那一整套过程，核酸不再参与——<b>没有密码子编码它</b>；狭义指其中<b>共价</b>的那些',
  en:'“Post-translational modification is the set of processes that turn the nascent polypeptide into the <b>biologically active protein</b> once the nucleic acids are no longer involved — so nothing in it is <b>encoded by a codon</b>. The textbook counts three kinds: the non-covalent folding and association of the chain, covalent changes to the backbone such as signal-peptide cleavage, and covalent changes to side chains. In the usual narrower sense the term means the covalent ones — and some of those, N-glycosylation for instance, actually begin while the chain is still on the ribosome.”',
  note:'「没有密码子」这条边界一句话挡掉两道题：这题的定义，和 #1 里「hydroxyproline 为什么不算 proteinogenic」。<b>同一个边界，两道题共用。</b>'},
 {n:'02', t:'挑两个',
  big:'<b>N-glycosylation</b> 和 <b>disulfide bond formation</b>',
  en:'“For proteins that go to the surface or out of the cell, two of them matter most: <b>N-glycosylation</b> and <b>disulfide bond formation</b>.”',
  note:'题面里的 <b>two</b> 是导师自己写的——他要的是**挑两个**，不是列一堆。列一堆就答偏了。'},

 {g:'为什么偏偏是这两个', gn:'这一格是整题的胜负手。只说名字＝不合格，说清这个＝答对一半。'},
 {n:'03', t:'共同点',
  big:'表面蛋白和分泌蛋白的共同点是<b>都走分泌通路</b>，也就是<b>都经过 ER 腔</b>',
  en:'“What surface and secreted proteins have in common is that they all take the same route, the <b>secretory pathway</b>: an N-terminal signal sequence brings the ribosome to the ER — via the signal recognition particle, SRP, which docks on its receptor in the ER membrane — the chain is threaded into the ER lumen as it is made and the signal is cut off by signal peptidase, and from there vesicles carry it through the Golgi to the plasma membrane or out of the cell. So they all pass through the <b>lumen of the ER</b> — which is already ‘outside’ in the topological sense: its contents reach the extracellular space by vesicle fusion and never mix with the cytosol, which is why it can hold an oxidising chemistry the cytosol cannot.”',
  note:'先说共同点，再说修饰。顺序反过来就变成了列清单。'},
 {n:'04', t:'关键一句',
  big:'ER 里发生的修饰书列了四种；<b>这两个是通用的</b>，而且都<b>不能在胞质里做</b>',
  en:'“Of the modifications the textbook lists, four happen in the ER — glycosylation, disulfide formation, hydroxylation and γ-carboxylation. Hydroxylation is specific to collagen and γ-carboxylation to the clotting factors, so the two <b>general</b> ones, the ones nearly every surface or secreted protein carries, are N-glycosylation and disulfide bonds. Neither can be made in the cytosol: it is a <b>reducing</b> environment — its glutathione is almost entirely the free thiol, so a structural sulfur–sulfur bond there is exchanged back into two thiols — and <b>oligosaccharyltransferase</b> — the textbook just says ‘transferases’ — which moves the sugar core onto asparagine, has its active site in the ER lumen.”',
  note:'<b>「胞质是还原性的，二硫键在那儿形不成」</b>——这半句是全卡最值钱的一句。它同时解释了为什么是这两个、为什么在这儿、以及（见 ⑧ 桥）为什么表达膜蛋白要用酵母不用大肠杆菌。'},
 {n:'05', t:'一句话收',
  big:'所以这两个修饰等于<b>「这个蛋白到过 ER」的签名</b>',
  en:'“So between them, these two modifications are the <b>signature of a protein that has been through the ER</b>.”',
  note:'说到这里，critical 那个词就答完了。'},

 {g:'糖基化的机制', gn:'他追问时追的是这一个，不是二硫键。分两阶段，别说成一步。'},
 {n:'06', t:'接在哪',

segs:[
 {tag:'段 1 · 定义', h:'他只问了半句，你要把结构自己接上',
  p:['“Post-translational modification means the processes that turn the nascent polypeptide into the biologically active protein once the nucleic acids are no longer involved — nothing in it is encoded by a codon. The textbook counts three kinds: non-covalent folding and association, covalent changes to the backbone, covalent changes to side chains; in the narrow sense the term means the covalent ones.',
     'For proteins that go to the surface or out of the cell, two of them matter most: <b>N-glycosylation</b> and <b>disulfide bond formation</b>.”'],
  note:'<b>他嘴里的题面只到「什么是翻译后修饰」。</b>卷面上多出来的 two / critical / surface and secreted 是他要挖的方向——所以你要主动把「挑两个」这一步做掉，不要等他问。'},
 {tag:'段 2 · general', h:'为什么偏偏是这两个',
  p:['“What surface and secreted proteins have in common is that they all take the <b>secretory pathway</b> — a signal sequence brings the ribosome to the ER, the chain enters the lumen as it is made, then vesicles through the Golgi to the surface or the outside — so they all pass through the lumen of the endoplasmic reticulum, which is topologically already outside the cell: its contents never mix with the cytosol.',
     'Of the four modifications the textbook places in the ER — glycosylation, disulfide formation, hydroxylation, γ-carboxylation — these two are the general ones, the ones nearly every surface or secreted protein carries. Neither can be made in the cytosol: it is a <b>reducing</b> environment — its glutathione is almost entirely the free thiol, so a structural sulfur–sulfur bond is exchanged back into two thiols — and the transferase that puts the sugar core onto asparagine faces the ER lumen.',
     'So between them, these two modifications are the signature of a protein that has been through the ER.”'],
  note:'<b>这一段答的是题面里的 critical。</b>只说名字不说这个，就是上次那种不合格。'},
 {tag:'段 3 · 稍展开', h:'挑糖基化，因为他追的是这个',
  p:['“N-glycosylation runs in two phases. First the oligosaccharide core is not built on the protein at all — it is assembled on a lipid carrier, dolichol phosphate, until it reaches three glucose, nine mannose, two N-acetylglucosamine.',
     'Then a transferase moves that whole core onto the protein. The signal it reads is a tripeptide: asparagine, any residue except proline, then serine or threonine. This happens in the ER membrane while the protein is still being synthesised.',
     'The core is then trimmed and rebuilt — glucosidases take the three glucoses off, mannosidases take some mannoses off, and further transferases in the Golgi add N-acetylglucosamine, galactose and sialic acid at the end. The textbook puts the trimming in the Golgi; in the standard picture the glucoses come off already in the ER, as a folding check.”'],
  note:'〔可裁〕再一层：“And one mannose can be phosphorylated at position six — <b>mannose-6-phosphate</b> is the tag that sends a secretory glycoprotein to the lysosome.”'},
 {tag:'段 4 · 留口子', h:'把话引到折叠质控',
  p:['“Both of these happen while the chain is still folding, not after. The textbook says disulfide formation contributes to reaching the active fold; in the standard picture the glycan’s trimming state is read as a folding check. That is the part I find interesting, because the textbook says elsewhere that for many proteins the biologically active conformation is not the lowest-energy one — which is also how it describes what a disulfide bridge does: it fixes the chain in a conformation that is not entirely favourable energetically.”'],
  note:'<b>这一段把第四章和第二章接起来了</b>（p113 的定性 ＋ p109 的论断）。能把两章接起来，是这场考试里最划算的动作。'}
],

recog:[
{q:'What is PTM?',
 mean:'他多半说全称 “What is post-translational modification?”。<b>这就是他真正会说出口的那句。</b>卷面那句完整题面他不会念。所以这一句的答案必须<b>自带结构</b>：定义 → 挑两个 → 为什么是这两个 → 分别对应什么。',
 say:'“Post-translational modification means the processes that turn the nascent polypeptide into the biologically active protein once the nucleic acids are no longer involved — nothing in it is encoded by a codon; in the narrow sense, the covalent changes to the backbone and the side chains. For proteins that go to the surface or out of the cell, two matter most: N-glycosylation and disulfide bond formation. What they have in common is that neither can be made in the cytosol — it is reducing, so a structural disulfide does not survive there, and the transferase that puts the sugar core on faces the ER lumen.”'},

{q:'Name some post-translational modifications.',
 mean:'他要清单，不是要两个。<b>这时候才列</b>——而且列完要说哪些是分泌蛋白特有的。',
 say:'“The textbook lists seven: glycosylation, hydroxylation, γ-carboxylation, disulfide bond formation, methylation, phosphorylation and sulfation. Four of them it places in the ER — <b>glycosylation, hydroxylation, γ-carboxylation and disulfide formation</b> — and those mark a protein that has gone through the secretory route. <b>Phosphorylation and methylation are, in general, the cytosolic regulatory ones</b>, on signalling and regulatory proteins.”',
 tail:'甲基化和硫酸化被追就说：“Methylation puts methyl groups on charged side chains — O-methyl esters on the carboxyls of glutamate and aspartate, mono- to tri-N-methyl on the amines of lysine, arginine and histidine; the textbook’s examples are the bacterial chemotaxis proteins, and it notes that faulty methylation of sperm proteins is a fairly common cause of infertility. Sulfation esterifies a side-chain hydroxyl with sulfate — the textbook’s example is the tyrosines of gastrin.”（p113–p114）γ-羧化见「Why do you need vitamin K?」。'},

{q:'How is N-glycosylation formed?',
 mean:'<b>同学转述的实测问题，而且明说「要机制不要现象」。</b>两阶段，别说成一步。',
 say:'“In two phases. The core is first assembled on a lipid carrier, dolichol phosphate, until it is three glucose, nine mannose, two N-acetylglucosamine. Then oligosaccharyltransferase moves the whole core onto an asparagine, reading the sequon asparagine–any residue except proline–serine or threonine. That happens in the ER membrane while the protein is still being made. Trimming and the terminal sugars come later, in the Golgi.”'},

{q:'Why can’t E. coli make your protein properly?', odd:1,
 mean:'<b>这就是同一个答案，换成了实验室的问法。</b>而且它直通你的工作。',
 say:'“Because the E. coli cytoplasm is reducing, so disulfides do not form there — you would have to send the protein to the periplasm or use an engineered oxidising strain — and E. coli has no N-glycosylation — no dolichol-linked core and no oligosaccharyltransferase. A surface protein that needs both is far easier to fold correctly in a eukaryotic host, which is why I express it in yeast.”',
 tail:'<b>这是一个想接的口子</b>：他顺着走就到 yeast display，那是你的主场。'},

{q:'Why do you need vitamin C?', odd:1,
 mean:'问的是 <b>hydroxylation</b>，也是 ER 里的翻译后修饰。',
 say:'“Because ascorbate is a cofactor of the three hydroxylases that make collagen’s hydroxyproline and hydroxylysine after translation, in the cisternae of the ER — a prolyl 4-hydroxylase, a prolyl 3-hydroxylase and a lysyl 5-hydroxylase, generally — alongside oxygen, 2-oxoglutarate and Fe²⁺. Without <b>ascorbate</b> the hydroxylation does not finish and the collagen is not stable.”',
 tail:'⚠「坏血病」这个病名<b>书里没有</b>，辅因子清单有（p112）。要提病名就说 “that is the biochemistry behind scurvy”。'},

{q:'How does a protein know to go to the lysosome?', odd:1,
 mean:'问的是 <b>mannose-6-phosphate</b>。',
 say:'“By a sugar tag. One mannose on the N-linked chain is phosphorylated at position six, and mannose-6-phosphate is what routes a secretory glycoprotein to the lysosome — generally, a mannose-6-phosphate receptor in the Golgi reads the tag and sorts the protein into vesicles bound for the lysosome.”'},

{q:'Why isn’t hydroxyproline one of the twenty amino acids?', odd:1,
 mean:'<b>问的是这题的定义那一格</b>，只是从 #1 那道题绕过来的。',
 say:'“Because it is not encoded by a codon. It is made after translation, by hydroxylating a proline residue that is already in the chain. Natural, but not proteinogenic.”'},

{q:'What does protein disulfide isomerase do?',
 mean:'注意名字里的 isomerase。',
 say:'“It catalyses disulfide bond formation in the cisternae of the ER. And the name matters — as an <b>isomerase</b> it also reshuffles bonds that formed between the wrong pair of cysteines.”'},

{q:'Which of these modifications is reversible?',
 mean:'分类问题。<b>可逆的是信号用的，不可逆的是结构用的。</b>',
 say:'“Phosphorylation — a phosphoester on the hydroxyl of serine, threonine or tyrosine, put on by a protein kinase and hydrolysed off by a phosphatase — is the reversible one: the textbook calls it a mechanism for controlling the biological activity of proteins, especially enzymes, through a change of conformation, and notes that some proteins are more active once the phosphate is hydrolysed off again. Glycosylation and disulfide formation are not reversed in normal operation; they are structural, not regulatory.”',
 tail:'⚠ 「可逆 vs 不可逆」这个分法**书里没有明说**，是从 p113–p114 推的。说成 "generally" 比较稳。'},

{q:'Why do you need vitamin K?', odd:1,
 mean:'跟维 C 那条平行：问的是 <b>γ-羧化</b>。',
 say:'“Because γ-carboxylation depends on it. γ-Carboxylation adds a second carboxyl to the γ-carbon of glutamate side chains, giving γ-carboxyglutamate; the carboxylase sits on the inner face of the ER membrane and needs vitamin K. The textbook says it was first found in the plasma glycoproteins of blood clotting — generally prothrombin and factors VII, IX and X — where the paired carboxyls bind calcium. No vitamin K, no carboxylation, no clotting.”'},
],

{r:'实测', q:'Why those two in particular? (critical)',
 en:'“Because they are the two general ones among the ER modifications. The textbook puts four in the ER — glycosylation, disulfide formation, hydroxylation, γ-carboxylation — but hydroxylation is collagen’s and γ-carboxylation belongs to the clotting factors; nearly every surface or secreted protein carries an N-glycan and disulfides. Neither can be made in the cytosol: it is reducing, and the transferase for the sugar core faces the ER lumen. So these two are the signature of a protein that has been through the secretory route. The textbook itself lists backbone processing — signal-sequence cleavage, proinsulin to insulin — as the modification tied to export; that is the entry ticket, these two are what the folded product carries.”',
 cn:'<b>2026-09-11 就是这一刀没接住。</b>只答 O-glycan / N-glycan 是回答了「哪两个」，没回答「为什么 critical」——<b>而题面本身在问后者</b>。'},
{r:'高', q:'What do they each do? (surface and secreted)',
 en:'“The glycosylation decides where the protein goes and, in the standard picture, reports how far it has folded — the trimming state is readable. The disulfide fixes the chain in a conformation that, as the textbook puts it, is not entirely favourable energetically. One is routing and quality control; the other is mechanical stability — and that matters precisely for proteins that leave the cell: outside there are, generally speaking, no chaperones and the medium is oxidising, so a disulfide survives there, and the glycan is the first thing the outside world touches.”',
 cn:'<b>「一个管去向，一个管稳定」是最短的分工说法。</b>说完这句，surface and secreted 那个限定词就答完了。'},
{r:'中', q:'Only two? What about the others? (two)',
 en:'“There are more — hydroxylation, methylation, phosphorylation, sulfation, gamma-carboxylation. But phosphorylation and methylation act mostly on cytosolic proteins, in signalling and regulation. If the question is about surface and secreted proteins in general, the two that nearly all of them carry are N-glycosylation and disulfides; hydroxylation and γ-carboxylation are ER modifications too, but hydroxylation is collagen’s and γ-carboxylation belongs to the clotting factors.”',
 cn:'<b>把「还有哪些」和「为什么只挑两个」一起答掉。</b>这样既显示你知道全集，又说明你听懂了限定词。'}
]},

{g:'定义类', gn:'他默认你知道这些名词。', items:[
{r:'中', q:'What is glycosylation?',
 en:'“Glycosylation is the <b>covalent attachment of carbohydrate to a protein</b> by highly specific glycosyltransferases, with nucleotide sugars as donors. Two linkages: N-glycosidic, to the side-chain amide nitrogen of asparagine, or O-glycosidic, to the side-chain hydroxyl of serine or threonine. It takes place in the ER and the Golgi, and the textbook calls it one of the most important post-translational modifications.”',
 cn:'<b>核心词正面定义。</b>先说它是什么，再分 N/O。'},
{r:'中', q:'What is a signal peptide?',
 en:'“A signal peptide is the <b>N-terminal sequence</b> — coded by the signal codons right after the initiation codon — that sends a nascent chain into the ER; preproinsulin’s is 23 residues. It has a hydrophobic middle and charged ends. The signal recognition particle, SRP, binds it as it emerges from the ribosome and docks on the SRP receptor in the ER membrane; the hydrophobic part enters the membrane, a pore opens — bounded by ribophorins, the textbook says — and the rest of the chain is threaded into the lumen as it is made. Once its end appears in the lumen, membrane-bound signal peptidase cuts it off, so the mature protein no longer carries it. The textbook files this under covalent modification of the backbone — the one tied to export.”',
 cn:'题库 #9 就是这句（bw 指到这张卡）。<b>整条从书 p110–p111 来。</b>'},
{r:'高', q:'What is the endoplasmic reticulum?',
 en:'“The endoplasmic reticulum is the membrane network of flattened sacs — cisternae — continuous with the nuclear envelope. The rough ER carries the ribosomes making secretory and membrane proteins; its lumen is where they fold, get their N-glycan and their disulfides, and it is topologically already outside the cell — its contents reach the extracellular space by vesicle fusion and never mix with the cytosol, which is why it can hold an oxidising chemistry the cytosol cannot.”',
 cn:'定义是通用细胞生物学；在里面发生什么是书 p109–p112。'},
{r:'中', q:'What is the Golgi apparatus?',
 en:'“The Golgi apparatus is the stack of flattened cisternae that receives the microvesicles budding from the ER; there the glycan is trimmed and finished, proproteins are cut — proinsulin to insulin — and the products are packed into secretory granules that fuse with the plasma membrane.”',
 cn:'p111–p112。'},
{r:'高', q:'What is proinsulin?',
 en:'“Insulin is made as preproinsulin: a 23-residue N-terminal signal sequence, then the B chain, the connecting C-peptide, then the A chain. Signal peptidase removes the signal in the ER, giving proinsulin; in the Golgi a trypsin-like enzyme cuts out the C-peptide and a carboxypeptidase removes the basic dipeptide it was attached by, leaving insulin — A and B chains held by three disulfides that formed while the C-peptide still held them together.”',
 cn:'p111，书的主干加工例子。'},
{r:'中', q:'What is O-glycosylation?',
 en:'“O-glycosylation attaches sugars one at a time, directly from nucleotide sugars, to the side-chain hydroxyl of serine or threonine — no lipid carrier, no preassembled core, no sequon; generally it happens in the Golgi, after folding. The textbook’s own example is the sugar on the hydroxylysine of collagen.”',
 cn:'书 p112 只给了连接位置；其余通用。'},
{r:'高', q:'What is a reducing environment, and why does it stop disulfides forming?',
 en:'“A reducing environment is one where the redox buffer is mostly in its reduced form. In the cell that buffer is glutathione — γ-glutamyl-cysteinyl-glycine — and the cytosol keeps it almost entirely as the reduced form, GSH, the free thiol — roughly a hundred to one, generally — so a structural disulfide there is exchanged back into two thiols. In the ER lumen the balance is shifted towards the oxidised form, GSSG, two glutathiones joined through a disulfide, around three to one; the textbook’s example is proinsulin, whose three A–B disulfides form by handing their thiol hydrogens to oxidised glutathione. The reducing cytosol is standard cell biology; the textbook gives only the ER half.”',
 cn:'<b>书给了一个现成的证据</b>：proinsulin 的 A、B 链之间的二硫键，是靠与<b>氧化型谷胱甘肽</b>反应形成的（p113）。同一个分子，既是例子又是机制。'},
{r:'高', q:'What is a sequon?',
 en:'“A sequon is the short consensus sequence a glycosyltransferase recognises as its attachment site — the textbook calls it the signal for binding to asparagine: asparagine, any residue except proline, then serine or threonine — and only an asparagine sitting in that pattern gets glycosylated. ‘Sequon’ is the standard name, not the textbook’s.”',
 cn:'<b>被继续追「为什么不能是 proline」</b>：proline 的氮在环里，主链在那个位置的几何被锁死，转移酶读不到它要的构象：“Why not proline? Generally speaking, proline’s nitrogen is part of its pyrrolidine ring, so the backbone at that position cannot take the conformation oligosaccharyltransferase needs to read the sequon — the textbook gives the rule, not the reason.”<br>⚠ 这个理由<b>书里没有</b>，是通用解释，别说成书上的。'},
{r:'中', q:'What is dolichol?',
 en:'“Dolichol is a polyisoprenoid alcohol — nine to twenty-two isoprene units, the textbook says, ending in a hydroxyl. As dolichol phosphate it is the membrane-bound carrier on which the sugar core is built from nucleotide sugars — monosaccharides activated on a nucleoside diphosphate: UDP-glucose, UDP-GlcNAc, GDP-mannose — starting with UDP-GlcNAc, before the whole block is moved onto asparagine.”',
 cn:'⚠ n = 9–22 这个数<b>要回原图核</b>（OCR 数字容易吃掉）。<span class="pg">p112</span>'}
]},

{g:'为什么类', gn:'给了结论没给理由的地方。', items:[
{r:'高', q:'Why build the core on a lipid first instead of adding sugars one by one?',
 en:'“So that every N-site starts from the same structure. In the standard picture that makes the trimming state readable — how many glucoses are still on tells the cell how far the protein has folded; the textbook does not go into that. Adding sugars one at a time, as O-linked glycosylation does, gives you no such common reference.”',
 cn:'<b>这一条同时解释了 N- 和 O- 的差别</b>：O- 是在 Golgi 里一个一个加的，没有共同起点，所以也不承担质控。<br>⚠ 「质控读取修剪状态」这层<b>书里没明说</b>，是从「两阶段 ＋ 修剪」推的。说成 generally。'},
{r:'高', q:'Why does the cell bother making disulfides at all, if the fold is already determined by the sequence?',
 en:'“Because for many proteins the biologically active conformation is <b>not</b> the energetically most favourable one — the textbook says so directly. A disulfide is one of the ways to hold a chain in a conformation it would not otherwise stay in. That matters most outside the cell, where — generally speaking — there are no chaperones to help.”',
 cn:'<b>这条把 p113 和 p109 咬在一起</b>，而且顺带修正了「序列决定结构」的天真版本。<b>能把两章接起来，是这场考试里最划算的动作。</b><span class="pg">p109 p113</span>'}
]},

{g:'桥回主场', gn:'他顺着走就到你答得住的地方。', items:[
{r:'中', q:'What is the periplasm?',
 en:'“The periplasm is the space between the inner and outer membranes of a Gram-negative bacterium; unlike the cytoplasm it is oxidising and has its own disulfide-forming enzymes, the Dsb proteins, so disulfides can form there.”',
 cn:'通用；这是「E. coli 里怎么做二硫键」的答案。'},
{r:'高', q:'So how would you express a protein like that?',
 en:'“Not easily in E. coli — its cytoplasm is reducing, so no disulfides unless you go to the periplasm or an engineered strain, and it has no N-glycosylation. For a surface protein that needs both, a eukaryotic host is the point. That is why I work with <b>yeast display</b>: the protein is anchored on the yeast surface, so it has gone through the secretory pathway, and I can read binding cell by cell.”',
 cn:'<b>这是全卡最强的一个口子。</b>它从书里的一句化学事实（胞质是还原性的）一步走到你的日常工作，而且中间没有跳跃。'},
{r:'中', q:'You said folding quality control — how does that work?',
 en:'“In the standard picture the check is done by two ER lectins, calnexin and calreticulin: they bind a glycoprotein only while its N-glycan still carries a single glucose; once that last glucose is trimmed the protein is released, and if it is still misfolded a glucosyltransferase — UGGT — puts one glucose back, so it goes round again. On top of that sit the chaperones proper, which recognise and stabilise partially folded intermediates and help repair chains that have folded wrongly. The textbook names GroEL and GroES, and hsp70. It also says that a number of serious neurological diseases are caused by protein misfolding.”',
 cn:'完整内容在<b>卡 01 的追问</b>里。<span class="pg">p109</span>'}
]}
]
});

</script>
<script>
/* data/18.js */
/* 卡 18 · Describe the structure of an enzyme and the active site.
   题库 #18（S3 Biochemistry 5）
   出处 Biochemie OCR p041–p043（§3.1 §3.2 §3.2.1）、p058（pH 与活性中心）、
        p061–p062（§3.6 作用机制、活性中心、专一性、诱导契合） */

window.CARDS.push({
id:'18', n:18, w:1,
q:'Describe the structure of an enzyme and the active site.',
qcn:'描述酶的结构和活性中心',
sub:'主干说完约 90 秒 · 两个层次：蛋白部分 ＋ 非蛋白部分',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'先给定义和边界。「酶是蛋白质」这句话现在需要加一个限定词——这正是他可能挖的第一刀。'},
 {n:'01', t:'定义',
  big:'酶是<b>专门用来催化生物体内反应</b>的蛋白质，特点是<b>专一性高</b>、<b>催化效率高</b>',
  en:'“Enzymes are proteins specialised for catalysing the reactions that take place in living organisms — that is, they bind the reactants transiently and route the reaction through a path of lower activation energy, without being consumed. Two properties characterise them: <b>high specificity</b> and <b>high catalytic efficiency</b>. The question has two halves: the <b>structure</b> of the enzyme — what the molecule is built of, the protein and any cofactor — and the <b>active site</b>, the small region of that structure where the substrate binds and the chemistry happens.”',
  note:'书 p041 开篇原话。<b>「专一性 ＋ 效率」这两个词是整题的骨架</b>——后面所有结构上的东西，都是为这两条服务的。'},
 {n:'02', t:'边界',
  big:'「酶都是蛋白质」<b>已经不完全对了</b>',
  en:'“Until recently every known enzyme was a protein. Research of the last decades shows that some <b>other types of macromolecule</b> can also have catalytic ability — the textbook, written when only one catalytic RNA was described, mentions a single case; today several ribozymes are standard — the peptidyl transferase of the ribosome, RNase P, self-splicing introns. So: enzymes are proteins, with catalytic RNAs as the known exception.”',
  note:'<b>主动说出这个限定，比等他来纠正好。</b>书 p042 自己写了这句。<br>顺带一个可以当钓饵的年份：<b>1926 年第一个被结晶出来的酶是 urease，Sumner 做的</b>；三十年代又结晶出 trypsin、pepsin、chymotrypsin。至今描述过的酶<b>超过 3000 种</b>。<span class="pg">p041</span>'},

 {g:'结构的两个层次', gn:'这是这题的正answer。别一上来就说活性中心——先说分子由几部分组成。'},
 {n:'03', t:'两个层次',
  big:'有些酶<b>只有多肽链</b>；有些的活性形式还需要一个<b>非蛋白部分</b>，叫 <b>cofactor</b>',
  en:'“Structurally an enzyme is first a globular protein — one or more polypeptide chains folded so that the fold brings the active-site residues together. On top of that, some enzymes are the polypeptide alone. In others the active form also contains a non-protein component, the <b>cofactor</b> — which can be a <b>metal ion</b> or an organic molecule, a <b>coenzyme</b>. Some enzymes have both.”',
  note:'<b>这一句是这题的分层依据。</b>先说「有没有非蛋白部分」，再说那部分是什么。<span class="pg">p043</span>'},
 {n:'04', t:'两个名字',
  big:'蛋白 ＋ 辅因子 = <b>holoenzyme</b>；去掉辅因子剩下的蛋白 = <b>apoenzyme</b>',
  en:'“The catalytically active complex of protein plus cofactor is called the <b>holoenzyme</b>; the protein part on its own, after the cofactor is removed, is the <b>apoenzyme</b>.”',
  note:'<b>这两个词一定要报</b>，它们是这题最标准的 specific 答案。<span class="pg">p043</span>'},
 {n:'05', t:'一个可以做实验的判据',
  big:'<b>辅因子耐热，蛋白部分不耐热</b>',
  en:'“A useful practical point: the cofactors are <b>thermally stable</b> while the protein part is not. That is in fact how the two halves were first separated — boiled, dialysed yeast juice retained a heat-stable, dialysable factor, the cozymase that turned out to be NAD⁺ — though that experiment is my addition, not the textbook’s.”',
  note:'书只说了性质（p043：辅因子耐热，蛋白部分不耐热）。<b>煮沸/透析那个实验（Harden &amp; Young 1906，cozymase = NAD⁺）是通用史实，不是书的</b>——说的时候说成自己的：“That was Harden and Young, 1906.”<span class="pg">p043</span>'},
 {n:'06', t:'辅酶结合的紧还是松',
  big:'结合<b>很紧</b>叫 <b>prosthetic group</b>；结合<b>很松</b>的在动力学上<b>表现得像底物</b>',
  en:'“When a coenzyme is bound to the apoenzyme very tightly — often covalently: heme in the cytochromes, biotin on a lysine, pyridoxal phosphate as an aldimine on a lysine — it is called a <b>prosthetic group</b>. Others, like NAD⁺, are held by weak interactions only, come and go, and kinetically behave as a <b>substrate</b> of the enzyme.”',
  note:'<b>后半句很值钱</b>：它解释了为什么 NAD⁺ 那类辅酶在动力学上要按底物处理，也接上了卡 02 里的双底物机制。<span class="pg">p043</span>'},
 {n:'07', t:'辅酶是什么来头',
  big:'辅酶多数是<b>维生素或其衍生物</b>，功能是<b>中间搬运工</b>',
  en:'“Coenzymes usually act as <b>intermediate carriers</b> of functional groups, atoms or electrons taking part in the reaction. Structurally most of them correspond to <b>vitamins</b> or their derivatives — and vitamins, in the textbook’s definition, are organic substances indispensable for the vital functions of the cell that the organism has to obtain from food: the nicotinamide of NAD⁺, the riboflavin in FAD, pantothenate in coenzyme A, thiamine in TPP, pyridoxal phosphate from pyridoxine.”',
  note:'<b>这一句一次答掉两道题</b>：#18 的辅酶部分和 #31「维生素在代谢中的作用」。<span class="pg">p043</span>'},
 {n:'08', t:'金属酶',
  big:'含金属离子的叫 <b>metalloenzyme</b>：Zn 在 alcohol dehydrogenase，Mg 在 phosphatase，Mn 在 hexokinase',
  en:'“Enzymes with metal-ion cofactors the textbook calls <b>metalloenzymes</b>: zinc in alcohol dehydrogenase, iron in the cytochromes, copper in tyrosinase — and the loosely bound activators, magnesium in phosphatase and, as Mg-ATP, in hexokinase, where the textbook lists manganese; potassium in pyruvate kinase, sodium in ATPase. In stricter usage only the tightly bound ones are metalloenzymes.”',
  note:'<b>七个金属七个酶，书全给了。</b>这是典型的 very specific 题弹药。<span class="pg">p043</span>'},
 {n:'09', t:'金属的三个作用',
  big:'金属离子干三件事：<b>活性中心的一部分</b> · <b>底物结合的桥</b> · <b>稳定空间结构</b>',
  en:'“The metal ion works in three ways: as <b>part of the active site</b>, as a <b>bridge</b> for binding the substrate to the enzyme, or as an element that <b>stabilises the spatial structure</b> of the molecule.”',
  note:'<b>书列的正是这三条。</b>「桥」那一条直接接 His-tag——那也是金属当桥，只不过桥的另一头是柱子不是底物：“A His-tag column uses the same bridging role — a metal between two ligands — only the other end of the bridge is the column, not a substrate.”<span class="pg">p043</span>'},

 {g:'活性中心', gn:'到这里才说活性中心。先结构后功能，顺序不能反。'},
 {n:'10', t:'定义',
  big:'只有分子的<b>一部分</b>负责催化，那部分叫 <b>active site</b>——<b>接触发生在那里，催化的基团也在那里</b>',
  en:'“Only part of the molecule is responsible for the catalytic ability — the <b>active site</b>: a small region of the tertiary structure, in standard terms a pocket or cleft, formed by a few amino-acid side chains and sometimes a metal ion or coenzyme. It is the part where the contact between enzyme and substrate takes place, and where the groups responsible for the actual catalysis are located — done by largely different residues: some bind and orient the substrate, which is where specificity comes from; a few do the chemistry.”',
  note:'<b>「接触」和「催化」两件事都在那里</b>，这是书的定义。说全了才算答完。<span class="pg">p061</span>'},
 {n:'11', t:'它在哪',
  big:'在三级结构里是<b>相对很小的一块</b>，但组成它的氨基酸<b>在一级结构上可以离得很远</b>',
  en:'“In the tertiary structure it forms a relatively small region — but the amino acids belonging to it can be <b>very far apart in the primary structure</b>.”',
  note:'<b>这一句直接接卡 01。</b>它就是「三级结构 = 序列上离得远的残基聚到一起」的最好例子——<b>活性中心是三级结构存在的理由</b>。<span class="pg">p061</span>'},
 {n:'12', t:'里面是哪些残基',
  big:'常见的是带<b>反应性侧链</b>的：<b>histidine、serine、tyrosine</b>',
  en:'“Amino acids with reactive side chains are often located there — histidine through its imidazole, serine through its hydroxyl, tyrosine through its phenolic hydroxyl.”',
  note:'再具体一层，书给了**能当质子供体或受体**的那一组：<b>–COOH（Asp、Glu）· –NH₂（Lys）· –OH（Tyr）· imidazole（His）</b>。这叫**广义酸碱催化**。<span class="pg">p061 p062</span>'},
 {n:'13', t:'为什么 pH 要紧',
  big:'活性中心是<b>酸碱性</b>的，所以 <b>pH 直接改变它</b>',
  en:'“The reason pH affects an enzyme is the acid–base character of the molecule, and <b>especially of the active site</b>. The pH also affects the dissociation of the substrate.”',
  note:'<b>书自己把 pH 效应归到活性中心上</b>（p058）。而且它补了一句很好用的：<b>酶的 pH 最适值不一定等于它在体内实际工作的 pH</b>。<span class="pg">p058</span>'},

 {g:'专一性与效率', gn:'开口那两个词到这里兑现。'},
 {n:'14', t:'专一性有两种',
  big:'<b>底物专一性</b>（只作用于特定底物）＋ <b>作用专一性</b>（反应只按特定方式进行）',
  en:'“Specificity means the enzyme discriminates. It has two sides: <b>substrate specificity</b> — it converts only a particular substrate; and <b>reaction specificity</b>, the textbook’s ‘specificity of action’ — it converts it by only one reaction.”',
  note:'<b>书给的理由很生动</b>：要不是这样，<b>细胞会很快被不想要的产物淹没</b>。<br>专一性程度不一样：有些几乎绝对，连很像的分子都不碰；有些攻击一整类只要带某个结构特征的物质。<b>多数酶是立体专一的</b>，有些甚至能区分非手性碳上两个相同的取代基：“Most enzymes are stereospecific; some can even distinguish between two identical substituents on a non-chiral carbon.”<span class="pg">p061</span>'},
 {n:'15', t:'效率有多高',
  big:'urease 把尿素水解加速 <b>10 的多少次方倍</b>（书上这个数 OCR 吃了）',
  en:'“Very high — the textbook’s example is urease, which accelerates the hydrolysis of urea enormously compared with catalysis by hydrogen ions — the textbook quotes a power of ten; the figure usually given for urease is about 10¹⁴ over the uncatalysed reaction, and that number is general knowledge. Because of enzymes, most reactions in the cell run in <b>dilute solution, at low temperature and at neutral pH</b>.”',
  note:'<b>最后那半句才是重点</b>，比那个数字重要：<b>酶的意义是让反应能在稀溶液、低温、中性 pH 下进行</b>。<br>⚠ 那个倍数 OCR 出来是「10krát」，指数被吃掉了，<b>回原图核之前不要报具体数</b>。<span class="pg">p061</span>'},
 {n:'16', t:'两个机制假说',
  big:'<b>邻近效应</b>：底物被拉到催化基团旁边，而且<b>被摆正了方向</b>',
  en:'“By the <b>proximity effect</b>, binding brings the important group of the substrate close to the catalytic group of the enzyme — in chymotrypsin, the carbonyl carbon of the peptide bond being cut, against the hydroxyl of Ser195. The textbook puts it well: an enzyme reaction is not really a reaction in solution — it happens in the confined space of the active site, where the substrates are not only <b>concentrated</b> but also <b>correctly oriented</b>.”',
  note:'<b>「不只是浓缩，还摆正了方向」这半句是这题最漂亮的一句。</b>它把「酶为什么快」从模糊变成两个具体机制。<span class="pg">p061 p062</span>'},
 {n:'17', t:'诱导契合',
  big:'<b>不是锁和钥匙</b>——酶和底物<b>本来不互补</b>，是接触时酶<b>改变构象</b>去适应底物',
  en:'“The older picture was lock and key: the substrate fits the active site as a key fits a lock, so enzyme and substrate are complementary. Today it is clear they need <b>not</b> be. The enzyme adapts to the substrate on interaction — it <b>changes its conformation</b>.”',
  note:'<b>书 p062 明确说旧图景已经被取代。</b>下一点是它的后果，那才是关键。'},
 {n:'18', t:'诱导契合的后果',
  big:'变形之后的 EA 复合物<b>热力学上不稳定</b>，<b>有强烈的回去的倾向</b>——所以它<b>散开成产物</b>',
  en:'“The textbook draws the consequence this way: the fitted EA complex is <b>thermodynamically unstable</b> and tends to return to the stable conformation — which is <b>why it breaks down to give product</b>; the substrate is deformed too, and that also speeds the reaction up. In the standard formulation the same point reads: the active site is complementary not to the substrate but to the transition state, so the binding energy is fully realised only as the substrate is distorted towards the transition state — and that is what lowers the activation barrier.”',
  note:'<b>这是全卡最值钱的一段推理</b>：诱导契合不只是「更贴合」，它是<b>催化的动力来源</b>。酶为了适应底物而变形，变形储存的张力把反应推过去。'},

 {g:'收尾', gn:'一句停住，一句伸出去。这题的落点很特别——它同时解释了抑制剂。'},
 {n:'19', t:'落点',
  big:'只有<b>真底物</b>能逼酶改变构象；<b>能结合但逼不动的，就成了抑制剂</b>',
  en:'“The textbook puts it in terms of affinity: for the enzyme to adapt, the affinity between E and A has to be large enough — so <b>only a true substrate can force the enzyme to change conformation</b>; some molecules do bind but cannot trigger the change, and those act as <b>inhibitors</b>. I would put it more carefully: binding is necessary but not sufficient — what the site does with the bound molecule is a separate question.”',
  note:'<b>书自己把这两件事接起来了。</b>说出这一句，你就同时答了 #18 和 #19 的一半，而且显示你把「结合」和「催化」分开了。<br>停止句：“Below that, how the conformational strain is converted into a lowered activation barrier is physical organic chemistry rather than biochemistry.”'},
 {n:'20', t:'留口子',
  big:'「结合了但不催化」正是<b>我在测的那件事</b>',

segs:[
 {tag:'段 1 · 定义', h:'先给定义，并主动加那个限定词',
  p:['“Enzymes are proteins specialised for catalysing the reactions that take place in living organisms. Two properties define them: very high <b>specificity</b> and very high <b>catalytic efficiency</b>.',
     'One qualification worth making at the start: until recently every known enzyme was a protein, but it is now clear that some other macromolecules can have catalytic ability as well — the textbook mentions one case, a ribonucleic acid. The question has two halves: the structure of the enzyme — what the molecule is built of, the protein and any cofactor — and the active site, the small region of that structure where the substrate binds and the chemistry happens; I take them in that order.”'],
  note:'<b>主动说出那个限定，比等他来纠正好。</b>而且它显示你读的是这本书而不是一个概括——这句话就在 p042。'},
 {tag:'段 2 · general', h:'结构分两个层次，先说层次再说名字',
  p:['“Structurally an enzyme is first a globular protein — one or more chains folded into a tertiary structure, often several subunits — and the fold is what brings the active-site residues together. On top of that there are two cases. Some enzymes are the polypeptide alone. In others the active form also contains a non-protein component — the <b>cofactor</b> — which can be a metal ion or an organic molecule, a <b>coenzyme</b>. Some have both.',
     'The catalytically active complex of protein plus cofactor is the <b>holoenzyme</b>; the protein part alone, once the cofactor is removed, is the <b>apoenzyme</b>.',
     'A practical point the textbook makes: the cofactors are thermally stable while the protein part is not.',
     'Coenzymes act as intermediate carriers of groups, atoms or electrons, and most of them correspond structurally to <b>vitamins</b>. If a coenzyme is bound very tightly — often covalently, like heme or biotin — it is called a <b>prosthetic group</b>; if it is bound weakly, like NAD⁺, kinetically it behaves as a substrate.”'],
  note:'<b>「耐热」那一句是实验判据，不是性质陈述</b>——它是历史上区分酶的两半的办法。'},
 {tag:'段 3 · 稍展开', h:'活性中心，先位置后成分',
  p:['“Only part of the molecule is responsible for the catalysis: the <b>active site</b>. It is where the contact between enzyme and substrate happens, and where the groups doing the actual chemistry are.',
     'In the tertiary structure it is a relatively small region — but the amino acids belonging to it can be <b>very far apart in the primary structure</b>. Residues with reactive side chains are typical: histidine, serine, tyrosine. The groups that act as proton donor or acceptor are the carboxyl of aspartate and glutamate, the amino of lysine, the hydroxyl of tyrosine, and the imidazole of histidine.',
     'That acid–base character is also why pH matters so much — the textbook attributes the pH effect to the acid–base character of the molecule, especially of the active site — and to the dissociation of the substrate.”'],
  note:'<b>「一级结构上离得很远」那半句直接接卡 01</b>——活性中心就是三级结构存在的理由。<br>如果他从这里问「多远算远」，用卡 01 里那条：给判据加反例，不要编数。'},
 {tag:'段 4 · 留口子', h:'诱导契合，然后落到结合与催化的区别',
  p:['“On how it works: the older picture was lock and key, but it is now clear that enzyme and substrate need not be complementary. The enzyme <b>adapts</b> to the substrate on interaction and changes its conformation. That matters because the resulting complex is thermodynamically unstable and has a strong tendency to return to the stable conformation — which is <b>why it breaks down to give product</b>.',
     'And there is a consequence I find useful: for the enzyme to adapt, the affinity has to be large enough, so <b>only a true substrate can force the change</b>. Molecules that bind but cannot trigger it act as inhibitors. That distinction between binding and catalysis is where I work — I measure how much a binding surface tolerates change, using yeast display and dissociation constants.”'],
  note:'<b>这一段一次做了三件事</b>：讲了机制、顺带答了抑制剂是什么、并且落到了你的主场。而且中间没有跳跃，因为<b>书自己把这两件事接在了一起</b>。'}
],

recog:[
{q:'What is a substrate?',
 mean:'<b>全卡最承重的名词，书里没定义。</b>一句说完。',
 say:'“The reactant the enzyme acts on — the molecule that binds in the active site and is converted to product. The textbook adds a kinetic point: a loosely bound coenzyme like NAD⁺ is needed in stoichiometric amount and behaves as a second substrate.”'},

{q:'What is the active site?',
 mean:'<b>两件事都要说</b>：接触在那里，催化基团也在那里。只说一件是半个答案。而且先说它<b>是什么</b>（三级结构上的一小块，几个侧链）。',
 say:'“The part of the molecule responsible for catalysis — a small region of the tertiary structure, in standard terms a pocket or cleft, formed by a few side chains and sometimes a metal ion or coenzyme. Two things happen there, done by largely different residues: some bind and orient the substrate, which is where specificity comes from; a few — the imidazole of a histidine, the hydroxyl of a serine, the hydroxyl of a tyrosine — do the chemistry. The residues can be far apart in the primary structure; the fold brings them together.”'},

{q:'What is the difference between a cofactor, a coenzyme and a prosthetic group?',
 mean:'<b>三个词一个层级图</b>，画出来就答完了。',
 say:'“Cofactor is the general term for the non-protein part. It can be a metal ion, or an organic molecule — and an organic cofactor is a coenzyme. A prosthetic group is a coenzyme held so tightly that it stays on the enzyme, often covalently — heme in the cytochromes, biotin on a lysine, pyridoxal phosphate on a lysine. A loosely bound coenzyme like NAD⁺ comes and goes and kinetically behaves as a second substrate. Lehninger would also call a tightly bound metal ion a prosthetic group; this textbook reserves the word for coenzymes.”'},

{q:'Holoenzyme or apoenzyme — which is which?',
 mean:'一句话，别展开。',
 say:'“Holoenzyme is the whole active thing, protein plus cofactor. Apoenzyme is the protein left after the cofactor is taken away — inactive on its own.”'},

{q:'Why do enzymes need vitamins?', odd:1,
 mean:'<b>问的是辅酶。</b>而且这是 #31 那道题的入口。',
 say:'“Because a protein’s own side chains can only do acid–base and nucleophilic chemistry; to carry electrons, a hydride, CO₂, an acyl or an amino group the enzyme needs a coenzyme, and most coenzymes are built from vitamins — organic substances indispensable for the cell’s vital functions that the organism has to get from food: nicotinamide in NAD⁺, riboflavin in FAD, thiamine in TPP, pyridoxine in pyridoxal phosphate, pantothenate in coenzyme A. Not ‘cannot make’: vitamin D is made in the skin, niacin from tryptophan; the definition is about the diet.”'},

{q:'Why does an enzyme stop working if you change the pH?', odd:1,
 mean:'问的是<b>活性中心的酸碱性</b>。',
 say:'“Because the catalytic groups in the active site are acids and bases — the imidazole of histidine, the carboxyls of aspartate and glutamate, the amino of lysine, the hydroxyl of tyrosine — and each must be in one particular protonation state to donate or accept a proton. Change the pH and that state changes, so the group is in the wrong form; far enough from the optimum the protein itself denatures. The textbook puts it as: the effect of hydrogen ions is on the acid–base character of the molecule, especially of the active site; pH also affects the dissociation of the substrate.”',
 tail:'书还有一句值得加：<b>酶的 pH 最适值不一定等于它在体内实际工作的 pH</b>（p058）：“The textbook adds that an enzyme’s pH optimum need not coincide with the pH at which it has to work in the organism — and that the effect of pH on activity is itself one of the cell’s tools for regulating enzyme activity.”'},

{q:'Why does boiling destroy an enzyme but not its cofactor?', odd:1,
 mean:'<b>书自己给的那句耐热性判据。</b>',
 say:'“Because the protein’s activity lives in its fold, and the fold is held by weak interactions that heat breaks — boiling denatures the apoenzyme. A cofactor is a small molecule or a metal ion whose function is in its covalent structure, which boiling does not touch, so it survives in solution. That is the textbook’s point that cofactors are thermally stable and the protein part is not. Historically that is how the two halves were first told apart — boiled, dialysed yeast juice kept a heat-stable factor, the cozymase that turned out to be NAD⁺; that history is general knowledge, not the textbook’s.”'},

{q:'Why can’t one enzyme do everything?', odd:1,
 mean:'问的是<b>专一性</b>，而书给的理由很生动。',
 say:'“Because one active site fits one substrate: it is a few side chains arranged to bind one molecule and to orient one bond towards the catalytic groups, so a single site cannot accommodate every substrate or every reaction. That restriction is specificity — substrate specificity and reaction specificity, the textbook’s specificity of action — and the cell needs it: without it, the textbook says, the cell would very quickly be flooded with unwanted products. The degree varies: some enzymes are practically absolute and will not touch a molecule very similar to the substrate; others attack a whole class sharing one structural feature.”'},

{q:'Why is an enzyme reaction faster than the same reaction in a test tube?', odd:1,
 mean:'邻近效应，而且书的措辞很好。',
 say:'“Because it is not really a reaction in solution. It happens in the confined space of the active site, where the substrates are not only concentrated but also correctly oriented relative to the catalytic groups.”'},

{q:'Is the lock-and-key model correct?',
 mean:'<b>陷阱问法。</b>答「是」就错了，而书明说它被取代了。',
 say:'“Not as originally stated. Enzyme and substrate need not be structurally complementary. Under the induced-fit picture the enzyme adapts to the substrate on interaction and changes its conformation — and that is what makes the complex unstable enough to break down to product.”'},

{q:'How is an inhibitor different from a substrate, structurally?',
 mean:'<b>书自己把这两件事接起来了</b>，用它。',
 say:'“Structurally, an inhibitor resembles the substrate enough to bind but lacks the part the enzyme acts on — or cannot force the conformational change. A substrate is the molecule the enzyme converts; an inhibitor occupies the active site — or another site — and is not converted. The textbook’s example is malonate on succinate dehydrogenase: it has one CH₂ where succinate has two, so there is no second carbon to dehydrogenate. Affinity alone does not decide it — an irreversible inhibitor binds more tightly than any substrate.”'},

{q:'How are enzymes named and classified?',
 mean:'#17 的地盘，但这里一句话带过就够。',
 say:'“Six main classes by the reaction they catalyse — oxidoreductases, transferases, hydrolases, lyases, isomerases and ligases. Each enzyme gets a systematic name, a recommended name for everyday use, and an EC code number. Take lactate dehydrogenase, E.C. 1.1.1.27, for L-lactate + NAD⁺ ⇌ pyruvate + NADH + H⁺, systematic name L-lactate:NAD⁺ oxidoreductase: the first number is the main class — 1, oxidoreductase; the second the subclass — oxidation of a primary alcohol group; the third the type of hydrogen acceptor — a nicotinamide coenzyme; the fourth the serial number within that sub-subclass.”',
 tail:'书给的例子：L-lactate + NAD⁺ ⇌ pyruvate + NADH，系统名 <b>L-lactate:NAD⁺-oxidoreductase</b>，通用名 <b>lactate dehydrogenase</b>，编号 <b>E.C.1.1.1.27</b>。四个数字分别是：大类 · 亚类（这里是伯醇的氧化）· 氢受体类型（烟酰胺辅酶）· 顺序号。<span class="pg">p041</span>'}

ask:[
{g:'定义类', gn:'这题名词密度很高，每一个都可能被单独拎出来。', items:[
{r:'中', q:'What is induced fit?',
 en:'“Induced fit is the idea that the active site is not pre-shaped to the substrate: enzyme and substrate need not be complementary, and on interaction the enzyme changes its conformation to fit — the picture that replaced Fischer’s lock and key. Its consequence is the catalytic one: the fitted complex is strained and thermodynamically unstable, tends back to the stable conformation, and so breaks down to product.”',
 cn:'<b>核心词正面定义。</b>卡上一直在描述它，但没把名字和定义放在一起。'},
{r:'中', q:'What is specificity?',
 en:'“Specificity means the enzyme discriminates. It has two sides: substrate specificity — it converts only a particular substrate; and reaction specificity, the textbook’s specificity of action — it converts it by only one reaction.”',
 cn:'正面定义，一句。'},
{r:'中', q:'What is catalytic efficiency?',
 en:'“How much faster the reaction runs with the enzyme than without it — the ratio of the catalysed to the uncatalysed rate. The textbook’s example is urease on urea against hydrogen-ion catalysis. As a measurable quantity the textbook gives molecular activity, the old turnover number: the number of substrate molecules one enzyme molecule converts per minute, obtained from V max and the molecular mass.”',
 cn:'开口说的两条性质之一，之前只答了「多高」没答「是什么」。'},
{r:'中', q:'What is a coenzyme?',
 en:'“An organic, non-protein molecule that some enzymes need for activity — the organic kind of cofactor, as opposed to a metal ion. It acts as an intermediate carrier of a group, atoms or electrons in the reaction, and most coenzymes are vitamins or their derivatives.”',
 cn:'正面定义，不用先绕 cofactor。'},
{r:'中', q:'What is an enzyme?',
 en:'“Proteins specialised for catalysing the reactions of living organisms, defined by two things — very high specificity and very high catalytic efficiency. One qualification: until recently all known enzymes were proteins, but some other macromolecules also turn out to have catalytic ability.”',
 cn:'<b>他真正会说的短句。</b>答案要自带结构：定义 → 两个特点 → 一个限定词。不要等他问「都是蛋白质吗」。'},
{r:'实测', q:'Which coenzyme carries what?',
 en:'“NAD⁺ carries a hydride — two electrons and a proton — on the nicotinamide ring, which loses its aromatic character and its positive charge when reduced. FAD carries two hydrogens on the isoalloxazine ring. Heme carries one electron by its iron switching between Fe²⁺ and Fe³⁺. Thiamine pyrophosphate carries an ‘active aldehyde’, a two-carbon unit, on C-2 of the thiazole ring. Coenzyme A carries acyl groups on its thiol. Biotin carries CO₂ on a ring nitrogen, and sits on a lysine through an amide bond. Pyridoxal phosphate carries amino groups through its aldehyde, as a Schiff base. Tetrahydrofolate carries one-carbon units — hydroxymethyl and formyl.”',
 cn:'p044 NAD⁺ · p045 FAD · p046 heme · p050 TPP、CoA · p049–p050 biotin · p053 PLP · p048 THF。书 Tab. 3.1（p043）就是这张表，OCR 碎了，后面几页把内容给全了。'},
{r:'高', q:'What is the transition state?',
 en:'“The transition state is the highest-energy arrangement along the path from substrate to product — bonds half broken, half formed; the energy needed to reach it is the activation energy, which the textbook defines as the energy the reactant molecules must be supplied with to get over the barrier. An enzyme lowers the barrier by binding that arrangement more tightly than it binds the substrate.”',
 cn:'过渡态是通用；活化能是 p054。'},
{r:'中', q:'What is an aldimine — a Schiff base?',
 en:'“An aldimine, or Schiff base, is the C=N formed when an aldehyde condenses with a primary amine, losing water — here the aldehyde of pyridoxal phosphate with the ε-amino group of a lysine; in transamination the substrate amino acid displaces the lysine and forms its own Schiff base with the coenzyme.”',
 cn:'底物的 Schiff base p053；跟赖氨酸的连接是通用。'},
{r:'中', q:'What is a ribozyme?',
 en:'“A ribozyme is an RNA molecule with catalytic activity. Peptidyl transferase is the ribosome’s activity that forms the peptide bond — it is carried by the large-subunit rRNA, not a protein. RNase P is the enzyme that trims the 5′ end of precursor tRNA; its RNA subunit is the catalyst. Self-splicing introns cut themselves out of a precursor RNA with no protein at all.”',
 cn:'通用；书只说「描述了一例核糖核酸」。'},
{r:'中', q:'What does dialysed mean?',
 en:'“Dialysis separates small molecules from macromolecules through a membrane whose pores let the small ones through and hold the protein back — so a dialysable factor is small, a coenzyme, not a protein.”',
 cn:'通用。'},
{r:'高', q:'What exactly is a coenzyme doing in the reaction?',
 en:'“It is an <b>intermediate carrier</b> — of a functional group, of atoms, or of electrons that are transferred in the reaction the enzyme catalyses. If it is loosely bound — NAD⁺, coenzyme A — it is loaded on one enzyme and unloaded on another, which is why the same few coenzymes appear all over metabolism. If it is a prosthetic group — FAD, heme, biotin, pyridoxal phosphate — it stays on its enzyme and is regenerated within the same catalytic cycle.”',
 cn:'书 p043 的原话就是「intermediární přenašeče」。<b>「同一批辅酶在整个代谢里反复出现」这半句是我加的，但它解释了为什么只有十几种辅酶</b>——说的时候说成 “which is why”，是推论不是引用。'},
{r:'高', q:'Why is a loosely bound coenzyme treated as a substrate?',
 en:'“Because kinetically that is what it is: it is consumed in stoichiometric amounts and has to be replaced, so it appears in the rate equation like any other substrate. The nicotinamide coenzymes are the textbook’s example — they are needed in stoichiometric amount and from a kinetic point of view have the character of a substrate.”',
 cn:'<b>这条接书 p058 的双底物机制</b>。ping-pong 被问：“In the ping-pong mechanism no ternary complex forms: the enzyme reacts with the first substrate A, the binary complex breaks down to the first product X and a modified enzyme E′; E′ then reacts with the second substrate B, gives the second product Y, and the enzyme is regenerated. The textbook’s example of two-substrate reactions is the nicotinamide coenzymes, needed in stoichiometric amount.”（卡 19 的 ternary complex 那条是它的对照。）'},
{r:'中', q:'What is general acid–base catalysis?',
 en:'“Catalysis in which groups on the enzyme — not the solvent’s H₃O⁺ or OH⁻, which would be ‘specific’ acid–base catalysis — donate or accept a proton in the transition state. The textbook names the groups: the carboxyl of aspartate and glutamate, the amino of lysine, the hydroxyl of tyrosine, and the imidazole of histidine.”',
 cn:'<b>imidazole 又出现了</b>——它在这题是催化基团，在 His-tag 那里是配位基团，在金属酶那里是结合金属的基团。<b>同一个侧链三个角色。</b>“The imidazole of histidine turns up in three roles: proton donor–acceptor in catalysis, the metal-binding group in metalloproteins, and the ligand that holds a His-tag on a nickel column.”'},
{r:'中', q:'What is covalent catalysis?',
 en:'“In some enzymes the catalysis goes through a very reactive, unstable <b>covalently modified enzyme</b> that then breaks down quickly to give the product. The textbook’s example is chymotrypsin acting on nitrophenyl acetate — an ester used as an artificial substrate because the released nitrophenol is yellow, so the reaction can be followed in a photometer: first an acetyl-enzyme — the acetyl on the hydroxyl of the active-site serine, Ser195; the textbook writes it E–OH + nitrophenyl acetate → E–O–CO–CH₃ + nitrophenol — then hydrolysis gives acetic acid and regenerates the enzyme.”',
 cn:'<b>这是书里唯一写出反应式的催化机制</b>，而且 chymotrypsin 在卡 01 里也出现过（几乎不含 α-helix 的那个例子）。<span class="pg">p062</span>'}
]},

{g:'为什么类', gn:'诱导契合那一段是这题最深的地方，他很可能追。', items:[
{r:'高', q:'Why does induced fit make the reaction faster, rather than just tighter?',
 en:'“Because the fit is achieved by <b>deforming</b> both partners. The enzyme changes conformation, so the complex is thermodynamically unstable and strongly tends to return to the stable form; and the substrate is deformed too. Both mean the binding energy is realised at the transition state rather than in the ground-state complex — Lehninger’s formulation — so the barrier from ES to product is lowered.”',
 cn:'<b>这是书 p062 的完整逻辑，很多人只记住「诱导契合＝更贴合」，那是漏了后半段。</b>后半段才解释了为什么它跟催化有关。'},
{r:'高', q:'If binding were perfect, would catalysis be better?',
 en:'“On that picture, no — the opposite. It follows that if the enzyme were perfectly complementary to the substrate, the complex would be at a stable minimum and there would be nothing driving it forward. What makes it go is that the fitted complex is <b>strained</b>.”',
 cn:'⚠ 「完全互补反而不催化」这个推论<b>书里没有明说</b>，但它是书那段话的直接推论。<b>说成 “on that picture” 或 “it follows that”，别说成书上写的。</b>'},
{r:'中', q:'Why are the active-site residues so far apart in the sequence?',
 en:'“Because the site needs a few side chains held at fixed positions in space, and a contiguous stretch of sequence cannot supply that — the fold does, by bringing residues from different parts of the chain together. The active site is a small region of the <b>tertiary</b> structure — the clearest illustration of why the fold matters. In chymotrypsin the catalytic triad — the three residues that together do the chemistry in the serine proteases — is His57, Asp102 and Ser195: the hydroxyl of Ser195 is the nucleophile that attacks the peptide carbonyl, the imidazole of His57 takes its proton, and the carboxylate of Asp102 holds the imidazole in place and makes it a better base — a hundred residues apart in the sequence, adjacent in the fold.”',
 cn:'<b>接卡 01。</b>如果他继续问「多远算远」，用卡 01 里那条：给判据、给 β-structure 反例、<b>不要编数</b>。'}
]},

{g:'怎么发现的', gn:'书给了年份和人名，可以直接用。', items:[
{r:'中', q:'When was the first enzyme obtained pure?',
 en:'“1926 — urease, crystallised by Sumner. In the nineteen-thirties trypsin, pepsin and chymotrypsin followed. Since then more than three thousand enzymes have been described, though far from all of them have been prepared pure.”',
 cn:'<b>「远非全部都被纯化过」这半句值得说</b>——它是 researcher 的说法：知道「被描述过」和「被纯化过」是两件事。<span class="pg">p041</span>'},
{r:'高', q:'What do you need to know before you can measure an enzyme’s activity?',
 en:'“Four things, in the textbook’s list: the chemical nature of the reaction; a simple method for following the loss of substrate or, better, the gain of product with time; the K m for that substrate, so that the measurement is made at a saturating substrate concentration — there the kinetics is zero order and the rate is proportional only to the enzyme concentration; and the enzyme’s pH optimum and the effect of temperature on it.”',
 cn:'p058。方法题，这位老师的口味。'},
{r:'中', q:'How do you measure how much enzyme you have?',
 en:'“Usually not in grams but in <b>activity</b>. One standard unit, U, is the amount that converts one micromole of substrate per minute under standard conditions — the enzyme’s pH optimum and 25 degrees. In SI the unit is the <b>katal</b>, the amount converting one mole per second — so one katal is 6 × 10⁷ U.”',
 cn:'<b>方法题，这位老师的口味。</b>书还说了测活性前要先知道三件事：反应的化学本质、一个跟踪产物增加的简单方法、以及那个底物的 <b>Km</b>——因为要在<b>饱和浓度</b>下测，那时是零级动力学，速率只反映酶量。<span class="pg">p058</span>'}
]},

{g:'相邻考点', gn:'这一片书装着六道题，走出去很近。', items:[
{r:'高', q:'What are the six classes of enzyme?',
 en:'“Oxidoreductases transfer electrons or hydrogen, or react with oxygen; transferases move a group from a donor to an acceptor; hydrolases split bonds with water; lyases split bonds without water and without oxidation, often making a double bond, or add across one — a lyase running in the addition direction is called a synthase; isomerases rearrange within one molecule; ligases — synthetases — join two molecules at the cost of hydrolysing ATP or another nucleoside triphosphate, systematic name X : Y ligase (ADP-forming). So synthase means no ATP, synthetase means ATP.”',
 cn:'<b>记法</b>：氧化还原 · 搬基团 · 水解 · 不用水地断键或加成 · 异构 · <b>成键并同时水解一个高能化合物</b>（多半是 ATP）。<br>最后一类的系统名格式很特别：<b>X : Y ligase (ADP-forming)</b>。<span class="pg">p041 p042</span>'},
{r:'高', q:'What is temperature optimum and why is there one?',
 en:'“The temperature at which the measured rate is highest. It exists because two processes oppose: raising the temperature speeds the reaction — roughly doubling per 10 degrees — but above a critical point denaturation of the catalyst wins. Most enzymes are inactivated around <b>55 to 60 degrees</b>, though enzymes from thermophilic bacteria are still active at <b>85</b> — and the textbook adds that the value depends on how the experiment is set up.”',
 cn:'<b>书还说了一句很诚实的话</b>：温度最适值<b>取决于实验是怎么安排的</b>——它不是一个物质常数。这一句本身就是 researcher 的说法。<span class="pg">p059</span>'},
{r:'中', q:'What is an isoenzyme?',
 en:'“Enzymically active proteins in the same organism that catalyse the same reaction but differ in physicochemical properties because of genetically determined differences in primary structure — lactate dehydrogenase, a tetramer of two kinds of subunit, H for heart and M for muscle, giving five isoenzymes from H₄ to M₄, is the textbook’s example. Forms differing only by post-translational modification the textbook calls multiple forms, not isoenzymes.”',
 cn:'书 §3.7.3（<span class="pg">p064</span>）。<b>这一节在「书里没有题的七块」里</b>，所以只求眼熟。'},
{r:'高', q:'What is a covalently modulated enzyme?',
 en:'“An enzyme that exists in several forms differing in activity, interconverted by reactions that other enzymes catalyse — so the regulated enzyme is itself a substrate for another enzyme. The textbook’s example is glycogen phosphorylase: form a is active, form b almost inactive, and they interconvert by reversible phosphorylation of a serine hydroxyl in the active site of each subunit — a kinase puts the phosphate on, a specific phosphatase takes it off, and the cascade amplifies the signal. The textbook counts a second, irreversible kind here: proteases made as inactive zymogens, or proenzymes — trypsin, chymotrypsin, pepsin and the clotting enzymes — activated by hydrolytic removal of part of the peptide chain, which exposes the active site.”',
 cn:'p063–p064。'},
{r:'中', q:'And regulatory enzymes?',
 en:'“Two kinds: <b>allosteric</b> enzymes, whose activity is modulated by non-covalent binding of a specific metabolite at a separate <b>allosteric site</b> — often the end product of the pathway the enzyme starts; and <b>covalently modulated</b> enzymes.”',
 cn:'书把<b>不可逆的蛋白水解激活</b>也算在共价调节这一类里（p064「另一类共价调节的酶」），不是第三种——切掉一段肽链把活性中心露出来，典型的是 trypsin、chymotrypsin、pepsin 和凝血相关的酶。<span class="pg">p062 p064</span>'}
]},

 cn:'<b>这个桥是书自己搭的</b>（p062），所以走过去不算跑题。完整的 Kd 内容在<b>卡 02</b>。'}
