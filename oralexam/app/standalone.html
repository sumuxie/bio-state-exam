<script>
/* data/17.js */
/* 卡 17 · What is the role of enzymes in biochemical reactions?
   题库 #17（S3 Biochemistry 4）
   出处 Biochemie OCR p016（多数生化反应只在催化剂存在下进行；E. coli 上千个反应；in vitro）、p017–p018（G 是状态函数、不给速率信息；ΔG° = −RT ln K）、
        p009（年表）、p039–p040（Tab. 2.2：酶是最大最重要的一组，>3000 种）、p041–p043（§3 定义、Sumner 1926、六大类、催化 RNA）、
        p054（§3.3 催化剂定义、活化能、三条路、thermolabilní、Obr. 3.1、两步机制）、p058–p059（温度）、
        p061–p062（专一性、10¹⁴、稀溶液低温中性 pH、邻近效应、§3.7 调控）、p063（反馈抑制）、p116（papain）、p155–p156、p173（α/β、纤维素酶）。
   已回 300 dpi 原图核：p061 ureasa **10¹⁴krát**（OCR 吃了指数）；p054 Obr. 3.1 已看图。 */

window.CARDS.push({
id:'17', n:17, w:1,
q:'What is the role of enzymes in biochemical reactions?',
qcn:'酶在生化反应中起什么作用',
sub:'主干说完约 90 秒 · 三个动词：加速 · 选择 · 可调',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'这题的最短问法是 “What do enzymes do?”。答案从「酶是什么」起步，第二句就说「催化剂是什么」——书里这两个定义各有一处，p041 和 p054。'},
 {n:'01', t:'定义 · 酶',
  big:'酶是<b>专门催化生物体内反应的蛋白质</b>——生物催化剂；两个特点：<b>专一性高</b>、<b>催化效率高</b>',
  en:'“An enzyme is a protein specialised for catalysing the reactions that take place in living organisms — a biological catalyst. Two things characterise it: very high <b>specificity</b>, meaning it acts on one substrate and runs one reaction, and very high <b>catalytic efficiency</b>, meaning the reaction runs enormously faster with it than without it. One qualification: until recently every known enzyme was a protein, but some RNAs also turn out to catalyse.”',
  note:'书给了<b>两个定义</b>：p041 从结构说（<i>proteiny specializované pro katalýzu reakcí</i>），p054 从功能说（<i>katalyzátory chemických reakcí probíhajících v organismech</i>）。合起来才是全定义：<b>是蛋白质，干的是催化</b>。RNA 那个限定书在 p042–p043 自己写了（写书时只有一例）；年表 p009：<b>1985 Cech</b>。<span class="pg">p041 p054 p042 p009</span>'},
 {n:'02', t:'定义 · 催化剂',
  big:'催化剂是<b>暂时和反应物结合</b>、让反应<b>走另一条活化能更低的机制</b>、自己<b>原样回来</b>的物质',
  en:'“A catalyst is a substance that speeds up a reaction by <b>joining the reactants transiently</b>, so that the reaction runs by a <b>different mechanism with a lower activation energy</b> — and comes out of it unchanged, so one molecule of catalyst serves over and over. In organisms the catalyst is the enzyme.”',
  note:'p054 原话：<i>přechodně spojí s reaktanty, takže reakce probíhá jiným mechanismem s nižší aktivační energií</i>。「原样回来」在同页两步机制里：复合物 EA 散开成<b>原来的 E</b>（<i>původní E</i>）和产物。<span class="pg">p054</span>'},
 {n:'03', t:'作用一句话',
  big:'作用 = <b>让代谢反应以有用的速度发生</b>，<b>只让该发生的发生</b>，而且在<b>细胞能活的条件</b>下：稀溶液、低温、中性 pH',
  en:'“So the role of enzymes is three things at once: they make the reactions of metabolism run at a <b>useful rate</b>; they make <b>only the wanted ones</b> run, because each enzyme is specific; and they do it under conditions a cell can survive — the textbook’s phrase is that thanks to enzymes most reactions in the cell run in <b>dilute solution, at low temperature and at neutral pH</b>.”',
  note:'<b>这一句是整题的答案，其余全是它的展开。</b>三个动词各有出处：速度 p054、选择 p061（否则细胞很快被不想要的产物淹没）、条件 p061。第 1 章 p016 的总括：“Most biochemical reactions run only in the presence of catalysts, and those are almost all enzymes.”<span class="pg">p016 p054 p061</span>'},

 {g:'催化在物理上是什么', gn:'这一组回答「催化到底做了什么」。五个点，一张要会画的图。'},
 {n:'04', t:'活化能',
  big:'反应物要变成产物，得先<b>翻过一道能量坎</b>；翻坎需要的能量叫<b>活化能</b>',
  en:'“For a substance A to become product X, the molecules of A must first get over an <b>energy barrier</b> — they have to be supplied with the <b>activation energy</b>. It is the energy needed to reach the top of the barrier: the <b>transition state</b>, the arrangement of the atoms in which the old bonds are half broken and the new ones half formed — that term is general; the textbook only names the barrier.”',
  note:'p054 原话：<i>musí … překonat energetickou bariéru, musí jim být dodána tzv. aktivační energie</i>。「过渡态」<b>书里没有</b>（全书 grep 无），书只叫它「能量坎」。承重名词交代了：不懂活化能，「降低活化能」是空话。<span class="pg">p054</span>'},
 {n:'05', t:'三条加速的路',
  big:'加速反应有三条路：<b>加热</b> · <b>催化</b> · <b>光</b>——生物只能走中间那条，因为<b>生物是热不稳定的</b>',
  en:'“There are three ways to make a reaction go faster. <b>Heat</b> the system: the molecules gain energy and more of them can get over the barrier. Organisms cannot use that route, because they are mostly <b>thermolabile</b> — built of proteins and membranes that heat destroys. The second way is <b>catalysis</b>. The third is <b>light</b>: exciting the reactant molecules with radiation — but then the reaction usually runs along a different reaction coordinate altogether.”',
  note:'三条路全是 p054 的，顺序也是书的。<b>“thermolabile” 这个词要说出口</b>——书给的、一个词就够的理由。「热坏的是蛋白质和膜」是我加的解释（变性见卡 01）。光那条路书没给例子。<span class="pg">p054</span>'},
 {n:'06', t:'两步机制',
  big:'最简单的酶反应也分<b>两步</b>：E + A ⇌ EA（<b>快、可逆、弱相互作用</b>）→ E + X（<b>慢、不可逆</b>）',
  en:'“Even the simplest enzyme reaction runs in two steps. First the substrate joins the enzyme into the <b>enzyme–substrate complex</b> — that step is fast and reversible, and the two are held together by weak, non-covalent interactions. Then the actual chemical change happens: the complex breaks down into the <b>original enzyme</b> and the product — slower, and irreversible.”',
  note:'p054 §3.3.1 原话。<b>「原来的酶」是「酶不被消耗」的书内出处。</b>这两步是卡 02 的 Km 来源（k₁、k₋₁、k₂），也是你主场的分界线：<b>第一步是结合，第二步才是催化</b>。<span class="pg">p054</span>'},
 {n:'07', t:'图 · 他可能让你画',
  big:'<b>Obr. 3.1 能量图</b>：两条曲线，<b>同一个起点和终点</b>，只有<b>坎的高度</b>不同',
  en:'“On an energy diagram the uncatalysed reaction is one big hump between reactant A and product P. The catalysed one is a lower path with a dip in the middle — the transient complex of A with the catalyst — and two small humps. Both curves start at A and end at P at the same heights, so the energy difference between reactant and product is the same; only the barrier changes.”',
  note:'<b>画的顺序</b>（照 p054 Obr. 3.1，已看原图）：① 横轴 reaction coordinate，纵轴 energy。② 左边点 A（反应物），右边点 P（产物），<b>P 比 A 低</b>。③ 曲线 2（不催化，实线）：A 到 P 一个大鼓包，顶到 A 的高度差标 <b>E₂</b>。④ 曲线 1（催化，虚线）：从 A 先一个小鼓包（标 <b>E₁</b>），然后<b>掉进一个比 A 还低的坑</b>，坑底标 <b>AK</b>（A 与催化剂 K 的复合物），再一个小鼓包，然后下到 P。⑤ 图例：A · AK · P · E₁、E₂ 活化能。<br>他问坑为什么比 A 低：“The well below A means the complex is more stable than free A — binding is downhill — and the two small humps are the two steps of the textbook’s mechanism: binding, then the chemical step.”<span class="pg">p054</span>'},
 {n:'08', t:'速率变，平衡不变',
  big:'催化剂改的是<b>速率</b>，不是<b>平衡</b>——热力学没动，动力学动了',
  en:'“A catalyst changes how fast equilibrium is reached, not where it lies. The grounds are in the textbook’s first chapter: Gibbs energy is a state function, so its change does not depend on the path taken, and it gives <b>no information about rate</b> — rate is decided by the mechanism. A catalyst changes only the mechanism, the path. So the free-energy change and the equilibrium constant are untouched, and both directions are accelerated equally. The energy diagram shows it: the two curves share their start and end points.”',
  note:'⚠ <b>书没有把「催化剂不改变平衡」写成一句话</b>——这是 p017（<i>Gibbsova energie … nedává žádné informace o rychlosti … rozhodující je konkrétní mechanismus</i>）加 p054（催化剂换机制）接出来的。说 “it follows from”，不说 “the textbook says”。<b>「正反两个方向一样加速」是通用推论</b>，书里没有。ΔG° = −RT ln K 在 p018。<span class="pg">p017 p018 p054</span>'},
 {n:'09', t:'效率',
  big:'有多快：<b>urease 把尿素水解加速 10¹⁴ 倍</b>（相对于 H⁺ 催化）——所以细胞里的反应能在<b>稀溶液、低温、中性 pH</b> 下进行',
  en:'“How efficient: the textbook’s example is urease, which speeds up the hydrolysis of urea <b>ten to the fourteenth</b> times compared with catalysis by hydrogen ions. That is what the efficiency is for: because of enzymes, most reactions in the cell run in dilute solution, at low temperature and at neutral pH — conditions under which, without a catalyst, they would practically not run at all.”',
  note:'<b>10¹⁴ 已回 300 dpi 原图核过</b>（OCR 出来是「10krát」；卡 18 写时还标着待核，现在是书的数）。书的比较对象是<b>氢离子催化</b>，不是不催化的水解——Lehninger 的 10¹⁴ 是对不催化说的。按书说。<b>后半句比数字重要</b>：效率的意义是快到能在细胞的条件下用。<span class="pg">p061</span>'},

 {g:'酶跟普通催化剂差在哪', gn:'「biochemical」这个限定词就是这一组。铂、H⁺ 也是催化剂；酶多出来的是三样：专一、温和、可调。'},
 {n:'10', t:'专一性',
  big:'<b>底物专一性</b>（只认一种底物）＋ <b>作用专一性</b>（只跑一种反应）；否则<b>细胞很快被不想要的产物淹没</b>',
  en:'“Specificity has two sides: <b>substrate specificity</b> — the enzyme converts only a particular substrate — and <b>specificity of action</b> — it converts it by only one reaction. The textbook gives the reason the cell needs it: if it were not so, the cell would very quickly be flooded with unwanted products. The degree varies — some enzymes are practically absolute and will not touch a molecule very similar to the substrate, others attack a whole class sharing one structural feature — and most are stereospecific.”',
  note:'p061 原话。<b>「酶 vs 化学催化剂」的第一个差别</b>：H⁺ 催化一切能水解的键，urease 只水解尿素。专一性从哪来是卡 18 活性中心那一段。<span class="pg">p061</span>'},
 {n:'11', t:'酶的清单就是细胞的化学',
  big:'细胞里<b>上千个反应</b>要协调；37 °C 下<b>没有酶的反应等于不发生</b>——所以<b>细胞做哪些酶，就决定了哪些反应发生</b>',
  en:'“Even a bacterium like E. coli needs more than a thousand chemical reactions running in a coordinated way — the textbook’s number. At body temperature and neutral pH the uncatalysed versions are so slow that, in effect, a reaction happens only if the cell has an enzyme for it. So the set of enzymes a cell makes decides which of all the thermodynamically possible reactions actually take place — that last sentence is my inference from the textbook’s two facts, not its wording.”',
  note:'「上千个反应」p016。「没有酶等于不发生」是从 p054 和 p061 推出来的，<b>书没有这句</b>，说成 “in effect”。<span class="pg">p016</span>'},
 {n:'12', t:'可调控',
  big:'酶<b>能被调</b>：pH、底物和辅酶浓度、抑制剂和激活剂；调节酶分<b>别构</b>和<b>共价修饰</b>两种；典型是<b>反馈抑制</b>',
  en:'“The third difference from a chemical catalyst is that an enzyme can be <b>regulated</b>. The textbook lists what the cell can use: pH, the concentration of substrate or coenzyme, the presence of an inhibitor or an activator. On top of that there are regulatory enzymes — <b>allosteric</b> ones, modulated by a metabolite binding at a separate site, and <b>covalently modulated</b> ones, switched by another enzyme — and the classic pattern is feedback inhibition: the end product of a pathway inhibits its first enzyme. A platinum surface cannot be switched off by its own product.”',
  note:'p062 §3.7 和 p063 反馈抑制。<b>这一条把「作用」从化学升到生物学</b>：酶不只是加速器，是<b>开关</b>。铂那半句是我的对比。展开在卡 19 和 #32。<span class="pg">p062 p063</span>'},
 {n:'13', t:'温度',
  big:'速率<b>每升 10 °C 约翻一倍</b>；过了临界温度<b>变性占上风</b>——多数酶 <b>55–60 °C</b> 失活，嗜热菌的酶 <b>85 °C</b> 还活着',
  en:'“Temperature works on an enzyme reaction the way it works on any reaction — the rate roughly doubles for every ten degrees — until a critical temperature, above which thermal denaturation of the protein wins and the rate falls. Most enzymes are inactivated around 55 to 60 degrees; some, mostly from thermophilic bacteria, are still active at 85. So the temperature optimum is the result of two opposing processes, and its value depends on how the experiment is set up.”',
  note:'p058–p059 原话。<b>thermolabile 那个词的兑现</b>：生物不能用加热，因为催化剂本身是蛋白质。85 °C 那半句直接接 Taq（#5）。<span class="pg">p058 p059</span>'},

 {g:'归类与历史', gn:'眼熟即可。六大类的细节在卡 18，这里只留一句正面定义。'},
 {n:'14', t:'六大类',
  big:'按<b>催化的反应类型</b>分六大类：oxidoreductases · transferases · hydrolases · lyases · isomerases · ligases；每个酶有<b>系统名、常用名、EC 号</b>',
  en:'“Enzymes are classified into six main classes by the reaction they catalyse: oxidoreductases, transferases, hydrolases, lyases, isomerases and ligases. Each enzyme has a systematic name describing the reaction, a recommended name for everyday use, and a code number — lactate dehydrogenase is E.C. 1.1.1.27, systematic name L-lactate:NAD⁺ oxidoreductase.”',
  note:'p041–p042。<b>每类一句、synthase 与 synthetase、EC 四个数字，都在卡 18 的追问里</b>，这里不重复。<span class="pg">p041 p042</span>'},
 {n:'15', t:'在蛋白质功能表里的位置',
  big:'在书的<b>蛋白质功能表</b>里，酶是<b>最大、最重要的一组</b>；已知<b>超过 3000 种</b>；第二大组是结构蛋白',
  en:'“In the textbook’s table of protein functions, enzymes are the largest and most important group; more than three thousand different enzymes are known. The second main group are the structural proteins. The table’s own examples: ribonuclease hydrolyses RNA, trypsin hydrolyses the peptide bond, cytochrome c transfers electrons, snake-venom enzymes hydrolyse phospholipids.”',
  note:'Tab. 2.2 p039–p040。<b>这一条是题库标的书页出处</b>（p039–p042），也是 #29 的一行。<span class="pg">p039 p040</span>'},
 {n:'16', t:'怎么发现的',
  big:'<b>1833 Payen</b> 第一个酶（amylase）· <b>1893 Ostwald</b> 酶是催化剂 · <b>1897 Buchner</b> 无细胞发酵 · <b>1926 Sumner</b> 结晶 urease · 30 年代 trypsin、pepsin、chymotrypsin · <b>1985 Cech</b> RNA 有酶活性',
  en:'“The textbook’s timeline: the first enzyme isolated was amylase, Payen, 1833. Ostwald proved in 1893 that enzymes are catalysts, and Buchner in 1897 that fermentation is a chemical process — it runs in a yeast extract with no living cell. Harden and Young found the first coenzyme, NAD, in 1905. The first enzyme obtained as crystals was urease, Sumner, 1926 — which settled that an enzyme is a protein — and in the thirties trypsin, pepsin and chymotrypsin followed. In 1985 Cech found enzymatic activity in RNA.”',
  note:'年份全在 p009 Tab. 1.1，Sumner p041 又写了一遍。<b>「结晶 ＝ 证明是蛋白质」和「无细胞」是通用史实</b>，书只写「第一个结晶态的酶」「证明发酵是化学过程」。<span class="pg">p009 p041</span>'},

 {g:'收尾', gn:'一句停住，一句伸出去。'},
 {n:'17', t:'停止句',
  big:'再往下，<b>坎的高度怎么变成速率常数</b>是物理化学',
  en:'“Below that — how a given barrier height turns into a rate constant, through collision frequency and the fraction of molecules with enough energy — is physical chemistry rather than biochemistry.”',
  note:'落在<b>动力学</b>这块地基上。「动力学是什么」那句定义在卡 02 的追问里，32 张卡共用。'},
 {n:'18', t:'留口子',
  big:'酶是蛋白质，所以<b>能被突变和筛选</b>——<b>做酶工程就是在改那道坎的高度</b>；而我在 yeast display 上量的<b>只是第一步</b>',
  en:'“Where this meets my own work: because an enzyme is a protein, it can be mutated and selected — that is directed evolution — and what selection acts on is the height of the barrier. The textbook’s two-step mechanism says binding and the chemical step are separable, so they can be improved separately. With yeast display I measure only the first step — binding, as a dissociation constant, with no turnover involved. Binding is necessary for catalysis but it is not the same thing.”',
  note:'<b>口子落在两处</b>：directed evolution（#7）和 Kd（卡 02）。他追「第二步怎么测」，答活性测定——p058，在卡 18 的追问里。'}
],
end:'<b>这题的骨架是三个动词：加速、选择、可调。</b>加速是化学（p054），选择和可调是生物学（p061、p062）。「biochemical」这个限定词问的正是后两个——只答「降低活化能」等于只答了化学那一半。',

segs:[
 {tag:'段 1 · 定义', h:'两个定义，先「是什么」再「干什么」',
  p:['“An enzyme is a protein specialised for catalysing the reactions that take place in living organisms — a biological catalyst. Two properties define it: very high <b>specificity</b> and very high <b>catalytic efficiency</b>. One qualification: until recently every known enzyme was a protein, but some RNAs also catalyse.',
     'A catalyst is a substance that speeds up a reaction by joining the reactants <b>transiently</b>, so that the reaction runs by a different mechanism with a <b>lower activation energy</b> — and comes out unchanged. The activation energy is the energy the reactant molecules must be supplied with to get over the barrier between reactant and product.”'],
  note:'<b>两个定义两处出处</b>（p041、p054），主动把 RNA 的限定说了。「活化能」在第一屏就交代，因为它承重。'},
 {tag:'段 2 · general', h:'催化做了什么：三条路、两步、一张图、一句热力学',
  p:['“So what does catalysis do. There are three ways to make a reaction go faster: heat, catalysis, or light. Organisms cannot use heat, because they are mostly <b>thermolabile</b>; light usually sends the reaction along a different coordinate. That leaves catalysis.',
     'The enzyme joins the substrate transiently — the <b>enzyme–substrate complex</b>, formed fast and reversibly through weak interactions — and then the complex breaks down into the original enzyme and the product, the slower step. On the energy diagram that is a lower path with a dip in the middle, and the same start and end points as the uncatalysed reaction.',
     'That is the point to make out loud: a catalyst changes the <b>rate</b>, not the <b>equilibrium</b>. Gibbs energy is a state function and says nothing about rate; the catalyst changes only the path.”'],
  note:'<b>「速率不是平衡」这句要自己说出来</b>，别等他问。它是全卡最容易被追的地方，而书 p017 已经把地基给了。'},
 {tag:'段 3 · 稍展开', h:'酶跟铂、跟 H⁺ 差在哪——「biochemical」那一半',
  p:['“What makes an enzyme different from hydrogen ions or a platinum surface is three things, and they are the biological half of the answer.',
     'First, <b>specificity</b>: substrate specificity and specificity of action — otherwise, the textbook says, the cell would very quickly be flooded with unwanted products.',
     'Second, <b>efficiency under mild conditions</b>: urease accelerates urea hydrolysis ten to the fourteenth times over hydrogen-ion catalysis, and because of that most reactions in the cell run in dilute solution, at low temperature and at neutral pH.',
     'Third, <b>regulation</b>: pH, substrate and coenzyme concentration, inhibitors and activators, and the regulatory enzymes — allosteric and covalently modulated — with feedback inhibition as the classic pattern.',
     'So the role of enzymes is to make the reactions of metabolism run at a useful rate, only the wanted ones, and under control. They are classified into six classes by the reaction they catalyse — oxidoreductases, transferases, hydrolases, lyases, isomerases, ligases.”'],
  note:'<b>三个差别对应三个动词。</b>六大类一句带过就够——他要细节，卡 18 有。'},
 {tag:'段 4 · 留口子', h:'酶是蛋白质，所以能被工程；而我量的只是第一步',
  p:['“Where this meets my own work: because an enzyme is a protein, it can be mutated and selected — that is directed evolution — and what selection acts on is the height of the barrier. The textbook’s two-step mechanism says binding and the chemical step are separable, so they can be improved separately.',
     'With yeast display I measure only the first step — binding, as a dissociation constant, with no turnover involved. Binding is necessary for catalysis but it is not the same thing: a molecule that binds and is not converted is an inhibitor.”'],
  note:'<b>两个口子都在你的地盘</b>：directed evolution（#7）和 Kd（卡 02）。他追「第二步怎么量」，答活性测定（p058，卡 18 追问里有）。'}
],

recog:[
{q:'What is an enzyme?',
 mean:'正面定义，两处出处合成一句。<b>先「是什么」，再两个特点，再限定词。</b>',
 say:'“A protein specialised for catalysing the reactions that take place in living organisms — functionally, a catalyst of the chemical reactions of organisms. Two properties define it: very high specificity and very high catalytic efficiency. One qualification: until recently all known enzymes were proteins, but some RNAs also catalyse.”'},

{q:'What do enzymes do?',
 mean:'<b>他真正会说的短句。</b>答案自带结构：是什么 → 催化剂做什么 → 三个动词 → 为什么是生物学。',
 say:'“Enzymes catalyse the reactions of living organisms — they are proteins that join the reactants transiently and take the reaction through a different mechanism with a lower activation energy, and come out unchanged. Their role is three things: they make the reactions of metabolism run at a useful rate; because each is specific, they make only the wanted reactions run; and they do it under conditions a cell can survive — dilute solution, low temperature, neutral pH — and under control, since they can be regulated.”'},

{q:'What is a catalyst?',
 mean:'<b>全卡最承重的名词。</b>一句：做什么、怎么做、自己怎么样。',
 say:'“A substance that speeds up a chemical reaction by joining the reactants transiently, so that the reaction runs by a different mechanism with a lower activation energy — and is returned unchanged at the end, so it is not used up. It changes the rate, not the equilibrium. In organisms the catalysts are the enzymes.”'},

{q:'What is the role of enzymes in biochemical reactions?',
 mean:'卷面原题。<b>「role」这个词要三个动词答</b>，不是一个；「biochemical」要答酶比普通催化剂多出来的东西。',
 say:'“Three roles. Rate: they make the reactions of metabolism run fast enough to be useful at body temperature — urease, the textbook’s example, by a factor of ten to the fourteenth. Selection: each enzyme is specific for one substrate and one reaction, so only the wanted reactions run — otherwise the cell would be flooded with unwanted products. Control: an enzyme can be regulated — by pH, by substrate and coenzyme concentration, by inhibitors and activators, and by feedback from the pathway’s own end product. A chemical catalyst gives you only the first.”'},

{q:'Is an enzyme different from an ordinary chemical catalyst?',
 mean:'<b>「biochemical」这个限定词的正面问法。</b>先说相同，再说三个不同。',
 say:'“In what it does to the barrier, no — both lower the activation energy by offering a different mechanism, and neither changes the equilibrium. In three other things, yes. An enzyme is specific — one substrate, one reaction — where hydrogen ions catalyse every hydrolysable bond. It works in dilute solution at low temperature and neutral pH, where a chemical catalyst usually needs heat or strong acid. And it can be regulated — switched down by its own pathway’s product — which no platinum surface can do.”'},

{q:'Do enzymes provide the energy for a reaction?',
 mean:'<b>陷阱。</b>答「是」就错了。而且它连着第二个陷阱：「不会发生」有两个意思——太慢，和热力学禁止。',
 say:'“No. An enzyme lowers the barrier; it does not supply energy. The energy that carries molecules over the barrier is their own thermal energy, and the energy balance of the reaction — reactant to product — is set by Gibbs energy, which no catalyst can touch. So an enzyme makes a slow downhill reaction fast; it cannot make an uphill one go. The cell handles uphill steps by coupling them to a downhill one — usually the hydrolysis of ATP — and the enzyme, a ligase in the textbook’s classification when a bond is made at the cost of ATP, is what physically couples the two.”',
 tail:'耦合在 p017（吸能反应能进行，只要同时有放能反应且总 ΔG < 0）；ligases「成键并同时水解 ATP」在 p042。<span class="pg">p017 p042</span>'},

{q:'Why does meat tenderiser work?', odd:1,
 mean:'问的是<b>水解酶的作用</b>——蛋白酶在厨房条件下切肽键。',
 say:'“Because it is a protease — papain from papaya, which the textbook lists among the cysteine proteases — an enzyme that hydrolyses peptide bonds, the bonds between the amino acids in the meat’s proteins, especially the connective-tissue protein collagen. It does at room temperature, in a dilute, near-neutral solution, what your own trypsin and pepsin do in the gut — and that is the point about efficiency: without an enzyme, peptide-bond hydrolysis under those conditions is practically nil.”',
 tail:'papain p116（Tab. 5.1：papaya，pH 8，切 Lys、Phe 之后）；collagen 是结缔组织成分 p040。<b>「嫩不嫩主要看 collagen」是通用说法，书里没有。</b><span class="pg">p116 p040</span>'},

{q:'Why does hydrogen peroxide fizz on a cut?', odd:1,
 mean:'问的是<b>催化剂让一个本来就下坡的反应跑起来</b>。',
 say:'“Because blood and tissue contain catalase — an enzyme the textbook does not discuss — which decomposes hydrogen peroxide into water and oxygen; the fizz is oxygen gas. Hydrogen peroxide is thermodynamically unstable, but on its own it decomposes slowly; the enzyme lowers the barrier so it goes in seconds. A catalyst accelerating a reaction that was always downhill — the textbook’s definition in one bottle.”',
 tail:'⚠ catalase <b>书里没有</b>（全书 grep 无）；说的时候标 “not in the textbook”。'},

{q:'Why can we digest starch but not cellulose?', odd:1,
 mean:'问的是<b>专一性</b>——同一个单体，一个键的立体化学不同，就没有酶。',
 say:'“Because we have no enzyme for it. Starch and cellulose are both chains of glucose; the difference is the geometry of the link — alpha in starch, the textbook’s maltose is 4-O-alpha-D-glucopyranosyl-D-glucose, beta in cellulose, cellobiose is the 4-O-beta isomer — and our amylases are specific for the alpha link. The textbook says cellulases occur mainly in microorganisms and rarely in animals, and that when cellulose is digested as food it is practically always by microflora, the rumen being its example. That is specificity in one sentence: same monomer, one bond geometry different, no enzyme, no reaction at 37 degrees.”',
 tail:'<span class="pg">p155 p156 p173</span>'},

{q:'Why do we keep food in the fridge?', odd:1,
 mean:'问的是<b>温度对酶反应速率的影响</b>，而且是可逆的那一侧。',
 say:'“Because cooling slows every reaction, enzyme reactions included — the textbook’s rule is that the rate roughly doubles per ten degrees, so from room temperature to four degrees is about a threefold slowing. The enzymes being slowed are those of the food itself and of the microbes on it. Cold does not denature; it is reversible — which is why spoiling resumes when the food warms up. Freezing takes the same principle further.”',
 tail:'每 10 °C 两倍在 <span class="pg">p058</span>；「三倍」是按书的规则算的（20 → 4 °C 差 16 度，2^1.6 ≈ 3），不是书的数。'},

{q:'Does a fever cook your enzymes?', odd:1,
 mean:'<b>用书的数字打一个常见说法。</b>',
 say:'“Not at the temperatures a fever reaches. The textbook gives two numbers: the rate rises about twofold per ten degrees, and most enzymes are inactivated around 55 to 60 degrees. A fever of 39 or 40 is a few degrees above 37, so enzyme rates change by tens of percent and nothing is anywhere near denaturing. So on the textbook’s numbers, no — what a fever does for or against you is physiology, and not in the book.”',
 tail:'<span class="pg">p058 p059</span>'},

{q:'Why do washing powders contain enzymes?', odd:1,
 mean:'问的是 p061 那句话本身：<b>稀溶液、低温、中性 pH</b>。',
 say:'“Because the stains are biological polymers — protein, fat, starch — and the enzymes in the powder — proteases, lipases, amylases; detergents are not in the textbook — hydrolyse them at thirty or forty degrees in dilute solution. That is exactly the property the textbook attributes to enzymes: reactions in dilute solution, at low temperature, at neutral pH. Without an enzyme you would need boiling and strong acid or base — the heating route organisms cannot use, and your clothes would not like it either.”'},

{q:'Does an enzyme need a living cell to work?', odd:1,
 mean:'问的是 <b>Buchner 1897</b>，也是「生化为什么能在试管里做」。',
 say:'“No. Buchner showed in 1897 that fermentation is a chemical process — a yeast extract with no living cells converts sugar to alcohol; the textbook’s timeline entry is ‘proof of the chemical nature of fermentation’. That is what makes enzymes biochemistry rather than biology: they can be taken out of the cell and studied in a test tube — in vitro, the reductionist approach the textbook describes in its first chapter.”',
 tail:'年表 <span class="pg">p009</span>；in vitro 与还原论 <span class="pg">p016</span>。「无细胞提取液」是对年表那一行的通用解释。'}
],

/* ---------------- 追问 ---------------- */
ask:[
{g:'定义类', gn:'这题的词都是最基本的，所以最容易被当成「不用解释」——正是要查的地方。', items:[
{r:'高', q:'What is catalysis?',
 en:'“Catalysis is the acceleration of a reaction by a substance that takes part in it transiently and is regenerated — the catalyst joins the reactants, the reaction runs by a different mechanism with a lower activation energy, and the catalyst comes out unchanged. It is one of the textbook’s three ways of speeding a reaction, next to heat and light, and the only one organisms can use.”',
 cn:'p054。'},
{r:'高', q:'What is activation energy?',
 en:'“The energy the reactant molecules must be supplied with to get over the barrier between reactant and product — the textbook’s words. On the energy diagram it is the height of the hump above the starting level; the horizontal axis, the reaction coordinate, tracks how far the old bonds have stretched and the new ones formed. Heat supplies the activation energy by raising the molecules’ energy; a catalyst lowers it by offering a different path.”',
 cn:'p054 Obr. 3.1：E₂ 不催化，E₁ 催化。「reaction coordinate」书在光那条路里用了：光激发后反应通常走<b>另一条反应坐标</b>——另一条路，不只是同一条路上矮一点的坎。'},
{r:'高', q:'What is the transition state?',
 en:'“The highest-energy arrangement along the path from reactant to product — old bonds half broken, new bonds half formed. The energy needed to reach it is the activation energy. The term is general; the textbook speaks only of the energy barrier. Lehninger’s way of saying what an enzyme does is that its active site is complementary to the transition state and binds it more tightly than the substrate — the textbook’s way is that the reaction runs by a different mechanism.”',
 cn:'<b>书里没有这个词</b>。书和 Lehninger 的说法不矛盾，是同一件事的两种描述——说的时候把两种都点名。'},
{r:'高', q:'What is a substrate? And a product?',
 en:'“The substrate is the reactant the enzyme acts on — the molecule that binds the enzyme and is converted; the textbook writes it A. The product is what comes out — the textbook writes it X. Between them sits the enzyme–substrate complex, EA, which breaks down into product and the original enzyme.”',
 cn:'p054 §3.3.1 用的字母是 A 和 X，不是 S 和 P——他用哪套都要认得出来。'},
{r:'高', q:'What is the difference between the rate of a reaction and its equilibrium?',
 en:'“Equilibrium is where the reaction ends up — the ratio of product to reactant that stops changing once the forward and the reverse rate are equal; it is set by the Gibbs-energy change, delta G naught equals minus R T ln K, and belongs to thermodynamics. Rate is how fast it gets there — set by the mechanism and the barrier, and belonging to kinetics. The textbook says Gibbs energy gives no information about rate. An enzyme changes only the rate.”',
 cn:'p017、p018。<b>「热力学 / 动力学」两块地基的分界线，32 张卡共用</b>；完整版在卡 02 的追问里。'},
{r:'高', q:'What is specificity?',
 en:'“Specificity means the enzyme discriminates: it converts only a particular substrate — substrate specificity — and converts it by only one reaction — specificity of action. It comes from the active site, a few side chains arranged in the tertiary structure so that only one substrate fits; the full story is card 18.”',
 cn:'p061。'},
{r:'中', q:'What does thermolabile mean?',
 en:'“Destroyed by heat. The textbook’s reason organisms cannot speed their reactions by heating is that they are mostly thermolabile — their catalysts are proteins, and above a critical temperature thermal denaturation of the protein wins over the rate increase; most enzymes are inactivated around 55 to 60 degrees. Denaturation means the fold comes apart while the chain stays intact — the weak interactions that hold the tertiary structure break, and with them the active site.”',
 cn:'p054、p058–p059。变性的定义在卡 01。'},
{r:'中', q:'What is molecular activity — the turnover number?',
 en:'“The number of substrate molecules one enzyme molecule converts per unit time — the textbook’s measure of an enzyme’s catalytic capacity, defined per minute; the general k cat is per second. It comes from V max and the molar mass of the enzyme.”',
 cn:'p058。报数之前先说清按分钟还是按秒——卡 02 也有这条。'},
{r:'中', q:'What is a biochemical reaction — is it different from a chemical one?',
 en:'“Not in its laws — the same thermodynamics and the same kinetics. What is different is the conditions and the catalyst: a biochemical reaction runs in water, in dilute solution, at low temperature and near-neutral pH, and almost always in the presence of an enzyme — the textbook says most biochemical reactions run only in the presence of catalysts, nearly all of them enzymes.”',
 cn:'p016、p061。「biochemical」这个限定词的正面定义。'}
]},

{g:'为什么类', gn:'卡上给了结论没给理由的地方。', items:[
{r:'高', q:'Why does a lower barrier make the reaction faster?',
 en:'“Because at a given temperature only the fraction of molecules with energy above the barrier can react, and that fraction falls off steeply with barrier height. The textbook says it for heat — raising the temperature raises the molecules’ energy and their ability to get over the barrier; lowering the barrier does the same thing from the other side, at constant temperature. How steeply — the exponential — is physical chemistry.”',
 cn:'书只给了加热那一半（p054）；「指数」是通用。停止句就在句尾。'},
{r:'高', q:'Why does a catalyst accelerate both directions equally?',
 en:'“Because forward and reverse reaction cross the same barrier from opposite sides. Lower the hump and both descents get easier by the same amount, so the ratio of the two rates — which is the equilibrium constant — does not move. That is the kinetic way of saying what Gibbs energy says thermodynamically: the endpoints are fixed, only the path changed.”',
 cn:'<b>通用推论，书里没有。</b>但它是 p017（G 是状态函数）的动力学版本，两个说法互相支撑。'},
{r:'高', q:'Why must the enzyme come out unchanged?',
 en:'“Because otherwise it would be a reagent, not a catalyst — used up one molecule per reaction, so the cell would need as much enzyme as substrate. The textbook’s mechanism has the complex breaking down into the original enzyme and the product, and that regeneration is what lets one enzyme molecule turn over thousands of substrate molecules — the molecular activity. Enzymes do wear out, but by denaturation, not by the reaction they catalyse.”',
 cn:'p054「původní E」；「磨损靠变性」是通用。'},
{r:'高', q:'Why does the cell need specificity — why not just make more of everything?',
 en:'“Because a non-specific catalyst would run every reaction its substrates could undergo, and the textbook says what follows: the cell would very quickly be flooded with unwanted products. Specificity is what turns a bag of a thousand reactions into pathways — each step feeding the next and nothing else — and feedback regulation then keeps a pathway from making more than is needed, which the textbook says minimises the demand for carbon, nitrogen and energy.”',
 cn:'p061（淹没）、p063（反馈抑制节省 C、N、能量）。'},
{r:'中', q:'Why is dilute solution the point — why not just concentrate the reactants?',
 en:'“Because a cell is a dilute solution of thousands of different things and cannot concentrate each pair separately. The enzyme does it locally: the textbook says an enzyme reaction is not really a reaction in solution — it happens in the confined space of the active site, where the substrates are not only concentrated but correctly oriented. The proximity effect is the textbook’s name for it.”',
 cn:'p061–p062。'}
]},

{g:'怎么发现的', gn:'书给了年表，人名年份可以直接用。', items:[
{r:'中', q:'How was it shown that an enzyme is a protein?',
 en:'“By crystallising one. Sumner obtained urease as crystals in 1926 — the first enzyme in the crystalline state, the textbook says — and crystals mean a pure, defined substance, and the substance was protein. In the thirties trypsin, pepsin and chymotrypsin followed. Before that, Ostwald had shown in 1893 that enzymes are catalysts, and Buchner in 1897 that fermentation is a chemical process — a catalyst you can take out of the cell. The textbook adds that of the more than three thousand enzymes described since, far from all have been prepared pure.”',
 cn:'p041、p009。「结晶 ＝ 纯物质 ＝ 蛋白质」这个推理是通用史实，书只说「第一个结晶态的酶」。'},
{r:'中', q:'When was it found that RNA can be an enzyme?',
 en:'“1985, Cech, in the textbook’s timeline — the discovery of enzymatic activity in RNA. The enzyme chapter, written when only one case was described, says some other macromolecules may have catalytic ability; today several ribozymes are standard, the peptidyl transferase of the ribosome among them. The textbook also uses the idea in its origin-of-life section: the first self-reproducing molecules may have been RNAs with some catalytic activity.”',
 cn:'p009、p042–p043、p019。'}
]},

{g:'陷阱', gn:'这题的陷阱全是「一句听起来很对的话」。', items:[
{r:'高', q:'（陷阱）Enzymes supply the energy',
 en:'“No — they lower the barrier. The energy balance is Gibbs energy, which no catalyst touches; an uphill reaction goes only by coupling to ATP.”',
 cn:'见识别表那一条。p017 耦合、p042 ligases。'},
{r:'高', q:'（陷阱）Enzymes shift the equilibrium',
 en:'“No — the same equilibrium constant, reached faster. Both directions are accelerated equally.”',
 cn:'p017：G 是状态函数，不给速率信息。'},
{r:'高', q:'（陷阱）Enzymes are consumed',
 en:'“No — the complex breaks down into the original enzyme and the product; one molecule turns over many.”',
 cn:'p054「původní E」。'},
{r:'高', q:'（陷阱）Every enzyme is a protein',
 en:'“Nearly — but the textbook itself says some other macromolecules have catalytic ability, and Cech’s 1985 discovery of catalytic RNA is in its timeline.”',
 cn:'p042–p043、p009。'},
{r:'中', q:'（陷阱）10¹⁴ over the uncatalysed reaction',
 en:'“The textbook’s ten to the fourteenth for urease is against catalysis by hydrogen ions, not against the uncatalysed hydrolysis.”',
 cn:'p061 原图核过。Lehninger 的同一个数是对不催化说的——按书说。'}
]},

{g:'相邻考点', gn:'这一片书装着六道题，走出去很近。', items:[
{r:'高', q:'→ Where does specificity come from? (卡 18)',
 en:'“From the active site — a few side chains arranged in the tertiary structure so that only one substrate fits and only one bond is presented to the catalytic groups; the textbook’s induced-fit picture adds that only the true substrate can force the enzyme into its catalytic conformation.”',
 cn:'卡 18 的活性中心和诱导契合。'},
{r:'高', q:'→ What happens when something binds but is not converted? (卡 19)',
 en:'“It is an inhibitor. The textbook says it on its induced-fit page: molecules that bind but cannot trigger the conformational change act as inhibitors — malonate on succinate dehydrogenase is its example.”',
 cn:'卡 19。'},
{r:'高', q:'→ Where do K m and V max come from? (卡 02)',
 en:'“From the two-step mechanism on this card: binding fast and reversible, the chemical step slower. Steady state on the complex gives v equals V max times substrate over K m plus substrate, with K m equal to k minus one plus k two over k one — which is why K m is an affinity only when the catalytic step is slow.”',
 cn:'卡 02 装着 #4、#20、#21；Km ≠ Kd 那个陷阱也在那里（BOOK_ERRATA 第 5 条）。'},
{r:'中', q:'→ How is metabolism regulated? (#32)',
 en:'“Largely through enzymes: allosteric enzymes modulated by a metabolite at a separate site, covalently modulated enzymes switched by phosphorylation, and feedback inhibition of the first enzyme of a pathway by its end product.”',
 cn:'p062–p063。'}
]},

{g:'桥回主场', gn:'三个桥，每一个都是书搭的。', items:[
{r:'高', q:'You do directed evolution on proteins — what is actually being selected?',
 en:'“For an enzyme, the height of the barrier. A variant that stabilises the transition state a little more runs faster — k cat over K m — and that is what the selection reads. The textbook’s two-step mechanism says the binding step and the chemical step are separable, and in practice they are: you can improve one and leave the other. In my own work the readout is binding rather than turnover — yeast display and a dissociation constant.”',
 cn:'#7（fitness landscape）和卡 02。<b>「一个变体 ＝ 一个坎的高度」这句把她的工作接到这题的物理上。</b>'},
{r:'高', q:'You measure a K d — what does it tell you about catalysis?',
 en:'“Only about the first step. K d is the equilibrium constant of the substrate — or ligand — coming off, so it says how tightly the complex forms, nothing about whether the chemistry then happens. Binding is necessary and not sufficient: the textbook’s own example of that is an inhibitor, which binds and is not converted.”',
 cn:'卡 02、卡 19。'},
{r:'中', q:'Why does PCR need a polymerase from a thermophile?',
 en:'“Because the enzyme has to survive the strand-separation step near boiling, and most enzymes are inactivated around 55 to 60 degrees — the textbook’s number — while enzymes from thermophilic bacteria are still active at 85. Taq polymerase is one; that is the thermolabile point turned into a tool.”',
 cn:'p059；接 #5（Taq/Kapa，导师写过两遍）。<b>「生物热不稳定」那一条的实验室版本。</b>'}
]}
]

<script>
/* data/08.js */
/* 卡 08 · Explain the terms “propeptide” and “signal peptide”. 题库 #8 ＋ #9（S2 Biochemistry 2、3），同一段书，并成一张
   出处 OCR p108、p110–p111（§4.3.2）、p113、p064（§3.7.2）、p117–p118（Obr. 5.2）、p222、p158、p112、p094 p097
   回 300 dpi 原图核过：p111「23 aminokyselin」是书印的；p111「preproproteinu na preprotein」也是书印的（应为 proprotein，见陷阱）。
   「propeptid」「prokolagen」全书 0 命中——书的对象是 proprotein / zymogen / C-peptid；propeptide 按通用说法定义，卡上标明。糖基化、二硫键在卡 13。 */

window.CARDS.push({
id:'08', n:8, merged:[9], w:2,
q:'Explain the terms “propeptide” and “signal peptide”.',
qcn:'解释术语 propeptide（#8）与 signal peptide（#9）',
sub:'主干说完约 90 秒 · 两个词各一句定义，再说它们怎么相关 · 口试他多半只问其中一个词',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'⚠ 两道题都是「解释术语 X」。「解释术语」的意思是：先正面说它<b>是什么</b>（肽链的哪一截、在哪、什么时候没了），再说它<b>为什么存在</b>。两个词都是「前体里有、成熟蛋白里没有的一截肽」——区别在<b>为什么要拿掉</b>。'},
 {n:'01', t:'定义 · signal peptide',
  big:'新生链 <b>N 端</b>的一段序列，由<b>紧接起始密码子后面的信号密码子</b>编码；任务是把核糖体带到 <b>ER 膜</b>上；在 <b>ER 腔内被信号肽酶切掉</b>',
  en:'“The term signal peptide — the textbook says signal sequence — means the stretch of amino acids at the <b>N-terminus</b> of a nascent polypeptide, encoded by the signal codons that follow immediately after the initiation codon, whose job is to bring the ribosome to the membrane of the endoplasmic reticulum, so that the rest of the chain is threaded into the ER lumen as it is made. Once its end is inside, a membrane-bound <b>signal peptidase</b> cuts it off — the mature protein does not carry it.”',
  note:'书叫 signální sekvence，题面叫 signal peptide，同一个东西；「signal peptide」也指切下来的那一截。<span class="pg">p110 p111</span>'},
 {n:'02', t:'定义 · propeptide',
  big:'前体蛋白（<b>proprotein</b>）里的一截肽：链已经折好、已经在分泌路上，但<b>这一截不去掉它就没有活性</b>；由<b>选择性蛋白水解</b>切掉，切了就回不来',
  en:'“The term propeptide means a segment of a precursor protein — the <b>proprotein</b> — that is still there after the chain has folded and entered the secretory route, and that has to be removed by <b>selective proteolysis</b>, cleavage at specific peptide bonds, before the protein is biologically active. The textbook’s example is the <b>C-peptide</b> of proinsulin; the pieces cut off the digestive zymogens are the same idea. ‘Propeptide’ as a word is not in the textbook — its objects are the proprotein, the proenzyme or zymogen, and the C-peptide.”',
  note:'「propeptid」全书 0 命中；「proprotein」「zymogen」「C-peptid」有。定义按通用说法，例子全是书的。<span class="pg">p110 p111 p064 p118</span>'},
 {n:'03', t:'两者的关系',
  big:'<b>pre 管地点，pro 管活性</b>。pre 先掉（ER 里，边合成边切），pro 后掉（Golgi 里，或分泌到目的地之后）；两个都有的叫 <b>preproprotein</b>',
  en:'“The two are the two stages of what the textbook calls a <b>two-stage proteolytic modification</b>. ‘Pre’ is about <b>location</b>: the signal peptide says where the chain goes, and it is cut off first, in the ER, while the chain is still being made. ‘Pro’ is about <b>activity</b>: the propeptide keeps the protein inactive or holds it together, and it is cut off later — mostly in the Golgi, or for the digestive enzymes only in the gut. A protein carrying both is a <b>preproprotein</b>: preproinsulin is signal, B chain, C-peptide, A chain.”',
  note:'<b>这一句是两道题合并的骨架：pre = 地点，pro = 活性。</b>他问哪个词都从这句接到另一个。<span class="pg">p111</span>'},

 {g:'signal peptide 的机器，按顺序', gn:'书 p110–p111 给了一整条链，名字都有。按顺序说，一个环节一句。'},
 {n:'04', t:'长什么样',
  big:'<b>中间疏水</b>、<b>末端带电</b>；preproinsulin 的信号序列 <b>23 个残基</b>',
  en:'“It is mostly <b>hydrophobic residues in the middle</b> and <b>charged residues at the end</b>. That arrangement is the mechanism: at the ER membrane the charged end stays outside, and the hydrophobic middle sinks into the non-polar membrane. Preproinsulin’s signal sequence is <b>23 residues</b> long.”',
  note:'23 回原图核过，是书印的。<span class="pg">p110 p111</span> 通用说法分三段（N 端带正电、疏水核心、C 端极性含切点），书只分两段——说书的。'},
 {n:'05', t:'SRP 和它的受体',
  big:'<b>SRP</b>（signal recognition particle，一个核糖核蛋白）认出<b>已经合成出来的</b>信号序列，把核糖体带到 ER 外侧的 <b>SRP 受体</b>上',
  en:'“As soon as the signal sequence has been synthesised, the <b>signal recognition particle</b>, SRP — a ribonucleoprotein, protein plus a small RNA — binds it specifically and brings the ribosome to a specific <b>SRP receptor</b> on the outer face of the ER membrane. That, the textbook says, is the primary task of the signal sequence according to the signal theory. Generally — the textbook does not say this — SRP also pauses elongation until the ribosome has docked.”',
  note:'「暂停翻译」是通用说法，书没有——标 general。<span class="pg">p110</span>'},
 {n:'06', t:'孔，共翻译穿膜',
  big:'疏水段插进膜，跟旁边的 <b>ribophorin I 和 II</b> 排成一段折叠片；这个非共价互动逼开一个由 ribophorin 围成的<b>「孔」</b>，其余的链<b>边合成边穿进 ER</b>；SRP 随即脱开去接下一条',
  en:'“The hydrophobic middle enters the membrane and forms a pleated-sheet structure with two adjacent membrane proteins, <b>ribophorin I and II</b>; that non-covalent interaction forces open a ‘pore’ bounded by the ribophorins, and the rest of the chain passes through it into the ER while it is still being synthesised — co-translationally. Once the ribosome is attached, SRP is released for the next signal sequence. In the standard picture the channel is the <b>Sec61 translocon</b>; the textbook gives only the ribophorins.”',
  note:'书的说法是 ribophorin 围孔；通用说法是 Sec61。<b>卡上说书的，被追问再补通用。</b><span class="pg">p110 p111</span>'},
 {n:'07', t:'信号肽酶',
  big:'信号序列的末端一出现在 ER 腔里，<b>膜结合的信号肽酶</b>就把它水解掉；从此蛋白是 pro- 或成熟形式，<b>没有信号肽</b>',
  en:'“As soon as the end of the signal sequence appears in the ER lumen, a membrane-bound <b>signal peptidase</b> cuts it off by hydrolysis. From then on the protein is either the proprotein or the finished protein — the signal is gone. The textbook files this cleavage as the covalent modification of the backbone that goes with export.”',
  note:'书这句自己有点绕（「合成完成后，即信号序列末端一出现在腔内」）；通用说法是<b>边合成边切</b>。<span class="pg">p108 p111</span>'},
 {n:'08', t:'之后的路',
  big:'ER 池 → 从 ER 出芽的<b>微囊泡</b> → <b>Golgi</b>（继续修饰）→ <b>分泌颗粒</b> → 跟质膜融合 → 胞外；溶酶体蛋白也走这条路，靠 M6P 分流',
  en:'“After cleavage the rest of the chain goes into the cisternae of the ER, is packed into <b>microvesicles</b> that bud off the ER and travel to the <b>Golgi apparatus</b>, is modified further there, and finally leaves in <b>secretory granules</b> that fuse with the plasma membrane and release the protein outside the cell. Lysosomal proteins take the same route — the textbook says probably also as preproteins — and are sorted off by the mannose-6-phosphate tag.”',
  note:'这条路跟卡 13 共用；糖基化、二硫键的机制在卡 13，这里不重复。<span class="pg">p110 p111 p112</span>'},

 {g:'propeptide 的三个例子', gn:'一个是书的主例（insulin），一个是书的整节（zymogen），一个是通用的（procollagen，书里没有，标 general）。'},
 {n:'09', t:'preproinsulin → proinsulin → insulin',
  big:'preproinsulin = 信号(23) ＋ <b>B 链</b>(N 端) ＋ <b>C-peptide</b>(中间，连着两条链) ＋ <b>A 链</b>(C 端)；切掉信号得 proinsulin；切掉 C-peptide 得 insulin，两条链靠<b>三个二硫键</b>连着',
  en:'“Insulin is first made as <b>preproinsulin</b>: a 23-residue signal sequence, then the <b>B chain</b>, then the connecting <b>C-peptide</b>, then the <b>A chain</b> at the C-terminus. Signal peptidase removes the signal and gives <b>proinsulin</b>, which already contains the finished A and B chains joined by the C-peptide. Selective proteolysis removes the C-peptide and gives biologically active insulin, in which the two chains are held by <b>three disulfide bonds</b>.”',
  note:'书的主干例子，逐词来自 p111。<span class="pg">p111</span>'},
 {n:'10', t:'切 C-peptide 的酶',
  big:'<b>至少两个酶</b>：一个 <b>trypsin 样专一性</b>的酶切下 C-peptide；一个 <b>carboxypeptidase</b> 去掉留下的<b>两个碱性残基的二肽</b>',
  en:'“At least two enzymes take part: one with <b>trypsin-like specificity</b> — it cuts after basic residues — that cuts out the C-peptide, and a <b>carboxypeptidase</b>, an exopeptidase working from the C-terminus, that removes the dipeptide of two basic amino acids by which the C-peptide had been attached. Generally the two are the prohormone convertases and carboxypeptidase E; the textbook names only the specificities.”',
  note:'通用名字（PC1/3、PC2、carboxypeptidase E）标 general。<b>「trypsin 样」= 切碱性残基之后</b>，所以 C-peptide 两头是成对的碱性残基。<span class="pg">p111 p117</span>'},
 {n:'11', t:'二硫键先于切',
  big:'proinsulin 的 A–B 二硫键是<b>在 proinsulin 阶段</b>形成的（跟氧化型谷胱甘肽反应）——<b>C-peptide 还连着两条链的时候</b>',
  en:'“The order matters: the textbook says the disulfide bonds between the A and B chains form <b>in proinsulin</b>, by reaction with the oxidised form of glutathione — so they are made while the C-peptide still holds the two chains together, and only then is the C-peptide cut out. That is what the C-peptide is for.”',
  note:'这是「propeptide 为什么存在」的第二种理由：不是压住活性，是<b>把两条链按对的位置拴在一起等二硫键形成</b>。<span class="pg">p113</span>'},
 {n:'12', t:'zymogen',
  big:'有些蛋白酶以<b>无活性的 zymogen / proenzyme</b> 合成，需要时才用<b>酶催化的水解切掉一段肽</b>激活，这会<b>露出活性中心</b>；<b>不可逆</b>；trypsin、chymotrypsin、pepsin、部分凝血酶',
  en:'“A <b>zymogen</b>, or proenzyme, is an enzyme synthesised in an inactive precursor form and activated only when needed. The textbook puts it among the covalently modulated enzymes: activation is an enzyme-catalysed hydrolytic removal of part of the peptide chain, which <b>uncovers the enzyme’s own active centre</b>, and this kind of regulation is <b>irreversible</b>. Typical of trypsin, chymotrypsin and pepsin, the digestive enzymes, and of some enzymes of blood clotting.”',
  note:'卡 18/19 的邻居：共价调控的一种，跟磷酸化并列，跟别构（非共价、可逆）相对。<span class="pg">p064 p222</span>'},
 {n:'13', t:'消化酶原的账',
  big:'pepsinogen → <b>HCl</b> 切掉 5 个肽 → pepsin–inhibitor 复合物 → pH < 5 放出抑制肽 → pepsin；<b>trypsinogen → trypsin 靠肠黏膜的 enteropeptidase</b>（切掉 Val-Asp₄-Lys）；trypsin 再激活 chymotrypsinogen、proelastase、procarboxypeptidases；胰腺同时分泌 <b>trypsin inhibitor</b>',
  en:'“In the stomach, <b>pepsinogen</b> loses five peptides by the action of hydrochloric acid and becomes a pepsin–inhibitor complex; below pH 5 the inhibitor peptide leaves and pepsin is free. The pancreas sends trypsinogen, chymotrypsinogen, proelastase, procarboxypeptidase and a trypsin inhibitor into the small intestine; <b>enteropeptidase</b> from the intestinal mucosa converts trypsinogen to trypsin — the figure shows the hexapeptide Val-Asp₄-Lys coming off — and trypsin activates the others. The inhibitor protects trypsin from digesting itself and stops the other zymogens being activated too early.”',
  note:'全在 Obr. 5.2 和 p118 正文。<b>「胰腺为什么不消化自己」那道便装题的答案就在这里。</b><span class="pg">p117 p118</span>'},
 {n:'14', t:'procollagen（general）',
  big:'胶原以 <b>procollagen</b> 分泌，三螺旋两端各带一个球形的 <b>N-/C-propeptide</b>；出细胞后被 <b>procollagen peptidases</b> 切掉才装配成纤维——书里没有 prokolagen，通用',
  en:'“Generally — the textbook does not have procollagen — collagen is secreted as <b>procollagen</b>, the triple helix with a globular <b>propeptide at each end</b>; they keep it soluble and stop it assembling into fibres inside the cell, and <b>procollagen peptidases</b> cut them off outside, after which the molecules pack into fibrils. What the textbook does give is that collagen is hydroxylated in the cisternae of the ER — so it goes through the ER, which means it starts with a signal sequence.”',
  note:'<b>全条 general</b>，只有「羟化在 ER 池」是书的。<span class="pg">p112 p031</span> 这是 propeptide 的第三种理由：<b>先别装配</b>。'},

 {g:'为什么', gn:'三个理由对应三个例子。说得出理由，「解释术语」才算解释了。'},
 {n:'15', t:'为什么要 pre',
  big:'核糖体在胞质里，分泌蛋白要过一层膜；<b>地址必须写在蛋白自己身上</b>，而且写在<b>最先出来的那一端</b>；用完就切，因为书只给了它一个任务',
  en:'“Why a signal peptide at all: the ribosome is cytosolic and a secreted protein has to cross a membrane. The cell has one kind of ribosome and many destinations, so the address has to be written in the protein itself — at the N-terminus, because that is the first part to emerge, so the decision is made before the rest of the chain exists. And it is cut off because it has done its only job: the textbook gives it one task, attachment to the ER.”',
  note:'书给了任务（p110）；「为什么在 N 端」是从「信号密码子紧接起始密码子」推的，说成推论。<span class="pg">p110</span>'},
 {n:'16', t:'为什么要 pro',
  big:'三种理由：① <b>活性在错误的地方有害</b>（胰腺不能消化自己——书明说）② <b>把两条链拴在一起等二硫键</b>（insulin）③ <b>先别装配</b>（procollagen，general）',
  en:'“Why a propeptide: three reasons, one per example. For the digestive enzymes, activity in the wrong place is harmful — the textbook says outright that making them as proenzymes is a protective mechanism that stops the producing organs digesting themselves. For insulin, the C-peptide holds the A and B chains in register while the three disulfides form; two separate chains would not find each other reliably. For collagen, generally, the propeptides stop the molecule assembling before it is outside.”',
  note:'<span class="pg">p118 p113</span> 第二、三条的「为什么」是通用推理，书只给了事实。'},

 {g:'收尾', gn:'一句停住，一句陷阱，一句伸出去。'},
 {n:'17', t:'落点 · 不可逆',
  big:'切肽键是<b>水解</b>，放能，切下来的片段扩散走——<b>细胞没有把它接回去的反应</b>；所以 pro 只能用一次，要可逆的调控得用别构或磷酸化',
  en:'“And the removal is irreversible for a thermodynamic reason: hydrolysis of a peptide bond is exergonic and the fragment diffuses away, so there is no reaction in the cell that puts it back. That is why a propeptide is a one-shot switch, and why reversible regulation uses something else — allosteric binding or phosphorylation.”',
  note:'停在热力学。停止句在 why 那一屏。<span class="pg">p064</span>'},
 {n:'18', t:'陷阱四条',
  big:'① 成熟蛋白<b>没有</b>信号肽 ② 这个 signal 是<b>地址</b>，不是激素那种信号 ③ 线粒体、细胞核的靶向序列是<b>另一套信号</b>（general）④ 书 p111 把「preproprotein 切掉信号」印成「→ preprotein」，应为 <b>proprotein</b>',
  en:'“Four things not to say. The mature protein does not have a signal peptide — it was cut off in the ER. ‘Signal’ here means an address, not a hormone signal. Mitochondrial and nuclear targeting sequences are different signals read by different machinery — generally, the mitochondrial one is also N-terminal and cleaved, the nuclear one is internal and stays. And the textbook slips once: page 111 says removing the signal turns a preproprotein into a preprotein — it means proprotein, because ‘pre’ is what came off.”',
  note:'第四条回原图核过，书就是这么印的，不是 OCR。<b>用书自己的定义（p110：pre = 带信号序列）打书的这一句</b>，比引外部教材稳。<span class="pg">p110 p111</span>'},
 {n:'19', t:'留口子',
  big:'我自己的构建体上就有这两样：yeast display 的 Aga2 融合前面是一段分泌信号；大肠杆菌周质表达用 pelB；标签放在信号<b>后面</b>，不然跟信号一起被切掉',
  en:'“I use both of these every week. In yeast display the protein is a fusion to Aga2p, and the vector puts a secretion signal in front of it — that is why the fusion goes through the ER and the Golgi and ends up anchored on the cell surface. For E. coli I would use a pelB or OmpA signal to send a protein to the periplasm. And the practical rule: a tag goes after the signal, never in front of it, or it is cut off with the signal.”',
  note:'<b>实验室知识，不是书的。</b>他顺着走就到 yeast display（卡 02）和 plasmid 元件（大本营卡）。'}
],
end:'<b>两个词各一句定义，加「pre 管地点、pro 管活性」那一句，这题就答完了八分。</b>其余是他追问哪个例子时才给的：insulin 给 09–11，胰腺给 13，胶原给 14。',

segs:[
 {tag:'段 1 · 定义', h:'两个词各一句正面定义，然后一句关系',
  p:['“Both terms name a piece of a polypeptide that is present in the precursor and absent from the mature protein; the difference is why it is removed.',
     'A <b>signal peptide</b> — the textbook says signal sequence — is the stretch at the N-terminus of a nascent chain, encoded by the signal codons right after the initiation codon, whose job is to bring the ribosome to the membrane of the endoplasmic reticulum so that the chain is threaded into the ER lumen as it is made; once its end is inside, a membrane-bound signal peptidase cuts it off. While it is still there the protein is a <b>preprotein</b>.',
     'A <b>propeptide</b> is a segment of the precursor — the <b>proprotein</b> — that is still there after the chain has folded and is on the secretory route, and that must be removed by selective proteolysis, cleavage at specific peptide bonds, before the protein is biologically active. The textbook’s example is the C-peptide of proinsulin; the pieces cut off the digestive zymogens are the same idea.”'],
  note:'<b>他嘴里的题面是「What is a propeptide?」或「What is a signal peptide?」，只有一个词。</b>答那个词的定义之后，主动接到另一个——因为两者的关系就是这题的第二句。'},
 {tag:'段 2 · general', h:'归类：pre 管地点，pro 管活性；书把它们归在哪',
  p:['“The relation between them: ‘pre’ is about <b>location</b> and ‘pro’ is about <b>activity</b>. The signal peptide is cut off first, in the ER, while the chain is being made; the propeptide is cut off later — mostly in the Golgi, the textbook says, or for the digestive enzymes only after secretion into the gut. A protein carrying both is a <b>preproprotein</b>; the textbook calls the whole thing a two-stage proteolytic modification.',
     'Where it sits in the textbook: post-translational modification has three kinds — non-covalent folding, covalent modification of the backbone, and covalent modification of side chains — and both of these cleavages are the second kind, the one the textbook ties to transport of proteins out of the cell. Zymogen activation it also files, separately, under covalent modulation of enzymes — the irreversible kind.”'],
  note:'<b>这一段是「解释术语」的第二半：它属于什么。</b>p108 的三分法和 p064 的共价调控，两处都能接。'},
 {tag:'段 3 · 稍展开', h:'机器按顺序，然后 insulin 一个例子走完',
  p:['“The machinery in order. The signal sequence is hydrophobic in the middle and charged at the end; as soon as it has been synthesised, the signal recognition particle, SRP, a ribonucleoprotein, binds it and brings the ribosome to the SRP receptor on the outer face of the ER. The charged end stays outside, the hydrophobic middle sinks into the membrane and, with two adjacent membrane proteins, ribophorin I and II, forms a pleated-sheet structure that forces open a pore; the rest of the chain goes through it while it is still being made, SRP is released for the next one, and once the end of the signal appears in the lumen, membrane-bound signal peptidase cuts it off. From the ER cisternae the protein goes by microvesicles to the Golgi and leaves in secretory granules that fuse with the plasma membrane.',
     'Insulin shows both stages. Preproinsulin is a 23-residue signal, then the B chain, the connecting C-peptide, then the A chain. Signal peptidase gives proinsulin, in which the three disulfides between A and B are formed — with oxidised glutathione — while the C-peptide still holds the chains together. Then, in the Golgi, at least two enzymes act: one with trypsin-like specificity cuts out the C-peptide and a carboxypeptidase removes the dipeptide of two basic residues it was attached by. What is left is insulin.”'],
  note:'〔可裁〕如果他要另一个例子，给 zymogen：“The digestive enzymes are the other case: trypsinogen is turned into trypsin by enteropeptidase from the intestinal mucosa, which cuts off a hexapeptide and uncovers the active centre; trypsin then activates chymotrypsinogen, proelastase and the procarboxypeptidases.”'},
 {tag:'段 4 · 留口子', h:'转进主场：构建体上的信号序列',
  p:['“And I use both of these every week. In yeast display the protein I work on is a fusion to Aga2p, and the vector puts a secretion signal in front of it — so the fusion goes through the ER, gets its disulfides and glycans there, passes the Golgi, and ends up anchored on the cell surface, where I can titrate binding. The yeast α-factor leader some vectors use is literally a prepro sequence: a signal cut by signal peptidase and a pro-region cut in the Golgi by the Kex2 protease.',
     'For E. coli I would put a pelB or OmpA signal in front to send the protein to the periplasm, where disulfides can form. And the practical rule that follows: any tag goes after the signal, or it is cut off with it.”'],
  note:'<b>实验室知识，不是书的。</b>三个口子——yeast display（卡 02）、周质与二硫键（卡 13）、plasmid 元件（大本营卡）——全在你的地盘。<b>具体用的是哪个 leader，看你自己的载体图，别在考场上猜。</b>'}
],

why:{
 rungs:[
  ['为什么地址要写在蛋白上，而且写在 N 端？','因为核糖体只有一种，目的地有很多，<b>能区分它们的只有正在合成的那条链本身</b>。写在 N 端是因为 N 端最先出来——信号密码子紧接起始密码子（p110）——所以链还没合成完就能决定去哪。'],
  ['那为什么要把信号切掉？','因为它只有一个任务（p110：把核糖体接到 ER 上），任务完成它就没用了；而且它是一段疏水序列，留在一个可溶蛋白上没有好处。“It had one job, and a hydrophobic stretch left on a soluble protein serves nothing.”'],
  ['那为什么有的蛋白还要多带一截 pro，不直接合成活性形式？','三个理由，各对一个例子（p118、p113、general）：<b>活性在错的地方会伤害产生它的器官</b>（胰腺）；<b>两条链要先拴在一起等二硫键</b>（insulin）；<b>先别装配</b>（procollagen）。共同点：<b>活性或装配要等到对的时间和地点</b>，而蛋白一折好就有了，所以要有一个可以一次性拆掉的锁。']
 ],
 stop:{lbl:'停 · 落在热力学',
  say:'“And the lock is one-shot because removal is proteolysis: hydrolysis of a peptide bond is exergonic and the fragment diffuses away, so nothing in the cell puts it back. Below that — why the peptide bond is thermodynamically unstable in water yet stays put until an enzyme acts — we are in physical chemistry rather than biochemistry.”'}

/* ---------------- 同一个答案，不同问法 ---------------- */
recog:[
{q:'What is a propeptide?',
 mean:'<b>#8 的最短问法，他真正会说的那句。</b>答案自带结构：定义 → 例子 → 为什么有它 → 跟 pre 的关系。',
 say:'“A propeptide is a segment of a precursor protein — the proprotein — that is still there after the chain has folded and entered the secretory route, and that has to be removed by selective proteolysis before the protein is biologically active. The textbook’s example is the C-peptide of proinsulin, which holds the A and B chains together while their three disulfides form; the pieces cut off the digestive zymogens are the same idea, there to keep the enzyme inactive until it is in the gut. The removal is irreversible. It is the second stage of the textbook’s two-stage proteolytic modification — the first is the signal peptide, which is about where the protein goes, not whether it is active.”'},

{q:'What is a signal peptide?',
 mean:'<b>#9 的最短问法。</b>定义 → 长相 → 机器一句 → 切掉 → 跟 pro 的关系。',
 say:'“A signal peptide — the textbook says signal sequence — is the N-terminal stretch of a nascent polypeptide, encoded by the signal codons right after the initiation codon, that brings the ribosome to the ER membrane so that the chain is threaded into the ER lumen as it is made. It is hydrophobic in the middle and charged at the end; SRP binds it, docks the ribosome on the SRP receptor, the chain goes through a pore, and a membrane-bound signal peptidase cuts the signal off once its end is inside — so the mature protein never carries it. Preproinsulin’s is 23 residues. It is the ‘pre’ of a preproprotein; the ‘pro’, the propeptide, is a different segment removed later, for activity rather than location.”'},

{q:'What is the difference between a preprotein and a proprotein?',
 mean:'<b>他在问 pre 和 pro 两个前缀。</b>这就是骨架句。',
 say:'“A preprotein still carries its signal peptide — it has not yet been processed in the ER, so the prefix is about location. A proprotein has lost the signal but still carries a propeptide — it is folded and on its way but not yet active, so the prefix is about activity. A preproprotein has both, and loses them in that order: pre first, in the ER, pro later, mostly in the Golgi.”',
 tail:'书 p111 在这句上印错了一次（preproprotein → “preprotein”），见陷阱；答这题时按 p110 的定义说，不用提书错，除非他自己念出那句。'},

{q:'Where is the signal peptide cut off, and by what?',
 mean:'<b>要地点和酶名，一句话。</b>',
 say:'“In the lumen of the endoplasmic reticulum, by signal peptidase, an enzyme bound to the ER membrane. It cuts as soon as the end of the signal sequence appears in the lumen — while the rest of the chain is still coming through, in the standard picture; the textbook words it as after synthesis is complete.”'},

{q:'How is insulin made from preproinsulin?',
 mean:'<b>书的主干例子。</b>顺序：信号 → proinsulin → 二硫键 → C-peptide → insulin。',
 say:'“Preproinsulin is a 23-residue signal, then the B chain, the C-peptide, then the A chain. Signal peptidase removes the signal in the ER, giving proinsulin, which already contains the finished A and B chains; their three disulfides form at this stage, with oxidised glutathione, while the C-peptide holds the chains together. Then, mostly in the Golgi, an enzyme with trypsin-like specificity cuts out the C-peptide and a carboxypeptidase removes the dipeptide of two basic amino acids it was attached by. What remains is insulin.”'},

{q:'What is a zymogen, and how is it activated?',
 mean:'<b>propeptide 的第二个例子，书有整节。</b>定义 → 机制 → 不可逆 → 例子。',
 say:'“A zymogen, or proenzyme, is an enzyme synthesised as an inactive precursor and activated only when needed. Activation is an enzyme-catalysed hydrolytic removal of part of the peptide chain, which uncovers the active centre; it is irreversible — the textbook lists it among the covalently modulated enzymes. Trypsinogen becomes trypsin by enteropeptidase from the intestinal mucosa, pepsinogen becomes pepsin by hydrochloric acid, and trypsin activates chymotrypsinogen, proelastase and the procarboxypeptidases. Some clotting enzymes work the same way.”'},

{q:'Why do doctors measure C-peptide in a diabetic?', odd:1,
 mean:'<b>问的是 C-peptide 是什么、从哪来。</b>临床部分通用。',
 say:'“Because the C-peptide is the propeptide cut out of proinsulin, so — generally — one C-peptide is released for every insulin molecule the patient’s own β-cells make, while injected insulin contains no C-peptide. Measuring C-peptide therefore tells you how much insulin the patient is still producing themselves, even if they are on insulin injections.”',
 tail:'⚠ 临床用途<b>书里没有</b>；C-peptide 的来路（p111）有。'},

{q:'Why doesn’t the pancreas digest itself?', odd:1,
 mean:'<b>问的是 zymogen。</b>书 p118 直接给了答案。',
 say:'“Because its proteases are made as zymogens — trypsinogen, chymotrypsinogen, proelastase, procarboxypeptidase — inactive precursors that are only activated after secretion into the small intestine, where enteropeptidase from the mucosa converts trypsinogen to trypsin and trypsin activates the rest. The textbook says outright that this is a protective mechanism against the producing organ digesting itself. The pancreas also secretes a trypsin inhibitor, which stops trypsin digesting itself and stops the other zymogens being activated too early.”'},

{q:'Why does your displayed protein end up on the yeast surface?', odd:1,
 mean:'<b>同一个答案，换成实验室的问法。</b>直通主场。',
 say:'“Because it starts with a signal peptide. The display vector puts a secretion signal in front of the Aga2p fusion, so the fusion is threaded into the ER as it is made, gets its disulfides and N-glycans there, passes through the Golgi, and is delivered to the cell surface, where Aga2p is held by disulfides to Aga1p, which is anchored in the cell wall. Without the signal it would be a cytosolic protein and I would see nothing on the surface.”',
 tail:'实验室知识。Aga1p–Aga2p 的锚定是通用的 yeast-display 说法。'},

{q:'Why does blood not clot inside a healthy vessel?', odd:1,
 mean:'<b>问的是凝血酶原 = zymogen。</b>书的碎片：p064（凝血酶是酶原）、p158（prothrombin → thrombin）、p039 p034（fibrinogen → fibrin）。',
 say:'“Because the clotting enzymes circulate as zymogens — the textbook names them among the proteases made as proenzymes. Prothrombin is converted to thrombin only where the cascade is triggered, and thrombin converts soluble globular fibrinogen into fibrous fibrin; the textbook’s heparin example is that it blocks both steps. Generally, thrombin does that by cutting two short peptides off fibrinogen — itself a propeptide removal.”',
 tail:'γ-carboxylation 和维生素 K 在<b>卡 13</b>；fibrinopeptide 那句 general。'},

{q:'Why is collagen assembled into fibres only outside the cell?', odd:1,
 mean:'<b>问的是 procollagen 的 propeptide。</b>全条 general。',
 say:'“Generally: because it is secreted as procollagen, with a globular propeptide at each end of the triple helix that keeps it soluble and prevents assembly; procollagen peptidases outside the cell cut them off, and only then do the molecules pack into fibrils. The textbook does not have procollagen, but it does put collagen’s hydroxylation in the ER cisternae, so the molecule goes through the secretory route like the others.”'},

{q:'Is signal-peptide cleavage a post-translational modification?',
 mean:'<b>归类题。</b>按书答，然后给通用的保留。',
 say:'“In the textbook, yes: it is the covalent modification of the polypeptide backbone, the kind it ties to transport of proteins out of the cell — one of its three classes of post-translational modification. Strictly it is co-translational, because the cut is made while the rest of the chain is still being synthesised; the textbook keeps it under post-translational all the same.”'},

{q:'Give me an example of a propeptide.',
 mean:'<b>要例子。</b>先给书的，再给通用的，标明。',
 say:'“The C-peptide of proinsulin — the textbook’s example. Then the pieces cut off the zymogens: the hexapeptide enteropeptidase removes from trypsinogen. And generally, the N- and C-propeptides of procollagen.”'}
],

/* ---------------- 追问 ---------------- */
ask:[
{g:'定义类', gn:'他默认你知道这些名词。每个先说是什么。', items:[
{r:'高', q:'What is a preproprotein?',
 en:'“A precursor that still carries both removable segments: the signal peptide at the N-terminus, which says where it goes, and a propeptide, which keeps it inactive or held together. The textbook’s example is preproinsulin — signal, B chain, C-peptide, A chain. It loses the signal first, in the ER, and becomes the proprotein; then the propeptide, mostly in the Golgi, and becomes the active protein.”',
 cn:'<span class="pg">p110 p111</span> 书 p110 把 pre(pro)形式定义为「天然状态下带信号序列的」——这就是「pre = 带信号」的出处。'},
{r:'高', q:'What is the signal recognition particle?',
 en:'“SRP is a ribonucleoprotein — protein subunits on a small RNA — that binds specifically to a signal sequence as soon as it has been synthesised and carries the ribosome to its own receptor, the SRP receptor, in the ER membrane. Once the ribosome is attached it is released and picks up the next signal sequence. Generally it also pauses elongation while it does this; the textbook gives the binding and the recycling, not the pause.”',
 cn:'<span class="pg">p110 p111</span> 「暂停翻译」标 general。通用的组成（6 个蛋白 ＋ 7S RNA）书里没有，不用报数。'},
{r:'中', q:'What is a ribophorin?',
 en:'“In the textbook, ribophorins I and II are the two ER membrane proteins beside which the hydrophobic part of the signal sequence lines up as a pleated sheet, and which bound the pore the chain goes through. In the standard picture the channel itself is the Sec61 translocon, and the ribophorins are subunits of the oligosaccharyltransferase next to it that puts the N-glycan on — which is why glycosylation starts while the chain is still coming through.”',
 cn:'<span class="pg">p110</span> 书 vs 通用：书说 ribophorin 围孔，通用说 Sec61。<b>卡上说书的，被追问再补通用。</b>这条顺便接卡 13 的「N-糖基化是共翻译的」。'},
{r:'高', q:'What is selective proteolysis?',
 en:'“Hydrolysis of specific peptide bonds in a protein by a protease that recognises a particular sequence or residue — as opposed to digestion, which takes the chain apart. The textbook calls the second stage of processing selective proteolysis: for proinsulin it is a trypsin-like enzyme, which cuts after basic residues, followed by a carboxypeptidase that trims the basic dipeptide left behind. It is a covalent modification of the backbone, and it is irreversible.”',
 cn:'<span class="pg">p111 p064</span> 「trypsin 样 = 切碱性残基之后」：书 Tab. 5.1（p116）给了各蛋白酶的专一性。'},
]},

{g:'为什么类', gn:'卡上给了结论没给理由的地方。', items:[
{r:'高', q:'Why is the middle of the signal peptide hydrophobic?',
 en:'“Because that is the part that has to enter the membrane. The textbook says it directly: the hydrophobic middle sinks into the non-polar ER membrane while the charged end stays outside, and that insertion, together with the ribophorins, is what forces the pore open. A charged or polar stretch would stay in the water; a hydrophobic one partitions into the lipid — the same reason a membrane-spanning helix is hydrophobic.”',
 cn:'<span class="pg">p110</span> 落在热力学：疏水段进脂相是自由能下降的（疏水效应，卡 x_bonds）。'},
{r:'高', q:'Why is the signal at the N-terminus rather than the C-terminus?',
 en:'“Because the N-terminus is made first. The signal codons follow the initiation codon, so the signal is the first part of the chain to emerge from the ribosome, and SRP can bind it and dock the ribosome before the rest of the protein exists — which is what makes the translocation co-translational. A C-terminal signal would only be readable after the whole chain was already in the cytosol.”',
 cn:'<span class="pg">p110</span> 前半句是书的（信号密码子紧接起始密码子），后半句是推论。通用补充：膜蛋白可以用内部的 signal-anchor 序列，不切——标 general。'},
{r:'高', q:'Why does the pancreas also secrete a trypsin inhibitor?',
 en:'“Because trypsin activates trypsinogen — it is autocatalytic — and it activates chymotrypsinogen and the procarboxypeptidases. So a trace of trypsin in the wrong place would set off the whole cascade. The textbook says the inhibitor does two things: it protects trypsin against its own autocatalytic breakdown, and it prevents premature activation of the other zymogens in the intestinal content.”',
 cn:'<span class="pg">p118</span> 书原话两个功能。通用补一句：胰腺炎就是这套保护失灵——要说就说 generally。'},
{r:'高', q:'Why is proinsulin made as one chain rather than two?',
 en:'“Because two separate chains would have to find each other and pair three specific cysteines correctly. In proinsulin the C-peptide holds the A and B chains in register, the three disulfides form — the textbook says with oxidised glutathione, in proinsulin — and only then is the connector cut out. The propeptide is a folding aid here, not an activity lock.”',
 cn:'<span class="pg">p113 p111</span> 这条跟卡 13 的 PDI / 氧化型谷胱甘肽接上。「折叠辅助 vs 活性锁」是通用区分。'}
]},

{g:'怎么发现的', gn:'书只说「按信号理论」，人名年份都是 general。', items:[
{r:'中', q:'How was the signal hypothesis established?',
 en:'“Generally: Günter Blobel and Bernhard Dobberstein, in 1975, translated the mRNA of a secreted protein in a cell-free system. Without ER membranes the product was longer — it still had the signal — and added protease digested it. With ER microsomes the product was shorter, the signal gone, and protected from protease, because it was inside the vesicles. So cleavage and translocation happen together, at the ER. Blobel’s Nobel Prize for it was 1999; the textbook just says ‘signal theory’.”',
 cn:'<span class="pg">p110</span> 书只有「podle signální teorie」四个字，其余 general。<b>被问时先说实验逻辑，人名年份放最后。</b>'},
{r:'中', q:'How was proinsulin discovered?',
 en:'“Generally: Donald Steiner, in 1967, labelled a human insulin-producing tumour with radioactive amino acids and followed the label over time; it appeared first in a single larger chain and only later in insulin, so the two-chain hormone had to come from a one-chain precursor. That precursor was proinsulin, and the piece removed was the C-peptide.”',
 cn:'全条 general；书只有 proinsulin 的结构（p111）。'}
]},

{g:'陷阱', gn:'每条都是一个说错就被抓的地方。', items:[
{r:'高', q:'Does insulin have a signal peptide?',
 en:'“No. Preproinsulin has one; it is cut off by signal peptidase in the ER before the protein has even finished folding, so neither proinsulin nor insulin carries it. Insulin also no longer has the C-peptide.”',
 cn:'<span class="pg">p111</span> 「成熟蛋白没有信号肽」——这条是全卡第一陷阱。'},
{r:'高', q:'Is zymogen activation an allosteric regulation?',
 en:'“No. Allosteric regulation is non-covalent and reversible — a metabolite binds at a separate site and leaves again. Zymogen activation is covalent and irreversible: a peptide bond is hydrolysed and the fragment is gone. The textbook puts it with the covalently modulated enzymes, next to phosphorylation — but phosphorylation is reversible and this is not.”',
 cn:'<span class="pg">p064 p222</span> 三种调控的区分：别构（非共价、可逆）· 磷酸化（共价、可逆）· 酶原激活（共价、不可逆）。卡 18/19 那边有别构。'},
{r:'高', q:'Do all secreted proteins have a propeptide?',
 en:'“No. The textbook says secreted proteins are often made as preproteins or preproproteins — often, not always. Generally every protein that enters the ER has a signal, but the propeptide is optional: it is there when activity or assembly has to wait. So pre is the rule, pro is the exception.”',
 cn:'<span class="pg">p110</span> 书原词 <i>často</i>。「只有」「都」是邀请函——不要说「所有分泌蛋白都是 preproprotein」。'},
{r:'中', q:'The textbook says removing the signal turns a preproprotein into a preprotein. Is that right?',
 en:'“That line on page 111 is a slip. By the textbook’s own definition on the page before, the pre-forms are the ones that still carry the signal sequence — so once the signal is removed, what is left is the proprotein, which still has the propeptide. The example on the same page says it correctly: preproinsulin minus the signal is proinsulin.”',
 cn:'<span class="pg">p111 p110</span> 回 300 dpi 原图核过，书印的就是 preprotein。<b>用书 p110 的定义打书 p111 的这一句</b>，同页的 preproinsulin → proinsulin 例子是第二个证人。'},
{r:'中', q:'Do mitochondrial proteins use the same signal?',
 en:'“Generally, no. Proteins made in the cytosol for the mitochondrion carry their own N-terminal targeting sequence — a different pattern, read by receptors in the mitochondrial membranes rather than by SRP, and cut off inside by a mitochondrial processing peptidase. Nuclear proteins carry an internal nuclear localisation signal that is never cut. The ER signal is one address among several; the textbook only describes the ER one.”',
 cn:'全条 general；书只有 ER 这一套。别把「signal peptide」说成所有靶向序列的总称。'}
]},

{g:'相邻考点', gn:'他从这题走出去会到的地方，各给一句，指到那张卡。', items:[
{r:'高', q:'What happens to the protein on this route besides the cleavages?',
 en:'“The modifications of the secretory route: N-glycosylation, which starts in the ER membrane while the chain is still coming through, and disulfide bonds, formed and reshuffled by protein disulfide isomerase in the ER cisternae; collagen is hydroxylated there and the clotting factors γ-carboxylated. In the Golgi the glycan is finished, the propeptide is cut, and mannose-6-phosphate sends lysosomal proteins off.”',
 cn:'<b>全部在卡 13</b>，这里只说一句。<span class="pg">p111 p112 p113</span>'},
{r:'中', q:'What is the initiation codon?',
 en:'“AUG, which codes for methionine — in bacteria formylmethionine at the start. Because AUG also codes internal methionines, the ribosome finds the right one by pairing the mRNA with its 16S rRNA at the Shine–Dalgarno sequence, about ten nucleotides upstream in E. coli. The signal codons come immediately after it, which is why the signal peptide is N-terminal.”',
 cn:'<span class="pg">p094 p097 p110</span> 翻译那段书（p092–p101）没有题，但这题和卡 12 从两边夹着它。'},
{r:'中', q:'What other kinds of covalent modulation of enzymes are there?',
 en:'“The textbook gives two: reversible phosphorylation — a kinase puts a phosphate on a serine, threonine or tyrosine hydroxyl, a phosphatase takes it off — and the irreversible activation of zymogens by partial proteolysis. Both are covalent; only the first can be undone. Allosteric regulation is the non-covalent alternative.”',
 cn:'<span class="pg">p063 p064 p222</span> 卡 18/19 的地盘。溶酶体（M6P）在卡 13。'}
]},

{g:'桥回主场', gn:'实验室知识，不是书的。每条说清是自己的构建体，不是教科书。', items:[
{r:'高', q:'What signal sequence do you use in yeast display?',
 en:'“The display vector carries a secretion signal in front of the Aga2p fusion — in the standard yeast-display system it is the Aga2p signal sequence itself; other yeast expression vectors use the α-factor leader, which is a genuine prepro sequence: a signal cut by signal peptidase in the ER and a pro-region cut in the Golgi by the Kex2 protease, which cleaves after a lysine–arginine pair. Either way the fusion goes through the ER and the Golgi and ends up on the surface.”',
 cn:'<b>lab 知识。</b>具体用的是哪个 leader 看你自己的载体图；考场上说「my vector carries」，不说型号。'},
{r:'中', q:'And in E. coli?',
 en:'“A bacterial signal peptide such as pelB or OmpA in front of the protein sends it through the Sec machinery into the periplasm, where the signal is removed by the bacterial signal peptidase and disulfides can form, because the periplasm is oxidising and has the Dsb enzymes. Same logic as the ER signal — a hydrophobic N-terminal stretch, cut off after crossing — different membrane and different machinery.”',
 cn:'<b>lab 知识。</b>周质与二硫键在卡 13 也有。'},
{r:'高', q:'Where do you put the His-tag, and why?',
 en:'“After the signal sequence, or at the C-terminus — never in front of the signal, because everything before the cleavage site leaves with the signal peptide. If the construct also has a pro-region, the tag has to sit after that cleavage site too. And the residues right after the cut affect how efficiently signal peptidase cleaves, so I keep the junction as it is in the parent vector.”',
 cn:'<b>lab 知识。</b>这条是 pre/pro 两个词在实验台上的直接后果，也是他最容易顺着问的一步。'},
{r:'中', q:'How would you check that the signal was actually cleaved?',
 en:'“By the N-terminus of the product: N-terminal sequencing or mass spectrometry of the purified protein shows whether it starts where the cleavage site predicts, and on a gel the cleaved protein runs slightly smaller than the uncleaved one. If the signal were still on, the protein would also be sitting in the membrane fraction rather than in the secreted or periplasmic fraction.”',
 cn:'<b>lab 知识。</b>落在测量限制：能看见的是 N 端和大小，不是切的过程。'}
]}
]
});

   出处：p141–p146（§6.2.4、Obr. 6.6–6.11）· p134–p136（Tab. 6.2、ΔG°′ = −nFΔE°′、30 kJ 量子、2 vs 38）·
   p139–p140（38 的拆分、3 ATP/NADH）· p045–p046（FMN/FAD、辅酶 Q、血红素、FeS）· p197（只有内膜产 ATP）·

   p146 的 ADP + Pi → ATP + H₂O（ΔG°′ = +30,5）、6 个质子 ≈ 3 ATP / 4 个 ≈ 2 ATP、

   kyanid · oligomycin · dinitrofenol · Crabtree · 穿梭 · 2.5/1.5 · 「复合物 IV 泵质子」（书说它不泵）。

   她没学过这一章，所以这张卡是教，不是提醒。接卡 24（循环把还原力交到这里）和卡 gly（38 的另一半）。 */

window.CARDS.push({
id:'25', n:25, merged:[26], w:1,
q:'Describe the electron transport chain and its role in cellular respiration. What is oxidative phosphorylation?',
qcn:'描述电子传递链及其在细胞呼吸中的作用 ＋ 什么是氧化磷酸化',
