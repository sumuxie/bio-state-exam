<script>
/* data/19.js */
/* 卡 19 · What are the different types of enzyme inhibition?
   题库 #19（S3 Biochemistry 6）
   出处 Biochemie OCR p059–p062（§3.5 抑制、§3.6 机制） */

window.CARDS.push({
id:'19', n:19, w:1,
q:'What are the different types of enzyme inhibition?',
qcn:'酶抑制有哪些类型',
sub:'主干说完约 80 秒 · 先分两刀，再分三类',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'⚠ 这题最容易犯的错是一上来就报「竞争性、非竞争性、反竞争性」。那是第二刀的结果，第一刀在它前面。'},
 {n:'01', t:'上位类',
  big:'影响酶反应速率的东西统称 <b>modulator</b>：加快的叫 <b>activator</b>，减慢的叫 <b>inhibitor</b>',
  en:'“Substances that affect the rate of an enzyme reaction by interacting with the catalyst are called <b>modulators</b>. Those that increase the rate are activators, those that decrease it are inhibitors.”',
  note:'<b>先给上位类，显示你知道抑制剂只是一半。</b>书还补了一句好用的：关于抑制剂说的一切，<b>对激活剂反过来说也成立</b>。<span class="pg">p059</span>'},
 {n:'02', t:'第一刀',
  big:'先分<b>不可逆</b>和<b>可逆</b>——这一刀比后面三类更根本',
  en:'“The different types are a classification by two cuts — first by whether the inhibitor comes off again, then by which form of the enzyme it binds. The first division is not competitive versus non-competitive. It is <b>irreversible</b> versus <b>reversible</b>, because they are not even described by the same equations.”',
  note:'<b>这一句是这题的骨架。</b>直接报三类，等于跳过了这一刀，而它才是分类的依据。'},

 {g:'不可逆', gn:'一句定义、一个后果、一个用途、一个例子。'},
 {n:'03', t:'不可逆是什么',
  big:'结合得<b>非常牢，多半是共价</b>；<b>修饰掉酶的功能基团</b>，把它灭活',
  en:'“The inhibitor binds very firmly, usually <b>covalently</b>, modifies the enzyme’s functional groups and thereby inactivates it.”',
  note:'<span class="pg">p059</span>'},
 {n:'04', t:'关键后果',
  big:'<b>Michaelis-Menten 方程不适用</b>——因为<b>活性酶的浓度在变</b>',
  en:'“The Michaelis–Menten equation does <b>not</b> apply to these, because the concentration of the <b>active form of the enzyme</b> is itself changing.”',
  note:'<b>这是全卡最值钱的一句。</b>它解释了为什么第一刀必须先划：可逆抑制是「同一个酶跑得慢了」，不可逆抑制是「酶越来越少」——<b>那是两个不同的模型，不是同一个模型的两种参数</b>。英文：“A reversible inhibitor leaves you the same amount of enzyme working more slowly; an irreversible one leaves you less and less enzyme — two different models, not two settings of one.”<span class="pg">p059</span>'},
 {n:'05', t:'用途和例子',
  big:'用来<b>研究酶的结构</b>；某些<b>化学战剂</b>就是靠不可逆抑制神经组织的酶起作用的',
  en:'“Irreversible inhibition is used to study enzyme structure — you covalently label one functional group — a serine hydroxyl or a cysteine thiol, say — and see which activity you lost. And the action of some chemical warfare agents has the character of irreversible inhibition of enzymes in nerve tissue.”',
  note:'<b>两个都是书给的。</b>「用来研究结构」这条很好用：它把抑制剂从「坏东西」变成了<b>工具</b>。<span class="pg">p059</span>'},

 {g:'可逆', gn:'先说共同点，再分三类。共同点里有两条是他会追的。'},
 {n:'06', t:'可逆是什么',
  big:'靠<b>弱相互作用</b>结合；<b>Michaelis-Menten 方程适用</b>',
  en:'“A reversible inhibitor binds through weak, non-covalent interactions, so it can dissociate again and the enzyme is left unmodified; because the amount of active enzyme stays constant, the Michaelis–Menten equation still applies.”',
  note:'跟不可逆正好对称。<span class="pg">p059</span>'},
 {n:'07', t:'它为什么有用',
  big:'可逆抑制剂提供关于<b>底物专一性</b>和<b>活性中心结构</b>的宝贵信息',
  en:'“Reversible inhibitors give valuable information about the substrate specificity and about the <b>structure of the active site</b>.”',
  note:'<b>又一次把抑制剂变成工具。</b>而且这一句直接接卡 18——你不能直接看见活性中心，但你可以用「什么能结合、什么不能」去画它的轮廓。英文：“You cannot see the active site directly, but you can map it: test which substrate analogues bind and which do not, and the pattern tells you what shape and which groups the site requires — the inhibitor is a probe.”<span class="pg">p059</span>'},
 {n:'08', t:'它在体内是什么',
  big:'<b>特定代谢物的可逆抑制，是中间代谢调控的重要工具</b>，也是某些药物起作用的本质',
  en:'“Reversible inhibition of enzymes by specific metabolites is an important instrument of the regulation of intermediary metabolism — and it is the basis of the action of some drugs.”',
  note:'<b>这一句把这题接到 #32 代谢调控和药理学上。</b>抑制不是意外，是细胞的控制手段。<span class="pg">p059</span>'},
 {n:'09', t:'三类的分法',
  big:'分类依据是<b>抑制剂跟酶的哪一种形式结合</b>',
  en:'“Kinetically, reversible inhibitors are divided by <b>which form of the enzyme they interact with</b> — the free enzyme, the enzyme–substrate complex, or both.”',
  note:'<b>先给依据再给名字。</b>这跟卡 01「分类的依据比名字重要」是同一个动作。<span class="pg">p059 p060</span>'},

 {g:'三类', gn:'每类三样：跟谁结合、Ki 是什么、图上什么表现。'},
 {n:'10', t:'竞争性',
  big:'只跟<b>游离酶</b>结合，只生成 <b>EI</b>；抑制剂和底物<b>争同一个结合位</b>',
  en:'“<b>Competitive</b>: the inhibitor reacts only with the free enzyme, so only the binary EI complex forms. Inhibitor and substrate compete for the <b>same binding site</b>. Its constant is K i, defined as the <b>dissociation constant</b> of EI — free enzyme times free inhibitor over EI.”',
  note:'<b>图上：Vmax 不变，Km 升高。</b>直觉：加足够多底物就能把抑制剂挤掉，所以最大速度还在，只是需要更多底物才达到一半。<span class="pg">p060</span>'},
 {n:'11', t:'竞争性的经典例子',
  big:'<b>malonate 抑制 succinate dehydrogenase</b>——像到能结合，但<b>不能被脱氢</b>',
  en:'“The classic example is <b>malonate</b> inhibiting <b>succinate dehydrogenase</b>: it resembles the substrate closely enough to bind, but it cannot be dehydrogenated — it has only one CH₂ between its two carboxyls, so there is no pair of adjacent carbons to take two hydrogens from.”',
  note:'<b>这个例子直接接卡 24</b>——succinate dehydrogenase 就是柠檬酸循环第 6 步那个酶。<b>两张卡共用一个分子。</b><span class="pg">p060</span>'},
 {n:'12', t:'反竞争性',
  big:'只跟 <b>EA 复合物</b>结合，只生成三元的 <b>EAI</b>',
  en:'“<b>Uncompetitive</b>: the inhibitor reacts only with the enzyme–substrate complex, so only the ternary EAI complex forms — it cannot bind the free enzyme, because its binding site is created only by the conformational change the substrate induces; bound to EA, it disrupts catalysis. Its constant, K i prime, is the dissociation constant of EAI. On the Lineweaver–Burk plot both V max and K m fall.”',
  note:'<b>书给了一个很实用的说明</b>：这一类在<b>单底物反应里很罕见，在双底物反应里相当常见</b>。它<b>结合不了游离酶</b>——书给了机制：抑制剂的位点是底物诱导的构象变化才造出来的，所以必须等底物先来；结合到 EA 上以后破坏催化。<b>图上：Vmax 和 Km 一起降</b>（p060）。<span class="pg">p060</span>'},
 {n:'13', t:'非竞争性',
  big:'跟 <b>E 和 EA 都结合，而且一样紧</b>（Ki = Ki′）；位点跟底物不同，所以不竞争',
  en:'“<b>Non-competitive</b>: the inhibitor binds both the free enzyme and the enzyme–substrate complex, <b>with the same affinity</b> — K i equals K i prime — so EI and EAI form equally easily. It binds at a different site from the substrate, so the two do not compete. Usually these are substances reacting with groups outside the active site that the enzyme still needs for catalysis; heavy-metal ions inhibiting SH-enzymes are the textbook’s example — they bind the sulfhydryl, the thiol group of cysteine residues, which those enzymes need to stay active.”',
  note:'<b>定义在 p060 最后三行，不是 p061 开头那句「通常是……」。</b>书的原话：跟 E 和 EA 都作用、亲和力相同（Ki = Ki′）、EI 和 EAI 一样容易生成、结合位点跟底物不同、A 和 I 不竞争。「活性中心之外的基团」是书接着说的<b>典型情形</b>（<i>Obvykle se jedná o látky…</i>），不是定义——混合型也结合在活性中心之外，能区分两者的只有「亲和力相不相等」。书给的例子：<b>重金属离子非竞争性地抑制含 SH 的酶</b>。<br><b>图上：Vmax 降低，Km 不变。</b>Km 不变的原因正是亲和力相等：抑制剂不动底物结合的平衡，只把固定的一部分酶扣在不周转的复合物里。<span class="pg">p060 p061</span>'},
 {n:'14', t:'混合型',
  big:'非竞争性的<b>一般情形</b>：跟 E 和 EA 都结合，但<b>结合得不一样紧</b>',
  en:'“<b>Mixed</b> inhibition is the general case of non-competitive: everything said about non-competitive holds, except that the interaction with E and with EA is <b>not the same</b> — the two constants differ.”',
  note:'<b>书把非竞争性说成混合型的特例</b>（两个 Ki 相等的那个特例）。这个说法比「四种平行的类型」准确。<span class="pg">p061</span>'},

 {g:'收尾', gn:'一句停住，一句伸出去。这题的落点很漂亮——它回到「结合不等于催化」。'},
 {n:'15', t:'落点',
  big:'书 p062 的机制图景（说的是竞争性那一类）：<b>能结合，但逼不动酶改变构象</b>',
  en:'“Underneath the kinetics the textbook adds one mechanistic picture, on its induced-fit page: only the true substrate can force the enzyme into its catalytic conformation, and some molecules bind but cannot trigger that change — <b>those act as inhibitors</b>. That is the competitive, substrate-analogue case said mechanistically — malonate binds succinate dehydrogenase and nothing happens. For that case, inhibition is not a separate phenomenon; it is what binding looks like when it is not followed by catalysis.”',
  note:'<b>书自己把这两件事接起来了</b>（<span class="pg">p062</span>）。说出这一句，你就从「四种类型」升到了「一个机制」。<br>停止句：“Below that, why a given molecule can bind without triggering the conformational change is a question about the energetics of the interface — physical chemistry rather than biochemistry.”'},
 {n:'16', t:'留口子',
  big:'「结合但不催化」正是<b>我在测的那件事</b>',
  en:'“That distinction — binding without turnover — is exactly what I measure. With yeast display I titrate a labelled partner and read out a dissociation constant, so I get the binding half on its own, without any catalysis involved.”',
  note:'口子落在卡 02。<b>他追下去就是 Kd</b>，那是你的主场。'}
],
end:'<b>这题的分数在两刀，不在三个名字。</b>第一刀（不可逆 vs 可逆，因为方程不一样）和最后那句（抑制＝结合了但逼不动酶），中间那三类反而是最容易背的部分。',

segs:[

recog:[
{q:'What is enzyme inhibition?',

{q:'Name the types of reversible inhibition.',

{q:'How can you tell them apart experimentally?',

{q:'Why does adding more substrate rescue one type but not the other?', odd:1,

{q:'How do nerve agents work?', odd:1,

window.CARDS.push({

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'不要一上来就背八步。先说它是什么、在哪儿、进来的是什么，这三句决定他还挖不挖。'},
 {n:'01', t:'归类',
  big:'线粒体基质里的一圈 <b>8 步酶反应</b>，把 acetyl-CoA 的乙酰基<b>彻底氧化成 2 CO₂</b>，氢交给 NAD⁺/FAD；oxaloacetate 开环也闭环。它是<b>分解</b>代谢的<b>共同终点</b>',
  en:'“The citric acid cycle — also called the tricarboxylic acid cycle — is a closed sequence of eight enzyme-catalysed reactions — those eight are the main steps the question asks for — in the mitochondrial matrix that <b>oxidises the acetyl group of acetyl-CoA completely to two CO₂</b>, putting the hydrogen onto NAD⁺ and FAD. Acetyl-CoA enters by condensing with oxaloacetate, and oxaloacetate is regenerated in the last step — recycled, not consumed. It is where the <b>catabolic</b> pathways converge — the breakdown routes, the ones that take a nutrient apart and release energy: carbohydrate arrives as pyruvate — from glycolysis, or from transamination of alanine — oxidatively decarboxylated to acetyl-CoA; fatty acids as acetyl-CoA from β-oxidation; amino acids enter at several points — most as acetyl-CoA, the rest as 2-oxoglutarate, succinyl-CoA, fumarate or oxaloacetate.”',
  note:'<b>先说它是什么（一圈反应、在哪、干什么），再说「汇合」</b>——「汇合」是它在代谢图上的位置，不是定义。书 p136 的原话：乙酰基两个碳的彻底氧化由定位在基质里的一串反应完成，oxaloacetate 是关键化合物，p139「这一步闭合循环」。八步是 Lehninger 的数法（书把 aconitase 的脱水和加水分开数）。<br><b>「氨基酸都以 acetyl-CoA 进来」是错的</b>：p126 说氨基酸的分解产物在<b>不同位置</b>接入循环，acetyl-CoA 只是最重要的入口；p127 Arg/His/Glu/Gln/Pro 经 2-oxoglutarate，p128 Met/Ile/Val 经 succinyl-CoA，p129 Asp/Asn 经 oxaloacetate，p221 Tyr/Asp 经 fumarate。书 p136 列的三个入口（丙酮酸氧化脱羧、alanine 转氨、β-氧化）只是 acetyl-CoA 这一个门。英文：“Arginine, histidine, glutamate, glutamine and proline enter as 2-oxoglutarate; methionine, isoleucine and valine as succinyl-CoA; aspartate and asparagine as oxaloacetate; tyrosine and phenylalanine give fumarate as well as acetoacetate.” 为什么绕一圈：“Because oxaloacetate is regenerated it behaves like a catalyst: a small amount can process an unlimited number of acetyl groups.”<span class="pg">p126 p136 p139</span>'},
 {g:'账', gn:'投入、产出、总结三行。只说产出是半张账——他一句「那消耗了什么」就能把你问停。'},
 {n:'02', t:'投入',
  big:'1 <b>acetyl-CoA</b> · 3 <b>NAD⁺</b> · 1 <b>FAD</b> · 1 <b>GDP ＋ Pᵢ</b> · 2 <b>H₂O</b>',
  en:'“Per turn it consumes one acetyl-CoA, three NAD-plus, one FAD, one GDP with inorganic phosphate, and two molecules of water.”',
  note:'<b>两个水常被忘掉。</b>一个在第 1 步（citryl-CoA 中间体水解放出 citrate＋CoA，Lehninger），一个在第 7 步加到 fumarate 上。aconitase 那步先脱一个水再加一个水，净零——书 p138 图上就是 −H₂O / +H₂O。英文：“One water goes in at the first step — citrate synthase hydrolyses the citryl-CoA intermediate to release citrate and CoA — and one at the seventh, added across the double bond of fumarate by fumarate hydratase. Aconitase removes one and puts one back, so it is net zero.”<br><b>注意 oxaloacetate 不算投入</b>——它在第 1 步被消耗、第 8 步被再生，是<b>被回收的</b>，不是原料。这一点他很可能追。'},
 {n:'03', t:'产出',
  big:'2 <b>CO₂</b> · 3 <b>NADH</b> · 1 <b>FADH₂</b> · 1 <b>GTP</b> · <b>CoA-SH</b>',
  en:'“And it produces two CO₂, three NADH, one FADH₂, one GTP, and the coenzyme A is released.”',
  note:'书给的总反应式：Acetyl-CoA + 3 NAD⁺ + FAD + GDP + Pᵢ + 2 H₂O → 2 CO₂ + 3 NADH + 3 H⁺ + FADH₂ + GTP + CoA。<span class="pg">p139</span>'},
 {n:'04', t:'总结（净账）',
  big:'两个碳<b>全部</b>变成 CO₂；能量<b>没有变成 ATP</b>，变成了<b>还原力</b>',
  en:'“So the net result is: two carbons enter as the acetyl group and two leave as CO₂, so no net carbon remains — and the energy is not captured as ATP, it is captured as <b>reducing power</b>, the reduced coenzymes NADH and FADH₂. Only one high-energy phosphate is made directly, and that is the GTP.”',
  note:'<b>这一行是这题最容易被问、也最容易答错的地方。</b><br>⚠ 他要是追「出去的就是那两个乙酰碳吗」——不是同一圈：这一圈放出的两个 CO₂ 来自 oxaloacetate 那一半（Lehninger），乙酰碳在后面几圈才出去；但净账是二进二出。书 p220 直接写了「动物不能把 acetyl-CoA 变回丙酮酸，所以不能用脂造糖」。<br>折算成 ATP 约 <b>12 个</b>（3 NADH ×3 ＋ 1 FADH₂ ×2 ＋ 1 GTP），<b>但那 12 个是呼吸链兑出来的，不是循环产的</b>。<br><b>「两个碳全出去了」这半句还顺带回答了「为什么脂肪不能变成糖」。</b>'},
 {n:'05', t:'地点',
  big:'在<b>线粒体基质</b>（matrix）里；只有 succinate dehydrogenase 一个酶嵌在内膜上',
  en:'“The cycle runs in the <b>matrix</b>, the inner space of the mitochondrion — with one enzyme, succinate dehydrogenase, built into the inner membrane.”',
  note:'<b>这一句必须跟下一张卡分清</b>：循环在<b>基质</b>，呼吸链在<b>内膜</b>。书 p136 明写 lokalizovaného v matrix。<b>只有一个例外</b>：succinate dehydrogenase 在内膜上，见第 6 步那一格。'},
 {n:'06', t:'兑换率',
  big:'还原力换 ATP 的价钱：约 <b>3 ATP / NADH</b>、<b>2 ATP / FADH₂</b>',
  en:'“The respiratory chain converts them at roughly three ATP per NADH and two per FADH₂ — three because NADH enters at complex I and six protons are pumped, two because succinate enters at complex II, bypasses complex I, and only four are pumped.”',
  note:'<b>这个价钱是下面那笔总账的依据。</b>书直接给了这两个比例。<span class="pg">p139</span>'},

 {g:'八步', gn:'每步只记「谁变成谁 ＋ 那个酶」。中间产物的结构式不用背。'},
 {n:'07', t:'第 1 步 · 缩合',
  big:'<b>oxaloacetate ＋ acetyl-CoA → citrate</b>，酶是 <b>citrate synthase</b>',
  en:'“Acetyl-CoA condenses with oxaloacetate to give citrate. The enzyme is <b>citrate synthase</b>, and it is a <b>regulatory</b> enzyme — strongly inhibited by ATP, and in some organisms by NADH.”',
  note:'<b>为什么 acetyl-CoA 能做这个反应</b>：它是<b>硫酯</b>，硫酯没有普通 O-酯那样的中介效应，所以羰基结构被固定住，甲基能参加<b>羟醛缩合</b>。<b>这一句把「化学键」那张横向卡接进来了。</b><span class="pg">p136</span>'},
 {n:'08', t:'第 2 步 · 异构',
  big:'<b>citrate → isocitrate</b>，中间经 <b>cis-aconitate</b>，酶是 <b>aconitate hydratase</b>',
  en:'“Citrate has a <b>tertiary</b> alcohol, which cannot be oxidised. So it is first isomerised to isocitrate, whose <b>secondary</b> alcohol can be dehydrogenated. The enzyme is aconitate hydratase — it dehydrates to cis-aconitate and adds water back the other way.”',
  note:'<b>这一步的「为什么」书直接给了</b>：叔醇不能再氧化，仲醇可以。<b>整个第 2 步存在的唯一理由就是把 OH 挪到能被脱氢的位置。</b>记这个比记名字有用。<span class="pg">p138</span>'},
 {n:'09', t:'第 3 步 · 第一次氧化脱羧',
  big:'<b>isocitrate → 2-oxoglutarate</b>，酶是 <b>isocitrate dehydrogenase</b>（NAD⁺），放 <b>第一个 CO₂</b> ＋ 第一个 <b>NADH</b>',
  en:'“Isocitrate dehydrogenase, NAD⁺-dependent, oxidises isocitrate to oxalosuccinate, which decarboxylates to 2-oxoglutarate — first CO₂, first NADH.”',
  note:'<b>为什么会自动脱羧</b>：oxalosuccinate 的一个羧基处在羰基的 β 位，这类 <b>β-酮酸会自发脱羧</b>，是放能反应。<b>书说 β-酮酸分解和 2-酮酸的氧化脱羧是生化系统里 CO₂ 的两大来源。</b><span class="pg">p138</span>'},
 {n:'10', t:'第 4 步 · 第二次氧化脱羧',
  big:'<b>2-oxoglutarate → succinyl-CoA</b>，放<b>第二个 CO₂</b> ＋ 第二个 <b>NADH</b>',
  en:'“2-oxoglutarate undergoes the same oxidative decarboxylation as pyruvate — the carboxyl next to the keto group leaves as CO₂ while the rest is dehydrogenated and ends up as an acyl-CoA thioester, with NAD⁺ reduced — because it is a <b>homologue of pyruvate</b>: pyruvate with a CH₂–COO⁻ on its methyl, so its 2-oxo-acid end reacts the same way. The 2-oxoglutarate dehydrogenase complex does it, with the same five cofactors as the pyruvate dehydrogenase complex: thiamine diphosphate takes up the fragment after the CO₂ leaves, lipoic acid oxidises it and carries the succinyl group, coenzyme A receives it as a thioester, and FAD and then NAD⁺ reoxidise the lipoate. It gives succinyl-CoA, the second CO₂ and the second NADH.”',
  note:'<b>「它是丙酮酸的同系物」这句话省掉了一整个机制。</b>丙酮酸脱氢那套（thiamine diphosphate 等）原样搬过来。<b>到这里两个碳已经全部作为 CO₂ 出去了。</b><span class="pg">p138</span>'},
 {n:'11', t:'第 5 步 · 底物水平磷酸化',
  big:'<b>succinyl-CoA → succinate</b>，同时造出 <b>GTP</b>，酶是 <b>succinyl-CoA synthetase</b>',
  en:'“Succinyl-CoA is a <b>macroergic</b> compound, so it does not just hydrolyse — the energy is captured. It reacts with GDP and inorganic phosphate to give succinate and GTP, and the terminal phosphate of GTP can be passed to ADP by nucleoside diphosphate kinase, so it counts as one ATP.”',
  note:'<b>这是整个循环里唯一直接造出高能磷酸的一步</b>，叫<b>底物水平磷酸化</b>。它之所以可能，是因为硫酯键是高能的——<b>又一次接回「化学键」那张卡</b>。<span class="pg">p139</span>'},
 {n:'12', t:'第 6 步 · 唯一在膜上的一步',
  big:'<b>succinate → fumarate</b>，酶是 <b>succinate dehydrogenase</b>，产 <b>FADH₂</b>',
  en:'“Succinate is oxidised to fumarate by succinate dehydrogenase, which carries a <b>covalently bound FAD</b> and is built into the inner membrane — the textbook identifies it as complex II of the respiratory chain. This is the one step that gives FADH₂ rather than NADH.”',
  note:'<b>两件事要记住</b>：① FAD 是<b>共价</b>结合的，不是自由辅酶；② <b>这个酶坐在线粒体内膜上</b>，是循环里唯一不在基质里的一步，也正因如此它同时是呼吸链的复合物 II。<br>「它就是复合物 II」<b>书 p143 直接说了</b>（<i>Je to sukcinátdehydrogenasa známá z citrátového cyklu</i>；复合物 II = 琥珀酸:泛醌氧化还原酶，含 FAD 和两个 FeS），p141 说这些复合物是内膜的整合成分。英文：“Complex II is succinate:ubiquinone oxidoreductase — a flavoprotein with FAD and two iron–sulfur centres that passes the electrons from succinate to ubiquinone, bypassing complex I; that is why succinate is worth only two ATP.”<span class="pg">p139 p143</span>'},
 {n:'13', t:'第 7 步 · 加水',
  big:'<b>fumarate → L-malate</b>，酶是 <b>fumarate hydratase</b>（fumarase）',
  en:'“Fumarate is formed as the <b>trans</b> isomer, and fumarate hydratase adds water across the double bond to give L-malate — the same kind of hydration as in the aconitase step, where water adds to cis-aconitate.”',
  note:'<b>书自己点了这个类比</b>（跟 aconitate hydratase 那一步同类）。反式这个细节值得说，因为酶只接受反式：“Fumarate hydratase is stereospecific: it hydrates only the trans isomer, fumarate — not the cis isomer, maleate — and gives only L-malate.”<span class="pg">p139</span>'},
 {n:'14', t:'第 8 步 · 闭环',
  big:'<b>L-malate → oxaloacetate</b>，酶是 <b>malate dehydrogenase</b>，产<b>第三个 NADH</b>',
  en:'“Malate dehydrogenase produces the third NADH and regenerates oxaloacetate, which closes the cycle.”',
  note:'<b>书顺带补了一句很好用的</b>：oxaloacetate 跟 oxalosuccinate 一样是 β-酮酸，<b>但它稳定得多</b>——所以它不会像第 3 步那个中间体一样自己脱羧掉。<span class="pg">p139</span>'},

 {g:'能量账', gn:'他很可能追这个，而且书把数字都给齐了。'},
 {n:'15', t:'一个乙酰基',
  big:'<b>12 ATP</b>：3 NADH ×3 ＋ 1 FADH₂ ×2 ＋ 1 GTP',
  en:'“Per acetyl group, the cycle together with the respiratory chain yields about twelve ATP: three NADH at roughly three each, one FADH₂ at two, plus the one GTP the cycle makes itself. Those are the textbook’s classical yields; modern textbooks use 2.5 and 1.5, giving ten.”',
  note:'书给的总式：CH₃CO-S-CoA + 2 O₂ + 12 ADP + 12 Pᵢ → 2 CO₂ + CoA-SH + <b>12 ATP</b> + 13 H₂O。<b>「连呼吸链一起」这半句必须说</b>，不然跟下面「循环本身只产一个 GTP」自相矛盾。<br><b>他要是问「为什么现代教材说 10、30–32」</b>：差别只在每个 ATP 假设泵几个质子，葡萄糖总数上还差在胞质 NADH 用哪条穿梭进线粒体。书用 3 和 2（p139、p146），Lehninger 用 2.5 和 1.5。英文：“Because the yield depends on how many protons are pumped per NADH and how many the ATP synthase needs per ATP. The textbook takes six protons per NADH as about three ATP and four per FADH₂ as about two; modern measurements give about 2.5 and 1.5, so ten per acetyl group. For a whole glucose there is a second difference: the two NADH from glycolysis are made in the cytosol and must enter the mitochondrion through a shuttle — the glycerol-3-phosphate shuttle hands them to FAD, worth 1.5 each, the malate–aspartate shuttle to NAD⁺, worth 2.5 — which is why the modern total is quoted as 30 to 32.”<span class="pg">p139</span>'},
 {n:'16', t:'一分子葡萄糖',
  big:'有氧共 <b>38 ATP</b>：糖酵解 8 ＋ 丙酮酸氧化脱羧 6 ＋ 柠檬酸循环 <b>24</b>',
  en:'“For one mole of glucose aerobically: eight from glycolysis, six from the oxidative decarboxylation of pyruvate, and twenty-four from the cycle — thirty-eight in total. Anaerobically, lactate fermentation gives only two.”',
  note:'<b>2 对 38 这个对比是书自己做的</b>，而且它给了一个进化上的结论：<b>好氧降解是演化上更高级的</b>。这一句是现成的 ④。<span class="pg">p136 p139</span>'},

 {g:'收尾', gn:'一句停住，一句伸出去。'},
 {n:'17', t:'落点',
  big:'循环不产能，<b>它把能量搬进了辅酶的还原态</b>——真正兑现在内膜上',
  en:'“So the cycle is not where the energy becomes ATP. It captures the energy in the reduced coenzymes, and in the <b>inner membrane</b> the respiratory chain turns that into a proton gradient, which ATP synthase — complex V — turns into ATP. Below that we are asking how a membrane converts a proton gradient into chemical work, which is bioenergetics rather than the cycle itself.”',
  note:'落在<b>热力学</b>那块地基上，而且顺手把 #25 #26 划成了另一个话题——<b>这是体面的收手，不是回避。</b>'},
 {n:'18', t:'留口子',
  big:'它<b>不只是分解</b>：中间产物同时是<b>合成</b>的原料',
  en:'“One thing worth adding: the cycle is not purely catabolic. 2-oxoglutarate and oxaloacetate are the carbon skeletons for glutamate and aspartate, and succinyl-CoA is a precursor of porphyrins — the textbook has a whole section on that. So it is also a supply depot — and draining any intermediate lowers oxaloacetate, so the cell has replenishing, anaplerotic, reactions; the most important is pyruvate carboxylase, which makes oxaloacetate from pyruvate and CO₂ at the cost of one ATP, with biotin as cofactor.”',
  note:'<b>「amphibolic（两性代谢）」这个概念不用说出这个词</b>，说出现象就够；他说了你要听得懂：“Amphibolic means serving both catabolism and anabolism — the cycle oxidises acetyl-CoA and at the same time supplies carbon skeletons for glutamate, aspartate and porphyrins.”<br>口子留在 <b>succinyl-CoA → 卟啉</b>（书 §6.3，p146）和 <b>氨基酸碳骨架</b>（#32 代谢调控）。'}
],
end:'<b>八步里真正要背的是「谁变成谁 ＋ 酶名」，不是结构式。</b>四个「为什么」（叔醇不能氧化、β-酮酸自发脱羧、硫酯是高能的、FAD 共价结合）比八个名字更值钱，因为它们是他追问时的落点。',

segs:[
 {tag:'段 1 · 定义', h:'先说它是什么、在哪儿',
  p:['“The citric acid cycle — also called the tricarboxylic acid cycle — is a closed sequence of eight enzyme reactions — the main steps — in the mitochondrial matrix that oxidises the acetyl group of acetyl-CoA completely to two CO₂, putting the hydrogen onto NAD⁺ and FAD; oxaloacetate opens the cycle and is regenerated at the end. It is where the <b>catabolic</b> pathways converge, the breakdown routes that take a nutrient apart and release energy: carbohydrate and fat arrive as acetyl-CoA, amino acids there, or as 2-oxoglutarate, succinyl-CoA, fumarate or oxaloacetate.',
     'The cycle oxidises that acetyl group to two molecules of CO₂, and it runs in the <b>matrix</b>, the inner space of the mitochondrion.”'],
  note:'<b>「汇合」是这题的骨架。</b>书列的三个入口：糖酵解来的丙酮酸经氧化脱羧、alanine 转氨、脂肪酸 β-氧化。'},
 {tag:'段 2 · general', h:'先说产物和意义，再说八步',
  p:['“Per acetyl group it gives two CO₂, three NADH, one FADH₂ and one GTP.',
     'The important point is that the cycle itself captures almost no ATP directly — just that one GTP. What it really produces is <b>reducing power</b>, and that is cashed in later in the inner membrane — the respiratory chain makes the proton gradient, ATP synthase makes the ATP — at roughly three ATP per NADH and two per FADH₂.”'],
  note:'<b>先给产物和意义，再给步骤。</b>直接背八步是 technician 的答法；先说「它产的是还原力不是 ATP」，他就知道你理解了它在代谢里的位置。'},
 {tag:'段 3 · 稍展开', h:'八步，每步只给「谁变成谁 ＋ 酶」',
  p:['“Acetyl-CoA condenses with oxaloacetate to citrate — <b>citrate synthase</b>, a regulatory enzyme inhibited by ATP.',
     'Citrate is isomerised to isocitrate through cis-aconitate — <b>aconitate hydratase</b>. The reason is chemical: citrate’s alcohol is tertiary and cannot be oxidised, isocitrate’s is secondary and can.',
     'Isocitrate dehydrogenase oxidises isocitrate, which decarboxylates to 2-oxoglutarate — first CO₂, first NADH. Then 2-oxoglutarate undergoes the same oxidative decarboxylation as pyruvate — the carboxyl next to the keto group leaves as CO₂, the rest is dehydrogenated into an acyl-CoA thioester — giving succinyl-CoA — second CO₂, second NADH.',
     'Succinyl-CoA is macroergic, so instead of simply hydrolysing it reacts with GDP and phosphate — <b>succinyl-CoA synthetase</b> — giving succinate and GTP.',
     'Then three steps back to the start: succinate to fumarate by <b>succinate dehydrogenase</b> with its covalently bound FAD, fumarate to malate by <b>fumarate hydratase</b>, and malate to oxaloacetate by <b>malate dehydrogenase</b>, giving the third NADH.”'],
  note:'<b>时间不够就砍到四句</b>：缩合、异构、两次氧化脱羧、然后三步回到 oxaloacetate。<b>四个「为什么」不要砍</b>，那是他追问时的落点。'},
 {tag:'段 4 · 留口子', h:'说出它不只是分解',
  p:['“One thing worth adding: the cycle is not purely catabolic. 2-oxoglutarate and oxaloacetate are the carbon skeletons that amino acids are built from and broken down to, and succinyl-CoA together with glycine is the starting point for porphyrin synthesis — the textbook has a separate section on that. So the cycle is also a supply depot — and because draining any intermediate lowers oxaloacetate, the textbook adds the replenishing, anaplerotic, reactions, above all pyruvate carboxylase: oxaloacetate from pyruvate and CO₂, one ATP, biotin.”'],
  note:'口子留在 <b>succinyl-CoA ＋ glycine → δ-aminolevulinate → 卟啉</b>（书 §6.3，<span class="pg">p146</span>）和氨基酸碳骨架（#32）。<b>两个都在书里，追下去都答得住。</b>'}
],

recog:[
{q:'The citric acid cycle.',
 mean:'他也可能说 “Tell me about the citric acid cycle.”。<b>他真正会说的那句，比卷面短得多。</b>所以答案要自带结构：是什么 → 在哪 → 产什么 → 意义，然后才是步骤。<b>不要一上来就背八步。</b>',
 say:'“It is the closed sequence of eight reactions in the mitochondrial matrix that oxidises the acetyl group of acetyl-CoA to two CO₂ and hands the hydrogen to NAD⁺ and FAD. It is where the catabolic pathways converge — sugar and fat arrive as acetyl-CoA, amino acids there, or as 2-oxoglutarate, succinyl-CoA, fumarate or oxaloacetate. Per acetyl group it gives three NADH, one FADH₂ and one GTP — so what it really produces is reducing power, not ATP. The ATP comes later, in the respiratory chain.”'},

{q:'How much ATP does the citric acid cycle produce?',
 mean:'<b>陷阱问法。</b>直接报数字就上钩了——先纠正前提。',
 say:'“Directly, one GTP per turn — that is all. Of the twelve usually quoted per acetyl group, eleven are made by the respiratory chain from the three NADH and one FADH₂ the cycle hands it; the twelfth is that GTP.”'},

{q:'Which step is regulated?',
 mean:'书只点了一个调节酶，报它，并给抑制剂。',
 say:'“The textbook singles out citrate synthase, the first step — strongly inhibited by ATP, and in some organisms by NADH, which makes sense: both are the products the cycle exists to make. The standard account adds isocitrate dehydrogenase and the 2-oxoglutarate dehydrogenase complex; all three are inhibited by ATP and NADH and activated by ADP, so the cycle slows when the cell is energy-rich.”'},

{q:'Why do you get more energy from fat than from sugar?', odd:1,
 mean:'<b>听起来是营养学题。</b>答案是脂肪酸 β-氧化产出更多 acetyl-CoA 进入同一个循环，加上脂更还原。',
 say:'“Because fat is more <b>reduced</b>. A fatty acid is a chain of CH₂ groups with no oxygen, while every carbon of glucose already carries an oxygen — so per carbon, fat has more hydrogen to hand to NAD⁺ and FAD and more electrons for the respiratory chain. The textbook’s figures: glucose −2 870 kJ per mole, palmitic acid −11 340 — about one and a half times more per carbon. Both are burned in the same cycle; β-oxidation — the mitochondrial breakdown of an activated fatty acid, acyl-CoA, that oxidises the β-carbon and cuts off two carbons at a time as acetyl-CoA, one FADH₂ and one NADH per cut — just delivers the fat as acetyl-CoA.”',
 tail:'「更还原」这层书没有直接说，但 p135 给了数字（葡萄糖 −2 870、棕榈酸 −11 340 kJ/mol），按碳算约 1.5 倍——拿数字说比拿理论说稳。β-氧化 p220。'},

{q:'Why can’t you turn fat into sugar?', odd:1,
 mean:'<b>问的是乙酰基的两个碳全变成 CO₂ 出去了。</b>而且书给了唯一的例外。',
 say:'“Because two carbons enter as the acetyl group and two leave as CO₂, so there is no net carbon left to build glucose from — the textbook says it directly: the animal cannot turn acetyl-CoA back into pyruvate, so it cannot make sugar from fat. The exception the textbook gives is the <b>glyoxylate cycle</b> — bacteria and germinating oil seeds use it to bypass the two decarboxylations, which is exactly why they can grow on acetate.”',
 tail:'<b>这一条非常好用</b>：一个「不能」加一个书里的例外，正是 researcher 的答法。<span class="pg">p140 p141</span>'},

{q:'Why does the cycle keep running even when the cell has plenty of ATP?', odd:1,
 mean:'问的是<b>它不只是分解</b>——留口子那一格。',
 say:'“It slows, but it does not stop. It slows because citrate synthase is inhibited by ATP; it does not stop because the cycle is also a supply depot — 2-oxoglutarate and oxaloacetate are the carbon skeletons for glutamate and aspartate, succinyl-CoA the precursor of porphyrins — and those are needed whether or not the cell needs ATP. Draining them lowers oxaloacetate, so anaplerotic reactions, above all pyruvate carboxylase, refill it.”'},

{q:'What is acetyl-CoA and why is it special?',
 mean:'接<b>化学键</b>那张横向卡。',
 say:'“It is a <b>thioester</b> — the acetyl group is bound to the free SH of coenzyme A. The textbook calls thioesters generally very reactive and acetyl-CoA a macroergic compound. That reactivity is what lets its methyl group do the aldol condensation with oxaloacetate in the first step.”'},

{q:'Which steps produce CO₂?',
 mean:'两步，而且书给了它们的共同机制。',
 say:'“Two: isocitrate to 2-oxoglutarate, and 2-oxoglutarate to succinyl-CoA. The textbook notes that the decarboxylation of <b>beta-keto acids</b> and the oxidative decarboxylation of <b>2-oxo acids</b> are the two main sources of CO₂ in biochemical systems — and the cycle uses one of each. A 2-oxo acid — α-keto acid — has its keto group on the carbon next to the carboxyl: pyruvate, 2-oxoglutarate; a β-keto acid, or 3-oxo acid, has it one carbon further along: oxalosuccinate, oxaloacetate. The first is decarboxylated oxidatively by a dehydrogenase complex; the second decarboxylates spontaneously.”'},

{q:'Which step gives FADH₂ rather than NADH?',
 mean:'一步，而且它有两个特别之处。',
 say:'“Succinate to fumarate, by succinate dehydrogenase. Two things are unusual about it: the FAD is <b>covalently</b> bound rather than a free coenzyme, and the enzyme sits in the inner membrane rather than in the matrix.”'},

{q:'What is substrate-level phosphorylation?',
 mean:'循环里只有一处，正好当例子。',
 say:'“Substrate-level phosphorylation is the formation of ATP or GTP by transferring a phosphoryl group from a high-energy substrate intermediate directly onto ADP or GDP, by a soluble enzyme — no membrane, no proton gradient. The textbook’s example is 1,3-bisphosphoglycerate in glycolysis. In this cycle it happens once: succinyl-CoA is macroergic — a thioester with about 30 kJ per mole of hydrolysis energy — so instead of just hydrolysing, it reacts with GDP and inorganic phosphate to give GTP, and that phosphate can be handed on to ADP.”'}
],

/* ---------------- 追问 ---------------- */
ask:[
{g:'定义类', gn:'他会单独拎出来问的名词。', items:[
{r:'中', q:'Where does it happen?',
 en:'“In the matrix, the inner space of the mitochondrion. With one exception — succinate dehydrogenase sits in the inner membrane, which is also why that step feeds its electrons straight to ubiquinone — the enzyme is complex II of the chain.”',
 cn:'一个词的答案，但<b>那个例外值得主动说</b>。'},
{r:'中', q:'What are NAD⁺ and FAD — and what is NADH?',
 en:'“NAD⁺ and FAD are the coenzymes of the dehydrogenases in their oxidised form: they accept the hydrogen — two electrons with protons — that a dehydrogenase strips from its substrate. NAD⁺ takes a hydride and becomes NADH; FAD takes two hydrogens and becomes FADH₂. The reduced forms carry that energy to the respiratory chain, which reoxidises them and makes the ATP. NAD⁺ is loosely bound and moves between enzymes; the FAD of succinate dehydrogenase is covalently bound, a prosthetic group.”',
 cn:'<b>这张卡用得最多的名词，之前没正面定义。</b>'},
{r:'中', q:'What is oxaloacetate?',
 en:'“The four-carbon 2-oxo dicarboxylic acid that accepts the acetyl group in the first step and is regenerated in the last — the textbook calls it the key compound of the cycle, and because it comes back it is a carrier, not a reactant. It is also a β-keto acid, but a stable one, and by transamination it is the carbon skeleton of aspartate.”',
 cn:'书叫它「循环的关键化合物」（p136）。'},
]},
{g:'为什么类', gn:'四个「为什么」，全部有书作根据。这一组比八个酶名值钱。', items:[
{r:'高', q:'What is oxidative decarboxylation?',
 en:'“The conversion of a 2-oxo acid into the acyl-CoA one carbon shorter: the carboxyl next to the keto group leaves as CO₂ while the remaining carbonyl carbon is oxidised to an acyl group and captured as a thioester on coenzyme A, with NAD⁺ reduced. A multienzyme complex does it, with thiamine diphosphate, lipoate, coenzyme A, FAD and NAD⁺. Pyruvate to acetyl-CoA and 2-oxoglutarate to succinyl-CoA are the two cases in this topic.”',
 cn:'p168–p169，p138。'},
{r:'高', q:'Are the two CO₂ released the two acetyl carbons?',
 en:'“Not in the same turn. Both CO₂ released in one turn come from the oxaloacetate half of citrate; the two acetyl carbons stay in the four-carbon acids and leave as CO₂ only in later turns — succinate is symmetrical, so they get scrambled. The net balance is still two carbons in as acetyl, two out as CO₂.”',
 cn:'Lehninger；书只给净式（p139）。'},
{r:'高', q:'Why does citrate have to be isomerised first?',
 en:'“Because citrate carries a <b>tertiary</b> alcohol, and a tertiary alcohol cannot be oxidised further — its OH sits on a carbon bonded to three other carbons, so that carbon carries no hydrogen, and dehydrogenation means removing the hydrogen on that carbon together with the hydrogen of the OH: there is nothing to take. Isocitrate carries a <b>secondary</b> one, whose carbon has one hydrogen, so it can be dehydrogenated to a ketone. The isomerisation produces no energy and releases no carbon — its only job is to make the next step possible.”',
 cn:'<b>书直接给了这个理由</b>（<span class="pg">p138</span>）。这是全循环里最容易被问、也最容易答不上的一步——因为它看起来「多余」。'},
{r:'高', q:'Why does oxalosuccinate decarboxylate on its own?',
 en:'“Because one of its carboxyls sits in the <b>beta</b> position relative to the carbonyl. Beta-keto acids decarboxylate spontaneously, and it is an exergonic reaction — it releases Gibbs energy, so it runs on its own.”',
 cn:'书还顺带给了一个很好用的普遍结论：<b>β-酮酸分解 ＋ 2-酮酸的氧化脱羧，是生化系统里 CO₂ 的两大来源</b>。<br>被继续追「那 oxaloacetate 也是 β-酮酸，为什么它不脱羧」——<b>书自己回答了：它稳定得多。</b>“Oxaloacetate is also a β-keto acid, but it is much more stable, so it does not decarboxylate on its own the way oxalosuccinate does — that is why it survives to accept the next acetyl group.”<span class="pg">p138 p139</span>'},
{r:'高', q:'Why does acetyl-CoA react at all — what makes its methyl group reactive?',
 en:'“Because the thioester bond blocks the resonance — mesomerism — that stabilises an ordinary O-ester: sulfur’s lone pair does not delocalise into the carbonyl. That leaves a real carbonyl, and with the carbonyl fixed the methyl group can act as the nucleophile in the condensation with oxaloacetate — the textbook calls it an <b>aldol condensation</b> — the α-carbon of one carbonyl compound joining the carbonyl carbon of another, giving a β-hydroxy carbonyl, here citryl-CoA — Lehninger a Claisen-type condensation, because the nucleophile is a thioester enolate — which is exactly the first step of the cycle.”',
 cn:'<b>这一条把「化学键」那张横向卡接了进来</b>，而且它解释了为什么细胞非要用硫酯不用普通酯。<span class="pg">p136</span>'},
{r:'中', q:'Why store the energy as NADH instead of making ATP directly?',
 en:'“Because the cell can only capture energy in packets of about 30 kJ per mole — one ATP. Oxidising NADH with oxygen releases far more than one packet, so the electrons are parked on NADH and let down the respiratory chain stepwise, each step matched to proton pumping and, through the gradient, to ATP.”',
 cn:'书 p134–p135 给了根据：能量的生成和消耗都是「量子化」的，机体只能以约 30 kJ/mol 的份额（一个 ATP）捕获能量。比原来那句「在膜上统一结算」有书可依。'}
]},

{g:'相邻考点', gn:'第 6 章紧挨着的内容，他从这题走出去多半走这几个方向。', items:[
{r:'高', q:'What is the glyoxylate cycle?',
 en:'“A modification of the citric acid cycle in some microorganisms and plants that skips the two decarboxylations, so acetyl-CoA is not degraded but used to build a four-carbon dicarboxylic acid. Two extra enzymes do it: isocitrate lyase splits isocitrate into succinate and glyoxylate, and malate synthase joins glyoxylate with a second acetyl-CoA to give malate. Net, two acetyl-CoA give one oxaloacetate plus two NADH and one FADH₂ — about eight ATP. It is why many bacteria can grow on acetate, and how germinating oil seeds turn stored fat into the sugar they need.”',
 cn:'<b>书单独给了它一节</b>（§6.2.3，<span class="pg">p140 p141</span>）。它是「为什么动物不能把脂肪变成糖」那道题的正解，<b>一个「不能」加一个书里的例外</b>。'},
{r:'高', q:'What happens to the NADH afterwards?',
 en:'“It goes into the respiratory chain — the series of electron carriers in the <b>inner mitochondrial membrane</b>, complexes I to IV with ubiquinone and cytochrome c between them — a different compartment from the cycle itself. NADH is oxidised by complex I, NADH:ubiquinone oxidoreductase; the electrons go to ubiquinone, complex III, cytochrome c and complex IV, from lower to higher redox potential — the measure of how strongly a redox pair holds its electrons, NADH/NAD⁺ at about −0.32 volts, oxygen at +0.82 — and finally to oxygen, while protons are pumped into the intermembrane space; ATP synthase makes ATP by letting them back.”',
 cn:'书 §6.2.4 从 <span class="pg">p141</span> 开始。<b>循环在基质、呼吸链在内膜</b>——这个区室的区别是两道题的分界线（#25 #26）。'},
{r:'中', q:'Where does succinyl-CoA go if not round the cycle?',
 en:'“Into porphyrin synthesis. Succinyl-CoA and glycine give delta-aminolevulinate, and the enzyme that does it — delta-aminolevulinate synthase — is the <b>key regulatory point</b> of porphyrin synthesis.”',
 cn:'书 §6.3（<span class="pg">p146</span>）。<b>这条同时接卡 01 的血红素、和 glycine 的去向。</b>'},
{r:'中', q:'Why is aerobic metabolism worth the trouble?',
 en:'“Because it yields nineteen times more ATP per glucose: two by lactate fermentation, theoretically thirty-eight aerobically. The textbook adds that aerobic degradation of carbohydrates is <b>evolutionarily the later, higher form</b>.”',

 cn:'书还有一张 <b>Tab. 6.3「柠檬酸循环的酶及其辅因子」</b>（<span class="pg">p136</span>），OCR 出来碎了。<b>⚠ 待办：回 300 dpi 原图抄这张表。</b><br>另外 isocitrate dehydrogenase 这个名字 OCR 没直接给出，是从反应推的——<b>也要回原图核。</b>辅因子被问（原图核对前按通用说）：“The cofactors: isocitrate dehydrogenase and malate dehydrogenase use NAD⁺; the 2-oxoglutarate dehydrogenase complex uses thiamine diphosphate, lipoic acid, coenzyme A, FAD and NAD⁺; succinate dehydrogenase has covalently bound FAD and iron–sulfur centres; succinyl-CoA synthetase needs GDP and phosphate; aconitase carries an iron–sulfur cluster; citrate synthase and fumarase need no cofactor.”'},
{r:'中', q:'中间产物按顺序',

<script>
/* data/aa.js */
/* 卡 aa · List all proteinogenic amino acids and describe one characteristic property of each.
   题库 #1（S1 Biochemistry 1 ＋ S2 Biochemistry 10）· 导师写过两遍
   出处 Biochemie OCR p021–p026（§2.1 全节：分组 p021 · 稀有氨基酸 p022 · 酸碱与甘氨酸滴定 p023 ·
        立体化学与紫外吸收 p024 · 反应 p024–p025 · 肽键 p026）；
        每种氨基酸「在哪里干活」的页码散在全书：p027 p029 p031 p032 p034 p036 p046–p049 p061–p063
        p068 p070 p082 p093–p094 p097 p102 p104 p109 p112–p114 p116 p119–p129 p146 p215 p225 p227 p228
   id 用 aa，因为 01 已经是蛋白质结构那张。 */

window.CARDS.push({
id:'aa', n:1, w:3,
q:'List all proteinogenic amino acids and describe one characteristic property of each.',
qcn:'列出全部蛋白原氨基酸，并各说一个特征性质',
sub:'主干说完约 90 秒 · 口试他多半只说 “Name the amino acids.” 然后随手挑一个问 “and what is characteristic about it?”',

/* ---------------- 速背 ---------------- */
cram:[
 {g:'开口', gn:'先定义、再划边界、再给共同骨架。二十个名字是第四步，不是第一步——先报名字等于把结构送给他挑。'},
 {n:'01', t:'定义',
  big:'氨基酸 = <b>同时带一个羧基和一个氨基</b>的有机物；蛋白原的那 20 个，<b>氨基永远在 α 碳上</b>',
  en:'“An amino acid is an organic compound that carries both a <b>carboxyl group</b> and an <b>amino group</b>. Living organisms contain many such compounds, but a small group of twenty has a special position: they are the building blocks of proteins, and in all of them the amino group sits on the <b>α-carbon</b> — the carbon next to the carboxyl. They are also the starting material for every nitrogen compound the organism needs.”',
  note:'书 p021 开篇三句，照着说。<b>「α 碳」要点名</b>——它是后面手性、两性离子、肽键三件事共用的那个原子。<span class="pg">p021</span>'},
 {n:'02', t:'proteinogenic 是什么意思',
  big:'<b>被装进蛋白质、而且有密码子编码</b>的那 20 个；稀有的（羟脯氨酸）是翻译后改出来的，<b>没有密码子</b>',
  en:'“<b>Proteinogenic</b> means the amino acids that are built into proteins <b>and for which a genetic code exists</b> — twenty of them. The textbook draws two further circles. Rare ones found in some proteins — 4-hydroxyproline and 5-hydroxylysine in collagen, desmosine in elastin — are derivatives, made by modifying a residue <b>already in the chain</b>; there is no codon for them. And over a hundred and fifty amino acids occur in cells free or bound but <b>never in proteins</b> — citrulline and ornithine of the urea cycle, β-alanine in coenzyme A, D-glutamate in bacterial cell walls.”',
  note:'三个圈：<b>有密码子的 20 个 → 翻译后改出来的 → 根本不进蛋白的</b>。「没有密码子」这条边界跟卡 13 的定义共用。<span class="pg">p021 p022 p023</span>',
  good:'<b>第 21 个：书自己给了。</b>p093 Tab. 4.3 的脚注：终止密码子 UGA 在 mRNA 有特定序列（<b>SECIS 元件</b>）时被读成 <b>selenocysteine</b>。<br>“Strictly there is a twenty-first: the textbook’s own codon table notes that UGA, normally a stop, is read as <b>selenocysteine</b> when the mRNA carries a SECIS element. So ‘twenty’ is the standard set, with selenocysteine as the coded exception.”<span class="pg">p093</span>'},
 {n:'03', t:'共同骨架 ＋ 怎么画',
  big:'一个 α 碳上挂四样：<b>H · NH₂ · COOH · R</b>。只有 R 不同；<b>除 proline 外都有自由的 α-氨基</b>',
  en:'“Every one of the twenty has the same backbone: one α-carbon carrying a <b>hydrogen</b>, an <b>amino group</b>, a <b>carboxyl group</b>, and a <b>side chain</b> called R. Everything that distinguishes them is in R — and that is where the one <b>characteristic property</b> of each amino acid lives: the property is what its side chain can do — its charge, its polarity, its ring, its sulfur. All of them except proline have a free, unsubstituted α-amino group.”',
  note:'<b>画的顺序（他让你画就这样画）：</b>① 中间写一个 C，标 α；② 左边 H₂N–，右边 –COOH，上面 H，下面 R。<b>glycine</b>：把 R 换成 H；<b>alanine</b>：把 R 换成 CH₃。<b>两性离子</b>：左边写 H₃N⁺–，右边写 –COO⁻，其余不动。<b>L 型的 Fischer 投影</b>：COOH 在上、R 在下、<b>NH₂ 在左</b>（书 p024 就是这样画 L-serine 的）。<span class="pg">p021 p024</span>'},

 {g:'归类', gn:'书按侧链性质分四组，glycine 放不进去。先报组和数目，再报名字——这样他挑哪一个，你都已经说了它属于哪类。'},
 {n:'04', t:'书的四组',
  big:'<b>非极性 8</b>（5 脂肪 ＋ 2 芳香 ＋ 1 含硫）· <b>极性不带电 6</b>（3 羟基 ＋ 2 酰胺 ＋ 1 巯基）· <b>带负电 2</b> · <b>带正电 3</b> · <b>glycine 单列</b> = 20',
  en:'“The textbook divides them by the <b>nature of the side chain</b> into four groups. <b>Nonpolar</b>, eight: five with an aliphatic chain — alanine, valine, leucine, isoleucine, proline; two with an aromatic ring — phenylalanine, tryptophan; and one containing sulfur — methionine. <b>Polar but uncharged</b>, six: three with a hydroxyl — serine, threonine, tyrosine; two with an amide — asparagine, glutamine; and one with a thiol — cysteine. <b>Negatively charged</b>, two: aspartate and glutamate, each with a second carboxyl. <b>Positively charged</b>, three: lysine with a second amino group, arginine with a guanidine group, histidine with a weakly basic imidazole. And <b>glycine</b>, which the textbook says is very hard to place — its side chain is just a hydrogen. Eight, six, two, three, and glycine: twenty.”',
  note:'<b>数目是骨架</b>：8 ＋ 6 ＋ 2 ＋ 3 ＋ 1 = 20，漏了谁一数就知道。<br><b>书和 Lehninger 不一样的两处，主动说</b>：书把 <b>tyrosine 放进极性组</b>（Lehninger 放芳香组），把 <b>glycine 单列</b>（Lehninger 放非极性脂肪组）。“Lehninger files tyrosine with the aromatic ones and glycine with the aliphatic ones — same twenty, different drawers.”<span class="pg">p021</span>',
  warn:'书还有一句自己的判断：<b>极性组里最极性的是 cysteine 和 tyrosine</b>（p021 原话）。通用教材一般把 Ser/Thr 当更极性的。<b>别主动说这句</b>；他问「哪个最极性」再照书答，并加一句 “that is the textbook’s ranking”。'},
 {n:'05', t:'二十个，各一条',
  big:'名字 · 三字母/单字母 · <b>书给它的那一条性质</b>',
  en:'“For each I will give the group it belongs to and the one property the textbook attaches to it.”',
  tbl:{head:['氨基酸','码','一句话（照说）','页'], rows:[
   ['<b>Glycine</b>','Gly · G','“The only one with <b>no asymmetric carbon</b> — its side chain is a single hydrogen. The smallest, so it fits where nothing else does: nearly thirty percent of collagen.”','p024 p031'],
   ['<b>Alanine</b>','Ala · A','“The simplest nonpolar side chain, a <b>methyl</b>. Transamination turns it into pyruvate — alanine aminotransferase.”','p021 p120'],
   ['<b>Valine</b>','Val · V','“<b>Branched</b> nonpolar. The residue that replaces glutamate at position six of the β-chain in sickle-cell haemoglobin.”','p021 p027'],
   ['<b>Leucine</b>','Leu · L','“<b>Branched</b> nonpolar. The textbook’s only <b>purely ketogenic</b> amino acid — degraded to acetyl-CoA and acetoacetate.”','p125 p127'],
   ['<b>Isoleucine</b>','Ile · I','“<b>Branched</b> nonpolar, and with threonine one of the two that have <b>two asymmetric carbons</b>.”','p024'],
   ['<b>Proline</b>','Pro · P','“The only one <b>without a free α-amino group</b>: the side chain closes back onto the nitrogen as a <b>pyrrolidine</b> ring. Excluded from the α-helix; cis peptide bonds occur practically only next to it.”','p021 p029 p027'],
   ['<b>Phenylalanine</b>','Phe · F','“Aromatic — a <b>phenyl</b> ring. Essential; the cell makes tyrosine from it with phenylalanine hydroxylase.”','p021 p127'],
   ['<b>Tryptophan</b>','Trp · W','“Aromatic — an <b>indole</b>, a benzene fused to a pyrrole. Absorbs at 280 nm; the amino acid whose synthesis the trp operon controls.”','p024 p104'],
   ['<b>Methionine</b>','Met · M','“Sulfur as a <b>thioether</b>. Its codon AUG is the <b>initiation codon</b>; as S-adenosylmethionine it is the main methyl donor.”','p094 p048'],
   ['<b>Serine</b>','Ser · S','“A <b>hydroxyl</b>. The phosphorylation site of glycogen phosphorylase, the nucleophile of the serine proteases — Ser195 of chymotrypsin — and the O-glycosylation site.”','p063 p062 p036'],
   ['<b>Threonine</b>','Thr · T','“A <b>hydroxyl</b> on a second asymmetric carbon. Phosphorylated and O-glycosylated like serine.”','p024 p113'],
   ['<b>Cysteine</b>','Cys · C','“A <b>thiol</b>, which oxidises very easily to the disulfide: two cysteines become one <b>cystine</b>, the cross-linker of proteins.”','p025'],
   ['<b>Tyrosine</b>','Tyr · Y','“A <b>phenol</b> — aromatic and polar at once. Absorbs at 280 nm; phosphorylated by tyrosine kinases; precursor of adrenaline and thyroxine.”','p024 p225 p227'],
   ['<b>Asparagine</b>','Asn · N','“The <b>amide</b> of aspartate. The attachment point of N-linked sugars, through its amide nitrogen. The first amino acid ever isolated, 1806.”','p036 p009'],
   ['<b>Glutamine</b>','Gln · Q','“The <b>amide</b> of glutamate. The cell’s store and carrier of ammonia, made by glutamine synthetase; nitrogen donor for the purine and pyrimidine rings.”','p123 p068 p070'],
   ['<b>Aspartate</b>','Asp · D','“A <b>second carboxyl</b>, negatively charged; forms ion pairs. Gives its nitrogen to the urea cycle and to the purine and pyrimidine rings.”','p032 p123 p068'],
   ['<b>Glutamate</b>','Glu · E','“A <b>second carboxyl</b>, negatively charged; forms ion pairs. The hub of nitrogen metabolism — glutamate dehydrogenase and the transaminases run through it.”','p032 p119 p120'],
   ['<b>Lysine</b>','Lys · K','“A <b>second amino group</b> at the end of the chain — the ε-amino — positively charged. Where biotin and pyridoxal phosphate are attached to their enzymes.”','p021 p049 p121'],
   ['<b>Arginine</b>','Arg · R','“A <b>guanidine</b> group, positively charged. Releases urea in the last step of the urea cycle.”','p021 p123'],
   ['<b>Histidine</b>','His · H','“A weakly basic <b>imidazole</b> — it can give or take a proton near neutral pH, so it is the proton shuttle of active sites, and it binds metals.”','p021 p062']

  note:'三字母码书 Tab. 2.1 给全了；<b>单字母码书只举了 Ala–A、Tyr–Y 两个例子</b>（p021），其余是通用知识。「照说」列里每一句都是英文整句，<b>他挑到哪个就说哪一句</b>。<br>每行第一个加粗的词是它的<b>官能团或环的名字</b>——说属性之前先把那个名字说出口。<span class="pg">p021 p022</span>'},

 {g:'他会挑的那几个', gn:'他随手一点，多半是这几个。每个先说它是什么基团，再说它干什么。'},
 {n:'06', t:'Glycine',
  big:'侧链是一个 <b>H</b> → 没有不对称碳 · 最小 · 书说很难归类 · 胶原近 30%',
  en:'“Glycine’s side chain is a single <b>hydrogen</b>, so the α-carbon carries two identical groups and there is <b>no asymmetric carbon</b> — it is the one amino acid with no L or D form. Being the smallest, it fits where nothing else does: nearly thirty percent of collagen, because in that helix every third side chain points into the axis; and it is abundant in silk fibroin with alanine and serine. Metabolically it donates atoms to the purine ring, to haem via δ-aminolevulinate, and to glutathione.”',
  note:'「每三个一个朝轴心」这半句是把 p031 两句连起来的推论，卡 01 已经用过。<span class="pg">p024 p021 p031 p034 p068 p146 p047</span>'},
 {n:'07', t:'Proline',
  big:'侧链<b>绕回来接在自己的 α-氮上</b> → 五元 <b>pyrrolidine</b> 环 → 仲胺，「亚氨基酸」→ 进不了 α-helix · cis 肽键几乎只在它旁边',
  en:'“Proline is the one amino acid <b>without a free α-amino group</b>: its side chain loops back onto its own nitrogen, closing a five-membered saturated ring with one nitrogen — a <b>pyrrolidine</b>. That makes the nitrogen a secondary amine, which is why proline is called an imino acid. Two consequences the textbook gives: the α-helix accepts every proteinogenic amino acid <b>except proline</b>; and the cis form of the peptide bond occurs practically only next to a proline. And with ninhydrin it gives a yellow product instead of the blue-violet one, because the amino group is substituted.”',
  note:'<b>环要叫 pyrrolidine</b>——PESB 那次「the ring」失分的就是这一类。为什么进不了 helix（没有 N–H 可供氢键 ＋ 环锁住一个主链角）是通用解释，在追问里。胶原里它被羟化成 4-hydroxyproline（p031、p112），细胞有专门的 prolyl cis-trans isomerase（p109）。<span class="pg">p021 p029 p027 p024</span>'},
 {n:'08', t:'Cysteine',
  big:'<b>–SH 巯基</b> → 极易氧化成 <b>–S–S–</b>，两个 cysteine 变一个 <b>cystine</b> = 蛋白质的交联剂；重金属成 mercaptide',
  en:'“Cysteine carries a <b>thiol</b>, –SH. The textbook calls its reactions the most important of any side chain: with heavy metals it forms mercaptides, and it oxidises very easily to the disulfide, –S–S–. Two cysteine residues joined that way are together called <b>cystine</b>, and cystine acts as the <b>cross-linking agent</b> of the protein molecule — a covalent bond between two places in the chain. The bond is cleaved in alkali, reduced back to two cysteines by reducing agents, and oxidised further to cysteic acid for amino-acid analysis.”',
  note:'<b>cysteine 是氨基酸，cystine 是两个 cysteine 氧化后连成的二聚体</b>——两个词只差一个字母，追问里有专门一条。它在别处：Fe–S 蛋白（p046）、谷胱甘肽（p047）、ER 里的 protein disulfide isomerase（p113，卡 13）。<span class="pg">p025 p032</span>'},
 {n:'09', t:'Histidine',
  big:'<b>imidazole</b>：五元芳香环、两个氮、<b>弱碱</b> → 在中性 pH 附近能给也能收质子 → 活性中心的质子搬运工；也结合金属',
  en:'“Histidine’s side chain is an <b>imidazole</b> — an aromatic five-membered ring with two nitrogens — which the textbook describes as <b>weakly basic</b>. Weakly basic is the whole point: its pKa is near neutral, so at the pH of the cell part of the rings are protonated and part are not, and the same ring can <b>accept or donate a proton</b>. That is why the textbook lists histidine first among the reactive side chains of active sites, and imidazole among the groups doing acid–base catalysis. The same ring donates a lone pair to metal ions — that is how a His-tag holds on a nickel column.”',
  note:'书说「弱碱性咪唑基」（p021）、活性中心常见 His（p061）、酸碱催化的基团之一（p062）。<b>pKa ≈ 6 这个数是通用知识</b>，书没给；说的时候说 “roughly six, in general references”。His-tag 那条在横向卡 bonds。<span class="pg">p021 p061 p062</span>',
  warn:'<b>PESB 实测失分点</b>：His-tag 靠的是 histidine 的 <b>imidazole</b> 配位镍，<b>不是 lysine</b>，也不是「芳香环」。环要叫名字。'},
 {n:'10', t:'三个芳香的',
  big:'Phe <b>phenyl</b> · Tyr <b>phenol</b> · Trp <b>indole</b>；三个都吸紫外，<b>Tyr 和 Trp 在 280 nm</b> → 测蛋白浓度',
  en:'“Three carry aromatic rings: phenylalanine a plain <b>phenyl</b>, tyrosine a <b>phenol</b> — phenyl with a hydroxyl — and tryptophan an <b>indole</b>, a benzene fused to a pyrrole. None of the twenty absorbs visible light, but these three absorb in the ultraviolet, and because proteins contain tyrosine and tryptophan, absorbance at <b>280 nm</b> is the quick way to measure protein concentration. Phenylalanine is essential; the cell hydroxylates it to tyrosine, which is why tyrosine is not. All three are precursors of hormones — tyrosine gives DOPA, dopamine, noradrenaline, adrenaline and thyroxine; tryptophan gives melatonin.”',
  note:'<b>书把 tyrosine 归在极性组，不在芳香组</b>——它既芳香又极性，追问里是一条陷阱。cystine 在 240 nm 弱吸收（p024）。trp 操纵子（p104–p105）是 #12 的地盘。<span class="pg">p024 p127 p227 p104</span>'},
 {n:'11', t:'两个酸 ＋ 两个酰胺',
  big:'Asp · Glu 侧链多一个 <b>–COOH</b>，中性 pH 带负电 → 跟 Lys/Arg 成<b>离子对</b>；Asn · Gln 是它们的<b>酰胺</b>，不带电',
  en:'“Aspartate and glutamate carry a <b>second carboxyl</b> in the side chain, so at neutral pH they are negatively charged; together with lysine and arginine they form the <b>ion pairs</b> — salt bridges — that stabilise a fold. Glutamate is the hub of nitrogen metabolism: glutamate dehydrogenase removes its amino group oxidatively, the textbook’s nodal reaction, and the transaminases move amino groups onto and off it. Aspartate donates nitrogen to the urea cycle and to the purine and pyrimidine rings. Asparagine and glutamine are their <b>amides</b> — the side-chain carboxyl converted to –CONH₂, so uncharged. Asparagine is where N-linked sugars attach, through its amide nitrogen; glutamine is how the cell stores and carries ammonia, made by glutamine synthetase.”',
  note:'<b>Asp/Asn、Glu/Gln 是四个名字两对</b>；单字母 D/N、E/Q。凝血因子上的 glutamate 会被 γ-羧化（p112，卡 13）。<span class="pg">p021 p032 p119 p120 p123 p068 p070 p036</span>'},
 {n:'12', t:'三个碱',
  big:'Lys <b>ε-氨基</b>（伯胺）· Arg <b>guanidine</b> · His <b>imidazole</b>（弱）——三个碱三种基团，强度不同',
  en:'“Three are basic, and each with a <b>different group</b>. Lysine has a <b>second amino group</b> at the end of a four-carbon chain — the ε-amino, a primary amine, protonated at neutral pH. That free amine is where enzymes attach cofactors: biotin by an isopeptide bond, pyridoxal phosphate as an aldimine, and DNA ligase carries its AMP on a lysine. Arginine has a <b>guanidine</b> group — the most basic side chain, charged at any physiological pH — and it is where urea comes from: arginase splits it into urea and ornithine. Histidine has the <b>imidazole</b>, only weakly basic, which is what makes it useful in catalysis.”',
  note:'书：lysine「第二个氨基」、arginine「胍基」、histidine「弱碱性咪唑基」（p021）。<b>「arginine 最碱、pKa 约 12.5」是通用知识</b>，书没给数。biotin–lysine p049，PLP–lysine p121，ligase–lysine p082，尿素循环 p123–p125。<span class="pg">p021 p049 p121 p082 p123</span>'},
 {n:'13', t:'三个羟基',
  big:'Ser · Thr（醇羟基）· Tyr（酚羟基）→ <b>磷酸化的位点</b>；Ser · Thr → <b>O-糖基化</b>；Ser 是丝氨酸蛋白酶的亲核基团',
  en:'“Serine and threonine carry an alcohol <b>hydroxyl</b>, tyrosine a phenolic one, and these three hydroxyls are the <b>phosphorylation sites</b> — a kinase makes a phosphate ester there, which changes the charge and hence the conformation; glycogen phosphorylase is switched on by phosphorylating a serine in its active site, and the insulin receptor phosphorylates its own tyrosines. Serine and threonine are also where O-linked sugars attach. And the serine hydroxyl is the nucleophile of the serine proteases — Ser195 in chymotrypsin.”',
  note:'磷酸化 p113–p114、p063、p225；O-糖基化 p036、p112；Ser195 p062；丝氨酸蛋白酶 p116。threonine 和 isoleucine 各有<b>两个不对称碳</b>（p024）。serine 在代谢里是<b>一碳单位的供体</b>（p048）、跟 glycine 互变（p122、p126）。<span class="pg">p113 p063 p225 p036 p062</span>'},
 {n:'14', t:'Methionine ＋ 三个支链',
  big:'Met：<b>硫醚</b>，AUG = 起始密码子，SAM 供甲基 · Val Leu Ile：<b>支链疏水</b>，藏在核心',
  en:'“Methionine’s sulfur is a <b>thioether</b>, –S–CH₃, so unlike cysteine it has no free thiol and cannot form disulfides. Its codon AUG is the <b>initiation codon</b> — every chain starts with methionine, formylmethionine in prokaryotes, usually trimmed off afterwards — and activated with ATP it becomes S-adenosylmethionine, the main methyl donor. Valine, leucine and isoleucine are the <b>branched-chain</b> nonpolar ones; they pack into the hydrophobic core, and they are the ones that transamination and gluconeogenesis handle as a group. Leucine is the textbook’s only purely ketogenic amino acid; methionine, isoleucine and valine are broken down to succinyl-CoA.”',
  note:'AUG p094、fMet p097/p102、SAM p048；支链 p169；ketogenic p125；succinyl-CoA p128。<b>Lehninger 把 lysine 也算纯生酮</b>，书只算 leucine——他要是问就说 “the textbook counts only leucine; Lehninger adds lysine”。<span class="pg">p094 p102 p048 p125 p128</span>'},

 {g:'酸碱与立体', gn:'书 §2.1.2 整节。pH 是她自报的弱点，所以这两点要能正面定义。'},
 {n:'15', t:'两性离子 · pKa · pI',
  big:'低 pH 是<b>阳离子</b>，高 pH 是<b>阴离子</b>，中间是<b>两性离子</b>（两头都带电、净电荷零）；滴定曲线两个拐点 = 两个 pK；<b>pI = 两个 pK 的平均</b>',
  en:'“Because both groups ionise, the form of an amino acid depends on pH. At low pH the carboxyl is protonated and the molecule is a <b>cation</b>; at high pH the ammonium group loses its proton and it is an <b>anion</b>; in between it is a <b>dipolar ion</b>, the zwitterion — carboxylate negative, ammonium positive, net charge zero. The textbook shows this as the titration curve of glycine: two inflection points, which are the <b>pKa</b> of the carboxyl and of the amino group — the pKa being the pH at which that group is half protonated — and the pH at half the titrant consumption, which is the <b>isoelectric point</b>, pI, the average of the two pKa values. Side chains add further ionisable groups, so each amino acid has its own pI, and that is what ion-exchange chromatography and electrophoresis separate them by.”',
  note:'p023 原文 ＋ p024 的 pI = (pK₁ + pK₂)/2。<b>「zwitterion」这个词书没用</b>，书叫它 amoniová forma / 两性形式；词是通用的，说的时候不用标。<b>pKa 的定义</b>（半质子化时的 pH）是通用定义，书直接用没解释。<br>⚠ 书把 –NH₃⁺ 叫「季铵」（kvartérní amoniová），是笔误，它是<b>伯铵</b>——别跟着说 quaternary。<span class="pg">p023 p024</span>',
  warn:'<b>数字待核。</b>甘氨酸曲线上的 pK 值在 Obr. 2.1 里，OCR 没读出来。通用值 pK₁ ≈ 2.3、pK₂ ≈ 9.6、pI ≈ 6。他要数就说 “roughly two and ten, so a pI near six” 并说明是 general values。蛋白质的 pI：在那个 pH 净电荷零、电泳不动、<b>溶解度最低</b>（p038）。'},
 {n:'16', t:'手性 · D/L',
  big:'R ≠ H 就至少一个不对称碳 → 光学活性；<b>全部是 L 型，只有 glycine 例外</b>（它没有手性）；Thr 和 Ile 有两个不对称碳',
  en:'“Whenever R is not hydrogen the α-carbon carries four different groups, so it is an <b>asymmetric carbon</b> and the amino acid is optically active. Glycine is the exception with none; threonine and isoleucine have <b>two</b>. Every amino acid found in proteins is of the <b>L</b> configuration — the textbook derives L-serine from L-glyceraldehyde, amino group on the left in the Fischer projection, the same convention as for sugars. D-amino acids exist, but outside proteins: the textbook’s example is D-glutamate in bacterial cell walls.”',
  note:'p024 整段。<b>L/D 是构型，不是旋光方向</b>——它说的是跟甘油醛比的空间排布，跟左旋右旋（+/−）无关；这一句是通用知识，追问里有。<span class="pg">p024 p023</span>'},

 {g:'反应 ＋ 收尾', gn:'书 §2.1.3 是他「怎么发现的」那类问题的来源。最后一句停住，一句伸出去。'},
 {n:'17', t:'书给的反应',
  big:'<b>ninhydrin</b>（蓝紫；proline 黄）· <b>DNFB</b>（黄色 DNP 衍生物 → 认 N 端）· Schiff 碱（→ PLP 代谢）· 巯基氧化成二硫',
  en:'“The textbook gives four reactions. Heating with <b>ninhydrin</b> gives an intensely coloured product — blue-violet with a free amino group, yellow with proline, whose amino group is substituted; that is how amino acids are detected. <b>1-Fluoro-2,4-dinitrobenzene</b> gives yellow dinitrophenyl derivatives under mild conditions, and because it labels only a free α-amino group it identifies the <b>N-terminal</b> residue of a peptide — Sanger’s reagent, the tool behind the first protein sequence. Amino groups form reversible <b>Schiff bases</b> with aldehydes, which is the chemistry of pyridoxal phosphate. And the cysteine thiol oxidises to the disulfide.”',
  note:'p024–p025。碳链那头：羧基能成酰胺（肽键）、酯、酰卤、叠氮——肽合成用；氨基能被酰化来保护。「Sanger’s reagent」这个叫法是通用的，书只写化学名；insulin 1953 Sanger 在 p009、p228。<span class="pg">p024 p025 p009</span>'},
 {n:'18', t:'落点',
  big:'为什么是<b>这 20 个</b>？因为遗传密码把它们定死了，而密码是<b>全宇宙通用</b>的——再往下是密码起源，进化史',
  en:'“Why these twenty and no others is fixed by the <b>genetic code</b> — sixty-four triplets, sixty-one of them coding, and the code is universal across organisms — so every protein in every organism is built from the same set. Why the code settled on these twenty rather than some other twenty is a question about its origin: evolutionary history rather than something we can derive from chemistry.”',
  note:'p094：三联体、64 组合、简并、通用。<b>说完这句就停</b>——它是答案，也是体面的收手。<span class="pg">p094</span>'},
 {n:'19', t:'留口子',
  big:'主动把话引到<b>定点突变</b>和<b>非天然氨基酸</b>——那是你天天做的',
  en:'“Where I meet this list in practice is <b>site-directed mutagenesis</b>: choosing which residue on a binding surface to change, and to what — an alanine to remove a side chain without disturbing the backbone, or a charge swap to test an ion pair — and then measuring what the change does to binding. I have also worked with a twenty-first, unnatural amino acid put in through a repurposed stop codon — the same trick the cell uses for selenocysteine.”',
  note:'<b>两个钓饵</b>：alanine scanning（alanine = 把侧链删成甲基而不动骨架，通用技术）和 pBpa（对氨基酸 p-benzoyl-phenylalanine，光交联，走 amber 密码子 ＋ 正交的 aminoacyl-tRNA synthetase/tRNA 对）。<b>不点病原体的名字</b>，说 “a binding surface”。<br>⚠ 发音：<b>aminoacyl</b>（a-MI-no-A-cyl），PESB 那次说成了 acryl。'}
],
end:'<b>顺序不能乱：定义 → proteinogenic 的边界 → 共同骨架 → 四组带数目 → 名字 → 他挑哪个说哪个。</b>二十条性质不用背成一串，背成「它的基团是什么 → 所以它干什么」。现在切到演练，出声说一遍。',

segs:[
 {tag:'段 1 · 定义', h:'先说它是什么，再划三个圈',
  p:['“An amino acid is an organic compound carrying both a carboxyl group and an amino group. Of the many that occur in living organisms, twenty have a special position: they are the building blocks of proteins, and in all of them the amino group sits on the α-carbon, the carbon next to the carboxyl. <b>Proteinogenic</b> means exactly that: built into proteins, and with a codon in the genetic code.',
     'Two boundaries. Rare amino acids found in some proteins — hydroxyproline and hydroxylysine in collagen — are made by modifying a residue already in the chain; there is no codon for them. And over a hundred and fifty amino acids occur in cells but never in proteins — ornithine and citrulline of the urea cycle, β-alanine in coenzyme A, D-glutamate in bacterial cell walls.',
     'The twenty share one backbone: an α-carbon carrying a hydrogen, the amino group, the carboxyl group and a side chain R. Everything that differs is in R — and that is where the one characteristic property of each amino acid lives: what its side chain can do, its charge, its polarity, its ring, its sulfur. All of them except proline have a free α-amino group.”'],
  note:'<b>三个圈说完，「proteinogenic」这个限定词就答完了。</b>selenocysteine 留着当加分，被问「真的只有二十个吗」再给（p093 脚注）。'},
 {tag:'段 2 · general', h:'四组带数目，然后名字',
  p:['“The textbook groups them by the nature of the side chain. <b>Nonpolar</b>, eight: alanine, valine, leucine, isoleucine and proline with aliphatic side chains; phenylalanine and tryptophan with aromatic rings; methionine with sulfur. <b>Polar but uncharged</b>, six: serine, threonine and tyrosine with a hydroxyl; asparagine and glutamine with an amide; cysteine with a thiol. <b>Negatively charged</b>, two: aspartate and glutamate, each with a second carboxyl. <b>Positively charged</b>, three: lysine with a second amino group, arginine with a guanidine group, histidine with a weakly basic imidazole. And <b>glycine</b>, whose side chain is a single hydrogen and which the textbook says is very hard to place. Eight, six, two, three and glycine — twenty.',
     'Two general properties before the individual ones. Because both groups ionise, an amino acid is a cation at low pH, an anion at high pH and a dipolar ion — a zwitterion — in between; the pH at which it carries no net charge is its isoelectric point, and side-chain groups make it different for each. And all of them except glycine have an asymmetric α-carbon, and all of those in proteins are of the L configuration.”'],
  note:'<b>数目先于名字。</b>他打断你挑一个的时候，你已经说过它属于哪组、那组靠什么定义——剩下的只是那一条性质。'},
 {tag:'段 3 · 稍展开', h:'他挑哪个说哪个——这里预演四个最可能的',
  p:['“Take glycine: the side chain is a hydrogen, so there is no asymmetric carbon, and being the smallest it fits where nothing else does — nearly thirty percent of collagen, where every third side chain points into the axis of the helix.',
     'Proline: the side chain closes onto its own α-nitrogen as a pyrrolidine ring, so it has no free amino group — an imino acid. The α-helix takes every amino acid except proline, and cis peptide bonds occur practically only next to it.',
     'Cysteine: a thiol that oxidises very easily to a disulfide; two cysteines become one cystine, which the textbook calls the cross-linking agent of proteins.',
     'Histidine: an imidazole, weakly basic — its pKa is near neutral, so the same ring can accept or donate a proton, which is why it is the proton shuttle of active sites and the group that binds metals.”'],
  note:'四个例子四种「基团 → 后果」的句式。<b>其余十六个在速背的表里，每个一句，照说。</b>'},
 {tag:'段 4 · 留口子', h:'主动落到你的主场',
  p:['“Where I meet this list every day is site-directed mutagenesis on a binding surface: deciding which residue to change and to what — alanine to delete a side chain without touching the backbone, a charge swap to test an ion pair — and then measuring what the change does to the dissociation constant. And I have used a twenty-first, unnatural amino acid, incorporated through a repurposed stop codon — the same trick the textbook’s codon table shows for selenocysteine.”'],
  note:'<b>这不是漏洞，是钓饵。</b>他顺着走就到卡 02（Kd）或到非天然氨基酸——两边你都接得住。不点病原体名字。'}
],
