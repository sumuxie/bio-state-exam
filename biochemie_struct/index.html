  <!-- Stated on the page, not buried in a comment: the checker verifies
       composition, not handedness. A reader memorising these deserves to know
       which part has been machine-checked and which has not. -->
  <p class="caveat">
    <b>关于可靠性</b>：每个结构都带 SMILES、分子式和 PubChem CID，
    <code>tools/check_structures.py</code> 会核对重原子数（C/N/O/S）——写错一个碳会直接报错。
    <b>但立体化学没有被机器验证</b>：L/D 构型靠人写，检查器看不出来。
    画的都是中性未解离形式；生理 pH 下实际是两性离子。
  </p>
  <div id="app"></div>
