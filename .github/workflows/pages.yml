name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/biochem-chapters-1-3-notes-1g3f2a
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs on every branch listed above, so a PR gets a real check without
  # touching the live site.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the topic data parses and is well formed
        run: |
          node -e "
          global.window = {};
          require('./data/ch1.js'); require('./data/ch2.js'); require('./data/ch3.js');
          const T = window.BIOCHEM.topics;
          if (!T.length) throw new Error('no topics loaded');
          const problems = [];
          T.forEach(t => {
            ['id','chapter','section','czTitle','enTitle','cnTitle','coverage','summary'].forEach(k => {
              if (!t[k]) problems.push(t.id + ': missing ' + k);
            });
            if (!t.summary.en || !t.summary.cn) problems.push(t.id + ': summary missing a language');
            (t.quiz || []).forEach(q => {
              if (!q.q_en || !q.q_cn) problems.push(t.id + ': question missing a language');
              if (q.type === 'mcq') {
                if (!Array.isArray(q.options) || typeof q.answer !== 'number'
                    || q.answer < 0 || q.answer >= q.options.length) problems.push(t.id + ': bad mcq answer index');
              } else if (!q.answer_en || !Array.isArray(q.accept) || !q.accept.length) {
                problems.push(t.id + ': written question missing model answer or key terms');
              }
            });
            if (t.oral && (!t.oral.model_en || !Array.isArray(t.oral.checklist))) problems.push(t.id + ': bad oral block');
          });
          const ids = T.map(t => t.id);
          ids.filter((v, i) => ids.indexOf(v) !== i).forEach(d => problems.push('duplicate id ' + d));
          if (problems.length) { console.error(problems.join('\n')); process.exit(1); }
          const terms = T.reduce((n, t) => n + (t.terms || []).length, 0);
          const qs = T.reduce((n, t) => n + (t.quiz || []).length, 0);
          console.log('ok: ' + T.length + ' topics, ' + terms + ' terms, ' + qs + ' questions');
          "

  # The github-pages environment only permits deployments from the default
  # branch, which is also the behaviour we want: feature branches must not
  # publish the live site. Publishing happens when the branch merges to main.
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
