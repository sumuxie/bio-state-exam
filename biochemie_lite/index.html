<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biochemie PRO 速通简洁版</title>
<!-- The full app's stylesheet, by reference rather than by copy: the two apps are
     meant to look like one thing, and a duplicated 40 KB of CSS drifts. -->
<link rel="stylesheet" href="../biochemie_pro/style.css">
<link rel="stylesheet" href="lite.css">
</head>
<body>

<header class="topbar">
  <button id="menu-toggle" class="icon-btn" aria-label="Toggle topic list">☰</button>
  <div class="brand">
    <strong>Biochemie <span class="brand-tag lite">速通</span></strong>
    <span class="brand-sub">主线版 · one thread per section</span>
  </div>

  <nav class="modes" id="mode-toggle" role="tablist">
    <button class="mode-btn active" data-mode="min" role="tab">⚡ <span>极简</span></button>
    <button class="mode-btn" data-mode="spine" role="tab">🧵 <span>主线</span></button>
    <button class="mode-btn" data-mode="quiz" role="tab">✏️ <span>题目</span></button>
  </nav>

  <div class="topbar-right">
    <div class="pen-row" id="pen-row" title="新星标的颜色"></div>
    <button id="only-marked" class="icon-btn" aria-label="Only starred"
      title="只看星标 — 只显示打了 ★ 的步骤和词">★</button>
    <div class="lang-toggle" id="lang-toggle">
      <button data-lang="both" class="active">中/EN</button>
      <button data-lang="en">EN</button>
      <button data-lang="cn">中文</button>
    </div>
    <button id="voice-toggle" class="icon-btn" aria-label="Reading voice"
      title="朗读语音 — 选语音和语速">🔈</button>
    <a id="full-link" href="../biochemie_pro/index.html"
       title="完整版 — 逐条要点、术语表、题库、口试">📖 完整版</a>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">◐</button>
  </div>
</header>

<!-- Voice picker. The device decides what is available, and the browser's default is
     usually the worst voice present, so the reader has to be able to choose and hear. -->
<div id="voice-panel" class="voice-panel" hidden>
  <div class="vp-head">
    <span class="vp-title">🔈 朗读语音 <span class="muted">reading voice</span></span>
    <button id="voice-close" class="vp-close" aria-label="关闭">×</button>
  </div>
  <div class="vp-row">
    <label for="voice-en">English</label>
    <select id="voice-en"></select>
    <button class="btn-ghost vp-test" data-lang="en-US">试听</button>
  </div>
  <p id="voice-en-note" class="vp-missing"></p>
  <div class="vp-row">
    <label for="voice-zh">中文</label>
    <select id="voice-zh"></select>
    <button class="btn-ghost vp-test" data-lang="zh-CN">试听</button>
  </div>
  <p id="voice-zh-note" class="vp-missing"></p>
  <div class="vp-row">
    <label for="voice-rate">语速 <span class="muted">speed</span></label>
    <input id="voice-rate" type="range" min="0.6" max="1.4" step="0.02">
    <span id="voice-rate-val" class="muted"></span>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="search-wrap"><input id="search" type="search" placeholder="Search 搜索…"></div>
    <div class="progress-strip">
      <span id="spine-count"></span>
      <div class="progress-bar"><div id="spine-bar"></div></div>
    </div>
    <div class="topic-list" id="topic-list"></div>
  </aside>

  <main class="content">
    <section id="panel-study" class="panel active"></section>
  </main>
</div>

<!-- Node index: titles and structure only, generated from biochemie_pro's own data
     by tools/build-lite-index.py. The prose is NOT copied — see that file. -->
<script src="data/nodes.js"></script>
<!-- The spine: one hand-written chain per node, a chapter at a time.
     GENERATED by tools/build-lite-index.py — add a spine_*.js file and
     re-run; do not hand-edit this list. -->
<script src="data/spine_ch11_12.js"></script>
<script src="data/spine_ch13_15.js"></script>
<script src="data/spine_ch16_19.js"></script>
<script src="data/spine_ch1_3.js"></script>
<script src="data/spine_ch20_22.js"></script>
<script src="data/spine_ch23_25.js"></script>
<script src="data/spine_ch26_28.js"></script>
<script src="data/spine_ch2_5.js"></script>
<script src="data/spine_ch5_6.js"></script>
<script src="data/spine_ch7_9.js"></script>
<script src="data/spine_ch8.js"></script>
<script src="data/spine_ch9_10.js"></script>
<script src="data/spine_cz1_2.js"></script>
<script src="data/spine_cz3.js"></script>
<script src="data/spine_cz4.js"></script>
<script src="data/spine_merged_aminoacidfate.js"></script>
<script src="data/spine_merged_biosynthesis.js"></script>
<script src="data/spine_merged_c4cam.js"></script>
<script src="data/spine_merged_cellcontrol.js"></script>
<script src="data/spine_merged_citricacid.js"></script>
<script src="data/spine_merged_dnarepair.js"></script>
<script src="data/spine_merged_dnastructure.js"></script>
<script src="data/spine_merged_energy.js"></script>
<script src="data/spine_merged_enzymes.js"></script>
<script src="data/spine_merged_fattyacidox.js"></script>
<script src="data/spine_merged_fattyacidsynth.js"></script>
<script src="data/spine_merged_foundations.js"></script>
<script src="data/spine_merged_glycolysisperiphery.js"></script>
<script src="data/spine_merged_hormones.js"></script>
<script src="data/spine_merged_lipids.js"></script>
<script src="data/spine_merged_membranes.js"></script>
<script src="data/spine_merged_metabolicdisease.js"></script>
<script src="data/spine_merged_methods.js"></script>
<script src="data/spine_merged_monosaccharides.js"></script>
<script src="data/spine_merged_nitrogen.js"></script>
<script src="data/spine_merged_nucleic.js"></script>
<script src="data/spine_merged_photosynthesis.js"></script>
<script src="data/spine_merged_proteins.js"></script>
<script src="data/spine_merged_proteinsynth.js"></script>
<!-- Questions for the spined nodes, generated from the full app so the two never
     disagree about an answer. Optional: absent means the 题目 tab says so. -->
<script src="data/questions.js"></script>
<!-- Pre-rendered reading audio, optional. Absent means the browser voice is used. -->
<script src="audio/manifest.js" onerror="void 0"></script>
<script src="app.js"></script>
</body>
</html>
