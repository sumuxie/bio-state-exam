<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生物化学课 · 学习台 | Biochemistry Lecture Study Console</title>
<style>
:root{
  --bg:#0f1115; --panel:#161a21; --panel2:#1c212a; --line:#2a313d;
  --fg:#e6e9ef; --dim:#98a2b3; --accent:#5aa9ff; --accent2:#7ee0b8;
  --warn:#ffc866; --bad:#ff7b72; --good:#6ee7a8; --grip:#2a313d; --gripon:#5aa9ff;
  --optbg:#141922;
}
html[data-theme="light"]{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --line:#d8dde5;
  --fg:#14181f; --dim:#5d6875; --accent:#0b66c3; --accent2:#0a7f5b;
  --warn:#a76a00; --bad:#c02a20; --good:#0a7f3f; --grip:#d8dde5; --gripon:#0b66c3;
  --optbg:#f7f9fc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);
  font:15px/1.65 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
header .sub{color:var(--dim);font-size:12px}
header .spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--dim);padding:5px 10px;
  font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
select,#searchbox{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:5px 8px;font:inherit;font-size:12.5px}
#lecsel{max-width:420px;font-weight:600}
#voicesel{max-width:210px;font-size:11.5px}
#searchbox{width:200px}
#searchbox:focus{outline:none;border-color:var(--accent);width:270px}
#rate{width:74px;vertical-align:middle}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:3px 8px;font:inherit;font-size:11.5px;cursor:pointer}
.iconbtn:hover{color:var(--fg);border-color:var(--accent)}
#voicewarn{font-size:11.5px;color:var(--warn);cursor:pointer}

#body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#row{flex:1;display:flex;min-height:0}
.col{min-width:150px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#c1{width:290px;flex:none}
#c2{flex:1;min-width:320px}
#c3{width:380px;flex:none}
#quiz{height:250px;flex:none;display:flex;flex-direction:column;overflow:hidden;
  border-top:1px solid var(--line)}
.grip{flex:none;background:var(--grip);opacity:.55}
.grip:hover,.grip.dragging{opacity:1;background:var(--gripon)}
.grip.v{width:5px;cursor:col-resize}
.grip.h{height:5px;cursor:row-resize}
.colhead{padding:8px 13px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);background:var(--panel);border-bottom:1px solid var(--line);flex:none;
  display:flex;align-items:center;gap:8px}
.colhead .spacer{flex:1}
.scroll{overflow-y:auto;flex:1;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}

.topic{padding:8px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.topic:hover{background:var(--panel2)}
.topic.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.topic .t{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
.topic .zh{font-size:13px;margin-top:1px}
.topic .en{font-size:11px;color:var(--dim);margin-top:1px}

.videowrap{background:#000;position:relative;flex:none;min-height:0}
video{width:100%;display:block;background:#000;max-height:100%}
#overlay{position:absolute;left:0;right:0;bottom:9%;text-align:center;pointer-events:none;
  padding:0 5%;display:flex;flex-direction:column;gap:3px;align-items:center}
#overlay .oz{font-size:var(--subsize,22px);line-height:1.35;color:#fff;
  background:rgba(0,0,0,.55);padding:2px 10px;border-radius:5px;
  text-shadow:0 2px 6px rgba(0,0,0,.9);max-width:100%}
#overlay .oe{font-size:calc(var(--subsize,22px)*.72);line-height:1.3;color:#e8ecf2;
  background:rgba(0,0,0,.45);padding:1px 9px;border-radius:5px;
  text-shadow:0 2px 6px rgba(0,0,0,.9);max-width:100%;pointer-events:auto;cursor:pointer}
#vidmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  text-align:center;padding:24px;color:var(--warn);font-size:13.5px;line-height:1.7;
  background:rgba(0,0,0,.85)}
#vidmsg.show{display:flex}
.timeline{height:32px;background:var(--panel2);position:relative;cursor:pointer;flex:none;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tlseg{position:absolute;top:0;bottom:0;border-right:1px solid var(--bg);opacity:.5}
.tlseg:hover{opacity:.9}.tlseg.on{opacity:1}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);pointer-events:none}
.tllabel{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;
  color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 110px)}
.tlclock{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;
  color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.subbar{padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.subbar .z{font-size:17px;line-height:1.45}
.subbar .e{font-size:13px;color:var(--dim);line-height:1.4;cursor:pointer}
.cue{display:flex;gap:9px;padding:3px 16px;cursor:pointer;font-size:12.5px;line-height:1.55}
.cue:hover{background:var(--panel2)}
.cue.on{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
.cue .t{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;flex:none;width:50px;padding-top:2px}
.cue .en{color:var(--dim);font-size:11.5px;display:block;cursor:pointer}

.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--dim);padding:8px 4px;font:inherit;font-size:12px;cursor:pointer}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:12px 14px}
.pane h3{font-size:13.5px;margin:0 0 2px}
.pane h3 .en{display:block;font-size:11.5px;color:var(--dim);font-weight:400;cursor:pointer}
.pane .when{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;
  margin-bottom:10px;cursor:pointer}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;margin-bottom:9px}
.card .zh{font-size:13px}
.card .en{font-size:12px;color:var(--dim);margin-top:5px;padding-top:5px;
  border-top:1px dashed var(--line);cursor:pointer}
.card .en:hover{color:var(--accent)}
.card.extra{border-left:3px solid var(--warn)}
.card.extra .tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--warn);display:block;margin-bottom:4px}

#quizbody{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px;align-content:flex-start}
.q{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;
  flex:1 1 330px;min-width:280px;max-width:520px}
.q .qt{font-size:13px;margin-bottom:2px}
.q .qt .en{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--optbg);border:1px solid var(--line);
  color:var(--fg);border-radius:7px;padding:6px 9px;margin-top:6px;font:inherit;
  font-size:12.5px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.opt .en{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.explain{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;
  color:var(--dim);display:none}
.explain.show{display:block}
.explain .en{display:block;margin-top:4px;cursor:pointer}
.spk{display:inline-block;border:0;background:transparent;color:var(--dim);cursor:pointer;
  font-size:12px;padding:0 4px;line-height:1}
.spk:hover{color:var(--accent)}
.en.saying,.oe.saying{color:var(--accent2)}
.score{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.empty{color:var(--dim);font-size:12.5px;padding:16px}
.hide{display:none !important}

#searchpanel{position:absolute;inset:0;background:var(--bg);z-index:50;display:none;
  flex-direction:column}
#searchpanel.show{display:flex}
#searchhead{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
#searchhead .q{font-size:14px;font-weight:600;background:none;border:0;padding:0}
#searchhead .n{font-size:12px;color:var(--dim)}
#searchhead .spacer{flex:1}
#filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none}
.chip{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;
  padding:3px 11px;font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--fg)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.extra.on{background:var(--warn);border-color:var(--warn);color:#1a1204}
.chip .c{opacity:.75;margin-left:5px;font-variant-numeric:tabular-nums}
.chip:disabled{opacity:.35;cursor:default}
#searchresults{overflow-y:auto;flex:1;padding:6px 0 24px}
.rgroup{padding:12px 16px 2px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);display:flex;gap:8px;align-items:baseline}
.hit{display:flex;gap:11px;padding:7px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.hit:hover{background:var(--panel2)}
.hit .t{flex:none;width:74px;font-size:11px;color:var(--accent);
  font-variant-numeric:tabular-nums;padding-top:2px}
.hit .body{flex:1;min-width:0}
.hit .zh{font-size:13px;line-height:1.55}
.hit .en{font-size:11.5px;color:var(--dim);line-height:1.45;margin-top:2px}
.hit .where{font-size:11px;color:var(--dim);margin-top:3px}
.hit mark{background:color-mix(in srgb,var(--accent) 34%,transparent);color:var(--fg);
  border-radius:3px;padding:0 1px}
.hit.extra{border-left:3px solid var(--warn)}
.note{padding:10px 16px;font-size:12px;color:var(--dim)}

/* ---------- primary language ----------
   Both languages are always in the DOM; this only flips which one leads.
   Containers become flex columns so `order` can swap them without the
   renderer knowing anything about it. */
.topic,.card,.pane h3,.q .qt,.hit .body{display:flex;flex-direction:column}
.opt{display:flex;flex-direction:column;align-items:flex-start}
.explain.show{display:flex;flex-direction:column}
.q .qt .spk,.opt .spk{align-self:flex-start;order:9}

[data-primary="en"] .topic .en{order:1;font-size:13px;color:var(--fg)}
[data-primary="en"] .topic .zh{order:2;font-size:11px;color:var(--dim)}

[data-primary="en"] .card .en{order:1;font-size:13px;color:var(--fg);
  margin-top:0;padding-top:0;border-top:0}
[data-primary="en"] .card .zh{order:2;font-size:12px;color:var(--dim);
  margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}

[data-primary="en"] .pane h3 .en{order:1;font-size:13.5px;color:var(--fg);font-weight:600}
[data-primary="en"] .pane h3 .zh{order:2;font-size:11.5px;color:var(--dim);font-weight:400}

[data-primary="en"] .q .qt .en{order:1;font-size:13px;color:var(--fg);margin-top:0}
[data-primary="en"] .q .qt .zh{order:2;font-size:11.5px;color:var(--dim);margin-top:3px}

[data-primary="en"] .opt .en{order:1;font-size:12.5px;color:var(--fg);margin-top:0}
[data-primary="en"] .opt .zh{order:2;font-size:11px;color:var(--dim);margin-top:2px}

[data-primary="en"] .explain .en{order:1;margin-top:0;color:var(--fg)}
[data-primary="en"] .explain .zh{order:2;margin-top:4px;color:var(--dim)}

[data-primary="en"] .hit .en{order:1;font-size:13px;color:var(--fg);line-height:1.55;margin-top:0}
[data-primary="en"] .hit .zh{order:2;font-size:11.5px;color:var(--dim);line-height:1.45;margin-top:2px}
[data-primary="en"] .hit .where{order:3}

/* ---------- integration panel ---------- */
#intpanel{position:absolute;inset:0;background:var(--bg);z-index:51;display:none;
  flex-direction:column}
#intpanel.show{display:flex}
#inthead{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
#inthead .q{font-size:14px;font-weight:600}
#inthead .n{font-size:12px;color:var(--dim)}
#inthead .spacer{flex:1}
#intchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none}
#intbody{overflow-y:auto;flex:1;padding:14px 16px 30px}
#intblurb{font-size:12.5px;color:var(--dim);margin:0 0 14px;max-width:70ch;line-height:1.6}
#intblurb .zh{display:block;margin-top:3px}
.intgrid{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.intgrid .card{flex:1 1 420px;min-width:300px;max-width:640px;margin-bottom:0}
.intgrid .q{flex:1 1 420px;min-width:300px;max-width:640px}
.card .see,.q .see{display:block;font-size:10.5px;color:var(--accent);margin-top:7px;
  font-variant-numeric:tabular-nums;opacity:.85;order:5}

/* ---------- text-only view ----------
   The middle column carries the video, the timeline, the subtitle bar and the
   transcript. Hiding the whole column is what "text only" means; the notes take
   the space it leaves. Nothing is unloaded, so the video is still there at the
   right timestamp the moment a play button asks for it. */
[data-view="text"] #c2,
[data-view="text"] #row > .grip.v{display:none}
[data-view="text"] #c3{flex:1;width:auto!important;min-width:0}
[data-view="text"] #tabs{display:none}
/* The quiz has its own view now; docked here it just steals height from the notes. */
[data-view="text"] #quiz,
[data-view="text"] .grip.h[data-target="quiz"]{display:none}
[data-view="text"] #panel{display:flex;flex-direction:column;overflow:hidden}
[data-view="quiz"] #row{display:none}
/* The subtitle controls steer something that is not on screen in these views. */
[data-view="text"] #sublabel,[data-view="text"] #langseg,[data-view="text"] #posseg,
[data-view="quiz"] #sublabel,[data-view="quiz"] #langseg,[data-view="quiz"] #posseg{display:none}
[data-view="quiz"] #quiz{flex:1;height:auto!important}
[data-view="quiz"] #quizbody .q{flex:1 1 400px;max-width:560px}
[data-view="read"] #row,[data-view="read"] #quiz,
[data-view="read"] .grip.h[data-target="quiz"]{display:none}
[data-view="read"] #sublabel,[data-view="read"] #langseg,[data-view="read"] #posseg{display:none}
#readpanel{display:none;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
[data-view="read"] #readpanel{display:block}
#readpanel::-webkit-scrollbar{width:10px}
#readpanel::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.readdoc{max-width:74ch;margin:0 auto;padding:30px 26px 70px}
.readdoc h1{font-size:20px;line-height:1.35;margin:0 0 4px}
.readdoc h1 .zh{display:block;font-size:14px;color:var(--dim);font-weight:400;margin-top:3px}
.readdoc .meta{font-size:11.5px;color:var(--dim);margin:0 0 26px;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.readsec{margin:0 0 30px}
.readsec h2{font-size:15px;line-height:1.4;margin:0 0 10px;
  padding-top:14px;border-top:1px solid var(--line)}
.readsec:first-of-type h2{border-top:0;padding-top:0}
.readsec h2 .zh{display:block;font-size:12.5px;color:var(--dim);font-weight:400;margin-top:2px}
.readsec p{margin:0 0 11px;line-height:1.72;font-size:13.5px}
.readsec p.zh{font-size:12.5px;color:var(--dim);line-height:1.7;margin-bottom:16px}
[data-primary="en"] .readdoc h1 .en,[data-primary="en"] .readsec h2 .en{display:block}
.readdoc h1 .en,.readsec h2 .en{display:block}
.readempty{max-width:70ch;margin:0 auto;padding:60px 26px;color:var(--dim);
  font-size:13px;line-height:1.7}

/* ---------- pre-read glossary ---------- */
.pre{border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:0 10px 10px 0;padding:15px 17px;margin:0 0 34px;
  background:var(--panel2)}
.pre h3{margin:0 0 3px;font-size:14px}
.pre h3 .zh{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:2px}
.pre .lead{margin:9px 0 12px;font-size:11.5px;color:var(--dim);line-height:1.65}
.pre .toggle{background:transparent;border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:2px 9px;font:inherit;font-size:11px;cursor:pointer;
  float:right;margin-left:8px}
.pre .toggle:hover{border-color:var(--accent);color:var(--accent)}

/* One card at a time. Eighty-seven glosses in a column is a wall standing in
   front of the wall you came to read. */
.flash{background:var(--bg);border:1px solid var(--line);border-radius:11px;
  padding:26px 22px;min-height:150px;display:flex;flex-direction:column;
  justify-content:center;cursor:pointer;text-align:center}
.flash:hover{border-color:var(--accent)}
.flash .ft{font-size:21px;font-weight:600;line-height:1.35}
.flash .fz{font-size:14px;color:var(--dim);margin-top:5px}
.flash .fhint{font-size:11px;color:var(--dim);margin-top:16px;opacity:.7}
.flash .fg{font-size:14px;line-height:1.75;margin-top:16px;text-align:left}
.flash .fgz{font-size:13px;line-height:1.75;color:var(--dim);margin-top:8px;text-align:left}
.flashbar{display:flex;align-items:center;gap:9px;margin-top:11px}
.flashbar .spacer{flex:1}
.flashbar .cnt{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.pregrid{margin:16px 0 0;display:grid;gap:11px;
  border-top:1px solid var(--line);padding-top:14px}
.pre.listclosed .pregrid{display:none}
.pterm{font-size:12.5px;line-height:1.6}
.pterm b{font-weight:600}
.pterm .cn{color:var(--dim);font-weight:400}
.pterm .g{display:block;color:var(--dim);font-size:11.5px;line-height:1.6;margin-top:2px}
.pterm .gz{display:block;color:var(--dim);font-size:11.5px;line-height:1.6;opacity:.8}

/* ---------- reading typography ----------
   Defaults chosen for continuous reading rather than reference-skimming:
   bigger type, a shorter measure, and line spacing with real air in it. */
.readdoc{--rf:16px;--rlh:1.95;--rls:0em;--rfam:inherit}
.readdoc{max-width:var(--rw,62ch);font-family:var(--rfam)}
.readsec p{font-size:var(--rf);line-height:var(--rlh);letter-spacing:var(--rls);
  margin-bottom:calc(var(--rlh) * 0.55em)}
.readsec p.zh{font-size:calc(var(--rf) - 1.5px);
  margin-bottom:calc(var(--rlh) * 0.85em)}
.readdoc h1{font-size:calc(var(--rf) + 6px)}
.readsec h2{font-size:calc(var(--rf) + 1px)}
/* Side by side fills a wide screen without lengthening the line: the width
   goes to a second column rather than to a longer measure. */
.pair{margin:0}
[data-pair="side"] .pair{display:flex;gap:30px;align-items:flex-start}
[data-pair="side"] .pair > p{flex:1;min-width:0}
[data-pair="side"] .readdoc{max-width:none}
[data-pair="side"] .readsec p.zh{margin-bottom:calc(var(--rlh) * 0.55em)}
#readbar .tset{display:flex;align-items:center;gap:4px;margin-left:6px}
#readbar .tset button{background:transparent;border:1px solid var(--line);
  color:var(--dim);border-radius:5px;padding:2px 7px;font:inherit;font-size:11px;
  cursor:pointer}
#readbar .tset button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- reading aids ---------- */
#readbar{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;
  background:var(--panel);border-bottom:1px solid var(--line);
  padding:7px 16px;flex-wrap:wrap}
#readbar .n{font-size:11.5px;color:var(--dim)}
#readbar .spacer{flex:1}
/* Focus: everything recedes except the unit in hand. Kept at .3 rather than
   hidden so the shape of the page still tells you where you are in it. */
.readdoc.focus .readsec p{opacity:.3;transition:opacity .12s}
.readdoc.focus .readsec p.here{opacity:1}
.readdoc.focus .readsec h2{opacity:.5}
.readdoc.focus .readsec.hereSec h2{opacity:1}
.readsec p.here{box-shadow:-14px 0 0 -11px var(--accent)}
.sen{border-radius:3px;padding:0 1px}
.sen.saying{background:color-mix(in srgb,var(--accent) 26%,transparent);
  color:var(--fg)}
.readdoc.focus .readsec p.here.zh{opacity:.85}

/* ---------- 小桌面 ---------- */
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;
  flex-direction:column;gap:9px;max-width:330px}
.toast{background:var(--panel);border:1px solid var(--accent);border-radius:10px;
  padding:11px 13px;box-shadow:0 8px 26px rgba(0,0,0,.4);animation:tin .22s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.toast .tt{margin:0 0 4px;font-size:12.5px;font-weight:600}
.toast .tb{margin:0;font-size:12px;color:var(--dim);line-height:1.6}
.toast .tx{margin-top:8px;background:var(--accent);border:0;color:#fff;
  border-radius:6px;padding:4px 10px;font:inherit;font-size:11.5px;cursor:pointer}
#deskpanel{position:absolute;inset:0;background:var(--bg);z-index:52;display:none;
  flex-direction:column}
#deskpanel.show{display:flex}
#deskhead{display:flex;align-items:center;gap:12px;padding:9px 16px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#deskhead .q{font-size:14px;font-weight:600}
#deskhead .spacer{flex:1}
#deskbody{overflow-y:auto;flex:1;padding:22px 20px 40px}
.deskwrap{max-width:70ch;margin:0 auto}
.praise{background:var(--panel2);border-left:3px solid var(--accent);
  border-radius:0 9px 9px 0;padding:13px 15px;font-size:13px;line-height:1.75;
  margin:0 0 20px}
.stats{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 22px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:9px 13px;min-width:104px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;
  line-height:1.2}
.stat span{font-size:11px;color:var(--dim)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:9px}
.badge{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;opacity:.4}
.badge.got{opacity:1;border-color:var(--accent)}
.badge .em{font-size:19px;line-height:1.1}
.badge .bt{font-size:12.5px;font-weight:600;margin:0 0 2px}
.badge .bd{font-size:11.5px;color:var(--dim);line-height:1.55;margin:0}
.qfrom{display:block;font-size:10.5px;color:var(--accent);margin-bottom:5px;
  font-variant-numeric:tabular-nums;cursor:pointer;opacity:.85}
.qfrom:hover{text-decoration:underline}
.notecols{display:flex;flex:1;min-height:0}
.notecol{flex:1;min-width:0;overflow-y:auto;padding:0 14px 22px;scrollbar-width:thin}
.notecol::-webkit-scrollbar{width:9px}
.notecol::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.notecol + .notecol{border-left:1px solid var(--line)}
.notecol .card{margin-bottom:9px}
.notecol .intsub{position:sticky;top:0;background:var(--bg);z-index:1;
  margin:0 0 9px;padding:10px 0 7px}
.playbtn{order:4;align-self:flex-start;margin-top:7px;background:transparent;
  border:1px solid var(--line);color:var(--dim);border-radius:6px;
  padding:2px 8px;font:inherit;font-size:10.5px;cursor:pointer;
  font-variant-numeric:tabular-nums}
.playbtn:hover{border-color:var(--accent);color:var(--accent)}
.intsub{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  margin:22px 0 9px;display:flex;gap:9px;align-items:baseline}
.intsub:first-child{margin-top:0}
[data-primary="en"] #intblurb .zh{color:var(--dim)}
</style>
</head>
<body>
<header>
  <select id="lecsel" title="选择课程"></select>
  <span class="sub" id="lecen"></span>
  <span class="spacer"></span>
  <input id="searchbox" type="search" autocomplete="off" placeholder="搜索…  ( / )">
  <span class="sub">视图 view</span>
  <div class="seg" id="viewseg">
    <button data-view="text" class="on">字版 Text</button><button data-view="video">视频 Video</button><button data-view="quiz">只做题 Quiz</button><button data-view="read">通读 Read</button>
  </div>
  <button class="iconbtn" id="deskbtn" title="今天的进度和徽章">🌱 小桌面</button>
  <div class="seg" style="display:none">
  </div>
  <button class="iconbtn" id="intbtn" title="跨讲综合 / cross-lecture integration">综合 Integration</button>
  <span class="sub">正文 body</span>
  <div class="seg" id="primseg">
    <button data-prim="en" class="on">EN</button><button data-prim="zh">中</button>
  </div>
  <span class="sub" id="sublabel">字幕</span>
  <div class="seg" id="langseg">
    <button data-lang="zh">中</button><button data-lang="both" class="on">双语</button>
    <button data-lang="en">EN</button>
  </div>
  <div class="seg" id="posseg">
    <button data-pos="over" class="on">视频上</button><button data-pos="below">视频下</button>
    <button data-pos="off">关</button>
  </div>
  <button class="iconbtn" id="subminus">A−</button><button class="iconbtn" id="subplus">A+</button>
  <span class="sub">朗读</span>
  <select id="voicesel" title="英文朗读音色"></select>
  <input type="range" id="rate" min="0.6" max="1.4" step="0.05" title="语速">
  <button class="iconbtn" id="saytest">试听</button>
  <span id="voicewarn" class="hide"></span>
  <div class="seg" id="themeseg">
    <button data-theme="dark" class="on">黑</button><button data-theme="light">白</button>
  </div>
  <button class="iconbtn" id="reset">重置布局</button>
</header>

<div id="toasts"></div>
<div id="body">
  <div id="intpanel">
    <div id="inthead">
      <span class="q">综合 · Integration</span>
      <span class="n" id="intn"></span>
      <span class="spacer"></span>
      <span class="n">Esc 关闭</span>
      <button class="iconbtn" id="intreset">重做 Reset</button>
      <button class="iconbtn" id="intclose">关闭 Close</button>
    </div>
    <div id="intchips"></div>
    <div id="intbody"></div>
  </div>
  <div id="searchpanel">
    <div id="searchhead">
      <span class="q" id="searchq"></span><span class="n" id="searchn"></span>
      <span class="spacer"></span>
      <span class="n">Enter 跳到第一条 · Esc 关闭</span>
      <button class="iconbtn" id="searchscope">范围：本讲</button>
      <button class="iconbtn" id="searchclose">关闭</button>
    </div>
    <div id="filters"></div>
    <div id="searchresults"></div>
  </div>

  <div id="row">
    <div class="col" id="c1">
      <div class="colhead">主题 Topics<span class="spacer"></span><span class="sub" id="topiccount"></span></div>
      <div class="scroll" id="topiclist"></div>
    </div>
    <div class="grip v" data-target="c1"></div>
    <div class="col" id="c2">
      <div class="videowrap" id="videowrap">
        <video id="v" controls preload="metadata"></video>
        <div id="overlay"><div class="oz"></div><div class="oe"></div></div>
        <div id="vidmsg"></div>
      </div>
      <div class="grip h" data-target="video"></div>
      <div class="timeline" id="timeline">
        <div class="playhead" id="playhead"></div>
        <div class="tllabel" id="tllabel"></div><div class="tlclock" id="tlclock"></div>
      </div>
      <div class="subbar" id="subbar"><div class="z" id="subzh"></div><div class="e" id="suben"></div></div>
      <div class="scroll" id="cuelist"></div>
    </div>
    <div class="grip v" data-target="c3"></div>
    <div class="col" id="c3">
      <div class="tabs" id="tabs">
        <button data-tab="notes" class="on">知识点 Key points</button>
        <button data-tab="extra">补充 Extra</button>
      </div>
      <div class="scroll" id="panel"></div>
    </div>
  </div>

  <div id="deskpanel">
    <div id="deskhead">
      <span class="q">小桌面 · 今天</span>
      <span class="spacer"></span>
      <span class="n" id="deskladder"></span>
      <button class="iconbtn" id="deskclose">关闭 Close</button>
    </div>
    <div id="deskbody"></div>
  </div>

  <div id="readpanel">
    <div id="readbar">
      <button class="iconbtn" id="focusbtn">专注 Focus</button>
      <button class="iconbtn" id="alongbtn">▶ 朗读 Read aloud</button>
      <span class="n" id="readpos"></span>
      <span class="spacer"></span>
      <span class="tset">
        <button id="tfont" title="字号">A</button>
        <button id="tline" title="行距">⇕</button>
        <button id="twide" title="栏宽">↔</button>
        <button id="tface" title="字体">Aa</button>
        <button id="tspace" title="字间距">⋯</button>
        <button id="tpair" title="中英上下 / 左右">⇄</button>
      </span>
      <span class="n">空格 / ↓ 下一段 · Esc 退出</span>
    </div>
    <div id="readbody"></div>
  </div>

  <div class="grip h" data-target="quiz"></div>
  <div id="quiz">
    <div class="colhead">Quiz<span class="spacer"></span>
      <span class="score" id="score"></span>
      <button class="iconbtn" id="quizreset">重做</button>
    </div>
    <div class="scroll" id="quizbody"></div>
  </div>
</div>

<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const V = $('v');
const LS = 'bioapp.';
const store = (k,v)=>{ try{ localStorage.setItem(LS+k,v); }catch(e){} };
const load  = (k,d)=>{ try{ const x=localStorage.getItem(LS+k); return x===null?d:x; }catch(e){ return d; } };
/* Which language leads in topics, notes, quiz and search results.
   Subtitles are unaffected: no cue has an English translation yet. */
let PRIMARY = load('primary','en');
document.documentElement.dataset.primary = PRIMARY;

/* Text-only by default: the video is for looking at a structure being drawn,
   which is a thing you go and ask for, not a thing that should sit there
   playing while you read. `seekShow` is the asking. */
let VIEW = load('view','text');
document.documentElement.dataset.view = VIEW;
const fmt = s=>{ s=Math.max(0,s|0); const h=(s/3600)|0,m=((s%3600)/60)|0,x=s%60;
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); };
const HUES=[205,152,38,275,12,96,320,178,58,240,130,20];
const esc = s => s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

let lang=load('lang','both'), subpos=load('subpos','over'), tab='notes';
let li=0, L=null, curTopic=-1, curCue=-1, cueEls=[], answered={};

/* ---------- theme ---------- */
function setTheme(t){ document.documentElement.dataset.theme=t; store('theme',t);
  [...$('themeseg').children].forEach(b=>b.classList.toggle('on',b.dataset.theme===t)); }
$('themeseg').onclick = e=>{ const b=e.target.closest('button'); if(b) setTheme(b.dataset.theme); };
setTheme(load('theme','dark'));

/* ---------- resizable modules ---------- */
function applySizes(){
  $('c1').style.width=load('c1','290')+'px';
  $('c3').style.width=load('c3','380')+'px';
  $('quiz').style.height=load('quiz','250')+'px';
  const vh=load('video','');
  $('videowrap').style.height = vh?vh+'px':'';
  $('videowrap').style.flex = vh?'none':'';
}
applySizes();
document.querySelectorAll('.grip').forEach(g=>{
  g.addEventListener('mousedown',e=>{
    e.preventDefault();
    const target=g.dataset.target, vertical=g.classList.contains('v');
    const el = target==='video' ? $('videowrap') : $(target);
    const startPos = vertical?e.clientX:e.clientY;
    const r=el.getBoundingClientRect();
    const startSize = vertical?r.width:r.height;
    const sign = (target==='c3'||target==='quiz') ? -1 : 1;
    g.classList.add('dragging');
    const move=ev=>{
      const d=(vertical?ev.clientX:ev.clientY)-startPos;
      const size=Math.max(120,startSize+sign*d);
      if(target==='video'){ el.style.flex='none'; el.style.height=size+'px'; store('video',size|0); }
      else if(vertical){ el.style.width=size+'px'; store(target,size|0); }
      else { el.style.height=size+'px'; store(target,size|0); }
    };
    const up=()=>{ g.classList.remove('dragging');
      window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  });
});
$('reset').onclick=()=>{ ['c1','c3','quiz','video','subsize'].forEach(k=>{
  try{ localStorage.removeItem(LS+k); }catch(e){} }); applySizes(); applySubSize(); };

function applySubSize(){ document.documentElement.style.setProperty('--subsize',load('subsize','22')+'px'); }
const bumpSub=d=>{ store('subsize',Math.max(12,Math.min(48,+load('subsize','22')+d))); applySubSize(); };
$('subplus').onclick=()=>bumpSub(2); $('subminus').onclick=()=>bumpSub(-2); applySubSize();

/* ---------- speech ---------- */
const SPEECH=window.speechSynthesis;
let voices=[], voice=null;
const GB_FEMALE=/(sonia|libby|hazel|susan|mia|google uk english female)/i;
const FEMALE=/(female|zira|aria|jenny|samantha|sonia|libby|hazel|susan|mia|emma|amy)/i;
function rankVoice(v){ if(!/^en/i.test(v.lang)) return -1;
  let s=0; if(/^en-GB/i.test(v.lang)) s+=100;
  if(GB_FEMALE.test(v.name)) s+=40; else if(FEMALE.test(v.name)) s+=20;
  if(/natural|neural/i.test(v.name)) s+=15; if(/google/i.test(v.name)) s+=8; return s; }
function loadVoices(){
  voices=(SPEECH?SPEECH.getVoices():[]).filter(v=>/^en/i.test(v.lang));
  voices.sort((a,b)=>rankVoice(b)-rankVoice(a));
  const sel=$('voicesel'); sel.innerHTML='';
  if(!voices.length){ sel.innerHTML='<option>无可用英文语音</option>'; warnVoice('浏览器没有英文语音'); return; }
  voices.forEach((v,i)=>{ const o=document.createElement('option');
    o.value=i; o.textContent=v.name+'  ('+v.lang+')'; sel.appendChild(o); });
  const saved=load('voice',''); const f=voices.findIndex(v=>v.name===saved);
  const idx=f>=0?f:0; sel.value=idx; voice=voices[idx];
  if(!voices.some(v=>/^en-GB/i.test(v.lang))) warnVoice('没有英式英语语音，现在用的是 '+voice.lang);
  else $('voicewarn').classList.add('hide');
}
function warnVoice(msg){ const w=$('voicewarn'); w.textContent='⚠ '+msg; w.classList.remove('hide');
  w.onclick=()=>alert('要用英式女声，三选一：\n\n1) 用 Microsoft Edge 打开本文件 — 自带 Sonia / Libby（英式女声，接近真人，需联网）\n2) 用 Chrome 打开 — 有 Google UK English Female（需联网）\n3) 安装离线英式语音 — Windows 设置 → 时间和语言 → 语音 → 添加语音 → English (United Kingdom)，会装上 Hazel，完全离线但机械感明显\n\n装好后刷新本页面。'); }
if(SPEECH){ loadVoices(); SPEECH.addEventListener('voiceschanged',loadVoices); }
$('voicesel').onchange=e=>{ voice=voices[+e.target.value]||null; if(voice) store('voice',voice.name); };
$('rate').value=load('rate','0.95');
$('rate').oninput=e=>store('rate',e.target.value);
let sayingEl=null;
function say(text,el){
  if(!SPEECH||!text) return;
  SPEECH.cancel();
  if(sayingEl){ sayingEl.classList.remove('saying'); sayingEl=null; }
  const u=new SpeechSynthesisUtterance(text);
  if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang='en-GB';
  u.rate=parseFloat(load('rate','0.95'));
  if(el){ el.classList.add('saying'); sayingEl=el;
    u.onend=u.onerror=()=>{ el.classList.remove('saying'); if(sayingEl===el) sayingEl=null; }; }
  SPEECH.speak(u);
}
$('saytest').onclick=()=>say('Hemoglobin binds oxygen cooperatively; myoglobin does not.',null);
document.addEventListener('click',e=>{
  const spk=e.target.closest('.spk');
  if(spk){ e.stopPropagation(); e.preventDefault(); say(spk.dataset.say,null); return; }
  const en=e.target.closest('.en, .oe, #suben');
  if(en && !e.target.closest('button') && en.textContent.trim()){ e.stopPropagation(); say(en.textContent,en); }
},true);

/* ---------- lecture picker ---------- */
const sel=$('lecsel');
const lecName = x => PRIMARY==='en' ? `Lecture ${x.no} · ${x.date} · ${x.title_en}`
                                    : `第${x.no}讲 · ${x.date} · ${x.title_zh}`;
function fillPicker(){
  const keep=sel.value; sel.innerHTML='';
  DATA.lectures.forEach((x,i)=>{ const o=document.createElement('option');
    o.value=i; o.textContent=lecName(x); sel.appendChild(o); });
  DATA.pending.forEach(p=>{ const o=document.createElement('option');
    o.disabled=true;
    o.textContent=lecName(p)+(PRIMARY==='en'?'  —— in progress':'  —— 处理中');
    sel.appendChild(o); });
  if(keep!=='') sel.value=keep;
}
fillPicker();
sel.onchange=e=>mount(+e.target.value);

/* ---------- mount a lecture ---------- */
function mount(i){
  li=i; L=DATA.lectures[i]; store('lecture',L.no);
  sel.value=i;
  $('lecen').textContent = PRIMARY==='en' ? L.title_zh : L.title_en;
  curTopic=-1; curCue=-1; answered={};
  V.src=encodeURI(L.video); $('vidmsg').classList.remove('show');

  renderTopics();

  const timeline=$('timeline');
  [...timeline.querySelectorAll('.tlseg')].forEach(x=>x.remove());
  L.topics.forEach((t,k)=>{
    const d=document.createElement('div'); d.className='tlseg';
    d.style.left=(t.start/DUR()*100)+'%'; d.style.width=((t.end-t.start)/DUR()*100)+'%';
    d.style.background='hsl('+HUES[k%HUES.length]+' 60% 45%)';
    d.title=fmt(t.start)+'  '+(PRIMARY==='en'?t.title_en:t.title_zh);
    timeline.insertBefore(d,$('playhead'));
  });

  const cl=$('cuelist'); cl.innerHTML='';
  cueEls=L.cues.map(c=>{
    const el=document.createElement('div'); el.className='cue';
    el.innerHTML='<span class="t"></span><span><span class="z"></span><span class="en"></span></span>';
    el.querySelector('.t').textContent=fmt(c.s);
    el.querySelector('.z').textContent=c.zh;
    el.querySelector('.en').textContent=c.en||'';
    el.onclick=()=>seek(c.s+0.01);
    cl.appendChild(el); return el;
  });
  applyLang(); buildIndex(); renderNotes(); renderQuiz(); renderRead(); tick();
}
function renderTopics(){
  const tl=$('topiclist'); tl.innerHTML='';
  $('topiccount').textContent = L.topics.length + (PRIMARY==='en' ? ' topics' : ' 段');
  L.topics.forEach(t=>{
    const el=document.createElement('div'); el.className='topic';
    el.innerHTML='<div class="t"></div><div class="zh"></div><div class="en"></div>';
    el.querySelector('.t').textContent=fmt(t.start)+' – '+fmt(t.end);
    el.querySelector('.zh').textContent=t.title_zh;
    el.querySelector('.en').textContent=t.title_en;
    el.onclick=()=>seek(t.start);
    tl.appendChild(el);
  });
}
function setPrimary(v){
  PRIMARY=v; store('primary',v);
  document.documentElement.dataset.primary=v;
  [...$('primseg').children].forEach(b=>b.classList.toggle('on',b.dataset.prim===v));
  fillPicker(); sel.value=li;
  $('lecen').textContent = v==='en' ? L.title_zh : L.title_en;
  renderTopics(); renderNotes(); renderQuiz();
  if($('searchpanel').classList.contains('show')) renderHits();
  if($('intpanel').classList.contains('show')){ intChips(); intRender(); }
}
$('primseg').onclick=e=>{ const b=e.target.closest('button'); if(b) setPrimary(b.dataset.prim); };
const DUR = ()=> L.topics.length ? L.topics[L.topics.length-1].end : 1;

/* ---------- language / subtitle position ---------- */
$('langseg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
  lang=b.dataset.lang; store('lang',lang); syncSegs(); applyLang(); };
$('posseg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
  subpos=b.dataset.pos; store('subpos',subpos); syncSegs(); applyLang(); };
function syncSegs(){
  [...$('langseg').children].forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  [...$('posseg').children].forEach(b=>b.classList.toggle('on',b.dataset.pos===subpos));
  [...$('primseg').children].forEach(b=>b.classList.toggle('on',b.dataset.prim===PRIMARY));
}
function applyLang(){
  const zh=lang!=='en', en=lang!=='zh';
  $('overlay').classList.toggle('hide',subpos!=='over');
  $('subbar').classList.toggle('hide',subpos!=='below');
  $('overlay').querySelector('.oz').classList.toggle('hide',!zh);
  $('overlay').querySelector('.oe').classList.toggle('hide',!en);
  $('subzh').classList.toggle('hide',!zh); $('suben').classList.toggle('hide',!en);
  cueEls.forEach(el=>{ el.querySelector('.z').classList.toggle('hide',!zh);
                       el.querySelector('.en').classList.toggle('hide',!en); });
}
syncSegs();

/* ---------- notes ---------- */
$('tabs').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
  tab=b.dataset.tab; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  renderNotes(); };
function renderNotes(){
  const p=$('panel'); p.innerHTML='';
  const t=L&&L.topics[curTopic];
  if(!t){ p.innerHTML='<div class="empty">播放视频，或点击左侧主题。<br>Play the video, or pick a topic.</div>'; return; }
  const head=document.createElement('div'); head.className='pane';
  const h3=document.createElement('h3');
  const hzh=document.createElement('span'); hzh.className='zh'; hzh.textContent=t.title_zh;
  const hen=document.createElement('span'); hen.className='en'; hen.textContent=t.title_en;
  h3.append(hzh,hen);
  const when=document.createElement('div'); when.className='when';
  when.textContent='▶ '+fmt(t.start)+' – '+fmt(t.end); when.onclick=()=>seekShow(t.start);
  head.append(h3,when); p.appendChild(head);
  const body=document.createElement('div'); body.className='pane'; body.style.paddingTop='0';

  const card=(x,isExtra)=>{
    const c=document.createElement('div'); c.className='card'+(isExtra?' extra':'');
    if(isExtra){ const tg=document.createElement('span'); tg.className='tag';
      tg.textContent=x.tag||'课上未展开 · not covered'; c.appendChild(tg); }
    const z=document.createElement('div'); z.className='zh'; z.textContent=x.zh;
    const e2=document.createElement('div'); e2.className='en'; e2.textContent=x.en;
    c.append(z,e2);
    const pb=document.createElement('button'); pb.className='playbtn';
    pb.textContent='▶ '+fmt(t.start);
    pb.title=PRIMARY==='en' ? 'Play the video from this topic'
                            : '从这个主题开始播放视频';
    pb.onclick=ev=>{ ev.stopPropagation(); seekShow(t.start); };
    c.appendChild(pb);
    return c;
  };

  if(VIEW==='text'){
    const cols=document.createElement('div'); cols.className='notecols';
    [[PRIMARY==='en'?'Key points':'知识点', t.points||[], false],
     [PRIMARY==='en'?'Extra':'补充',        t.extra||[],  true]]
    .forEach(([label,items,isExtra])=>{
      const col=document.createElement('div'); col.className='notecol';
      const h=document.createElement('div'); h.className='intsub';
      h.innerHTML=label+'<span>'+items.length+'</span>';
      col.appendChild(h);
      if(!items.length){
        const e=document.createElement('div'); e.className='empty';
        e.textContent=PRIMARY==='en'?'Nothing here for this stretch.':'这一段没有内容。';
        col.appendChild(e);
      } else items.forEach(x=>col.appendChild(card(x,isExtra)));
      cols.appendChild(col);
    });
    p.appendChild(cols);
    return;
  } else {
    const items = tab==='notes' ? (t.points||[]) : (t.extra||[]);
    items.forEach(x=>body.appendChild(card(x, tab==='extra')));
    if(!items.length) body.innerHTML='<div class="empty">这一段没有内容。</div>';
  }
  p.appendChild(body);
}

/* ---------- quiz ---------- */
function renderQuiz(){
  const qb=$('quizbody'); qb.innerHTML='';
  if(!L){ updateScore(); return; }

  /* Quiz-only drills the whole lecture; the docked module stays per-topic so it
     keeps tracking what is on screen. Keys are "topic.question" either way, so
     a score carries across the two views. */
  const pool=[];
  if(VIEW==='quiz'){
    L.topics.forEach((t,ti)=>(t.quiz||[]).forEach((q,qi)=>pool.push([q,ti,qi])));
  } else {
    const t=L.topics[curTopic];
    if(t) (t.quiz||[]).forEach((q,qi)=>pool.push([q,curTopic,qi]));
  }
  if(!pool.length){
    qb.innerHTML='<div class="empty">'
      +(PRIMARY==='en'?'No questions for this stretch.':'这一段没有题目。')+'</div>';
    updateScore(); return;
  }

  pool.forEach(([q,ti,qi],idx)=>{
    const key=ti+'.'+qi;
    const c=document.createElement('div'); c.className='q';
    if(VIEW==='quiz'){
      const from=document.createElement('span'); from.className='qfrom';
      const tp=L.topics[ti];
      from.textContent='▶ '+fmt(tp.start)+'  '
        +(PRIMARY==='en'?tp.title_en:tp.title_zh);
      from.title=PRIMARY==='en'?'Play the video from this topic':'从这个主题开始播放视频';
      from.onclick=()=>seekShow(tp.start);
      c.appendChild(from);
    }
    const qt=document.createElement('div'); qt.className='qt';
    const num=((VIEW==='quiz'?idx:qi)+1)+'. ';
    const qz=document.createElement('span'); qz.className='zh';
    qz.textContent=(PRIMARY==='zh'?num:'')+q.q_zh;
    const qe=document.createElement('span'); qe.className='en';
    qe.textContent=(PRIMARY==='en'?num:'')+q.q_en;
    qt.append(qz,qe);
    const qs=document.createElement('button'); qs.className='spk'; qs.textContent='🔊';
    qs.dataset.say=q.q_en; qt.appendChild(qs);
    c.appendChild(qt);
    const ex=document.createElement('div'); ex.className='explain';
    const exz=document.createElement('div'); exz.className='zh'; exz.textContent=q.explain_zh;
    const exe=document.createElement('span'); exe.className='en'; exe.textContent=q.explain_en;
    ex.append(exz,exe);
    q.options.forEach((o,oi)=>{
      const b=document.createElement('button'); b.className='opt';
      const oz=document.createElement('span'); oz.className='zh'; oz.textContent=o.zh;
      const oe=document.createElement('span'); oe.className='en'; oe.textContent=o.en;
      b.append(oz,oe);
      const os=document.createElement('span'); os.className='spk'; os.textContent='🔊';
      os.dataset.say=o.en; b.appendChild(os);
      b.onclick=()=>{
        if(answered[key]===undefined){
        answered[key]=(oi===q.answer); bump('quiz');
        if(oi===q.answer){ bump('right'); deskStreak++;
          if(deskStreak>=10) award('streak10'); } else deskStreak=0;
      }
        [...c.querySelectorAll('.opt')].forEach((bb,bi)=>{
          bb.classList.toggle('good',bi===q.answer);
          bb.classList.toggle('bad',bi===oi&&oi!==q.answer); });
        ex.classList.add('show'); updateScore();
      };
      c.appendChild(b);
    });
    c.appendChild(ex);
    if(answered[key]!==undefined){
      [...c.querySelectorAll('.opt')].forEach((bb,bi)=>bb.classList.toggle('good',bi===q.answer));
      ex.classList.add('show');
    }
    qb.appendChild(c);
  });
  updateScore();
}
function updateScore(){
  const ks=Object.keys(answered), right=ks.filter(k=>answered[k]).length;
  const total=L?L.topics.reduce((n,t)=>n+(t.quiz||[]).length,0):0;
  $('score').textContent = ks.length ? `已答 ${ks.length}/${total} · 正确 ${right}` : `本讲共 ${total} 题`;
}
$('quizreset').onclick=()=>{ for(const k in answered) delete answered[k]; renderQuiz(); };

const KIND={point:'知识点 Key points',extra:'补充 Extra',topic:'主题 Topics',
            quiz:'Quiz',cue:'原文 Transcript'};
const KIND_ORDER=['point','extra','topic','quiz','cue'];
const CUE_LIMIT=150;
let INDEX=[], ALL_INDEX=null, filter='all', scopeAll=false, lastHits=null, lastTerms=null;
/* ---------- integration: cross-lecture cards and exam-mode quiz ---------- */
const INT = (DATA.integration && DATA.integration.sections) || [];
let intSec = 0;                    /* index into INT, or -1 for exam mode */
let intAnswered = {};              /* "sec.qi" -> true/false              */

/* Deterministic shuffle, so exam mode keeps one order across reloads. */
function seededOrder(n, seed){
  const idx=[...Array(n).keys()];
  let x=(seed>>>0)||1;
  for(let i=n-1;i>0;i--){
    x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0;
    const j=x%(i+1); [idx[i],idx[j]]=[idx[j],idx[i]];
  }
  return idx;
}

function intChips(){
  const box=$('intchips'); box.innerHTML='';
  INT.forEach((sec,i)=>{
    const b=document.createElement('button'); b.className='chip'+(i===intSec?' on':'');
    b.innerHTML=esc(PRIMARY==='en'?sec.title_en:sec.title_zh)
      +'<span class="c">'+sec.cards.length+'·'+sec.quiz.length+'</span>';
    b.onclick=()=>{ intSec=i; store('intsec',i); intChips(); intRender(); };
    box.appendChild(b);
  });
  const total=INT.reduce((a,s)=>a+s.quiz.length,0);
  const b=document.createElement('button'); b.className='chip extra'+(intSec<0?' on':'');
  b.innerHTML=(PRIMARY==='en'?'Exam mode · all questions':'考试模式 · 全部题目')
    +'<span class="c">'+total+'</span>';
  b.onclick=()=>{ intSec=-1; store('intsec',-1); intChips(); intRender(); };
  box.appendChild(b);
}

function intQuizCard(q, key){
  const c=document.createElement('div'); c.className='q';
  const qt=document.createElement('div'); qt.className='qt';
  const qz=document.createElement('span'); qz.className='zh'; qz.textContent=q.q_zh;
  const qe=document.createElement('span'); qe.className='en'; qe.textContent=q.q_en;
  qt.append(qz,qe);
  const qs=document.createElement('button'); qs.className='spk'; qs.textContent='🔊';
  qs.dataset.say=q.q_en; qt.appendChild(qs); c.appendChild(qt);
  const ex=document.createElement('div'); ex.className='explain';
  const exz=document.createElement('div'); exz.className='zh'; exz.textContent=q.explain_zh;
  const exe=document.createElement('span'); exe.className='en'; exe.textContent=q.explain_en;
  ex.append(exz,exe);
  q.options.forEach((o,oi)=>{
    const b=document.createElement('button'); b.className='opt';
    const oz=document.createElement('span'); oz.className='zh'; oz.textContent=o.zh;
    const oe=document.createElement('span'); oe.className='en'; oe.textContent=o.en;
    b.append(oz,oe);
    const os=document.createElement('span'); os.className='spk'; os.textContent='🔊';
    os.dataset.say=o.en; b.appendChild(os);
    b.onclick=()=>{
      if(intAnswered[key]===undefined){
        intAnswered[key]=(oi===q.answer); bump('quiz');
        if(oi===q.answer){ bump('right'); deskStreak++;
          if(deskStreak>=10) award('streak10'); } else deskStreak=0;
      }
      [...c.querySelectorAll('.opt')].forEach((bb,bi)=>{
        bb.classList.toggle('good',bi===q.answer);
        bb.classList.toggle('bad',bi===oi&&oi!==q.answer); });
      ex.classList.add('show'); intScore();
    };
    c.appendChild(b);
  });
  c.appendChild(ex);
  if(q.see){ const sv=document.createElement('span'); sv.className='see';
    sv.textContent='↩ '+q.see; c.appendChild(sv); }
  if(intAnswered[key]!==undefined){
    [...c.querySelectorAll('.opt')].forEach((bb,bi)=>
      bb.classList.toggle('good',bi===q.answer));
    ex.classList.add('show');
  }
  return c;
}

function intScore(){
  const total = intSec<0 ? INT.reduce((a,s)=>a+s.quiz.length,0)
                         : (INT[intSec] ? INT[intSec].quiz.length : 0);
  const keys = Object.keys(intAnswered).filter(k=> intSec<0 || k.startsWith(intSec+'.'));
  const right = keys.filter(k=>intAnswered[k]).length;
  $('intn').textContent = keys.length
    ? (PRIMARY==='en' ? 'answered '+keys.length+'/'+total+' · correct '+right
                      : '已答 '+keys.length+'/'+total+' · 正确 '+right)
    : (PRIMARY==='en' ? total+' questions' : '共 '+total+' 题');
}

function intRender(){
  const body=$('intbody'); body.innerHTML='';
  if(!INT.length){
    body.innerHTML='<div class="empty">尚未生成综合内容。'
      +'<br>No integration material has been built yet.</div>';
    return;
  }

  if(intSec<0){                                  /* exam mode: every question */
    const pool=[];
    INT.forEach((sec,si)=>sec.quiz.forEach((q,qi)=>pool.push({q:q,key:si+'.'+qi})));
    const h=document.createElement('div'); h.className='intsub';
    h.textContent=(PRIMARY==='en'
      ? 'Mixed questions from every section, in a fixed shuffled order'
      : '全部章节混合出题，顺序固定打乱');
    body.appendChild(h);
    const g=document.createElement('div'); g.className='intgrid';
    seededOrder(pool.length, 20260827).forEach(i=>
      g.appendChild(intQuizCard(pool[i].q, pool[i].key)));
    body.appendChild(g);
    intScore(); return;
  }

  const sec=INT[intSec]; if(!sec) return;
  const bl=document.createElement('p'); bl.id='intblurb';
  const be=document.createElement('span'); be.className='en'; be.textContent=sec.blurb_en||'';
  const bz=document.createElement('span'); bz.className='zh'; bz.textContent=sec.blurb_zh||'';
  bl.append(be,bz); body.appendChild(bl);

  const h1=document.createElement('div'); h1.className='intsub';
  h1.innerHTML=(PRIMARY==='en'?'Cards':'知识卡')+'<span>'+sec.cards.length+'</span>';
  body.appendChild(h1);
  const cg=document.createElement('div'); cg.className='intgrid';
  sec.cards.forEach(x=>{
    const c=document.createElement('div'); c.className='card extra';
    if(x.tag){ const tg=document.createElement('span'); tg.className='tag';
      tg.textContent=x.tag; c.appendChild(tg); }
    const z=document.createElement('div'); z.className='zh'; z.textContent=x.zh;
    const e2=document.createElement('div'); e2.className='en'; e2.textContent=x.en;
    c.append(z,e2);
    if(x.see){ const sv=document.createElement('span'); sv.className='see';
      sv.textContent='↩ '+x.see; c.appendChild(sv); }
    cg.appendChild(c);
  });
  body.appendChild(cg);

  const h2=document.createElement('div'); h2.className='intsub';
  h2.innerHTML=(PRIMARY==='en'?'Questions':'题目')+'<span>'+sec.quiz.length+'</span>';
  body.appendChild(h2);
  const qg=document.createElement('div'); qg.className='intgrid';
  sec.quiz.forEach((q,qi)=>qg.appendChild(intQuizCard(q, intSec+'.'+qi)));
  body.appendChild(qg);
  intScore();
}

/* ---------- read-through ---------- */
function renderRead(){
  const box=$('readbody'); box.innerHTML='';
  readUnits=[]; readAt=-1; stopAlong();
  if(!L) return;
  const doc=L.read||null;
  if(!doc||!doc.length){
    box.innerHTML='<div class="readempty">'
      +'This lecture has no integrated read-through yet. It is generated per '
      +'lecture and merged in at build time.<br><br>'
      +'这一讲的整合正文还没有生成。它按讲生成、构建时合并进来。</div>';
    return;
  }
  const d=document.createElement('div'); d.className='readdoc';
  const h1=document.createElement('h1');
  const he=document.createElement('span'); he.className='en'; he.textContent=L.title_en;
  const hz=document.createElement('span'); hz.className='zh'; hz.textContent=L.title_zh;
  h1.append(he,hz); d.appendChild(h1);
  const meta=document.createElement('p'); meta.className='meta';
  meta.textContent=(PRIMARY==='en'
    ? 'Lecture '+L.no+' · '+L.date+' · '+doc.length+' sections'
    : '第'+L.no+'讲 · '+L.date+' · '+doc.length+' 节');
  d.appendChild(meta);

  /* Terms this lecture uses without stopping to explain them. Read first, so
     that nothing in the chapter below is a cold start. Ordered by where the
     reader first meets the word, not by where it eventually gets explained. */
  const gl=L.terms||[];
  if(gl.length){
    const pre=document.createElement('div'); pre.className='pre';
    if(load('prelist','1')==='1') pre.classList.add('listclosed');
    const tg=document.createElement('button'); tg.className='toggle';
    const setLbl=()=>tg.textContent=pre.classList.contains('listclosed')
      ? (PRIMARY==='en'?'full list':'全部词表') : (PRIMARY==='en'?'hide list':'收起词表');
    tg.onclick=()=>{ pre.classList.toggle('listclosed');
      store('prelist', pre.classList.contains('listclosed')?'1':'0'); setLbl(); };
    setLbl(); pre.appendChild(tg);
    const h=document.createElement('h3');
    const he=document.createElement('span'); he.className='en';
    he.textContent='Before you start · '+gl.length+' terms';
    const hz=document.createElement('span'); hz.className='zh';
    hz.textContent='开始之前 · '+gl.length+' 个词';
    h.append(he,hz); pre.appendChild(h);
    const lead=document.createElement('p'); lead.className='lead';
    lead.textContent=PRIMARY==='en'
      ? 'Words this chapter uses without stopping to explain them, in the order you will meet them. One card at a time; the full list is behind the button.'
      : '这一讲用到、但正文里没有停下来解释的词，按你会遇到它们的顺序排。一次一张，全部词表在按钮后面。';
    pre.appendChild(lead);
    /* One card at a time: term on the face, gloss on the back. */
    let fi=Math.min(gl.length-1, Math.max(0, +load('pre.i.'+L.no,'0')||0));
    let shown=false;
    const card=document.createElement('div'); card.className='flash';
    const bar=document.createElement('div'); bar.className='flashbar';
    const prev=document.createElement('button'); prev.className='iconbtn'; prev.textContent='←';
    const next=document.createElement('button'); next.className='iconbtn'; next.textContent='→';
    const cnt=document.createElement('span'); cnt.className='cnt';
    const flip=document.createElement('button'); flip.className='iconbtn';
    const say=document.createElement('button'); say.className='iconbtn'; say.textContent='🔊';
    bar.append(prev,next,cnt);
    const sp2=document.createElement('span'); sp2.className='spacer'; bar.appendChild(sp2);
    bar.append(say,flip);

    const paint=()=>{
      const t=gl[fi]; card.innerHTML='';
      const ft=document.createElement('div'); ft.className='ft'; ft.textContent=t.en;
      card.appendChild(ft);
      if(t.zh){ const fz=document.createElement('div'); fz.className='fz';
        fz.textContent=t.zh; card.appendChild(fz); }
      if(shown){
        const g1=document.createElement('div'); g1.className='fg en';
        g1.textContent=t.gloss_en; card.appendChild(g1);
        if(t.gloss_zh){ const g2=document.createElement('div'); g2.className='fgz zh';
          g2.textContent=t.gloss_zh; card.appendChild(g2); }
      } else {
        const h=document.createElement('div'); h.className='fhint';
        h.textContent=PRIMARY==='en'?'click to see what it means':'点一下看它是什么';
        card.appendChild(h);
      }
      cnt.textContent=(fi+1)+' / '+gl.length;
      flip.textContent=shown?(PRIMARY==='en'?'hide':'盖住')
                            :(PRIMARY==='en'?'show':'翻面');
      say.dataset.say=t.en;
      store('pre.i.'+L.no, fi);
    };
    const go=d=>{ fi=(fi+d+gl.length)%gl.length; shown=false; paint(); };
    card.onclick=()=>{ shown=!shown; paint(); };
    flip.onclick=e=>{ e.stopPropagation(); shown=!shown; paint(); };
    prev.onclick=()=>go(-1);
    next.onclick=()=>go(1);
    pre.append(card,bar);
    paint();

    const g=document.createElement('div'); g.className='pregrid';
    gl.forEach(t=>{
      const el=document.createElement('div'); el.className='pterm';
      const b=document.createElement('b'); b.textContent=t.en;
      el.appendChild(b);
      if(t.zh){ const c=document.createElement('span'); c.className='cn';
        c.textContent='　'+t.zh; el.appendChild(c); }
      const ge=document.createElement('span'); ge.className='g en';
      ge.textContent=t.gloss_en; el.appendChild(ge);
      if(t.gloss_zh){ const gz=document.createElement('span'); gz.className='gz zh';
        gz.textContent=t.gloss_zh; el.appendChild(gz); }
      g.appendChild(el);
    });
    pre.appendChild(g); d.appendChild(pre);
  }

  doc.forEach(sec=>{
    const s2=document.createElement('section'); s2.className='readsec';
    const h2=document.createElement('h2');
    const e=document.createElement('span'); e.className='en'; e.textContent=sec.heading_en||'';
    const z=document.createElement('span'); z.className='zh'; z.textContent=sec.heading_zh||'';
    h2.append(e,z); s2.appendChild(h2);
    /* English then Chinese, paragraph for paragraph, so the two can be read
       against each other; the body-language switch does not reorder these
       because both are wanted here. */
    (sec.en||[]).forEach((para,i)=>{
      const pe=document.createElement('p');
      /* Sentences are spoken and highlighted one at a time, which is far more
         reliable than utterance boundary events: those never fire on some
         network voices, and this way the highlight cannot drift out of sync. */
      splitSentences(para).forEach(t=>{
        const sp=document.createElement('span'); sp.className='sen';
        sp.textContent=t; pe.appendChild(sp);
        pe.appendChild(document.createTextNode(' '));
      });
      const pair=document.createElement('div'); pair.className='pair';
      pair.appendChild(pe);
      const pz=(sec.zh||[])[i];
      let el=null;
      if(pz){ el=document.createElement('p'); el.className='zh';
        el.textContent=pz; pair.appendChild(el); }
      s2.appendChild(pair);
      const k=readUnits.length;
      pe.dataset.unit=k; if(el) el.dataset.unit=k;
      pe.onclick=()=>goUnit(k);
      readUnits.push({sec:s2, en:pe, zh:el, text:para});
    });
    d.appendChild(s2);
  });
  box.appendChild(d);
}

/* ---------- 小桌面 · encouragement ----------
   Praise and care lines are lifted verbatim from the PESB 必背26张 page. They
   were written for this reader; rewriting them in my own register would make

let readUnits=[], readAt=-1, focusOn=false, alongOn=false, alongSeq=0;

function splitSentences(t){
  return t.split(/(?<=[.!?])(?=\s+[A-Z(“"])/)
          .map(x=>x.trim()).filter(Boolean);
}

function goUnit(k, opts){
  if(!readUnits.length) return;
  k=Math.max(0,Math.min(readUnits.length-1,k));
  readUnits.forEach(u=>{ u.en.classList.remove('here');
    if(u.zh) u.zh.classList.remove('here'); u.sec.classList.remove('hereSec'); });
  readAt=k;
  const u=readUnits[k];
  u.en.classList.add('here'); if(u.zh) u.zh.classList.add('here');
  u.sec.classList.add('hereSec');
  $('readpos').textContent=(PRIMARY==='en'
    ? 'paragraph '+(k+1)+' / '+readUnits.length
    : '第 '+(k+1)+' / '+readUnits.length+' 段');
  if(!opts||opts.scroll!==false)
    u.en.scrollIntoView({block:'center',behavior:'smooth'});
  if(k>0) bump('read');
  if(k===readUnits.length-1) award('done1');
}

function setFocus(on){
  focusOn=on;
  const d=$('readbody').querySelector('.readdoc');
  if(d) d.classList.toggle('focus',on);
  $('focusbtn').classList.toggle('on',on);
  if(on && readAt<0) goUnit(0);
  if(!on){ $('readpos').textContent=''; }
}

function stopAlong(){
  alongOn=false; alongSeq++;
  if(SPEECH) try{ SPEECH.cancel(); }catch(e){}
  document.querySelectorAll('.sen.saying').forEach(x=>x.classList.remove('saying'));
  const b=$('alongbtn'); if(b){ b.textContent='▶ 朗读 Read aloud'; b.classList.remove('on'); }
}

/* Speaks the current unit sentence by sentence, then moves to the next one.
   `seq` guards against a stale chain carrying on after Stop or a re-render. */
function alongUnit(k, seq){
  if(seq!==alongSeq || !alongOn || k>=readUnits.length){ if(seq===alongSeq) stopAlong(); return; }
  goUnit(k);
  const spans=[...readUnits[k].en.querySelectorAll('.sen')];
  let i=0;
  const next=()=>{
    if(seq!==alongSeq || !alongOn) return;
    if(i>0) spans[i-1].classList.remove('saying');
    if(i>=spans.length){ alongUnit(k+1,seq); return; }
    const sp=spans[i++]; sp.classList.add('saying'); bump('aloud');
    if(!SPEECH){ setTimeout(next, 900); return; }
    const u=new SpeechSynthesisUtterance(sp.textContent);
    if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang='en-GB';
    u.rate=parseFloat(load('rate','0.95'));
    u.onend=next; u.onerror=next;
    SPEECH.speak(u);
  };
  next();
}

/* Reading comfort. Each control cycles a short list of sane values rather
   than offering a slider, so there is nothing to fiddle with and no way to
   land on a setting that is simply bad. */
const TSET={
  font:  {key:'rf',   vals:['15px','16px','17px','19px','21px'],      def:1},
  line:  {key:'rlh',  vals:['1.7','1.95','2.2','2.5'],               def:1},
  wide:  {key:'rw',   vals:['52ch','62ch','72ch','84ch','100ch','none'], def:1},
  space: {key:'rls',  vals:['0em','0.02em','0.05em'],                def:0},
  face:  {key:'rfam', vals:['inherit','Georgia,\'Times New Roman\',serif',
                            'Verdana,Tahoma,sans-serif'],            def:0}
};
function applyType(){
  const d=document.documentElement;
  Object.values(TSET).forEach(c=>{
    const i=Math.min(c.vals.length-1, Math.max(0, +load('t.'+c.key, c.def)||0));
    d.style.setProperty('--'+c.key, c.vals[i]);
  });
}
function cycleType(name){
  const c=TSET[name];
  /* The brackets matter: + binds tighter than ||, so `+load(...)||0 + 1` reads
     as `(+load(...)) || 1` and the index never moves. */
  const cur=+load('t.'+c.key, c.def) || 0;
  store('t.'+c.key, (cur + 1) % c.vals.length);
  applyType();
}
applyType();
$('tfont').onclick =()=>cycleType('font');
$('tline').onclick =()=>cycleType('line');
$('twide').onclick =()=>cycleType('wide');
$('tspace').onclick=()=>cycleType('space');

document.addEventListener('keydown',e=>{
  if(VIEW!=='read'||!focusOn) return;
  if(e.target.closest('input,select,textarea,button')) return;
  if(e.key===' '||e.key==='ArrowDown'||e.key==='PageDown'){
    e.preventDefault();
    if(!V.paused) V.pause();        /* belt and braces: never start playing here */
    stopAlong(); goUnit(readAt+1); }
  else if(e.key==='ArrowUp'||e.key==='PageUp'){
    e.preventDefault(); stopAlong(); goUnit(readAt-1); }
  else if(e.key==='Escape'){ stopAlong(); setFocus(false); }
});

function indexOf(lec,lecIdx){
  const out=[];
  lec.topics.forEach((t,ti)=>{
    out.push({kind:'topic',li:lecIdx,ti,time:t.start,zh:t.title_zh,en:t.title_en});
    (t.points||[]).forEach(p=>out.push({kind:'point',li:lecIdx,ti,time:t.start,zh:p.zh,en:p.en}));
    (t.extra||[]).forEach(x=>out.push({kind:'extra',li:lecIdx,ti,time:t.start,zh:x.zh,en:x.en,tag:x.tag}));
    (t.quiz||[]).forEach(q=>out.push({kind:'quiz',li:lecIdx,ti,time:t.start,zh:q.q_zh,en:q.q_en}));
  });
  lec.cues.forEach(c=>out.push({kind:'cue',li:lecIdx,ti:-1,time:c.s,zh:c.zh,en:c.en}));
  return out;
}

function allIndex(){ if(!ALL_INDEX) ALL_INDEX=DATA.lectures.flatMap((x,i)=>indexOf(x,i)); return ALL_INDEX; }
function mark(s,terms){
  if(!s) return '';
  let out=esc(s);
  terms.forEach(t=>{ const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    out=out.replace(re,m=>''+m+''); });
  return out.replace(//g,'<mark>').replace(//g,'</mark>');
}
function runSearch(raw){
  const q=raw.trim(), panel=$('searchpanel');
  if(!q){ panel.classList.remove('show'); return; }
  const terms=q.split(/\s+/).filter(Boolean), low=terms.map(t=>t.toLowerCase());
  const pool = scopeAll ? allIndex() : INDEX;
  lastHits = pool.filter(r=>{
    const hay=((r.zh||'')+' '+(r.en||'')+' '+(r.tag||'')).toLowerCase();
    return low.every(t=>hay.includes(t));
  });
  lastTerms=terms;
  $('searchq').textContent='“'+q+'”';
  renderHits(); panel.classList.add('show');
}
function renderHits(){
  const hits=lastHits||[], terms=lastTerms||[];
  const byKind={}; hits.forEach(h=>(byKind[h.kind]=byKind[h.kind]||[]).push(h));
  if(filter!=='all' && !(byKind[filter]||[]).length) filter='all';
  const curated=hits.length-(byKind.cue||[]).length;
  $('searchn').textContent = hits.length
    ? `${hits.length} 条 · 整理过的 ${curated} 条，原文 ${(byKind.cue||[]).length} 条`
    : '没有找到';
  const f=$('filters'); f.innerHTML='';
  const mk=(key,label,n)=>{ const b=document.createElement('button');
    b.className='chip'+(key==='extra'?' extra':'')+(filter===key?' on':'');
    b.innerHTML=label+'<span class="c">'+n+'</span>';
    b.disabled = n===0 && key!=='all';
    b.onclick=()=>{ filter=key; renderHits(); }; f.appendChild(b); };
  mk('all','全部 All',hits.length);
  KIND_ORDER.forEach(k=>mk(k,KIND[k],(byKind[k]||[]).length));
  const box=$('searchresults'); box.innerHTML='';
  if(!hits.length){ box.innerHTML='<div class="note">试试更短的词，或换中文 / 英文写法。</div>'; return; }
  KIND_ORDER.forEach(k=>{
    if(filter!=='all'&&filter!==k) return;
    const rows=byKind[k]; if(!rows||!rows.length) return;
    const h=document.createElement('div'); h.className='rgroup';
    h.innerHTML='<span>'+KIND[k]+'</span><span class="c">'+rows.length+'</span>';

      el.innerHTML='<div class="t">'+(scopeAll?('L'+lec.no+' '):'')+fmt(r.time)+'</div>'+

        (where?'<div class="where">'+esc(where)+'</div>':'')+'</div>';
      el.onclick=()=>{ if(r.li!==li) mount(r.li); seek(r.time); $('searchpanel').classList.remove('show'); };
      box.appendChild(el);

}

/* ---------- sync ---------- */
function seek(t){ V.currentTime=t; tick(); }

/* Navigation (clicking a topic, a search hit) uses seek and leaves the view
   alone. Only an explicit play button uses seekShow, which brings the video
   back and starts it — the click is a user gesture, so play() is allowed. */
function seekShow(t){
  if(VIEW!=='video') setView('video');
  V.currentTime=t; tick();
  const pr=V.play(); if(pr&&pr.catch) pr.catch(()=>{});
}
function setView(v){
  VIEW=v; store('view',v);
  document.documentElement.dataset.view=v;
  [...$('viewseg').children].forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  /* Any view but the video one: stop it, and take the focus off it so the
     space bar belongs to the reader again. */
  if(v!=='video'){ if(!V.paused) V.pause();
    if(document.activeElement===V) V.blur(); }
  if(typeof L!=='undefined'&&L){ renderNotes(); renderQuiz(); renderRead(); }
}
$('viewseg').onclick=e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.view); };
setView(VIEW);
function findCue(t){ let lo=0,hi=L.cues.length-1,r=-1;
  while(lo<=hi){ const m=(lo+hi)>>1; if(L.cues[m].s<=t){ r=m; lo=m+1; } else hi=m-1; }
  return (r>=0&&t<=L.cues[r].e+0.4)?r:-1; }
function findTopic(t){ for(let i=0;i<L.topics.length;i++)
  if(t>=L.topics[i].start&&t<L.topics[i].end) return i;
  return L.topics.length-1; }
function tick(){
  if(!L) return;
  const t=V.currentTime;
  $('playhead').style.left=(t/DUR()*100)+'%';
  $('tlclock').textContent=fmt(t)+' / '+fmt(DUR());
  const ti=findTopic(t);
  if(ti!==curTopic){
    curTopic=ti;
    [...$('topiclist').children].forEach((el,i)=>el.classList.toggle('on',i===ti));
    [...$('timeline').querySelectorAll('.tlseg')].forEach((el,i)=>el.classList.toggle('on',i===ti));
    $('tllabel').textContent = ti>=0
      ? (PRIMARY==='en' ? L.topics[ti].title_en : L.topics[ti].title_zh) : '';
    const a=$('topiclist').children[ti]; if(a) a.scrollIntoView({block:'nearest'});
    renderNotes(); renderQuiz();
  }
  const ci=findCue(t);
  if(ci!==curCue){
    curCue=ci;
    const c=ci>=0?L.cues[ci]:null;
    $('overlay').querySelector('.oz').textContent=c?c.zh:'';
    $('overlay').querySelector('.oe').textContent=c?(c.en||''):'';
    $('subzh').textContent=c?c.zh:''; $('suben').textContent=c?(c.en||''):'';
    cueEls.forEach((el,i)=>el.classList.toggle('on',i===ci));
    if(ci>=0) cueEls[ci].scrollIntoView({block:'center'});
  }
}
V.addEventListener('timeupdate',tick);
V.addEventListener('seeked',tick);
V.addEventListener('error',()=>{
  $('vidmsg').textContent='找不到视频：'+L.video+
    '\n\n它必须相对于本文件所在的文件夹存在。第 1 讲的视频在另一个目录，'+
    '若浏览器拒绝跨目录读取本地文件，把该 mp4 复制到本文件夹即可。';
  $('vidmsg').classList.add('show');
});

/* ---------- timeline drag ---------- */
const timeAt=e=>{ const r=$('timeline').getBoundingClientRect();
  return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*DUR(); };
let dragTL=false;
$('timeline').addEventListener('mousedown',e=>{ dragTL=true; seek(timeAt(e)); });
window.addEventListener('mousemove',e=>{ if(dragTL) seek(timeAt(e)); });
window.addEventListener('mouseup',()=>dragTL=false);

document.addEventListener('keydown',e=>{
  if(e.key==='/'&&e.target.id!=='searchbox'){ e.preventDefault(); $('searchbox').focus(); $('searchbox').select(); return; }
  if((e.key==='k'||e.key==='K')&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); $('searchbox').focus(); $('searchbox').select(); return; }
  if(e.key==='Escape'&&$('intpanel').classList.contains('show')){
    $('intpanel').classList.remove('show'); return; }
  if(e.key==='Escape'&&$('searchpanel').classList.contains('show')){
    $('searchbox').value=''; $('searchpanel').classList.remove('show'); return; }
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); V.paused?V.play():V.pause(); }
  if(e.code==='ArrowLeft')  V.currentTime-=e.shiftKey?30:5;
  if(e.code==='ArrowRight') V.currentTime+=e.shiftKey?30:5;
});

/* ---------- go ---------- */
const wantNo=+load('lecture',DATA.lectures[0].no);
const startAt=Math.max(0,DATA.lectures.findIndex(x=>x.no===wantNo));
mount(startAt);
</script>
